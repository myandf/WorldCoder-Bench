<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tilt-Shift Miniature Three.js Scene</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 260px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      z-index: 10;
      pointer-events: none;
      box-sizing: border-box;
    }
    #hud .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    #hud .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #ddd;
      opacity: 0.9;
    }
    #focus-band {
      position: absolute;
      left: 0;
      width: 100%;
      border-top: 2px dashed rgba(255,255,255,0.5);
      border-bottom: 2px dashed rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.04);
      pointer-events: none;
      z-index: 5;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="focus-band"></div>
    <div id="hud">
      <div class="title">Tilt-Shift Miniature</div>
      <div>Focus Y: <span id="hud-focusY">0.50</span></div>
      <div>Band Width: <span id="hud-bandWidth">0.15</span></div>
      <div>Blur Amount: <span id="hud-blurAmount">4.00</span></div>
      <div>Saturation: <span id="hud-saturation">1.30</span></div>
      <div>Effect: <span id="hud-enabled">ON</span></div>
      <div>Preset: <span id="hud-preset">0</span></div>
      <div class="hint">Shift + Drag: Focus band<br>W/S: Band, Q/E: Blur, R/F: Sat, T: Toggle, P: Preset, X: Reset</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';

    const app = document.getElementById('app');
    const focusBandEl = document.getElementById('focus-band');

    const hud = {
      focusY: document.getElementById('hud-focusY'),
      bandWidth: document.getElementById('hud-bandWidth'),
      blurAmount: document.getElementById('hud-blurAmount'),
      saturation: document.getElementById('hud-saturation'),
      enabled: document.getElementById('hud-enabled'),
      preset: document.getElementById('hud-preset'),
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfd8e3);
    scene.fog = new THREE.Fog(0xcfd8e3, 12, 28);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 5);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x888888 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    const buildings = [];
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const mutedPalette = [
      0x8c7f70, 0x7d8a91, 0x8b8f7a, 0x7a6f84, 0x8a7670,
      0x6f8680, 0x90887c, 0x76808f, 0x887b88, 0x7d856f
    ];

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    for (let i = 0; i < 20; i++) {
      const w = rand(0.3, 1.0);
      const h = rand(0.5, 3.0);
      const d = rand(0.3, 1.0);
      const color = mutedPalette[Math.floor(Math.random() * mutedPalette.length)];

      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.05 });
      const mesh = new THREE.Mesh(boxGeo, mat);
      mesh.scale.set(w, h, d);
      mesh.position.set(rand(-8, 8), h * 0.5, rand(-8, 8));
      scene.add(mesh);
      buildings.push(mesh);
    }

    let modelLoaded = false;
    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      'RobotExpressive.glb',
      (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 0, 0);
        model.scale.setScalar(1.5);
        scene.add(model);
        modelLoaded = true;
      },
      undefined,
      () => {
        modelLoaded = false;
        const fallback = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.35, 1.1, 6, 12),
          new THREE.MeshStandardMaterial({ color: 0xd6c0a8, roughness: 0.8 })
        );
        fallback.position.set(0, 1.0, 0);
        fallback.scale.setScalar(1.5);
        scene.add(fallback);
      }
    );

    const renderPass = new RenderPass(scene, camera);

    const tiltShiftBlurShader = {
      uniforms: {
        tDiffuse: { value: null },
        resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        direction: { value: new THREE.Vector2(1, 0) },
        focusY: { value: 0.5 },
        bandWidth: { value: 0.15 },
        blurAmount: { value: 4.0 },
        enabled: { value: 1.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2 resolution;
        uniform vec2 direction;
        uniform float focusY;
        uniform float bandWidth;
        uniform float blurAmount;
        uniform float enabled;
        varying vec2 vUv;

        float focusMask(float y, float fy, float bw) {
          float d = abs(y - fy);
          float edge = bw * 0.5;
          if (d <= edge) return 0.0;
          float outer = max(0.0001, 0.5 - edge);
          return clamp((d - edge) / outer, 0.0, 1.0);
        }

        void main() {
          vec4 base = texture2D(tDiffuse, vUv);
          if (enabled < 0.5) {
            gl_FragColor = base;
            return;
          }

          float mask = focusMask(vUv.y, focusY, bandWidth);
          float radius = blurAmount * mask;
          vec2 texel = 1.0 / resolution;
          vec2 off = direction * texel * radius;

          vec4 color = vec4(0.0);
          color += texture2D(tDiffuse, vUv - off * 4.0) * 0.05;
          color += texture2D(tDiffuse, vUv - off * 3.0) * 0.09;
          color += texture2D(tDiffuse, vUv - off * 2.0) * 0.12;
          color += texture2D(tDiffuse, vUv - off * 1.0) * 0.15;
          color += texture2D(tDiffuse, vUv)             * 0.18;
          color += texture2D(tDiffuse, vUv + off * 1.0) * 0.15;
          color += texture2D(tDiffuse, vUv + off * 2.0) * 0.12;
          color += texture2D(tDiffuse, vUv + off * 3.0) * 0.09;
          color += texture2D(tDiffuse, vUv + off * 4.0) * 0.05;

          gl_FragColor = mix(base, color, mask);
        }
      `
    };

    const saturationShader = {
      uniforms: {
        tDiffuse: { value: null },
        saturationBoost: { value: 1.3 },
        enabled: { value: 1.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float saturationBoost;
        uniform float enabled;
        varying vec2 vUv;

        vec3 saturateColor(vec3 color, float sat) {
          float luma = dot(color, vec3(0.299, 0.587, 0.114));
          return mix(vec3(luma), color, sat);
        }

        void main() {
          vec4 tex = texture2D(tDiffuse, vUv);
          if (enabled < 0.5) {
            gl_FragColor = tex;
            return;
          }
          tex.rgb = saturateColor(tex.rgb, saturationBoost);
          gl_FragColor = tex;
        }
      `
    };

    const hBlurPass = new ShaderPass(tiltShiftBlurShader);
    hBlurPass.uniforms.direction.value.set(1, 0);

    const vBlurPass = new ShaderPass(tiltShiftBlurShader);
    vBlurPass.uniforms.direction.value.set(0, 1);

    const saturationPass = new ShaderPass(saturationShader);

    const composer = new EffectComposer(renderer);
    composer.addPass(renderPass);
    composer.addPass(hBlurPass);
    composer.addPass(vBlurPass);
    composer.addPass(saturationPass);

    const presets = [
      { focusY: 0.5, bandWidth: 0.15, blurAmount: 4.0, saturationBoost: 1.3 },
      { focusY: 0.4, bandWidth: 0.05, blurAmount: 7.0, saturationBoost: 1.8 },
      { focusY: 0.6, bandWidth: 0.35, blurAmount: 2.0, saturationBoost: 1.1 }
    ];

    const params = {
      focusY: 0.5,
      bandWidth: 0.15,
      blurAmount: 4.0,
      saturationBoost: 1.3,
      effectEnabled: true,
      currentPreset: 0
    };

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function applyParamsToPasses() {
      const enabledVal = params.effectEnabled ? 1.0 : 0.0;

      hBlurPass.uniforms.focusY.value = params.focusY;
      hBlurPass.uniforms.bandWidth.value = params.bandWidth;
      hBlurPass.uniforms.blurAmount.value = params.blurAmount;
      hBlurPass.uniforms.enabled.value = enabledVal;

      vBlurPass.uniforms.focusY.value = params.focusY;
      vBlurPass.uniforms.bandWidth.value = params.bandWidth;
      vBlurPass.uniforms.blurAmount.value = params.blurAmount;
      vBlurPass.uniforms.enabled.value = enabledVal;

      saturationPass.uniforms.saturationBoost.value = params.saturationBoost;
      saturationPass.uniforms.enabled.value = enabledVal;
    }

    function applyPreset(index) {
      const p = presets[index];
      params.focusY = p.focusY;
      params.bandWidth = p.bandWidth;
      params.blurAmount = p.blurAmount;
      params.saturationBoost = p.saturationBoost;
      params.currentPreset = index;
      applyParamsToPasses();
    }

    applyPreset(0);

    let shiftDragging = false;
    let lastMouseY = 0;

    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 0 && e.shiftKey) {
        shiftDragging = true;
        lastMouseY = e.clientY;
      }
    });

    window.addEventListener('mouseup', () => {
      shiftDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!shiftDragging) return;
      const dy = e.clientY - lastMouseY;
      lastMouseY = e.clientY;
      params.focusY = clamp(params.focusY - dy * 0.0015, 0.05, 0.95);
      applyParamsToPasses();
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'w') {
        params.bandWidth = clamp(params.bandWidth + 0.02, 0.02, 0.5);
      } else if (key === 's') {
        params.bandWidth = clamp(params.bandWidth - 0.02, 0.02, 0.5);
      } else if (key === 'q') {
        params.blurAmount = clamp(params.blurAmount - 0.5, 0.5, 10.0);
      } else if (key === 'e') {
        params.blurAmount = clamp(params.blurAmount + 0.5, 0.5, 10.0);
      } else if (key === 'r') {
        params.saturationBoost = clamp(params.saturationBoost + 0.1, 0.5, 2.5);
      } else if (key === 'f') {
        params.saturationBoost = clamp(params.saturationBoost - 0.1, 0.5, 2.5);
      } else if (key === 't') {
        params.effectEnabled = !params.effectEnabled;
      } else if (key === 'p') {
        const next = (params.currentPreset + 1) % 3;
        applyPreset(next);
        return;
      } else if (key === 'x') {
        applyPreset(0);
        params.effectEnabled = true;
      } else {
        return;
      }

      applyParamsToPasses();
    });

    function updateHUD() {
      hud.focusY.textContent = params.focusY.toFixed(2);
      hud.bandWidth.textContent = params.bandWidth.toFixed(2);
      hud.blurAmount.textContent = params.blurAmount.toFixed(2);
      hud.saturation.textContent = params.saturationBoost.toFixed(2);
      hud.enabled.textContent = params.effectEnabled ? 'ON' : 'OFF';
      hud.preset.textContent = String(params.currentPreset);

      const h = window.innerHeight;
      const centerPx = (1.0 - params.focusY) * h;
      const bandPx = params.bandWidth * h;
      focusBandEl.style.top = `${centerPx - bandPx / 2}px`;
      focusBandEl.style.height = `${bandPx}px`;
      focusBandEl.style.display = params.effectEnabled ? 'block' : 'none';
    }

    let frameCount = 0;

    window.__3D_STATE__ = {
      focusY: params.focusY,
      bandWidth: params.bandWidth,
      blurAmount: params.blurAmount,
      saturationBoost: params.saturationBoost,
      effectEnabled: params.effectEnabled,
      currentPreset: params.currentPreset,
      modelLoaded: modelLoaded,
      buildingCount: buildings.length,
      composerPassCount: composer.passes.length,
      cameraPosition: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
      frameCount: frameCount
    };

    function updateState() {
      window.__3D_STATE__ = {
        focusY: params.focusY,
        bandWidth: params.bandWidth,
        blurAmount: params.blurAmount,
        saturationBoost: params.saturationBoost,
        effectEnabled: params.effectEnabled,
        currentPreset: params.currentPreset,
        modelLoaded: modelLoaded,
        buildingCount: buildings.length,
        composerPassCount: composer.passes.length,
        cameraPosition: {
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z
        },
        frameCount: frameCount
      };
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      hBlurPass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
      vBlurPass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', onResize);
    onResize();

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;
      controls.update();
      updateHUD();
      updateState();
      composer.render();
    }

    animate();
  </script>
</body>
</html>
