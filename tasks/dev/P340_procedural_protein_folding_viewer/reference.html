<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protein Folding Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }
    canvas {
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 14px;
      background: rgba(10, 10, 26, 0.78);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      z-index: 10;
      min-width: 250px;
      backdrop-filter: blur(4px);
    }
    #ui-panel h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }
    #ui-panel .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    #ui-panel button {
      background: #1d2340;
      color: white;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
    }
    #ui-panel button:hover {
      background: #2a3361;
    }
    #ui-panel button:active {
      transform: scale(0.98);
    }
    #ui-panel button.active {
      background: #4a5bdc;
      border-color: rgba(255,255,255,0.5);
    }
    #info-display {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      color: #d8ddff;
    }
    #hint {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="ui-panel">
    <h3>Protein Folding Viewer</h3>
    <div class="btn-row">
      <button id="btn-unfolded">Unfolded</button>
      <button id="btn-helix">Alpha Helix</button>
      <button id="btn-sheet">Beta Sheet</button>
    </div>
    <div class="btn-row">
      <button id="btn-spin">Spin</button>
      <button id="btn-highlight">Highlight Hydrophobic</button>
    </div>
    <span id="info-display">Conformation: Unfolded | Residues: 20</span>
    <div id="hint">Keys: 1 Unfolded, 2 Helix, 3 Sheet, S Spin, H Highlight</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 25);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(10, 10, 10);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight2.position.set(-10, -10, -10);
    scene.add(dirLight2);

    const proteinGroup = new THREE.Group();
    scene.add(proteinGroup);

    const residueCount = 20;
    const totalBonds = residueCount - 1;
    const residueRadius = 0.4;
    const bondRadius = 0.08;

    const typePattern = ['hydrophobic', 'hydrophilic', 'neutral'];
    const typeColors = {
      hydrophobic: 0xff4444,
      hydrophilic: 0x4444ff,
      neutral: 0x44ff44
    };

    const residueTypes = Array.from({ length: residueCount }, (_, i) => typePattern[i % typePattern.length]);

    const residues = [];
    const residueMaterials = [];
    const bonds = [];

    const sphereGeometry = new THREE.SphereGeometry(residueRadius, 24, 24);
    const bondGeometry = new THREE.CylinderGeometry(bondRadius, bondRadius, 1, 16);

    function getUnfoldedPositions() {
      const positions = [];
      const spacing = 1.5;
      const offset = ((residueCount - 1) * spacing) / 2;
      for (let i = 0; i < residueCount; i++) {
        positions.push(new THREE.Vector3(i * spacing - offset, 0, 0));
      }
      return positions;
    }

    function getHelixPositions() {
      const positions = [];
      for (let i = 0; i < residueCount; i++) {
        positions.push(new THREE.Vector3(
          2 * Math.cos(i * 0.9),
          i * 0.8 - 8,
          2 * Math.sin(i * 0.9)
        ));
      }
      return positions;
    }

    function getSheetPositions() {
      const positions = [];
      for (let i = 0; i < residueCount; i++) {
        const row = Math.floor(i / 5);
        const col = i % 5;
        const x = row % 2 === 0 ? col * 2 - 4 : (4 - col) * 2 - 4;
        const z = row * 3 - 3;
        const y = Math.sin(i * 0.5) * 0.5;
        positions.push(new THREE.Vector3(x, y, z));
      }
      return positions;
    }

    const conformationTargets = {
      unfolded: getUnfoldedPositions(),
      helix: getHelixPositions(),
      sheet: getSheetPositions()
    };

    let currentPositions = conformationTargets.unfolded.map(v => v.clone());
    let animationStartPositions = currentPositions.map(v => v.clone());
    let animationTargetPositions = currentPositions.map(v => v.clone());
    let animationStartTime = 0;
    const animationDuration = 1500;

    function createResidues() {
      for (let i = 0; i < residueCount; i++) {
        const type = residueTypes[i];
        const material = new THREE.MeshPhongMaterial({
          color: typeColors[type],
          transparent: true,
          opacity: 1
        });
        const mesh = new THREE.Mesh(sphereGeometry, material);
        mesh.position.copy(currentPositions[i]);
        mesh.userData = { index: i, type };
        proteinGroup.add(mesh);
        residues.push(mesh);
        residueMaterials.push(material);
      }
    }

    function createBonds() {
      for (let i = 0; i < totalBonds; i++) {
        const material = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const bond = new THREE.Mesh(bondGeometry, material);
        proteinGroup.add(bond);
        bonds.push(bond);
      }
      updateBonds();
    }

    function updateBondBetween(mesh, start, end) {
      const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();

      mesh.position.copy(midpoint);
      mesh.scale.set(1, length, 1);

      const up = new THREE.Vector3(0, 1, 0);
      mesh.quaternion.setFromUnitVectors(up, direction.clone().normalize());
    }

    function updateBonds() {
      for (let i = 0; i < bonds.length; i++) {
        updateBondBetween(bonds[i], residues[i].position, residues[i + 1].position);
      }
    }

    createResidues();
    createBonds();

    const infoDisplay = document.getElementById('info-display');
    const btnUnfolded = document.getElementById('btn-unfolded');
    const btnHelix = document.getElementById('btn-helix');
    const btnSheet = document.getElementById('btn-sheet');
    const btnSpin = document.getElementById('btn-spin');
    const btnHighlight = document.getElementById('btn-highlight');

    window.__3D_STATE__ = {
      conformation: 'unfolded',
      residueCount: residueCount,
      isAnimating: false,
      spinEnabled: false,
      highlightEnabled: false,
      residuePositions: currentPositions.map(v => ({ x: v.x, y: v.y, z: v.z })),
      residueTypes: [...residueTypes],
      totalBonds: totalBonds,
      frameCount: 0,
      proteinRotationY: proteinGroup.rotation.y
    };

    function prettyConformationName(name) {
      if (name === 'unfolded') return 'Unfolded';
      if (name === 'helix') return 'Alpha Helix';
      if (name === 'sheet') return 'Beta Sheet';
      return name;
    }

    function updateInfo() {
      infoDisplay.textContent = `Conformation: ${prettyConformationName(window.__3D_STATE__.conformation)} | Residues: ${residueCount}`;
      btnUnfolded.classList.toggle('active', window.__3D_STATE__.conformation === 'unfolded');
      btnHelix.classList.toggle('active', window.__3D_STATE__.conformation === 'helix');
      btnSheet.classList.toggle('active', window.__3D_STATE__.conformation === 'sheet');
      btnSpin.classList.toggle('active', window.__3D_STATE__.spinEnabled);
      btnHighlight.classList.toggle('active', window.__3D_STATE__.highlightEnabled);
    }

    function applyHighlight() {
      const enabled = window.__3D_STATE__.highlightEnabled;
      for (let i = 0; i < residues.length; i++) {
        const residue = residues[i];
        const type = residue.userData.type;
        const material = residue.material;
        if (!enabled) {
          residue.scale.setScalar(1);
          material.opacity = 1;
        } else {
          if (type === 'hydrophobic') {
            residue.scale.setScalar(1.8);
            material.opacity = 1;
          } else {
            residue.scale.setScalar(1);
            material.opacity = 0.3;
          }
        }
      }
    }

    function setConformation(name) {
      const target = conformationTargets[name];
      if (!target) return;

      animationStartPositions = residues.map(r => r.position.clone());
      animationTargetPositions = target.map(v => v.clone());
      animationStartTime = performance.now();

      window.__3D_STATE__.conformation = name;
      window.__3D_STATE__.isAnimating = true;
      updateInfo();
    }

    function toggleSpin() {
      window.__3D_STATE__.spinEnabled = !window.__3D_STATE__.spinEnabled;
      updateInfo();
    }

    function toggleHighlight() {
      window.__3D_STATE__.highlightEnabled = !window.__3D_STATE__.highlightEnabled;
      applyHighlight();
      updateInfo();
    }

    btnUnfolded.addEventListener('click', () => setConformation('unfolded'));
    btnHelix.addEventListener('click', () => setConformation('helix'));
    btnSheet.addEventListener('click', () => setConformation('sheet'));
    btnSpin.addEventListener('click', toggleSpin);
    btnHighlight.addEventListener('click', toggleHighlight);

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === '1') setConformation('unfolded');
      else if (key === '2') setConformation('helix');
      else if (key === '3') setConformation('sheet');
      else if (key === 's') toggleSpin();
      else if (key === 'h') toggleHighlight();
    });

    function updateResidueStatePositions() {
      window.__3D_STATE__.residuePositions = residues.map(r => ({
        x: r.position.x,
        y: r.position.y,
        z: r.position.z
      }));
    }

    function animate(now) {
      requestAnimationFrame(animate);
      window.__3D_STATE__.frameCount++;

      if (window.__3D_STATE__.isAnimating) {
        const t = Math.min((now - animationStartTime) / animationDuration, 1);
        for (let i = 0; i < residues.length; i++) {
          residues[i].position.lerpVectors(animationStartPositions[i], animationTargetPositions[i], t);
        }
        if (t >= 1) {
          window.__3D_STATE__.isAnimating = false;
        }
        updateBonds();
      }

      if (window.__3D_STATE__.spinEnabled) {
        proteinGroup.rotation.y += 0.01;
      }

      controls.update();
      updateResidueStatePositions();
      window.__3D_STATE__.proteinRotationY = proteinGroup.rotation.y;

      renderer.render(scene, camera);
    }

    updateInfo();
    applyHighlight();
    updateResidueStatePositions();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
