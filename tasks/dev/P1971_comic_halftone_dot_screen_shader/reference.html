<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Halftone Comic Shader</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.88);
      color: #111;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-line;
      pointer-events: none;
      z-index: 10;
      min-width: 220px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const app = document.getElementById('app');
    const hud = document.getElementById('hud');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const torusKnot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1, 0.35, 160, 24),
      new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.45, metalness: 0.15 })
    );
    scene.add(torusKnot);

    const icosahedron = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.6, 0),
      new THREE.MeshStandardMaterial({ color: 0x2255dd, roughness: 0.4, metalness: 0.1 })
    );
    scene.add(icosahedron);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({ color: 0x2f9d46, roughness: 0.9, metalness: 0.0 })
    );
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.y = -1.5;
    scene.add(ground);

    const rtWidth = () => Math.max(1, Math.floor(window.innerWidth * renderer.getPixelRatio()));
    const rtHeight = () => Math.max(1, Math.floor(window.innerHeight * renderer.getPixelRatio()));

    const renderTarget = new THREE.WebGLRenderTarget(rtWidth(), rtHeight(), {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      depthBuffer: true,
      stencilBuffer: false
    });
    renderTarget.texture.colorSpace = THREE.SRGBColorSpace;

    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const postUniforms = {
      tDiffuse: { value: renderTarget.texture },
      resolution: { value: new THREE.Vector2(rtWidth(), rtHeight()) },
      dotSize: { value: 8.0 },
      angle: { value: 0.785 },
      dotShape: { value: 0 },
      colorMode: { value: 0 },
      edgeMix: { value: 0.0 },
      backgroundColor: { value: new THREE.Color(1, 1, 1) }
    };

    const postMaterial = new THREE.ShaderMaterial({
      uniforms: postUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;

        uniform sampler2D tDiffuse;
        uniform vec2 resolution;
        uniform float dotSize;
        uniform float angle;
        uniform int dotShape;
        uniform int colorMode;
        uniform float edgeMix;
        uniform vec3 backgroundColor;

        float shapeDistance(vec2 p, int shapeType) {
          vec2 a = abs(p);
          if (shapeType == 0) {
            return length(a);
          } else if (shapeType == 1) {
            return a.x + a.y;
          }
          return max(a.x, a.y);
        }

        vec2 rotate2D(vec2 p, float a) {
          float c = cos(a);
          float s = sin(a);
          return mat2(c, -s, s, c) * p;
        }

        float dotMaskGeneric(vec2 fragCoord, float lum, float spacing, float ang, int shapeType) {
          vec2 center = resolution * 0.5;
          vec2 p = fragCoord - center;
          vec2 pr = rotate2D(p, ang);
          vec2 cell = floor(pr / spacing + 0.5) * spacing;
          vec2 local = pr - cell;
          float d = shapeDistance(local, shapeType);
          float radius = spacing * 0.5 * clamp(lum, 0.0, 1.0);
          return step(d, radius);
        }

        vec3 sampleCMYK(vec2 fragCoord, vec3 src) {
          float r = clamp(src.r, 0.0, 1.0);
          float g = clamp(src.g, 0.0, 1.0);
          float b = clamp(src.b, 0.0, 1.0);

          float k = 1.0 - max(max(r, g), b);
          float denom = max(1.0 - k, 1e-5);
          float c = (1.0 - r - k) / denom;
          float m = (1.0 - g - k) / denom;
          float y = (1.0 - b - k) / denom;

          vec3 outCol = vec3(1.0);

          float base = angle;
          float aC = base;
          float aM = base + radians(15.0);
          float aY = base + radians(30.0);
          float aK = base + radians(45.0);

          float mc = dotMaskGeneric(fragCoord, c, dotSize, aC, dotShape);
          float mm = dotMaskGeneric(fragCoord, m, dotSize, aM, dotShape);
          float my = dotMaskGeneric(fragCoord, y, dotSize, aY, dotShape);
          float mk = dotMaskGeneric(fragCoord, k, dotSize, aK, dotShape);

          outCol = mix(outCol, vec3(0.0, 1.0, 1.0), mc);
          outCol = mix(outCol, vec3(1.0, 0.0, 1.0), mm);
          outCol = mix(outCol, vec3(1.0, 1.0, 0.0), my);
          outCol = mix(outCol, vec3(0.0), mk);

          return clamp(outCol, 0.0, 1.0);
        }

        float luminance(vec3 c) {
          return dot(c, vec3(0.299, 0.587, 0.114));
        }

        float sobelEdge(vec2 uv) {
          vec2 texel = 1.0 / resolution;

          float tl = luminance(texture2D(tDiffuse, uv + texel * vec2(-1.0,  1.0)).rgb);
          float  l = luminance(texture2D(tDiffuse, uv + texel * vec2(-1.0,  0.0)).rgb);
          float bl = luminance(texture2D(tDiffuse, uv + texel * vec2(-1.0, -1.0)).rgb);
          float  t = luminance(texture2D(tDiffuse, uv + texel * vec2( 0.0,  1.0)).rgb);
          float  c = luminance(texture2D(tDiffuse, uv).rgb);
          float  b = luminance(texture2D(tDiffuse, uv + texel * vec2( 0.0, -1.0)).rgb);
          float tr = luminance(texture2D(tDiffuse, uv + texel * vec2( 1.0,  1.0)).rgb);
          float  r = luminance(texture2D(tDiffuse, uv + texel * vec2( 1.0,  0.0)).rgb);
          float br = luminance(texture2D(tDiffuse, uv + texel * vec2( 1.0, -1.0)).rgb);

          float gx = -tl - 2.0*l - bl + tr + 2.0*r + br;
          float gy =  tl + 2.0*t + tr - bl - 2.0*b - br;
          float g = length(vec2(gx, gy));
          return smoothstep(0.2, 0.8, g);
        }

        void main() {
          vec3 src = texture2D(tDiffuse, vUv).rgb;
          float lum = luminance(src);
          vec2 fragCoord = vUv * resolution;

          vec3 halftoneColor;

          if (colorMode == 2) {
            halftoneColor = sampleCMYK(fragCoord, src);
          } else {
            float mask = dotMaskGeneric(fragCoord, lum, dotSize, angle, dotShape);
            vec3 dotCol = (colorMode == 1) ? vec3(0.0) : src;
            halftoneColor = mix(backgroundColor, dotCol, mask);
          }

          float edge = sobelEdge(vUv);
          vec3 withEdges = mix(halftoneColor, vec3(0.0), edge * edgeMix);

          gl_FragColor = vec4(withEdges, 1.0);
        }
      `
    });

    const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
    postScene.add(postQuad);

    const state = {
      dotSize: 8.0,
      dotShape: 0,
      dotShapeName: 'circle',
      colorMode: 0,
      colorModeName: 'original',
      angle: 0.785,
      edgeMix: 0.0,
      bypassed: false,
      paused: false,
      frameCount: 0,
      torusKnotRotationY: 0,
      icosahedronOrbitAngle: 0,
      renderTargetWidth: renderTarget.width,
      renderTargetHeight: renderTarget.height,
      uniformsSync: {
        dotSize: 8.0,
        dotShape: 0,
        colorMode: 0,
        angle: 0.785,
        edgeMix: 0.0
      }
    };

    window.__3D_STATE__ = state;

    function dotShapeName(v) {
      return v === 0 ? 'circle' : v === 1 ? 'diamond' : 'square';
    }

    function colorModeName(v) {
      return v === 0 ? 'original' : v === 1 ? 'bw' : 'cmyk';
    }

    function syncUniforms() {
      postUniforms.dotSize.value = state.dotSize;
      postUniforms.dotShape.value = state.dotShape;
      postUniforms.colorMode.value = state.colorMode;
      postUniforms.angle.value = state.angle;
      postUniforms.edgeMix.value = state.edgeMix;

      state.dotShapeName = dotShapeName(state.dotShape);
      state.colorModeName = colorModeName(state.colorMode);

      state.uniformsSync = {
        dotSize: postUniforms.dotSize.value,
        dotShape: postUniforms.dotShape.value,
        colorMode: postUniforms.colorMode.value,
        angle: postUniforms.angle.value,
        edgeMix: postUniforms.edgeMix.value
      };
    }

    function updateHUD() {
      hud.textContent =
`dotSize: ${state.dotSize.toFixed(1)}
dotShape: ${state.dotShapeName}
colorMode: ${state.colorModeName}
angle: ${state.angle.toFixed(2)}
edgeMix: ${state.edgeMix.toFixed(1)}
bypass: ${state.bypassed ? 'on' : 'off'}
paused: ${state.paused ? 'yes' : 'no'}`;
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      const newW = rtWidth();
      const newH = rtHeight();
      renderTarget.setSize(newW, newH);
      postUniforms.resolution.value.set(newW, newH);

      state.renderTargetWidth = newW;
      state.renderTargetHeight = newH;
    }

    window.addEventListener('resize', resize);

    window.addEventListener('keydown', (e) => {
      const key = e.key;

      if (key === '1') {
        state.dotShape = 0;
      } else if (key === '2') {
        state.dotShape = 1;
      } else if (key === '3') {
        state.dotShape = 2;
      } else if (key === 'c' || key === 'C') {
        state.colorMode = (state.colorMode + 1) % 3;
      } else if (key === 'ArrowUp') {
        e.preventDefault();
        state.dotSize = Math.min(40.0, state.dotSize + 2.0);
      } else if (key === 'ArrowDown') {
        e.preventDefault();
        state.dotSize = Math.max(2.0, state.dotSize - 2.0);
      } else if (key === 'ArrowLeft') {
        e.preventDefault();
        state.angle -= 0.1;
      } else if (key === 'ArrowRight') {
        e.preventDefault();
        state.angle += 0.1;
      } else if (key === 'e' || key === 'E') {
        state.edgeMix = state.edgeMix === 0.0 ? 1.0 : 0.0;
      } else if (key === 'b' || key === 'B') {
        state.bypassed = !state.bypassed;
      } else if (key === 'p' || key === 'P') {
        state.paused = !state.paused;
      }

      syncUniforms();
      updateHUD();
    });

    syncUniforms();
    updateHUD();
    resize();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();

      if (!state.paused) {
        torusKnot.rotation.y += 0.3 * dt;
        state.icosahedronOrbitAngle += 0.5 * dt;
      }

      icosahedron.position.set(
        Math.cos(state.icosahedronOrbitAngle) * 2.0,
        0.3,
        Math.sin(state.icosahedronOrbitAngle) * 2.0
      );

      state.torusKnotRotationY = torusKnot.rotation.y;

      syncUniforms();

      if (state.bypassed) {
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
      } else {
        renderer.setRenderTarget(renderTarget);
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
        renderer.render(postScene, postCamera);
      }

      state.frameCount += 1;
      state.renderTargetWidth = renderTarget.width;
      state.renderTargetHeight = renderTarget.height;
      state.torusKnotRotationY = torusKnot.rotation.y;
      state.uniformsSync = {
        dotSize: postUniforms.dotSize.value,
        dotShape: postUniforms.dotShape.value,
        colorMode: postUniforms.colorMode.value,
        angle: postUniforms.angle.value,
        edgeMix: postUniforms.edgeMix.value
      };

      updateHUD();
    }

    animate();
  </script>
</body>
</html>
