<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced 3D Whack-a-Mole</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    .hud {
      position: absolute;
      color: white;
      font-size: 24px;
      background: rgba(0, 0, 0, 0.58);
      padding: 10px 14px;
      border-radius: 8px;
      z-index: 10;
      pointer-events: none;
      line-height: 1.2;
    }

    #scoreDisplay {
      top: 16px;
      left: 16px;
    }

    #comboDisplay {
      top: 72px;
      left: 16px;
    }

    #ratioDisplay {
      top: 128px;
      left: 16px;
    }

    #timerDisplay {
      top: 16px;
      right: 16px;
    }

    #startBtn {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 24px;
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      color: white;
      background: rgba(30, 120, 30, 0.92);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    #startBtn:hover {
      background: rgba(42, 155, 42, 0.96);
    }

    #startBtn:disabled {
      background: rgba(80, 80, 80, 0.8);
      cursor: default;
    }

    #gameOverOverlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 30;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      text-align: center;
    }

    #gameOverOverlay h1 {
      font-size: 64px;
      margin: 0 0 20px;
    }

    #gameOverOverlay p {
      font-size: 34px;
      margin: 8px 0;
    }

    #restartBtn {
      margin-top: 24px;
      font-size: 24px;
      padding: 12px 26px;
      border: none;
      border-radius: 10px;
      background: #2f8f2f;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="startBtn" disabled>Loading Model...</button>

  <div id="scoreDisplay" class="hud">Score: 0</div>
  <div id="comboDisplay" class="hud">Combo: 0x</div>
  <div id="ratioDisplay" class="hud">Hits: 0 | Misses: 0</div>
  <div id="timerDisplay" class="hud">Time: 60s</div>

  <div id="gameOverOverlay">
    <h1>Game Over</h1>
    <p id="finalScoreText">Final Score: 0</p>
    <p id="finalStatsText">Hits: 0 | Misses: 0</p>
    <button id="restartBtn">Play Again</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x86b7e8);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 8, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.minPolarAngle = 0.3;
    controls.maxPolarAngle = 1.2;
    controls.minDistance = 5;
    controls.maxDistance = 20;
    controls.target.set(0, 0, 0);
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(5, 10, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    directionalLight.shadow.camera.near = 0.5;
    directionalLight.shadow.camera.far = 50;
    directionalLight.shadow.camera.left = -12;
    directionalLight.shadow.camera.right = 12;
    directionalLight.shadow.camera.top = 12;
    directionalLight.shadow.camera.bottom = -12;
    scene.add(directionalLight);

    const groundGeometry = new THREE.PlaneGeometry(20, 20);
    const groundMaterial = new THREE.MeshStandardMaterial({ color: "#2d5a1e", roughness: 0.85 });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.055;
    ground.receiveShadow = true;
    scene.add(ground);

    const holePositions = [
      new THREE.Vector3(-3, 0, -3), new THREE.Vector3(0, 0, -3), new THREE.Vector3(3, 0, -3),
      new THREE.Vector3(-3, 0, 0),  new THREE.Vector3(0, 0, 0),  new THREE.Vector3(3, 0, 0),
      new THREE.Vector3(-3, 0, 3),  new THREE.Vector3(0, 0, 3),  new THREE.Vector3(3, 0, 3)
    ];

    const holeMaterial = new THREE.MeshStandardMaterial({ color: 0x221105, roughness: 0.95 });
    const holeGeometry = new THREE.CylinderGeometry(0.6, 0.6, 0.1, 48);

    holePositions.forEach((pos) => {
      const hole = new THREE.Mesh(holeGeometry, holeMaterial);
      hole.position.set(pos.x, 0, pos.z);
      hole.receiveShadow = true;
      hole.castShadow = false;
      scene.add(hole);
    });

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const comboDisplay = document.getElementById("comboDisplay");
    const ratioDisplay = document.getElementById("ratioDisplay");
    const timerDisplay = document.getElementById("timerDisplay");
    const gameOverOverlay = document.getElementById("gameOverOverlay");
    const finalScoreText = document.getElementById("finalScoreText");
    const finalStatsText = document.getElementById("finalStatsText");

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const GAME_DURATION = 60;
    const HIDDEN_Y = -1.5;
    const UP_Y = 0.8;

    let phase = "idle";
    let score = 0;
    let timeRemaining = GAME_DURATION;
    let combo = 0;
    let hitCount = 0;
    let missCount = 0;
    let totalMolesSpawned = 0;
    let difficultyTier = 1;
    let lastHitIndex = -1;
    let gameStartTime = 0;
    let lastSpawnTime = 0;
    let seededRandomState = 123456789;

    const moles = [];
    const particles = [];
    const tweens = [];

    window.__3D_STATE__ = {
      phase: "idle",
      score: 0,
      timeRemaining: 60,
      combo: 0,
      hitCount: 0,
      missCount: 0,
      molesUp: 0,
      totalMolesSpawned: 0,
      difficultyTier: 1,
      moleStates: Array(9).fill(false),
      lastHitIndex: -1,
      gameOverShown: false
    };

    function seededRandom() {
      seededRandomState = (1664525 * seededRandomState + 1013904223) >>> 0;
      return seededRandomState / 4294967296;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function addTween(target, propertyPath, to, durationMs, onComplete, easing = easeOutCubic) {
      const path = propertyPath.split(".");
      let object = target;
      for (let i = 0; i < path.length - 1; i++) object = object[path[i]];
      const key = path[path.length - 1];

      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i];
        if (tw.target === target && tw.propertyPath === propertyPath) tweens.splice(i, 1);
      }

      tweens.push({
        target,
        propertyPath,
        object,
        key,
        from: object[key],
        to,
        duration: durationMs / 1000,
        elapsed: 0,
        onComplete,
        easing
      });
    }

    function updateTweens(delta) {
      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i];
        tw.elapsed += delta;
        const t = Math.min(1, tw.elapsed / tw.duration);
        const e = tw.easing(t);
        tw.object[tw.key] = tw.from + (tw.to - tw.from) * e;
        if (t >= 1) {
          const complete = tw.onComplete;
          tweens.splice(i, 1);
          if (complete) complete();
        }
      }
    }

    function setModelShadowAndUserData(root, moleIndex) {
      root.traverse((child) => {
        child.userData.moleIndex = moleIndex;
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.userData.moleIndex = moleIndex;
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material = child.material.map((mat) => mat.clone());
            } else {
              child.material = child.material.clone();
            }
          }
        }
      });
    }

    function createFallbackMoleModel() {
      const group = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.75, 32, 24),
        new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.75 })
      );
      body.scale.set(1, 0.9, 1);
      body.position.y = 0.45;
      group.add(body);

      const snout = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 24, 16),
        new THREE.MeshStandardMaterial({ color: 0xd09b6b, roughness: 0.7 })
      );
      snout.position.set(0, 0.52, 0.63);
      snout.scale.set(1.1, 0.75, 0.75);
      group.add(snout);

      const nose = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 16, 12),
        new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 })
      );
      nose.position.set(0, 0.56, 0.84);
      group.add(nose);

      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
      const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), eyeMat);
      leftEye.position.set(-0.22, 0.79, 0.58);
      group.add(leftEye);

      const rightEye = leftEye.clone();
      rightEye.position.x = 0.22;
      group.add(rightEye);

      const earMat = new THREE.MeshStandardMaterial({ color: 0x70441f, roughness: 0.75 });
      const leftEar = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), earMat);
      leftEar.position.set(-0.48, 0.93, 0.1);
      leftEar.scale.set(0.75, 1, 0.45);
      group.add(leftEar);

      const rightEar = leftEar.clone();
      rightEar.position.x = 0.48;
      group.add(rightEar);

      group.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });

      return group;
    }

    function setupMoles(baseModel) {
      for (let i = 0; i < 9; i++) {
        const clone = baseModel.clone(true);
        clone.scale.set(0.5, 0.5, 0.5);
        clone.position.set(holePositions[i].x, HIDDEN_Y, holePositions[i].z);
        clone.rotation.y = Math.PI;
        setModelShadowAndUserData(clone, i);
        scene.add(clone);

        moles.push({
          index: i,
          object: clone,
          state: "hidden",
          hittable: false,
          hideAt: 0
        });
      }

      startBtn.disabled = false;
      startBtn.textContent = "Start Game";
    }

    const loader = new GLTFLoader();
    loader.load(
      "RobotExpressive.glb",
      (gltf) => {
        setupMoles(gltf.scene);
      },
      undefined,
      () => {
        setupMoles(createFallbackMoleModel());
      }
    );

    function updateDifficulty(elapsedSeconds) {
      if (elapsedSeconds < 20) difficultyTier = 1;
      else if (elapsedSeconds < 40) difficultyTier = 2;
      else difficultyTier = 3;
    }

    function getDifficultySettings() {
      if (difficultyTier === 1) return { minCount: 1, maxCount: 1, stayDuration: 1.2 };
      if (difficultyTier === 2) return { minCount: 1, maxCount: 2, stayDuration: 1.0 };
      return { minCount: 1, maxCount: 3, stayDuration: 0.8 };
    }

    function popMole(mole, stayDuration, now) {
      if (!mole || mole.state !== "hidden") return;

      mole.state = "rising";
      mole.hittable = true;
      mole.hideAt = now + stayDuration;
      totalMolesSpawned++;

      addTween(mole.object, "position.y", UP_Y, 300, () => {
        if (mole.state === "rising") {
          mole.state = "up";
          mole.object.position.y = UP_Y;
        }
      });
    }

    function retreatMole(mole) {
      if (!mole || mole.state === "hidden" || mole.state === "retreating") return;

      mole.state = "retreating";
      mole.hittable = false;

      addTween(mole.object, "position.y", HIDDEN_Y, 200, () => {
        mole.object.position.y = HIDDEN_Y;
        mole.state = "hidden";
        mole.hittable = false;
      });
    }

    function spawnWave(now) {
      const settings = getDifficultySettings();
      const available = moles.filter((m) => m.state === "hidden");
      if (available.length === 0) return;

      const desiredCount = settings.minCount + Math.floor(seededRandom() * (settings.maxCount - settings.minCount + 1));
      const count = Math.min(desiredCount, available.length);

      for (let i = 0; i < count; i++) {
        const selectedIndex = Math.floor(seededRandom() * available.length);
        const mole = available.splice(selectedIndex, 1)[0];
        popMole(mole, settings.stayDuration, now);
      }
    }

    function spawnHitParticles(position) {
      const particleMaterialBase = new THREE.MeshStandardMaterial({
        color: 0xffee33,
        emissive: 0xffbb00,
        emissiveIntensity: 0.45,
        transparent: true,
        opacity: 1
      });

      for (let i = 0; i < 8; i++) {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 12, 8),
          particleMaterialBase.clone()
        );

        mesh.position.copy(position);
        mesh.position.y += 0.5;

        const angle = (Math.PI * 2 * i) / 8 + seededRandom() * 0.3;
        const speed = 1.6 + seededRandom() * 1.3;
        const velocity = new THREE.Vector3(
          Math.cos(angle) * speed,
          1.2 + seededRandom() * 1.2,
          Math.sin(angle) * speed
        );

        mesh.castShadow = false;
        scene.add(mesh);

        particles.push({
          mesh,
          velocity,
          age: 0,
          lifetime: 0.65
        });
      }
    }

    function updateParticles(delta) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age += delta;
        p.velocity.y -= 4.5 * delta;
        p.mesh.position.addScaledVector(p.velocity, delta);

        const alpha = Math.max(0, 1 - p.age / p.lifetime);
        p.mesh.material.opacity = alpha;
        p.mesh.scale.setScalar(0.7 + alpha * 0.8);

        if (p.age >= p.lifetime) {
          scene.remove(p.mesh);
          p.mesh.geometry.dispose();
          p.mesh.material.dispose();
          particles.splice(i, 1);
        }
      }
    }

    function bonkMole(mole) {
      const obj = mole.object;
      addTween(obj, "scale.x", 0.7, 80, () => addTween(obj, "scale.x", 0.5, 120));
      addTween(obj, "scale.y", 0.3, 80, () => addTween(obj, "scale.y", 0.5, 120));
      addTween(obj, "scale.z", 0.7, 80, () => addTween(obj, "scale.z", 0.5, 120));
    }

    function handleHit(mole) {
      combo += 1;
      const points = combo >= 3 ? 10 + combo * 5 : 10;
      score += points;
      hitCount += 1;
      lastHitIndex = mole.index;

      bonkMole(mole);
      spawnHitParticles(mole.object.position);
      retreatMole(mole);
      updateHUD();
    }

    function handleMiss() {
      missCount += 1;
      combo = 0;
      updateHUD();
    }

    function onPointerDown(event) {
      if (phase !== "playing") return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersectable = moles.map((m) => m.object);
      const intersects = raycaster.intersectObjects(intersectable, true);

      let hitMole = null;

      for (const hit of intersects) {
        let obj = hit.object;
        let moleIndex = obj.userData.moleIndex;
        while ((moleIndex === undefined || moleIndex === null) && obj.parent) {
          obj = obj.parent;
          moleIndex = obj.userData.moleIndex;
        }

        if (moleIndex !== undefined && moleIndex !== null) {
          const mole = moles[moleIndex];
          if (mole && mole.hittable && mole.object.position.y > 0) {
            hitMole = mole;
            break;
          }
        }
      }

      if (hitMole) handleHit(hitMole);
      else handleMiss();
    }

    renderer.domElement.addEventListener("pointerdown", onPointerDown);

    function resetGame() {
      score = 0;
      timeRemaining = GAME_DURATION;
      combo = 0;
      hitCount = 0;
      missCount = 0;
      totalMolesSpawned = 0;
      difficultyTier = 1;
      lastHitIndex = -1;
      seededRandomState = 123456789;
      tweens.length = 0;

      moles.forEach((mole) => {
        mole.state = "hidden";
        mole.hittable = false;
        mole.hideAt = 0;
        mole.object.position.y = HIDDEN_Y;
        mole.object.scale.set(0.5, 0.5, 0.5);
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        scene.remove(particles[i].mesh);
        particles[i].mesh.geometry.dispose();
        particles[i].mesh.material.dispose();
        particles.splice(i, 1);
      }

      gameOverOverlay.style.display = "none";
      startBtn.style.display = "block";
      startBtn.disabled = moles.length !== 9;
      startBtn.textContent = moles.length === 9 ? "Start Game" : "Loading Model...";
      updateHUD();
      updateState();
    }

    function startGame() {
      if (moles.length !== 9) return;

      resetGame();
      phase = "playing";
      gameStartTime = performance.now() / 1000;
      lastSpawnTime = gameStartTime - 1.5;
      startBtn.style.display = "none";
      gameOverOverlay.style.display = "none";
      updateHUD();
      updateState();
    }

    function endGame() {
      if (phase === "ended") return;

      phase = "ended";
      timeRemaining = 0;

      moles.forEach((mole) => retreatMole(mole));

      finalScoreText.textContent = `Final Score: ${score}`;
      finalStatsText.textContent = `Hits: ${hitCount} | Misses: ${missCount}`;
      gameOverOverlay.style.display = "flex";
      startBtn.style.display = "none";

      updateHUD();
      updateState();
    }

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);

    function updateHUD() {
      scoreDisplay.textContent = `Score: ${score}`;
      comboDisplay.textContent = `Combo: ${combo}x`;
      ratioDisplay.textContent = `Hits: ${hitCount} | Misses: ${missCount}`;
      timerDisplay.textContent = `Time: ${timeRemaining}s`;
    }

    function updateState() {
      const moleStates = moles.map((m) => m.object.position.y > 0);
      const molesUp = moleStates.filter(Boolean).length;

      window.__3D_STATE__.phase = phase;
      window.__3D_STATE__.score = score;
      window.__3D_STATE__.timeRemaining = timeRemaining;
      window.__3D_STATE__.combo = combo;
      window.__3D_STATE__.hitCount = hitCount;
      window.__3D_STATE__.missCount = missCount;
      window.__3D_STATE__.molesUp = molesUp;
      window.__3D_STATE__.totalMolesSpawned = totalMolesSpawned;
      window.__3D_STATE__.difficultyTier = difficultyTier;
      window.__3D_STATE__.moleStates = moleStates.length === 9 ? moleStates : Array(9).fill(false);
      window.__3D_STATE__.lastHitIndex = lastHitIndex;
      window.__3D_STATE__.gameOverShown = gameOverOverlay.style.display !== "none";
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const now = performance.now() / 1000;

      updateTweens(delta);
      updateParticles(delta);

      if (phase === "playing") {
        const elapsed = now - gameStartTime;
        timeRemaining = Math.max(0, Math.ceil(GAME_DURATION - elapsed));
        updateDifficulty(elapsed);

        if (elapsed >= GAME_DURATION) {
          endGame();
        } else {
          if (now - lastSpawnTime >= 1.5) {
            spawnWave(now);
            lastSpawnTime = now;
          }

          for (const mole of moles) {
            if ((mole.state === "up" || mole.state === "rising") && now >= mole.hideAt) {
              retreatMole(mole);
            }
          }
        }

        updateHUD();
      }

      controls.update();
      updateState();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetGame();
    animate();
  </script>
</body>
</html>
