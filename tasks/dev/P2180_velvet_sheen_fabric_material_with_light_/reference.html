<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Velvet Sheen Fabric Demo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    body {
      position: relative;
      font-family: monospace;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      z-index: 100;
      width: 280px;
      box-sizing: border-box;
    }
    #hud .control {
      margin-bottom: 12px;
    }
    #hud label {
      display: block;
      margin-bottom: 4px;
    }
    #hud input[type="range"],
    #hud select,
    #hud button {
      width: 100%;
      box-sizing: border-box;
    }
    #hud button {
      padding: 8px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #444;
      color: white;
    }
    #hud button:hover {
      background: #666;
    }
    #status {
      font-size: 12px;
      color: #ccc;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="control">
      <label id="azimuthLabel" for="azimuthSlider">Azimuth: 45°</label>
      <input id="azimuthSlider" type="range" min="0" max="360" step="1" value="45" />
    </div>

    <div class="control">
      <label id="elevationLabel" for="elevationSlider">Elevation: 45°</label>
      <input id="elevationSlider" type="range" min="5" max="85" step="1" value="45" />
    </div>

    <div class="control">
      <label id="sheenLabel" for="sheenSlider">Sheen: 1.00</label>
      <input id="sheenSlider" type="range" min="0" max="100" step="1" value="100" />
    </div>

    <div class="control">
      <label id="sheenRoughnessLabel" for="sheenRoughnessSlider">Sheen Roughness: 0.30</label>
      <input id="sheenRoughnessSlider" type="range" min="0" max="100" step="1" value="30" />
    </div>

    <div class="control">
      <label for="colorPreset">Color Preset</label>
      <select id="colorPreset">
        <option value="Velvet Red">Velvet Red</option>
        <option value="Royal Blue">Royal Blue</option>
        <option value="Emerald Green">Emerald Green</option>
        <option value="Gold Silk">Gold Silk</option>
      </select>
    </div>

    <div class="control">
      <button id="resetBtn">Reset Defaults</button>
    </div>

    <div id="status">Loading model...</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    const WIDTH = 960;
    const HEIGHT = 600;
    const LIGHT_RADIUS = 4;

    const presets = {
      'Velvet Red': { color: '#8B0045', sheenColor: '#FF69B4' },
      'Royal Blue': { color: '#00008B', sheenColor: '#87CEEB' },
      'Emerald Green': { color: '#006400', sheenColor: '#98FB98' },
      'Gold Silk': { color: '#8B7500', sheenColor: '#FFD700' }
    };

    const defaults = {
      azimuth: 45,
      elevation: 45,
      sheen: 1.0,
      sheenRoughness: 0.3,
      colorPreset: 'Velvet Red'
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(45, WIDTH / HEIGHT, 0.1, 100);
    camera.position.set(0, 1.5, 3.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(WIDTH, HEIGHT);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.autoRotate = false;
    controls.update();

    const ambientLight = new THREE.AmbientLight('#404060', 0.3);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight('#ffffff', 2.0);
    scene.add(keyLight);
    keyLight.target.position.set(0, 0, 0);
    scene.add(keyLight.target);

    const lightIndicator = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 16, 16),
      new THREE.MeshBasicMaterial({ color: '#ffff00' })
    );
    scene.add(lightIndicator);

    const rootGroup = new THREE.Group();
    scene.add(rootGroup);

    let loadedModel = null;
    let velvetMaterial = null;
    let meshCount = 0;
    let frameCount = 0;
    let userInteracting = false;
    let lastInteractionTime = 0;

    const azimuthSlider = document.getElementById('azimuthSlider');
    const elevationSlider = document.getElementById('elevationSlider');
    const sheenSlider = document.getElementById('sheenSlider');
    const sheenRoughnessSlider = document.getElementById('sheenRoughnessSlider');
    const resetBtn = document.getElementById('resetBtn');
    const colorPresetSelect = document.getElementById('colorPreset');

    const azimuthLabel = document.getElementById('azimuthLabel');
    const elevationLabel = document.getElementById('elevationLabel');
    const sheenLabel = document.getElementById('sheenLabel');
    const sheenRoughnessLabel = document.getElementById('sheenRoughnessLabel');
    const statusEl = document.getElementById('status');

    function updateLabels() {
      azimuthLabel.textContent = `Azimuth: ${Number(azimuthSlider.value)}°`;
      elevationLabel.textContent = `Elevation: ${Number(elevationSlider.value)}°`;
      sheenLabel.textContent = `Sheen: ${(Number(sheenSlider.value) / 100).toFixed(2)}`;
      sheenRoughnessLabel.textContent = `Sheen Roughness: ${(Number(sheenRoughnessSlider.value) / 100).toFixed(2)}`;
    }

    function applyPreset(name) {
      const preset = presets[name];
      if (!preset || !velvetMaterial) return;
      velvetMaterial.color.set(preset.color);
      velvetMaterial.sheenColor.set(preset.sheenColor);
      velvetMaterial.needsUpdate = true;
    }

    function applyMaterialControls() {
      if (!velvetMaterial) return;
      velvetMaterial.sheen = Number(sheenSlider.value) / 100;
      velvetMaterial.sheenRoughness = Number(sheenRoughnessSlider.value) / 100;
      applyPreset(colorPresetSelect.value);
      velvetMaterial.needsUpdate = true;
    }

    function degToRad(deg) {
      return deg * Math.PI / 180;
    }

    function updateLightPosition() {
      const azimuth = Number(azimuthSlider.value);
      const elevation = Number(elevationSlider.value);

      const az = degToRad(azimuth);
      const el = degToRad(elevation);

      const x = LIGHT_RADIUS * Math.cos(el) * Math.cos(az);
      const y = LIGHT_RADIUS * Math.sin(el);
      const z = LIGHT_RADIUS * Math.cos(el) * Math.sin(az);

      keyLight.position.set(x, y, z);
      lightIndicator.position.copy(keyLight.position);
    }

    function resetDefaults() {
      azimuthSlider.value = defaults.azimuth;
      elevationSlider.value = defaults.elevation;
      sheenSlider.value = defaults.sheen * 100;
      sheenRoughnessSlider.value = defaults.sheenRoughness * 100;
      colorPresetSelect.value = defaults.colorPreset;
      updateLabels();
      applyMaterialControls();
      updateLightPosition();
    }

    [azimuthSlider, elevationSlider, sheenSlider, sheenRoughnessSlider].forEach(el => {
      el.addEventListener('input', () => {
        updateLabels();
        applyMaterialControls();
        updateLightPosition();
      });
    });

    colorPresetSelect.addEventListener('change', () => {
      applyMaterialControls();
    });

    resetBtn.addEventListener('click', resetDefaults);

    controls.addEventListener('start', () => {
      userInteracting = true;
      lastInteractionTime = performance.now();
    });

    controls.addEventListener('end', () => {
      userInteracting = false;
      lastInteractionTime = performance.now();
    });

    controls.addEventListener('change', () => {
      lastInteractionTime = performance.now();
    });

    const loader = new GLTFLoader();
    loader.load(
      'BarramundiFish.glb',
      (gltf) => {
        loadedModel = gltf.scene;

        const box = new THREE.Box3().setFromObject(loadedModel);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        loadedModel.position.sub(center);

        const longestAxis = Math.max(size.x, size.y, size.z);
        const scale = longestAxis > 0 ? 2 / longestAxis : 1;
        loadedModel.scale.setScalar(scale);

        const sharedMaterial = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color('#8B0045'),
          roughness: 0.9,
          metalness: 0.0,
          sheen: 1.0,
          sheenRoughness: 0.3,
          sheenColor: new THREE.Color('#FF69B4'),
          clearcoat: 0.0,
          side: THREE.DoubleSide
        });

        velvetMaterial = sharedMaterial;
        meshCount = 0;

        loadedModel.traverse((child) => {
          if (child.isMesh) {
            child.material = sharedMaterial;
            child.castShadow = false;
            child.receiveShadow = false;
            meshCount++;
          }
        });

        rootGroup.add(loadedModel);
        applyMaterialControls();
        statusEl.textContent = `Model loaded. Meshes updated: ${meshCount}`;
      },
      undefined,
      (error) => {
        console.error('Failed to load GLB:', error);
        statusEl.textContent = 'Failed to load BarramundiFish.glb';
      }
    );

    window.__3D_STATE__ = {
      modelLoaded: false,
      azimuth: defaults.azimuth,
      elevation: defaults.elevation,
      lightPosition: { x: 0, y: 0, z: 0 },
      sheen: defaults.sheen,
      sheenRoughness: defaults.sheenRoughness,
      materialColor: '#8b0045',
      sheenColor: '#ff69b4',
      colorPreset: defaults.colorPreset,
      meshCount: 0,
      frameCount: 0,
      lightRadius: LIGHT_RADIUS
    };

    function colorToHexString(color) {
      return `#${color.getHexString()}`;
    }

    const clock = new THREE.Clock();

    updateLabels();
    resetDefaults();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      controls.update();
      updateLightPosition();

      if (loadedModel) {
        const now = performance.now();
        const recentlyInteracting = userInteracting || (now - lastInteractionTime < 1200);
        if (!recentlyInteracting) {
          rootGroup.rotation.y += 0.2 * dt;
        }
      }

      frameCount++;

      window.__3D_STATE__ = {
        modelLoaded: !!(loadedModel && velvetMaterial),
        azimuth: Number(azimuthSlider.value),
        elevation: Number(elevationSlider.value),
        lightPosition: {
          x: Number(keyLight.position.x.toFixed(2)),
          y: Number(keyLight.position.y.toFixed(2)),
          z: Number(keyLight.position.z.toFixed(2))
        },
        sheen: velvetMaterial ? velvetMaterial.sheen : Number(sheenSlider.value) / 100,
        sheenRoughness: velvetMaterial ? velvetMaterial.sheenRoughness : Number(sheenRoughnessSlider.value) / 100,
        materialColor: velvetMaterial ? colorToHexString(velvetMaterial.color) : '#8b0045',
        sheenColor: velvetMaterial ? colorToHexString(velvetMaterial.sheenColor) : '#ff69b4',
        colorPreset: colorPresetSelect.value,
        meshCount: meshCount,
        frameCount: frameCount,
        lightRadius: LIGHT_RADIUS
      };

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
