<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Liquefaction Earthquake Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: monospace; }
canvas { display: block; }

#hudPanel {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.6;
  pointer-events: none;
  z-index: 10;
  font-family: monospace;
}

#controls {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  align-items: center;
  background: rgba(0, 0, 0, 0.7);
  padding: 12px 20px;
  border-radius: 8px;
  z-index: 10;
}

#controls button {
  padding: 8px 16px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: monospace;
  font-size: 13px;
  font-weight: bold;
}

#btnToggleQuake {
  background: #e74c3c;
  color: #fff;
}

#btnReset {
  background: #3498db;
  color: #fff;
}

#controls label {
  color: #fff;
  font-family: monospace;
  font-size: 13px;
}

#sliderMagnitude {
  width: 120px;
}

#instructions {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.7);
  color: #ccc;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 11px;
  line-height: 1.5;
  font-family: monospace;
  z-index: 10;
}
</style>
</head>
<body>

<div id="hudPanel">
  Magnitude: 0.0<br>
  Pore Pressure: 0.00<br>
  Soil Strength: 1.00<br>
  Liquefaction: NO<br>
  Elapsed: 0.0s<br>
  Helmet Y: 1.50<br>
  Helmet Tilt: 0.00 rad<br>
  Water Table: -0.30
</div>

<div id="instructions">
  W/S: Raise/Lower water table<br>
  E: Toggle epicenter marker
</div>

<div id="controls">
  <button id="btnToggleQuake">Start Earthquake</button>
  <label>Magnitude: <span id="magLabel">5.0</span></label>
  <input type="range" id="sliderMagnitude" min="1" max="9" step="0.1" value="5.0">
  <button id="btnReset">Reset</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

// --- Camera ---
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 12, 20);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.update();

// --- Lights ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 15, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25;
dirLight.shadow.camera.bottom = -25;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 60;
scene.add(dirLight);

// --- Ground ---
const groundGeo = new THREE.PlaneGeometry(40, 40, 80, 80);
groundGeo.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, side: THREE.DoubleSide });
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.receiveShadow = true;
scene.add(groundMesh);

const groundPositionAttr = groundGeo.getAttribute('position');
const groundVertexCount = groundPositionAttr.count;
const originalGroundY = new Float32Array(groundVertexCount);
for (let i = 0; i < groundVertexCount; i++) {
  originalGroundY[i] = groundPositionAttr.getY(i);
}

// --- Water Table ---
const waterGeo = new THREE.PlaneGeometry(40, 40);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x2244AA,
  transparent: true,
  opacity: 0.35,
  side: THREE.DoubleSide
});
const waterMesh = new THREE.Mesh(waterGeo, waterMat);
waterMesh.position.y = -0.3;
scene.add(waterMesh);

// --- Soil Particles ---
const particleCount = 200;
const particles = [];
const particleGeo = new THREE.SphereGeometry(0.08, 6, 6);
const particleMat = new THREE.MeshStandardMaterial({ color: 0xC4A35A });

for (let i = 0; i < particleCount; i++) {
  const mesh = new THREE.Mesh(particleGeo, particleMat);
  mesh.position.set(
    (Math.random() - 0.5) * 36,
    0,
    (Math.random() - 0.5) * 36
  );
  mesh.userData.baseY = 0;
  mesh.userData.phase = Math.random() * Math.PI * 2;
  mesh.userData.speed = 1.5 + Math.random() * 3;
  mesh.userData.amplitude = 0.1 + Math.random() * 0.4;
  scene.add(mesh);
  particles.push(mesh);
}

// --- Epicenter Marker ---
const epicenterGeo = new THREE.RingGeometry(1.5, 1.8, 32);
epicenterGeo.rotateX(-Math.PI / 2);
const epicenterMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
const epicenterMarker = new THREE.Mesh(epicenterGeo, epicenterMat);
epicenterMarker.position.y = 0.05;
epicenterMarker.visible = false;
scene.add(epicenterMarker);

// --- Helmet ---
let helmet = null;
let helmetLoaded = false;
const helmetInitialY = 1.5;
const helmetInitialTiltZ = 0;

const loader = new GLTFLoader();
loader.load(
  'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/DamagedHelmet/glTF-Binary/ScatteringSkull.glb',
  (gltf) => {
    helmet = gltf.scene;
    helmet.position.set(0, helmetInitialY, 0);
    helmet.scale.set(2, 2, 2);
    helmet.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    scene.add(helmet);
    helmetLoaded = true;
  },
  undefined,
  (err) => {
    console.warn('Could not load ScatteringSkull.glb, using fallback box', err);
    const fallbackGeo = new THREE.BoxGeometry(2, 2, 2);
    const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    helmet = new THREE.Mesh(fallbackGeo, fallbackMat);
    helmet.position.set(0, helmetInitialY, 0);
    helmet.castShadow = true;
    helmet.receiveShadow = true;
    scene.add(helmet);
    helmetLoaded = true;
  }
);

// --- Simulation State ---
let earthquakeActive = false;
let earthquakeMagnitude = 5.0;
let porePressure = 0;
let soilStrength = 1.0;
let liquefactionActive = false;
let elapsedTime = 0;
let waterTableY = -0.3;
let epicenterVisible = false;
let simulationTicks = 0;

// --- State Object ---
window.__3D_STATE__ = {
  earthquakeActive: false,
  earthquakeMagnitude: 5.0,
  porePressure: 0,
  soilStrength: 1.0,
  liquefactionActive: false,
  elapsedTime: 0,
  helmetY: helmetInitialY,
  helmetTiltZ: 0,
  waterTableY: -0.3,
  energy: 0,
  particleCount: particleCount,
  groundVertexCount: groundVertexCount,
  epicenterVisible: false,
  helmetLoaded: false,
  simulationTicks: 0
};

// --- UI Elements ---
const btnToggle = document.getElementById('btnToggleQuake');
const btnReset = document.getElementById('btnReset');
const sliderMag = document.getElementById('sliderMagnitude');
const magLabel = document.getElementById('magLabel');
const hudPanel = document.getElementById('hudPanel');

sliderMag.addEventListener('input', () => {
  if (!earthquakeActive) {
    earthquakeMagnitude = parseFloat(sliderMag.value);
    magLabel.textContent = earthquakeMagnitude.toFixed(1);
  }
});

btnToggle.addEventListener('click', () => {
  earthquakeActive = !earthquakeActive;
  btnToggle.textContent = earthquakeActive ? 'Stop Earthquake' : 'Start Earthquake';
  sliderMag.disabled = earthquakeActive;
});

btnReset.addEventListener('click', () => {
  earthquakeActive = false;
  porePressure = 0;
  soilStrength = 1.0;
  liquefactionActive = false;
  elapsedTime = 0;
  simulationTicks = 0;

  btnToggle.textContent = 'Start Earthquake';
  sliderMag.disabled = false;

  // Reset ground
  for (let i = 0; i < groundVertexCount; i++) {
    groundPositionAttr.setY(i, originalGroundY[i]);
  }
  groundPositionAttr.needsUpdate = true;
  groundGeo.computeVertexNormals();

  // Reset helmet
  if (helmet) {
    helmet.position.set(0, helmetInitialY, 0);
    helmet.rotation.set(0, 0, 0);
  }

  // Reset particles
  for (const p of particles) {
    p.position.y = 0;
  }

  // Reset water table
  waterTableY = -0.3;
  waterMesh.position.y = waterTableY;
});

// --- Keyboard ---
window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'w') {
    waterTableY = Math.min(0.0, waterTableY + 0.1);
    waterMesh.position.y = waterTableY;
  } else if (key === 's') {
    waterTableY = Math.max(-2.0, waterTableY - 0.1);
    waterMesh.position.y = waterTableY;
  } else if (key === 'e') {
    epicenterVisible = !epicenterVisible;
    epicenterMarker.visible = epicenterVisible;
  }
});

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Animation ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (earthquakeActive) {
    elapsedTime += delta;
    simulationTicks++;

    // Pore pressure rises; water table proximity multiplier
    const waterTableFactor = Math.max(0.1, 1 + waterTableY);
    porePressure += 0.02 * earthquakeMagnitude * delta * waterTableFactor;
    porePressure = Math.min(porePressure, 1.0);

    // Liquefaction triggers at 0.7
    liquefactionActive = porePressure >= 0.7;

    // Soil strength
    soilStrength = Math.max(0, 1.0 - porePressure);

    // Ground deformation
    const amplitude = earthquakeMagnitude * 0.1 * (1 - soilStrength);
    for (let i = 0; i < groundVertexCount; i++) {
      const x = groundPositionAttr.getX(i);
      const z = groundPositionAttr.getZ(i);
      const dist = Math.sqrt(x * x + z * z);
      const dy = amplitude * Math.sin(dist * 0.5 - elapsedTime * 3.0);
      groundPositionAttr.setY(i, originalGroundY[i] + dy);
    }
    groundPositionAttr.needsUpdate = true;
    groundGeo.computeVertexNormals();

    // Particle bobbing during liquefaction
    if (liquefactionActive) {
      for (const p of particles) {
        const bobHeight = p.userData.amplitude * (1 - soilStrength) * Math.sin(elapsedTime * p.userData.speed + p.userData.phase);
        p.position.y = Math.max(0, bobHeight);
      }
    }

    // Helmet sinking and tilting during liquefaction
    if (helmet && liquefactionActive) {
      const sinkRate = earthquakeMagnitude * 0.015;
      const tiltRate = earthquakeMagnitude * 0.003;
      helmet.position.y -= sinkRate * delta * 60;
      helmet.rotation.z += tiltRate * delta * 60;
    }

    // Epicenter marker pulse
    if (epicenterVisible) {
      const s = 1 + 0.15 * Math.sin(elapsedTime * 5);
      epicenterMarker.scale.set(s, 1, s);
    }
  }

  // Clamp helmet values
  let currentHelmetY = helmetInitialY;
  let currentHelmetTiltZ = 0;
  if (helmet) {
    currentHelmetY = helmet.position.y;
    currentHelmetTiltZ = helmet.rotation.z;
  }

  // Energy conservation
  const energy = earthquakeActive ? 0.5 * earthquakeMagnitude * earthquakeMagnitude : 0;

  // Update HUD
  hudPanel.innerHTML =
    `Magnitude: ${earthquakeMagnitude.toFixed(1)}<br>` +
    `Pore Pressure: ${porePressure.toFixed(2)}<br>` +
    `Soil Strength: ${soilStrength.toFixed(2)}<br>` +
    `Liquefaction: ${liquefactionActive ? 'YES' : 'NO'}<br>` +
    `Elapsed: ${elapsedTime.toFixed(1)}s<br>` +
    `Helmet Y: ${currentHelmetY.toFixed(2)}<br>` +
    `Helmet Tilt: ${currentHelmetTiltZ.toFixed(2)} rad<br>` +
    `Water Table: ${waterTableY.toFixed(2)}`;

  // Update global state
  const state = window.__3D_STATE__;
  state.earthquakeActive = earthquakeActive;
  state.earthquakeMagnitude = earthquakeMagnitude;
  state.porePressure = porePressure;
  state.soilStrength = soilStrength;
  state.liquefactionActive = liquefactionActive;
  state.elapsedTime = elapsedTime;
  state.helmetY = currentHelmetY;
  state.helmetTiltZ = currentHelmetTiltZ;
  state.waterTableY = waterTableY;
  state.energy = energy;
  state.particleCount = particleCount;
  state.groundVertexCount = groundVertexCount;
  state.epicenterVisible = epicenterVisible;
  state.helmetLoaded = helmetLoaded;
  state.simulationTicks = simulationTicks;

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
