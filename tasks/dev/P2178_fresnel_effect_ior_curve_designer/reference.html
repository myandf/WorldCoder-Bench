<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresnel Effect IOR Curve Designer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #111111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ccc; }
canvas#mainCanvas { display: block; }
#panel {
  position: fixed; left: 0; top: 0; width: 280px; height: 100vh;
  background: rgba(17,17,17,0.92); border-right: 1px solid #333;
  overflow-y: auto; padding: 16px; z-index: 100;
  backdrop-filter: blur(10px);
}
#panel h2 { font-size: 16px; color: #99ccff; margin-bottom: 12px; letter-spacing: 1px; }
#curveCanvas { border: 1px solid #333; border-radius: 4px; margin-bottom: 14px; background: #0a0a0a; }
.slider-group { margin-bottom: 10px; }
.slider-group label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 3px; }
.slider-group input[type="range"] {
  width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
  background: #333; border-radius: 3px; outline: none;
}
.slider-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
  background: #99ccff; border-radius: 50%; cursor: pointer;
}
.color-group { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
.color-group label { font-size: 11px; color: #aaa; min-width: 80px; }
.color-group input[type="color"] {
  width: 40px; height: 24px; border: 1px solid #444; border-radius: 3px;
  background: none; cursor: pointer;
}
select, button {
  width: 100%; padding: 7px 10px; margin-bottom: 8px; background: #222;
  border: 1px solid #444; border-radius: 4px; color: #ccc; font-size: 12px; cursor: pointer;
}
button:hover { background: #333; border-color: #99ccff; }
#f0Readout {
  font-size: 12px; color: #99ccff; background: #1a1a2a; padding: 6px 10px;
  border-radius: 4px; margin-bottom: 10px; text-align: center;
}
#loadingOverlay {
  position: fixed; inset: 0; background: rgba(17,17,17,0.95);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; font-size: 18px; color: #99ccff;
}
.hint { font-size: 10px; color: #666; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>

<div id="loadingOverlay">Loading Ferrari Model...</div>

<div id="panel">
  <h2>IOR Curve Designer</h2>
  <canvas id="curveCanvas" width="260" height="180"></canvas>
  <div id="f0Readout">F0: 4.00%</div>

  <div class="slider-group">
    <label><span>IOR</span><span id="iorVal">1.50</span></label>
    <input type="range" id="iorSlider" min="1.0" max="3.0" step="0.01" value="1.5">
  </div>
  <div class="slider-group">
    <label><span>Fresnel Power</span><span id="powerVal">5.0</span></label>
    <input type="range" id="powerSlider" min="0.5" max="10.0" step="0.1" value="5.0">
  </div>
  <div class="slider-group">
    <label><span>Roughness</span><span id="roughVal">0.30</span></label>
    <input type="range" id="roughSlider" min="0.0" max="1.0" step="0.01" value="0.3">
  </div>
  <div class="slider-group">
    <label><span>Metalness</span><span id="metalVal">0.00</span></label>
    <input type="range" id="metalSlider" min="0.0" max="1.0" step="0.01" value="0.0">
  </div>
  <div class="slider-group">
    <label><span>Opacity</span><span id="opacityVal">1.00</span></label>
    <input type="range" id="opacitySlider" min="0.0" max="1.0" step="0.01" value="1.0">
  </div>

  <div class="color-group">
    <label>Base Color</label>
    <input type="color" id="baseColorPicker" value="#050510">
  </div>
  <div class="color-group">
    <label>Fresnel Color</label>
    <input type="color" id="fresnelColorPicker" value="#99ccff">
  </div>

  <select id="presetSelect">
    <option value="Custom">Presets: Custom</option>
    <option value="Glass">1 - Glass</option>
    <option value="Water">2 - Water</option>
    <option value="Diamond">3 - Diamond</option>
    <option value="Metal">4 - Metal</option>
    <option value="Plastic">5 - Plastic</option>
  </select>

  <button id="resetBtn">Reset to Defaults</button>

  <div class="hint">
    Keys: 1-5 Presets | R Reset | W Wireframe | G Ground
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// State
window.__3D_STATE__ = {
  modelLoaded: false, ior: 1.5, fresnelPower: 5.0, roughness: 0.3,
  metalness: 0.0, opacity: 1.0, baseColor: [0.02, 0.02, 0.05],
  fresnelColor: [0.6, 0.8, 1.0], f0: 0.04, f0Percentage: 4.0,
  activePreset: 'Custom', wireframe: false, groundVisible: false,
  fresnelAt0: 0.04, fresnelAt90: 1.0, fresnelAtGrazing: 0,
  meshCount: 0, cameraDistance: 0, curveCanvasExists: true, sliderCount: 5
};

const presets = {
  Glass:   { ior: 1.52, power: 5.0, roughness: 0.05, metalness: 0.0 },
  Water:   { ior: 1.33, power: 5.0, roughness: 0.1,  metalness: 0.0 },
  Diamond: { ior: 2.42, power: 5.0, roughness: 0.0,  metalness: 0.0 },
  Metal:   { ior: 2.5,  power: 3.0, roughness: 0.2,  metalness: 1.0 },
  Plastic: { ior: 1.46, power: 4.0, roughness: 0.4,  metalness: 0.0 }
};

const defaults = {
  ior: 1.5, power: 5.0, roughness: 0.3, metalness: 0.0, opacity: 1.0,
  baseColor: '#050510', fresnelColor: '#99ccff'
};

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4, 2, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// Lights
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5, 8, 5);
scene.add(dirLight);

const hemiLight = new THREE.HemisphereLight(0x4488cc, 0x222222, 0.6);
scene.add(hemiLight);

const warmLight = new THREE.PointLight(0xff8844, 1.5, 20);
warmLight.position.set(-3, 2, -3);
scene.add(warmLight);

const coolLight = new THREE.PointLight(0x4488ff, 1.5, 20);
coolLight.position.set(3, 1, 4);
scene.add(coolLight);

// Fresnel ShaderMaterial
const fresnelVertexShader = `
  varying vec3 vWorldPosition;
  varying vec3 vWorldNormal;
  varying vec3 vViewDir;
  uniform vec3 u_cameraPos;

  void main() {
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vWorldPosition = worldPos.xyz;
    vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
    vViewDir = normalize(u_cameraPos - worldPos.xyz);
    gl_Position = projectionMatrix * viewMatrix * worldPos;
  }
`;

const fresnelFragmentShader = `
  uniform float u_ior;
  uniform float u_fresnelPower;
  uniform vec3 u_baseColor;
  uniform vec3 u_fresnelColor;
  uniform float u_roughness;
  uniform float u_metalness;
  uniform float u_opacity;

  varying vec3 vWorldPosition;
  varying vec3 vWorldNormal;
  varying vec3 vViewDir;

  void main() {
    vec3 normal = normalize(vWorldNormal);
    vec3 viewDir = normalize(vViewDir);

    float f0Val = pow((u_ior - 1.0) / (u_ior + 1.0), 2.0);
    vec3 F0 = mix(vec3(f0Val), u_baseColor, u_metalness);

    float cosTheta = max(dot(viewDir, normal), 0.0);
    vec3 fresnel = F0 + (1.0 - F0) * pow(1.0 - cosTheta, u_fresnelPower);

    float roughnessAtten = 1.0 - u_roughness * 0.7;
    fresnel *= roughnessAtten;

    vec3 color = mix(u_baseColor, u_fresnelColor, fresnel);

    // Simple lighting contribution
    vec3 lightDir = normalize(vec3(5.0, 8.0, 5.0) - vWorldPosition);
    float diff = max(dot(normal, lightDir), 0.0) * 0.5 + 0.5;
    color *= diff;

    // Specular highlight
    vec3 halfDir = normalize(lightDir + viewDir);
    float spec = pow(max(dot(normal, halfDir), 0.0), mix(8.0, 128.0, 1.0 - u_roughness));
    color += u_fresnelColor * spec * 0.3 * roughnessAtten;

    gl_FragColor = vec4(color, u_opacity);
  }
`;

function hexToVec3(hex) {
  const c = new THREE.Color(hex);
  return [c.r, c.g, c.b];
}

function createFresnelMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      u_ior: { value: 1.5 },
      u_fresnelPower: { value: 5.0 },
      u_baseColor: { value: new THREE.Vector3(0.02, 0.02, 0.05) },
      u_fresnelColor: { value: new THREE.Vector3(0.6, 0.8, 1.0) },
      u_roughness: { value: 0.3 },
      u_metalness: { value: 0.0 },
      u_opacity: { value: 1.0 },
      u_cameraPos: { value: camera.position.clone() }
    },
    vertexShader: fresnelVertexShader,
    fragmentShader: fresnelFragmentShader,
    transparent: true,
    side: THREE.DoubleSide
  });
}

const fresnelMaterial = createFresnelMaterial();
let fresnelMeshes = [];
let modelGroup = null;
let autoRotate = true;
let lastInteraction = 0;

// Ground plane
const groundGeom = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x222222, roughness: 0.8, metalness: 0.2
});
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1;
ground.visible = false;

// Grid helper on ground
const gridHelper = new THREE.GridHelper(20, 40, 0x333333, 0x222222);
gridHelper.position.y = -0.99;
gridHelper.visible = false;
scene.add(ground);
scene.add(gridHelper);

// Load model
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(dracoLoader);

const modelUrl = 'https://threejs.org/examples/models/gltf/ToyCar.glb';

loader.load(modelUrl, (gltf) => {
  modelGroup = gltf.scene;

  // Center and scale
  const box = new THREE.Box3().setFromObject(modelGroup);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 4.0 / maxDim;
  modelGroup.scale.setScalar(scale);

  box.setFromObject(modelGroup);
  box.getCenter(center);
  modelGroup.position.sub(center);

  // Apply fresnel material to all meshes
  let meshCount = 0;
  modelGroup.traverse((child) => {
    if (child.isMesh) {
      child.material = fresnelMaterial;
      fresnelMeshes.push(child);
      meshCount++;
    }
  });

  scene.add(modelGroup);
  window.__3D_STATE__.modelLoaded = true;
  window.__3D_STATE__.meshCount = meshCount;

  document.getElementById('loadingOverlay').style.display = 'none';
}, undefined, (err) => {
  console.error('Model load error:', err);
  // Fallback: create a car-like shape
  modelGroup = new THREE.Group();
  const bodyGeom = new THREE.BoxGeometry(3, 0.8, 1.5);
  const bodyMesh = new THREE.Mesh(bodyGeom, fresnelMaterial);
  bodyMesh.position.y = 0.2;
  modelGroup.add(bodyMesh);

  const topGeom = new THREE.BoxGeometry(1.5, 0.6, 1.3);
  const topMesh = new THREE.Mesh(topGeom, fresnelMaterial);
  topMesh.position.set(-0.2, 0.7, 0);
  modelGroup.add(topMesh);

  const wheelGeom = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
  const positions = [[-1, -0.2, 0.85], [1, -0.2, 0.85], [-1, -0.2, -0.85], [1, -0.2, -0.85]];
  positions.forEach(p => {
    const wheel = new THREE.Mesh(wheelGeom, fresnelMaterial);
    wheel.position.set(...p);
    wheel.rotation.x = Math.PI / 2;
    modelGroup.add(wheel);
  });

  fresnelMeshes = [];
  let meshCount = 0;
  modelGroup.traverse((child) => {
    if (child.isMesh) { fresnelMeshes.push(child); meshCount++; }
  });

  scene.add(modelGroup);
  window.__3D_STATE__.modelLoaded = true;
  window.__3D_STATE__.meshCount = meshCount;
  document.getElementById('loadingOverlay').style.display = 'none';
});

// UI Elements
const iorSlider = document.getElementById('iorSlider');
const powerSlider = document.getElementById('powerSlider');
const roughSlider = document.getElementById('roughSlider');
const metalSlider = document.getElementById('metalSlider');
const opacitySlider = document.getElementById('opacitySlider');
const baseColorPicker = document.getElementById('baseColorPicker');
const fresnelColorPicker = document.getElementById('fresnelColorPicker');
const presetSelect = document.getElementById('presetSelect');
const resetBtn = document.getElementById('resetBtn');

function computeF0(ior) {
  return Math.pow((ior - 1) / (ior + 1), 2);
}

function computeFresnel(cosTheta, f0, power) {
  return f0 + (1 - f0) * Math.pow(1 - cosTheta, power);
}

function updateUniforms() {
  const ior = parseFloat(iorSlider.value);
  const power = parseFloat(powerSlider.value);
  const rough = parseFloat(roughSlider.value);
  const metal = parseFloat(metalSlider.value);
  const opacity = parseFloat(opacitySlider.value);
  const bc = hexToVec3(baseColorPicker.value);
  const fc = hexToVec3(fresnelColorPicker.value);

  fresnelMaterial.uniforms.u_ior.value = ior;
  fresnelMaterial.uniforms.u_fresnelPower.value = power;
  fresnelMaterial.uniforms.u_baseColor.value.set(bc[0], bc[1], bc[2]);
  fresnelMaterial.uniforms.u_fresnelColor.value.set(fc[0], fc[1], fc[2]);
  fresnelMaterial.uniforms.u_roughness.value = rough;
  fresnelMaterial.uniforms.u_metalness.value = metal;
  fresnelMaterial.uniforms.u_opacity.value = opacity;

  document.getElementById('iorVal').textContent = ior.toFixed(2);
  document.getElementById('powerVal').textContent = power.toFixed(1);
  document.getElementById('roughVal').textContent = rough.toFixed(2);
  document.getElementById('metalVal').textContent = metal.toFixed(2);
  document.getElementById('opacityVal').textContent = opacity.toFixed(2);

  const f0 = computeF0(ior);
  document.getElementById('f0Readout').textContent = `F0: ${(f0 * 100).toFixed(2)}%`;

  // Update state
  const st = window.__3D_STATE__;
  st.ior = ior;
  st.fresnelPower = power;
  st.roughness = rough;
  st.metalness = metal;
  st.opacity = opacity;
  st.baseColor = bc;
  st.fresnelColor = fc;
  st.f0 = f0;
  st.f0Percentage = f0 * 100;
  st.fresnelAt0 = computeFresnel(1.0, f0, power); // cos(0°) = 1
  st.fresnelAt90 = computeFresnel(0.0, f0, power); // cos(90°) = 0
  const cos80 = Math.cos(80 * Math.PI / 180);
  st.fresnelAtGrazing = computeFresnel(cos80, f0, power);

  drawCurve(ior, power);
}

// Curve canvas
const curveCanvas = document.getElementById('curveCanvas');
const ctx = curveCanvas.getContext('2d');

function drawCurve(ior, power) {
  const w = curveCanvas.width;
  const h = curveCanvas.height;
  const pad = { left: 35, right: 10, top: 10, bottom: 25 };
  const pw = w - pad.left - pad.right;
  const ph = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, w, h);

  // Grid
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ph * i / 4);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + pw, y); ctx.stroke();
  }
  for (let i = 0; i <= 3; i++) {
    const x = pad.left + (pw * i / 3);
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + ph); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, pad.top + ph);
  ctx.lineTo(pad.left + pw, pad.top + ph);
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#777';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('0°', pad.left, pad.top + ph + 15);
  ctx.fillText('30°', pad.left + pw / 3, pad.top + ph + 15);
  ctx.fillText('60°', pad.left + 2 * pw / 3, pad.top + ph + 15);
  ctx.fillText('90°', pad.left + pw, pad.top + ph + 15);

  ctx.textAlign = 'right';
  ctx.fillText('0', pad.left - 5, pad.top + ph + 3);
  ctx.fillText('0.5', pad.left - 5, pad.top + ph / 2 + 3);
  ctx.fillText('1.0', pad.left - 5, pad.top + 8);

  // Curve
  const f0 = computeF0(ior);
  ctx.strokeStyle = '#99ccff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= pw; i++) {
    const angle = (i / pw) * (Math.PI / 2);
    const cosTheta = Math.cos(angle);
    const fresnel = computeFresnel(cosTheta, f0, power);
    const x = pad.left + i;
    const y = pad.top + ph * (1 - Math.min(fresnel, 1));
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // F0 line
  ctx.strokeStyle = '#ff884466';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  const f0y = pad.top + ph * (1 - Math.min(f0, 1));
  ctx.beginPath(); ctx.moveTo(pad.left, f0y); ctx.lineTo(pad.left + pw, f0y); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#ff8844';
  ctx.font = '8px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`F0=${f0.toFixed(3)}`, pad.left + pw - 50, f0y - 4);
}

// Event listeners
[iorSlider, powerSlider, roughSlider, metalSlider, opacitySlider].forEach(s => {
  s.addEventListener('input', () => {
    presetSelect.value = 'Custom';
    window.__3D_STATE__.activePreset = 'Custom';
    updateUniforms();
  });
});

[baseColorPicker, fresnelColorPicker].forEach(p => {
  p.addEventListener('input', () => {
    presetSelect.value = 'Custom';
    window.__3D_STATE__.activePreset = 'Custom';
    updateUniforms();
  });
});

function applyPreset(name) {
  const p = presets[name];
  if (!p) return;
  iorSlider.value = p.ior;
  powerSlider.value = p.power;
  roughSlider.value = p.roughness;
  metalSlider.value = p.metalness;
  presetSelect.value = name;
  window.__3D_STATE__.activePreset = name;
  updateUniforms();
}

presetSelect.addEventListener('change', () => {
  const val = presetSelect.value;
  if (val !== 'Custom') applyPreset(val);
  else window.__3D_STATE__.activePreset = 'Custom';
});

function resetDefaults() {
  iorSlider.value = defaults.ior;
  powerSlider.value = defaults.power;
  roughSlider.value = defaults.roughness;
  metalSlider.value = defaults.metalness;
  opacitySlider.value = defaults.opacity;
  baseColorPicker.value = defaults.baseColor;
  fresnelColorPicker.value = defaults.fresnelColor;
  presetSelect.value = 'Custom';
  window.__3D_STATE__.activePreset = 'Custom';
  window.__3D_STATE__.wireframe = false;
  fresnelMaterial.wireframe = false;
  updateUniforms();
}

resetBtn.addEventListener('click', resetDefaults);

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const key = e.key.toLowerCase();
  if (key === '1') applyPreset('Glass');
  else if (key === '2') applyPreset('Water');
  else if (key === '3') applyPreset('Diamond');
  else if (key === '4') applyPreset('Metal');
  else if (key === '5') applyPreset('Plastic');
  else if (key === 'r') resetDefaults();
  else if (key === 'w') {
    fresnelMaterial.wireframe = !fresnelMaterial.wireframe;
    window.__3D_STATE__.wireframe = fresnelMaterial.wireframe;
  }
  else if (key === 'g') {
    ground.visible = !ground.visible;
    gridHelper.visible = ground.visible;
    window.__3D_STATE__.groundVisible = ground.visible;
  }
});

// Track orbit controls interaction
controls.addEventListener('start', () => { lastInteraction = Date.now(); });

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial draw
updateUniforms();

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  // Auto-rotate model if no recent interaction
  if (modelGroup) {
    const timeSinceInteraction = Date.now() - lastInteraction;
    if (timeSinceInteraction > 2000 || lastInteraction === 0) {
      modelGroup.rotation.y += 0.002;
    }
  }

  controls.update();

  // Update camera position uniform
  fresnelMaterial.uniforms.u_cameraPos.value.copy(camera.position);

  // Update state
  const st = window.__3D_STATE__;
  st.cameraDistance = camera.position.length();
  st.curveCanvasExists = !!document.getElementById('curveCanvas');
  st.sliderCount = document.querySelectorAll('#panel input[type="range"]').length;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
