<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ideal Gas Law 3D Visualization</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    canvas {
      display: block;
    }

    #controlPanel, #readoutPanel {
      position: fixed;
      top: 16px;
      padding: 14px 16px;
      background: rgba(10, 10, 20, 0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      backdrop-filter: blur(4px);
      z-index: 10;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    #controlPanel {
      left: 16px;
      width: 280px;
    }

    #readoutPanel {
      right: 16px;
      width: 250px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #3f72af;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:hover {
      background: #4b86ca;
    }

    .readout-line {
      margin: 6px 0;
      font-size: 14px;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #cfd8ff;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="controlPanel">
    <div class="control-group">
      <label for="tempSlider">Temperature (K): <span id="tempSliderValue">300</span></label>
      <input id="tempSlider" type="range" min="100" max="800" step="10" value="300" />
    </div>

    <div class="control-group">
      <label for="volumeSlider">Volume (L): <span id="volumeSliderValue">5.0</span></label>
      <input id="volumeSlider" type="range" min="1.0" max="10.0" step="0.1" value="5.0" />
    </div>

    <div class="control-group">
      <button id="modeToggle">Isochoric</button>
    </div>

    <div class="hint">Press <b>R</b> to reset</div>
  </div>

  <div id="readoutPanel">
    <div class="readout-line">Temperature: <span id="displayT">300</span> K</div>
    <div class="readout-line">Volume: <span id="displayV">5.0</span> L</div>
    <div class="readout-line">Pressure: <span id="displayP">498.84</span> kPa</div>
    <div class="readout-line">Mode: <span id="displayMode">isochoric</span></div>
    <div class="readout-line">Particles: <span id="displayParticleCount">40</span></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const N_MOLES = 1;
    const R = 8.314;
    const PARTICLE_COUNT = 40;
    const CYLINDER_RADIUS = 1.5;
    const PARTICLE_BOUND_RADIUS = 1.4;
    const PARTICLE_RADIUS = 0.08;
    const PISTON_HEIGHT = 0.15;
    const MIN_Y = 0.1;
    const INITIAL_T = 300;
    const INITIAL_V = 5.0;
    const INITIAL_P = (N_MOLES * R * INITIAL_T) / INITIAL_V;

    let state = {
      temperature: INITIAL_T,
      volume: INITIAL_V,
      pressure: INITIAL_P,
      mode: 'isochoric',
      pistonY: INITIAL_V
    };

    const rootGroup = new THREE.Group();
    scene.add(rootGroup);

    const baseGeometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, 0.05, 48);
    const baseMaterial = new THREE.MeshStandardMaterial({
      color: 0x666a88,
      transparent: true,
      opacity: 0.5,
      metalness: 0.2,
      roughness: 0.7
    });
    const baseMesh = new THREE.Mesh(baseGeometry, baseMaterial);
    baseMesh.position.y = 0.025;
    rootGroup.add(baseMesh);

    const wallGeometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, 1, 48, 1, true);
    const wallMaterial = new THREE.MeshPhongMaterial({
      color: 0x87a8ff,
      transparent: true,
      opacity: 0.16,
      side: THREE.DoubleSide,
      shininess: 80
    });
    const cylinderMesh = new THREE.Mesh(wallGeometry, wallMaterial);
    rootGroup.add(cylinderMesh);

    const wireframe = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, 1, 24, 1, true)),
      new THREE.LineBasicMaterial({ color: 0xbfd4ff, transparent: true, opacity: 0.55 })
    );
    rootGroup.add(wireframe);

    const pistonGeometry = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, PISTON_HEIGHT, 48);
    const pistonMaterial = new THREE.MeshStandardMaterial({
      color: '#cc8844',
      metalness: 0.8,
      roughness: 0.25
    });
    const pistonMesh = new THREE.Mesh(pistonGeometry, pistonMaterial);
    rootGroup.add(pistonMesh);

    const particleGeometry = new THREE.SphereGeometry(PARTICLE_RADIUS, 16, 16);
    const particles = [];

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function randomPointInCylinder(maxRadius, minY, maxY) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * maxRadius;
      return new THREE.Vector3(
        Math.cos(angle) * r,
        rand(minY, maxY),
        Math.sin(angle) * r
      );
    }

    function temperatureToTargetAvgSpeed(T) {
      return 2.0 * Math.sqrt(T / 300);
    }

    function pressureFromTV(T, V) {
      return (N_MOLES * R * T) / V;
    }

    function volumeFromTP(T, P) {
      return (N_MOLES * R * T) / P;
    }

    function speedColor(speed, avgTarget) {
      const minS = avgTarget * 0.5;
      const maxS = avgTarget * 1.7;
      const t = THREE.MathUtils.clamp((speed - minS) / (maxS - minS), 0, 1);
      const color = new THREE.Color();
      color.setRGB(t, 0.2, 1.0 - t);
      return color;
    }

    function createParticles() {
      const avgSpeed = temperatureToTargetAvgSpeed(state.temperature);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const mat = new THREE.MeshStandardMaterial({
          color: 0x66aaff,
          emissive: 0x111111,
          metalness: 0.1,
          roughness: 0.4
        });
        const mesh = new THREE.Mesh(particleGeometry, mat);
        mesh.position.copy(randomPointInCylinder(PARTICLE_BOUND_RADIUS - 0.03, MIN_Y, state.pistonY - 0.1));
        scene.add(mesh);

        const dir = new THREE.Vector3(rand(-1, 1), rand(-0.3, 1), rand(-1, 1)).normalize();
        const speed = avgSpeed * rand(0.7, 1.3);
        const velocity = dir.multiplyScalar(speed);

        particles.push({ mesh, velocity });
      }
    }

    createParticles();

    function updateParticleColors() {
      const avgTarget = temperatureToTargetAvgSpeed(state.temperature);
      for (const p of particles) {
        p.mesh.material.color.copy(speedColor(p.velocity.length(), avgTarget));
      }
    }

    function rescaleVelocitiesToTemperature() {
      const target = temperatureToTargetAvgSpeed(state.temperature);
      let currentAvg = 0;
      for (const p of particles) currentAvg += p.velocity.length();
      currentAvg /= particles.length || 1;

      const scale = currentAvg > 0 ? (target / currentAvg) : 1;
      for (const p of particles) {
        p.velocity.multiplyScalar(scale);
        p.velocity.x += rand(-0.08, 0.08);
        p.velocity.y += rand(-0.08, 0.08);
        p.velocity.z += rand(-0.08, 0.08);
        if (p.velocity.length() < 0.1) {
          p.velocity.normalize().multiplyScalar(target);
        }
      }
      updateParticleColors();
    }

    function clampVolume(v) {
      return THREE.MathUtils.clamp(v, 1.0, 10.0);
    }

    function syncVisuals() {
      state.pistonY = state.volume;

      cylinderMesh.scale.set(1, state.volume, 1);
      cylinderMesh.position.set(0, state.volume / 2, 0);

      wireframe.scale.set(1, state.volume, 1);
      wireframe.position.set(0, state.volume / 2, 0);

      pistonMesh.position.set(0, state.pistonY + PISTON_HEIGHT / 2, 0);
    }

    function updateReadouts() {
      document.getElementById('tempSliderValue').textContent = String(state.temperature);
      document.getElementById('volumeSliderValue').textContent = state.volume.toFixed(1);

      document.getElementById('displayT').textContent = String(state.temperature);
      document.getElementById('displayV').textContent = state.volume.toFixed(1);
      document.getElementById('displayP').textContent = state.pressure.toFixed(2);
      document.getElementById('displayMode').textContent = state.mode;
      document.getElementById('displayParticleCount').textContent = String(PARTICLE_COUNT);

      document.getElementById('modeToggle').textContent =
        state.mode === 'isochoric' ? 'Isochoric' : 'Isobaric';

      document.getElementById('tempSlider').value = String(state.temperature);
      document.getElementById('volumeSlider').value = state.volume.toFixed(1);
    }

    function enforceParticleBounds(p) {
      const maxY = Math.max(MIN_Y + 0.05, state.pistonY - 0.1);

      if (p.mesh.position.y < MIN_Y) {
        p.mesh.position.y = MIN_Y;
        p.velocity.y = Math.abs(p.velocity.y);
      }

      if (p.mesh.position.y > maxY) {
        p.mesh.position.y = maxY;
        p.velocity.y = -Math.abs(p.velocity.y);
      }

      const x = p.mesh.position.x;
      const z = p.mesh.position.z;
      const radial = Math.sqrt(x * x + z * z);

      if (radial > PARTICLE_BOUND_RADIUS) {
        const nx = x / radial;
        const nz = z / radial;

        p.mesh.position.x = nx * PARTICLE_BOUND_RADIUS;
        p.mesh.position.z = nz * PARTICLE_BOUND_RADIUS;

        const normal = new THREE.Vector3(nx, 0, nz);
        const vDotN = p.velocity.dot(normal);
        if (vDotN > 0) {
          p.velocity.addScaledVector(normal, -2 * vDotN);
        } else {
          p.velocity.addScaledVector(normal, -2 * vDotN);
        }
      }
    }

    function resetState() {
      state.temperature = INITIAL_T;
      state.volume = INITIAL_V;
      state.pressure = pressureFromTV(state.temperature, state.volume);
      state.mode = 'isochoric';

      syncVisuals();
      rescaleVelocitiesToTemperature();

      for (const p of particles) {
        p.mesh.position.copy(randomPointInCylinder(PARTICLE_BOUND_RADIUS - 0.03, MIN_Y, state.pistonY - 0.1));
      }

      updateReadouts();
    }

    function applyTemperatureChange(newT) {
      newT = Number(newT);
      state.temperature = newT;

      if (state.mode === 'isochoric') {
        state.pressure = pressureFromTV(state.temperature, state.volume);
      } else {
        const constantPressure = state.pressure;
        state.volume = clampVolume(volumeFromTP(state.temperature, constantPressure));
        state.pressure = pressureFromTV(state.temperature, state.volume);
        syncVisuals();

        for (const p of particles) {
          if (p.mesh.position.y > state.pistonY - 0.1) {
            p.mesh.position.y = Math.max(MIN_Y, state.pistonY - 0.1);
            p.velocity.y = -Math.abs(p.velocity.y);
          }
        }
      }

      rescaleVelocitiesToTemperature();
      updateReadouts();
    }

    function applyVolumeChange(newV) {
      state.volume = clampVolume(Number(newV));
      state.pressure = pressureFromTV(state.temperature, state.volume);

      syncVisuals();

      for (const p of particles) {
        enforceParticleBounds(p);
      }

      updateReadouts();
    }

    document.getElementById('tempSlider').addEventListener('input', (e) => {
      applyTemperatureChange(e.target.value);
    });

    document.getElementById('volumeSlider').addEventListener('input', (e) => {
      applyVolumeChange(e.target.value);
    });

    document.getElementById('modeToggle').addEventListener('click', () => {
      state.mode = state.mode === 'isochoric' ? 'isobaric' : 'isochoric';
      updateReadouts();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        resetState();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    syncVisuals();
    updateReadouts();
    updateParticleColors();

    const clock = new THREE.Clock();

    window.__3D_STATE__ = {
      temperature: state.temperature,
      volume: state.volume,
      pressure: state.pressure,
      mode: state.mode,
      particleCount: PARTICLE_COUNT,
      pistonY: state.pistonY,
      avgParticleSpeed: 0,
      nrt: N_MOLES * R * state.temperature,
      pvProduct: state.pressure * state.volume,
      particlesInBounds: true
    };

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);

      let speedSum = 0;
      let particlesInBounds = true;

      for (const p of particles) {
        p.mesh.position.addScaledVector(p.velocity, dt);

        if (Math.random() < 0.03) {
          p.velocity.x += rand(-0.03, 0.03);
          p.velocity.y += rand(-0.03, 0.03);
          p.velocity.z += rand(-0.03, 0.03);
        }

        const desiredAvg = temperatureToTargetAvgSpeed(state.temperature);
        const currentSpeed = p.velocity.length();
        if (currentSpeed > 0) {
          const corrected = THREE.MathUtils.lerp(currentSpeed, desiredAvg, 0.002);
          p.velocity.setLength(Math.max(0.05, corrected));
        }

        enforceParticleBounds(p);

        const radial = Math.sqrt(p.mesh.position.x * p.mesh.position.x + p.mesh.position.z * p.mesh.position.z);
        const maxY = Math.max(MIN_Y + 0.05, state.pistonY - 0.1);

        if (radial > PARTICLE_BOUND_RADIUS + 1e-6 || p.mesh.position.y < MIN_Y - 1e-6 || p.mesh.position.y > maxY + 1e-6) {
          particlesInBounds = false;
        }

        speedSum += p.velocity.length();
      }

      updateParticleColors();

      const avgParticleSpeed = speedSum / particles.length;
      const nrt = N_MOLES * R * state.temperature;
      const pvProduct = state.pressure * state.volume;

      window.__3D_STATE__.temperature = state.temperature;
      window.__3D_STATE__.volume = state.volume;
      window.__3D_STATE__.pressure = state.pressure;
      window.__3D_STATE__.mode = state.mode;
      window.__3D_STATE__.particleCount = PARTICLE_COUNT;
      window.__3D_STATE__.pistonY = state.pistonY;
      window.__3D_STATE__.avgParticleSpeed = avgParticleSpeed;
      window.__3D_STATE__.nrt = nrt;
      window.__3D_STATE__.pvProduct = pvProduct;
      window.__3D_STATE__.particlesInBounds = particlesInBounds;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
