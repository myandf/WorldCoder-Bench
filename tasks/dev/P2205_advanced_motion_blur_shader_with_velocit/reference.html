<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Per-Object Motion Blur with Scoring</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }

#controlPanel {
  position: fixed;
  top: 10px;
  right: 10px;
  background: rgba(20, 20, 40, 0.9);
  border: 1px solid rgba(100, 100, 200, 0.3);
  border-radius: 8px;
  padding: 15px;
  color: #ccc;
  font-size: 13px;
  width: 260px;
  z-index: 100;
}
#controlPanel label {
  display: block;
  margin-bottom: 2px;
  color: #aab;
}
#controlPanel input[type="range"] {
  width: 100%;
  margin-bottom: 10px;
  accent-color: #6c63ff;
}
#controlPanel input[type="checkbox"] {
  margin-right: 6px;
  accent-color: #6c63ff;
}
#controlPanel .checkbox-row {
  margin-bottom: 10px;
  display: flex;
  align-items: center;
}
#controlPanel button {
  background: #6c63ff;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 6px 14px;
  cursor: pointer;
  margin-right: 6px;
  margin-bottom: 6px;
  font-size: 12px;
}
#controlPanel button:hover { background: #5a52d5; }

#scoreHUD {
  position: fixed;
  top: 10px;
  left: 10px;
  background: rgba(20, 20, 40, 0.9);
  border: 1px solid rgba(100, 100, 200, 0.3);
  border-radius: 8px;
  padding: 15px;
  color: #ccc;
  font-size: 14px;
  min-width: 220px;
  z-index: 100;
}
#scoreHUD .score-val {
  color: #6c63ff;
  font-weight: bold;
  font-size: 28px;
}
#scoreHUD .high-score-val {
  color: #ff6384;
  font-weight: bold;
  font-size: 18px;
}
#scoreHUD .stat-line {
  margin: 4px 0;
}
.blur-status-on { color: #4caf50; }
.blur-status-off { color: #f44336; }
</style>
</head>
<body>

<div id="scoreHUD">
  <div class="stat-line">Score: <span class="score-val" id="scoreVal">0</span></div>
  <div class="stat-line">High Score: <span class="high-score-val" id="highScoreVal">0</span></div>
  <div class="stat-line">Velocity: <span id="velocityVal">0.00</span> u/s</div>
  <div class="stat-line">Blur: <span id="blurStatusVal" class="blur-status-on">ON</span></div>
</div>

<div id="controlPanel">
  <label>Blur Strength: <span id="bsLabel">1.0</span></label>
  <input type="range" id="blurStrengthSlider" min="0" max="3" step="0.1" value="1.0">

  <label>Blur Samples: <span id="bsampLabel">16</span></label>
  <input type="range" id="blurSamplesSlider" min="2" max="32" step="2" value="16">

  <label>Velocity Scale: <span id="vsLabel">1.0</span></label>
  <input type="range" id="velocityScaleSlider" min="0" max="2" step="0.05" value="1.0">

  <label>Orbit Speed: <span id="osLabel">1.0</span></label>
  <input type="range" id="orbitSpeedSlider" min="0" max="5" step="0.1" value="1.0">

  <div class="checkbox-row">
    <input type="checkbox" id="bobbingToggle"><label for="bobbingToggle" style="margin-bottom:0">Enable Bobbing</label>
  </div>

  <button id="resetBtn">Reset Defaults</button>
  <button id="toggleBlurBtn">Toggle Blur</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const WIDTH = 1024, HEIGHT = 768;

const state = {
  rendererReady: false,
  modelLoaded: false,
  blurEnabled: true,
  blurStrength: 1.0,
  blurSamples: 16,
  velocityScale: 1.0,
  orbitSpeed: 1.0,
  bobbingEnabled: false,
  modelVelocity: 0,
  modelPositionX: 0,
  modelPositionY: 0,
  modelPositionZ: 0,
  currentScore: 0,
  highScore: 0,
  idealStrength: 0,
  idealSamples: 4,
  idealVelocityScale: 0.1,
  frameCount: 0,
  velocityBufferActive: false,
  colorBufferActive: false,
  previousMVPStored: false,
  elapsedTime: 0,
  orbitAngle: 0
};
window.__3D_STATE__ = state;

function safeNum(v, fallback = 0) {
  if (typeof v !== 'number' || !isFinite(v)) return fallback;
  return v;
}

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(WIDTH, HEIGHT);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
state.rendererReady = true;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// Camera
const camera = new THREE.PerspectiveCamera(50, WIDTH / HEIGHT, 0.1, 100);
camera.position.set(0, 1.5, 3.5);
camera.lookAt(0, 0, 0);

// Lights
const ambient = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);

// Ground
const groundGeo = new THREE.PlaneGeometry(10, 10);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.5;
scene.add(ground);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Render targets
const colorRT = new THREE.WebGLRenderTarget(WIDTH, HEIGHT, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  type: THREE.HalfFloatType
});
state.colorBufferActive = true;

const velocityRT = new THREE.WebGLRenderTarget(WIDTH, HEIGHT, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  type: THREE.HalfFloatType,
  format: THREE.RGBAFormat
});
state.velocityBufferActive = true;

// Velocity shader material
const velocityVertexShader = `
  uniform mat4 uPrevMVP;
  uniform mat4 uCurrMVP;
  varying vec4 vCurrPos;
  varying vec4 vPrevPos;
  void main() {
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vCurrPos = uCurrMVP * vec4(position, 1.0);
    vPrevPos = uPrevMVP * vec4(position, 1.0);
    gl_Position = projectionMatrix * viewMatrix * worldPos;
  }
`;

const velocityFragmentShader = `
  varying vec4 vCurrPos;
  varying vec4 vPrevPos;
  void main() {
    vec2 curr = vCurrPos.xy / vCurrPos.w;
    vec2 prev = vPrevPos.xy / vPrevPos.w;
    vec2 velocity = (curr - prev) * 0.5;
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`;

const velocityMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uPrevMVP: { value: new THREE.Matrix4() },
    uCurrMVP: { value: new THREE.Matrix4() }
  },
  vertexShader: velocityVertexShader,
  fragmentShader: velocityFragmentShader
});

// Zero velocity material for non-moving objects
const zeroVelocityMaterial = new THREE.ShaderMaterial({
  vertexShader: `
    void main() {
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    void main() {
      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
    }
  `
});

// Composite shader (fullscreen quad)
const compositeVertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const compositeFragmentShader = `
  uniform sampler2D tColor;
  uniform sampler2D tVelocity;
  uniform float uBlurStrength;
  uniform int uBlurSamples;
  uniform float uVelocityScale;
  varying vec2 vUv;

  void main() {
    vec2 velocity = texture2D(tVelocity, vUv).rg * uBlurStrength * uVelocityScale;
    vec4 color = texture2D(tColor, vUv);
    float totalWeight = 1.0;
    vec4 result = color;

    float fSamples = float(uBlurSamples);
    for (int i = 1; i < 33; i++) {
      if (i >= uBlurSamples) break;
      float t = (float(i) / fSamples) * 2.0 - 1.0;
      vec2 offset = velocity * t;
      float w = 1.0 - abs(t);
      result += texture2D(tColor, vUv + offset) * w;
      totalWeight += w;
    }
    gl_FragColor = result / totalWeight;
  }
`;

const compositeScene = new THREE.Scene();
const compositeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const compositeQuadGeo = new THREE.PlaneGeometry(2, 2);
const compositeMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: colorRT.texture },
    tVelocity: { value: velocityRT.texture },
    uBlurStrength: { value: 1.0 },
    uBlurSamples: { value: 16 },
    uVelocityScale: { value: 1.0 }
  },
  vertexShader: compositeVertexShader,
  fragmentShader: compositeFragmentShader
});
const compositeQuad = new THREE.Mesh(compositeQuadGeo, compositeMaterial);
compositeScene.add(compositeQuad);

// Face model
let faceModel = null;
let prevModelPosition = new THREE.Vector3();
let prevMVP = new THREE.Matrix4();
let firstFrame = true;
const orbitRadius = 1.5;

// Create a fallback face model (icosphere-based head)
function createFallbackFace() {
  const group = new THREE.Group();

  // Head
  const headGeo = new THREE.IcosahedronGeometry(0.5, 3);
  // Slightly scale to make it more head-shaped
  headGeo.scale(0.85, 1.0, 0.9);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xf0c8a0, roughness: 0.6, metalness: 0.05 });
  const head = new THREE.Mesh(headGeo, headMat);
  group.add(head);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.07, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const pupilGeo = new THREE.SphereGeometry(0.04, 12, 12);
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x222244 });

  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.17, 0.1, 0.4);
  group.add(leftEye);
  const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
  leftPupil.position.set(-0.17, 0.1, 0.46);
  group.add(leftPupil);

  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.17, 0.1, 0.4);
  group.add(rightEye);
  const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
  rightPupil.position.set(0.17, 0.1, 0.46);
  group.add(rightPupil);

  // Nose
  const noseGeo = new THREE.ConeGeometry(0.05, 0.15, 8);
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xe0b890 });
  const nose = new THREE.Mesh(noseGeo, noseMat);
  nose.position.set(0, -0.02, 0.45);
  nose.rotation.x = -Math.PI / 2;
  group.add(nose);

  // Mouth
  const mouthShape = new THREE.Shape();
  mouthShape.moveTo(-0.12, 0);
  mouthShape.quadraticCurveTo(0, -0.06, 0.12, 0);
  const mouthGeo = new THREE.ShapeGeometry(mouthShape);
  const mouthMat = new THREE.MeshStandardMaterial({ color: 0xcc6666, side: THREE.DoubleSide });
  const mouth = new THREE.Mesh(mouthGeo, mouthMat);
  mouth.position.set(0, -0.18, 0.42);
  group.add(mouth);

  // Ears
  const earGeo = new THREE.SphereGeometry(0.08, 8, 8);
  earGeo.scale(0.5, 1.0, 0.7);
  const earMat = new THREE.MeshStandardMaterial({ color: 0xe0b890 });
  const leftEar = new THREE.Mesh(earGeo, earMat);
  leftEar.position.set(-0.45, 0.05, 0.0);
  group.add(leftEar);
  const rightEar = new THREE.Mesh(earGeo, earMat);
  rightEar.position.set(0.45, 0.05, 0.0);
  group.add(rightEar);

  return group;
}

// Try loading GLTF, fallback to procedural face
const loader = new GLTFLoader();
loader.load(
  'RobotExpressive.glb',
  (gltf) => {
    setupModel(gltf.scene);
  },
  undefined,
  () => {
    // Fallback: create procedural face
    const fallback = createFallbackFace();
    setupModel(fallback);
  }
);

function setupModel(model) {
  faceModel = model;

  // Center and scale
  const box = new THREE.Box3().setFromObject(faceModel);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxAxis = Math.max(size.x, size.y, size.z);
  const scale = maxAxis > 0 ? 1.5 / maxAxis : 1;
  faceModel.scale.setScalar(scale);

  // Recalculate after scale
  const box2 = new THREE.Box3().setFromObject(faceModel);
  const center2 = box2.getCenter(new THREE.Vector3());
  faceModel.position.sub(center2);

  scene.add(faceModel);
  state.modelLoaded = true;

  // Init position
  faceModel.position.set(orbitRadius, 0, 0);
  prevModelPosition.copy(faceModel.position);
}

// UI elements
const blurStrengthSlider = document.getElementById('blurStrengthSlider');
const blurSamplesSlider = document.getElementById('blurSamplesSlider');
const velocityScaleSlider = document.getElementById('velocityScaleSlider');
const orbitSpeedSlider = document.getElementById('orbitSpeedSlider');
const bobbingToggle = document.getElementById('bobbingToggle');
const resetBtn = document.getElementById('resetBtn');
const toggleBlurBtn = document.getElementById('toggleBlurBtn');

const bsLabel = document.getElementById('bsLabel');
const bsampLabel = document.getElementById('bsampLabel');
const vsLabel = document.getElementById('vsLabel');
const osLabel = document.getElementById('osLabel');

const scoreVal = document.getElementById('scoreVal');
const highScoreVal = document.getElementById('highScoreVal');
const velocityVal = document.getElementById('velocityVal');
const blurStatusVal = document.getElementById('blurStatusVal');

function updateSliderLabels() {
  bsLabel.textContent = parseFloat(blurStrengthSlider.value).toFixed(1);
  bsampLabel.textContent = blurSamplesSlider.value;
  vsLabel.textContent = parseFloat(velocityScaleSlider.value).toFixed(2);
  osLabel.textContent = parseFloat(orbitSpeedSlider.value).toFixed(1);
}

blurStrengthSlider.addEventListener('input', () => {
  state.blurStrength = parseFloat(blurStrengthSlider.value);
  compositeMaterial.uniforms.uBlurStrength.value = state.blurStrength;
  updateSliderLabels();
});
blurSamplesSlider.addEventListener('input', () => {
  state.blurSamples = parseInt(blurSamplesSlider.value);
  compositeMaterial.uniforms.uBlurSamples.value = state.blurSamples;
  updateSliderLabels();
});
velocityScaleSlider.addEventListener('input', () => {
  state.velocityScale = parseFloat(velocityScaleSlider.value);
  compositeMaterial.uniforms.uVelocityScale.value = state.velocityScale;
  updateSliderLabels();
});
orbitSpeedSlider.addEventListener('input', () => {
  state.orbitSpeed = parseFloat(orbitSpeedSlider.value);
  updateSliderLabels();
});
bobbingToggle.addEventListener('change', () => {
  state.bobbingEnabled = bobbingToggle.checked;
});

function resetDefaults() {
  state.blurStrength = 1.0;
  state.blurSamples = 16;
  state.velocityScale = 1.0;
  state.orbitSpeed = 1.0;
  state.bobbingEnabled = false;
  state.blurEnabled = true;

  blurStrengthSlider.value = 1.0;
  blurSamplesSlider.value = 16;
  velocityScaleSlider.value = 1.0;
  orbitSpeedSlider.value = 1.0;
  bobbingToggle.checked = false;

  compositeMaterial.uniforms.uBlurStrength.value = 1.0;
  compositeMaterial.uniforms.uBlurSamples.value = 16;
  compositeMaterial.uniforms.uVelocityScale.value = 1.0;

  updateSliderLabels();
  updateBlurStatus();
}

function updateBlurStatus() {
  blurStatusVal.textContent = state.blurEnabled ? 'ON' : 'OFF';
  blurStatusVal.className = state.blurEnabled ? 'blur-status-on' : 'blur-status-off';
}

resetBtn.addEventListener('click', resetDefaults);
toggleBlurBtn.addEventListener('click', () => {
  state.blurEnabled = !state.blurEnabled;
  updateBlurStatus();
});

document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'b') {
    state.bobbingEnabled = !state.bobbingEnabled;
    bobbingToggle.checked = state.bobbingEnabled;
  } else if (key === 'r') {
    resetDefaults();
  } else if (key === ' ') {
    e.preventDefault();
    state.blurEnabled = !state.blurEnabled;
    updateBlurStatus();
  } else if (key === '1') {
    state.orbitSpeed = 0.5;
    orbitSpeedSlider.value = 0.5;
    updateSliderLabels();
  } else if (key === '2') {
    state.orbitSpeed = 2.0;
    orbitSpeedSlider.value = 2.0;
    updateSliderLabels();
  } else if (key === '3') {
    state.orbitSpeed = 4.0;
    orbitSpeedSlider.value = 4.0;
    updateSliderLabels();
  }
});

updateSliderLabels();
updateBlurStatus();

// Temp matrices
const currMVP = new THREE.Matrix4();
const tempProjView = new THREE.Matrix4();

// Store original materials for velocity pass swap
let originalMaterials = new Map();

function storeMaterials(obj) {
  obj.traverse((child) => {
    if (child.isMesh) {
      originalMaterials.set(child, child.material);
    }
  });
}

function setVelocityMaterials(obj, mat) {
  obj.traverse((child) => {
    if (child.isMesh) {
      child.material = mat;
    }
  });
}

function restoreMaterials() {
  originalMaterials.forEach((mat, mesh) => {
    mesh.material = mat;
  });
}

function setZeroVelocityMaterial(obj) {
  obj.traverse((child) => {
    if (child.isMesh) {
      if (!originalMaterials.has(child)) {
        originalMaterials.set(child, child.material);
      }
      child.material = zeroVelocityMaterial;
    }
  });
}

const clock = new THREE.Clock();
let orbitAngle = 0;

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();
  state.elapsedTime = safeNum(elapsed);
  state.frameCount++;

  controls.update();

  if (faceModel) {
    // Update orbit
    orbitAngle += state.orbitSpeed * dt;
    state.orbitAngle = safeNum(orbitAngle);

    const px = Math.cos(orbitAngle) * orbitRadius;
    const pz = Math.sin(orbitAngle) * orbitRadius;
    let py = 0;
    if (state.bobbingEnabled) {
      py = Math.sin(elapsed * 2 * Math.PI * 2) * 0.3;
    }

    faceModel.position.set(px, py, pz);

    // Face direction of travel
    faceModel.lookAt(0, py, 0);

    // Compute velocity
    const dx = faceModel.position.x - prevModelPosition.x;
    const dy = faceModel.position.y - prevModelPosition.y;
    const dz = faceModel.position.z - prevModelPosition.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const vel = dt > 0 ? dist / dt : 0;
    state.modelVelocity = safeNum(vel);

    state.modelPositionX = safeNum(faceModel.position.x);
    state.modelPositionY = safeNum(faceModel.position.y);
    state.modelPositionZ = safeNum(faceModel.position.z);

    // Compute current MVP for face model
    faceModel.updateMatrixWorld(true);
    tempProjView.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    currMVP.multiplyMatrices(tempProjView, faceModel.matrixWorld);

    if (firstFrame) {
      prevMVP.copy(currMVP);
      firstFrame = false;
    }

    velocityMaterial.uniforms.uCurrMVP.value.copy(currMVP);
    velocityMaterial.uniforms.uPrevMVP.value.copy(prevMVP);

    state.previousMVPStored = true;

    // Scoring
    const mv = state.modelVelocity;
    const idealStr = clamp(mv * 0.5, 0.2, 2.0);
    const idealSamp = clamp(Math.floor(mv * 8), 4, 32);
    const idealVS = clamp(mv * 0.3, 0.1, 1.5);

    state.idealStrength = safeNum(idealStr);
    state.idealSamples = safeNum(idealSamp);
    state.idealVelocityScale = safeNum(idealVS);

    let score = 100
      - Math.abs(idealStr - state.blurStrength) * 30
      - Math.abs(idealSamp - state.blurSamples) * 2
      - Math.abs(idealVS - state.velocityScale) * 20;
    score = clamp(Math.round(safeNum(score) * 10) / 10, 0, 100);
    state.currentScore = score;
    if (score > state.highScore) state.highScore = score;

    // Render
    if (state.blurEnabled) {
      // Store materials
      originalMaterials.clear();

      // Pass 1: Velocity buffer
      // Set ground to zero velocity
      storeMaterials(ground);
      setZeroVelocityMaterial(ground);

      // Set face to velocity material
      storeMaterials(faceModel);
      setVelocityMaterials(faceModel, velocityMaterial);

      renderer.setRenderTarget(velocityRT);
      renderer.setClearColor(0x000000, 1);
      renderer.clear();
      renderer.render(scene, camera);

      // Restore materials
      restoreMaterials();

      // Pass 1b: Color buffer
      renderer.setRenderTarget(colorRT);
      renderer.setClearColor(0x1a1a2e, 1);
      renderer.clear();
      renderer.render(scene, camera);

      // Pass 2: Composite
      renderer.setRenderTarget(null);
      renderer.render(compositeScene, compositeCamera);
    } else {
      renderer.setRenderTarget(null);
      renderer.setClearColor(0x1a1a2e, 1);
      renderer.render(scene, camera);
    }

    // Store previous MVP
    prevMVP.copy(currMVP);
    prevModelPosition.copy(faceModel.position);

    // Update HUD
    scoreVal.textContent = state.currentScore.toFixed(1);
    highScoreVal.textContent = state.highScore.toFixed(1);
    velocityVal.textContent = state.modelVelocity.toFixed(2);
  } else {
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x1a1a2e, 1);
    renderer.render(scene, camera);
  }
}

animate();
</script>
</body>
</html>
