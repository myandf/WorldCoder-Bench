<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Velvet Sheen Fabric</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: monospace;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-line;
      pointer-events: none;
      min-width: 280px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    #hint {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.45);
      color: #ddd;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="hint">←/→ light • ↑/↓ sheenRoughness • 1/2/3 difficulty • C color • S shadows • R reset</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight('#ffe4c4', 1.5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.left = -4;
    dirLight.shadow.camera.right = 4;
    dirLight.shadow.camera.top = 4;
    dirLight.shadow.camera.bottom = -4;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 15;
    scene.add(dirLight);

    const dirTarget = new THREE.Object3D();
    dirTarget.position.set(0, 0, 0);
    scene.add(dirTarget);
    dirLight.target = dirTarget;

    const rimLight = new THREE.PointLight('#4466aa', 0.4, 20);
    rimLight.position.set(-3, 2, -3);
    scene.add(rimLight);

    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({ color: '#222222', roughness: 0.95, metalness: 0.0 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    const clothGeo = new THREE.PlaneGeometry(4, 4, 64, 64);
    clothGeo.rotateX(-Math.PI / 2);

    const positions = clothGeo.attributes.position;
    const basePositions = new Float32Array(positions.array.length);

    function clothBaseY(x, z) {
      return 0.15 * Math.sin(x * 2.0) * Math.cos(z * 2.0);
    }

    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const z = positions.getZ(i);
      const y = clothBaseY(x, z);
      positions.setY(i, y);
      basePositions[i * 3 + 0] = x;
      basePositions[i * 3 + 1] = y;
      basePositions[i * 3 + 2] = z;
    }
    positions.needsUpdate = true;
    clothGeo.computeVertexNormals();

    const colorOptions = [
      { hex: '#8b0000', name: 'red' },
      { hex: '#00008b', name: 'blue' },
      { hex: '#006400', name: 'green' },
      { hex: '#4b0082', name: 'indigo' }
    ];

    function lighterTint(hex, factor = 0.55) {
      const c = new THREE.Color(hex);
      c.lerp(new THREE.Color('#ffffff'), factor);
      return '#' + c.getHexString();
    }

    const clothMat = new THREE.MeshPhysicalMaterial({
      color: colorOptions[0].hex,
      roughness: 0.85,
      metalness: 0.0,
      sheen: 1.0,
      sheenRoughness: 0.4,
      sheenColor: new THREE.Color(lighterTint(colorOptions[0].hex)),
      clearcoat: 0.05,
      clearcoatRoughness: 0.9,
      side: THREE.DoubleSide
    });

    const cloth = new THREE.Mesh(clothGeo, clothMat);
    cloth.castShadow = true;
    cloth.receiveShadow = true;
    scene.add(cloth);

    const difficulties = {
      1: { name: 'Easy', min: 0.3, max: 0.8, step: 0.1, speed: 1.0 },
      2: { name: 'Medium', min: 0.2, max: 0.6, step: 0.05, speed: 1.5 },
      3: { name: 'Hard', min: 0.1, max: 0.4, step: 0.02, speed: 2.5 }
    };

    const initialState = {
      difficulty: 1,
      angle: 0,
      colorIndex: 0,
      shadowsEnabled: true,
      sheenRoughness: 0.4
    };

    const appState = {
      difficulty: initialState.difficulty,
      lightAngleRad: initialState.angle,
      colorIndex: initialState.colorIndex,
      shadowsEnabled: initialState.shadowsEnabled,
      sheenRoughness: initialState.sheenRoughness,
      frameCount: 0,
      resetCount: 0
    };

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function round1(v) {
      return Math.round(v * 10) / 10;
    }

    function updateLightPosition() {
      const radius = 5;
      dirLight.position.set(
        Math.cos(appState.lightAngleRad) * radius,
        4,
        Math.sin(appState.lightAngleRad) * radius
      );
    }

    function applyDifficultyClamp() {
      const d = difficulties[appState.difficulty];
      appState.sheenRoughness = clamp(appState.sheenRoughness, d.min, d.max);
      clothMat.sheenRoughness = appState.sheenRoughness;
    }

    function applyColor() {
      const current = colorOptions[appState.colorIndex];
      clothMat.color.set(current.hex);
      clothMat.sheenColor.set(lighterTint(current.hex));
    }

    function applyShadows() {
      dirLight.castShadow = appState.shadowsEnabled;
    }

    function resetAll() {
      appState.difficulty = initialState.difficulty;
      appState.lightAngleRad = initialState.angle;
      appState.colorIndex = initialState.colorIndex;
      appState.shadowsEnabled = initialState.shadowsEnabled;
      appState.sheenRoughness = initialState.sheenRoughness;
      updateLightPosition();
      applyDifficultyClamp();
      applyColor();
      applyShadows();
      appState.resetCount++;
    }

    updateLightPosition();
    applyDifficultyClamp();
    applyColor();
    applyShadows();

    window.addEventListener('keydown', (e) => {
      const d = difficulties[appState.difficulty];
      const angleStep = (Math.PI / 12) * d.speed;

      switch (e.key) {
        case 'ArrowLeft':
          appState.lightAngleRad -= angleStep;
          break;
        case 'ArrowRight':
          appState.lightAngleRad += angleStep;
          break;
        case 'ArrowUp':
          appState.sheenRoughness = clamp(
            +(appState.sheenRoughness + d.step).toFixed(3),
            d.min,
            d.max
          );
          clothMat.sheenRoughness = appState.sheenRoughness;
          break;
        case 'ArrowDown':
          appState.sheenRoughness = clamp(
            +(appState.sheenRoughness - d.step).toFixed(3),
            d.min,
            d.max
          );
          clothMat.sheenRoughness = appState.sheenRoughness;
          break;
        case '1':
        case '2':
        case '3':
          appState.difficulty = parseInt(e.key, 10);
          applyDifficultyClamp();
          break;
        case 'c':
        case 'C':
          appState.colorIndex = (appState.colorIndex + 1) % colorOptions.length;
          applyColor();
          break;
        case 's':
        case 'S':
          appState.shadowsEnabled = !appState.shadowsEnabled;
          applyShadows();
          break;
        case 'r':
        case 'R':
          resetAll();
          break;
        default:
          return;
      }

      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        const tau = Math.PI * 2;
        appState.lightAngleRad = ((appState.lightAngleRad % tau) + tau) % tau;
      }

      updateLightPosition();
    });

    const hud = document.getElementById('hud');
    const clock = new THREE.Clock();

    function updateCloth(time) {
      const pos = cloth.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = basePositions[i * 3 + 0];
        const baseY = basePositions[i * 3 + 1];
        const z = basePositions[i * 3 + 2];
        const breathe = 0.02 * Math.sin(time * 1.2 + x * 1.5 + z * 1.2);
        pos.setXYZ(i, x, baseY + breathe, z);
      }
      pos.needsUpdate = true;
      cloth.geometry.computeVertexNormals();
    }

    function getSheenVisibility() {
      const lightDir = dirLight.position.clone().normalize();
      const viewDir = camera.position.clone().normalize();
      return clamp((lightDir.dot(viewDir) + 1) * 0.5, 0, 1);
    }

    function updateHUDAndState() {
      const diff = difficulties[appState.difficulty];
      const angleDeg = round1(THREE.MathUtils.radToDeg(appState.lightAngleRad));
      const currentColor = colorOptions[appState.colorIndex];
      const sheenHex = '#' + clothMat.sheenColor.getHexString();
      const sheenVisibility = getSheenVisibility();

      hud.textContent =
`Difficulty: ${diff.name} (${appState.difficulty})
Light Angle: ${angleDeg.toFixed(1)}°
Sheen Roughness: ${appState.sheenRoughness.toFixed(3)}
Base Color: ${currentColor.name}
Shadows: ${appState.shadowsEnabled ? 'ON' : 'OFF'}
Sheen Intensity: ${(sheenVisibility * 100).toFixed(1)}%`;

      window.__3D_STATE__ = {
        difficulty: appState.difficulty,
        lightAngleRad: appState.lightAngleRad,
        lightAngleDeg: angleDeg,
        lightPosition: {
          x: dirLight.position.x,
          y: dirLight.position.y,
          z: dirLight.position.z
        },
        sheenRoughness: appState.sheenRoughness,
        sheenColor: sheenHex.toLowerCase(),
        baseColor: currentColor.hex.toLowerCase(),
        baseColorName: currentColor.name,
        shadowsEnabled: appState.shadowsEnabled,
        sheenVisibility,
        colorIndex: appState.colorIndex,
        meshVertexCount: cloth.geometry.attributes.position.count,
        stepSize: diff.step,
        speedMultiplier: diff.speed,
        sheenRange: { min: diff.min, max: diff.max },
        frameCount: appState.frameCount,
        resetCount: appState.resetCount
      };
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      controls.update();
      updateCloth(t);
      renderer.render(scene, camera);
      appState.frameCount++;
      updateHUDAndState();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateHUDAndState();
    animate();
  </script>
</body>
</html>
