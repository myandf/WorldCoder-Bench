<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metallic Flake Car Paint Shader</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at 50% 35%, #2b2b2b 0%, #111111 45%, #050505 100%);
      color: #eee;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas.dragging {
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      z-index: 10;
      backdrop-filter: blur(8px);
      background: rgba(15, 15, 15, 0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      color: #f2f2f2;
    }

    #controls {
      top: 16px;
      left: 16px;
      width: 280px;
      padding: 14px 14px 12px;
    }

    #stats {
      left: 16px;
      bottom: 16px;
      min-width: 240px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preset-grid button:last-child {
      grid-column: 1 / -1;
    }

    button, input[type="range"] {
      width: 100%;
    }

    button {
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      color: #f5f5f5;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 9px;
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.12s ease, border-color 0.2s ease;
      font-size: 13px;
    }

    button:hover {
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
      border-color: rgba(255,255,255,0.24);
    }

    button:active {
      transform: translateY(1px);
    }

    .control {
      margin: 10px 0;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      margin-bottom: 5px;
      color: #ddd;
    }

    .control .value {
      color: #fff;
      min-width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      accent-color: #d0d0d0;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 13px;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #bcbcbc;
      opacity: 0.9;
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-variant-numeric: tabular-nums;
    }

    .stat-line .k {
      color: #bfbfbf;
    }

    .stat-line .v {
      color: #ffffff;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="controls" class="hud">
    <div class="title">Metallic Flake Paint</div>

    <div class="preset-grid" id="presetButtons"></div>

    <div class="control">
      <label>
        <span>Flake Density</span>
        <span class="value" id="flakeDensityValue">800</span>
      </label>
      <input id="flakeDensity" type="range" min="200" max="2000" step="50" value="800" />
    </div>

    <div class="control">
      <label>
        <span>Sparkle Intensity</span>
        <span class="value" id="sparkleIntensityValue">1.0</span>
      </label>
      <input id="sparkleIntensity" type="range" min="0" max="3" step="0.1" value="1.0" />
    </div>

    <div class="control">
      <label>
        <span>Clear Coat</span>
        <span class="value" id="clearCoatValue">1.0</span>
      </label>
      <input id="clearCoat" type="range" min="0" max="1" step="0.05" value="1.0" />
    </div>

    <div class="checkbox-row">
      <input id="animateLight" type="checkbox" />
      <label for="animateLight">Animate Light</label>
    </div>

    <div class="hint">
      Shift + drag: move point light on plane Y=3<br />
      Keys 1-5: color presets &nbsp;•&nbsp; R: reset
    </div>
  </div>

  <div id="stats" class="hud">
    <div class="stat-line"><span class="k">Base Color</span><span class="v" id="statColor">Candy Red</span></div>
    <div class="stat-line"><span class="k">Flake Density</span><span class="v" id="statDensity">800</span></div>
    <div class="stat-line"><span class="k">Sparkle</span><span class="v" id="statSparkle">1.0</span></div>
    <div class="stat-line"><span class="k">Clear Coat</span><span class="v" id="statClearCoat">1.0</span></div>
    <div class="stat-line"><span class="k">Point Light</span><span class="v" id="statLightPos">(3.0, 3.0, 3.0)</span></div>
    <div class="stat-line"><span class="k">FPS</span><span class="v" id="statFps">0</span></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const app = document.getElementById('app');

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xFFF5E0, 2.0, 15);
    pointLight.position.set(3, 3, 3);
    scene.add(pointLight);

    const pointLightHelper = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 20, 20),
      new THREE.MeshBasicMaterial({ color: 0xffe4bb })
    );
    scene.add(pointLightHelper);

    const geometry = new THREE.SphereGeometry(
      3,
      128,
      128,
      0,
      Math.PI,
      0.3,
      1.2
    );

    const uniforms = {
      uBaseColor: { value: new THREE.Color(0.6, 0.04, 0.04) },
      uDirLightDir: { value: new THREE.Vector3() },
      uDirLightColor: { value: new THREE.Color(1, 1, 1) },
      uDirLightIntensity: { value: 1.5 },
      uPointLightPos: { value: pointLight.position.clone() },
      uPointLightColor: { value: new THREE.Color('#FFF5E0') },
      uPointLightIntensity: { value: 2.0 },
      uViewPos: { value: camera.position.clone() },
      uFlakeDensity: { value: 800.0 },
      uSparkleIntensity: { value: 1.0 },
      uClearCoat: { value: 1.0 },
      uTime: { value: 0.0 }
    };

    const vertexShader = `
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec2 vUv;

      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const fragmentShader = `
      precision highp float;

      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec2 vUv;

      uniform vec3 uBaseColor;
      uniform vec3 uDirLightDir;
      uniform vec3 uDirLightColor;
      uniform float uDirLightIntensity;

      uniform vec3 uPointLightPos;
      uniform vec3 uPointLightColor;
      uniform float uPointLightIntensity;

      uniform vec3 uViewPos;
      uniform float uFlakeDensity;
      uniform float uSparkleIntensity;
      uniform float uClearCoat;
      uniform float uTime;

      float hash11(float p) {
        p = fract(p * 0.1031);
        p *= p + 33.33;
        p *= p + p;
        return fract(p);
      }

      vec3 hash33(vec3 p3) {
        p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
        p3 += dot(p3, p3.yxz + 33.33);
        return fract((p3.xxy + p3.yxx) * p3.zyx);
      }

      vec3 randomUnitVector(vec3 p) {
        vec3 h = hash33(p) * 2.0 - 1.0;
        return normalize(h + vec3(0.0001, 0.0002, 0.0003));
      }

      float sparkleContribution(vec3 L, vec3 V, vec3 worldPos, vec3 N) {
        vec3 H = normalize(L + V);

        vec3 cellPos = worldPos * (uFlakeDensity * 0.055);
        vec3 cell = floor(cellPos);
        vec3 local = fract(cellPos) - 0.5;

        vec3 rnd = hash33(cell);
        vec3 flakeOffset = (rnd - 0.5) * 0.7;
        float distToFlake = length(local - flakeOffset);

        float flakeMask = 1.0 - smoothstep(0.045, 0.11, distToFlake);

        vec3 flakeNormal = randomUnitVector(cell + 17.13);
        flakeNormal = normalize(mix(N, flakeNormal, 0.78));

        float microSpec = max(dot(flakeNormal, H), 0.0);
        microSpec = pow(microSpec, 180.0 + rnd.x * 220.0);

        float lightFacing = max(dot(N, L), 0.0);
        float visibility = pow(max(dot(flakeNormal, H), 0.0), 8.0);
        float twinkle = 0.85 + 0.15 * sin(uTime * 8.0 + dot(cell, vec3(0.73, 1.21, 1.91)));

        return flakeMask * microSpec * visibility * (0.2 + lightFacing) * twinkle;
      }

      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 V = normalize(uViewPos - vWorldPos);

        vec3 Ld = normalize(-uDirLightDir);
        vec3 LpVec = uPointLightPos - vWorldPos;
        float pointDist = length(LpVec);
        vec3 Lp = normalize(LpVec);
        float pointAtt = 1.0 / (1.0 + 0.08 * pointDist + 0.03 * pointDist * pointDist);

        float ndl = max(dot(N, Ld), 0.0);
        float npl = max(dot(N, Lp), 0.0);

        vec3 diffuse = uBaseColor * (
          uDirLightColor * ndl * uDirLightIntensity +
          uPointLightColor * npl * uPointLightIntensity * pointAtt
        );

        vec3 Hd = normalize(Ld + V);
        vec3 Hp = normalize(Lp + V);

        float baseSpecD = pow(max(dot(N, Hd), 0.0), 24.0) * 0.25;
        float baseSpecP = pow(max(dot(N, Hp), 0.0), 24.0) * 0.25;

        float coatSpecD = pow(max(dot(N, Hd), 0.0), 64.0) * uClearCoat;
        float coatSpecP = pow(max(dot(N, Hp), 0.0), 64.0) * uClearCoat * pointAtt;

        float sparkD = sparkleContribution(Ld, V, vWorldPos, N);
        float sparkP = sparkleContribution(Lp, V, vWorldPos + 9.271, N) * pointAtt;

        vec3 sparkle = (
          uDirLightColor * uDirLightIntensity * sparkD +
          uPointLightColor * uPointLightIntensity * sparkP
        ) * uSparkleIntensity * 2.2;

        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        vec3 fresnelCol = mix(uBaseColor * 0.2, vec3(1.0), 0.55) * fresnel * 0.9;

        vec3 specular = 
          uDirLightColor * uDirLightIntensity * (baseSpecD + coatSpecD * 0.9) +
          uPointLightColor * uPointLightIntensity * (baseSpecP + coatSpecP * 0.9);

        specular *= 0.8;

        vec3 color = uBaseColor * 0.08 + diffuse * 0.75 + specular + sparkle + fresnelCol;

        color = max(color, vec3(0.0));
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader
    });

    const panel = new THREE.Mesh(geometry, material);
    panel.rotation.y = -Math.PI * 0.5;
    scene.add(panel);

    const presets = [
      { name: 'Candy Red', color: new THREE.Color(0.6, 0.04, 0.04) },
      { name: 'Deep Blue', color: new THREE.Color(0.02, 0.05, 0.55) },
      { name: 'Emerald Green', color: new THREE.Color(0.02, 0.45, 0.12) },
      { name: 'Midnight Purple', color: new THREE.Color(0.25, 0.02, 0.45) },
      { name: 'Gold', color: new THREE.Color(0.65, 0.5, 0.05) }
    ];

    const defaultState = {
      presetIndex: 0,
      flakeDensity: 800,
      sparkleIntensity: 1.0,
      clearCoat: 1.0,
      animateLight: false,
      pointLightPos: new THREE.Vector3(3, 3, 3),
      cameraPos: new THREE.Vector3(0, 0, 6)
    };

    let currentPresetIndex = 0;
    let baseColorCurrent = presets[0].color.clone();
    let baseColorStart = presets[0].color.clone();
    let baseColorTarget = presets[0].color.clone();
    let baseColorName = presets[0].name;
    let colorTransitionActive = false;
    let colorTransitionStart = 0;
    const colorTransitionDuration = 0.5;

    let frameCount = 0;
    let shaderCompiled = false;
    let lightOrbitAngle = 0;
    let draggingLight = false;
    let shiftDown = false;

    const clock = new THREE.Clock();

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -3);
    const dragHit = new THREE.Vector3();

    const ui = {
      presetButtons: document.getElementById('presetButtons'),
      flakeDensity: document.getElementById('flakeDensity'),
      sparkleIntensity: document.getElementById('sparkleIntensity'),
      clearCoat: document.getElementById('clearCoat'),
      animateLight: document.getElementById('animateLight'),
      flakeDensityValue: document.getElementById('flakeDensityValue'),
      sparkleIntensityValue: document.getElementById('sparkleIntensityValue'),
      clearCoatValue: document.getElementById('clearCoatValue'),
      statColor: document.getElementById('statColor'),
      statDensity: document.getElementById('statDensity'),
      statSparkle: document.getElementById('statSparkle'),
      statClearCoat: document.getElementById('statClearCoat'),
      statLightPos: document.getElementById('statLightPos'),
      statFps: document.getElementById('statFps')
    };

    function buildPresetButtons() {
      presets.forEach((preset, i) => {
        const btn = document.createElement('button');
        btn.textContent = preset.name;
        btn.addEventListener('click', () => selectPreset(i));
        ui.presetButtons.appendChild(btn);
      });
    }

    buildPresetButtons();

    function selectPreset(index) {
      currentPresetIndex = index;
      baseColorName = presets[index].name;
      baseColorStart.copy(baseColorCurrent);
      baseColorTarget.copy(presets[index].color);
      colorTransitionStart = clock.getElapsedTime();
      colorTransitionActive = true;
    }

    function resetAll() {
      currentPresetIndex = defaultState.presetIndex;
      baseColorCurrent.copy(presets[0].color);
      baseColorStart.copy(presets[0].color);
      baseColorTarget.copy(presets[0].color);
      baseColorName = presets[0].name;
      colorTransitionActive = false;

      uniforms.uBaseColor.value.copy(baseColorCurrent);
      uniforms.uFlakeDensity.value = defaultState.flakeDensity;
      uniforms.uSparkleIntensity.value = defaultState.sparkleIntensity;
      uniforms.uClearCoat.value = defaultState.clearCoat;

      pointLight.position.copy(defaultState.pointLightPos);
      pointLightHelper.position.copy(pointLight.position);
      lightOrbitAngle = 0;

      ui.flakeDensity.value = String(defaultState.flakeDensity);
      ui.sparkleIntensity.value = String(defaultState.sparkleIntensity);
      ui.clearCoat.value = String(defaultState.clearCoat);
      ui.animateLight.checked = defaultState.animateLight;

      camera.position.copy(defaultState.cameraPos);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    ui.flakeDensity.addEventListener('input', () => {
      const v = parseFloat(ui.flakeDensity.value);
      uniforms.uFlakeDensity.value = v;
      ui.flakeDensityValue.textContent = String(v);
    });

    ui.sparkleIntensity.addEventListener('input', () => {
      const v = parseFloat(ui.sparkleIntensity.value);
      uniforms.uSparkleIntensity.value = v;
      ui.sparkleIntensityValue.textContent = v.toFixed(1);
    });

    ui.clearCoat.addEventListener('input', () => {
      const v = parseFloat(ui.clearCoat.value);
      uniforms.uClearCoat.value = v;
      ui.clearCoatValue.textContent = v.toFixed(2).replace(/\.00$/, '.0').replace(/(\.\d)0$/, '$1');
    });

    function updateSliderLabels() {
      ui.flakeDensityValue.textContent = String(uniforms.uFlakeDensity.value);
      ui.sparkleIntensityValue.textContent = uniforms.uSparkleIntensity.value.toFixed(1);
      ui.clearCoatValue.textContent = uniforms.uClearCoat.value.toFixed(2).replace(/\.00$/, '.0').replace(/(\.\d)0$/, '$1');
    }

    function setMouseFromEvent(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function updateDragLight(event) {
      setMouseFromEvent(event);
      raycaster.setFromCamera(mouse, camera);
      if (raycaster.ray.intersectPlane(dragPlane, dragHit)) {
        pointLight.position.copy(dragHit);
        pointLight.position.y = 3;
      }
    }

    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (event.shiftKey) {
        draggingLight = true;
        controls.enabled = false;
        renderer.domElement.classList.add('dragging');
        updateDragLight(event);
      }
    });

    window.addEventListener('pointermove', (event) => {
      if (draggingLight) {
        updateDragLight(event);
      }
    });

    window.addEventListener('pointerup', () => {
      draggingLight = false;
      controls.enabled = true;
      renderer.domElement.classList.remove('dragging');
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Shift') shiftDown = true;

      if (event.key === 'r' || event.key === 'R') {
        resetAll();
      }

      const num = parseInt(event.key, 10);
      if (num >= 1 && num <= 5) {
        selectPreset(num - 1);
      }
    });

    window.addEventListener('keyup', (event) => {
      if (event.key === 'Shift') {
        shiftDown = false;
        draggingLight = false;
        controls.enabled = true;
        renderer.domElement.classList.remove('dragging');
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let fps = 0;
    let fpsFrameCounter = 0;
    let fpsTimeAccumulator = 0;

    function updateStats() {
      ui.statColor.textContent = baseColorName;
      ui.statDensity.textContent = String(uniforms.uFlakeDensity.value);
      ui.statSparkle.textContent = uniforms.uSparkleIntensity.value.toFixed(1);
      ui.statClearCoat.textContent = uniforms.uClearCoat.value.toFixed(2).replace(/\.00$/, '.0').replace(/(\.\d)0$/, '$1');
      ui.statLightPos.textContent = `(${pointLight.position.x.toFixed(1)}, ${pointLight.position.y.toFixed(1)}, ${pointLight.position.z.toFixed(1)})`;
      ui.statFps.textContent = String(fps);
    }

    window.__3D_STATE__ = {
      baseColor: { r: 0.6, g: 0.04, b: 0.04 },
      baseColorName: 'Candy Red',
      flakeDensity: 800,
      sparkleIntensity: 1.0,
      clearCoat: 1.0,
      pointLightPos: { x: 3, y: 3, z: 3 },
      animateLight: false,
      cameraPos: { x: 0, y: 0, z: 6 },
      frameCount: 0,
      colorTransitionActive: false,
      meshExists: true,
      shaderCompiled: false,
      lightOrbitAngle: 0,
      fresnelEnabled: true,
      uniformsReady: true
    };

    resetAll();
    updateSliderLabels();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const t = clock.getElapsedTime();
      frameCount++;

      fpsFrameCounter++;
      fpsTimeAccumulator += dt;
      if (fpsTimeAccumulator >= 0.5) {
        fps = Math.round(fpsFrameCounter / fpsTimeAccumulator);
        fpsFrameCounter = 0;
        fpsTimeAccumulator = 0;
      }

      if (colorTransitionActive) {
        const elapsed = t - colorTransitionStart;
        const a = Math.min(elapsed / colorTransitionDuration, 1.0);
        baseColorCurrent.copy(baseColorStart).lerp(baseColorTarget, a);
        if (a >= 1.0) {
          colorTransitionActive = false;
          baseColorCurrent.copy(baseColorTarget);
        }
      }

      uniforms.uBaseColor.value.copy(baseColorCurrent);

      const animateLight = ui.animateLight.checked;
      if (animateLight && !draggingLight) {
        lightOrbitAngle = (t / 4.0) * Math.PI * 2.0;
        pointLight.position.set(
          Math.cos(lightOrbitAngle) * 5.0,
          3.0,
          Math.sin(lightOrbitAngle) * 5.0
        );
      } else if (!animateLight) {
        lightOrbitAngle = 0.0;
      }

      pointLightHelper.position.copy(pointLight.position);

      uniforms.uPointLightPos.value.copy(pointLight.position);
      uniforms.uViewPos.value.copy(camera.position);
      uniforms.uDirLightDir.value.copy(dirLight.position).normalize();
      uniforms.uTime.value = t;

      controls.update();

      renderer.render(scene, camera);

      if (!shaderCompiled) shaderCompiled = true;

      updateStats();

      window.__3D_STATE__ = {
        baseColor: {
          r: uniforms.uBaseColor.value.r,
          g: uniforms.uBaseColor.value.g,
          b: uniforms.uBaseColor.value.b
        },
        baseColorName,
        flakeDensity: uniforms.uFlakeDensity.value,
        sparkleIntensity: uniforms.uSparkleIntensity.value,
        clearCoat: uniforms.uClearCoat.value,
        pointLightPos: {
          x: pointLight.position.x,
          y: pointLight.position.y,
          z: pointLight.position.z
        },
        animateLight,
        cameraPos: {
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z
        },
        frameCount,
        colorTransitionActive,
        meshExists: !!panel,
        shaderCompiled,
        lightOrbitAngle,
        fresnelEnabled: true,
        uniformsReady: !!uniforms
      };
    }

    animate();
  </script>
</body>
</html>
