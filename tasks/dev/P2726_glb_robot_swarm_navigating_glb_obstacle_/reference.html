<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Swarm Maze Navigation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
        }
        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #555;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
            z-index: 10;
        }
        .controls-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #ccc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="hud">
        Arrived: 0 / 5<br>
        Time: 0.0s<br>
        Speed: 1x<br>
        State: Paused
    </div>

    <div class="controls-hint">
        Mouse: Orbit/Zoom<br>
        [P]: Toggle Pause<br>
        [O]: Toggle Obstacles
    </div>

    <div id="ui-container">
        <button id="startBtn">Start Simulation</button>
        <button id="resetBtn">Reset</button>
        <button id="speedBtn">Speed: 1x</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

        // --- State Management ---
        window.__3D_STATE__ = {
            agentCount: 5,
            agentPositions: [],
            agentArrived: [false, false, false, false, false],
            arrivedCount: 0,
            simulationRunning: false,
            simulationTime: 0,
            speedMultiplier: 1,
            obstaclesVisible: true,
            goalPosition: { x: 17, y: 1.5, z: 17 },
            pathLengths: [0, 0, 0, 0, 0],
            mazeWallCount: 0,
            agentSpeeds: [0, 0, 0, 0, 0],
            modelsLoaded: { parrot: false, watch: false }
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Ground ---
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#333333'; ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, 256, 256);
        const gridTex = new THREE.CanvasTexture(canvas);
        gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping;
        gridTex.repeat.set(20, 20);

        const groundGeo = new THREE.PlaneGeometry(40, 40);
        const groundMat = new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Maze Generation ---
        let grid = [];
        const obstaclesGroup = new THREE.Group();
        scene.add(obstaclesGroup);

        function generateMaze() {
            // Clear old walls
            while(obstaclesGroup.children.length > 0){ 
                obstaclesGroup.remove(obstaclesGroup.children[0]); 
            }
            window.__3D_STATE__.mazeWallCount = 0;

            // Initialize 20x20 grid with walls (1)
            grid = Array(20).fill().map(() => Array(20).fill(1));

            // Randomized DFS to carve paths (0) without creating loops
            function carve(r, c) {
                grid[r][c] = 0;
                const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]].sort(() => Math.random() - 0.5);
                for (let [dr, dc] of dirs) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < 20 && nc >= 0 && nc < 20 && grid[nr][nc] === 1) {
                        let visitedNeighbors = 0;
                        const ndirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
                        for (let [ndr, ndc] of ndirs) {
                            const nnr = nr + ndr, nnc = nc + ndc;
                            if (nnr >= 0 && nnr < 20 && nnc >= 0 && nnc < 20 && grid[nnr][nnc] === 0) {
                                visitedNeighbors++;
                            }
                        }
                        if (visitedNeighbors <= 1) {
                            carve(nr, nc);
                        }
                    }
                }
            }
            
            carve(0, 0);

            // Ensure Start and Goal zones are open
            grid[0][0] = 0; grid[0][1] = 0; grid[1][0] = 0; grid[1][1] = 0; // Start
            grid[19][19] = 0; grid[18][19] = 0; grid[19][18] = 0; grid[18][18] = 0; // Goal

            // Build Wall Meshes
            const wallGeo = new THREE.BoxGeometry(2, 2, 2);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.7 });
            
            for (let r = 0; r < 20; r++) {
                for (let c = 0; c < 20; c++) {
                    if (grid[r][c] === 1) {
                        const wall = new THREE.Mesh(wallGeo, wallMat);
                        wall.position.set(c * 2 - 19, 1, r * 2 - 19);
                        wall.castShadow = true;
                        wall.receiveShadow = true;
                        obstaclesGroup.add(wall);
                        window.__3D_STATE__.mazeWallCount++;
                    }
                }
            }
        }

        // --- A* Pathfinding ---
        function aStar(startR, startC, goalR, goalC) {
            const openSet = [{ r: startR, c: startC, f: 0, g: 0, h: 0, parent: null }];
            const closedSet = new Set();
            const hash = (r, c) => `${r},${c}`;

            while (openSet.length > 0) {
                openSet.sort((a, b) => a.f - b.f);
                const current = openSet.shift();

                if (current.r === goalR && current.c === goalC) {
                    const path = [];
                    let curr = current;
                    while (curr) {
                        path.push({ r: curr.r, c: curr.c });
                        curr = curr.parent;
                    }
                    return path.reverse();
                }

                closedSet.add(hash(current.r, current.c));

                const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
                for (let [dr, dc] of dirs) {
                    const nr = current.r + dr, nc = current.c + dc;
                    if (nr >= 0 && nr < 20 && nc >= 0 && nc < 20 && grid[nr][nc] === 0) {
                        if (closedSet.has(hash(nr, nc))) continue;

                        const g = current.g + 1;
                        const h = Math.abs(nr - goalR) + Math.abs(nc - goalC);
                        const f = g + h;

                        const existing = openSet.find(n => n.r === nr && n.c === nc);
                        if (existing) {
                            if (g < existing.g) {
                                existing.g = g;
                                existing.f = f;
                                existing.parent = current;
                            }
                        } else {
                            openSet.push({ r: nr, c: nc, f, g, h, parent: current });
                        }
                    }
                }
            }
            return []; // Fallback if no path
        }

        // --- Assets & Agents ---
        const loader = new GLTFLoader();
        let watchModel = null;
        const agents = [];
        const agentColors = [0xff0000, 0x0000ff, 0x00ff00, 0xffff00, 0x00ffff];
        const mixers = [];

        class Agent {
            constructor(mesh, color, index) {
                this.group = new THREE.Group();
                this.mesh = mesh;
                
                // Adjust parrot orientation so it faces forward (-Z)
                this.mesh.rotation.y = Math.PI / 2; 
                this.group.add(this.mesh);
                scene.add(this.group);

                this.color = color;
                this.index = index;
                this.startPos = new THREE.Vector3();
                this.path = [];
                this.pathIndex = 0;
                this.arrived = false;
                this.baseSpeed = 3;
                this.effectiveSpeed = 0;

                // Trail
                const trailGeo = new THREE.BufferGeometry();
                trailGeo.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
                const trailMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.5 });
                this.trail = new THREE.Line(trailGeo, trailMat);
                this.trailPositions = [];
                scene.add(this.trail);

                this.randomizeStart();
            }

            randomizeStart() {
                const x = -18 + Math.random() * 2;
                const z = -18 + Math.random() * 2;
                this.startPos.set(x, 0.5, z);
                this.group.position.copy(this.startPos);
            }

            computePath() {
                const startC = Math.max(0, Math.min(19, Math.floor((this.startPos.x + 19) / 2)));
                const startR = Math.max(0, Math.min(19, Math.floor((this.startPos.z + 19) / 2)));
                this.path = aStar(startR, startC, 19, 19);
                window.__3D_STATE__.pathLengths[this.index] = this.path.length;
            }

            reset() {
                this.group.position.copy(this.startPos);
                this.pathIndex = 0;
                this.arrived = false;
                this.trailPositions = [];
                this.updateTrail();
                
                this.mesh.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.emissive.setHex(0x000000);
                        child.material.emissiveIntensity = 0;
                    }
                });
            }

            updateTrail() {
                this.trailPositions.push(this.group.position.x, this.group.position.y, this.group.position.z);
                this.trail.geometry.setAttribute('position', new THREE.Float32BufferAttribute(this.trailPositions, 3));
            }
        }

        // Fallback models in case CDN fails
        function createFallbackParrot() {
            const geo = new THREE.ConeGeometry(0.5, 2, 8);
            geo.rotateX(Math.PI / 2);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            return new THREE.Mesh(geo, mat);
        }

        function createFallbackWatch() {
            const geo = new THREE.CylinderGeometry(1.5, 1.5, 0.5, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8 });
            return new THREE.Mesh(geo, mat);
        }

        // Load Watch
        loader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Iridescence/AntiqueCamera.glb',
            (gltf) => {
                watchModel = gltf.scene;
                watchModel.scale.set(40, 40, 40);
                watchModel.position.set(17, 1.5, 17);
                scene.add(watchModel);
                window.__3D_STATE__.modelsLoaded.watch = true;
            },
            undefined,
            (error) => {
                console.warn("Could not load Watch GLTF, using fallback.", error);
                watchModel = createFallbackWatch();
                watchModel.position.set(17, 1.5, 17);
                scene.add(watchModel);
                window.__3D_STATE__.modelsLoaded.watch = true;
            }
        );

        // Load Parrot
        loader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Fox.glb',
            (gltf) => {
                setupAgents(gltf.scene, gltf.animations);
                window.__3D_STATE__.modelsLoaded.parrot = true;
            },
            undefined,
            (error) => {
                console.warn("Could not load Parrot GLTF, using fallback.", error);
                setupAgents(createFallbackParrot(), []);
                window.__3D_STATE__.modelsLoaded.parrot = true;
            }
        );

        function setupAgents(baseModel, animations) {
            for (let i = 0; i < 5; i++) {
                const clone = SkeletonUtils.clone(baseModel);
                clone.scale.set(0.02, 0.02, 0.02);
                
                // Tint
                clone.traverse(child => {
                    if (child.isMesh) {
                        child.material = child.material.clone();
                        if (child.material.color) {
                            child.material.color.setHex(agentColors[i]);
                        }
                    }
                });

                // Animation
                if (animations && animations.length > 0) {
                    const mixer = new THREE.AnimationMixer(clone);
                    mixer.clipAction(animations[0]).play();
                    mixers.push(mixer);
                }

                const agent = new Agent(clone, agentColors[i], i);
                agents.push(agent);
            }
            
            // Generate initial maze and paths
            generateMazeAndPaths();
        }

        function generateMazeAndPaths() {
            let valid = false;
            while (!valid) {
                generateMaze();
                valid = true;
                for (let agent of agents) {
                    agent.computePath();
                    if (agent.path.length === 0) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        // --- Simulation Logic ---
        let isRunning = false;
        let simTime = 0;
        let speedMult = 1;
        const clock = new THREE.Clock();

        function updateSimulation(dt) {
            if (!isRunning) return;

            const scaledDt = dt * speedMult;
            simTime += scaledDt;

            // Update animations
            mixers.forEach(m => m.update(scaledDt));

            // Rotate watch
            if (watchModel) {
                watchModel.rotation.y += 0.5 * scaledDt;
            }

            let newlyArrived = 0;

            agents.forEach((agent, i) => {
                if (agent.arrived) {
                    agent.effectiveSpeed = 0;
                    return;
                }

                if (agent.pathIndex < agent.path.length) {
                    const targetGrid = agent.path[agent.pathIndex];
                    const targetPos = new THREE.Vector3(targetGrid.c * 2 - 19, 0.5, targetGrid.r * 2 - 19);
                    
                    let moveDir = new THREE.Vector3().subVectors(targetPos, agent.group.position).normalize();

                    // Collision Avoidance (Repulsion)
                    let repulsion = new THREE.Vector3();
                    agents.forEach((otherAgent, j) => {
                        if (i === j) return;
                        const dist = agent.group.position.distanceTo(otherAgent.group.position);
                        if (dist < 1.5 && dist > 0.001) {
                            // Perpendicular repulsion
                            const perp = new THREE.Vector3(-moveDir.z, 0, moveDir.x).normalize();
                            const toOther = new THREE.Vector3().subVectors(otherAgent.group.position, agent.group.position);
                            const dot = toOther.dot(perp);
                            const forceDir = perp.multiplyScalar(-Math.sign(dot || 1));
                            const strength = (1.5 - dist) * 2.0;
                            repulsion.add(forceDir.multiplyScalar(strength));
                        }
                    });

                    moveDir.add(repulsion).normalize();

                    const step = agent.baseSpeed * scaledDt;
                    agent.effectiveSpeed = agent.baseSpeed * speedMult;
                    const distToTarget = agent.group.position.distanceTo(targetPos);

                    if (distToTarget < step) {
                        agent.group.position.copy(targetPos);
                        agent.pathIndex++;
                    } else {
                        agent.group.position.add(moveDir.multiplyScalar(step));
                    }

                    // Keep repulsion inside the 40x40 ground plane.
                    agent.group.position.x = THREE.MathUtils.clamp(agent.group.position.x, -19, 19);
                    agent.group.position.z = THREE.MathUtils.clamp(agent.group.position.z, -19, 19);

                    // LookAt
                    const lookTarget = agent.group.position.clone().add(moveDir);
                    agent.group.lookAt(lookTarget);

                    // Check Arrival
                    const distToGoal = agent.group.position.distanceTo(window.__3D_STATE__.goalPosition);
                    if (distToGoal < 1.5) {
                        agent.arrived = true;
                        newlyArrived++;
                        
                        // Glow effect
                        agent.mesh.traverse(child => {
                            if (child.isMesh && child.material) {
                                child.material.emissive.setHex(agent.color);
                                child.material.emissiveIntensity = 0.8;
                            }
                        });
                    }

                    agent.updateTrail();
                } else {
                    agent.effectiveSpeed = 0;
                }
            });

            window.__3D_STATE__.arrivedCount += newlyArrived;
            if (window.__3D_STATE__.arrivedCount >= 5) {
                isRunning = false; // Auto pause when all arrive
                updateUI();
            }
        }

        // --- UI & Controls ---
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const speedBtn = document.getElementById('speedBtn');
        const hud = document.getElementById('hud');

        function updateUI() {
            startBtn.textContent = isRunning ? 'Pause Simulation' : 'Start Simulation';
            speedBtn.textContent = `Speed: ${speedMult}x`;
            
            hud.innerHTML = `
                Arrived: ${window.__3D_STATE__.arrivedCount} / 5<br>
                Time: ${simTime.toFixed(1)}s<br>
                Speed: ${speedMult}x<br>
                State: ${isRunning ? 'Running' : 'Paused'}
            `;
        }

        startBtn.addEventListener('click', () => {
            if (window.__3D_STATE__.arrivedCount >= 5) return;
            isRunning = !isRunning;
            updateUI();
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            simTime = 0;
            window.__3D_STATE__.arrivedCount = 0;
            
            agents.forEach(a => a.randomizeStart());
            generateMazeAndPaths();
            agents.forEach(a => a.reset());
            
            updateUI();
        });

        speedBtn.addEventListener('click', () => {
            speedMult = speedMult === 1 ? 2 : (speedMult === 2 ? 4 : 1);
            updateUI();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'p') {
                if (window.__3D_STATE__.arrivedCount < 5) {
                    isRunning = !isRunning;
                    updateUI();
                }
            }
            if (e.key.toLowerCase() === 'o') {
                obstaclesGroup.visible = !obstaclesGroup.visible;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Main Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            const dt = clock.getDelta();
            
            updateSimulation(dt);
            controls.update();
            
            // Update State Object
            window.__3D_STATE__.simulationRunning = isRunning;
            window.__3D_STATE__.simulationTime = simTime;
            window.__3D_STATE__.speedMultiplier = speedMult;
            window.__3D_STATE__.obstaclesVisible = obstaclesGroup.visible;
            
            agents.forEach((a, i) => {
                window.__3D_STATE__.agentPositions[i] = { x: a.group.position.x, y: a.group.position.y, z: a.group.position.z };
                window.__3D_STATE__.agentArrived[i] = a.arrived;
                window.__3D_STATE__.agentSpeeds[i] = a.effectiveSpeed;
            });

            if (isRunning) updateUI();

            renderer.render(scene, camera);
        }

        animate();
        updateUI();

    </script>
</body>
</html>
