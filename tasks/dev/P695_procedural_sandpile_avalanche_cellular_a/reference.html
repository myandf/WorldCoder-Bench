<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Sandpile Avalanche Automaton</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
canvas { display: block; }
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.75);
  color: #e0e0e0;
  padding: 14px 18px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.7;
  min-width: 220px;
  z-index: 10;
}
#hud div { margin-bottom: 2px; }
.hud-buttons { margin-top: 10px; display: flex; gap: 8px; }
.hud-buttons button {
  padding: 6px 12px;
  border: 1px solid #666;
  background: rgba(50,50,50,0.9);
  color: #e0e0e0;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 12px;
}
.hud-buttons button:hover { background: rgba(80,80,80,0.9); }
</style>
</head>
<body>
<div id="hud">
  <div>Total Grains: <span id="totalGrains">0</span></div>
  <div>Grains Lost: <span id="grainsLost">0</span></div>
  <div>Topple Events: <span id="toppleEvents">0</span></div>
  <div>Unstable Cells: <span id="unstableCells">0</span></div>
  <div>Step Count: <span id="stepCount">0</span></div>
  <div>Mode: <span id="modeDisplay">drop</span></div>
  <div>Grains/Click: <span id="grainsPerClick">4</span></div>
  <div class="hud-buttons">
    <button id="btnReset">Reset</button>
    <button id="btnCenterDrop">Center Drop (100)</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const GRID_SIZE = 64;
const GRAIN_HEIGHT = 0.5;

const COLORS = {
  0: new THREE.Color(0x3B2507),
  1: new THREE.Color(0xC2B280),
  2: new THREE.Color(0xDAA520),
  3: new THREE.Color(0xE25822),
  4: new THREE.Color(0xFFFFFF)
};

// State
let grid = [];
let totalGrains = 0;
let grainsLost = 0;
let toppleEvents = 0;
let unstableCells = 0;
let stepCount = 0;
let isPaused = false;
let mode = 'drop';
let grainsPerClick = 4;
let isAvalancheRunning = false;
let totalEverAdded = 0;
let maxHeightOnGrid = 0;

function initGrid() {
  grid = [];
  for (let i = 0; i < GRID_SIZE; i++) {
    grid[i] = new Array(GRID_SIZE).fill(0);
  }
}

function resetState() {
  initGrid();
  totalGrains = 0;
  grainsLost = 0;
  toppleEvents = 0;
  unstableCells = 0;
  stepCount = 0;
  isPaused = false;
  mode = 'drop';
  isAvalancheRunning = false;
  totalEverAdded = 0;
  maxHeightOnGrid = 0;
}

resetState();

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 80, 100);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Lighting
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(50, 100, 50);
scene.add(dirLight);

const ambLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambLight);

// Ground plane
const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.5;
scene.add(ground);

// Sand plane
const sandGeo = new THREE.PlaneGeometry(64, 64, 63, 63);
sandGeo.rotateX(-Math.PI / 2);

const colorAttr = new Float32Array(sandGeo.attributes.position.count * 3);
sandGeo.setAttribute('color', new THREE.BufferAttribute(colorAttr, 3));

const sandMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true });
const sandMesh = new THREE.Mesh(sandGeo, sandMat);
scene.add(sandMesh);

function countUnstable() {
  let count = 0;
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      if (grid[x][y] >= 4) count++;
    }
  }
  return count;
}

function computeTotalGrains() {
  let sum = 0;
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      sum += grid[x][y];
    }
  }
  return sum;
}

function computeMaxHeight() {
  let mx = 0;
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      if (grid[x][y] > mx) mx = grid[x][y];
    }
  }
  return mx;
}

function toppleStep() {
  const toTopple = [];
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      if (grid[x][y] >= 4) {
        toTopple.push([x, y]);
      }
    }
  }
  if (toTopple.length === 0) return 0;

  const deltas = [];
  for (let x = 0; x < GRID_SIZE; x++) {
    deltas[x] = new Int32Array(GRID_SIZE);
  }

  let localToppleEvents = 0;
  let localGrainsLost = 0;

  for (const [x, y] of toTopple) {
    const count = Math.floor(grid[x][y] / 4);
    deltas[x][y] -= count * 4;
    localToppleEvents += count;

    const neighbors = [[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
    for (const [nx, ny] of neighbors) {
      if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
        deltas[nx][ny] += count;
      } else {
        localGrainsLost += count;
      }
    }
  }

  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      grid[x][y] += deltas[x][y];
      if (grid[x][y] < 0) grid[x][y] = 0;
    }
  }

  toppleEvents += localToppleEvents;
  grainsLost += localGrainsLost;
  stepCount++;

  return toTopple.length;
}

function updateGeometry() {
  const pos = sandGeo.attributes.position;
  const col = sandGeo.attributes.color;

  maxHeightOnGrid = 0;

  for (let i = 0; i < pos.count; i++) {
    const ix = i % 64;
    const iy = Math.floor(i / 64);

    const gx = Math.min(ix, GRID_SIZE - 1);
    const gy = Math.min(iy, GRID_SIZE - 1);

    const grainCount = grid[gx][gy];
    if (grainCount > maxHeightOnGrid) maxHeightOnGrid = grainCount;

    pos.setY(i, grainCount * GRAIN_HEIGHT);

    let c;
    if (grainCount >= 4) {
      c = COLORS[4];
    } else {
      c = COLORS[grainCount] || COLORS[0];
    }
    col.setXYZ(i, c.r, c.g, c.b);
  }

  pos.needsUpdate = true;
  col.needsUpdate = true;
  sandGeo.computeVertexNormals();
}

function addGrainsAt(x, y, count) {
  if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return;
  grid[x][y] += count;
  totalEverAdded += count;
  isAvalancheRunning = true;
}

function updateHUD() {
  totalGrains = computeTotalGrains();
  unstableCells = countUnstable();

  document.getElementById('totalGrains').textContent = totalGrains;
  document.getElementById('grainsLost').textContent = grainsLost;
  document.getElementById('toppleEvents').textContent = toppleEvents;
  document.getElementById('unstableCells').textContent = unstableCells;
  document.getElementById('stepCount').textContent = stepCount;
  document.getElementById('modeDisplay').textContent = mode;
  document.getElementById('grainsPerClick').textContent = grainsPerClick;
}

// Raycasting
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (event) => {
  if (event.target !== renderer.domElement) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(sandMesh);

  if (intersects.length > 0) {
    const point = intersects[0].point;
    const gx = Math.round(point.x + 32);
    const gy = Math.round(point.z + 32);

    if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
      mode = 'drop';
      addGrainsAt(gx, gy, grainsPerClick);
    }
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'c') {
    mode = 'center_pile';
    addGrainsAt(32, 32, 100);
  } else if (key === ' ' || e.code === 'Space') {
    e.preventDefault();
    isPaused = !isPaused;
  } else if (key === 'r') {
    resetState();
  } else if (key === '+' || key === '=') {
    grainsPerClick = Math.min(50, grainsPerClick + 1);
  } else if (key === '-') {
    grainsPerClick = Math.max(1, grainsPerClick - 1);
  }
});

// Buttons
document.getElementById('btnReset').addEventListener('click', () => {
  resetState();
});

document.getElementById('btnCenterDrop').addEventListener('click', () => {
  mode = 'center_pile';
  addGrainsAt(32, 32, 100);
});

// Window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// State object
window.__3D_STATE__ = {
  get gridSize() { return GRID_SIZE; },
  get grid() { return grid; },
  get totalGrains() { return computeTotalGrains(); },
  get grainsLost() { return grainsLost; },
  get toppleEvents() { return toppleEvents; },
  get unstableCells() { return countUnstable(); },
  get stepCount() { return stepCount; },
  get isPaused() { return isPaused; },
  get mode() { return mode; },
  get grainsPerClick() { return grainsPerClick; },
  get isAvalancheRunning() { return isAvalancheRunning; },
  get maxHeightOnGrid() { return maxHeightOnGrid; },
  get totalEverAdded() { return totalEverAdded; },
  conservationCheck: function() {
    const tg = computeTotalGrains();
    return {
      totalGrains: tg,
      grainsLost: grainsLost,
      totalEverAdded: totalEverAdded,
      balanced: (tg + grainsLost) === totalEverAdded
    };
  },
  getCell: function(x, y) {
    if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) return grid[x][y];
    return 0;
  },
  addGrains: function(x, y, count) {
    addGrainsAt(x, y, count);
  }
};

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  if (isAvalancheRunning && !isPaused) {
    let stepsThisFrame = 0;
    while (stepsThisFrame < 5) {
      const toppled = toppleStep();
      if (toppled === 0) {
        isAvalancheRunning = false;
        break;
      }
      stepsThisFrame++;
    }
  }

  updateGeometry();
  updateHUD();
  controls.update();
  renderer.render(scene, camera);
}

updateGeometry();
updateHUD();
animate();
</script>
</body>
</html>
