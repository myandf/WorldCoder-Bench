<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leather Material Showcase</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1210; }
canvas { display: block; }
#controlPanel {
  position: fixed;
  top: 15px;
  right: 15px;
  background: rgba(20, 15, 10, 0.85);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 15px;
  font-family: monospace;
  color: #ddd;
  min-width: 220px;
  z-index: 100;
  backdrop-filter: blur(5px);
}
#controlPanel h3 {
  margin-bottom: 12px;
  font-size: 14px;
  color: #f0d8b0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding-bottom: 8px;
}
.slider-group {
  margin-bottom: 10px;
}
.slider-group label {
  display: block;
  font-size: 11px;
  margin-bottom: 3px;
  color: #aaa;
}
.slider-group input[type='range'] {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}
.slider-group input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #c89060;
  cursor: pointer;
}
.color-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
  margin-bottom: 10px;
}
.color-buttons button {
  flex: 1;
  min-width: 45px;
  padding: 5px 8px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px;
  font-family: monospace;
  font-size: 10px;
  color: #ddd;
  cursor: pointer;
  transition: all 0.2s;
}
.color-buttons button:hover {
  border-color: #c89060;
  color: #fff;
}
#colorBrown { background: rgba(115, 64, 31, 0.6); }
#colorBlack { background: rgba(13, 10, 10, 0.6); }
#colorTan { background: rgba(166, 128, 77, 0.6); }
#colorOxblood { background: rgba(89, 20, 20, 0.6); }
#valueDisplay {
  display: block;
  font-size: 10px;
  color: #888;
  margin-top: 8px;
  line-height: 1.6;
}
.key-hint {
  font-size: 10px;
  color: #666;
  margin-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 8px;
  line-height: 1.6;
}
</style>
</head>
<body>

<div id="controlPanel">
  <h3>Leather Material</h3>
  <div class="slider-group">
    <label>Pore Scale</label>
    <input type="range" id="poreScaleSlider" min="10" max="80" step="1" value="40">
  </div>
  <div class="slider-group">
    <label>Pore Depth</label>
    <input type="range" id="poreDepthSlider" min="0" max="100" step="1" value="60">
  </div>
  <div class="slider-group">
    <label>Roughness</label>
    <input type="range" id="roughnessSlider" min="0" max="100" step="1" value="70">
  </div>
  <div class="slider-group">
    <label>Specular</label>
    <input type="range" id="specularSlider" min="0" max="100" step="1" value="35">
  </div>
  <div class="color-buttons">
    <button id="colorBrown">Brown</button>
    <button id="colorBlack">Black</button>
    <button id="colorTan">Tan</button>
    <button id="colorOxblood">Oxblood</button>
  </div>
  <span id="valueDisplay"></span>
  <div class="key-hint">
    Keys: 1=Sphere 2=Box 3=Knot<br>
    A=All R=Reset
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1210);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
mainLight.position.set(5, 5, 5);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x8899bb, 0.4);
fillLight.position.set(-3, -2, 4);
scene.add(fillLight);

const ambientLight = new THREE.AmbientLight(0x332211, 0.3);
scene.add(ambientLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const vertexShader = `
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vWorldPosition;

void main() {
  vUv = uv;
  vNormal = normalize(normalMatrix * normal);
  vec4 worldPos = modelMatrix * vec4(position, 1.0);
  vWorldPosition = worldPos.xyz;
  gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;

const fragmentShader = `
precision highp float;

uniform vec3 baseColor;
uniform float poreScale;
uniform float poreDepth;
uniform float roughness;
uniform float specularIntensity;
uniform vec3 lightPos1;
uniform vec3 lightColor1;
uniform float lightIntensity1;
uniform vec3 lightPos2;
uniform vec3 lightColor2;
uniform float lightIntensity2;
uniform vec3 ambientColor;
uniform float ambientIntensity;
uniform vec3 cameraPos;

varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vWorldPosition;

// Hash functions for procedural noise
float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// Smooth noise
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);

  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));

  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// FBM for leather grain
float fbm(vec2 p) {
  float val = 0.0;
  float amp = 0.5;
  float freq = 1.0;
  for (int i = 0; i < 5; i++) {
    val += amp * noise(p * freq);
    freq *= 2.0;
    amp *= 0.5;
  }
  return val;
}

// Pore pattern - creates circular indentations
float porePattern(vec2 uv, float scale) {
  vec2 cell = floor(uv * scale);
  vec2 localUv = fract(uv * scale);

  float minDist = 1.0;

  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      vec2 neighbor = vec2(float(x), float(y));
      vec2 point = vec2(
        hash(cell + neighbor),
        hash2(cell + neighbor)
      ) * 0.7 + 0.15;

      float dist = length(localUv - neighbor - point);
      float poreSize = 0.08 + hash(cell + neighbor + 100.0) * 0.12;

      float pore = smoothstep(poreSize, poreSize * 0.3, dist);
      minDist = min(minDist, dist);

      if (dist < poreSize) {
        float depth = 1.0 - (dist / poreSize);
        depth = depth * depth;
        minDist = min(minDist, -depth * 0.5);
      }
    }
  }
  return minDist;
}

// Multi-octave pore generation
float leatherPores(vec2 uv, float scale) {
  float pores = 0.0;

  // Large pores
  float p1 = porePattern(uv, scale * 0.5);
  // Medium pores
  float p2 = porePattern(uv + 5.7, scale);
  // Fine pores
  float p3 = porePattern(uv + 11.3, scale * 2.0);

  pores = p1 * 0.5 + p2 * 0.35 + p3 * 0.15;
  return pores;
}

// Normal perturbation from pores
vec3 perturbNormal(vec3 normal, vec2 uv, float scale, float depth) {
  float eps = 0.001;
  float center = leatherPores(uv, scale);
  float dx = leatherPores(uv + vec2(eps, 0.0), scale) - center;
  float dy = leatherPores(uv + vec2(0.0, eps), scale) - center;

  vec3 perturbation = normalize(vec3(dx, dy, 0.0) * depth * 15.0 + vec3(0.0, 0.0, 1.0));

  // Build TBN-like perturbation
  vec3 up = abs(normal.y) < 0.999 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
  vec3 tangent = normalize(cross(up, normal));
  vec3 bitangent = cross(normal, tangent);

  return normalize(
    tangent * perturbation.x +
    bitangent * perturbation.y +
    normal * perturbation.z
  );
}

void main() {
  vec2 uv = vUv;
  vec3 normal = normalize(vNormal);
  vec3 viewDir = normalize(cameraPos - vWorldPosition);

  // Leather pore calculation
  float pores = leatherPores(uv, poreScale);

  // Perturb normal based on pore detail
  vec3 perturbedNormal = perturbNormal(normal, uv, poreScale, poreDepth);

  // Base leather color with pore darkening
  float poreDarken = 1.0 - poreDepth * (1.0 - smoothstep(-0.1, 0.3, pores)) * 0.6;

  // Add subtle grain variation
  float grain = fbm(uv * poreScale * 1.5) * 0.15 + 0.85;

  vec3 leatherColor = baseColor * poreDarken * grain;

  // Add subtle color variation
  float colorVar = fbm(uv * poreScale * 0.3 + 42.0);
  leatherColor *= 0.9 + colorVar * 0.2;

  // Lighting - Blinn-Phong
  vec3 finalColor = leatherColor * ambientColor * ambientIntensity;

  // Specular power from roughness
  float specPower = mix(256.0, 4.0, roughness);

  // Light 1 (main warm)
  {
    vec3 lightDir = normalize(lightPos1 - vWorldPosition);
    float NdotL = max(dot(perturbedNormal, lightDir), 0.0);

    // Diffuse with slight wrap lighting for leather softness
    float diffuse = max(dot(perturbedNormal, lightDir) * 0.5 + 0.5, 0.0);
    diffuse = diffuse * diffuse;

    vec3 halfDir = normalize(lightDir + viewDir);
    float NdotH = max(dot(perturbedNormal, halfDir), 0.0);
    float spec = pow(NdotH, specPower) * specularIntensity;

    // Fresnel-like rim on specular
    float fresnel = pow(1.0 - max(dot(perturbedNormal, viewDir), 0.0), 3.0);
    spec += fresnel * specularIntensity * 0.3;

    finalColor += leatherColor * lightColor1 * lightIntensity1 * diffuse;
    finalColor += lightColor1 * lightIntensity1 * spec;
  }

  // Light 2 (cool fill)
  {
    vec3 lightDir = normalize(lightPos2 - vWorldPosition);
    float diffuse = max(dot(perturbedNormal, lightDir) * 0.5 + 0.5, 0.0);
    diffuse = diffuse * diffuse;

    vec3 halfDir = normalize(lightDir + viewDir);
    float NdotH = max(dot(perturbedNormal, halfDir), 0.0);
    float spec = pow(NdotH, specPower) * specularIntensity * 0.5;

    finalColor += leatherColor * lightColor2 * lightIntensity2 * diffuse;
    finalColor += lightColor2 * lightIntensity2 * spec;
  }

  // Subtle subsurface scattering approximation
  float sss = pow(max(dot(-viewDir, normalize(lightPos1 - vWorldPosition)), 0.0), 3.0);
  finalColor += baseColor * sss * 0.05;

  gl_FragColor = vec4(finalColor, 1.0);
}
`;

const leatherUniforms = {
  baseColor: { value: new THREE.Vector3(0.45, 0.25, 0.12) },
  poreScale: { value: 40.0 },
  poreDepth: { value: 0.6 },
  roughness: { value: 0.7 },
  specularIntensity: { value: 0.35 },
  lightPos1: { value: new THREE.Vector3(5, 5, 5) },
  lightColor1: { value: new THREE.Vector3(1.0, 0.933, 0.867) },
  lightIntensity1: { value: 1.2 },
  lightPos2: { value: new THREE.Vector3(-3, -2, 4) },
  lightColor2: { value: new THREE.Vector3(0.533, 0.6, 0.733) },
  lightIntensity2: { value: 0.4 },
  ambientColor: { value: new THREE.Vector3(0.2, 0.133, 0.067) },
  ambientIntensity: { value: 0.3 },
  cameraPos: { value: new THREE.Vector3() }
};

const leatherMaterial = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: leatherUniforms
});

// Sphere
const sphereGeo = new THREE.SphereGeometry(1.2, 128, 128);
const sphereMesh = new THREE.Mesh(sphereGeo, leatherMaterial);
sphereMesh.visible = true;
scene.add(sphereMesh);

// Box
const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 0.3, 64, 64, 64);
const boxMesh = new THREE.Mesh(boxGeo, leatherMaterial);
boxMesh.position.set(-2.5, 0, 0);
boxMesh.visible = false;
scene.add(boxMesh);

// Torus Knot
const torusKnotGeo = new THREE.TorusKnotGeometry(0.8, 0.3, 128, 32);
const torusKnotMesh = new THREE.Mesh(torusKnotGeo, leatherMaterial);
torusKnotMesh.position.set(2.5, 0, 0);
torusKnotMesh.visible = false;
scene.add(torusKnotMesh);

let activeShape = 'sphere';
let frameCount = 0;

// Default positions
const defaultPositions = {
  sphere: new THREE.Vector3(0, 0, 0),
  box: new THREE.Vector3(-2.5, 0, 0),
  torusknot: new THREE.Vector3(2.5, 0, 0)
};

function showShape(shape) {
  activeShape = shape;
  if (shape === 'sphere') {
    sphereMesh.visible = true;
    boxMesh.visible = false;
    torusKnotMesh.visible = false;
    sphereMesh.position.set(0, 0, 0);
  } else if (shape === 'box') {
    sphereMesh.visible = false;
    boxMesh.visible = true;
    torusKnotMesh.visible = false;
    boxMesh.position.set(0, 0, 0);
  } else if (shape === 'torusknot') {
    sphereMesh.visible = false;
    boxMesh.visible = false;
    torusKnotMesh.visible = true;
    torusKnotMesh.position.set(0, 0, 0);
  } else if (shape === 'all') {
    sphereMesh.visible = true;
    boxMesh.visible = true;
    torusKnotMesh.visible = true;
    sphereMesh.position.copy(defaultPositions.sphere);
    boxMesh.position.copy(defaultPositions.box);
    torusKnotMesh.position.copy(defaultPositions.torusknot);
  }
}

function resetDefaults() {
  leatherUniforms.baseColor.value.set(0.45, 0.25, 0.12);
  leatherUniforms.poreScale.value = 40.0;
  leatherUniforms.poreDepth.value = 0.6;
  leatherUniforms.roughness.value = 0.7;
  leatherUniforms.specularIntensity.value = 0.35;

  document.getElementById('poreScaleSlider').value = 40;
  document.getElementById('poreDepthSlider').value = 60;
  document.getElementById('roughnessSlider').value = 70;
  document.getElementById('specularSlider').value = 35;

  showShape('sphere');
}

// Keyboard controls
window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === '1') showShape('sphere');
  else if (key === '2') showShape('box');
  else if (key === '3') showShape('torusknot');
  else if (key === 'a') showShape('all');
  else if (key === 'r') resetDefaults();
});

// Slider controls
const poreScaleSlider = document.getElementById('poreScaleSlider');
const poreDepthSlider = document.getElementById('poreDepthSlider');
const roughnessSlider = document.getElementById('roughnessSlider');
const specularSlider = document.getElementById('specularSlider');
const valueDisplay = document.getElementById('valueDisplay');

poreScaleSlider.addEventListener('input', () => {
  leatherUniforms.poreScale.value = parseFloat(poreScaleSlider.value);
});
poreDepthSlider.addEventListener('input', () => {
  leatherUniforms.poreDepth.value = parseFloat(poreDepthSlider.value) / 100.0;
});
roughnessSlider.addEventListener('input', () => {
  leatherUniforms.roughness.value = parseFloat(roughnessSlider.value) / 100.0;
});
specularSlider.addEventListener('input', () => {
  leatherUniforms.specularIntensity.value = parseFloat(specularSlider.value) / 100.0;
});

// Color buttons
function setColor(r, g, b) {
  leatherUniforms.baseColor.value.set(r, g, b);
}

document.getElementById('colorBrown').addEventListener('click', () => setColor(0.45, 0.25, 0.12));
document.getElementById('colorBlack').addEventListener('click', () => setColor(0.05, 0.04, 0.04));
document.getElementById('colorTan').addEventListener('click', () => setColor(0.65, 0.50, 0.30));
document.getElementById('colorOxblood').addEventListener('click', () => setColor(0.35, 0.08, 0.08));

// State
window.__3D_STATE__ = {};

function updateState() {
  const bc = leatherUniforms.baseColor.value;
  const dist = camera.position.length();

  window.__3D_STATE__ = {
    activeShape: activeShape,
    poreScale: leatherUniforms.poreScale.value,
    poreDepth: leatherUniforms.poreDepth.value,
    roughness: leatherUniforms.roughness.value,
    specularIntensity: leatherUniforms.specularIntensity.value,
    baseColor: { r: bc.x, g: bc.y, b: bc.z },
    cameraDistance: dist,
    frameCount: frameCount,
    sphereVisible: sphereMesh.visible,
    boxVisible: boxMesh.visible,
    torusKnotVisible: torusKnotMesh.visible,
    lightIntensityMain: mainLight.intensity,
    uniformsSynced: true // All meshes share the same material instance
  };
}

function updateValueDisplay() {
  const bc = leatherUniforms.baseColor.value;
  valueDisplay.textContent =
    `Scale: ${leatherUniforms.poreScale.value.toFixed(0)} | ` +
    `Depth: ${leatherUniforms.poreDepth.value.toFixed(2)} | ` +
    `Rough: ${leatherUniforms.roughness.value.toFixed(2)} | ` +
    `Spec: ${leatherUniforms.specularIntensity.value.toFixed(2)} | ` +
    `Color: (${bc.x.toFixed(2)}, ${bc.y.toFixed(2)}, ${bc.z.toFixed(2)})`;
}

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render loop
function animate() {
  requestAnimationFrame(animate);
  frameCount++;

  // Update camera position uniform
  leatherUniforms.cameraPos.value.copy(camera.position);

  // Subtle rotation
  if (sphereMesh.visible) sphereMesh.rotation.y += 0.003;
  if (boxMesh.visible) boxMesh.rotation.y += 0.003;
  if (torusKnotMesh.visible) torusKnotMesh.rotation.y += 0.003;

  controls.update();
  updateState();
  updateValueDisplay();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
