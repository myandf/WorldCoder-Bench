<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morph Target Face Expression Blender</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    canvas {
      display: block;
    }

    #ui-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 260px;
      padding: 14px;
      background: rgba(10, 10, 20, 0.82);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      box-sizing: border-box;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    #ui-panel h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 700;
    }

    .control {
      margin-bottom: 10px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .control input[type="range"] {
      width: 100%;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    button {
      background: #2f3b63;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #425289;
    }

    button.active {
      background: #5b7cff;
    }

    #total-container {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 14px;
    }

    #total-weight {
      font-weight: bold;
      color: #fff;
    }

    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div id="ui-panel">
    <h2>Expression Blender</h2>

    <div class="control">
      <label for="slider-happy"><span>Happy</span><span id="value-happy">0.00</span></label>
      <input id="slider-happy" type="range" min="0" max="1" step="0.01" value="0" />
    </div>

    <div class="control">
      <label for="slider-sad"><span>Sad</span><span id="value-sad">0.00</span></label>
      <input id="slider-sad" type="range" min="0" max="1" step="0.01" value="0" />
    </div>

    <div class="control">
      <label for="slider-angry"><span>Angry</span><span id="value-angry">0.00</span></label>
      <input id="slider-angry" type="range" min="0" max="1" step="0.01" value="0" />
    </div>

    <div class="control">
      <label for="slider-surprised"><span>Surprised</span><span id="value-surprised">0.00</span></label>
      <input id="slider-surprised" type="range" min="0" max="1" step="0.01" value="0" />
    </div>

    <div class="control">
      <label for="slider-squint"><span>Squint</span><span id="value-squint">0.00</span></label>
      <input id="slider-squint" type="range" min="0" max="1" step="0.01" value="0" />
    </div>

    <div class="button-row">
      <button id="btn-preset-smirk">Preset: Smirk</button>
      <button id="btn-preset-shock">Preset: Shock</button>
    </div>

    <div class="button-row">
      <button id="btn-reset">Reset All</button>
      <button id="btn-undo">Undo</button>
      <button id="btn-redo">Redo</button>
    </div>

    <div class="button-row">
      <button id="btn-animate">Toggle Auto-Animate</button>
    </div>

    <div id="total-container">
      Total Weight: <span id="total-weight">0.00</span>
    </div>

    <div class="hint">Keyboard: Ctrl+Z undo, Ctrl+Y redo</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const EXPRESSION_NAMES = ['happy', 'sad', 'angry', 'surprised', 'squint'];

    const state = {
      happy: 0,
      sad: 0,
      angry: 0,
      surprised: 0,
      squint: 0
    };

    let activePreset = 'none';
    let isAnimating = false;
    const undoStack = [];
    const redoStack = [];

    window.__3D_STATE__ = {
      morphWeights: { ...state },
      totalWeight: 0,
      undoStackSize: 0,
      redoStackSize: 0,
      activePreset: 'none',
      isAnimating: false,
      meshExists: false,
      morphTargetCount: 0,
      totalWeightWarning: false
    };

    const sliders = {
      happy: document.getElementById('slider-happy'),
      sad: document.getElementById('slider-sad'),
      angry: document.getElementById('slider-angry'),
      surprised: document.getElementById('slider-surprised'),
      squint: document.getElementById('slider-squint')
    };

    const valueSpans = {
      happy: document.getElementById('value-happy'),
      sad: document.getElementById('value-sad'),
      angry: document.getElementById('value-angry'),
      surprised: document.getElementById('value-surprised'),
      squint: document.getElementById('value-squint')
    };

    const totalWeightEl = document.getElementById('total-weight');
    const btnPresetSmirk = document.getElementById('btn-preset-smirk');
    const btnPresetShock = document.getElementById('btn-preset-shock');
    const btnReset = document.getElementById('btn-reset');
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const btnAnimate = document.getElementById('btn-animate');

    function getSnapshot() {
      return EXPRESSION_NAMES.map(name => Number(state[name]));
    }

    function applySnapshot(snapshot, presetName = 'none', syncUI = true) {
      EXPRESSION_NAMES.forEach((name, i) => {
        state[name] = THREE.MathUtils.clamp(Number(snapshot[i] ?? 0), 0, 1);
      });
      activePreset = presetName;
      if (syncUI) syncSlidersFromState();
      updateTotalWeightDisplay();
    }

    function pushUndoSnapshot() {
      undoStack.push(getSnapshot());
      redoStack.length = 0;
    }

    function undo() {
      if (undoStack.length === 0) return;
      const previous = undoStack.pop();
      redoStack.push(getSnapshot());
      applySnapshot(previous, 'none', true);
    }

    function redo() {
      if (redoStack.length === 0) return;
      const next = redoStack.pop();
      undoStack.push(getSnapshot());
      applySnapshot(next, 'none', true);
    }

    function setExpression(name, value, options = {}) {
      const {
        pushUndo = true,
        presetName = 'none',
        syncUI = true
      } = options;

      const clamped = THREE.MathUtils.clamp(Number(value), 0, 1);
      if (pushUndo) pushUndoSnapshot();
      state[name] = clamped;
      activePreset = presetName;
      if (syncUI) syncSlidersFromState();
      updateTotalWeightDisplay();
    }

    function setAllExpressions(values, options = {}) {
      const {
        pushUndo = true,
        presetName = 'none',
        syncUI = true
      } = options;

      if (pushUndo) pushUndoSnapshot();
      EXPRESSION_NAMES.forEach((name, i) => {
        state[name] = THREE.MathUtils.clamp(Number(values[i] ?? 0), 0, 1);
      });
      activePreset = presetName;
      if (syncUI) syncSlidersFromState();
      updateTotalWeightDisplay();
    }

    function syncSlidersFromState() {
      EXPRESSION_NAMES.forEach(name => {
        sliders[name].value = state[name].toFixed(2);
        valueSpans[name].textContent = state[name].toFixed(2);
      });
    }

    function updateTotalWeightDisplay() {
      const total = EXPRESSION_NAMES.reduce((sum, name) => sum + state[name], 0);
      const rounded = Number(total.toFixed(2));
      totalWeightEl.textContent = rounded.toFixed(2);
      totalWeightEl.style.color = rounded > 1.5 ? '#ff4444' : '#ffffff';
    }

    EXPRESSION_NAMES.forEach(name => {
      sliders[name].addEventListener('input', (e) => {
        setExpression(name, e.target.value, {
          pushUndo: true,
          presetName: 'none',
          syncUI: true
        });
      });
    });

    btnPresetSmirk.addEventListener('click', () => {
      setAllExpressions([0.6, 0.1, 0.0, 0.0, 0.3], {
        pushUndo: true,
        presetName: 'smirk',
        syncUI: true
      });
    });

    btnPresetShock.addEventListener('click', () => {
      setAllExpressions([0.0, 0.0, 0.2, 0.9, 0.0], {
        pushUndo: true,
        presetName: 'shock',
        syncUI: true
      });
    });

    btnReset.addEventListener('click', () => {
      setAllExpressions([0, 0, 0, 0, 0], {
        pushUndo: true,
        presetName: 'reset',
        syncUI: true
      });
    });

    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    btnAnimate.addEventListener('click', () => {
      isAnimating = !isAnimating;
      btnAnimate.classList.toggle('active', isAnimating);
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && key === 'z') {
        e.preventDefault();
        undo();
      } else if ((e.ctrlKey || e.metaKey) && key === 'y') {
        e.preventDefault();
        redo();
      }
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 3);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(2, 3, 4);
    scene.add(directionalLight);

    const faceGeometry = new THREE.SphereGeometry(1, 64, 64);
    const basePos = faceGeometry.attributes.position;
    const vertexCount = basePos.count;

    function createMorphTarget(modifierFn) {
      const arr = new Float32Array(basePos.array);
      for (let i = 0; i < vertexCount; i++) {
        const ix = i * 3;
        const x = basePos.array[ix];
        const y = basePos.array[ix + 1];
        const z = basePos.array[ix + 2];

        const out = modifierFn(x, y, z, i);
        if (out) {
          arr[ix] = out.x;
          arr[ix + 1] = out.y;
          arr[ix + 2] = out.z;
        }
      }
      return new THREE.Float32BufferAttribute(arr, 3);
    }

    const happyTarget = createMorphTarget((x, y, z) => {
      let nx = x, ny = y, nz = z;
      const inMouth = y < -0.2 && y > -0.6 && Math.abs(x) < 0.4 && z > 0;
      if (inMouth) {
        const curve = 1.0 - Math.abs(x) / 0.4;
        ny += 0.12 * curve;
        nz += 0.10 * curve;
      }
      return { x: nx, y: ny, z: nz };
    });

    const sadTarget = createMorphTarget((x, y, z) => {
      let nx = x, ny = y, nz = z;
      const inMouth = y < -0.2 && y > -0.6 && Math.abs(x) < 0.4 && z > 0;
      if (inMouth) {
        const curve = 1.0 - Math.abs(x) / 0.4;
        ny -= 0.14 * curve;
        nz += 0.04 * curve;
      }
      return { x: nx, y: ny, z: nz };
    });

    const angryTarget = createMorphTarget((x, y, z) => {
      let nx = x, ny = y, nz = z;
      const inBrow = y > 0.4 && y < 0.7 && z > 0;
      if (inBrow) {
        const inward = x > 0 ? -1 : 1;
        const strength = 0.08 * (1.0 - Math.min(Math.abs(x), 1.0));
        nx += inward * strength;
        ny -= 0.08;
        nz += 0.03;
      }
      return { x: nx, y: ny, z: nz };
    });

    const surprisedTarget = createMorphTarget((x, y, z) => {
      let nx = x, ny = y, nz = z;

      const mouthCenterX = 0;
      const mouthCenterY = -0.38;
      const dx = x - mouthCenterX;
      const dy = y - mouthCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const inMouthCircle = dist < 0.22 && z > 0;

      if (inMouthCircle) {
        const factor = (0.22 - dist) / 0.22;
        const invLen = dist > 0.0001 ? 1 / dist : 0;
        nx += dx * invLen * 0.05 * factor;
        ny += dy * invLen * 0.05 * factor;
        nz += 0.20 * factor;
      }

      const inBrow = y > 0.4 && y < 0.75 && z > 0;
      if (inBrow) {
        ny += 0.10 * (1.0 - Math.abs(x) * 0.6);
      }

      return { x: nx, y: ny, z: nz };
    });

    const squintTarget = createMorphTarget((x, y, z) => {
      let nx = x, ny = y, nz = z;
      const inEyeRegion = y > 0.1 && y < 0.4 && Math.abs(x) > 0.15 && Math.abs(x) < 0.5 && z > 0;
      if (inEyeRegion) {
        const eyeCenterX = x > 0 ? 0.32 : -0.32;
        const eyeCenterY = 0.24;
        nx = THREE.MathUtils.lerp(x, eyeCenterX, 0.18);
        ny = THREE.MathUtils.lerp(y, eyeCenterY, 0.35);
        nz -= 0.04;
      }
      return { x: nx, y: ny, z: nz };
    });

    faceGeometry.morphAttributes.position = [
      happyTarget,
      sadTarget,
      angryTarget,
      surprisedTarget,
      squintTarget
    ];

    const faceMaterial = new THREE.MeshStandardMaterial({
      color: '#e0a080',
      roughness: 0.6,
      metalness: 0.1,
      morphTargets: true
    });

    const faceMesh = new THREE.Mesh(faceGeometry, faceMaterial);
    faceMesh.name = 'faceMesh';
    faceMesh.morphTargetInfluences = [0, 0, 0, 0, 0];
    scene.add(faceMesh);

    const clock = new THREE.Clock();

    function updateMeshMorphs() {
      if (!faceMesh.morphTargetInfluences) return;
      faceMesh.morphTargetInfluences[0] = state.happy;
      faceMesh.morphTargetInfluences[1] = state.sad;
      faceMesh.morphTargetInfluences[2] = state.angry;
      faceMesh.morphTargetInfluences[3] = state.surprised;
      faceMesh.morphTargetInfluences[4] = state.squint;
    }

    function updateAnimation() {
      if (!isAnimating) return;
      const t = clock.getElapsedTime();
      state.happy = (Math.sin(t) + 1) * 0.5;
      state.surprised = (Math.cos(t * 0.7) + 1) * 0.25;
      syncSlidersFromState();
      updateTotalWeightDisplay();
    }

    function update3DState() {
      const total = Number(EXPRESSION_NAMES.reduce((sum, name) => sum + state[name], 0).toFixed(2));
      window.__3D_STATE__ = {
        morphWeights: {
          happy: Number(state.happy.toFixed(2)),
          sad: Number(state.sad.toFixed(2)),
          angry: Number(state.angry.toFixed(2)),
          surprised: Number(state.surprised.toFixed(2)),
          squint: Number(state.squint.toFixed(2))
        },
        totalWeight: total,
        undoStackSize: undoStack.length,
        redoStackSize: redoStack.length,
        activePreset,
        isAnimating,
        meshExists: !!scene.getObjectByName('faceMesh'),
        morphTargetCount: faceGeometry.morphAttributes.position?.length || 0,
        totalWeightWarning: total > 1.5
      };
    }

    function animate() {
      requestAnimationFrame(animate);
      updateAnimation();
      updateMeshMorphs();
      controls.update();
      update3DState();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    syncSlidersFromState();
    updateTotalWeightDisplay();
    updateMeshMorphs();
    update3DState();
    animate();
  </script>
</body>
</html>
