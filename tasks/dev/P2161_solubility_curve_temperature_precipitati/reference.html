<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solubility Curve Explorer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #d0e8f0;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
        }
        #chart-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="range"] { width: 100%; }
        button {
            background: #4CAF50; color: white; border: none; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; margin-right: 5px; margin-top: 5px;
        }
        button:hover { background: #45a049; }
        button.remove { background: #f44336; }
        button.remove:hover { background: #da190b; }
        #stats { font-family: monospace; font-size: 0.9rem; color: #333; margin-top: 10px; }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <h2>Solubility Controls</h2>
        <div class="control-group">
            <label for="tempSlider">Temperature (°C): <span id="tempVal">60</span></label>
            <input type="range" id="tempSlider" min="0" max="100" value="60">
        </div>
        <div class="control-group">
            <label>Solute (CrystalX)</label>
            <button id="btnAdd">Add 10g</button>
            <button id="btnRemove" class="remove">Remove 10g</button>
        </div>
        <div id="stats"></div>
    </div>

    <div id="chart-container">
        <canvas id="solubilityChart" width="250" height="180"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- State Management ---
        window.__3D_STATE__ = {
            temperature: 60,
            totalSoluteGrams: 100,
            maxDissolvedGrams: 110,
            dissolvedGrams: 100,
            precipitateGrams: 0,
            precipitateParticleCount: 0,
            isSaturated: false,
            solutionColorHex: '#000000',
            thermometerFillRatio: 0.6,
            modelLoaded: false,
            beakerExists: false,
            chartLabel: 'Unsaturated',
            particlePositions: []
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd0e8f0);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.5, 0);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3D Assets ---
        
        // Lab Bench
        const benchGeo = new THREE.PlaneGeometry(20, 20);
        const benchMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 });
        const bench = new THREE.Mesh(benchGeo, benchMat);
        bench.rotation.x = -Math.PI / 2;
        bench.receiveShadow = true;
        scene.add(bench);

        // Beaker
        const beakerGroup = new THREE.Group();
        scene.add(beakerGroup);
        window.__3D_STATE__.beakerExists = true;

        const beakerGeo = new THREE.CylinderGeometry(1.5, 1.5, 3, 32);
        beakerGeo.translate(0, 1.5, 0); // Base at y=0
        const beakerMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.2,
            roughness: 0.05,
            transmission: 0.9,
            side: THREE.DoubleSide
        });
        const beaker = new THREE.Mesh(beakerGeo, beakerMat);
        beakerGroup.add(beaker);

        // Solution
        const solutionGeo = new THREE.CylinderGeometry(1.45, 1.45, 2.8, 32);
        solutionGeo.translate(0, 1.4, 0);
        const solutionMat = new THREE.MeshStandardMaterial({
            color: 0xaaddff,
            transparent: true,
            opacity: 0.8,
            roughness: 0.2
        });
        const solution = new THREE.Mesh(solutionGeo, solutionMat);
        beakerGroup.add(solution);

        // Thermometer
        const thermoGroup = new THREE.Group();
        thermoGroup.position.set(-2.5, 0, 0);
        scene.add(thermoGroup);

        const tubeGeo = new THREE.CylinderGeometry(0.2, 0.2, 3.2, 16);
        tubeGeo.translate(0, 1.6, 0);
        const tubeMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, transparent: true, opacity: 0.3, transmission: 0.9
        });
        const tube = new THREE.Mesh(tubeGeo, tubeMat);
        thermoGroup.add(tube);

        const fillGeo = new THREE.CylinderGeometry(0.12, 0.12, 1, 16);
        fillGeo.translate(0, 0.5, 0); // Scale from bottom
        const fillMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const thermoFill = new THREE.Mesh(fillGeo, fillMat);
        thermoGroup.add(thermoFill);

        // Precipitate Particles
        const particles = [];
        const particleGeo = new THREE.IcosahedronGeometry(0.05, 0);
        const particleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

        // GLTF Model (Mosquito in Amber - Mock/Fallback)
        const loader = new GLTFLoader();
        // Using a dummy URL to trigger error and use fallback, or load if it magically exists
        loader.load('MosquitoInAmber.glb', (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.6, 0.6, 0.6);
            model.position.set(3.5, 1.5, 0);
            scene.add(model);
            window.__3D_STATE__.modelLoaded = true;
        }, undefined, (error) => {
            // Fallback procedural amber
            const amberGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
            const amberMat = new THREE.MeshPhysicalMaterial({
                color: 0xd4af37, transparent: true, opacity: 0.8, transmission: 0.5, roughness: 0.1
            });
            const amber = new THREE.Mesh(amberGeo, amberMat);
            amber.position.set(3.5, 0.6, 0);
            
            const bugGeo = new THREE.SphereGeometry(0.1);
            const bugMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const bug = new THREE.Mesh(bugGeo, bugMat);
            amber.add(bug);
            
            scene.add(amber);
            window.__3D_STATE__.modelLoaded = true; // Mark loaded even if fallback
        });

        // --- Logic & UI ---
        const tempSlider = document.getElementById('tempSlider');
        const tempValDisplay = document.getElementById('tempVal');
        const btnAdd = document.getElementById('btnAdd');
        const btnRemove = document.getElementById('btnRemove');
        const statsDiv = document.getElementById('stats');
        const chartCanvas = document.getElementById('solubilityChart');
        const ctx = chartCanvas.getContext('2d');

        const colorDilute = new THREE.Color(0xaaddff);
        const colorSaturated = new THREE.Color(0xcc6600);

        function updateState() {
            let state = window.__3D_STATE__;
            state.maxDissolvedGrams = 20 + 1.5 * state.temperature;
            state.dissolvedGrams = Math.min(state.totalSoluteGrams, state.maxDissolvedGrams);
            state.precipitateGrams = Math.max(0, state.totalSoluteGrams - state.maxDissolvedGrams);
            state.isSaturated = state.totalSoluteGrams >= state.maxDissolvedGrams;
            state.chartLabel = state.isSaturated ? 'Saturated / Precipitating' : 'Unsaturated';
            state.thermometerFillRatio = state.temperature / 100;

            // Update UI
            tempValDisplay.textContent = state.temperature;
            statsDiv.innerHTML = `
                Total Solute: ${state.totalSoluteGrams}g<br>
                Max Solubility: ${state.maxDissolvedGrams.toFixed(1)}g<br>
                Dissolved: ${state.dissolvedGrams.toFixed(1)}g<br>
                Precipitate: ${state.precipitateGrams.toFixed(1)}g
            `;

            manageParticles();
            drawChart();
        }

        function manageParticles() {
            let state = window.__3D_STATE__;
            let targetCount = Math.min(60, Math.round(state.precipitateGrams / 2));

            // Add particles
            while (particles.length < targetCount) {
                const p = new THREE.Mesh(particleGeo, particleMat);
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 1.3;
                p.position.set(
                    Math.cos(angle) * radius,
                    2.5 + Math.random(), // Start high
                    Math.sin(angle) * radius
                );
                p.userData.targetY = 0.05 + Math.random() * 0.2;
                beakerGroup.add(p);
                particles.push(p);
            }

            // Remove particles (from top of pile conceptually, just pop array)
            while (particles.length > targetCount) {
                const p = particles.pop();
                beakerGroup.remove(p);
                p.geometry.dispose();
                p.material.dispose();
            }
            state.precipitateParticleCount = particles.length;
        }

        function drawChart() {
            let state = window.__3D_STATE__;
            ctx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
            
            // Axes
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(30, 10); ctx.lineTo(30, 150); // Y
            ctx.lineTo(240, 150); // X
            ctx.stroke();

            // Labels
            ctx.fillStyle = '#333';
            ctx.font = '10px sans-serif';
            ctx.fillText('Solute (g)', 5, 10);
            ctx.fillText('Temp (°C)', 200, 165);
            ctx.fillText('0', 15, 150);
            ctx.fillText('100', 225, 165);
            ctx.fillText('200', 10, 20);

            // Map functions
            const mapX = (t) => 30 + (t / 100) * 210;
            const mapY = (s) => 150 - (s / 200) * 140;

            // Curve
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(mapX(0), mapY(20));
            ctx.lineTo(mapX(100), mapY(170));
            ctx.stroke();

            // Current Point
            const px = mapX(state.temperature);
            const py = mapY(state.totalSoluteGrams);
            
            ctx.fillStyle = state.isSaturated ? '#f44336' : '#2196F3';
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI * 2);
            ctx.fill();

            // Status Text
            ctx.fillStyle = state.isSaturated ? '#f44336' : '#2196F3';
            ctx.font = '12px bold sans-serif';
            ctx.fillText(state.chartLabel, 40, 20);
        }

        // Event Listeners
        tempSlider.addEventListener('input', (e) => {
            window.__3D_STATE__.temperature = parseInt(e.target.value);
            updateState();
        });

        btnAdd.addEventListener('click', () => {
            window.__3D_STATE__.totalSoluteGrams = Math.min(200, window.__3D_STATE__.totalSoluteGrams + 10);
            updateState();
        });

        btnRemove.addEventListener('click', () => {
            window.__3D_STATE__.totalSoluteGrams = Math.max(0, window.__3D_STATE__.totalSoluteGrams - 10);
            updateState();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                window.__3D_STATE__.temperature = Math.min(100, window.__3D_STATE__.temperature + 2);
                tempSlider.value = window.__3D_STATE__.temperature;
                updateState();
            } else if (e.key === 'ArrowLeft') {
                window.__3D_STATE__.temperature = Math.max(0, window.__3D_STATE__.temperature - 2);
                tempSlider.value = window.__3D_STATE__.temperature;
                updateState();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        updateState();

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            let state = window.__3D_STATE__;

            // Animate particles falling
            state.particlePositions = [];
            particles.forEach(p => {
                if (p.position.y > p.userData.targetY) {
                    p.position.y -= 0.05;
                }
                state.particlePositions.push({x: p.position.x, y: p.position.y, z: p.position.z});
            });

            // Update Solution Color
            const saturationRatio = Math.min(1, state.totalSoluteGrams / state.maxDissolvedGrams);
            solutionMat.color.lerpColors(colorDilute, colorSaturated, saturationRatio);
            state.solutionColorHex = '#' + solutionMat.color.getHexString();

            // Update Thermometer
            const targetFillHeight = 3 * state.thermometerFillRatio;
            thermoFill.scale.y = THREE.MathUtils.lerp(thermoFill.scale.y, Math.max(0.01, targetFillHeight), 0.1);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
