<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Vignette Post Processing Difficulty Demo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: monospace;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.7);
      user-select: none;
      line-height: 1.4;
    }

    #hud .stats {
      margin-bottom: 10px;
      white-space: pre-line;
    }

    #hud .buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 180px;
    }

    #hud button {
      font-family: monospace;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(20,20,20,0.65);
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }

    #hud button:hover {
      background: rgba(50,50,50,0.8);
    }

    #hud button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="stats" id="hud-stats"></div>
    <div class="buttons">
      <button id="btn-diff-up">Increase Difficulty</button>
      <button id="btn-diff-down">Decrease Difficulty</button>
      <button id="btn-toggle">Toggle Vignette</button>
      <button id="btn-reset">Reset</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101318);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    const textureCanvas = document.createElement('canvas');
    textureCanvas.width = 256;
    textureCanvas.height = 256;
    const tx = textureCanvas.getContext('2d');

    tx.fillStyle = '#4488cc';
    tx.fillRect(0, 0, 256, 256);
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        if ((x + y) % 2 === 0) {
          tx.fillStyle = 'rgba(255,255,255,0.10)';
          tx.fillRect(x * 32, y * 32, 32, 32);
        }
      }
    }
    tx.strokeStyle = 'rgba(255,255,255,0.25)';
    tx.lineWidth = 6;
    tx.strokeRect(3, 3, 250, 250);

    const cubeTexture = new THREE.CanvasTexture(textureCanvas);
    cubeTexture.colorSpace = THREE.SRGBColorSpace;
    cubeTexture.wrapS = THREE.RepeatWrapping;
    cubeTexture.wrapT = THREE.RepeatWrapping;

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({
        color: '#4488cc',
        map: cubeTexture
      })
    );
    cube.position.set(0, 0.5, 0);
    scene.add(cube);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({ color: '#888888' })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const torusKnot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.6, 0.2, 64, 16),
      new THREE.MeshStandardMaterial({ color: '#cc4444' })
    );
    torusKnot.position.set(2, 1, -1);
    scene.add(torusKnot);

    let renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
      depthBuffer: true
    });
    renderTarget.texture.colorSpace = THREE.SRGBColorSpace;

    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const postUniforms = {
      tDiffuse: { value: renderTarget.texture },
      uRadius: { value: 0.75 },
      uSoftness: { value: 0.45 },
      uIntensity: { value: 1.0 },
      uColor: { value: new THREE.Color(0x000000) }
    };

    const postMaterial = new THREE.ShaderMaterial({
      uniforms: postUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uRadius;
        uniform float uSoftness;
        uniform float uIntensity;
        uniform vec3 uColor;
        varying vec2 vUv;

        void main() {
          vec4 sceneColor = texture2D(tDiffuse, vUv);
          float dist = distance(vUv, vec2(0.5, 0.5));
          float vignetteFactor = smoothstep(uRadius, uRadius - uSoftness, dist);
          vec3 vig = mix(uColor, vec3(1.0), vignetteFactor * uIntensity);
          vec3 finalColor = clamp(sceneColor.rgb * vig, 0.0, 1.0);
          gl_FragColor = vec4(finalColor, sceneColor.a);
        }
      `
    });

    const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
    postScene.add(postQuad);

    let difficulty = 1;
    let vignetteEnabled = true;
    let frameCount = 0;

    const hudStats = document.getElementById('hud-stats');
    const btnDiffUp = document.getElementById('btn-diff-up');
    const btnDiffDown = document.getElementById('btn-diff-down');
    const btnToggle = document.getElementById('btn-toggle');
    const btnReset = document.getElementById('btn-reset');

    function difficultyToRadius(level) {
      return 0.75 - (level - 1) * 0.1;
    }

    function difficultyToSoftness(level) {
      return 0.45 - (level - 1) * 0.05;
    }

    function applyDifficulty() {
      postUniforms.uRadius.value = difficultyToRadius(difficulty);
      postUniforms.uSoftness.value = difficultyToSoftness(difficulty);
      postUniforms.uIntensity.value = vignetteEnabled ? 1.0 : 0.0;
    }

    function updateHUD() {
      hudStats.textContent =
        `Difficulty: ${difficulty}\n` +
        `Radius: ${postUniforms.uRadius.value.toFixed(2)}\n` +
        `Softness: ${postUniforms.uSoftness.value.toFixed(2)}\n` +
        `Vignette: ${vignetteEnabled ? 'ON' : 'OFF'}`;
    }

    function increaseDifficulty() {
      difficulty = Math.min(5, difficulty + 1);
      applyDifficulty();
      updateHUD();
    }

    function decreaseDifficulty() {
      difficulty = Math.max(1, difficulty - 1);
      applyDifficulty();
      updateHUD();
    }

    function toggleVignette() {
      vignetteEnabled = !vignetteEnabled;
      applyDifficulty();
      updateHUD();
    }

    function resetState() {
      difficulty = 1;
      vignetteEnabled = true;
      applyDifficulty();
      updateHUD();
    }

    btnDiffUp.addEventListener('click', increaseDifficulty);
    btnDiffDown.addEventListener('click', decreaseDifficulty);
    btnToggle.addEventListener('click', toggleVignette);
    btnReset.addEventListener('click', resetState);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        increaseDifficulty();
      } else if (e.key === 'ArrowDown') {
        decreaseDifficulty();
      } else if (e.key === 'v' || e.key === 'V') {
        toggleVignette();
      } else if (e.key === 'r' || e.key === 'R') {
        resetState();
      }
    });

    window.__3D_STATE__ = {
      difficulty: difficulty,
      radius: postUniforms.uRadius.value,
      softness: postUniforms.uSoftness.value,
      intensity: postUniforms.uIntensity.value,
      vignetteEnabled: vignetteEnabled,
      cubeRotationY: cube.rotation.y,
      frameCount: frameCount,
      sceneObjectCount: scene.children.length,
      renderTargetWidth: renderTarget.width,
      renderTargetHeight: renderTarget.height
    };

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);

      renderTarget.dispose();
      renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
        depthBuffer: true
      });
      renderTarget.texture.colorSpace = THREE.SRGBColorSpace;
      postUniforms.tDiffuse.value = renderTarget.texture;
    }

    window.addEventListener('resize', onResize);

    applyDifficulty();
    updateHUD();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      cube.rotation.y += 0.5 * delta;
      torusKnot.rotation.x += 0.35 * delta;
      torusKnot.rotation.y += 0.6 * delta;

      postUniforms.uRadius.value = difficultyToRadius(difficulty);
      postUniforms.uSoftness.value = difficultyToSoftness(difficulty);
      postUniforms.uIntensity.value = vignetteEnabled ? 1.0 : 0.0;

      renderer.setRenderTarget(renderTarget);
      renderer.render(scene, camera);

      renderer.setRenderTarget(null);
      renderer.render(postScene, postCamera);

      frameCount++;

      window.__3D_STATE__.difficulty = difficulty;
      window.__3D_STATE__.radius = postUniforms.uRadius.value;
      window.__3D_STATE__.softness = postUniforms.uSoftness.value;
      window.__3D_STATE__.intensity = postUniforms.uIntensity.value;
      window.__3D_STATE__.vignetteEnabled = vignetteEnabled;
      window.__3D_STATE__.cubeRotationY = cube.rotation.y;
      window.__3D_STATE__.frameCount = frameCount;
      window.__3D_STATE__.sceneObjectCount = scene.children.length;
      window.__3D_STATE__.renderTargetWidth = renderTarget.width;
      window.__3D_STATE__.renderTargetHeight = renderTarget.height;

      updateHUD();
    }

    animate();
  </script>
</body>
</html>
