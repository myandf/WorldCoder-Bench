<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iron Rusting Lab Experiment</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 220px;
      z-index: 10;
      backdrop-filter: blur(4px);
      line-height: 1.5;
      font-size: 14px;
    }

    #control-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px;
      backdrop-filter: blur(4px);
      width: 180px;
    }

    #control-panel button {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #2f3b52;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s, transform 0.1s;
    }

    #control-panel button:hover {
      background: #42506b;
    }

    #control-panel button:active {
      transform: scale(0.98);
    }

    .sample-label {
      position: absolute;
      transform: translate(-50%, -50%);
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 9;
      white-space: nowrap;
    }

    #analysis-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 20, 0.92);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 20px 24px;
      z-index: 20;
      min-width: 320px;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    #analysis-overlay h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    #analysis-overlay .row {
      margin: 8px 0;
      font-size: 16px;
    }

    #analysis-overlay .verdict {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: #ffd27f;
      font-weight: bold;
    }

    #analysis-close {
      margin-top: 16px;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #5a3d2b;
      color: white;
      cursor: pointer;
    }

    #help {
      position: absolute;
      bottom: 12px;
      left: 14px;
      z-index: 10;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.3);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud"></div>

    <div id="control-panel">
      <button id="btn-add-oxygen">Add Oxygen</button>
      <button id="btn-add-water">Add Water</button>
      <button id="btn-start-reaction">Start Reaction</button>
      <button id="btn-speed-up">Speed Up (2x)</button>
      <button id="btn-analyze">Analyze Samples</button>
      <button id="btn-reset">Reset Experiment</button>
    </div>

    <div id="label-a" class="sample-label">Sample A</div>
    <div id="label-b" class="sample-label">Sample B</div>
    <div id="label-c" class="sample-label">Sample C</div>

    <div id="analysis-overlay">
      <h2>Sample Analysis</h2>
      <div class="row" id="analysis-a">Sample A rust%: 0%</div>
      <div class="row" id="analysis-b">Sample B rust%: 0%</div>
      <div class="row" id="analysis-c">Sample C rust%: 0%</div>
      <div class="verdict" id="analysis-verdict">Verdict pending.</div>
      <button id="analysis-close">Close</button>
    </div>

    <div id="help">Keys: O = Oxygen, W = Water, Space = Start/Pause, R = Reset</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const app = document.getElementById('app');
    const hud = document.getElementById('hud');
    const analysisOverlay = document.getElementById('analysis-overlay');
    const analysisA = document.getElementById('analysis-a');
    const analysisB = document.getElementById('analysis-b');
    const analysisC = document.getElementById('analysis-c');
    const analysisVerdictEl = document.getElementById('analysis-verdict');

    const btnOxygen = document.getElementById('btn-add-oxygen');
    const btnWater = document.getElementById('btn-add-water');
    const btnStart = document.getElementById('btn-start-reaction');
    const btnReset = document.getElementById('btn-reset');
    const btnSpeed = document.getElementById('btn-speed-up');
    const btnAnalyze = document.getElementById('btn-analyze');
    const btnAnalysisClose = document.getElementById('analysis-close');

    const labelA = document.getElementById('label-a');
    const labelB = document.getElementById('label-b');
    const labelC = document.getElementById('label-c');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    const bench = new THREE.Mesh(
      new THREE.BoxGeometry(10, 0.2, 6),
      new THREE.MeshStandardMaterial({ color: '#5c4033' })
    );
    bench.position.set(0, 0, 0);
    bench.receiveShadow = true;
    scene.add(bench);

    const gridHelper = new THREE.GridHelper(10, 10, 0x333344, 0x222233);
    gridHelper.position.y = 0.101;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.15;
    scene.add(gridHelper);

    const ironGray = new THREE.Color('#808080');
    const rustMid = new THREE.Color('#8B4513');
    const rustDeep = new THREE.Color('#6B2A0A');

    function createSample(x) {
      const material = new THREE.MeshStandardMaterial({
        color: ironGray.clone(),
        metalness: 0.7,
        roughness: 0.35
      });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), material);
      mesh.position.set(x, 0.6, 0);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const sampleMeshA = createSample(-3);
    const sampleMeshB = createSample(0);
    const sampleMeshC = createSample(3);

    const sampleData = {
      A: { rustPercent: 0, hasOxygen: false, hasWater: false, mesh: sampleMeshA, lastParticleThreshold: 0 },
      B: { rustPercent: 0, hasOxygen: false, hasWater: false, mesh: sampleMeshB, lastParticleThreshold: 0 },
      C: { rustPercent: 0, hasOxygen: false, hasWater: false, mesh: sampleMeshC, lastParticleThreshold: 0 }
    };

    const particles = [];
    let totalParticlesEmitted = 0;

    const particleGroup = new THREE.Group();
    scene.add(particleGroup);

    const state = {
      oxygenOn: false,
      waterOn: false,
      reactionState: 'idle',
      speedMultiplier: 1,
      timeElapsed: 0,
      analysisVisible: false,
      analysisVerdict: ''
    };

    function safeNumber(v, fallback = 0) {
      return Number.isFinite(v) ? v : fallback;
    }

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, safeNumber(v, min)));
    }

    function colorToHexString(color) {
      return '#' + color.getHexString();
    }

    function interpolateRustColor(percent) {
      const p = clamp(percent, 0, 100);
      const t = p / 100;
      const color = new THREE.Color();
      if (t <= 0.5) {
        color.copy(ironGray).lerp(rustMid, t / 0.5);
      } else {
        color.copy(rustMid).lerp(rustDeep, (t - 0.5) / 0.5);
      }
      return color;
    }

    function updateSampleEnvironments() {
      sampleData.A.hasOxygen = state.oxygenOn;
      sampleData.A.hasWater = false;

      sampleData.B.hasOxygen = false;
      sampleData.B.hasWater = state.waterOn;

      sampleData.C.hasOxygen = state.oxygenOn;
      sampleData.C.hasWater = state.waterOn;
    }

    function applySampleVisuals() {
      Object.values(sampleData).forEach(sample => {
        const color = interpolateRustColor(sample.rustPercent);
        sample.mesh.material.color.copy(color);
        sample.mesh.material.metalness = 0.7 - 0.5 * (sample.rustPercent / 100);
        sample.mesh.material.roughness = 0.35 + 0.45 * (sample.rustPercent / 100);
      });
    }

    function randomSurfacePointOnCube(mesh) {
      const half = 0.5;
      const face = Math.floor(Math.random() * 6);
      let x = 0, y = 0, z = 0;

      const r = () => (Math.random() - 0.5) * 1.0;

      if (face === 0) { x = half; y = r(); z = r(); }
      if (face === 1) { x = -half; y = r(); z = r(); }
      if (face === 2) { x = r(); y = half; z = r(); }
      if (face === 3) { x = r(); y = -half; z = r(); }
      if (face === 4) { x = r(); y = r(); z = half; }
      if (face === 5) { x = r(); y = r(); z = -half; }

      return new THREE.Vector3(x, y, z).add(mesh.position);
    }

    function createParticle(position) {
      if (particles.length >= 200) {
        const oldest = particles.shift();
        if (oldest) {
          particleGroup.remove(oldest.mesh);
          oldest.mesh.geometry.dispose();
          oldest.mesh.material.dispose();
        }
      }

      const color = new THREE.Color().setHSL(0.08 + Math.random() * 0.04, 0.65, 0.42 + Math.random() * 0.08);
      const geometry = new THREE.SphereGeometry(0.03, 8, 8);
      const material = new THREE.MeshStandardMaterial({
        color,
        transparent: true,
        opacity: 0.95,
        roughness: 0.8,
        metalness: 0.05
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(position);
      particleGroup.add(mesh);

      particles.push({
        mesh,
        age: 0,
        life: 1.5,
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 0.18,
          0.5 + Math.random() * 1.0,
          (Math.random() - 0.5) * 0.18
        )
      });

      totalParticlesEmitted++;
    }

    function emitRustParticlesForSampleC() {
      const count = 8 + Math.floor(Math.random() * 5);
      for (let i = 0; i < count; i++) {
        createParticle(randomSurfacePointOnCube(sampleData.C.mesh));
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age += dt;
        p.mesh.position.addScaledVector(p.velocity, dt);
        p.mesh.material.opacity = clamp(1 - p.age / p.life, 0, 1);

        if (p.age >= p.life) {
          particleGroup.remove(p.mesh);
          p.mesh.geometry.dispose();
          p.mesh.material.dispose();
          particles.splice(i, 1);
        }
      }
    }

    function resetExperiment() {
      state.oxygenOn = false;
      state.waterOn = false;
      state.reactionState = 'idle';
      state.speedMultiplier = 1;
      state.timeElapsed = 0;
      state.analysisVisible = false;
      state.analysisVerdict = '';

      Object.values(sampleData).forEach(sample => {
        sample.rustPercent = 0;
        sample.lastParticleThreshold = 0;
      });

      while (particles.length) {
        const p = particles.pop();
        particleGroup.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mesh.material.dispose();
      }

      totalParticlesEmitted = 0;
      analysisOverlay.style.display = 'none';

      updateSampleEnvironments();
      applySampleVisuals();
      updateControlPanel();
      updateHUD();
      updateAnalysis();
      update3DState();
    }

    function updateReaction(dt) {
      if (state.reactionState !== 'running') return;

      const scaledDt = dt * state.speedMultiplier;
      state.timeElapsed = safeNumber(state.timeElapsed + scaledDt, 0);

      Object.values(sampleData).forEach(sample => {
        const canRust = sample.hasOxygen && sample.hasWater;
        if (canRust) {
          sample.rustPercent = clamp(sample.rustPercent + (scaledDt / 10) * 100, 0, 100);
        }
      });

      const c = sampleData.C;
      const thresholdNow = Math.floor(clamp(c.rustPercent, 0, 100) / 10) * 10;
      while (thresholdNow > c.lastParticleThreshold && c.lastParticleThreshold < 100) {
        c.lastParticleThreshold += 10;
        emitRustParticlesForSampleC();
      }

      if (sampleData.C.rustPercent >= 100) {
        state.reactionState = 'complete';
      }

      applySampleVisuals();
    }

    function updateControlPanel() {
      btnOxygen.textContent = state.oxygenOn ? 'Remove Oxygen' : 'Add Oxygen';
      btnWater.textContent = state.waterOn ? 'Remove Water' : 'Add Water';
      btnStart.textContent =
        state.reactionState === 'running' ? 'Pause Reaction' : 'Start Reaction';

      const nextSpeed = state.speedMultiplier === 1 ? 2 : state.speedMultiplier === 2 ? 4 : 1;
      btnSpeed.textContent = `Speed Up (${nextSpeed}x)`;

      btnOxygen.style.background = state.oxygenOn ? '#2d6a4f' : '#2f3b52';
      btnWater.style.background = state.waterOn ? '#1d4e89' : '#2f3b52';
      btnStart.style.background = state.reactionState === 'running' ? '#8a5a00' : '#2f3b52';
    }

    function updateHUD() {
      hud.innerHTML = `
        <div><strong>Oxygen:</strong> ${state.oxygenOn ? 'ON' : 'OFF'}</div>
        <div><strong>Water:</strong> ${state.waterOn ? 'ON' : 'OFF'}</div>
        <div><strong>Reaction:</strong> ${String(state.reactionState).toUpperCase()}</div>
        <div><strong>Speed:</strong> ${safeNumber(state.speedMultiplier, 1)}x</div>
        <div><strong>Time Elapsed:</strong> ${safeNumber(state.timeElapsed, 0).toFixed(1)}s</div>
        <div><strong>Sample C Rust:</strong> ${Math.round(clamp(sampleData.C.rustPercent, 0, 100))}%</div>
      `;
    }

    function updateAnalysis() {
      const a = Math.round(clamp(sampleData.A.rustPercent, 0, 100));
      const b = Math.round(clamp(sampleData.B.rustPercent, 0, 100));
      const c = Math.round(clamp(sampleData.C.rustPercent, 0, 100));

      analysisA.textContent = `Sample A rust%: ${a}%`;
      analysisB.textContent = `Sample B rust%: ${b}%`;
      analysisC.textContent = `Sample C rust%: ${c}%`;

      let verdict = 'No conclusion yet.';
      if (c > 0 && a === 0 && b === 0) {
        verdict = 'Rust requires both O₂ and H₂O';
      } else if (c === 0 && a === 0 && b === 0) {
        verdict = 'No rust observed yet. Both oxygen and water are needed together.';
      } else {
        verdict = 'Observed data should show rust only where both O₂ and H₂O are present.';
      }

      state.analysisVerdict = verdict;
      analysisVerdictEl.textContent = verdict;
    }

    function worldToScreen(obj, yOffset = 1.1) {
      const vector = obj.position.clone();
      vector.y += yOffset;
      vector.project(camera);

      return {
        x: (vector.x * 0.5 + 0.5) * window.innerWidth,
        y: (-vector.y * 0.5 + 0.5) * window.innerHeight
      };
    }

    function updateLabels() {
      const aPos = worldToScreen(sampleData.A.mesh);
      const bPos = worldToScreen(sampleData.B.mesh);
      const cPos = worldToScreen(sampleData.C.mesh);

      labelA.style.left = `${aPos.x}px`;
      labelA.style.top = `${aPos.y}px`;

      labelB.style.left = `${bPos.x}px`;
      labelB.style.top = `${bPos.y}px`;

      labelC.style.left = `${cPos.x}px`;
      labelC.style.top = `${cPos.y}px`;
    }

    function update3DState() {
      const aColor = colorToHexString(sampleData.A.mesh.material.color);
      const bColor = colorToHexString(sampleData.B.mesh.material.color);
      const cColor = colorToHexString(sampleData.C.mesh.material.color);

      window.__3D_STATE__ = {
        oxygenOn: !!state.oxygenOn,
        waterOn: !!state.waterOn,
        reactionState: ['idle', 'running', 'paused', 'complete'].includes(state.reactionState) ? state.reactionState : 'idle',
        speedMultiplier: [1,2,4].includes(state.speedMultiplier) ? state.speedMultiplier : 1,
        timeElapsed: clamp(state.timeElapsed, 0, 1e9),
        sampleA: {
          rustPercent: clamp(sampleData.A.rustPercent, 0, 100),
          hasOxygen: !!sampleData.A.hasOxygen,
          hasWater: !!sampleData.A.hasWater,
          color: aColor
        },
        sampleB: {
          rustPercent: clamp(sampleData.B.rustPercent, 0, 100),
          hasOxygen: !!sampleData.B.hasOxygen,
          hasWater: !!sampleData.B.hasWater,
          color: bColor
        },
        sampleC: {
          rustPercent: clamp(sampleData.C.rustPercent, 0, 100),
          hasOxygen: !!sampleData.C.hasOxygen,
          hasWater: !!sampleData.C.hasWater,
          color: cColor
        },
        particleCount: clamp(particles.length, 0, 200),
        totalParticlesEmitted: clamp(totalParticlesEmitted, 0, 1e9),
        analysisVisible: !!state.analysisVisible,
        analysisVerdict: String(state.analysisVerdict || '')
      };
    }

    function toggleOxygen() {
      state.oxygenOn = !state.oxygenOn;
      updateSampleEnvironments();
      updateControlPanel();
      updateHUD();
      updateAnalysis();
    }

    function toggleWater() {
      state.waterOn = !state.waterOn;
      updateSampleEnvironments();
      updateControlPanel();
      updateHUD();
      updateAnalysis();
    }

    function startPauseReaction() {
      if (state.reactionState === 'idle') {
        state.reactionState = 'running';
      } else if (state.reactionState === 'running') {
        state.reactionState = 'paused';
      } else if (state.reactionState === 'paused') {
        state.reactionState = 'running';
      } else if (state.reactionState === 'complete') {
        state.reactionState = 'complete';
      }
      updateControlPanel();
      updateHUD();
    }

    function cycleSpeed() {
      state.speedMultiplier = state.speedMultiplier === 1 ? 2 : state.speedMultiplier === 2 ? 4 : 1;
      updateControlPanel();
      updateHUD();
    }

    function showAnalysis() {
      state.analysisVisible = true;
      updateAnalysis();
      analysisOverlay.style.display = 'block';
    }

    function hideAnalysis() {
      state.analysisVisible = false;
      analysisOverlay.style.display = 'none';
    }

    btnOxygen.addEventListener('click', toggleOxygen);
    btnWater.addEventListener('click', toggleWater);
    btnStart.addEventListener('click', startPauseReaction);
    btnReset.addEventListener('click', resetExperiment);
    btnSpeed.addEventListener('click', cycleSpeed);
    btnAnalyze.addEventListener('click', showAnalysis);
    btnAnalysisClose.addEventListener('click', hideAnalysis);

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;

      const key = e.key.toLowerCase();
      if (key === 'o') toggleOxygen();
      if (key === 'w') toggleWater();
      if (key === 'r') resetExperiment();

      if (e.code === 'Space') {
        e.preventDefault();
        startPauseReaction();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateLabels();
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clamp(clock.getDelta(), 0, 0.1);

      updateReaction(dt);
      updateParticles(dt);

      sampleData.A.mesh.rotation.y += dt * 0.2;
      sampleData.B.mesh.rotation.y += dt * 0.2;
      sampleData.C.mesh.rotation.y += dt * 0.2;

      updateLabels();
      updateHUD();
      if (state.analysisVisible) updateAnalysis();
      update3DState();

      renderer.render(scene, camera);
    }

    updateSampleEnvironments();
    applySampleVisuals();
    updateControlPanel();
    updateHUD();
    updateAnalysis();
    update3DState();
    animate();
  </script>
</body>
</html>
