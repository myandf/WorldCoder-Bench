<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Electronegativity & Bond Polarity Explorer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        #ui-container { position: absolute; top: 20px; left: 20px; width: 300px; background: rgba(20, 20, 40, 0.85); padding: 20px; border-radius: 12px; border: 1px solid #445; pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        input[type="range"] { width: 100%; cursor: pointer; }
        select { width: 100%; padding: 8px; background: #1a1a2e; color: white; border: 1px solid #556; border-radius: 4px; cursor: pointer; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #3a3a5e; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4a4a7e; }
        #info-panel { position: absolute; top: 20px; right: 20px; background: rgba(20, 20, 40, 0.85); padding: 15px; border-radius: 12px; border: 1px solid #445; min-width: 200px; }
        .info-item { margin-bottom: 8px; font-size: 0.95em; }
        .info-label { color: #aaa; font-size: 0.85em; }
        .info-value { font-weight: bold; color: #00ffcc; }
        #bond-label-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 2em; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.8); pointer-events: none; }
        .label-tag { position: absolute; pointer-events: none; transform: translate(-50%, -50%); text-align: center; font-weight: bold; text-shadow: 1px 1px 2px black; }
        .charge-tag { font-size: 1.2em; color: #ffdd00; }
        .symbol-tag { font-size: 1.4em; }
        kbd { background: #333; padding: 2px 5px; border-radius: 3px; font-size: 0.8em; }
        .hotkeys { margin-top: 15px; font-size: 0.75em; color: #888; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h2 style="margin-top:0">Bond Explorer</h2>
        
        <div class="control-group">
            <label>Presets</label>
            <select id="preset-select">
                <option value="custom">Custom</option>
                <option value="H-Cl">H-Cl (Polar Covalent)</option>
                <option value="H-F">H-F (Polar Covalent)</option>
                <option value="C-O">C-O (Polar Covalent)</option>
                <option value="Na-Cl">Na-Cl (Ionic)</option>
                <option value="C-C">C-C (Nonpolar)</option>
                <option value="O-H">O-H (Polar Covalent)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Atom A Electronegativity: <span id="en-a-val">2.1</span></label>
            <input type="range" id="en-a-slider" min="0.7" max="4.0" step="0.1" value="2.1">
        </div>

        <div class="control-group">
            <label>Atom B Electronegativity: <span id="en-b-val">3.5</span></label>
            <input type="range" id="en-b-slider" min="0.7" max="4.0" step="0.1" value="3.5">
        </div>

        <button id="toggle-cloud">Toggle Electron Cloud</button>
        <button id="reset-view">Reset View</button>

        <div class="hotkeys">
            <kbd>A</kbd>/<kbd>Z</kbd>: Atom A EN | <kbd>S</kbd>/<kbd>X</kbd>: Atom B EN<br>
            <kbd>Space</kbd>: Toggle Cloud | <kbd>R</kbd>: Reset EN
        </div>
    </div>

    <div id="info-panel">
        <div class="info-item"><span class="info-label">ΔEN:</span> <span id="delta-en-val" class="info-value">1.40</span></div>
        <div class="info-item"><span class="info-label">Dipole Moment:</span> <span id="dipole-val" class="info-value">1.12</span></div>
        <div class="info-item"><span class="info-label">Partial Charge (δ):</span> <span id="charge-val" class="info-value">0.42</span></div>
    </div>

    <div id="bond-label-overlay">Polar Covalent</div>

    <!-- Floating Labels -->
    <div id="label-a" class="label-tag"><div class="symbol-tag">A</div><div class="charge-tag">δ+</div></div>
    <div id="label-b" class="label-tag"><div class="symbol-tag">B</div><div class="charge-tag">δ-</div></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration & State ---
        const state = {
            atomA_EN: 2.1,
            atomB_EN: 3.5,
            delta_EN: 1.4,
            bond_type: 'Polar Covalent',
            dipole_length: 1.12,
            partial_charge: 0.42,
            cloud_visible: true,
            cloud_center_offset: 0,
            cloud_particle_count: 60,
            atomA_position: { x: -2, y: 0, z: 0 },
            atomB_position: { x: 2, y: 0, z: 0 },
            dipole_direction: 'A_to_B',
            selected_preset: 'custom',
            camera_distance: 8,
            atomA_color_hue: 0,
            atomB_color_hue: 0
        };
        window.__3D_STATE__ = state;

        const presets = {
            'H-Cl': { a: 2.1, b: 3.0, symA: 'H', symB: 'Cl' },
            'H-F': { a: 2.1, b: 4.0, symA: 'H', symB: 'F' },
            'C-O': { a: 2.5, b: 3.5, symA: 'C', symB: 'O' },
            'Na-Cl': { a: 0.9, b: 3.0, symA: 'Na', symB: 'Cl' },
            'C-C': { a: 2.5, b: 2.5, symA: 'C', symB: 'C' },
            'O-H': { a: 3.5, b: 2.1, symA: 'O', symB: 'H' }
        };

        let currentSymA = 'A';
        let currentSymB = 'B';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x334455, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 8, 5);
        scene.add(dirLight);

        // --- Objects ---
        const atomGeometry = new THREE.SphereGeometry(0.6, 32, 32);
        
        const atomA = new THREE.Mesh(atomGeometry, new THREE.MeshPhongMaterial());
        atomA.position.set(-2, 0, 0);
        scene.add(atomA);

        const atomB = new THREE.Mesh(atomGeometry, new THREE.MeshPhongMaterial());
        atomB.position.set(2, 0, 0);
        scene.add(atomB);

        const bondGeometry = new THREE.CylinderGeometry(0.12, 0.12, 4, 16);
        bondGeometry.rotateZ(Math.PI / 2);
        const bondMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
        const bond = new THREE.Mesh(bondGeometry, bondMaterial);
        scene.add(bond);

        // Dipole Arrow
        const dipoleGroup = new THREE.Group();
        const arrowShaftGeom = new THREE.CylinderGeometry(0.04, 0.04, 1, 8);
        arrowShaftGeom.rotateZ(Math.PI / 2);
        const arrowShaft = new THREE.Mesh(arrowShaftGeom, new THREE.MeshBasicMaterial({ color: 0xffdd00, transparent: true }));
        
        const arrowHeadGeom = new THREE.ConeGeometry(0.12, 0.3, 16);
        arrowHeadGeom.rotateZ(-Math.PI / 2);
        const arrowHead = new THREE.Mesh(arrowHeadGeom, new THREE.MeshBasicMaterial({ color: 0xffdd00, transparent: true }));
        
        dipoleGroup.add(arrowShaft);
        dipoleGroup.add(arrowHead);
        scene.add(dipoleGroup);

        // Electron Cloud
        const cloudGroup = new THREE.Group();
        const cloudParticles = [];
        const particleGeom = new THREE.SphereGeometry(0.08, 8, 8);
        for (let i = 0; i < 60; i++) {
            const mat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.35 });
            const p = new THREE.Mesh(particleGeom, mat);
            p.userData.basePos = new THREE.Vector3();
            p.userData.phase = Math.random() * Math.PI * 2;
            cloudParticles.push(p);
            cloudGroup.add(p);
        }
        scene.add(cloudGroup);

        // --- Logic ---
        function getENColor(en) {
            // Pauling scale 0.7 to 4.0
            // 0.7 -> Deep Blue (HSL 230, 80%, 50%)
            // 4.0 -> Deep Red (HSL 0, 80%, 50%)
            const t = (en - 0.7) / (4.0 - 0.7);
            const hue = (1 - t) * 230; // 230 to 0
            const color = new THREE.Color().setHSL(hue / 360, 0.8, 0.5);
            return { color, hue };
        }

        function updateScene() {
            const enA = state.atomA_EN;
            const enB = state.atomB_EN;
            const delta = Math.abs(enA - enB);
            state.delta_EN = parseFloat(delta.toFixed(2));

            // Colors
            const resA = getENColor(enA);
            const resB = getENColor(enB);
            atomA.material.color.copy(resA.color);
            atomB.material.color.copy(resB.color);
            state.atomA_color_hue = resA.hue;
            state.atomB_color_hue = resB.hue;

            // Bond Type
            if (delta < 0.4) state.bond_type = 'Nonpolar Covalent';
            else if (delta < 1.7) state.bond_type = 'Polar Covalent';
            else state.bond_type = 'Ionic';
            document.getElementById('bond-label-overlay').innerText = state.bond_type;

            // Dipole
            const dipoleLen = Math.min(delta * 0.8, 2.5);
            state.dipole_length = parseFloat(dipoleLen.toFixed(2));
            
            if (delta < 0.05) {
                dipoleGroup.visible = false;
                state.dipole_direction = 'none';
            } else {
                dipoleGroup.visible = true;
                const dir = enB > enA ? 1 : -1;
                state.dipole_direction = dir > 0 ? 'A_to_B' : 'B_to_A';
                
                arrowShaft.scale.set(dipoleLen, 1, 1);
                arrowShaft.position.set(0, 0.8, 0);
                arrowHead.position.set((dipoleLen / 2) * dir, 0.8, 0);
                arrowHead.rotation.z = dir > 0 ? -Math.PI/2 : Math.PI/2;
            }

            // Partial Charge
            const charge = Math.min(delta / 3.3, 1.0);
            state.partial_charge = parseFloat(charge.toFixed(2));

            // Cloud Distribution
            const bondLen = 4;
            const halfLen = bondLen / 2;
            const shift = ( (enB - enA) / 3.3 ) * halfLen;
            state.cloud_center_offset = shift;
            const sigma = bondLen * 0.25;

            cloudParticles.forEach((p, i) => {
                // Gaussian sampling along X
                // Box-Muller transform for simple distribution
                const u1 = Math.random();
                const u2 = Math.random();
                const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
                
                let x = z0 * sigma + shift;
                x = Math.max(-halfLen + 0.2, Math.min(halfLen - 0.2, x));
                
                // Random radial distribution
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * 0.4;
                const y = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;

                p.userData.basePos.set(x, y, z);
                
                // Color interpolation
                const t = (x + halfLen) / bondLen;
                p.material.color.lerpColors(resA.color, resB.color, t);
            });

            // UI Updates
            document.getElementById('en-a-val').innerText = enA.toFixed(1);
            document.getElementById('en-b-val').innerText = enB.toFixed(1);
            document.getElementById('delta-en-val').innerText = state.delta_EN.toFixed(2);
            document.getElementById('dipole-val').innerText = state.dipole_length.toFixed(2);
            document.getElementById('charge-val').innerText = state.partial_charge.toFixed(2);

            // Labels
            const labelA = document.getElementById('label-a');
            const labelB = document.getElementById('label-b');
            
            labelA.querySelector('.symbol-tag').innerText = `${currentSymA} (${enA.toFixed(1)})`;
            labelB.querySelector('.symbol-tag').innerText = `${currentSymB} (${enB.toFixed(1)})`;

            if (delta < 0.1) {
                labelA.querySelector('.charge-tag').innerText = '';
                labelB.querySelector('.charge-tag').innerText = '';
            } else {
                const charA = enA < enB ? `δ+ (${state.partial_charge})` : `δ- (${state.partial_charge})`;
                const charB = enB < enA ? `δ+ (${state.partial_charge})` : `δ- (${state.partial_charge})`;
                labelA.querySelector('.charge-tag').innerText = charA;
                labelB.querySelector('.charge-tag').innerText = charB;
            }
        }

        function updateLabels() {
            const posA = atomA.position.clone().project(camera);
            const posB = atomB.position.clone().project(camera);

            const xA = (posA.x * 0.5 + 0.5) * window.innerWidth;
            const yA = (-(posA.y * 0.5 - 0.5)) * window.innerHeight;
            const xB = (posB.x * 0.5 + 0.5) * window.innerWidth;
            const yB = (-(posB.y * 0.5 - 0.5)) * window.innerHeight;

            const elA = document.getElementById('label-a');
            const elB = document.getElementById('label-b');
            elA.style.left = `${xA}px`;
            elA.style.top = `${yA - 80}px`;
            elB.style.left = `${xB}px`;
            elB.style.top = `${yB - 80}px`;
        }

        // --- Interaction ---
        const enASlider = document.getElementById('en-a-slider');
        const enBSlider = document.getElementById('en-b-slider');
        const presetSelect = document.getElementById('preset-select');

        enASlider.addEventListener('input', (e) => {
            state.atomA_EN = parseFloat(e.target.value);
            state.selected_preset = 'custom';
            presetSelect.value = 'custom';
            currentSymA = 'A';
            updateScene();
        });

        enBSlider.addEventListener('input', (e) => {
            state.atomB_EN = parseFloat(e.target.value);
            state.selected_preset = 'custom';
            presetSelect.value = 'custom';
            currentSymB = 'B';
            updateScene();
        });

        presetSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            state.selected_preset = val;
            if (val !== 'custom') {
                state.atomA_EN = presets[val].a;
                state.atomB_EN = presets[val].b;
                currentSymA = presets[val].symA;
                currentSymB = presets[val].symB;
                enASlider.value = state.atomA_EN;
                enBSlider.value = state.atomB_EN;
                updateScene();
            }
        });

        document.getElementById('toggle-cloud').addEventListener('click', () => {
            state.cloud_visible = !state.cloud_visible;
            cloudGroup.visible = state.cloud_visible;
        });

        document.getElementById('reset-view').addEventListener('click', () => {
            camera.position.set(0, 2, 8);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        window.addEventListener('keydown', (e) => {
            const step = 0.1;
            switch(e.key.toLowerCase()) {
                case 'a': state.atomA_EN = Math.min(4.0, state.atomA_EN + step); break;
                case 'z': state.atomA_EN = Math.max(0.7, state.atomA_EN - step); break;
                case 's': state.atomB_EN = Math.min(4.0, state.atomB_EN + step); break;
                case 'x': state.atomB_EN = Math.max(0.7, state.atomB_EN - step); break;
                case ' ': 
                    state.cloud_visible = !state.cloud_visible; 
                    cloudGroup.visible = state.cloud_visible;
                    e.preventDefault();
                    break;
                case 'r':
                    state.atomA_EN = 2.1;
                    state.atomB_EN = 3.5;
                    currentSymA = 'A';
                    currentSymB = 'B';
                    break;
            }
            enASlider.value = state.atomA_EN;
            enBSlider.value = state.atomB_EN;
            updateScene();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Cloud oscillation
            cloudParticles.forEach(p => {
                const offset = Math.sin(time * 3 + p.userData.phase) * 0.03;
                p.position.x = p.userData.basePos.x;
                p.position.y = p.userData.basePos.y + offset;
                p.position.z = p.userData.basePos.z + offset;
            });

            // Dipole pulse
            const pulse = 0.85 + Math.sin(time * 4) * 0.15;
            arrowShaft.material.opacity = pulse;
            arrowHead.material.opacity = pulse;

            controls.update();
            updateLabels();
            
            // Update state for testing
            state.camera_distance = camera.position.distanceTo(new THREE.Vector3(0,0,0));
            
            renderer.render(scene, camera);
        }

        // Initial call
        updateScene();
        animate();

    </script>
</body>
</html>
