<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Aquarium Boids Simulation</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #e8f6ff;
    }

    body {
      background:
        radial-gradient(circle at top, #243b55 0%, #1f2a44 30%, #1a1a2e 70%, #141420 100%);
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(10, 16, 32, 0.55);
      border: 1px solid rgba(120, 200, 255, 0.25);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
      min-width: 210px;
      z-index: 10;
      pointer-events: none;
    }

    #hud .title {
      font-weight: 700;
      margin-bottom: 8px;
      color: #8fe9ff;
      letter-spacing: 0.04em;
    }

    #hud .row {
      font-size: 14px;
      line-height: 1.6;
      white-space: nowrap;
    }

    #controls {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(10, 16, 32, 0.6);
      border: 1px solid rgba(120, 200, 255, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      color: #dff8ff;
      min-width: 320px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }

    #controls label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    #controls input[type="range"] {
      width: 100%;
    }

    #help {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 10;
      background: rgba(10, 16, 32, 0.45);
      border: 1px solid rgba(120, 200, 255, 0.18);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #d8f5ff;
      max-width: 240px;
      line-height: 1.5;
      user-select: none;
    }

    .accent {
      color: #8fe9ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="title">Aquarium Boids</div>
      <div class="row">Time Scale: <span id="hud-timescale">1.00</span></div>
      <div class="row">Boid Count: <span id="hud-boidcount">60</span></div>
      <div class="row">Avg Speed: <span id="hud-avgspeed">0.00</span></div>
      <div class="row">State: <span id="hud-state">RUNNING</span></div>
    </div>

    <div id="controls">
      <label for="slider-separation">
        Separation Weight: <span id="separation-value">1.50</span>
      </label>
      <input id="slider-separation" type="range" min="0.5" max="5.0" step="0.1" value="1.5" />
    </div>

    <div id="help">
      <div><span class="accent">Space</span>: Pause / Resume</div>
      <div><span class="accent">↑ / ↓</span>: Time Scale</div>
      <div><span class="accent">R</span>: Reset</div>
      <div><span class="accent">S</span>: Scatter Mode</div>
      <div><span class="accent">Mouse</span>: Orbit camera</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const AQUARIUM_SIZE = { x: 20, y: 12, z: 20 };
    const HALF = { x: AQUARIUM_SIZE.x / 2, y: AQUARIUM_SIZE.y / 2, z: AQUARIUM_SIZE.z / 2 };
    const BOID_COUNT = 60;
    const MAX_SPEED = 4.0;
    const MAX_FORCE = 0.3;
    const BOUNDARY_MARGIN = 2.0;
    const BOUNDARY_WEIGHT = 3.0;

    const ALIGN_RADIUS = 4.0;
    const COHESION_RADIUS = 5.0;
    const SEPARATION_RADIUS = 2.0;

    let alignmentWeight = 1.0;
    let cohesionWeight = 1.0;
    let separationWeight = 1.5;
    let scatterMode = false;
    let paused = false;
    let timeScale = 1.0;
    let previousTimeScale = 1.0;
    let frameCount = 0;

    const app = document.getElementById('app');
    const hudTimeScale = document.getElementById('hud-timescale');
    const hudBoidCount = document.getElementById('hud-boidcount');
    const hudAvgSpeed = document.getElementById('hud-avgspeed');
    const hudState = document.getElementById('hud-state');
    const separationSlider = document.getElementById('slider-separation');
    const separationValue = document.getElementById('separation-value');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 20, 10);
    scene.add(directionalLight);

    const aquariumGroup = new THREE.Group();
    scene.add(aquariumGroup);

    const aquariumGeometry = new THREE.BoxGeometry(AQUARIUM_SIZE.x, AQUARIUM_SIZE.y, AQUARIUM_SIZE.z);
    const aquariumMaterial = new THREE.MeshPhongMaterial({
      color: 0x66ccff,
      transparent: true,
      opacity: 0.15,
      side: THREE.DoubleSide
    });
    const aquariumMesh = new THREE.Mesh(aquariumGeometry, aquariumMaterial);
    aquariumGroup.add(aquariumMesh);

    const edges = new THREE.EdgesGeometry(aquariumGeometry);
    const edgeLines = new THREE.LineSegments(
      edges,
      new THREE.LineBasicMaterial({ color: 0x99ddff, transparent: true, opacity: 0.7 })
    );
    aquariumGroup.add(edgeLines);

    const grid = new THREE.GridHelper(24, 24, 0x335577, 0x223344);
    grid.position.y = -HALF.y;
    grid.material.transparent = true;
    grid.material.opacity = 0.25;
    scene.add(grid);

    const boids = [];
    const boidGeometry = new THREE.ConeGeometry(0.12, 0.4, 8);
    boidGeometry.rotateX(Math.PI / 2);

    const tempVec = new THREE.Vector3();
    const centerVec = new THREE.Vector3(0, 0, 0);
    const targetLook = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0);

    function randomInRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function randomPositionInAquarium() {
      return new THREE.Vector3(
        randomInRange(-HALF.x + 0.5, HALF.x - 0.5),
        randomInRange(-HALF.y + 0.5, HALF.y - 0.5),
        randomInRange(-HALF.z + 0.5, HALF.z - 0.5)
      );
    }

    function randomVelocity() {
      const v = new THREE.Vector3(
        randomInRange(-1, 1),
        randomInRange(-1, 1),
        randomInRange(-1, 1)
      );
      if (v.lengthSq() < 1e-6) v.set(1, 0, 0);
      v.normalize().multiplyScalar(randomInRange(1.0, MAX_SPEED));
      return v;
    }

    function clampMagnitude(vec, max) {
      const lenSq = vec.lengthSq();
      if (lenSq > max * max) {
        vec.normalize().multiplyScalar(max);
      }
      return vec;
    }

    function limitFiniteVector(vec, fallback = 0) {
      if (!Number.isFinite(vec.x)) vec.x = fallback;
      if (!Number.isFinite(vec.y)) vec.y = fallback;
      if (!Number.isFinite(vec.z)) vec.z = fallback;
      return vec;
    }

    function createBoid(index) {
      const color = new THREE.Color().lerpColors(
        new THREE.Color(0x2563eb),
        new THREE.Color(0x22d3ee),
        index / Math.max(1, BOID_COUNT - 1)
      );

      const material = new THREE.MeshPhongMaterial({
        color,
        emissive: color.clone().multiplyScalar(0.12),
        shininess: 60
      });

      const mesh = new THREE.Mesh(boidGeometry, material);
      mesh.castShadow = false;
      mesh.receiveShadow = false;

      const boid = {
        mesh,
        position: randomPositionInAquarium(),
        velocity: randomVelocity(),
        acceleration: new THREE.Vector3()
      };

      mesh.position.copy(boid.position);
      scene.add(mesh);
      boids.push(boid);
      orientBoid(boid);
    }

    function orientBoid(boid) {
      const speedSq = boid.velocity.lengthSq();
      if (speedSq > 1e-8) {
        targetLook.copy(boid.position).add(boid.velocity);
        boid.mesh.up.copy(upAxis);
        boid.mesh.lookAt(targetLook);
      }
    }

    function resetBoids() {
      for (const boid of boids) {
        boid.position.copy(randomPositionInAquarium());
        boid.velocity.copy(randomVelocity());
        boid.acceleration.set(0, 0, 0);
        boid.mesh.position.copy(boid.position);
        orientBoid(boid);
      }
      updateState(true);
    }

    for (let i = 0; i < BOID_COUNT; i++) {
      createBoid(i);
    }

    function steerTowards(currentVelocity, desired) {
      const steer = desired.sub(currentVelocity);
      return clampMagnitude(steer, MAX_FORCE);
    }

    function computeSeparation(boid) {
      const steer = new THREE.Vector3();
      let count = 0;

      for (const other of boids) {
        if (other === boid) continue;
        const dist = boid.position.distanceTo(other.position);
        if (dist > 0 && dist < SEPARATION_RADIUS) {
          tempVec.copy(boid.position).sub(other.position);
          if (dist > 1e-6) tempVec.divideScalar(dist * dist);
          steer.add(tempVec);
          count++;
        }
      }

      if (count > 0) {
        steer.divideScalar(count);
      }

      if (steer.lengthSq() > 1e-8) {
        steer.normalize().multiplyScalar(MAX_SPEED);
        return steerTowards(boid.velocity.clone(), steer);
      }

      return steer.set(0, 0, 0);
    }

    function computeAlignment(boid) {
      const avgVel = new THREE.Vector3();
      let count = 0;

      for (const other of boids) {
        if (other === boid) continue;
        const dist = boid.position.distanceTo(other.position);
        if (dist < ALIGN_RADIUS) {
          avgVel.add(other.velocity);
          count++;
        }
      }

      if (count > 0) {
        avgVel.divideScalar(count);
        if (avgVel.lengthSq() > 1e-8) {
          avgVel.normalize().multiplyScalar(MAX_SPEED);
          return steerTowards(boid.velocity.clone(), avgVel);
        }
      }

      return avgVel.set(0, 0, 0);
    }

    function computeCohesion(boid) {
      const center = new THREE.Vector3();
      let count = 0;

      for (const other of boids) {
        if (other === boid) continue;
        const dist = boid.position.distanceTo(other.position);
        if (dist < COHESION_RADIUS) {
          center.add(other.position);
          count++;
        }
      }

      if (count > 0) {
        center.divideScalar(count);
        const desired = center.sub(boid.position);
        if (desired.lengthSq() > 1e-8) {
          desired.normalize().multiplyScalar(MAX_SPEED);
          return steerTowards(boid.velocity.clone(), desired);
        }
      }

      return center.set(0, 0, 0);
    }

    function computeBoundaryForce(boid) {
      const force = new THREE.Vector3();

      if (boid.position.x < -HALF.x + BOUNDARY_MARGIN) {
        force.x += ((-HALF.x + BOUNDARY_MARGIN) - boid.position.x) / BOUNDARY_MARGIN;
      } else if (boid.position.x > HALF.x - BOUNDARY_MARGIN) {
        force.x -= (boid.position.x - (HALF.x - BOUNDARY_MARGIN)) / BOUNDARY_MARGIN;
      }

      if (boid.position.y < -HALF.y + BOUNDARY_MARGIN) {
        force.y += ((-HALF.y + BOUNDARY_MARGIN) - boid.position.y) / BOUNDARY_MARGIN;
      } else if (boid.position.y > HALF.y - BOUNDARY_MARGIN) {
        force.y -= (boid.position.y - (HALF.y - BOUNDARY_MARGIN)) / BOUNDARY_MARGIN;
      }

      if (boid.position.z < -HALF.z + BOUNDARY_MARGIN) {
        force.z += ((-HALF.z + BOUNDARY_MARGIN) - boid.position.z) / BOUNDARY_MARGIN;
      } else if (boid.position.z > HALF.z - BOUNDARY_MARGIN) {
        force.z -= (boid.position.z - (HALF.z - BOUNDARY_MARGIN)) / BOUNDARY_MARGIN;
      }

      if (force.lengthSq() > 1e-8) {
        force.normalize().multiplyScalar(MAX_SPEED);
        return steerTowards(boid.velocity.clone(), force);
      }

      return force.set(0, 0, 0);
    }

    function computeScatterForce(boid) {
      const away = boid.position.clone();
      const dist = away.length();
      if (dist < 1e-6) {
        away.set(randomInRange(-1, 1), randomInRange(-1, 1), randomInRange(-1, 1));
      }
      away.normalize().multiplyScalar(MAX_SPEED);
      return steerTowards(boid.velocity.clone(), away);
    }

    function applyBoids(dt) {
      const sepForces = new Array(boids.length);
      const alignForces = new Array(boids.length);
      const cohesionForces = new Array(boids.length);
      const boundaryForces = new Array(boids.length);
      const scatterForces = new Array(boids.length);

      for (let i = 0; i < boids.length; i++) {
        const boid = boids[i];
        sepForces[i] = computeSeparation(boid).multiplyScalar(separationWeight);
        alignForces[i] = computeAlignment(boid).multiplyScalar(alignmentWeight);
        cohesionForces[i] = computeCohesion(boid).multiplyScalar(cohesionWeight);
        boundaryForces[i] = computeBoundaryForce(boid).multiplyScalar(BOUNDARY_WEIGHT);
        scatterForces[i] = scatterMode ? computeScatterForce(boid).multiplyScalar(5.0) : new THREE.Vector3();
      }

      for (let i = 0; i < boids.length; i++) {
        const boid = boids[i];
        boid.acceleration.set(0, 0, 0)
          .add(sepForces[i])
          .add(alignForces[i])
          .add(cohesionForces[i])
          .add(boundaryForces[i])
          .add(scatterForces[i]);

        clampMagnitude(boid.acceleration, MAX_FORCE * 4.0);
        limitFiniteVector(boid.acceleration, 0);

        boid.velocity.addScaledVector(boid.acceleration, dt);
        limitFiniteVector(boid.velocity, 0);

        if (boid.velocity.lengthSq() < 1e-8) {
          boid.velocity.copy(randomVelocity().multiplyScalar(0.3));
        }

        clampMagnitude(boid.velocity, MAX_SPEED);
        boid.position.addScaledVector(boid.velocity, dt);
        limitFiniteVector(boid.position, 0);

        boid.position.x = THREE.MathUtils.clamp(boid.position.x, -HALF.x, HALF.x);
        boid.position.y = THREE.MathUtils.clamp(boid.position.y, -HALF.y, HALF.y);
        boid.position.z = THREE.MathUtils.clamp(boid.position.z, -HALF.z, HALF.z);

        if (boid.position.x === -HALF.x || boid.position.x === HALF.x) {
          boid.velocity.x *= 0.9;
        }
        if (boid.position.y === -HALF.y || boid.position.y === HALF.y) {
          boid.velocity.y *= 0.9;
        }
        if (boid.position.z === -HALF.z || boid.position.z === HALF.z) {
          boid.velocity.z *= 0.9;
        }

        clampMagnitude(boid.velocity, MAX_SPEED);
        boid.mesh.position.copy(boid.position);
        orientBoid(boid);
      }
    }

    separationSlider.addEventListener('input', () => {
      separationWeight = parseFloat(separationSlider.value);
      separationValue.textContent = separationWeight.toFixed(2);
      updateState(true);
    });

    function setPaused(nextPaused) {
      paused = nextPaused;
      if (paused) {
        previousTimeScale = timeScale > 0 ? timeScale : previousTimeScale || 1.0;
        timeScale = 0;
      } else {
        timeScale = Math.max(0.25, previousTimeScale || 1.0);
      }
      updateHUD(0);
      updateState(true);
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key;

      if (key === ' ') {
        event.preventDefault();
        setPaused(!paused);
      } else if (key === 'ArrowUp') {
        event.preventDefault();
        if (paused) {
          previousTimeScale = Math.min(3.0, (previousTimeScale || 1.0) + 0.25);
        } else {
          timeScale = Math.min(3.0, timeScale + 0.25);
          previousTimeScale = timeScale;
        }
        updateHUD(0);
        updateState(true);
      } else if (key === 'ArrowDown') {
        event.preventDefault();
        if (paused) {
          previousTimeScale = Math.max(0.25, (previousTimeScale || 1.0) - 0.25);
        } else {
          timeScale = Math.max(0.25, timeScale - 0.25);
          previousTimeScale = timeScale;
        }
        updateHUD(0);
        updateState(true);
      } else if (key === 'r' || key === 'R') {
        resetBoids();
      } else if (key === 's' || key === 'S') {
        scatterMode = !scatterMode;
        updateHUD(0);
        updateState(true);
      }
    });

    function getStateLabel() {
      if (paused) return 'PAUSED';
      if (scatterMode) return 'SCATTER';
      return 'RUNNING';
    }

    function computeAggregates() {
      let totalSpeed = 0;
      let inBounds = 0;
      const center = new THREE.Vector3();

      for (const boid of boids) {
        const speed = boid.velocity.length();
        totalSpeed += Number.isFinite(speed) ? Math.min(speed, MAX_SPEED) : 0;

        const inB =
          Math.abs(boid.position.x) <= HALF.x + 1e-9 &&
          Math.abs(boid.position.y) <= HALF.y + 1e-9 &&
          Math.abs(boid.position.z) <= HALF.z + 1e-9;
        if (inB) inBounds++;

        center.add(boid.position);
      }

      center.divideScalar(Math.max(1, boids.length));

      return {
        avgSpeed: totalSpeed / Math.max(1, boids.length),
        boidsInBounds: inBounds,
        centerOfMass: center
      };
    }

    function updateHUD(avgSpeed) {
      hudTimeScale.textContent = (paused ? previousTimeScale : timeScale).toFixed(2);
      hudBoidCount.textContent = String(boids.length);
      hudAvgSpeed.textContent = avgSpeed.toFixed(2);
      hudState.textContent = getStateLabel();
    }

    function updateState(force = false) {
      const aggregates = computeAggregates();
      updateHUD(aggregates.avgSpeed);

      window.__3D_STATE__ = {
        boidCount: boids.length,
        timeScale: timeScale,
        paused: paused,
        scatterMode: scatterMode,
        avgSpeed: aggregates.avgSpeed,
        maxSpeed: MAX_SPEED,
        separationWeight: separationWeight,
        frameCount: frameCount,
        boidsInBounds: aggregates.boidsInBounds,
        centerOfMass: {
          x: aggregates.centerOfMass.x,
          y: aggregates.centerOfMass.y,
          z: aggregates.centerOfMass.z
        },
        aquariumSize: { ...AQUARIUM_SIZE },
        velocities: boids.map(b => ({
          x: Number.isFinite(b.velocity.x) ? b.velocity.x : 0,
          y: Number.isFinite(b.velocity.y) ? b.velocity.y : 0,
          z: Number.isFinite(b.velocity.z) ? b.velocity.z : 0
        })),
        positions: boids.map(b => ({
          x: Number.isFinite(b.position.x) ? b.position.x : 0,
          y: Number.isFinite(b.position.y) ? b.position.y : 0,
          z: Number.isFinite(b.position.z) ? b.position.z : 0
        }))
      };

      if (force) {
        // no-op branch reserved to make explicit immediate refresh calls
      }
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const rawDelta = Math.min(clock.getDelta(), 0.05);

      if (!paused && timeScale > 0) {
        const dt = rawDelta * timeScale;
        applyBoids(dt);
        frameCount++;
      }

      controls.update();
      updateState(false);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    separationValue.textContent = separationWeight.toFixed(2);
    hudBoidCount.textContent = String(BOID_COUNT);
    updateState(true);
    animate();
  </script>
</body>
</html>
