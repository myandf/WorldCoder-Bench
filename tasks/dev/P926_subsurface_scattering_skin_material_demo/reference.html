<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js SSS Skin Shader Demo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: Arial, Helvetica, sans-serif;
      color: #f0f0f0;
    }

    canvas {
      display: block;
    }

    #controls-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 300px;
      padding: 14px 14px 12px;
      background: rgba(20, 20, 20, 0.86);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      z-index: 10;
    }

    #controls-panel h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
    }

    #controls-panel .subtitle {
      font-size: 12px;
      color: #bdbdbd;
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .control-group {
      margin-bottom: 10px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    label {
      font-size: 13px;
      color: #e8e8e8;
    }

    .value {
      min-width: 48px;
      text-align: right;
      font-size: 12px;
      color: #ffccaa;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ff7a59;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      background: #303030;
      color: #f4f4f4;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s ease, transform 0.05s ease;
    }

    button:hover {
      background: #3c3c3c;
    }

    button:active {
      transform: translateY(1px);
    }

    #info {
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 10px 12px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      font-size: 12px;
      color: #d8d8d8;
      z-index: 10;
      line-height: 1.45;
    }

    .accent {
      color: #ffb08a;
    }
  </style>
</head>
<body>
  <div id="controls-panel">
    <h2>SSS Skin Shader</h2>
    <div class="subtitle">
      Real-time subsurface scattering approximation on a sphere "head" and matching swatch.
    </div>

    <div class="control-group">
      <div class="control-row">
        <label for="slider-sss-intensity">SSS Intensity</label>
        <span class="value" id="value-sss-intensity">0.80</span>
      </div>
      <input id="slider-sss-intensity" type="range" min="0" max="2" step="0.01" value="0.8" />
    </div>

    <div class="control-group">
      <div class="control-row">
        <label for="slider-sss-width">SSS Width</label>
        <span class="value" id="value-sss-width">0.50</span>
      </div>
      <input id="slider-sss-width" type="range" min="0.01" max="2" step="0.01" value="0.5" />
    </div>

    <div class="control-group">
      <div class="control-row">
        <label for="slider-specular">Specular Intensity</label>
        <span class="value" id="value-specular">0.50</span>
      </div>
      <input id="slider-specular" type="range" min="0" max="2" step="0.01" value="0.5" />
    </div>

    <div class="control-group">
      <div class="control-row">
        <label for="slider-shininess">Shininess</label>
        <span class="value" id="value-shininess">32</span>
      </div>
      <input id="slider-shininess" type="range" min="1" max="256" step="1" value="32" />
    </div>

    <div class="control-group">
      <div class="control-row">
        <label for="slider-fresnel">Fresnel Strength</label>
        <span class="value" id="value-fresnel">0.40</span>
      </div>
      <input id="slider-fresnel" type="range" min="0" max="2" step="0.01" value="0.4" />
    </div>

    <div class="control-group">
      <div class="control-row">
        <label for="slider-roughness">Roughness</label>
        <span class="value" id="value-roughness">0.50</span>
      </div>
      <input id="slider-roughness" type="range" min="0" max="1" step="0.01" value="0.5" />
    </div>

    <div class="button-row">
      <button id="btn-reset">Reset Defaults</button>
      <button id="btn-toggle-light">Toggle Point Light</button>
      <button id="btn-skin-tone">Cycle Skin Tone</button>
      <button id="btn-wireframe">Toggle Wireframe</button>
    </div>
  </div>

  <div id="info">
    <div><span class="accent">Mouse:</span> Orbit camera</div>
    <div><span class="accent">Keys:</span> 1/2/3 = SSS presets, R = reset, W = wireframe, L = point light</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const defaults = {
      baseColor: [0.85, 0.65, 0.5],
      sssColor: [1.0, 0.27, 0.13],
      sssIntensity: 0.8,
      sssWidth: 0.5,
      specularIntensity: 0.5,
      shininess: 32,
      fresnelStrength: 0.4,
      roughness: 0.5
    };

    const skinTones = [
      [0.85, 0.65, 0.5],
      [0.7, 0.45, 0.3],
      [0.45, 0.25, 0.15]
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a1a');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 3.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight('#222222', 0.3);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight('#ffffff', 2.0);
    keyLight.position.set(3, 3, 3);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight('#8899bb', 0.6);
    fillLight.position.set(-2, 1, -1);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight('#ffccaa', 1.0);
    rimLight.position.set(0, 2, -3);
    scene.add(rimLight);

    const pointLight = new THREE.PointLight('#ff8866', 1.5, 0, 2);
    pointLight.position.set(1.5, 0, 1.5);
    scene.add(pointLight);

    const pointLightIndicator = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 16, 16),
      new THREE.MeshBasicMaterial({ color: '#ff8866' })
    );
    pointLightIndicator.position.copy(pointLight.position);
    scene.add(pointLightIndicator);

    const vertexShader = `
      varying vec3 vWorldPosition;
      varying vec3 vWorldNormal;
      varying vec2 vUv;

      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const fragmentShader = `
      precision highp float;

      varying vec3 vWorldPosition;
      varying vec3 vWorldNormal;
      varying vec2 vUv;

      uniform vec3 baseColor;
      uniform vec3 sssColor;
      uniform float sssIntensity;
      uniform float sssWidth;
      uniform float specularIntensity;
      uniform float shininess;
      uniform float fresnelStrength;
      uniform float roughness;

      uniform vec3 cameraPosition;

      uniform vec3 keyLightDir;
      uniform vec3 keyLightColor;
      uniform float keyLightIntensity;

      uniform vec3 fillLightDir;
      uniform vec3 fillLightColor;
      uniform float fillLightIntensity;

      uniform vec3 rimLightDir;
      uniform vec3 rimLightColor;
      uniform float rimLightIntensity;

      uniform vec3 pointLightPos;
      uniform vec3 pointLightColor;
      uniform float pointLightIntensity;
      uniform float pointLightEnabled;

      uniform vec3 ambientColor;
      uniform float ambientIntensity;

      vec3 lambert(vec3 N, vec3 L, vec3 lightColor, float intensity) {
        float ndl = max(dot(N, L), 0.0);
        return baseColor * lightColor * ndl * intensity;
      }

      vec3 blinnPhong(vec3 N, vec3 V, vec3 L, vec3 lightColor, float intensity, float specScale) {
        vec3 H = normalize(V + L);
        float ndh = max(dot(N, H), 0.0);
        float specPower = max(1.0, shininess * mix(1.5, 0.35, roughness));
        float spec = pow(ndh, specPower);
        float visibility = step(0.0, dot(N, L));
        return lightColor * spec * visibility * specularIntensity * specScale * intensity;
      }

      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 V = normalize(cameraPosition - vWorldPosition);

        vec3 Lk = normalize(-keyLightDir);
        vec3 Lf = normalize(-fillLightDir);
        vec3 Lr = normalize(-rimLightDir);
        vec3 Lp = normalize(pointLightPos - vWorldPosition);

        float pointDist = length(pointLightPos - vWorldPosition);
        float pointAttn = 1.0 / (1.0 + 0.35 * pointDist * pointDist);

        vec3 color = vec3(0.0);

        color += ambientColor * baseColor * ambientIntensity;

        color += lambert(N, Lk, keyLightColor, keyLightIntensity);
        color += lambert(N, Lf, fillLightColor, fillLightIntensity);
        color += lambert(N, Lr, rimLightColor, rimLightIntensity);

        color += lambert(N, Lp, pointLightColor, pointLightIntensity * pointAttn * pointLightEnabled);

        float roughSpecScale = mix(1.15, 0.25, roughness);
        color += blinnPhong(N, V, Lk, keyLightColor, keyLightIntensity, roughSpecScale);
        color += blinnPhong(N, V, Lf, fillLightColor, fillLightIntensity, roughSpecScale * 0.75);
        color += blinnPhong(N, V, Lr, rimLightColor, rimLightIntensity, roughSpecScale * 0.9);
        color += blinnPhong(N, V, Lp, pointLightColor, pointLightIntensity * pointAttn * pointLightEnabled, roughSpecScale);

        float transmission = max(dot(V, -Lk), 0.0);
        float wrapped = smoothstep(0.0, max(0.001, sssWidth), transmission);
        float thinEdge = pow(1.0 - max(dot(N, V), 0.0), 1.5);
        vec3 sss = sssColor * wrapped * thinEdge * sssIntensity * keyLightIntensity;
        color += sss;

        float cosTheta = clamp(dot(N, V), 0.0, 1.0);
        float fresnel = pow(1.0 - cosTheta, 5.0);
        color += vec3(1.0) * fresnel * fresnelStrength * 0.75;

        color = color / (color + vec3(1.0));
        color = pow(color, vec3(1.0 / 2.2));

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const uniforms = {
      baseColor: { value: new THREE.Color(...defaults.baseColor) },
      sssColor: { value: new THREE.Color(...defaults.sssColor) },
      sssIntensity: { value: defaults.sssIntensity },
      sssWidth: { value: defaults.sssWidth },
      specularIntensity: { value: defaults.specularIntensity },
      shininess: { value: defaults.shininess },
      fresnelStrength: { value: defaults.fresnelStrength },
      roughness: { value: defaults.roughness },

      keyLightDir: { value: new THREE.Vector3() },
      keyLightColor: { value: new THREE.Color(keyLight.color) },
      keyLightIntensity: { value: keyLight.intensity },

      fillLightDir: { value: new THREE.Vector3() },
      fillLightColor: { value: new THREE.Color(fillLight.color) },
      fillLightIntensity: { value: fillLight.intensity },

      rimLightDir: { value: new THREE.Vector3() },
      rimLightColor: { value: new THREE.Color(rimLight.color) },
      rimLightIntensity: { value: rimLight.intensity },

      pointLightPos: { value: pointLight.position.clone() },
      pointLightColor: { value: new THREE.Color(pointLight.color) },
      pointLightIntensity: { value: pointLight.intensity },
      pointLightEnabled: { value: 1.0 },

      ambientColor: { value: new THREE.Color(ambientLight.color) },
      ambientIntensity: { value: ambientLight.intensity }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      wireframe: false
    });

    const mainSphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.0, 64, 64),
      material
    );
    scene.add(mainSphere);

    const swatchSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 64, 64),
      material
    );
    swatchSphere.position.set(2, 0, 0);
    scene.add(swatchSphere);

    const sliders = {
      sssIntensity: document.getElementById('slider-sss-intensity'),
      sssWidth: document.getElementById('slider-sss-width'),
      specularIntensity: document.getElementById('slider-specular'),
      shininess: document.getElementById('slider-shininess'),
      fresnelStrength: document.getElementById('slider-fresnel'),
      roughness: document.getElementById('slider-roughness')
    };

    const values = {
      sssIntensity: document.getElementById('value-sss-intensity'),
      sssWidth: document.getElementById('value-sss-width'),
      specularIntensity: document.getElementById('value-specular'),
      shininess: document.getElementById('value-shininess'),
      fresnelStrength: document.getElementById('value-fresnel'),
      roughness: document.getElementById('value-roughness')
    };

    const buttons = {
      reset: document.getElementById('btn-reset'),
      toggleLight: document.getElementById('btn-toggle-light'),
      skinTone: document.getElementById('btn-skin-tone'),
      wireframe: document.getElementById('btn-wireframe')
    };

    let skinToneIndex = 0;
    let pointLightEnabled = true;
    let elapsedTime = 0;
    let frameCount = 0;

    function formatValue(key, val) {
      if (key === 'shininess') return String(Math.round(val));
      return Number(val).toFixed(2);
    }

    function updateValueDisplays() {
      values.sssIntensity.textContent = formatValue('sssIntensity', uniforms.sssIntensity.value);
      values.sssWidth.textContent = formatValue('sssWidth', uniforms.sssWidth.value);
      values.specularIntensity.textContent = formatValue('specularIntensity', uniforms.specularIntensity.value);
      values.shininess.textContent = formatValue('shininess', uniforms.shininess.value);
      values.fresnelStrength.textContent = formatValue('fresnelStrength', uniforms.fresnelStrength.value);
      values.roughness.textContent = formatValue('roughness', uniforms.roughness.value);
    }

    function syncSlidersFromUniforms() {
      sliders.sssIntensity.value = uniforms.sssIntensity.value;
      sliders.sssWidth.value = uniforms.sssWidth.value;
      sliders.specularIntensity.value = uniforms.specularIntensity.value;
      sliders.shininess.value = uniforms.shininess.value;
      sliders.fresnelStrength.value = uniforms.fresnelStrength.value;
      sliders.roughness.value = uniforms.roughness.value;
      updateValueDisplays();
    }

    function setBaseColorFromPreset(index) {
      skinToneIndex = index % skinTones.length;
      const c = skinTones[skinToneIndex];
      uniforms.baseColor.value.setRGB(c[0], c[1], c[2]);
    }

    function resetDefaults() {
      uniforms.sssIntensity.value = defaults.sssIntensity;
      uniforms.sssWidth.value = defaults.sssWidth;
      uniforms.specularIntensity.value = defaults.specularIntensity;
      uniforms.shininess.value = defaults.shininess;
      uniforms.fresnelStrength.value = defaults.fresnelStrength;
      uniforms.roughness.value = defaults.roughness;
      uniforms.sssColor.value.setRGB(...defaults.sssColor);
      setBaseColorFromPreset(0);
      material.wireframe = false;
      pointLightEnabled = true;
      pointLight.visible = true;
      pointLightIndicator.visible = true;
      uniforms.pointLightEnabled.value = 1.0;
      syncSlidersFromUniforms();
    }

    sliders.sssIntensity.addEventListener('input', () => {
      uniforms.sssIntensity.value = parseFloat(sliders.sssIntensity.value);
      updateValueDisplays();
    });

    sliders.sssWidth.addEventListener('input', () => {
      uniforms.sssWidth.value = parseFloat(sliders.sssWidth.value);
      updateValueDisplays();
    });

    sliders.specularIntensity.addEventListener('input', () => {
      uniforms.specularIntensity.value = parseFloat(sliders.specularIntensity.value);
      updateValueDisplays();
    });

    sliders.shininess.addEventListener('input', () => {
      uniforms.shininess.value = parseFloat(sliders.shininess.value);
      updateValueDisplays();
    });

    sliders.fresnelStrength.addEventListener('input', () => {
      uniforms.fresnelStrength.value = parseFloat(sliders.fresnelStrength.value);
      updateValueDisplays();
    });

    sliders.roughness.addEventListener('input', () => {
      uniforms.roughness.value = parseFloat(sliders.roughness.value);
      updateValueDisplays();
    });

    function togglePointLight() {
      pointLightEnabled = !pointLightEnabled;
      pointLight.visible = pointLightEnabled;
      pointLightIndicator.visible = pointLightEnabled;
      uniforms.pointLightEnabled.value = pointLightEnabled ? 1.0 : 0.0;
    }

    function toggleWireframe() {
      material.wireframe = !material.wireframe;
    }

    function cycleSkinTone() {
      setBaseColorFromPreset((skinToneIndex + 1) % skinTones.length);
    }

    buttons.reset.addEventListener('click', resetDefaults);
    buttons.toggleLight.addEventListener('click', togglePointLight);
    buttons.skinTone.addEventListener('click', cycleSkinTone);
    buttons.wireframe.addEventListener('click', toggleWireframe);

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === '1') {
        uniforms.sssIntensity.value = 0.0;
        syncSlidersFromUniforms();
      } else if (key === '2') {
        uniforms.sssIntensity.value = 0.8;
        syncSlidersFromUniforms();
      } else if (key === '3') {
        uniforms.sssIntensity.value = 2.0;
        syncSlidersFromUniforms();
      } else if (key === 'r') {
        resetDefaults();
      } else if (key === 'w') {
        toggleWireframe();
      } else if (key === 'l') {
        togglePointLight();
      }
    });

    function updateLightUniforms() {
      uniforms.keyLightDir.value.copy(keyLight.position).normalize();
      uniforms.fillLightDir.value.copy(fillLight.position).normalize();
      uniforms.rimLightDir.value.copy(rimLight.position).normalize();
      uniforms.pointLightPos.value.copy(pointLight.position);
    }

    function getLightCount() {
      let count = 0;
      scene.traverse(obj => {
        if (obj.isLight) count++;
      });
      return count;
    }

    function approxEqual(a, b, eps = 1e-4) {
      return Math.abs(a - b) <= eps;
    }

    function colorsMatch(color, arr, eps = 1e-4) {
      return approxEqual(color.r, arr[0], eps) &&
             approxEqual(color.g, arr[1], eps) &&
             approxEqual(color.b, arr[2], eps);
    }

    window.__3D_STATE__ = {
      sssIntensity: defaults.sssIntensity,
      sssWidth: defaults.sssWidth,
      specularIntensity: defaults.specularIntensity,
      shininess: defaults.shininess,
      fresnelStrength: defaults.fresnelStrength,
      roughness: defaults.roughness,
      baseColor: [...defaults.baseColor],
      sssColor: [...defaults.sssColor],
      skinToneIndex: 0,
      pointLightEnabled: true,
      pointLightPosition: [pointLight.position.x, pointLight.position.y, pointLight.position.z],
      wireframeEnabled: false,
      mainSphereExists: true,
      swatchSphereExists: true,
      lightCount: getLightCount(),
      elapsedTime: 0,
      cameraDistance: camera.position.length(),
      uniformsSynced: true,
      frameCount: 0
    };

    function updateState() {
      const baseColorArray = [
        uniforms.baseColor.value.r,
        uniforms.baseColor.value.g,
        uniforms.baseColor.value.b
      ];

      const sssColorArray = [
        uniforms.sssColor.value.r,
        uniforms.sssColor.value.g,
        uniforms.sssColor.value.b
      ];

      const state = window.__3D_STATE__;
      state.sssIntensity = uniforms.sssIntensity.value;
      state.sssWidth = uniforms.sssWidth.value;
      state.specularIntensity = uniforms.specularIntensity.value;
      state.shininess = uniforms.shininess.value;
      state.fresnelStrength = uniforms.fresnelStrength.value;
      state.roughness = uniforms.roughness.value;
      state.baseColor = baseColorArray;
      state.sssColor = sssColorArray;
      state.skinToneIndex = skinToneIndex;
      state.pointLightEnabled = pointLightEnabled;
      state.pointLightPosition = [pointLight.position.x, pointLight.position.y, pointLight.position.z];
      state.wireframeEnabled = material.wireframe;
      state.mainSphereExists = !!mainSphere.parent;
      state.swatchSphereExists = !!swatchSphere.parent;
      state.lightCount = getLightCount();
      state.elapsedTime = elapsedTime;
      state.cameraDistance = camera.position.distanceTo(new THREE.Vector3(0, 0, 0));
      state.frameCount = frameCount;

      state.uniformsSynced =
        approxEqual(uniforms.sssIntensity.value, state.sssIntensity) &&
        approxEqual(uniforms.sssWidth.value, state.sssWidth) &&
        approxEqual(uniforms.specularIntensity.value, state.specularIntensity) &&
        approxEqual(uniforms.shininess.value, state.shininess) &&
        approxEqual(uniforms.fresnelStrength.value, state.fresnelStrength) &&
        approxEqual(uniforms.roughness.value, state.roughness) &&
        colorsMatch(uniforms.baseColor.value, state.baseColor) &&
        colorsMatch(uniforms.sssColor.value, state.sssColor);
    }

    const clock = new THREE.Clock();
    const tempOrigin = new THREE.Vector3(0, 0, 0);

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      elapsedTime += dt;
      frameCount++;

      const orbitRadius = 2.0;
      const orbitSpeed = 0.3;
      pointLight.position.set(
        Math.cos(elapsedTime * orbitSpeed) * orbitRadius,
        0.0,
        Math.sin(elapsedTime * orbitSpeed) * orbitRadius
      );
      pointLightIndicator.position.copy(pointLight.position);

      updateLightUniforms();
      controls.update();
      updateState();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetDefaults();
    updateLightUniforms();
    updateState();
    animate();
  </script>
</body>
</html>
