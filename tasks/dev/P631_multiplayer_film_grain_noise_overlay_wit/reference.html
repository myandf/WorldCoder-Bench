<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer Film Grain Post-Processing</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }

#hud-panel {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.82);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 14px 18px;
  color: #ddd;
  font-size: 13px;
  min-width: 260px;
  z-index: 10;
  user-select: none;
}

#hud-panel h3 { margin: 0 0 10px; font-size: 15px; color: #fff; }

.player-buttons { display: flex; gap: 6px; margin-bottom: 12px; }
.player-buttons button {
  flex: 1;
  padding: 6px 0;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 5px;
  background: rgba(255,255,255,0.07);
  color: #ccc;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
}
.player-buttons button.selected {
  border-color: #4af;
  color: #fff;
  background: rgba(68,170,255,0.18);
}
.player-buttons button:hover { background: rgba(255,255,255,0.13); }

.control-row {
  display: flex;
  align-items: center;
  margin: 7px 0;
  gap: 8px;
}
.control-row label {
  width: 70px;
  font-size: 12px;
  color: #aaa;
}
.control-row input[type=range] {
  flex: 1;
  accent-color: #4af;
}
.control-row .val {
  width: 38px;
  text-align: right;
  font-size: 12px;
  color: #fff;
}

.action-buttons { display: flex; gap: 6px; margin-top: 10px; }
.action-buttons button {
  flex: 1;
  padding: 7px 0;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 5px;
  background: rgba(255,255,255,0.07);
  color: #ccc;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
}
.action-buttons button:hover { background: rgba(255,255,255,0.15); }
#btn-toggle-active.active-on { border-color: #4c6; color: #4c6; }

.stats { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
.stats div { font-size: 12px; margin: 3px 0; color: #aaa; }
.stats span { color: #fff; }

.hint {
  margin-top: 10px;
  font-size: 10px;
  color: #666;
  line-height: 1.5;
}
</style>
</head>
<body>

<div id="hud-panel">
  <h3>Film Grain Controls</h3>
  <div class="player-buttons">
    <button id="btn-player-1">P1</button>
    <button id="btn-player-2">P2</button>
    <button id="btn-player-3">P3</button>
    <button id="btn-player-4">P4</button>
  </div>

  <div class="control-row">
    <label>Intensity</label>
    <input type="range" id="slider-intensity" min="0" max="100" value="30">
    <span class="val" id="val-intensity">0.30</span>
  </div>
  <div class="control-row">
    <label>Speed</label>
    <input type="range" id="slider-speed" min="50" max="300" value="100">
    <span class="val" id="val-speed">1.00</span>
  </div>
  <div class="control-row">
    <label>Size</label>
    <input type="range" id="slider-size" min="100" max="500" value="100">
    <span class="val" id="val-size">1.00</span>
  </div>

  <div class="action-buttons">
    <button id="btn-toggle-active">Toggle Active</button>
    <button id="btn-reset-all">Reset All</button>
  </div>

  <div class="stats">
    <div>Combined Intensity: <span id="label-combined-intensity">0.30</span></div>
    <div>Active Players: <span id="label-active-count">1</span></div>
    <div>Selected: <span id="label-selected">Player1</span></div>
  </div>

  <div class="hint">
    Keys 1-4: Select player | A: Toggle active | R: Reset<br>
    ↑/↓: Adjust intensity ±0.05
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- Default player configs ---
const DEFAULTS = [
  { name: 'Player1', intensity: 0.3, speed: 1.0, size: 1.0, active: true,  tint: { r: 1.0, g: 1.0, b: 1.0 } },
  { name: 'Player2', intensity: 0.5, speed: 1.5, size: 2.0, active: false, tint: { r: 1.0, g: 0.8, b: 0.8 } },
  { name: 'Player3', intensity: 0.7, speed: 2.0, size: 3.0, active: false, tint: { r: 0.8, g: 1.0, b: 0.8 } },
  { name: 'Player4', intensity: 0.2, speed: 0.8, size: 1.5, active: false, tint: { r: 0.8, g: 0.8, b: 1.0 } },
];

function cloneDefaults() {
  return DEFAULTS.map(d => ({
    name: d.name,
    intensity: d.intensity,
    speed: d.speed,
    size: d.size,
    active: d.active,
    tint: { r: d.tint.r, g: d.tint.g, b: d.tint.b }
  }));
}

let players = cloneDefaults();
let selectedPlayer = 1;
let frameCount = 0;
let lastAction = '';

// --- State ---
window.__3D_STATE__ = {
  selectedPlayer: 1,
  players: cloneDefaults(),
  combinedIntensity: 0,
  activeCount: 0,
  frameCount: 0,
  grainUniformTime: 0,
  sceneObjectCount: 5,
  overlayVisible: true,
  lastAction: '',
  initialized: false
};

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 8);
camera.lookAt(0, 0, 0);

// --- Lights ---
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// --- Objects ---
const meshes = [];

const box = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0xff0000 })
);
box.position.set(-3, 0, 0);
scene.add(box); meshes.push(box);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x00ff00 })
);
sphere.position.set(0, 0, 0);
scene.add(sphere); meshes.push(sphere);

const torus = new THREE.Mesh(
  new THREE.TorusGeometry(0.5, 0.2, 16, 32),
  new THREE.MeshStandardMaterial({ color: 0x0000ff })
);
torus.position.set(3, 0, 0);
scene.add(torus); meshes.push(torus);

const cylinder = new THREE.Mesh(
  new THREE.CylinderGeometry(0.3, 0.3, 1, 32),
  new THREE.MeshStandardMaterial({ color: 0xffff00 })
);
cylinder.position.set(-1.5, 1.5, 0);
scene.add(cylinder); meshes.push(cylinder);

const cone = new THREE.Mesh(
  new THREE.ConeGeometry(0.4, 1, 32),
  new THREE.MeshStandardMaterial({ color: 0xaa00ff })
);
cone.position.set(1.5, 1.5, 0);
scene.add(cone); meshes.push(cone);

// --- Film Grain Overlay ---
const grainVertexShader = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const grainFragmentShader = `
precision highp float;
varying vec2 vUv;

uniform float uTime;
uniform float uIntensity;
uniform float uSpeed;
uniform float uSize;
uniform vec3 uTint;
uniform float uActive;

// Pseudo-random hash
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float grain(vec2 uv, float t, float speed, float size) {
  vec2 scaled = uv * size * 100.0;
  float seed = t * speed;
  float n = hash(scaled + seed);
  // Add second octave for richer grain
  n = (n + hash(scaled * 2.17 + seed * 1.31)) * 0.5;
  return n - 0.5; // center around 0 for additive blending
}

void main() {
  if (uActive < 0.5 || uIntensity < 0.001) {
    gl_FragColor = vec4(0.0);
    return;
  }
  float g = grain(vUv, uTime, uSpeed, uSize);
  float strength = g * uIntensity;
  gl_FragColor = vec4(uTint * strength, 1.0);
}
`;

// We create one overlay quad per player for blending
const overlayScene = new THREE.Scene();
const overlayCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const grainMaterials = [];
const grainQuads = [];

for (let i = 0; i < 4; i++) {
  const mat = new THREE.ShaderMaterial({
    vertexShader: grainVertexShader,
    fragmentShader: grainFragmentShader,
    uniforms: {
      uTime: { value: 0.0 },
      uIntensity: { value: players[i].intensity },
      uSpeed: { value: players[i].speed },
      uSize: { value: players[i].size },
      uTint: { value: new THREE.Vector3(players[i].tint.r, players[i].tint.g, players[i].tint.b) },
      uActive: { value: players[i].active ? 1.0 : 0.0 }
    },
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false
  });
  grainMaterials.push(mat);

  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  overlayScene.add(quad);
  grainQuads.push(quad);
}

// --- UI Helpers ---
const btnPlayers = [
  document.getElementById('btn-player-1'),
  document.getElementById('btn-player-2'),
  document.getElementById('btn-player-3'),
  document.getElementById('btn-player-4')
];
const sliderIntensity = document.getElementById('slider-intensity');
const sliderSpeed = document.getElementById('slider-speed');
const sliderSize = document.getElementById('slider-size');
const valIntensity = document.getElementById('val-intensity');
const valSpeed = document.getElementById('val-speed');
const valSize = document.getElementById('val-size');
const btnToggle = document.getElementById('btn-toggle-active');
const btnReset = document.getElementById('btn-reset-all');
const labelCombined = document.getElementById('label-combined-intensity');
const labelActive = document.getElementById('label-active-count');
const labelSelected = document.getElementById('label-selected');

function computeCombined() {
  const actives = players.filter(p => p.active);
  const count = actives.length;
  const combined = count > 0 ? actives.reduce((s, p) => s + p.intensity, 0) / count : 0;
  return { combined: Math.round(combined * 100) / 100, count };
}

function updateUI() {
  const p = players[selectedPlayer - 1];

  btnPlayers.forEach((btn, i) => {
    btn.classList.toggle('selected', i === selectedPlayer - 1);
  });

  sliderIntensity.value = Math.round(p.intensity * 100);
  sliderSpeed.value = Math.round(p.speed * 100);
  sliderSize.value = Math.round(p.size * 100);

  valIntensity.textContent = p.intensity.toFixed(2);
  valSpeed.textContent = p.speed.toFixed(2);
  valSize.textContent = p.size.toFixed(2);

  btnToggle.textContent = p.active ? 'Deactivate' : 'Activate';
  btnToggle.classList.toggle('active-on', p.active);

  const { combined, count } = computeCombined();
  labelCombined.textContent = combined.toFixed(2);
  labelActive.textContent = count;
  labelSelected.textContent = p.name;
}

function updateGrainUniforms(time) {
  const { combined, count } = computeCombined();
  const anyActive = count > 0;

  for (let i = 0; i < 4; i++) {
    const p = players[i];
    const mat = grainMaterials[i];

    // Each player contributes their own intensity divided by active count for averaging
    const effectiveIntensity = (p.active && count > 0) ? p.intensity / count : 0;

    mat.uniforms.uTime.value = time;
    mat.uniforms.uIntensity.value = effectiveIntensity;
    mat.uniforms.uSpeed.value = p.speed;
    mat.uniforms.uSize.value = p.size;
    mat.uniforms.uTint.value.set(p.tint.r, p.tint.g, p.tint.b);
    mat.uniforms.uActive.value = p.active ? 1.0 : 0.0;
  }

  return { combined, count, anyActive };
}

function selectPlayer(num) {
  selectedPlayer = num;
  lastAction = 'select_player_' + num;
  updateUI();
}

function toggleActive() {
  const p = players[selectedPlayer - 1];
  p.active = !p.active;
  lastAction = 'toggle_active';
  updateUI();
}

function resetAll() {
  players = cloneDefaults();
  selectedPlayer = 1;
  lastAction = 'reset_all';
  updateUI();
}

// --- Event Listeners ---
btnPlayers.forEach((btn, i) => {
  btn.addEventListener('click', () => selectPlayer(i + 1));
});

sliderIntensity.addEventListener('input', () => {
  players[selectedPlayer - 1].intensity = parseInt(sliderIntensity.value) / 100;
  lastAction = 'change_intensity';
  updateUI();
});

sliderSpeed.addEventListener('input', () => {
  players[selectedPlayer - 1].speed = parseInt(sliderSpeed.value) / 100;
  lastAction = 'change_speed';
  updateUI();
});

sliderSize.addEventListener('input', () => {
  players[selectedPlayer - 1].size = parseInt(sliderSize.value) / 100;
  lastAction = 'change_size';
  updateUI();
});

btnToggle.addEventListener('click', toggleActive);
btnReset.addEventListener('click', resetAll);

document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (key >= '1' && key <= '4') {
    selectPlayer(parseInt(key));
  } else if (key.toLowerCase() === 'a') {
    toggleActive();
  } else if (key.toLowerCase() === 'r') {
    resetAll();
  } else if (key === 'ArrowUp') {
    e.preventDefault();
    const p = players[selectedPlayer - 1];
    p.intensity = Math.min(1.0, Math.round((p.intensity + 0.05) * 100) / 100);
    lastAction = 'change_intensity';
    updateUI();
  } else if (key === 'ArrowDown') {
    e.preventDefault();
    const p = players[selectedPlayer - 1];
    p.intensity = Math.max(0.0, Math.round((p.intensity - 0.05) * 100) / 100);
    lastAction = 'change_intensity';
    updateUI();
  }
});

// --- Resize ---
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// --- Animation Loop ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();
  const dt = clock.getDelta();

  // Rotate objects
  meshes.forEach(m => { m.rotation.y += 0.008; });

  // Update grain
  const { combined, count, anyActive } = updateGrainUniforms(elapsed);

  // Render scene
  renderer.clear();
  renderer.render(scene, camera);

  // Render grain overlay on top
  if (anyActive) {
    renderer.render(overlayScene, overlayCamera);
  }

  frameCount++;

  // Update state
  const state = window.__3D_STATE__;
  state.selectedPlayer = selectedPlayer;
  state.players = players.map(p => ({
    name: p.name,
    intensity: p.intensity,
    speed: p.speed,
    size: p.size,
    active: p.active,
    tint: { r: p.tint.r, g: p.tint.g, b: p.tint.b }
  }));
  state.combinedIntensity = combined;
  state.activeCount = count;
  state.frameCount = frameCount;
  state.grainUniformTime = elapsed;
  state.sceneObjectCount = 5;
  state.overlayVisible = anyActive;
  state.lastAction = lastAction;
  state.initialized = true;
}

updateUI();
animate();
</script>
</body>
</html>
