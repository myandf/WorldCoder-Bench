<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Damaged Surface Material Editor</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #f0f0f0;
    }
    #ui, #hud {
      position: absolute;
      z-index: 10;
      background: rgba(20, 20, 30, 0.82);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      padding: 14px 16px;
      user-select: none;
    }
    #ui {
      top: 12px;
      left: 12px;
      width: 280px;
    }
    #hud {
      top: 12px;
      right: 12px;
      width: 220px;
    }
    .row {
      margin-bottom: 12px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #d8d8e8;
    }
    input[type="range"], select, button {
      width: 100%;
      box-sizing: border-box;
    }
    input[type="range"] {
      accent-color: #d6a86d;
    }
    button, select {
      background: #2a2a3e;
      color: #f0f0f0;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
    }
    button:hover, select:hover {
      background: #34344c;
    }
    .value {
      font-size: 12px;
      color: #bcbcd6;
      margin-top: 4px;
      text-align: right;
    }
    .hud-line {
      font-size: 14px;
      margin: 6px 0;
      color: #ececf8;
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 10;
      color: #d2d2e8;
      background: rgba(20,20,30,0.75);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="row">
      <label for="brushSize">Brush Size</label>
      <input id="brushSize" type="range" min="5" max="50" step="1" value="15" />
      <div class="value" id="brushSizeValue">15 px</div>
    </div>

    <div class="row">
      <label for="baseRoughness">Base Roughness</label>
      <input id="baseRoughness" type="range" min="0" max="1" step="0.05" value="0.5" />
      <div class="value" id="baseRoughnessValue">0.50</div>
    </div>

    <div class="row">
      <label for="bumpScale">Bump Scale</label>
      <input id="bumpScale" type="range" min="0" max="0.5" step="0.01" value="0.15" />
      <div class="value" id="bumpScaleValue">0.15</div>
    </div>

    <div class="row">
      <label for="preset">Damage Preset</label>
      <select id="preset">
        <option>None</option>
        <option selected>Light Wear</option>
        <option>Heavy Erosion</option>
        <option>Battle Scarred</option>
      </select>
    </div>

    <div class="row">
      <button id="resetBtn">Reset Surface</button>
    </div>

    <div class="row">
      <button id="wireframeBtn">Toggle Wireframe</button>
    </div>
  </div>

  <div id="hud">
    <div class="hud-line" id="strokesHud">Strokes: 0</div>
    <div class="hud-line" id="damagedHud">Damaged Pixels: 0</div>
    <div class="hud-line" id="avgHud">Avg Roughness: 0.0000</div>
  </div>

  <div class="hint">Click and drag on the surface to paint damage</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const TEXTURE_SIZE = 512;
    const SURFACE_SEGMENTS = 256;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(5, 8, 5);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0xffeedd, 1.0);
    pointLight.position.set(-3, 3, -2);
    scene.add(pointLight);

    const ambientLight = new THREE.AmbientLight(0x404060, 0.3);
    scene.add(ambientLight);

    const planeGeometry = new THREE.PlaneGeometry(6, 6, SURFACE_SEGMENTS, SURFACE_SEGMENTS);

    const roughnessCanvas = document.createElement('canvas');
    roughnessCanvas.width = TEXTURE_SIZE;
    roughnessCanvas.height = TEXTURE_SIZE;
    const roughnessCtx = roughnessCanvas.getContext('2d', { willReadFrequently: true });

    const bumpCanvas = document.createElement('canvas');
    bumpCanvas.width = TEXTURE_SIZE;
    bumpCanvas.height = TEXTURE_SIZE;
    const bumpCtx = bumpCanvas.getContext('2d', { willReadFrequently: true });

    const roughnessTexture = new THREE.CanvasTexture(roughnessCanvas);
    roughnessTexture.wrapS = THREE.ClampToEdgeWrapping;
    roughnessTexture.wrapT = THREE.ClampToEdgeWrapping;
    roughnessTexture.colorSpace = THREE.NoColorSpace;

    const bumpTexture = new THREE.CanvasTexture(bumpCanvas);
    bumpTexture.wrapS = THREE.ClampToEdgeWrapping;
    bumpTexture.wrapT = THREE.ClampToEdgeWrapping;
    bumpTexture.colorSpace = THREE.NoColorSpace;

    const material = new THREE.MeshStandardMaterial({
      color: 0x8B7355,
      metalness: 0.1,
      roughness: 0.5,
      roughnessMap: roughnessTexture,
      bumpMap: bumpTexture,
      bumpScale: 0.15
    });

    const plane = new THREE.Mesh(planeGeometry, material);
    plane.rotation.x = -Math.PI / 3;
    scene.add(plane);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    let isPainting = false;
    let strokeCount = 0;
    let damagedPixelCount = 0;
    let avgRoughness = 0;
    let activePreset = 'Light Wear';
    let craterCount = 0;
    let lastPaintUV = null;

    const roughnessData = new Float32Array(TEXTURE_SIZE * TEXTURE_SIZE);
    const originalData = new Float32Array(TEXTURE_SIZE * TEXTURE_SIZE);

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        a |= 0;
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function createValueNoise(seed = 1337) {
      const rand = mulberry32(seed);
      const gridSize = 257;
      const grid = new Float32Array(gridSize * gridSize);
      for (let i = 0; i < grid.length; i++) grid[i] = rand();

      function sample(x, y, freq) {
        const gx = x * freq;
        const gy = y * freq;
        const x0 = Math.floor(gx);
        const y0 = Math.floor(gy);
        const x1 = x0 + 1;
        const y1 = y0 + 1;
        const tx = gx - x0;
        const ty = gy - y0;

        const sx = tx * tx * (3 - 2 * tx);
        const sy = ty * ty * (3 - 2 * ty);

        const idx = (ix, iy) => {
          const xx = ((ix % gridSize) + gridSize) % gridSize;
          const yy = ((iy % gridSize) + gridSize) % gridSize;
          return grid[yy * gridSize + xx];
        };

        const v00 = idx(x0, y0);
        const v10 = idx(x1, y0);
        const v01 = idx(x0, y1);
        const v11 = idx(x1, y1);

        const a = v00 * (1 - sx) + v10 * sx;
        const b = v01 * (1 - sx) + v11 * sx;
        return a * (1 - sy) + b * sy;
      }

      return { sample };
    }

    const valueNoise = createValueNoise(2025);

    function directionalScratch(x, y, freq) {
      const angle = Math.PI * 0.18;
      const dir = x * Math.cos(angle) + y * Math.sin(angle);
      const n1 = valueNoise.sample(dir, y * 0.17 + x * 0.03, freq);
      const wave = Math.abs(Math.sin(dir * freq * Math.PI * 2.0));
      return clamp((n1 * 0.45 + wave * 0.55), 0, 1);
    }

    function getPresetConfig(name) {
      switch (name) {
        case 'None':
          return {
            baseUniform: 0.3,
            useBaseNoise: false,
            baseAmp: 0,
            useScratches: false,
            scratchAmp: 0,
            craterMin: 0,
            craterMax: 0
          };
        case 'Light Wear':
          return {
            baseUniform: 0.35,
            useBaseNoise: true,
            baseAmp: 0.2,
            useScratches: false,
            scratchAmp: 0,
            craterMin: 0,
            craterMax: 0
          };
        case 'Heavy Erosion':
          return {
            baseUniform: 0.35,
            useBaseNoise: true,
            baseAmp: 0.8,
            useScratches: true,
            scratchAmp: 0.5,
            craterMin: 5,
            craterMax: 10
          };
        case 'Battle Scarred':
          return {
            baseUniform: 0.35,
            useBaseNoise: true,
            baseAmp: 0.4,
            useScratches: true,
            scratchAmp: 0.5,
            craterMin: 15,
            craterMax: 20
          };
        default:
          return {
            baseUniform: 0.35,
            useBaseNoise: true,
            baseAmp: 0.4,
            useScratches: true,
            scratchAmp: 0.25,
            craterMin: 5,
            craterMax: 10
          };
      }
    }

    function generateMap(presetName = 'Default') {
      const config = presetName === 'Default'
        ? {
            baseUniform: 0.35,
            useBaseNoise: true,
            baseAmp: 0.4,
            useScratches: true,
            scratchAmp: 0.25,
            craterMin: 5,
            craterMax: 10
          }
        : getPresetConfig(presetName);

      activePreset = presetName === 'Default' ? 'Custom Default' : presetName;

      for (let y = 0; y < TEXTURE_SIZE; y++) {
        for (let x = 0; x < TEXTURE_SIZE; x++) {
          const u = x / (TEXTURE_SIZE - 1);
          const v = y / (TEXTURE_SIZE - 1);

          let val = config.baseUniform;

          if (config.useBaseNoise) {
            const base = valueNoise.sample(u, v, 4);
            val += (base - 0.5) * 2.0 * config.baseAmp;
          }

          if (config.useScratches) {
            const scratch = directionalScratch(u, v, 32);
            const scratchMask = smoothstep(0.55, 0.95, scratch);
            val += scratchMask * config.scratchAmp;
          }

          roughnessData[y * TEXTURE_SIZE + x] = clamp(val, 0, 1);
        }
      }

      const rng = mulberry32(777 + presetName.length * 131);
      craterCount = config.craterMax > 0
        ? Math.floor(config.craterMin + rng() * (config.craterMax - config.craterMin + 1))
        : 0;

      for (let i = 0; i < craterCount; i++) {
        const cx = Math.floor(rng() * TEXTURE_SIZE);
        const cy = Math.floor(rng() * TEXTURE_SIZE);
        const radius = 10 + rng() * 20;
        const roughVal = 0.9 + rng() * 0.1;
        const minX = Math.max(0, Math.floor(cx - radius - 2));
        const maxX = Math.min(TEXTURE_SIZE - 1, Math.ceil(cx + radius + 2));
        const minY = Math.max(0, Math.floor(cy - radius - 2));
        const maxY = Math.min(TEXTURE_SIZE - 1, Math.ceil(cy + radius + 2));

        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            const dx = x - cx;
            const dy = y - cy;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d <= radius) {
              const falloff = 1.0 - smoothstep(radius * 0.55, radius, d);
              const idx = y * TEXTURE_SIZE + x;
              roughnessData[idx] = Math.max(roughnessData[idx], roughVal * falloff + roughnessData[idx] * (1 - falloff));
              roughnessData[idx] = clamp(roughnessData[idx], 0, 1);
            }
          }
        }
      }

      originalData.set(roughnessData);
      strokeCount = 0;
      lastPaintUV = null;
      uploadTexturesAndStats();
    }

    function uploadTexturesAndStats() {
      const roughImg = roughnessCtx.createImageData(TEXTURE_SIZE, TEXTURE_SIZE);
      const bumpImg = bumpCtx.createImageData(TEXTURE_SIZE, TEXTURE_SIZE);

      let sum = 0;
      let damaged = 0;

      for (let i = 0; i < roughnessData.length; i++) {
        const r = clamp(roughnessData[i], 0, 1);
        const g = Math.round(r * 255);
        const bi = Math.round((1.0 - r) * 255);

        const idx4 = i * 4;
        roughImg.data[idx4] = g;
        roughImg.data[idx4 + 1] = g;
        roughImg.data[idx4 + 2] = g;
        roughImg.data[idx4 + 3] = 255;

        bumpImg.data[idx4] = bi;
        bumpImg.data[idx4 + 1] = bi;
        bumpImg.data[idx4 + 2] = bi;
        bumpImg.data[idx4 + 3] = 255;

        sum += r;
        if (r > 0.75) damaged++;
      }

      roughnessCtx.putImageData(roughImg, 0, 0);
      bumpCtx.putImageData(bumpImg, 0, 0);

      roughnessTexture.needsUpdate = true;
      bumpTexture.needsUpdate = true;

      damagedPixelCount = damaged;
      avgRoughness = sum / roughnessData.length;

      document.getElementById('strokesHud').textContent = `Strokes: ${strokeCount}`;
      document.getElementById('damagedHud').textContent = `Damaged Pixels: ${damagedPixelCount}`;
      document.getElementById('avgHud').textContent = `Avg Roughness: ${avgRoughness.toFixed(4)}`;
    }

    function resetSurface() {
      if (activePreset === 'Custom Default') {
        generateMap('Default');
      } else {
        generateMap(activePreset);
      }
    }

    function paintAtUV(u, v) {
      const brushRadius = parseInt(document.getElementById('brushSize').value, 10);
      const cx = Math.floor(clamp(u, 0, 1) * (TEXTURE_SIZE - 1));
      const cy = Math.floor((1 - clamp(v, 0, 1)) * (TEXTURE_SIZE - 1));

      const minX = Math.max(0, cx - brushRadius);
      const maxX = Math.min(TEXTURE_SIZE - 1, cx + brushRadius);
      const minY = Math.max(0, cy - brushRadius);
      const maxY = Math.min(TEXTURE_SIZE - 1, cy + brushRadius);

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const dx = x - cx;
          const dy = y - cy;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d <= brushRadius) {
            const falloff = 1.0 - smoothstep(0, brushRadius, d);
            const idx = y * TEXTURE_SIZE + x;
            roughnessData[idx] = clamp(roughnessData[idx] + 0.15 * (0.35 + 0.65 * falloff), 0, 1);
          }
        }
      }

      strokeCount++;
      lastPaintUV = { u: Number(u.toFixed(4)), v: Number(v.toFixed(4)) };
      uploadTexturesAndStats();
    }

    function getPaintIntersection(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(plane, false);
      if (hits.length > 0 && hits[0].uv) return hits[0].uv;
      return null;
    }

    renderer.domElement.addEventListener('pointerdown', (event) => {
      const uv = getPaintIntersection(event);
      if (uv) {
        isPainting = true;
        controls.enabled = false;
        paintAtUV(uv.x, uv.y);
      }
    });

    window.addEventListener('pointermove', (event) => {
      if (!isPainting) return;
      const uv = getPaintIntersection(event);
      if (uv) paintAtUV(uv.x, uv.y);
    });

    window.addEventListener('pointerup', () => {
      isPainting = false;
      controls.enabled = true;
    });

    window.addEventListener('pointercancel', () => {
      isPainting = false;
      controls.enabled = true;
    });

    const brushSizeEl = document.getElementById('brushSize');
    const brushSizeValueEl = document.getElementById('brushSizeValue');
    brushSizeEl.addEventListener('input', () => {
      brushSizeValueEl.textContent = `${brushSizeEl.value} px`;
    });

    const baseRoughnessEl = document.getElementById('baseRoughness');
    const baseRoughnessValueEl = document.getElementById('baseRoughnessValue');
    baseRoughnessEl.addEventListener('input', () => {
      material.roughness = parseFloat(baseRoughnessEl.value);
      baseRoughnessValueEl.textContent = material.roughness.toFixed(2);
    });

    const bumpScaleEl = document.getElementById('bumpScale');
    const bumpScaleValueEl = document.getElementById('bumpScaleValue');
    bumpScaleEl.addEventListener('input', () => {
      material.bumpScale = parseFloat(bumpScaleEl.value);
      bumpScaleValueEl.textContent = material.bumpScale.toFixed(2);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      resetSurface();
    });

    document.getElementById('wireframeBtn').addEventListener('click', () => {
      material.wireframe = !material.wireframe;
    });

    const presetEl = document.getElementById('preset');
    presetEl.addEventListener('change', () => {
      generateMap(presetEl.value);
    });

    material.roughness = parseFloat(baseRoughnessEl.value);
    material.bumpScale = parseFloat(bumpScaleEl.value);
    generateMap('Light Wear');

    window.__3D_STATE__ = {
      cameraPosition: { x: 0, y: 2, z: 5 },
      baseRoughness: material.roughness,
      bumpScale: material.bumpScale,
      brushSize: parseInt(brushSizeEl.value, 10),
      wireframeEnabled: material.wireframe,
      strokeCount: 0,
      damagedPixelCount: 0,
      avgRoughness: 0,
      activePreset,
      craterCount,
      textureResolution: TEXTURE_SIZE,
      materialMetalness: material.metalness,
      lightCount: 3,
      surfaceSegments: SURFACE_SEGMENTS,
      roughnessMapApplied: !!material.roughnessMap,
      bumpMapApplied: !!material.bumpMap,
      lastPaintUV: null
    };

    const clock = new THREE.Clock();

    function updateState() {
      window.__3D_STATE__ = {
        cameraPosition: {
          x: Number(camera.position.x.toFixed(2)),
          y: Number(camera.position.y.toFixed(2)),
          z: Number(camera.position.z.toFixed(2))
        },
        baseRoughness: material.roughness,
        bumpScale: material.bumpScale,
        brushSize: parseInt(brushSizeEl.value, 10),
        wireframeEnabled: material.wireframe,
        strokeCount,
        damagedPixelCount,
        avgRoughness: Number(avgRoughness.toFixed(4)),
        activePreset,
        craterCount,
        textureResolution: TEXTURE_SIZE,
        materialMetalness: material.metalness,
        lightCount: 3,
        surfaceSegments: SURFACE_SEGMENTS,
        roughnessMapApplied: !!material.roughnessMap,
        bumpMapApplied: !!material.bumpMap,
        lastPaintUV
      };
    }

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();
      pointLight.position.set(Math.cos(t * 0.5) * 3, 3, Math.sin(t * 0.5) * 3);

      controls.update();
      updateState();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
