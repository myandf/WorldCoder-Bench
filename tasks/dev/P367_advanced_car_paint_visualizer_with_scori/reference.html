<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Car Paint Visualizer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    canvas {
      display: block;
    }

    #hud-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      background: rgba(10, 10, 20, 0.75);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 14px;
      min-width: 220px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    #hud-panel .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.4px;
      color: #d8e3ff;
    }

    #hud-panel .line {
      font-size: 13px;
      line-height: 1.7;
      color: #f2f2f2;
    }

    #top-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ui-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .ui-btn:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.35);
      transform: translateY(-1px);
    }

    .ui-btn:active {
      transform: translateY(0);
    }

    #paint-bar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(10, 10, 20, 0.78);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 32px);
    }

    .swatch-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      cursor: pointer;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .swatch-btn:hover {
      transform: scale(1.08);
      border-color: #ffffff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(26,26,46,0.75), rgba(10,10,20,0.95));
      color: #fff;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">Loading RobotExpressive.glb...</div>

  <div id="hud-panel">
    <div class="title">Paint Visualizer HUD</div>
    <div class="line">Current Paint: <span id="hud-paint">Default</span></div>
    <div class="line">Score: <span id="hud-score">0</span></div>
    <div class="line">Paint Changes: <span id="hud-changes">0</span></div>
  </div>

  <div id="top-controls">
    <button id="btn-wireframe" class="ui-btn">Toggle Wireframe</button>
    <button id="btn-reset" class="ui-btn">Reset Paint</button>
    <button id="btn-spin" class="ui-btn">Spin Model</button>
  </div>

  <div id="paint-bar"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const PAINT_PRESETS = [
      { name: 'Midnight Black', color: 0x111111, metalness: 0.9, roughness: 0.15, clearcoat: 1.0 },
      { name: 'Racing Red', color: 0xcc0000, metalness: 0.7, roughness: 0.2, clearcoat: 0.8 },
      { name: 'Ocean Blue', color: 0x0044aa, metalness: 0.8, roughness: 0.18, clearcoat: 0.9 },
      { name: 'Pearl White', color: 0xf5f5f0, metalness: 0.5, roughness: 0.25, clearcoat: 1.0 },
      { name: 'Forest Green', color: 0x1a6b1a, metalness: 0.6, roughness: 0.3, clearcoat: 0.7 },
      { name: 'Sunset Gold', color: 0xdaa520, metalness: 0.95, roughness: 0.1, clearcoat: 1.0 }
    ];

    const DEFAULT_MATERIAL = {
      name: 'Default',
      color: 0x888888,
      metalness: 0.3,
      roughness: 0.5,
      clearcoat: 0.0
    };

    const state = {
      modelLoaded: false,
      currentPaint: 'Default',
      paintIndex: -1,
      score: 0,
      paintChanges: 0,
      wireframeOn: false,
      wireframeBonusClaimed: false,
      rotationBonusClaimed: false,
      isSpinning: false,
      metalness: DEFAULT_MATERIAL.metalness,
      roughness: DEFAULT_MATERIAL.roughness,
      clearcoat: DEFAULT_MATERIAL.clearcoat,
      colorHex: '#888888'
    };

    window.__3D_STATE__ = state;

    const hudPaint = document.getElementById('hud-paint');
    const hudScore = document.getElementById('hud-score');
    const hudChanges = document.getElementById('hud-changes');
    const loadingEl = document.getElementById('loading');
    const paintBar = document.getElementById('paint-bar');
    const btnWireframe = document.getElementById('btn-wireframe');
    const btnReset = document.getElementById('btn-reset');
    const btnSpin = document.getElementById('btn-spin');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x1a1a2e);
    const envLight1 = new THREE.DirectionalLight(0xffffff, 3.0);
    envLight1.position.set(3, 6, 3);
    envScene.add(envLight1);
    const envLight2 = new THREE.DirectionalLight(0xaaccff, 2.0);
    envLight2.position.set(-4, 3, -2);
    envScene.add(envLight2);
    const envAmbient = new THREE.AmbientLight(0xffffff, 0.6);
    envScene.add(envAmbient);
    scene.environment = pmrem.fromScene(envScene, 0.04).texture;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.minPolarAngle = 0.3;
    controls.maxPolarAngle = 1.5;
    controls.update();

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
    scene.add(hemiLight);

    const pointLight = new THREE.PointLight(0xffffff, 1.0);
    pointLight.position.set(-3, 5, -3);
    scene.add(pointLight);

    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x222222,
      metalness: 0.9,
      roughness: 0.1,
      envMapIntensity: 1.2
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    let modelRoot = null;
    let modelGroup = new THREE.Group();
    scene.add(modelGroup);

    let spinStartTime = 0;
    let spinStartRotationY = 0;
    const spinDuration = 2000;

    const initialAzimuth = controls.getAzimuthalAngle();

    function hexStringFromColorValue(value) {
      return '#' + value.toString(16).padStart(6, '0');
    }

    function updateHUD() {
      hudPaint.textContent = state.currentPaint;
      hudScore.textContent = String(state.score);
      hudChanges.textContent = String(state.paintChanges);
    }

    function syncState(materialLike = null) {
      if (materialLike) {
        state.metalness = materialLike.metalness ?? 0;
        state.roughness = materialLike.roughness ?? 0;
        state.clearcoat = materialLike.clearcoat ?? 0;
        const color = materialLike.color instanceof THREE.Color
          ? materialLike.color
          : new THREE.Color(materialLike.color ?? 0x888888);
        state.colorHex = '#' + color.getHexString();
      }
      window.__3D_STATE__ = state;
      updateHUD();
    }

    function createPhysicalMaterial(config) {
      return new THREE.MeshPhysicalMaterial({
        color: config.color,
        metalness: config.metalness,
        roughness: config.roughness,
        clearcoat: config.clearcoat,
        clearcoatRoughness: Math.max(0.02, config.roughness * 0.5),
        envMapIntensity: 1.6,
        wireframe: state.wireframeOn
      });
    }

    function applyMaterialToModel(config, paintIndex, paintName) {
      if (!modelRoot) return;
      modelRoot.traverse((child) => {
        if (child.isMesh) {
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose && m.dispose());
            } else if (child.material.dispose) {
              child.material.dispose();
            }
          }
          child.material = createPhysicalMaterial(config);
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      state.currentPaint = paintName;
      state.paintIndex = paintIndex;
      syncState(config);
    }

    function applyPaintPreset(index) {
      const preset = PAINT_PRESETS[index];
      if (!preset) return;
      applyMaterialToModel(preset, index, preset.name);
      state.score += 10;
      state.paintChanges += 1;
      syncState(preset);
    }

    function resetPaint() {
      if (!modelRoot) return;
      applyMaterialToModel(DEFAULT_MATERIAL, -1, 'Default');
      state.score -= 5;
      syncState(DEFAULT_MATERIAL);
    }

    function setWireframe(enabled) {
      state.wireframeOn = enabled;
      if (modelRoot) {
        modelRoot.traverse((child) => {
          if (child.isMesh && child.material) {
            child.material.wireframe = enabled;
            child.material.needsUpdate = true;
          }
        });
      }
      if (!state.wireframeBonusClaimed) {
        state.score += 5;
        state.wireframeBonusClaimed = true;
      }
      syncState();
    }

    function checkRotationBonus() {
      const currentAzimuth = controls.getAzimuthalAngle();
      let delta = Math.abs(currentAzimuth - initialAzimuth);
      while (delta > Math.PI * 2) delta -= Math.PI * 2;
      if (delta > Math.PI) delta = Math.PI * 2 - delta;

      if (!state.rotationBonusClaimed && delta > Math.PI / 2) {
        state.score += 15;
        state.rotationBonusClaimed = true;
        syncState();
      }
    }

    controls.addEventListener('change', () => {
      checkRotationBonus();
    });

    PAINT_PRESETS.forEach((preset, index) => {
      const btn = document.createElement('button');
      btn.id = `paint-${index}`;
      btn.className = 'swatch-btn';
      btn.style.background = hexStringFromColorValue(preset.color);
      btn.title = preset.name;
      btn.addEventListener('click', () => applyPaintPreset(index));
      paintBar.appendChild(btn);
    });

    btnWireframe.addEventListener('click', () => {
      setWireframe(!state.wireframeOn);
    });

    btnReset.addEventListener('click', () => {
      resetPaint();
    });

    btnSpin.addEventListener('click', () => {
      if (!modelRoot || state.isSpinning) return;
      state.isSpinning = true;
      spinStartTime = performance.now();
      spinStartRotationY = modelGroup.rotation.y;
      syncState();
    });

    const loader = new GLTFLoader();
    loader.load(
      'RobotExpressive.glb',
      (gltf) => {
        modelRoot = gltf.scene;
        modelGroup.add(modelRoot);

        const box = new THREE.Box3().setFromObject(modelRoot);
        const center = box.getCenter(new THREE.Vector3());
        modelRoot.position.sub(center);

        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const targetScale = 1.5 / (maxDim / 2.0);
        modelRoot.scale.setScalar(targetScale);

        const boxAfterScale = new THREE.Box3().setFromObject(modelRoot);
        const minY = boxAfterScale.min.y;
        modelRoot.position.y -= minY;

        applyMaterialToModel(DEFAULT_MATERIAL, -1, 'Default');

        state.modelLoaded = true;
        syncState(DEFAULT_MATERIAL);
        loadingEl.classList.add('hidden');
      },
      undefined,
      (error) => {
        console.error('Failed to load RobotExpressive.glb:', error);

        const fallback = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.35, 1.2, 8, 16),
          createPhysicalMaterial(DEFAULT_MATERIAL)
        );
        fallback.position.set(0, 1.0, 0);

        modelRoot = new THREE.Group();
        modelRoot.add(fallback);
        modelGroup.add(modelRoot);

        state.modelLoaded = true;
        syncState(DEFAULT_MATERIAL);
        loadingEl.textContent = 'RobotExpressive.glb not found. Showing fallback mannequin.';
        setTimeout(() => loadingEl.classList.add('hidden'), 1400);
      }
    );

    const clock = new THREE.Clock();

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      controls.update(delta);

      if (state.isSpinning && modelRoot) {
        const elapsed = now - spinStartTime;
        const t = Math.min(elapsed / spinDuration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        modelGroup.rotation.y = spinStartRotationY + eased * Math.PI * 2;

        if (t >= 1) {
          state.isSpinning = false;
          syncState();
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    syncState(DEFAULT_MATERIAL);
    animate(performance.now());
  </script>
</body>
</html>
