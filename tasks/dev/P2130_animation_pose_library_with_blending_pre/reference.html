<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation Pose Library with Blending Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; }
canvas { display: block; }

.panel {
  position: absolute;
  background: rgba(10, 10, 30, 0.85);
  border: 1px solid rgba(100, 120, 255, 0.3);
  border-radius: 8px;
  color: #e0e0ff;
  padding: 12px;
  backdrop-filter: blur(10px);
}

#pose-library-panel {
  top: 10px; left: 10px; width: 280px; max-height: 80vh; overflow-y: auto;
}

#pose-library-panel h3 {
  font-size: 14px; color: #8899ff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
}

.pose-entry {
  background: rgba(40, 40, 80, 0.6);
  border: 1px solid rgba(100, 120, 255, 0.2);
  border-radius: 5px;
  padding: 6px 8px;
  margin-bottom: 4px;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.pose-entry .pose-info { flex: 1; }
.pose-entry .pose-id { color: #aabbff; font-weight: bold; }
.pose-entry .pose-detail { color: #8899aa; font-size: 11px; }

.pose-entry button {
  background: rgba(60, 70, 140, 0.6);
  border: 1px solid rgba(100, 120, 255, 0.3);
  color: #c0c8ff;
  padding: 2px 6px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 10px;
  margin-left: 3px;
}
.pose-entry button:hover { background: rgba(80, 90, 180, 0.8); }
.pose-entry button.active-a { background: rgba(50, 180, 100, 0.6); border-color: rgba(50, 200, 100, 0.5); }
.pose-entry button.active-b { background: rgba(180, 100, 50, 0.6); border-color: rgba(200, 100, 50, 0.5); }

.btn {
  background: rgba(60, 70, 140, 0.7);
  border: 1px solid rgba(100, 120, 255, 0.4);
  color: #d0d8ff;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  margin: 2px;
  transition: background 0.2s;
}
.btn:hover { background: rgba(80, 90, 180, 0.9); }

.btn-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

#blend-section {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(100, 120, 255, 0.2);
}

#blend-section label { font-size: 12px; color: #8899aa; }

#slider-blend {
  width: 100%;
  margin: 6px 0;
  accent-color: #6677ff;
}

#label-blend-weight {
  color: #aabbff;
  font-weight: bold;
  font-size: 14px;
}

#playback-section {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(100, 120, 255, 0.2);
}

#slider-timeline {
  width: 100%;
  margin: 6px 0;
  accent-color: #66aaff;
}

#bottom-hud {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 20px;
  font-size: 12px;
  color: #8899cc;
}

#bottom-hud .hud-item {
  background: rgba(10, 10, 30, 0.8);
  border: 1px solid rgba(100, 120, 255, 0.2);
  border-radius: 5px;
  padding: 6px 12px;
  backdrop-filter: blur(10px);
}

#bottom-hud .hud-value { color: #aabbff; font-weight: bold; }

#loading-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(10, 10, 30, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8899ff;
  font-size: 18px;
  z-index: 100;
}

.empty-msg { color: #556; font-size: 11px; font-style: italic; padding: 8px 0; }
</style>
</head>
<body>

<div id="loading-overlay">Loading stork model...</div>

<div id="pose-library-panel" class="panel">
  <h3>Pose Library</h3>
  <div id="pose-list"><div class="empty-msg">No poses captured yet</div></div>
  <div class="btn-row">
    <button class="btn" id="btn-capture">Capture Pose (C)</button>
    <button class="btn" id="btn-clear">Clear All</button>
  </div>

  <div id="blend-section">
    <label>Blend Weight: <span id="label-blend-weight">0.00</span></label>
    <input type="range" id="slider-blend" min="0" max="1" step="0.01" value="0">
    <div class="btn-row">
      <button class="btn" id="btn-play-preview">Play Preview (P)</button>
      <button class="btn" id="btn-reset-blend">Reset Blend (R)</button>
    </div>
  </div>

  <div id="playback-section">
    <label style="font-size:12px;color:#8899aa;">Animation Playback</label>
    <input type="range" id="slider-timeline" min="0" max="1" step="0.001" value="0">
    <div class="btn-row">
      <button class="btn" id="btn-playpause">Play (Space)</button>
    </div>
  </div>
</div>

<div id="bottom-hud">
  <div class="hud-item">Poses: <span class="hud-value" id="hud-poses">0/8</span></div>
  <div class="hud-item">Pose A: <span class="hud-value" id="hud-pose-a">None</span></div>
  <div class="hud-item">Pose B: <span class="hud-value" id="hud-pose-b">None</span></div>
  <div class="hud-item">Blend: <span class="hud-value" id="hud-blend">0.00</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// State
window.__3D_STATE__ = {
  modelLoaded: false,
  clipCount: 0,
  clipDuration: 0,
  currentTime: 0,
  isPlaying: false,
  poseCount: 0,
  poses: [],
  poseA: null,
  poseB: null,
  blendWeight: 0.0,
  isBlendPreviewPlaying: false,
  blendPreviewProgress: 0.0,
  modelPosition: { x: 0, y: 0, z: 0 },
  boneCount: 0,
  mixerTimeScale: 1,
  lastAction: ''
};

const state = window.__3D_STATE__;

// Scene
const scene = new THREE.Scene();

// Gradient background
const canvas2d = document.createElement('canvas');
canvas2d.width = 2; canvas2d.height = 256;
const ctx2d = canvas2d.getContext('2d');
const grad = ctx2d.createLinearGradient(0, 0, 0, 256);
grad.addColorStop(0, '#1a1a2e');
grad.addColorStop(1, '#16213e');
ctx2d.fillStyle = grad;
ctx2d.fillRect(0, 0, 2, 256);
const bgTex = new THREE.CanvasTexture(canvas2d);
scene.background = bgTex;

// Camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.update();

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 50;
dirLight.shadow.camera.left = -10;
dirLight.shadow.camera.right = 10;
dirLight.shadow.camera.top = 10;
dirLight.shadow.camera.bottom = -10;
scene.add(dirLight);

// Ground plane
const groundGeo = new THREE.PlaneGeometry(20, 20, 20, 20);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x334466,
  transparent: true,
  opacity: 0.3,
  wireframe: true
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Solid ground for shadow
const solidGroundGeo = new THREE.PlaneGeometry(20, 20);
const solidGroundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, transparent: true, opacity: 0.5 });
const solidGround = new THREE.Mesh(solidGroundGeo, solidGroundMat);
solidGround.rotation.x = -Math.PI / 2;
solidGround.position.y = -0.01;
solidGround.receiveShadow = true;
scene.add(solidGround);

// Pose library
let poseLibrary = [];
let poseCounter = 0;
let selectedPoseA = null;
let selectedPoseB = null;
let blendWeight = 0.0;
let isBlendPreviewPlaying = false;
let blendPreviewStartTime = 0;
const BLEND_PREVIEW_DURATION = 2.0;

// Animation
let mixer = null;
let clips = [];
let activeAction = null;
let model = null;
let skeleton = null;
let isPlaying = false;
let clock = new THREE.Clock();

// Bone snapshots for blending
function captureBoneSnapshot() {
  const snapshot = { morphs: [], bones: [], clipName: '', time: 0 };

  if (activeAction) {
    snapshot.clipName = activeAction.getClip().name;
    snapshot.time = activeAction.time;
  }

  if (skeleton) {
    skeleton.bones.forEach((bone, i) => {
      snapshot.bones.push({
        position: bone.position.clone(),
        quaternion: bone.quaternion.clone(),
        scale: bone.scale.clone()
      });
    });
  }

  // Capture morph targets
  if (model) {
    model.traverse(child => {
      if (child.isMesh && child.morphTargetInfluences) {
        snapshot.morphs.push({
          uuid: child.uuid,
          influences: [...child.morphTargetInfluences]
        });
      }
    });
  }

  return snapshot;
}

function applyBoneSnapshot(snapshot) {
  if (skeleton && snapshot.bones.length > 0) {
    skeleton.bones.forEach((bone, i) => {
      if (snapshot.bones[i]) {
        bone.position.copy(snapshot.bones[i].position);
        bone.quaternion.copy(snapshot.bones[i].quaternion);
        bone.scale.copy(snapshot.bones[i].scale);
      }
    });
  }

  if (model && snapshot.morphs.length > 0) {
    const morphMap = {};
    snapshot.morphs.forEach(m => { morphMap[m.uuid] = m.influences; });
    model.traverse(child => {
      if (child.isMesh && child.morphTargetInfluences && morphMap[child.uuid]) {
        const infl = morphMap[child.uuid];
        for (let i = 0; i < child.morphTargetInfluences.length; i++) {
          child.morphTargetInfluences[i] = infl[i] !== undefined ? infl[i] : 0;
        }
      }
    });
  }
}

function applyBlendedSnapshot(snapshotA, snapshotB, weight) {
  if (skeleton) {
    skeleton.bones.forEach((bone, i) => {
      const a = snapshotA.bones[i];
      const b = snapshotB.bones[i];
      if (a && b) {
        bone.position.lerpVectors(a.position, b.position, weight);
        bone.quaternion.slerpQuaternions(a.quaternion, b.quaternion, weight);
        bone.scale.lerpVectors(a.scale, b.scale, weight);
      }
    });
  }

  if (model) {
    const morphMapA = {};
    const morphMapB = {};
    snapshotA.morphs.forEach(m => { morphMapA[m.uuid] = m.influences; });
    snapshotB.morphs.forEach(m => { morphMapB[m.uuid] = m.influences; });

    model.traverse(child => {
      if (child.isMesh && child.morphTargetInfluences) {
        const inflA = morphMapA[child.uuid];
        const inflB = morphMapB[child.uuid];
        if (inflA && inflB) {
          for (let i = 0; i < child.morphTargetInfluences.length; i++) {
            const a = inflA[i] !== undefined ? inflA[i] : 0;
            const b = inflB[i] !== undefined ? inflB[i] : 0;
            child.morphTargetInfluences[i] = a + (b - a) * weight;
          }
        }
      }
    });
  }
}

function seekToTime(time) {
  if (!mixer || !activeAction) return;
  activeAction.time = time;
  mixer.update(0);
}

function capturePoseAtTime(clipName, time) {
  // Temporarily seek to the given time, capture, then restore
  const prevTime = activeAction ? activeAction.time : 0;
  const prevEffective = activeAction ? activeAction.paused : true;

  if (activeAction) {
    activeAction.paused = true;
    activeAction.time = time;
    mixer.update(0);
  }

  const snapshot = captureBoneSnapshot();

  // Restore
  if (activeAction) {
    activeAction.time = prevTime;
    activeAction.paused = prevEffective;
    mixer.update(0);
  }

  return snapshot;
}

// UI
const poseListEl = document.getElementById('pose-list');
const sliderBlend = document.getElementById('slider-blend');
const labelBlendWeight = document.getElementById('label-blend-weight');
const sliderTimeline = document.getElementById('slider-timeline');
const btnCapture = document.getElementById('btn-capture');
const btnClear = document.getElementById('btn-clear');
const btnPlayPreview = document.getElementById('btn-play-preview');
const btnResetBlend = document.getElementById('btn-reset-blend');
const btnPlayPause = document.getElementById('btn-playpause');

function updatePoseListUI() {
  if (poseLibrary.length === 0) {
    poseListEl.innerHTML = '<div class="empty-msg">No poses captured yet</div>';
  } else {
    poseListEl.innerHTML = '';
    poseLibrary.forEach((pose, idx) => {
      const entry = document.createElement('div');
      entry.className = 'pose-entry';

      const isA = selectedPoseA === pose.id;
      const isB = selectedPoseB === pose.id;

      entry.innerHTML = `
        <div class="pose-info">
          <span class="pose-id">${pose.id}</span>
          <span class="pose-detail">${pose.clipName} @ ${pose.time.toFixed(3)}s</span>
        </div>
        <button class="pose-btn-a ${isA ? 'active-a' : ''}" data-idx="${idx}">A</button>
        <button class="pose-btn-b ${isB ? 'active-b' : ''}" data-idx="${idx}">B</button>
      `;
      poseListEl.appendChild(entry);
    });

    poseListEl.querySelectorAll('.pose-btn-a').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        selectPoseA(idx);
      });
    });

    poseListEl.querySelectorAll('.pose-btn-b').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        selectPoseB(idx);
      });
    });
  }
}

function selectPoseA(idx) {
  if (idx >= 0 && idx < poseLibrary.length) {
    selectedPoseA = poseLibrary[idx].id;
    state.lastAction = 'select_pose_a';
    updatePoseListUI();
    applyBlend();
  }
}

function selectPoseB(idx) {
  if (idx >= 0 && idx < poseLibrary.length) {
    selectedPoseB = poseLibrary[idx].id;
    state.lastAction = 'select_pose_b';
    updatePoseListUI();
    applyBlend();
  }
}

function getPoseById(id) {
  return poseLibrary.find(p => p.id === id) || null;
}

function applyBlend() {
  const pA = getPoseById(selectedPoseA);
  const pB = getPoseById(selectedPoseB);

  if (pA && pB) {
    // Pause playback during blending
    if (activeAction) activeAction.paused = true;
    isPlaying = false;
    btnPlayPause.textContent = 'Play (Space)';
    applyBlendedSnapshot(pA.snapshot, pB.snapshot, blendWeight);
  } else if (pA && !pB) {
    if (activeAction) activeAction.paused = true;
    isPlaying = false;
    btnPlayPause.textContent = 'Play (Space)';
    applyBoneSnapshot(pA.snapshot);
  } else if (!pA && pB) {
    if (activeAction) activeAction.paused = true;
    isPlaying = false;
    btnPlayPause.textContent = 'Play (Space)';
    applyBoneSnapshot(pB.snapshot);
  }
}

function capturePose() {
  if (poseLibrary.length >= 8) return;
  if (!mixer || !activeAction) return;

  poseCounter++;
  const id = 'P' + poseCounter;
  const clipName = activeAction.getClip().name;
  const time = activeAction.time;
  const snapshot = captureBoneSnapshot();

  poseLibrary.push({ id, clipName, time, snapshot });
  state.lastAction = 'capture_pose';
  updatePoseListUI();
}

function clearAllPoses() {
  poseLibrary = [];
  poseCounter = 0;
  selectedPoseA = null;
  selectedPoseB = null;
  blendWeight = 0;
  sliderBlend.value = 0;
  labelBlendWeight.textContent = '0.00';
  state.lastAction = 'clear_all';
  updatePoseListUI();
}

function setBlendWeight(w) {
  blendWeight = Math.max(0, Math.min(1, w));
  sliderBlend.value = blendWeight;
  labelBlendWeight.textContent = blendWeight.toFixed(2);
  applyBlend();
}

function startBlendPreview() {
  isBlendPreviewPlaying = true;
  blendPreviewStartTime = performance.now() / 1000;
  state.lastAction = 'play_preview';
}

function resetBlend() {
  setBlendWeight(0);
  isBlendPreviewPlaying = false;
  state.lastAction = 'reset_blend';
}

function togglePlayPause() {
  if (!activeAction) return;
  isPlaying = !isPlaying;
  activeAction.paused = !isPlaying;
  btnPlayPause.textContent = isPlaying ? 'Pause (Space)' : 'Play (Space)';
  state.lastAction = isPlaying ? 'play' : 'pause';
}

// Event listeners
btnCapture.addEventListener('click', capturePose);
btnClear.addEventListener('click', clearAllPoses);
btnPlayPreview.addEventListener('click', startBlendPreview);
btnResetBlend.addEventListener('click', resetBlend);
btnPlayPause.addEventListener('click', togglePlayPause);

sliderBlend.addEventListener('input', () => {
  blendWeight = parseFloat(sliderBlend.value);
  labelBlendWeight.textContent = blendWeight.toFixed(2);
  state.lastAction = 'blend_changed';
  applyBlend();
});

sliderTimeline.addEventListener('input', () => {
  if (!activeAction) return;
  const t = parseFloat(sliderTimeline.value);
  activeAction.time = t;
  activeAction.paused = true;
  isPlaying = false;
  btnPlayPause.textContent = 'Play (Space)';
  mixer.update(0);
  state.lastAction = 'scrub';
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;

  const key = e.key;

  if (key === 'c' || key === 'C') {
    capturePose();
  } else if (key === ' ') {
    e.preventDefault();
    togglePlayPause();
  } else if (key === 'r' || key === 'R') {
    resetBlend();
  } else if (key === 'p' || key === 'P') {
    startBlendPreview();
  } else if (key === 'Delete') {
    clearAllPoses();
  } else if (!e.shiftKey && key >= '1' && key <= '8') {
    const idx = parseInt(key) - 1;
    selectPoseA(idx);
  } else if (e.shiftKey && key >= '!' && key <= '*') {
    // Shift+number produces different chars depending on keyboard layout
    const shiftMap = { '!': 0, '@': 1, '#': 2, '$': 3, '%': 4, '^': 5, '&': 6, '*': 7 };
    if (shiftMap[key] !== undefined) {
      selectPoseB(shiftMap[key]);
    }
  }
});

// Also handle shift+digit via code
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.shiftKey && e.code && e.code.startsWith('Digit')) {
    const idx = parseInt(e.code.replace('Digit', '')) - 1;
    if (idx >= 0 && idx <= 7) {
      selectPoseB(idx);
    }
  }
});

// Load model
const loader = new GLTFLoader();
loader.load('Fox.glb', (gltf) => {
  model = gltf.scene;
  model.position.set(0, 0, 0);

  model.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });

  scene.add(model);

  // Find skeleton
  model.traverse(child => {
    if (child.isSkinnedMesh && child.skeleton) {
      skeleton = child.skeleton;
    }
  });

  // Setup animations
  clips = gltf.animations || [];
  state.clipCount = clips.length;

  if (clips.length > 0) {
    mixer = new THREE.AnimationMixer(model);
    activeAction = mixer.clipAction(clips[0]);
    activeAction.play();
    activeAction.paused = true;
    activeAction.time = 0;

    const duration = clips[0].duration;
    state.clipDuration = duration;
    sliderTimeline.max = duration;
    sliderTimeline.step = duration / 1000;

    mixer.update(0);
  }

  state.modelLoaded = true;
  state.boneCount = skeleton ? skeleton.bones.length : 0;
  state.modelPosition = { x: model.position.x, y: model.position.y, z: model.position.z };

  document.getElementById('loading-overlay').style.display = 'none';
}, undefined, (err) => {
  console.error('Error loading model:', err);
  document.getElementById('loading-overlay').textContent = 'Failed to load Fox.glb - ' + err.message;

  // Still mark as attempted
  state.modelLoaded = false;
});

// HUD update
function updateHUD() {
  document.getElementById('hud-poses').textContent = `${poseLibrary.length}/8`;
  document.getElementById('hud-pose-a').textContent = selectedPoseA || 'None';
  document.getElementById('hud-pose-b').textContent = selectedPoseB || 'None';
  document.getElementById('hud-blend').textContent = blendWeight.toFixed(2);
}

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  // Blend preview animation
  if (isBlendPreviewPlaying) {
    const now = performance.now() / 1000;
    const elapsed = now - blendPreviewStartTime;
    const progress = Math.min(elapsed / BLEND_PREVIEW_DURATION, 1.0);
    setBlendWeight(progress);
    state.blendPreviewProgress = progress;

    if (progress >= 1.0) {
      isBlendPreviewPlaying = false;
    }
  }

  // Update mixer
  if (mixer && isPlaying) {
    mixer.update(delta);
    if (activeAction) {
      sliderTimeline.value = activeAction.time;
    }
  }

  controls.update();

  // Update state
  state.isPlaying = isPlaying;
  state.currentTime = activeAction ? activeAction.time : 0;
  state.poseCount = poseLibrary.length;
  state.poses = poseLibrary.map(p => ({ id: p.id, clipName: p.clipName, time: p.time }));
  state.poseA = selectedPoseA;
  state.poseB = selectedPoseB;
  state.blendWeight = blendWeight;
  state.isBlendPreviewPlaying = isBlendPreviewPlaying;
  if (!isBlendPreviewPlaying) state.blendPreviewProgress = blendWeight;
  state.mixerTimeScale = mixer ? mixer.timeScale : 1;

  if (model) {
    state.modelPosition = { x: model.position.x, y: model.position.y, z: model.position.z };
  }

  updateHUD();

  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
