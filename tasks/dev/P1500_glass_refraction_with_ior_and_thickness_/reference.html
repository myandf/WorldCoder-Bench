<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Glass Refraction Controls</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: monospace;
    }
    canvas {
      display: block;
    }
    #uiPanel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 100;
      min-width: 280px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      user-select: none;
    }
    #uiPanel h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }
    .control {
      margin-bottom: 10px;
    }
    .control label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      width: 100%;
    }
    input[type="color"] {
      width: 48px;
      height: 30px;
      border: none;
      padding: 0;
      background: transparent;
    }
    select, button {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #1f1f1f;
      color: white;
      font-family: monospace;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #ccc;
      line-height: 1.4;
    }
    .value {
      min-width: 42px;
      text-align: right;
      color: #9fe8ff;
    }
  </style>
</head>
<body>
  <div id="uiPanel">
    <h2>Glass Refraction Controls</h2>

    <div class="control">
      <label for="activeObject">Active Object</label>
      <select id="activeObject">
        <option value="torusknot">Torus Knot</option>
        <option value="sphere">Sphere</option>
      </select>
    </div>

    <div class="control">
      <label for="iorSlider">IOR: <span id="iorValue">1.50</span></label>
      <input type="range" id="iorSlider" min="1.0" max="2.5" step="0.01" value="1.5" />
    </div>

    <div class="control">
      <label for="thicknessSlider">Thickness: <span id="thicknessValue">0.50</span></label>
      <input type="range" id="thicknessSlider" min="0.01" max="2.0" step="0.01" value="0.5" />
    </div>

    <div class="control">
      <label for="roughnessSlider">Roughness: <span id="roughnessValue">0.00</span></label>
      <input type="range" id="roughnessSlider" min="0.0" max="1.0" step="0.01" value="0.0" />
    </div>

    <div class="control">
      <label for="attenuationColor">Attenuation Color</label>
      <div class="row">
        <input type="color" id="attenuationColor" value="#ffffff" />
      </div>
    </div>

    <div class="control">
      <label>
        <input type="checkbox" id="wireframeToggle" />
        Wireframe
      </label>
    </div>

    <div class="control">
      <button id="resetBtn">Reset Defaults</button>
    </div>

    <div class="hint">
      Keys: [1] Torus Knot, [2] Sphere, [R] Reset, [W] Wireframe, [T] Thickness Presets
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 2, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0xaaccff, 0.6);
    pointLight.position.set(-3, 3, 3);
    scene.add(pointLight);

    const checkerCanvas = document.createElement('canvas');
    checkerCanvas.width = 256;
    checkerCanvas.height = 256;
    const ctx = checkerCanvas.getContext('2d');
    const cells = 8;
    const cellSize = checkerCanvas.width / cells;
    for (let y = 0; y < cells; y++) {
      for (let x = 0; x < cells; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#ffffff' : '#000000';
        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
      }
    }
    const checkerTexture = new THREE.CanvasTexture(checkerCanvas);
    checkerTexture.wrapS = THREE.RepeatWrapping;
    checkerTexture.wrapT = THREE.RepeatWrapping;
    checkerTexture.repeat.set(8, 8);
    checkerTexture.colorSpace = THREE.SRGBColorSpace;

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({
        map: checkerTexture,
        side: THREE.DoubleSide
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1;
    scene.add(floor);

    const refractionTargets = [];
    const targetColors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
    const circleRadius = 3;
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 32, 32),
        new THREE.MeshStandardMaterial({
          color: targetColors[i],
          emissive: targetColors[i],
          emissiveIntensity: 0.15
        })
      );
      sphere.position.set(
        Math.cos(angle) * circleRadius,
        1,
        -2 + Math.sin(angle) * 0.4
      );
      scene.add(sphere);
      refractionTargets.push(sphere);
    }

    const defaults = {
      torusknot: {
        ior: 1.5,
        thickness: 0.5,
        roughness: 0.0,
        wireframe: false,
        attenuationColor: '#ffffff',
        transmission: 1.0
      },
      sphere: {
        ior: 1.33,
        thickness: 0.3,
        roughness: 0.0,
        wireframe: false,
        attenuationColor: '#88ccff',
        transmission: 1.0
      }
    };

    function createGlassMaterial(cfg) {
      return new THREE.MeshPhysicalMaterial({
        transmission: cfg.transmission,
        transparent: true,
        roughness: cfg.roughness,
        metalness: 0.0,
        ior: cfg.ior,
        thickness: cfg.thickness,
        color: 0xffffff,
        envMapIntensity: 1.0,
        clearcoat: 0.1,
        attenuationColor: new THREE.Color(cfg.attenuationColor),
        attenuationDistance: 0.5,
        wireframe: cfg.wireframe
      });
    }

    const torusKnot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1.2, 0.4, 128, 32),
      createGlassMaterial(defaults.torusknot)
    );
    torusKnot.position.set(0, 0, 0);
    scene.add(torusKnot);

    const glassSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 64, 64),
      createGlassMaterial(defaults.sphere)
    );
    glassSphere.position.set(3, 0.5, 0);
    scene.add(glassSphere);

    const objects = {
      torusknot: torusKnot,
      sphere: glassSphere
    };

    const thicknessPresets = [0.1, 0.5, 1.0, 1.5];
    let thicknessPresetIndex = 1;
    let activeObject = 'torusknot';
    let frameCount = 0;

    const activeObjectSelect = document.getElementById('activeObject');
    const iorSlider = document.getElementById('iorSlider');
    const thicknessSlider = document.getElementById('thicknessSlider');
    const roughnessSlider = document.getElementById('roughnessSlider');
    const attenuationColorInput = document.getElementById('attenuationColor');
    const wireframeToggle = document.getElementById('wireframeToggle');
    const resetBtn = document.getElementById('resetBtn');

    const iorValue = document.getElementById('iorValue');
    const thicknessValue = document.getElementById('thicknessValue');
    const roughnessValue = document.getElementById('roughnessValue');

    function colorToHexString(color) {
      return '#' + color.getHexString();
    }

    function getActiveMesh() {
      return objects[activeObject];
    }

    function syncPresetIndexFromThickness(value) {
      const idx = thicknessPresets.findIndex(v => Math.abs(v - value) < 0.0001);
      if (idx !== -1) thicknessPresetIndex = idx;
    }

    function updateUIFromActiveObject() {
      const mat = getActiveMesh().material;
      activeObjectSelect.value = activeObject;
      iorSlider.value = mat.ior.toFixed(2);
      thicknessSlider.value = mat.thickness.toFixed(2);
      roughnessSlider.value = mat.roughness.toFixed(2);
      attenuationColorInput.value = colorToHexString(mat.attenuationColor);
      wireframeToggle.checked = !!mat.wireframe;
      iorValue.textContent = Number(mat.ior).toFixed(2);
      thicknessValue.textContent = Number(mat.thickness).toFixed(2);
      roughnessValue.textContent = Number(mat.roughness).toFixed(2);
      syncPresetIndexFromThickness(mat.thickness);
      updateState();
    }

    function applyCurrentControlsToActiveObject() {
      const mat = getActiveMesh().material;
      mat.ior = parseFloat(iorSlider.value);
      mat.thickness = parseFloat(thicknessSlider.value);
      mat.roughness = parseFloat(roughnessSlider.value);
      mat.attenuationColor.set(attenuationColorInput.value);
      mat.wireframe = wireframeToggle.checked;
      mat.needsUpdate = true;

      iorValue.textContent = Number(mat.ior).toFixed(2);
      thicknessValue.textContent = Number(mat.thickness).toFixed(2);
      roughnessValue.textContent = Number(mat.roughness).toFixed(2);
      syncPresetIndexFromThickness(mat.thickness);
      updateState();
    }

    function resetActiveObject() {
      const mat = getActiveMesh().material;
      const def = defaults[activeObject];
      mat.ior = def.ior;
      mat.thickness = def.thickness;
      mat.roughness = def.roughness;
      mat.transmission = def.transmission;
      mat.wireframe = def.wireframe;
      mat.attenuationColor.set(def.attenuationColor);
      mat.needsUpdate = true;
      updateUIFromActiveObject();
    }

    function cycleThicknessPreset() {
      thicknessPresetIndex = (thicknessPresetIndex + 1) % thicknessPresets.length;
      const value = thicknessPresets[thicknessPresetIndex];
      thicknessSlider.value = value.toFixed(2);
      thicknessValue.textContent = value.toFixed(2);
      getActiveMesh().material.thickness = value;
      getActiveMesh().material.needsUpdate = true;
      updateState();
    }

    activeObjectSelect.addEventListener('change', () => {
      activeObject = activeObjectSelect.value;
      updateUIFromActiveObject();
    });

    iorSlider.addEventListener('input', applyCurrentControlsToActiveObject);
    thicknessSlider.addEventListener('input', applyCurrentControlsToActiveObject);
    roughnessSlider.addEventListener('input', applyCurrentControlsToActiveObject);
    attenuationColorInput.addEventListener('input', applyCurrentControlsToActiveObject);
    wireframeToggle.addEventListener('change', applyCurrentControlsToActiveObject);
    resetBtn.addEventListener('click', resetActiveObject);

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === '1') {
        activeObject = 'torusknot';
        updateUIFromActiveObject();
      } else if (key === '2') {
        activeObject = 'sphere';
        updateUIFromActiveObject();
      } else if (key === 'r') {
        resetActiveObject();
      } else if (key === 'w') {
        wireframeToggle.checked = !wireframeToggle.checked;
        applyCurrentControlsToActiveObject();
      } else if (key === 't') {
        cycleThicknessPreset();
      }
    });

    window.__3D_STATE__ = {
      activeObject: 'torusknot',
      torusknot: {
        ior: defaults.torusknot.ior,
        thickness: defaults.torusknot.thickness,
        roughness: defaults.torusknot.roughness,
        wireframe: defaults.torusknot.wireframe,
        attenuationColor: defaults.torusknot.attenuationColor,
        transmission: defaults.torusknot.transmission,
        positionX: 0,
        positionY: 0,
        positionZ: 0
      },
      sphere: {
        ior: defaults.sphere.ior,
        thickness: defaults.sphere.thickness,
        roughness: defaults.sphere.roughness,
        wireframe: defaults.sphere.wireframe,
        attenuationColor: defaults.sphere.attenuationColor,
        transmission: defaults.sphere.transmission,
        positionX: 3,
        positionY: 0.5,
        positionZ: 0
      },
      camera: { x: 0, y: 2, z: 6 },
      refTargetCount: 5,
      lightCount: 3,
      thicknessPresetIndex: thicknessPresetIndex,
      frameCount: 0,
      rendererToneMapping: 'ACESFilmic'
    };

    function updateState() {
      const torusMat = torusKnot.material;
      const sphereMat = glassSphere.material;

      window.__3D_STATE__.activeObject = activeObject;
      window.__3D_STATE__.torusknot = {
        ior: torusMat.ior,
        thickness: torusMat.thickness,
        roughness: torusMat.roughness,
        wireframe: !!torusMat.wireframe,
        attenuationColor: colorToHexString(torusMat.attenuationColor),
        transmission: torusMat.transmission,
        positionX: torusKnot.position.x,
        positionY: torusKnot.position.y,
        positionZ: torusKnot.position.z
      };
      window.__3D_STATE__.sphere = {
        ior: sphereMat.ior,
        thickness: sphereMat.thickness,
        roughness: sphereMat.roughness,
        wireframe: !!sphereMat.wireframe,
        attenuationColor: colorToHexString(sphereMat.attenuationColor),
        transmission: sphereMat.transmission,
        positionX: glassSphere.position.x,
        positionY: glassSphere.position.y,
        positionZ: glassSphere.position.z
      };
      window.__3D_STATE__.camera = {
        x: camera.position.x,
        y: camera.position.y,
        z: camera.position.z
      };
      window.__3D_STATE__.refTargetCount = refractionTargets.length;
      window.__3D_STATE__.lightCount = 3;
      window.__3D_STATE__.thicknessPresetIndex = thicknessPresetIndex;
      window.__3D_STATE__.frameCount = frameCount;
      window.__3D_STATE__.rendererToneMapping = 'ACESFilmic';
    }

    updateUIFromActiveObject();

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;
      torusKnot.rotation.y += 0.005;
      controls.update();
      updateState();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateState();
    });
  </script>
</body>
</html>
