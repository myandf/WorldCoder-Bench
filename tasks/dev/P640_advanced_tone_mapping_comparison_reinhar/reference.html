<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Tone Mapping Comparison Benchmark</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    canvas {
      display: block;
    }

    .hud {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    #info {
      top: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 240px;
      backdrop-filter: blur(6px);
    }

    #scorePanel {
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 280px;
      backdrop-filter: blur(6px);
    }

    #controls {
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 16px;
      white-space: nowrap;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    #benchmarkWrap {
      position: fixed;
      top: 140px;
      right: 14px;
      z-index: 11;
      pointer-events: auto;
    }

    #benchmarkBtn {
      background: linear-gradient(180deg, #3d7cff, #2255cc);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    #benchmarkBtn:hover {
      filter: brightness(1.08);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #dfe9ff;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 5px 0;
      font-size: 14px;
    }

    .label {
      opacity: 0.8;
    }

    .value {
      font-weight: 700;
    }

    #benchmarkResults {
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 10px;
      font-size: 13px;
    }

    .bench-item {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
      opacity: 0.92;
    }

    .winner {
      color: #7dff9f;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="info" class="hud">
    <div class="title">Tone Mapping</div>
    <div class="row"><span class="label">Mode</span><span class="value" id="modeValue">None</span></div>
    <div class="row"><span class="label">Exposure</span><span class="value" id="exposureValue">1.0</span></div>
    <div class="row"><span class="label">Objects</span><span class="value" id="objectsValue">0</span></div>
  </div>

  <div id="scorePanel" class="hud">
    <div class="title">Scoring</div>
    <div class="row"><span class="label">Dynamic Range</span><span class="value" id="drScore">0</span></div>
    <div class="row"><span class="label">Contrast</span><span class="value" id="contrastScore">0</span></div>
    <div class="row"><span class="label">Highlight Recovery</span><span class="value" id="highlightScore">0</span></div>
    <div class="row"><span class="label">Total</span><span class="value" id="totalScore">0</span></div>
    <div id="benchmarkResults"></div>
  </div>

  <div id="benchmarkWrap">
    <button id="benchmarkBtn">Run Benchmark</button>
  </div>

  <div id="controls" class="hud">
    1-4: Tone Mapping Modes &nbsp;|&nbsp; Q / E: Exposure - / + &nbsp;|&nbsp; Benchmark button: score all 4 modes
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const MODES = {
      1: { name: 'None', toneMapping: THREE.NoToneMapping },
      2: { name: 'Reinhard', toneMapping: THREE.ReinhardToneMapping },
      3: { name: 'ACES', toneMapping: THREE.ACESFilmicToneMapping },
      4: { name: 'Cineon', toneMapping: THREE.CineonToneMapping }
    };

    const state = window.__3D_STATE__ = {
      currentMode: 1,
      modeName: 'None',
      exposure: 1.0,
      scores: { dynamicRange: 0, contrast: 0, highlightRecovery: 0, total: 0 },
      benchmarkResults: null,
      benchmarkWinner: null,
      benchmarkComplete: false,
      frameCount: 0,
      objectCount: 0,
      pixelsSampled: 0
    };

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 3, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    function createProceduralEnvironment() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0.0, '#0a1530');
      grad.addColorStop(0.25, '#20406a');
      grad.addColorStop(0.5, '#8cb4ff');
      grad.addColorStop(0.72, '#f2d6b0');
      grad.addColorStop(1.0, '#27313f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const sun = ctx.createRadialGradient(760, 160, 15, 760, 160, 180);
      sun.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      sun.addColorStop(0.08, 'rgba(255,248,220,0.95)');
      sun.addColorStop(0.4, 'rgba(255,220,170,0.5)');
      sun.addColorStop(1.0, 'rgba(255,220,170,0.0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const darkPatch = ctx.createRadialGradient(200, 120, 10, 200, 120, 220);
      darkPatch.addColorStop(0.0, 'rgba(10,10,20,0.6)');
      darkPatch.addColorStop(1.0, 'rgba(10,10,20,0.0)');
      ctx.fillStyle = darkPatch;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 1200; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height * 0.6;
        const a = Math.random() * 0.08;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillRect(x, y, 2, 2);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.mapping = THREE.EquirectangularReflectionMapping;
      texture.needsUpdate = true;
      return texture;
    }

    const envTexture = createProceduralEnvironment();
    scene.background = envTexture;
    scene.environment = envTexture;

    const ambientFloorGeo = new THREE.CircleGeometry(7, 64);
    const ambientFloorMat = new THREE.MeshStandardMaterial({
      color: 0x808080,
      roughness: 0.9,
      metalness: 0.0
    });
    const floor = new THREE.Mesh(ambientFloorGeo, ambientFloorMat);
    floor.rotation.x = -Math.PI * 0.5;
    floor.position.y = -1.4;
    scene.add(floor);

    const chromeSphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.0, 64, 64),
      new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 1.0,
        roughness: 0.02,
        envMapIntensity: 2.0
      })
    );
    chromeSphere.position.set(-2.2, 0.1, 0.2);
    scene.add(chromeSphere);

    const matteCube = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 1.7, 1.7),
      new THREE.MeshStandardMaterial({
        color: 0x5f8fff,
        roughness: 0.95,
        metalness: 0.0
      })
    );
    matteCube.position.set(0, -0.15, 0);
    scene.add(matteCube);

    const glassTorus = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.9, 0.28, 160, 24),
      new THREE.MeshPhysicalMaterial({
        color: 0xbfdfff,
        roughness: 0.03,
        metalness: 0.0,
        transmission: 1.0,
        transparent: true,
        opacity: 0.92,
        thickness: 1.2,
        ior: 1.45,
        envMapIntensity: 1.5
      })
    );
    glassTorus.position.set(2.3, 0.3, 0.1);
    scene.add(glassTorus);

    const emissivePlane = new THREE.Mesh(
      new THREE.PlaneGeometry(3.2, 1.6),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffdcb0,
        emissiveIntensity: 22,
        roughness: 0.2,
        metalness: 0.0,
        side: THREE.DoubleSide
      })
    );
    emissivePlane.position.set(0, 2.2, -2.7);
    emissivePlane.lookAt(0, 0.2, 0);
    scene.add(emissivePlane);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 3.0);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0xfff2d0, 50, 40, 2);
    pointLight.position.set(-3, 2, -3);
    scene.add(pointLight);

    const hemiFill = new THREE.HemisphereLight(0x88aaff, 0x222222, 0.3);
    scene.add(hemiFill);

    let currentMode = 1;
    let exposure = 1.0;
    let currentScores = { dynamicRange: 0, contrast: 0, highlightRecovery: 0, total: 0 };

    let scoreTargetWidth = 160;
    let scoreTargetHeight = 90;
    let scoreTarget = new THREE.WebGLRenderTarget(scoreTargetWidth, scoreTargetHeight, {
      depthBuffer: true,
      stencilBuffer: false,
      type: THREE.UnsignedByteType,
      format: THREE.RGBAFormat,
      colorSpace: THREE.SRGBColorSpace
    });
    let pixelBuffer = new Uint8Array(scoreTargetWidth * scoreTargetHeight * 4);

    function countMeshes() {
      let count = 0;
      scene.traverse(obj => {
        if (obj.isMesh) count++;
      });
      state.objectCount = count;
      return count;
    }
    countMeshes();

    function markAllMaterialsDirty() {
      scene.traverse(obj => {
        if (!obj.material) return;
        if (Array.isArray(obj.material)) {
          obj.material.forEach(m => m && (m.needsUpdate = true));
        } else {
          obj.material.needsUpdate = true;
        }
      });
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function round1(v) {
      return Math.round(v * 10) / 10;
    }

    function syncState() {
      state.currentMode = currentMode;
      state.modeName = MODES[currentMode].name;
      state.exposure = round1(exposure);
      state.scores = {
        dynamicRange: currentScores.dynamicRange,
        contrast: currentScores.contrast,
        highlightRecovery: currentScores.highlightRecovery,
        total: currentScores.total
      };
      state.objectCount = countMeshes();
      state.pixelsSampled = scoreTargetWidth * scoreTargetHeight;
    }

    function updateHUD() {
      document.getElementById('modeValue').textContent = MODES[currentMode].name;
      document.getElementById('exposureValue').textContent = round1(exposure).toFixed(1);
      document.getElementById('objectsValue').textContent = state.objectCount;

      document.getElementById('drScore').textContent = currentScores.dynamicRange;
      document.getElementById('contrastScore').textContent = currentScores.contrast;
      document.getElementById('highlightScore').textContent = currentScores.highlightRecovery;
      document.getElementById('totalScore').textContent = currentScores.total;

      const wrap = document.getElementById('benchmarkResults');
      if (!state.benchmarkResults) {
        wrap.innerHTML = '<div class="label">Benchmark not run yet</div>';
        return;
      }

      const winner = state.benchmarkWinner;
      let html = `<div class="title" style="font-size:13px;margin-bottom:6px;">Benchmark Results</div>`;
      for (const r of state.benchmarkResults) {
        const cls = r.mode === winner ? 'bench-item winner' : 'bench-item';
        html += `<div class="${cls}"><span>${r.mode}. ${r.modeName}</span><span>${r.total}</span></div>`;
      }
      wrap.innerHTML = html;
    }

    function applyMode(mode, doScore = true) {
      currentMode = clamp(mode, 1, 4);
      renderer.toneMapping = MODES[currentMode].toneMapping;
      renderer.toneMappingExposure = exposure;
      renderer.needsUpdate = true;
      markAllMaterialsDirty();

      if (doScore) {
        currentScores = evaluateCurrentSceneScore();
      }
      syncState();
      updateHUD();
    }

    function setExposure(nextExposure) {
      exposure = round1(clamp(nextExposure, 0.2, 5.0));
      renderer.toneMappingExposure = exposure;
      renderer.needsUpdate = true;
      markAllMaterialsDirty();

      currentScores = evaluateCurrentSceneScore();
      syncState();
      updateHUD();
    }

    function evaluateCurrentSceneScore() {
      const prevTarget = renderer.getRenderTarget();
      renderer.setRenderTarget(scoreTarget);
      renderer.render(scene, camera);
      renderer.readRenderTargetPixels(scoreTarget, 0, 0, scoreTargetWidth, scoreTargetHeight, pixelBuffer);
      renderer.setRenderTarget(prevTarget);

      const totalPixels = scoreTargetWidth * scoreTargetHeight;
      let goodRangeCount = 0;
      let clippedCount = 0;
      let sum = 0;
      let sumSq = 0;

      for (let i = 0; i < totalPixels; i++) {
        const j = i * 4;
        const r = pixelBuffer[j] / 255;
        const g = pixelBuffer[j + 1] / 255;
        const b = pixelBuffer[j + 2] / 255;
        const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;

        if (luminance >= 0.1 && luminance <= 0.9) goodRangeCount++;
        if (luminance > 0.99) clippedCount++;

        sum += luminance;
        sumSq += luminance * luminance;
      }

      const goodRatio = goodRangeCount / totalPixels;
      const clippedRatio = clippedCount / totalPixels;
      const mean = sum / totalPixels;
      const variance = Math.max(0, (sumSq / totalPixels) - (mean * mean));
      const stdDev = Math.sqrt(variance);

      const dynamicRangeScore = Math.round(clamp(goodRatio * 40, 0, 40));

      const optimalStdDev = 0.25;
      const contrastFit = clamp(1 - Math.abs(stdDev - optimalStdDev) / optimalStdDev, 0, 1);
      const contrastScore = Math.round(contrastFit * 30);

      const highlightScore = Math.round(clamp((1 - clippedRatio) * 30, 0, 30));

      const total = dynamicRangeScore + contrastScore + highlightScore;

      return {
        dynamicRange: dynamicRangeScore,
        contrast: contrastScore,
        highlightRecovery: highlightScore,
        total
      };
    }

    function runBenchmark() {
      const originalMode = currentMode;
      const results = [];

      for (let mode = 1; mode <= 4; mode++) {
        renderer.toneMapping = MODES[mode].toneMapping;
        renderer.toneMappingExposure = exposure;
        renderer.needsUpdate = true;
        markAllMaterialsDirty();
        const score = evaluateCurrentSceneScore();

        results.push({
          mode,
          modeName: MODES[mode].name,
          total: score.total
        });
      }

      results.sort((a, b) => b.total - a.total || a.mode - b.mode);
      state.benchmarkResults = results;
      state.benchmarkWinner = results.length ? results[0].mode : null;
      state.benchmarkComplete = true;

      applyMode(originalMode, true);
      syncState();
      updateHUD();
    }

    document.getElementById('benchmarkBtn').addEventListener('click', runBenchmark);

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === '1' || key === '2' || key === '3' || key === '4') {
        applyMode(Number(key), true);
      } else if (key === 'q') {
        setExposure(exposure - 0.2);
      } else if (key === 'e') {
        setExposure(exposure + 0.2);
      }
    });

    function resizeScoreTarget() {
      const aspect = window.innerWidth / window.innerHeight;
      scoreTargetWidth = 160;
      scoreTargetHeight = Math.max(90, Math.round(scoreTargetWidth / aspect));
      scoreTarget.dispose();
      scoreTarget = new THREE.WebGLRenderTarget(scoreTargetWidth, scoreTargetHeight, {
        depthBuffer: true,
        stencilBuffer: false,
        type: THREE.UnsignedByteType,
        format: THREE.RGBAFormat,
        colorSpace: THREE.SRGBColorSpace
      });
      pixelBuffer = new Uint8Array(scoreTargetWidth * scoreTargetHeight * 4);
      currentScores = evaluateCurrentSceneScore();
      syncState();
      updateHUD();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeScoreTarget();
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();
      chromeSphere.rotation.y = t * 0.4;
      matteCube.rotation.y = t * 0.55;
      matteCube.rotation.x = Math.sin(t * 0.7) * 0.15;
      glassTorus.rotation.x = t * 0.5;
      glassTorus.rotation.y = t * 0.75;
      emissivePlane.position.y = 2.15 + Math.sin(t * 1.3) * 0.08;

      pointLight.position.x = -3 + Math.sin(t * 0.9) * 0.7;
      pointLight.position.z = -3 + Math.cos(t * 0.7) * 0.7;

      renderer.render(scene, camera);

      state.frameCount++;
      syncState();
    }

    currentScores = evaluateCurrentSceneScore();
    syncState();
    updateHUD();
    animate();
  </script>
</body>
</html>
