<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Procedural Toon Shader with Outlines</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 12px;
      border-radius: 8px;
      min-width: 240px;
      user-select: none;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }
    #hud .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      flex-wrap: wrap;
    }
    #hud button,
    #hud input[type="range"] {
      cursor: pointer;
    }
    #hud button {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 10px;
      border-radius: 4px;
    }
    #hud button:hover {
      background: #333;
    }
    #hud label {
      font-size: 13px;
    }
    #hud .title {
      font-weight: bold;
      margin-bottom: 8px;
    }
    #hud .small {
      font-size: 12px;
      opacity: 0.85;
    }
    #outlineValue {
      min-width: 40px;
      display: inline-block;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="title">Toon Shader Controls</div>
    <div class="row">
      <label>Band Count: <span id="bandCountLabel">3</span></label>
    </div>
    <div class="row">
      <button id="incBandBtn">+Band</button>
      <button id="decBandBtn">-Band</button>
    </div>
    <div class="row">
      <button id="toggleOutlinesBtn">Toggle Outlines</button>
      <button id="cycleColorsBtn">Cycle Color Scheme</button>
    </div>
    <div class="row">
      <label for="outlineSlider">Outline Thickness:</label>
      <input id="outlineSlider" type="range" min="0" max="0.15" step="0.01" value="0.04" />
      <span id="outlineValue">0.04</span>
    </div>
    <div class="row">
      <button id="resetBtn">Reset</button>
    </div>
    <div class="small">Keys: B increase, V decrease, O toggle outlines, C cycle colors</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.update();
    controls.enableDamping = true;

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshLambertMaterial({ color: 0x808080 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const toonVertexShader = `
      varying vec3 vWorldNormal;
      varying vec3 vWorldPosition;

      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const toonFragmentShader = `
      uniform vec3 uBaseColor;
      uniform vec3 uLightDir;
      uniform int uBandCount;
      uniform float uShadowThreshold;
      uniform float uHighlightThreshold;

      varying vec3 vWorldNormal;
      varying vec3 vWorldPosition;

      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 L = normalize(uLightDir);
        float ndl = max(dot(N, L), 0.0);

        float shade = 1.0;

        if (uBandCount <= 3) {
          if (ndl < uShadowThreshold) {
            shade = 0.35;
          } else if (ndl < uHighlightThreshold) {
            shade = 0.68;
          } else {
            shade = 1.0;
          }
        } else {
          float q = floor(ndl * float(uBandCount)) / max(float(uBandCount - 1), 1.0);
          shade = mix(0.25, 1.0, clamp(q, 0.0, 1.0));
        }

        vec3 color = uBaseColor * shade;
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const outlineVertexShader = `
      uniform float uOutlineThickness;

      void main() {
        vec3 displaced = position + normal * uOutlineThickness;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
      }
    `;

    const outlineFragmentShader = `
      uniform vec3 uOutlineColor;

      void main() {
        gl_FragColor = vec4(uOutlineColor, 1.0);
      }
    `;

    const colorSchemes = [
      ['#e74c3c', '#3498db', '#2ecc71'],
      ['#e67e22', '#9b59b6', '#f1c40f'],
      ['#e91e63', '#00bcd4', '#8bc34a']
    ];

    const defaults = {
      bandCount: 3,
      outlinesVisible: true,
      outlineThickness: 0.04,
      colorSchemeIndex: 0,
      shadowThreshold: 0.3,
      highlightThreshold: 0.7
    };

    const state = {
      bandCount: defaults.bandCount,
      outlinesVisible: defaults.outlinesVisible,
      outlineThickness: defaults.outlineThickness,
      colorSchemeIndex: defaults.colorSchemeIndex,
      shadowThreshold: defaults.shadowThreshold,
      highlightThreshold: defaults.highlightThreshold
    };

    function createToonMaterial(hexColor) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uBaseColor: { value: new THREE.Color(hexColor) },
          uLightDir: { value: new THREE.Vector3() },
          uBandCount: { value: state.bandCount },
          uShadowThreshold: { value: state.shadowThreshold },
          uHighlightThreshold: { value: state.highlightThreshold },
          uOutlineThickness: { value: state.outlineThickness },
          uOutlineColor: { value: new THREE.Color(0x000000) }
        },
        vertexShader: toonVertexShader,
        fragmentShader: toonFragmentShader
      });
    }

    function createOutlineMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: {
          uOutlineThickness: { value: state.outlineThickness },
          uOutlineColor: { value: new THREE.Color(0x000000) }
        },
        vertexShader: outlineVertexShader,
        fragmentShader: outlineFragmentShader,
        side: THREE.BackSide
      });
    }

    const toonObjects = [];
    const outlineMeshes = [];

    function makeOutlinedObject(geometry, colorHex, position) {
      const group = new THREE.Group();

      const toonMaterial = createToonMaterial(colorHex);
      const mesh = new THREE.Mesh(geometry, toonMaterial);

      const outlineMaterial = createOutlineMaterial();
      const outlineMesh = new THREE.Mesh(geometry, outlineMaterial);
      outlineMesh.visible = state.outlinesVisible;

      group.add(outlineMesh);
      group.add(mesh);
      group.position.copy(position);

      scene.add(group);

      toonObjects.push({ group, mesh, material: toonMaterial, outline: outlineMesh, outlineMaterial });
      outlineMeshes.push(outlineMesh);

      return { group, mesh, outlineMesh, toonMaterial, outlineMaterial };
    }

    const torusObj = makeOutlinedObject(
      new THREE.TorusKnotGeometry(1.2, 0.4, 128, 16),
      colorSchemes[0][0],
      new THREE.Vector3(-3, 1, 0)
    );

    const sphereObj = makeOutlinedObject(
      new THREE.SphereGeometry(1.2, 32, 32),
      colorSchemes[0][1],
      new THREE.Vector3(0, 1, 0)
    );

    const cubeObj = makeOutlinedObject(
      new THREE.BoxGeometry(2, 2, 2),
      colorSchemes[0][2],
      new THREE.Vector3(3, 1, 0)
    );

    function normalizedLightDirection() {
      return dirLight.position.clone().normalize();
    }

    function updateMaterials() {
      const lightDir = normalizedLightDirection();

      for (const obj of toonObjects) {
        obj.material.uniforms.uLightDir.value.copy(lightDir);
        obj.material.uniforms.uBandCount.value = state.bandCount;
        obj.material.uniforms.uShadowThreshold.value = state.shadowThreshold;
        obj.material.uniforms.uHighlightThreshold.value = state.highlightThreshold;
        obj.material.uniforms.uOutlineThickness.value = state.outlineThickness;
        obj.material.uniforms.uOutlineColor.value.set(0x000000);

        obj.outlineMaterial.uniforms.uOutlineThickness.value = state.outlineThickness;
        obj.outlineMaterial.uniforms.uOutlineColor.value.set(0x000000);

        obj.outline.visible = state.outlinesVisible;
      }
    }

    function applyColorScheme(index) {
      state.colorSchemeIndex = ((index % colorSchemes.length) + colorSchemes.length) % colorSchemes.length;
      const scheme = colorSchemes[state.colorSchemeIndex];

      torusObj.toonMaterial.uniforms.uBaseColor.value.set(scheme[0]);
      sphereObj.toonMaterial.uniforms.uBaseColor.value.set(scheme[1]);
      cubeObj.toonMaterial.uniforms.uBaseColor.value.set(scheme[2]);
    }

    function clampBandCount() {
      state.bandCount = Math.max(2, Math.min(6, state.bandCount));
    }

    function syncHUD() {
      document.getElementById('bandCountLabel').textContent = String(state.bandCount);
      document.getElementById('outlineSlider').value = state.outlineThickness.toFixed(2);
      document.getElementById('outlineValue').textContent = state.outlineThickness.toFixed(2);
    }

    function increaseBands() {
      state.bandCount += 1;
      clampBandCount();
      updateMaterials();
      syncHUD();
    }

    function decreaseBands() {
      state.bandCount -= 1;
      clampBandCount();
      updateMaterials();
      syncHUD();
    }

    function toggleOutlines() {
      state.outlinesVisible = !state.outlinesVisible;
      updateMaterials();
      syncHUD();
    }

    function cycleColorScheme() {
      applyColorScheme(state.colorSchemeIndex + 1);
      updateMaterials();
      syncHUD();
    }

    function setOutlineThickness(value) {
      state.outlineThickness = Math.max(0.0, Math.min(0.15, value));
      updateMaterials();
      syncHUD();
    }

    function resetAll() {
      state.bandCount = defaults.bandCount;
      state.outlinesVisible = defaults.outlinesVisible;
      state.outlineThickness = defaults.outlineThickness;
      state.colorSchemeIndex = defaults.colorSchemeIndex;
      state.shadowThreshold = defaults.shadowThreshold;
      state.highlightThreshold = defaults.highlightThreshold;

      applyColorScheme(state.colorSchemeIndex);
      updateMaterials();
      syncHUD();
    }

    document.getElementById('incBandBtn').addEventListener('click', increaseBands);
    document.getElementById('decBandBtn').addEventListener('click', decreaseBands);
    document.getElementById('toggleOutlinesBtn').addEventListener('click', toggleOutlines);
    document.getElementById('cycleColorsBtn').addEventListener('click', cycleColorScheme);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('outlineSlider').addEventListener('input', (e) => {
      setOutlineThickness(parseFloat(e.target.value));
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'b') increaseBands();
      if (key === 'v') decreaseBands();
      if (key === 'o') toggleOutlines();
      if (key === 'c') cycleColorScheme();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function colorToHexString(color) {
      return '#' + color.getHexString();
    }

    window.__3D_STATE__ = {};

    applyColorScheme(0);
    updateMaterials();
    syncHUD();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      torusObj.group.rotation.y = elapsedTime * 0.5;
      sphereObj.group.position.y = 1 + Math.sin(elapsedTime * Math.PI * 2.0) * 0.5;
      cubeObj.group.rotation.y = elapsedTime * 0.3;

      updateMaterials();
      controls.update();
      renderer.render(scene, camera);

      const lightDir = normalizedLightDirection();
      window.__3D_STATE__ = {
        bandCount: state.bandCount,
        outlinesVisible: state.outlinesVisible,
        outlineThickness: state.outlineThickness,
        colorSchemeIndex: state.colorSchemeIndex,
        torusKnotColor: colorToHexString(torusObj.toonMaterial.uniforms.uBaseColor.value),
        sphereColor: colorToHexString(sphereObj.toonMaterial.uniforms.uBaseColor.value),
        cubeColor: colorToHexString(cubeObj.toonMaterial.uniforms.uBaseColor.value),
        torusKnotRotationY: torusObj.group.rotation.y,
        spherePositionY: sphereObj.group.position.y,
        cubeRotationY: cubeObj.group.rotation.y,
        lightDirX: lightDir.x,
        lightDirY: lightDir.y,
        lightDirZ: lightDir.z,
        elapsedTime: elapsedTime,
        objectCount: toonObjects.length,
        outlineMeshCount: outlineMeshes.length,
        cameraDistance: camera.position.length(),
        shadowThreshold: state.shadowThreshold,
        highlightThreshold: state.highlightThreshold
      };
    }

    animate();
  </script>
</body>
</html>
