<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IK/FK Bone Chain Blending System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Consolas', 'Monaco', monospace; }
canvas { display: block; }
#hud {
position: absolute; top: 10px; left: 10px; color: #e0e0e0; font-size: 13px;
background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px;
min-width: 320px; line-height: 1.6; pointer-events: auto; user-select: none;
}
#hud .row { margin-bottom: 4px; }
#hud .label { color: #888; }
#hud .val { color: #fff; }
#hud .highlight { color: #ffcc44; }
.slider-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.slider-row input[type=range] { flex: 1; accent-color: #ff00ff; }
.btn-row { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
.btn-row button {
padding: 4px 10px; font-size: 12px; font-family: inherit; cursor: pointer;
border: 2px solid #555; border-radius: 4px; background: #2a2a3e; color: #ccc;
transition: all 0.15s;
}
.btn-row button:hover { background: #3a3a5e; }
.btn-row button.filled { border-color: #44ff44; }
.btn-row button.empty { border-color: #555; }
.btn-row button.save { background: #2a3a2e; }
.btn-row button.load { background: #2a2e3a; }
#help {
position: absolute; bottom: 10px; left: 10px; color: #666; font-size: 11px;
font-family: inherit; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
}
</style>
</head>
<body>

<div id="hud">
<div class="slider-row">
<span class="label">Blend:</span>
<input type="range" id="blendSlider" min="0" max="1" step="0.01" value="0">
<span id="blendVal" class="val">0.00</span>
</div>
<div class="row"><span class="label">Selected Bone: </span><span id="selBone" class="highlight">0</span>
&nbsp; <span class="label">FK Angle: </span><span id="fkAngle" class="val">0.00 rad</span></div>
<div class="row"><span class="label">IK Target: </span><span id="ikPos" class="val">(0, 0, 0)</span></div>
<div class="row"><span class="label">Chain Tip: </span><span id="tipPos" class="val">(0, 0, 0)</span></div>
<div class="row"><span class="label">Per-Bone Overrides: </span><span id="overrides" class="val">[-1,-1,-1,-1,-1]</span></div>
<div class="row"><span class="label">Slots: </span><span id="slotStatus" class="val">[1][2][3][4]</span></div>
<div class="btn-row" id="saveButtons"></div>
<div class="btn-row" id="loadButtons"></div>
</div>

<div id="help">
Keys: 1-5 select bone | A/D rotate FK ±0.05 | R reset FK | T toggle IK target | B cycle override
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const BONE_COUNT = 5;
const BONE_LENGTH = 1.0;
const BONE_COLORS = [0xff4444, 0xff8844, 0xffcc44, 0x44ff44, 0x4488ff];
const DEFAULT_FK = [0, 0.3, -0.2, 0.5, -0.1];
const IK_MAX_ITER = 20;
const IK_TOLERANCE = 0.01;
const OVERRIDE_CYCLE = [-1, 0.0, 0.25, 0.5, 0.75, 1.0];

// State
let fkAngles = [...DEFAULT_FK];
let ikAngles = new Array(BONE_COUNT).fill(0);
let finalAngles = new Array(BONE_COUNT).fill(0);
let blendWeight = 0.0;
let perBoneOverrides = new Array(BONE_COUNT).fill(-1);
let selectedBone = 0;
let ikTargetVisible = true;
let savedSlots = [null, null, null, null];
let ikIterations = 0;
let ikConverged = false;
let frameCount = 0;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.update();

// Lights
scene.add(new THREE.AmbientLight(0x404060, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// Grid
const grid = new THREE.GridHelper(10, 10);
scene.add(grid);

// Bone visuals
const boneGroup = new THREE.Group();
scene.add(boneGroup);

const boneMeshes = [];
const jointSpheres = [];
const bonePivots = [];

function createBoneChain() {
  let parent = boneGroup;
  for (let i = 0; i < BONE_COUNT; i++) {
    const pivot = new THREE.Group();
    if (i === 0) {
      pivot.position.set(-2, 1, 0);
    } else {
      pivot.position.set(BONE_LENGTH, 0, 0);
    }

    const geom = new THREE.CylinderGeometry(0.04, 0.08, BONE_LENGTH, 8);
    geom.rotateZ(-Math.PI / 2);
    geom.translate(BONE_LENGTH / 2, 0, 0);
    const mat = new THREE.MeshPhongMaterial({ color: BONE_COLORS[i], emissive: 0x000000 });
    const mesh = new THREE.Mesh(geom, mat);
    pivot.add(mesh);
    boneMeshes.push(mesh);

    const sphereGeom = new THREE.SphereGeometry(0.12, 12, 12);
    const sphereMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x222222 });
    const sphere = new THREE.Mesh(sphereGeom, sphereMat);
    pivot.add(sphere);
    jointSpheres.push(sphere);

    parent.add(pivot);
    bonePivots.push(pivot);
    parent = pivot;
  }

  // Tip sphere
  const tipSphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 12, 12),
    new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x222222 })
  );
  tipSphere.position.set(BONE_LENGTH, 0, 0);
  bonePivots[BONE_COUNT - 1].add(tipSphere);
  jointSpheres.push(tipSphere);
}
createBoneChain();

// IK Target
const ikTargetMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.2, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true })
);
ikTargetMesh.position.set(1.5, 3.0, 0);
scene.add(ikTargetMesh);

// Apply angles to bone pivots
function applyAngles(angles) {
  for (let i = 0; i < BONE_COUNT; i++) {
    bonePivots[i].rotation.z = angles[i];
  }
}

// Get joint world positions
function getJointPositions(angles) {
  const positions = [];
  let x = -2, y = 1, angle = 0;
  positions.push(new THREE.Vector2(x, y));
  for (let i = 0; i < BONE_COUNT; i++) {
    angle += angles[i];
    x += Math.cos(angle) * BONE_LENGTH;
    y += Math.sin(angle) * BONE_LENGTH;
    positions.push(new THREE.Vector2(x, y));
  }
  return positions;
}

// CCD IK Solver (2D in XY plane)
function solveCCD(targetX, targetY) {
  let angles = [...fkAngles];
  let converged = false;
  let iters = 0;

  for (let iter = 0; iter < IK_MAX_ITER; iter++) {
    iters = iter + 1;
    for (let i = BONE_COUNT - 1; i >= 0; i--) {
      const positions = getJointPositions(angles);
      const tip = positions[BONE_COUNT];
      const joint = positions[i];

      const toTip = Math.atan2(tip.y - joint.y, tip.x - joint.x);
      const toTarget = Math.atan2(targetY - joint.y, targetX - joint.x);
      let delta = toTarget - toTip;

      while (delta > Math.PI) delta -= 2 * Math.PI;
      while (delta < -Math.PI) delta += 2 * Math.PI;

      angles[i] += delta;
    }

    const positions = getJointPositions(angles);
    const tip = positions[BONE_COUNT];
    const dist = Math.sqrt((tip.x - targetX) ** 2 + (tip.y - targetY) ** 2);
    if (dist < IK_TOLERANCE) {
      converged = true;
      break;
    }
  }

  ikIterations = iters;
  ikConverged = converged;

  // Convert to local angles
  const localAngles = [];
  let cumulative = 0;
  for (let i = 0; i < BONE_COUNT; i++) {
    localAngles.push(angles[i] - (i === 0 ? 0 : 0));
  }
  return angles;
}

// Blend
function computeFinalAngles() {
  const target = ikTargetMesh.position;
  ikAngles = solveCCD(target.x, target.y);

  for (let i = 0; i < BONE_COUNT; i++) {
    const bw = perBoneOverrides[i] >= 0 ? perBoneOverrides[i] : blendWeight;
    finalAngles[i] = fkAngles[i] * (1 - bw) + ikAngles[i] * bw;
  }
}

// Dragging
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
let isDragging = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObject(ikTargetMesh);
  if (intersects.length > 0) {
    isDragging = true;
    controls.enabled = false;
  }
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const intersection = new THREE.Vector3();
  raycaster.ray.intersectPlane(dragPlane, intersection);
  if (intersection) {
    ikTargetMesh.position.set(intersection.x, intersection.y, 0);
  }
});

renderer.domElement.addEventListener('pointerup', () => {
  isDragging = false;
  controls.enabled = true;
});

// Keyboard
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key >= '1' && key <= '5') {
    selectedBone = parseInt(key) - 1;
  } else if (key === 'a') {
    fkAngles[selectedBone] -= 0.05;
  } else if (key === 'd') {
    fkAngles[selectedBone] += 0.05;
  } else if (key === 'r') {
    fkAngles = [...DEFAULT_FK];
  } else if (key === 't') {
    ikTargetVisible = !ikTargetVisible;
    ikTargetMesh.visible = ikTargetVisible;
  } else if (key === 'b') {
    const cur = perBoneOverrides[selectedBone];
    const idx = OVERRIDE_CYCLE.indexOf(cur);
    perBoneOverrides[selectedBone] = OVERRIDE_CYCLE[(idx + 1) % OVERRIDE_CYCLE.length];
  }
});

// Blend slider
const blendSlider = document.getElementById('blendSlider');
const blendVal = document.getElementById('blendVal');
blendSlider.addEventListener('input', () => {
  blendWeight = parseFloat(blendSlider.value);
  blendVal.textContent = blendWeight.toFixed(2);
});

// Save/Load buttons
const saveDiv = document.getElementById('saveButtons');
const loadDiv = document.getElementById('loadButtons');
for (let i = 0; i < 4; i++) {
  const sBtn = document.createElement('button');
  sBtn.textContent = `Save ${i + 1}`;
  sBtn.className = 'save empty';
  sBtn.id = `save${i}`;
  sBtn.addEventListener('click', () => {
    savedSlots[i] = {
      fkAngles: [...fkAngles],
      ikTargetPos: { x: ikTargetMesh.position.x, y: ikTargetMesh.position.y, z: ikTargetMesh.position.z },
      blendWeight: blendWeight,
      perBoneOverrides: [...perBoneOverrides],
      timestamp: Date.now()
    };
    updateSlotButtons();
  });
  saveDiv.appendChild(sBtn);

  const lBtn = document.createElement('button');
  lBtn.textContent = `Load ${i + 1}`;
  lBtn.className = 'load empty';
  lBtn.id = `load${i}`;
  lBtn.addEventListener('click', () => {
    if (savedSlots[i]) {
      const s = savedSlots[i];
      fkAngles = [...s.fkAngles];
      ikTargetMesh.position.set(s.ikTargetPos.x, s.ikTargetPos.y, s.ikTargetPos.z);
      blendWeight = s.blendWeight;
      blendSlider.value = blendWeight;
      blendVal.textContent = blendWeight.toFixed(2);
      perBoneOverrides = [...s.perBoneOverrides];
    }
  });
  loadDiv.appendChild(lBtn);
}

function updateSlotButtons() {
  for (let i = 0; i < 4; i++) {
    const sBtn = document.getElementById(`save${i}`);
    const lBtn = document.getElementById(`load${i}`);
    if (savedSlots[i]) {
      sBtn.className = 'save filled';
      lBtn.className = 'load filled';
    } else {
      sBtn.className = 'save empty';
      lBtn.className = 'load empty';
    }
  }
}

// HUD update
function updateHUD() {
  document.getElementById('selBone').textContent = selectedBone;
  document.getElementById('fkAngle').textContent = fkAngles[selectedBone].toFixed(2) + ' rad';
  const tp = ikTargetMesh.position;
  document.getElementById('ikPos').textContent = `(${tp.x.toFixed(2)}, ${tp.y.toFixed(2)}, ${tp.z.toFixed(2)})`;

  const positions = getJointPositions(finalAngles);
  const tip = positions[BONE_COUNT];
  document.getElementById('tipPos').textContent = `(${tip.x.toFixed(2)}, ${tip.y.toFixed(2)}, 0.00)`;

  const ovStr = perBoneOverrides.map(v => v === -1 ? '-1' : v.toFixed(2)).join(',');
  document.getElementById('overrides').textContent = `[${ovStr}]`;

  const slotStr = savedSlots.map((s, i) => s ? `[${i+1}✓]` : `[${i+1}]`).join('');
  document.getElementById('slotStatus').textContent = slotStr;
}

// __3D_STATE__
function updateState() {
  const positions = getJointPositions(finalAngles);
  const tip = positions[BONE_COUNT];
  const tp = ikTargetMesh.position;
  const tipDist = Math.sqrt((tip.x - tp.x) ** 2 + (tip.y - tp.y) ** 2 + tp.z ** 2);

  window.__3D_STATE__ = {
    boneCount: BONE_COUNT,
    fkAngles: [...fkAngles],
    ikAngles: [...ikAngles],
    finalAngles: [...finalAngles],
    blendWeight: blendWeight,
    perBoneOverrides: [...perBoneOverrides],
    selectedBone: selectedBone,
    ikTargetPos: { x: tp.x, y: tp.y, z: tp.z },
    chainTipPos: { x: tip.x, y: tip.y, z: 0 },
    ikIterations: ikIterations,
    ikConverged: ikConverged,
    savedSlots: savedSlots.map(s => s ? { ...s, fkAngles: [...s.fkAngles], perBoneOverrides: [...s.perBoneOverrides], ikTargetPos: { ...s.ikTargetPos } } : null),
    filledSlotCount: savedSlots.filter(s => s !== null).length,
    chainLength: BONE_COUNT * BONE_LENGTH,
    tipToTargetDistance: tipDist,
    frameCount: frameCount,
    isIKTargetVisible: ikTargetVisible
  };
}

// Animation
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  computeFinalAngles();
  applyAngles(finalAngles);

  // Pulse selected bone
  for (let i = 0; i < BONE_COUNT; i++) {
    const mat = boneMeshes[i].material;
    if (i === selectedBone) {
      const pulse = (Math.sin(t * 6) * 0.5 + 0.5) * 0.3;
      mat.emissive.setRGB(pulse, pulse, pulse);
    } else {
      mat.emissive.setRGB(0, 0, 0);
    }
  }

  updateHUD();
  frameCount++;
  updateState();

  controls.update();
  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
