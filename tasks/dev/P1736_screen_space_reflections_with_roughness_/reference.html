<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js SSR Roughness Demo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f14;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: rgba(20, 24, 30, 0.72);
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      user-select: none;
    }
    #ui label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }
    #roughnessSlider {
      width: 240px;
    }
    #hud {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      min-width: 220px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-line;
    }
    #help {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.45);
      color: #dce6f2;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label for="roughnessSlider">Roughness: <span id="roughnessValue">0.05</span></label>
    <input id="roughnessSlider" type="range" min="0" max="1" step="0.01" value="0.05" />
  </div>

  <div id="hud"></div>

  <div id="help">
    Keys: 1-5 set roughness, T toggle SSR, R toggle rotation
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10161f);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 8);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#334455'),
      metalness: 1.0,
      roughness: 0.05
    });

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const objectMaterialConfig = { metalness: 0.3, roughness: 0.4 };
    const objects = [];

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 48, 32),
      new THREE.MeshStandardMaterial({ color: 0xff3333, ...objectMaterialConfig })
    );
    sphere.position.set(-3, 0.8, 0);
    scene.add(sphere);
    objects.push(sphere);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x33ff33, ...objectMaterialConfig })
    );
    box.position.set(0, 0.6, -1);
    scene.add(box);
    objects.push(box);

    const torus = new THREE.Mesh(
      new THREE.TorusGeometry(0.6, 0.25, 24, 64),
      new THREE.MeshStandardMaterial({ color: 0x3333ff, ...objectMaterialConfig })
    );
    torus.position.set(3, 0.8, 0);
    scene.add(torus);
    objects.push(torus);

    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.6, 1.5, 32),
      new THREE.MeshStandardMaterial({ color: 0xffff33, ...objectMaterialConfig })
    );
    cone.position.set(-1.5, 0.75, 2);
    scene.add(cone);
    objects.push(cone);

    const cylinder = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 1.4, 32),
      new THREE.MeshStandardMaterial({ color: 0x33ffff, ...objectMaterialConfig })
    );
    cylinder.position.set(1.5, 0.7, 2);
    scene.add(cylinder);
    objects.push(cylinder);

    const size = new THREE.Vector2();
    renderer.getSize(size);

    const colorTarget = new THREE.WebGLRenderTarget(size.x, size.y, {
      type: THREE.HalfFloatType,
      depthBuffer: true
    });
    colorTarget.texture.colorSpace = THREE.SRGBColorSpace;
    colorTarget.depthTexture = new THREE.DepthTexture(size.x, size.y, THREE.UnsignedIntType);

    const normalTarget = new THREE.WebGLRenderTarget(size.x, size.y, {
      type: THREE.HalfFloatType,
      depthBuffer: true
    });
    normalTarget.texture.colorSpace = THREE.NoColorSpace;
    normalTarget.depthTexture = new THREE.DepthTexture(size.x, size.y, THREE.UnsignedIntType);

    const normalOverrideMaterial = new THREE.MeshNormalMaterial();

    const fsScene = new THREE.Scene();
    const fsCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const ssrUniforms = {
      tColor: { value: colorTarget.texture },
      tDepth: { value: colorTarget.depthTexture },
      tNormal: { value: normalTarget.texture },
      cameraNear: { value: camera.near },
      cameraFar: { value: camera.far },
      resolution: { value: new THREE.Vector2(size.x, size.y) },
      projectionMatrixInv: { value: camera.projectionMatrixInverse.clone() },
      projectionMatrixMat: { value: camera.projectionMatrix.clone() },
      roughness: { value: floorMaterial.roughness },
      ssrEnabled: { value: true }
    };

    const ssrMaterial = new THREE.ShaderMaterial({
      uniforms: ssrUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;

        uniform sampler2D tColor;
        uniform sampler2D tDepth;
        uniform sampler2D tNormal;
        uniform float cameraNear;
        uniform float cameraFar;
        uniform vec2 resolution;
        uniform mat4 projectionMatrixInv;
        uniform mat4 projectionMatrixMat;
        uniform float roughness;
        uniform bool ssrEnabled;

        float readDepth(vec2 uv) {
          return texture2D(tDepth, uv).x;
        }

        vec3 getNormal(vec2 uv) {
          vec3 n = texture2D(tNormal, uv).xyz * 2.0 - 1.0;
          return normalize(n);
        }

        vec3 reconstructViewPosition(vec2 uv, float depth) {
          float z = depth * 2.0 - 1.0;
          vec4 clip = vec4(uv * 2.0 - 1.0, z, 1.0);
          vec4 view = projectionMatrixInv * clip;
          return view.xyz / max(view.w, 0.00001);
        }

        vec2 projectToUV(vec3 viewPos) {
          vec4 clip = projectionMatrixMat * vec4(viewPos, 1.0);
          vec3 ndc = clip.xyz / max(clip.w, 0.00001);
          return ndc.xy * 0.5 + 0.5;
        }

        bool isFloor(vec3 normal) {
          return normal.y > 0.9;
        }

        void main() {
          vec4 baseColor = texture2D(tColor, vUv);
          if (!ssrEnabled) {
            gl_FragColor = baseColor;
            return;
          }

          float depth = readDepth(vUv);
          if (depth >= 1.0) {
            gl_FragColor = baseColor;
            return;
          }

          vec3 normal = getNormal(vUv);
          vec3 viewPos = reconstructViewPosition(vUv, depth);

          if (!isFloor(normal)) {
            gl_FragColor = baseColor;
            return;
          }

          vec3 V = normalize(-viewPos);
          vec3 R = normalize(reflect(-V, normal));

          float fresnelFactor = pow(1.0 - max(dot(V, normal), 0.0), 3.0);
          fresnelFactor = clamp(fresnelFactor + 0.08, 0.0, 1.0);

          float reflectionStrength = (1.0 - roughness) * fresnelFactor;

          vec3 marchPos = viewPos + R * 0.05;
          vec3 hitColor = vec3(0.0);
          float hitFound = 0.0;

          for (int i = 0; i < 60; i++) {
            vec2 uv = projectToUV(marchPos);

            if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
              break;
            }

            float sceneDepth = readDepth(uv);
            if (sceneDepth >= 1.0) {
              marchPos += R * 0.05;
              continue;
            }

            vec3 sceneViewPos = reconstructViewPosition(uv, sceneDepth);

            float thickness = 0.12;
            if (marchPos.z >= sceneViewPos.z - thickness) {
              hitColor = texture2D(tColor, uv).rgb;
              hitFound = 1.0;
              break;
            }

            marchPos += R * 0.05;
          }

          vec3 reflected = mix(baseColor.rgb, hitColor, hitFound);
          vec3 finalColor = mix(baseColor.rgb, reflected, reflectionStrength);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `
    });

    const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ssrMaterial);
    fsScene.add(fsQuad);

    const slider = document.getElementById('roughnessSlider');
    const roughnessValueLabel = document.getElementById('roughnessValue');
    const hud = document.getElementById('hud');

    let ssrEnabled = true;
    let objectsRotating = false;
    let fps = 0;
    let frameCount = 0;
    let fpsTime = performance.now();

    function setRoughness(v) {
      const value = Math.max(0, Math.min(1, Number(v)));
      floorMaterial.roughness = value;
      ssrUniforms.roughness.value = value;
      slider.value = value.toFixed(2);
      roughnessValueLabel.textContent = value.toFixed(2);
    }

    slider.addEventListener('input', (e) => {
      setRoughness(e.target.value);
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === '1') setRoughness(0.0);
      if (key === '2') setRoughness(0.25);
      if (key === '3') setRoughness(0.5);
      if (key === '4') setRoughness(0.75);
      if (key === '5') setRoughness(1.0);
      if (key === 't') ssrEnabled = !ssrEnabled;
      if (key === 'r') objectsRotating = !objectsRotating;
    });

    function updateHUD() {
      hud.textContent =
`Roughness: ${floorMaterial.roughness.toFixed(2)}
SSR: ${ssrEnabled ? 'enabled' : 'disabled'}
Rotation: ${objectsRotating ? 'rotating' : 'stopped'}
FPS: ${fps.toFixed(1)}`;
    }

    function updateState() {
      window.__3D_STATE__ = {
        roughness: floorMaterial.roughness,
        ssrEnabled,
        objectsRotating,
        objectCount: objects.length,
        floorMetalness: floorMaterial.metalness,
        floorRoughness: floorMaterial.roughness,
        cameraPosition: {
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z
        },
        fps,
        reflectionStrength: 1.0 - floorMaterial.roughness,
        sliderValue: Number(slider.value),
        lightIntensity: dirLight.intensity,
        objectPositions: objects.map(o => ({
          x: o.position.x,
          y: o.position.y,
          z: o.position.z
        }))
      };
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);

      colorTarget.setSize(w, h);
      normalTarget.setSize(w, h);

      ssrUniforms.resolution.value.set(w, h);
      ssrUniforms.projectionMatrixInv.value.copy(camera.projectionMatrixInverse);
      ssrUniforms.projectionMatrixMat.value.copy(camera.projectionMatrix);
    }

    window.addEventListener('resize', resize);

    setRoughness(0.05);
    updateHUD();
    updateState();

    function renderSSR() {
      renderer.setRenderTarget(colorTarget);
      renderer.clear();
      scene.overrideMaterial = null;
      renderer.render(scene, camera);

      const floorVisible = floor.visible;
      floor.visible = false;

      renderer.setRenderTarget(normalTarget);
      renderer.clear();
      scene.overrideMaterial = normalOverrideMaterial;
      renderer.render(scene, camera);
      scene.overrideMaterial = null;

      floor.visible = floorVisible;

      ssrUniforms.tColor.value = colorTarget.texture;
      ssrUniforms.tDepth.value = colorTarget.depthTexture;
      ssrUniforms.tNormal.value = normalTarget.texture;
      ssrUniforms.projectionMatrixInv.value.copy(camera.projectionMatrixInverse);
      ssrUniforms.projectionMatrixMat.value.copy(camera.projectionMatrix);
      ssrUniforms.ssrEnabled.value = ssrEnabled;

      renderer.setRenderTarget(null);
      renderer.render(fsScene, fsCamera);
    }

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      if (objectsRotating) {
        for (const obj of objects) {
          obj.rotation.y += 0.01;
        }
      }

      frameCount++;
      const now = performance.now();
      const elapsed = now - fpsTime;
      if (elapsed >= 500) {
        fps = (frameCount * 1000) / elapsed;
        frameCount = 0;
        fpsTime = now;
        updateHUD();
      }

      if (ssrEnabled) {
        renderSSR();
      } else {
        renderer.setRenderTarget(null);
        scene.overrideMaterial = null;
        renderer.render(scene, camera);
      }

      updateState();
    }

    animate();
  </script>
</body>
</html>
