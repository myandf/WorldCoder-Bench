<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motion Trail Ghost Visualizer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #111118;
      font-family: Arial, Helvetica, sans-serif;
      color: #e8ffff;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      padding: 12px 14px;
      min-width: 230px;
      color: #d9fffb;
      background: rgba(10, 10, 18, 0.78);
      border: 1px solid rgba(0, 255, 204, 0.28);
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(0, 255, 204, 0.12);
      font-size: 13px;
      line-height: 1.55;
      user-select: none;
      backdrop-filter: blur(5px);
    }

    #hud .title {
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }

    #controls {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: none;
    }

    button {
      min-width: 120px;
      padding: 9px 12px;
      color: #eaffff;
      background: linear-gradient(180deg, #252538, #171722);
      border: 1px solid rgba(0, 255, 204, 0.38);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.2px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.08);
    }

    button:hover {
      background: linear-gradient(180deg, #30304a, #1d1d2b);
      border-color: rgba(0, 255, 204, 0.75);
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="title">Motion Trail Ghost Visualizer</div>
    <div>Frame: <span id="frameValue">0</span></div>
    <div>Active Ghosts: <span id="activeValue">0</span></div>
    <div>Frozen Ghosts: <span id="frozenValue">0</span></div>
    <div>Undo Stack: <span id="undoValue">0</span></div>
    <div>Redo Stack: <span id="redoValue">0</span></div>
  </div>

  <div id="controls">
    <button id="playPauseBtn">Pause</button>
    <button id="undoBtn">Undo</button>
    <button id="redoBtn">Redo</button>
    <button id="clearBtn">Clear All</button>
    <button id="snapshotBtn">Snapshot</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#111118");

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 5, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    const groundGeometry = new THREE.PlaneGeometry(30, 30);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: "#222233",
      roughness: 0.85,
      metalness: 0.05
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const grid = new THREE.GridHelper(30, 30, 0x444466, 0x333344);
    grid.position.y = 0.003;
    scene.add(grid);

    const tracerGeometry = new THREE.SphereGeometry(0.4, 48, 32);
    const tracerMaterial = new THREE.MeshStandardMaterial({
      color: "#00ffcc",
      emissive: "#00ffcc",
      emissiveIntensity: 1.4,
      roughness: 0.25,
      metalness: 0.05
    });
    const tracer = new THREE.Mesh(tracerGeometry, tracerMaterial);
    tracer.name = "tracer";
    scene.add(tracer);

    const tracerGlowLight = new THREE.PointLight(0x00ffcc, 1.4, 5);
    tracer.add(tracerGlowLight);

    const a = 2;
    const b = 3;
    const c = 1;
    const timeStep = 0.015;

    let animationTime = 0;
    let isPlaying = true;
    let frameCount = 0;
    let lastFrameTimestamp = performance.now();
    let nextGhostId = 1;
    let totalGhostsSpawned = 0;
    let lastAction = "none";

    const ghosts = [];
    const undoStack = [];
    const redoStack = [];

    const MAX_ACTIVE_GHOSTS = 30;
    const MAX_STACK_DEPTH = 20;

    const newestColor = new THREE.Color("#00ffcc");
    const oldestColor = new THREE.Color("#ff00aa");

    const frameValue = document.getElementById("frameValue");
    const activeValue = document.getElementById("activeValue");
    const frozenValue = document.getElementById("frozenValue");
    const undoValue = document.getElementById("undoValue");
    const redoValue = document.getElementById("redoValue");

    const playPauseBtn = document.getElementById("playPauseBtn");
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const clearBtn = document.getElementById("clearBtn");
    const snapshotBtn = document.getElementById("snapshotBtn");

    function calculateTracerPosition(t) {
      return {
        x: 4 * Math.sin(a * t),
        y: 1.5 + Math.sin(b * t),
        z: 4 * Math.cos(c * t)
      };
    }

    function roundNumber(value) {
      return Number(value.toFixed(4));
    }

    function makeGhostMesh(opacity, colorHex = "#00ffcc") {
      const material = new THREE.MeshStandardMaterial({
        color: colorHex,
        emissive: colorHex,
        emissiveIntensity: 0.55,
        transparent: true,
        opacity,
        depthWrite: false,
        roughness: 0.35,
        metalness: 0.02
      });

      const mesh = new THREE.Mesh(tracerGeometry, material);
      mesh.scale.setScalar(0.96);
      return mesh;
    }

    function countActiveGhosts() {
      return ghosts.filter(g => !g.frozen).length;
    }

    function countFrozenGhosts() {
      return ghosts.filter(g => g.frozen).length;
    }

    function pushLimited(stack, item) {
      stack.push(item);
      while (stack.length > MAX_STACK_DEPTH) {
        stack.shift();
      }
    }

    function removeGhostObject(ghost) {
      scene.remove(ghost.mesh);
      if (ghost.mesh.material) {
        ghost.mesh.material.dispose();
      }
    }

    function removeGhostFromArray(ghost) {
      const index = ghosts.indexOf(ghost);
      if (index !== -1) {
        ghosts.splice(index, 1);
      }
    }

    function forceRemoveOldestActiveGhostIfNeeded() {
      const activeGhosts = ghosts
        .filter(g => !g.frozen)
        .sort((g1, g2) => g1.birthFrame - g2.birthFrame);

      if (activeGhosts.length < MAX_ACTIVE_GHOSTS) return;

      const oldest = activeGhosts[0];
      removeGhostObject(oldest);
      removeGhostFromArray(oldest);
    }

    function spawnGhost(position, options = {}) {
      forceRemoveOldestActiveGhostIfNeeded();

      const ghostId = options.id ?? nextGhostId++;
      const opacity = options.opacity ?? 0.7;
      const birthFrame = options.birthFrame ?? frameCount;
      const color = options.color ?? "#00ffcc";

      if (ghostId >= nextGhostId) {
        nextGhostId = ghostId + 1;
      }

      const mesh = makeGhostMesh(opacity, color);
      mesh.position.set(position.x, position.y, position.z);
      scene.add(mesh);

      const ghost = {
        id: ghostId,
        mesh,
        position: {
          x: position.x,
          y: position.y,
          z: position.z
        },
        birthFrame,
        opacity,
        color,
        frozen: false
      };

      ghosts.push(ghost);

      const action = {
        type: "spawn",
        ghostId,
        position: {
          x: position.x,
          y: position.y,
          z: position.z
        },
        frame: frameCount
      };

      pushLimited(undoStack, action);

      if (!options.fromRedo) {
        redoStack.length = 0;
        totalGhostsSpawned += 1;
        lastAction = "spawn";
      }

      return ghost;
    }

    function findAliveNonFrozenGhostById(id) {
      return ghosts.find(g => g.id === id && !g.frozen);
    }

    function undo() {
      while (undoStack.length > 0) {
        const action = undoStack.pop();

        if (action.type !== "spawn") continue;

        const ghost = findAliveNonFrozenGhostById(action.ghostId);

        if (!ghost) {
          continue;
        }

        removeGhostObject(ghost);
        removeGhostFromArray(ghost);

        pushLimited(redoStack, action);
        lastAction = "undo";
        return;
      }

      lastAction = "undo";
    }

    function redo() {
      while (redoStack.length > 0) {
        const action = redoStack.pop();

        if (action.type !== "spawn") continue;

        if (findAliveNonFrozenGhostById(action.ghostId)) {
          continue;
        }

        spawnGhost(action.position, {
          id: action.ghostId,
          opacity: 0.5,
          birthFrame: frameCount,
          color: "#00ffcc",
          fromRedo: true
        });

        lastAction = "redo";
        return;
      }

      lastAction = "redo";
    }

    function clearAll() {
      for (const ghost of ghosts) {
        removeGhostObject(ghost);
      }

      ghosts.length = 0;
      undoStack.length = 0;
      redoStack.length = 0;
      nextGhostId = 1;
      totalGhostsSpawned = 0;
      lastAction = "clear";
    }

    function snapshot() {
      for (const ghost of ghosts) {
        if (!ghost.frozen) {
          ghost.frozen = true;
          ghost.opacity = ghost.mesh.material.opacity;
          ghost.mesh.material.opacity = ghost.opacity;
          ghost.mesh.material.depthWrite = false;
        }
      }

      lastAction = "snapshot";
    }

    function updateGhostColorsAndFading() {
      const activeGhosts = ghosts.filter(g => !g.frozen);

      let maxAge = 1;
      for (const ghost of activeGhosts) {
        maxAge = Math.max(maxAge, frameCount - ghost.birthFrame);
      }

      const ghostsToRemove = [];

      for (const ghost of activeGhosts) {
        ghost.opacity -= 0.02;
        ghost.opacity = Math.max(0, ghost.opacity);
        ghost.mesh.material.opacity = ghost.opacity;

        const age = Math.max(0, frameCount - ghost.birthFrame);
        const ratio = THREE.MathUtils.clamp(age / maxAge, 0, 1);
        const color = new THREE.Color().lerpColors(newestColor, oldestColor, ratio);

        ghost.mesh.material.color.copy(color);
        ghost.mesh.material.emissive.copy(color);
        ghost.color = "#" + color.getHexString();

        if (ghost.opacity <= 0.05) {
          ghostsToRemove.push(ghost);
        }
      }

      for (const ghost of ghostsToRemove) {
        removeGhostObject(ghost);
        removeGhostFromArray(ghost);
      }
    }

    function updateTracer() {
      const p = calculateTracerPosition(animationTime);
      tracer.position.set(p.x, p.y, p.z);
    }

    function getOldestNewestOpacity() {
      const activeGhosts = ghosts
        .filter(g => !g.frozen)
        .sort((g1, g2) => g1.birthFrame - g2.birthFrame);

      if (activeGhosts.length === 0) {
        return {
          oldestGhostOpacity: -1,
          newestGhostOpacity: -1
        };
      }

      return {
        oldestGhostOpacity: roundNumber(activeGhosts[0].opacity),
        newestGhostOpacity: roundNumber(activeGhosts[activeGhosts.length - 1].opacity)
      };
    }

    function updateHUD() {
      frameValue.textContent = String(frameCount);
      activeValue.textContent = String(countActiveGhosts());
      frozenValue.textContent = String(countFrozenGhosts());
      undoValue.textContent = String(undoStack.length);
      redoValue.textContent = String(redoStack.length);
    }

    function updateExposedState() {
      const p = tracer.position;
      const opacityInfo = getOldestNewestOpacity();

      window.__3D_STATE__ = {
        animationTime: roundNumber(animationTime),
        isPlaying,
        frameCount,
        tracerPosition: {
          x: roundNumber(p.x),
          y: roundNumber(p.y),
          z: roundNumber(p.z)
        },
        activeGhosts: countActiveGhosts(),
        frozenGhosts: countFrozenGhosts(),
        totalGhostsSpawned,
        undoStackDepth: undoStack.length,
        redoStackDepth: redoStack.length,
        lastAction,
        ghostPositions: ghosts.map(g => ({
          x: roundNumber(g.mesh.position.x),
          y: roundNumber(g.mesh.position.y),
          z: roundNumber(g.mesh.position.z),
          opacity: roundNumber(g.opacity),
          frozen: Boolean(g.frozen)
        })),
        oldestGhostOpacity: opacityInfo.oldestGhostOpacity,
        newestGhostOpacity: opacityInfo.newestGhostOpacity
      };
    }

    playPauseBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      playPauseBtn.textContent = isPlaying ? "Pause" : "Play";
    });

    undoBtn.addEventListener("click", undo);
    redoBtn.addEventListener("click", redo);
    clearBtn.addEventListener("click", clearAll);
    snapshotBtn.addEventListener("click", snapshot);

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (key === "z") {
        undo();
      } else if (key === "y") {
        redo();
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      if (isPlaying) {
        const now = performance.now();
        const elapsedFrames = Math.max(
          1,
          Math.round((now - lastFrameTimestamp) * 60 / 1000),
        );
        lastFrameTimestamp = now;
        const previousFrameCount = frameCount;
        frameCount += elapsedFrames;
        animationTime += timeStep * elapsedFrames;
        updateTracer();

        if (Math.floor(frameCount / 20) > Math.floor(previousFrameCount / 20)) {
          spawnGhost({
            x: tracer.position.x,
            y: tracer.position.y,
            z: tracer.position.z
          });
        }

        updateGhostColorsAndFading();
      } else {
        lastFrameTimestamp = performance.now();
        updateTracer();
      }

      updateHUD();
      updateExposedState();

      renderer.render(scene, camera);
    }

    updateTracer();
    updateHUD();
    updateExposedState();
    animate();
  </script>
</body>
</html>
