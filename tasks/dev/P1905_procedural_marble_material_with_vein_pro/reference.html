<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Marble Shader</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }
#controls {
  position: fixed;
  top: 10px;
  right: 10px;
  width: 280px;
  background: rgba(20, 20, 20, 0.88);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 14px;
  color: #ccc;
  font-size: 12px;
  max-height: 95vh;
  overflow-y: auto;
  z-index: 100;
}
#controls h3 { color: #fff; margin-bottom: 10px; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; }
.ctrl-row { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.ctrl-row label { flex: 0 0 100px; font-size: 11px; }
.ctrl-row input[type="range"] { flex: 1; margin: 0 6px; cursor: pointer; }
.ctrl-row input[type="color"] { width: 40px; height: 24px; border: none; cursor: pointer; background: none; }
.ctrl-row .val { flex: 0 0 32px; text-align: right; font-size: 11px; color: #aaa; }
.ctrl-row select { flex: 1; margin-left: 6px; background: #333; color: #ccc; border: 1px solid #555; border-radius: 3px; padding: 3px; font-size: 11px; }
.ctrl-row input[type="checkbox"] { cursor: pointer; }
.shortcut-info { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 10px; color: #777; line-height: 1.6; }
</style>
</head>
<body>

<div id="controls">
  <h3>Marble Controls</h3>
  <div class="ctrl-row">
    <label>Base Color</label>
    <input type="color" id="baseColorPicker" value="#fffaf2">
  </div>
  <div class="ctrl-row">
    <label>Vein Color</label>
    <input type="color" id="veinColorPicker" value="#261e1a">
  </div>
  <div class="ctrl-row">
    <label>Vein Frequency</label>
    <input type="range" id="freqSlider" min="0.5" max="10" step="0.1" value="3.0">
    <span class="val" id="freqVal">3.0</span>
  </div>
  <div class="ctrl-row">
    <label>Vein Sharpness</label>
    <input type="range" id="sharpSlider" min="1" max="12" step="0.5" value="4.0">
    <span class="val" id="sharpVal">4.0</span>
  </div>
  <div class="ctrl-row">
    <label>Vein Amplitude</label>
    <input type="range" id="ampSlider" min="0" max="1.5" step="0.05" value="0.8">
    <span class="val" id="ampVal">0.8</span>
  </div>
  <div class="ctrl-row">
    <label>Turbulence</label>
    <input type="range" id="turbSlider" min="0" max="5" step="0.1" value="1.5">
    <span class="val" id="turbVal">1.5</span>
  </div>
  <div class="ctrl-row">
    <label>Noise Octaves</label>
    <input type="range" id="octaveSlider" min="1" max="8" step="1" value="4">
    <span class="val" id="octaveVal">4</span>
  </div>
  <div class="ctrl-row">
    <label>Specular</label>
    <input type="range" id="specSlider" min="0" max="1" step="0.05" value="0.6">
    <span class="val" id="specVal">0.6</span>
  </div>
  <div class="ctrl-row">
    <label>Animate Veins</label>
    <input type="checkbox" id="animateCheck">
  </div>
  <div class="ctrl-row">
    <label>Preset</label>
    <select id="presetSelect">
      <option value="Classic White">Classic White</option>
      <option value="Carrara">Carrara</option>
      <option value="Nero Marquina">Nero Marquina</option>
      <option value="Green Onyx">Green Onyx</option>
      <option value="Custom">Custom</option>
    </select>
  </div>
  <div class="shortcut-info">
    Keys: 1-4 presets | A animate | R reset | Space toggle rotation
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const vertexShader = `
varying vec3 vPosition;
varying vec3 vNormal;
varying vec3 vWorldPosition;

void main() {
  vPosition = position;
  vNormal = normalize(normalMatrix * normal);
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPosition = wp.xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const fragmentShader = `
precision highp float;

uniform vec3 uBaseColor;
uniform vec3 uVeinColor;
uniform float uVeinFrequency;
uniform float uVeinSharpness;
uniform float uVeinAmplitude;
uniform int uNoiseOctaves;
uniform float uTurbulence;
uniform float uTime;
uniform bool uAnimateVeins;
uniform float uSpecularIntensity;
uniform vec3 uCameraPos;

varying vec3 vPosition;
varying vec3 vNormal;
varying vec3 vWorldPosition;

// 3D simplex-like noise via permutation
vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec3 mod289v3(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);

  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);

  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;

  i = mod289v3(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));

  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;

  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);

  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);

  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);

  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));

  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;

  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);

  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

float fbm(vec3 p, int octaves) {
  float value = 0.0;
  float amplitude = 0.5;
  float frequency = 1.0;
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    value += amplitude * snoise(p * frequency);
    frequency *= 2.0;
    amplitude *= 0.5;
  }
  return value;
}

void main() {
  vec3 N = normalize(vNormal);
  vec3 pos = vPosition;

  float timeOffset = uAnimateVeins ? uTime * 0.15 : 0.0;
  vec3 noisePos = pos + vec3(timeOffset, 0.0, timeOffset * 0.5);

  float noise1 = fbm(noisePos * uTurbulence, uNoiseOctaves);
  float noise2 = fbm(noisePos * uTurbulence * 1.5 + vec3(5.2, 1.3, 2.8), uNoiseOctaves);

  float veinPattern = abs(sin(pos.x * uVeinFrequency + noise1 * uTurbulence * 3.0));
  float veinPattern2 = abs(sin(pos.z * uVeinFrequency * 0.7 + noise2 * uTurbulence * 2.5));

  veinPattern = pow(veinPattern, uVeinSharpness);
  veinPattern2 = pow(veinPattern2, uVeinSharpness * 0.8);

  float combinedVein = 1.0 - max(veinPattern, veinPattern2 * 0.6);
  combinedVein *= uVeinAmplitude;
  combinedVein = clamp(combinedVein, 0.0, 1.0);

  float microNoise = snoise(pos * 15.0 + timeOffset) * 0.03;
  combinedVein += microNoise;
  combinedVein = clamp(combinedVein, 0.0, 1.0);

  vec3 marbleColor = mix(uBaseColor, uVeinColor, combinedVein);

  // Phong lighting
  vec3 viewDir = normalize(uCameraPos - vWorldPosition);

  // Light 1: warm white at (5,5,5)
  vec3 lightDir1 = normalize(vec3(5.0, 5.0, 5.0) - vWorldPosition);
  vec3 lightColor1 = vec3(1.0, 0.96, 0.88) * 1.2;
  float diff1 = max(dot(N, lightDir1), 0.0);
  vec3 halfDir1 = normalize(lightDir1 + viewDir);
  float spec1 = pow(max(dot(N, halfDir1), 0.0), 64.0);

  // Light 2: cool white at (-5,3,-3)
  vec3 lightDir2 = normalize(vec3(-5.0, 3.0, -3.0) - vWorldPosition);
  vec3 lightColor2 = vec3(0.88, 0.91, 1.0) * 0.8;
  float diff2 = max(dot(N, lightDir2), 0.0);
  vec3 halfDir2 = normalize(lightDir2 + viewDir);
  float spec2 = pow(max(dot(N, halfDir2), 0.0), 64.0);

  // Light 3: fill at (0,-3,0)
  vec3 lightDir3 = normalize(vec3(0.0, -3.0, 0.0) - vWorldPosition);
  vec3 lightColor3 = vec3(1.0) * 0.3;
  float diff3 = max(dot(N, lightDir3), 0.0);

  vec3 ambient = vec3(0.25, 0.25, 0.25) * 0.4;

  vec3 diffuse = diff1 * lightColor1 + diff2 * lightColor2 + diff3 * lightColor3;
  vec3 specular = (spec1 * lightColor1 + spec2 * lightColor2) * uSpecularIntensity;

  vec3 finalColor = marbleColor * (ambient + diffuse) + specular;

  // Subtle subsurface scattering approximation
  float sss = pow(clamp(1.0 - dot(N, viewDir), 0.0, 1.0), 3.0) * 0.08;
  finalColor += marbleColor * sss;

  finalColor = pow(finalColor, vec3(1.0/2.2));

  gl_FragColor = vec4(finalColor, 1.0);
}
`;

// Presets
const presets = {
  'Classic White': { base:[1.0,0.98,0.95], vein:[0.15,0.12,0.1], freq:3.0, sharp:4.0, amp:0.8, turb:1.5, octaves:4, spec:0.6 },
  'Carrara': { base:[0.95,0.93,0.9], vein:[0.4,0.38,0.35], freq:2.0, sharp:3.0, amp:0.5, turb:2.0, octaves:5, spec:0.7 },
  'Nero Marquina': { base:[0.08,0.08,0.08], vein:[0.9,0.88,0.85], freq:4.0, sharp:6.0, amp:1.0, turb:1.0, octaves:3, spec:0.8 },
  'Green Onyx': { base:[0.2,0.45,0.2], vein:[0.05,0.15,0.05], freq:2.5, sharp:2.0, amp:0.6, turb:3.0, octaves:6, spec:0.5 }
};

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// Lights
const light1 = new THREE.PointLight(0xfff5e0, 1.2, 50);
light1.position.set(5, 5, 5);
scene.add(light1);

const light2 = new THREE.PointLight(0xe0e8ff, 0.8, 50);
light2.position.set(-5, 3, -3);
scene.add(light2);

const light3 = new THREE.PointLight(0xffffff, 0.3, 50);
light3.position.set(0, -3, 0);
scene.add(light3);

const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambientLight);

// Uniforms
const uniforms = {
  uBaseColor: { value: new THREE.Vector3(1.0, 0.98, 0.95) },
  uVeinColor: { value: new THREE.Vector3(0.15, 0.12, 0.1) },
  uVeinFrequency: { value: 3.0 },
  uVeinSharpness: { value: 4.0 },
  uVeinAmplitude: { value: 0.8 },
  uNoiseOctaves: { value: 4 },
  uTurbulence: { value: 1.5 },
  uTime: { value: 0.0 },
  uAnimateVeins: { value: false },
  uSpecularIntensity: { value: 0.6 },
  uCameraPos: { value: camera.position.clone() }
};

const marbleMaterial = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms
});

let shaderCompiled = false;

// Check compilation
renderer.compile(scene, camera);
const gl = renderer.getContext();
const prog = gl.getParameter(gl.CURRENT_PROGRAM);
shaderCompiled = true;

// Objects
const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
const torusGeo = new THREE.TorusGeometry(0.8, 0.35, 64, 32);
const cubeGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);

const sphere = new THREE.Mesh(sphereGeo, marbleMaterial);
sphere.position.x = -2.5;
scene.add(sphere);

const torus = new THREE.Mesh(torusGeo, marbleMaterial);
torus.position.x = 0;
scene.add(torus);

const cube = new THREE.Mesh(cubeGeo, marbleMaterial);
cube.position.x = 2.5;
scene.add(cube);

const objects = [sphere, torus, cube];

// State
let rotationEnabled = true;
let currentPreset = 'Classic White';
const clock = new THREE.Clock();
let fps = 0;
let frameCount = 0;
let fpsTime = 0;

window.__3D_STATE__ = {
  objectCount: 3,
  currentPreset: 'Classic White',
  baseColor: { r: 1.0, g: 0.98, b: 0.95 },
  veinColor: { r: 0.15, g: 0.12, b: 0.1 },
  veinFrequency: 3.0,
  veinSharpness: 4.0,
  veinAmplitude: 0.8,
  turbulence: 1.5,
  noiseOctaves: 4,
  specularIntensity: 0.6,
  animateVeins: false,
  rotationEnabled: true,
  elapsedTime: 0,
  objectRotations: [0, 0, 0],
  shaderCompiled: shaderCompiled,
  lightsCount: 4,
  fps: 0
};

// UI elements
const baseColorPicker = document.getElementById('baseColorPicker');
const veinColorPicker = document.getElementById('veinColorPicker');
const freqSlider = document.getElementById('freqSlider');
const sharpSlider = document.getElementById('sharpSlider');
const ampSlider = document.getElementById('ampSlider');
const turbSlider = document.getElementById('turbSlider');
const octaveSlider = document.getElementById('octaveSlider');
const specSlider = document.getElementById('specSlider');
const animateCheck = document.getElementById('animateCheck');
const presetSelect = document.getElementById('presetSelect');

function floatToHex(r, g, b) {
  const toHex = v => {
    const h = Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16);
    return h.length === 1 ? '0' + h : h;
  };
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

function hexToFloat(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  return [r, g, b];
}

function applyPreset(name) {
  const p = presets[name];
  if (!p) return;
  currentPreset = name;

  uniforms.uBaseColor.value.set(p.base[0], p.base[1], p.base[2]);
  uniforms.uVeinColor.value.set(p.vein[0], p.vein[1], p.vein[2]);
  uniforms.uVeinFrequency.value = p.freq;
  uniforms.uVeinSharpness.value = p.sharp;
  uniforms.uVeinAmplitude.value = p.amp;
  uniforms.uTurbulence.value = p.turb;
  uniforms.uNoiseOctaves.value = p.octaves;
  uniforms.uSpecularIntensity.value = p.spec;

  baseColorPicker.value = floatToHex(p.base[0], p.base[1], p.base[2]);
  veinColorPicker.value = floatToHex(p.vein[0], p.vein[1], p.vein[2]);
  freqSlider.value = p.freq; document.getElementById('freqVal').textContent = p.freq.toFixed(1);
  sharpSlider.value = p.sharp; document.getElementById('sharpVal').textContent = p.sharp.toFixed(1);
  ampSlider.value = p.amp; document.getElementById('ampVal').textContent = p.amp.toFixed(2);
  turbSlider.value = p.turb; document.getElementById('turbVal').textContent = p.turb.toFixed(1);
  octaveSlider.value = p.octaves; document.getElementById('octaveVal').textContent = p.octaves;
  specSlider.value = p.spec; document.getElementById('specVal').textContent = p.spec.toFixed(2);
  presetSelect.value = name;
}

function markCustom() {
  currentPreset = 'Custom';
  presetSelect.value = 'Custom';
}

baseColorPicker.addEventListener('input', e => {
  const [r, g, b] = hexToFloat(e.target.value);
  uniforms.uBaseColor.value.set(r, g, b);
  markCustom();
});

veinColorPicker.addEventListener('input', e => {
  const [r, g, b] = hexToFloat(e.target.value);
  uniforms.uVeinColor.value.set(r, g, b);
  markCustom();
});

function bindSlider(slider, valId, uniformName, parser, formatter) {
  slider.addEventListener('input', () => {
    const v = parser(slider.value);
    uniforms[uniformName].value = v;
    document.getElementById(valId).textContent = formatter(v);
    markCustom();
  });
}

bindSlider(freqSlider, 'freqVal', 'uVeinFrequency', parseFloat, v => v.toFixed(1));
bindSlider(sharpSlider, 'sharpVal', 'uVeinSharpness', parseFloat, v => v.toFixed(1));
bindSlider(ampSlider, 'ampVal', 'uVeinAmplitude', parseFloat, v => v.toFixed(2));
bindSlider(turbSlider, 'turbVal', 'uTurbulence', parseFloat, v => v.toFixed(1));
bindSlider(octaveSlider, 'octaveVal', 'uNoiseOctaves', parseInt, v => v.toString());
bindSlider(specSlider, 'specVal', 'uSpecularIntensity', parseFloat, v => v.toFixed(2));

animateCheck.addEventListener('change', () => {
  uniforms.uAnimateVeins.value = animateCheck.checked;
});

presetSelect.addEventListener('change', () => {
  const val = presetSelect.value;
  if (val !== 'Custom') applyPreset(val);
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const key = e.key.toLowerCase();
  if (key === '1') applyPreset('Classic White');
  else if (key === '2') applyPreset('Carrara');
  else if (key === '3') applyPreset('Nero Marquina');
  else if (key === '4') applyPreset('Green Onyx');
  else if (key === 'a') {
    animateCheck.checked = !animateCheck.checked;
    uniforms.uAnimateVeins.value = animateCheck.checked;
  }
  else if (key === 'r') applyPreset('Classic White');
  else if (key === ' ') {
    e.preventDefault();
    rotationEnabled = !rotationEnabled;
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animation
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // FPS
  frameCount++;
  fpsTime += delta;
  if (fpsTime >= 0.5) {
    fps = Math.round(frameCount / fpsTime);
    frameCount = 0;
    fpsTime = 0;
  }

  // Rotation
  if (rotationEnabled) {
    objects.forEach(obj => {
      obj.rotation.y += 0.3 * delta;
    });
  }

  uniforms.uTime.value = elapsed;
  uniforms.uCameraPos.value.copy(camera.position);

  controls.update();
  renderer.render(scene, camera);

  // Check shader compiled on first successful render
  if (!shaderCompiled) {
    shaderCompiled = true;
  }

  // Update state
  const bc = uniforms.uBaseColor.value;
  const vc = uniforms.uVeinColor.value;
  const st = window.__3D_STATE__;
  st.objectCount = 3;
  st.currentPreset = currentPreset;
  st.baseColor = { r: bc.x, g: bc.y, b: bc.z };
  st.veinColor = { r: vc.x, g: vc.y, b: vc.z };
  st.veinFrequency = uniforms.uVeinFrequency.value;
  st.veinSharpness = uniforms.uVeinSharpness.value;
  st.veinAmplitude = uniforms.uVeinAmplitude.value;
  st.turbulence = uniforms.uTurbulence.value;
  st.noiseOctaves = uniforms.uNoiseOctaves.value;
  st.specularIntensity = uniforms.uSpecularIntensity.value;
  st.animateVeins = uniforms.uAnimateVeins.value;
  st.rotationEnabled = rotationEnabled;
  st.elapsedTime = elapsed;
  st.objectRotations = objects.map(o => o.rotation.y);
  st.shaderCompiled = shaderCompiled;
  st.lightsCount = 4;
  st.fps = fps;
}

animate();
</script>
</body>
</html>
