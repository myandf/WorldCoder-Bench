<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Redox Half-Reaction Electron Balancer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 310px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }

    #hud h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: #ffd966;
    }

    #hud .row {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.35;
    }

    #controls {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: min(95vw, 950px);
    }

    #controls button {
      background: #243b55;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
      min-width: 145px;
      transition: transform 0.08s ease, background 0.2s ease;
    }

    #controls button:hover {
      background: #2d4d72;
    }

    #controls button:active {
      transform: scale(0.98);
    }

    .status-balanced {
      color: #6dff8d;
      font-weight: bold;
    }

    .status-unbalanced {
      color: #ff7b7b;
      font-weight: bold;
    }

    .status-unchecked {
      color: #ffd966;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <h2>Redox Half-Reaction Balancer</h2>
      <div class="row"><strong>Reaction:</strong> <span id="reaction-display"></span></div>
      <div class="row"><strong>Left electrons:</strong> <span id="left-count">0</span></div>
      <div class="row"><strong>Right electrons:</strong> <span id="right-count">0</span></div>
      <div class="row"><strong>Status:</strong> <span id="balance-status" class="status-unchecked">Unchecked</span></div>
      <div class="row"><strong>Score:</strong> <span id="score">0</span></div>
      <div class="row" style="opacity:0.85; font-size:12px; margin-top:8px;">
        Keyboard: <strong>L</strong> = add left electron, <strong>R</strong> = add right electron
      </div>
    </div>

    <div id="controls">
      <button id="btn-add-left">Add Electron Left</button>
      <button id="btn-add-right">Add Electron Right</button>
      <button id="btn-remove-left">Remove Electron Left</button>
      <button id="btn-remove-right">Remove Electron Right</button>
      <button id="btn-check">Check Balance</button>
      <button id="btn-next">Next Reaction</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 5, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('app').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    const directional = new THREE.DirectionalLight(0xffffff, 0.8);
    directional.position.set(5, 10, 7);
    scene.add(directional);

    const workbench = new THREE.Mesh(
      new THREE.BoxGeometry(20, 0.3, 10),
      new THREE.MeshStandardMaterial({ color: '#333333', roughness: 0.85, metalness: 0.15 })
    );
    workbench.position.set(0, 0, 0);
    scene.add(workbench);

    const reactions = [
      {
        name: 'Iron Reduction',
        equation: 'Fe³⁺ + e⁻ → Fe²⁺',
        reactant: 'Fe³⁺',
        product: 'Fe²⁺',
        requiredLeft: 1,
        requiredRight: 0
      },
      {
        name: 'Copper Oxidation',
        equation: 'Cu → Cu²⁺ + 2e⁻',
        reactant: 'Cu',
        product: 'Cu²⁺',
        requiredLeft: 0,
        requiredRight: 2
      },
      {
        name: 'Permanganate Reduction (Acidic)',
        equation: 'MnO₄⁻ + 5e⁻ → Mn²⁺',
        reactant: 'MnO₄⁻',
        product: 'Mn²⁺',
        requiredLeft: 5,
        requiredRight: 0
      },
      {
        name: 'Dichromate Reduction (Acidic)',
        equation: 'Cr₂O₇²⁻ + 6e⁻ → Cr³⁺',
        reactant: 'Cr₂O₇²⁻',
        product: 'Cr³⁺',
        requiredLeft: 6,
        requiredRight: 0
      }
    ];

    let currentReactionIndex = 0;
    let leftElectrons = 0;
    let rightElectrons = 0;
    let isBalanced = false;
    let balanceStatus = 'unchecked';
    let score = 0;
    let currentReactionCounted = false;

    const leftElectronGroup = new THREE.Group();
    const rightElectronGroup = new THREE.Group();
    scene.add(leftElectronGroup, rightElectronGroup);

    const electronGeometry = new THREE.SphereGeometry(0.25, 24, 24);
    const electronMaterial = new THREE.MeshStandardMaterial({
      color: '#3399ff',
      emissive: '#0066ff',
      emissiveIntensity: 1.4,
      roughness: 0.3,
      metalness: 0.1
    });

    const electronHaloMaterial = new THREE.MeshBasicMaterial({
      color: '#66aaff',
      transparent: true,
      opacity: 0.2,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    function createElectronMesh(baseX, baseY, baseZ = 0) {
      const group = new THREE.Group();
      group.userData.basePosition = new THREE.Vector3(baseX, baseY, baseZ);
      group.userData.phase = Math.random() * Math.PI * 2;

      const core = new THREE.Mesh(electronGeometry, electronMaterial.clone());
      const halo = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 20), electronHaloMaterial.clone());
      group.add(core, halo);

      group.position.copy(group.userData.basePosition);
      return group;
    }

    function clearGroup(group) {
      while (group.children.length > 0) {
        const child = group.children[0];
        group.remove(child);
        child.traverse?.((obj) => {
          if (obj.geometry) obj.geometry.dispose?.();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose?.());
            else obj.material.dispose?.();
          }
        });
      }
    }

    function rebuildElectrons() {
      clearGroup(leftElectronGroup);
      clearGroup(rightElectronGroup);

      for (let i = 0; i < leftElectrons; i++) {
        const e = createElectronMesh(-2, 1.5 + i * 0.6, 0);
        leftElectronGroup.add(e);
      }
      for (let i = 0; i < rightElectrons; i++) {
        const e = createElectronMesh(2, 1.5 + i * 0.6, 0);
        rightElectronGroup.add(e);
      }
    }

    function makeTextPanel(text, width = 3.2, height = 1.7) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      function draw(label) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(15, 18, 35, 0.85)';
        roundRect(ctx, 10, 10, canvas.width - 20, canvas.height - 20, 26);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 6;
        roundRect(ctx, 10, 10, canvas.width - 20, canvas.height - 20, 26);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 72px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, canvas.width / 2, canvas.height / 2);
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      draw(text);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true
      });

      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), material);
      mesh.userData.canvas = canvas;
      mesh.userData.ctx = ctx;
      mesh.userData.texture = texture;
      mesh.userData.draw = draw;
      return mesh;
    }

    const leftPanel = makeTextPanel('Fe³⁺');
    leftPanel.position.set(-4, 2.4, 0);
    scene.add(leftPanel);

    const rightPanel = makeTextPanel('Fe²⁺');
    rightPanel.position.set(4, 2.4, 0);
    scene.add(rightPanel);

    const arrowGroup = new THREE.Group();
    const arrowMaterial = new THREE.MeshStandardMaterial({
      color: '#ffff00',
      emissive: '#665500',
      emissiveIntensity: 0.4,
      roughness: 0.4,
      metalness: 0.3
    });

    const arrowBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.13, 0.13, 2.2, 24),
      arrowMaterial
    );
    arrowBody.rotation.z = -Math.PI / 2;

    const arrowHead = new THREE.Mesh(
      new THREE.ConeGeometry(0.33, 0.8, 24),
      arrowMaterial
    );
    arrowHead.rotation.z = -Math.PI / 2;
    arrowHead.position.x = 1.45;

    arrowGroup.add(arrowBody, arrowHead);
    arrowGroup.position.set(0, 2.1, 0);
    scene.add(arrowGroup);

    function setArrowColor(hex) {
      arrowMaterial.color.set(hex);
      if (hex.toLowerCase() === '#00ff00') arrowMaterial.emissive.set('#004400');
      else if (hex.toLowerCase() === '#ff0000') arrowMaterial.emissive.set('#440000');
      else arrowMaterial.emissive.set('#665500');
    }

    let horse = null;
    let horseLoaded = false;

    const loader = new GLTFLoader();
    loader.load(
      'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/Horse/glTF-Binary/Horse.glb',
      (gltf) => {
        horse = gltf.scene;
        horse.scale.setScalar(0.8);
        horse.position.set(-8, 0.15, -3);
        horse.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = false;
            obj.receiveShadow = false;
          }
        });
        scene.add(horse);
        horseLoaded = true;
      },
      undefined,
      () => {
        horseLoaded = false;
      }
    );

    function updatePanels() {
      const reaction = reactions[currentReactionIndex];
      leftPanel.userData.draw(reaction.reactant);
      leftPanel.userData.texture.needsUpdate = true;

      rightPanel.userData.draw(reaction.product);
      rightPanel.userData.texture.needsUpdate = true;
    }

    const reactionDisplay = document.getElementById('reaction-display');
    const leftCountEl = document.getElementById('left-count');
    const rightCountEl = document.getElementById('right-count');
    const balanceStatusEl = document.getElementById('balance-status');
    const scoreEl = document.getElementById('score');

    function updateHUD() {
      const reaction = reactions[currentReactionIndex];
      reactionDisplay.textContent = `${reaction.name}: ${reaction.equation}`;
      leftCountEl.textContent = String(leftElectrons);
      rightCountEl.textContent = String(rightElectrons);
      scoreEl.textContent = String(score);

      balanceStatusEl.className =
        balanceStatus === 'balanced' ? 'status-balanced' :
        balanceStatus === 'unbalanced' ? 'status-unbalanced' :
        'status-unchecked';

      balanceStatusEl.textContent =
        balanceStatus === 'balanced' ? 'Balanced!' :
        balanceStatus === 'unbalanced' ? 'Unbalanced' :
        'Unchecked';
    }

    function resetForNewReaction() {
      leftElectrons = 0;
      rightElectrons = 0;
      isBalanced = false;
      balanceStatus = 'unchecked';
      currentReactionCounted = false;
      setArrowColor('#ffff00');
      arrowGroup.scale.set(1, 1, 1);
      rebuildElectrons();
      updatePanels();
      updateHUD();
    }

    function addElectronLeft() {
      leftElectrons += 1;
      balanceStatus = 'unchecked';
      isBalanced = false;
      setArrowColor('#ffff00');
      rebuildElectrons();
      updateHUD();
    }

    function addElectronRight() {
      rightElectrons += 1;
      balanceStatus = 'unchecked';
      isBalanced = false;
      setArrowColor('#ffff00');
      rebuildElectrons();
      updateHUD();
    }

    function removeElectronLeft() {
      leftElectrons = Math.max(0, leftElectrons - 1);
      balanceStatus = 'unchecked';
      isBalanced = false;
      setArrowColor('#ffff00');
      rebuildElectrons();
      updateHUD();
    }

    function removeElectronRight() {
      rightElectrons = Math.max(0, rightElectrons - 1);
      balanceStatus = 'unchecked';
      isBalanced = false;
      setArrowColor('#ffff00');
      rebuildElectrons();
      updateHUD();
    }

    function checkBalance() {
      const reaction = reactions[currentReactionIndex];
      const correct = leftElectrons === reaction.requiredLeft && rightElectrons === reaction.requiredRight;
      isBalanced = correct;
      balanceStatus = correct ? 'balanced' : 'unbalanced';
      setArrowColor(correct ? '#00ff00' : '#ff0000');

      if (correct && !currentReactionCounted) {
        score += 1;
        currentReactionCounted = true;
      }
      updateHUD();
    }

    function nextReaction() {
      currentReactionIndex = (currentReactionIndex + 1) % reactions.length;
      resetForNewReaction();
    }

    document.getElementById('btn-add-left').addEventListener('click', addElectronLeft);
    document.getElementById('btn-add-right').addEventListener('click', addElectronRight);
    document.getElementById('btn-remove-left').addEventListener('click', removeElectronLeft);
    document.getElementById('btn-remove-right').addEventListener('click', removeElectronRight);
    document.getElementById('btn-check').addEventListener('click', checkBalance);
    document.getElementById('btn-next').addEventListener('click', nextReaction);

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === 'l' || e.key === 'L') addElectronLeft();
      if (e.key === 'r' || e.key === 'R') addElectronRight();
    });

    const floorGrid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    floorGrid.position.y = 0.16;
    floorGrid.material.transparent = true;
    floorGrid.material.opacity = 0.22;
    scene.add(floorGrid);

    const clock = new THREE.Clock();

    window.__3D_STATE__ = {
      currentReactionIndex: 0,
      leftElectrons: 0,
      rightElectrons: 0,
      isBalanced: false,
      balanceStatus: 'unchecked',
      score: 0,
      requiredLeft: reactions[0].requiredLeft,
      requiredRight: reactions[0].requiredRight,
      arrowColorHex: '#ffff00',
      horseLoaded: false,
      horseRotationY: 0,
      electronMeshCount: 0,
      totalElectrons: 0,
      reactions: reactions.map(r => ({
        name: r.name,
        requiredLeft: r.requiredLeft,
        requiredRight: r.requiredRight
      }))
    };

    function updateState() {
      const reaction = reactions[currentReactionIndex];
      window.__3D_STATE__.currentReactionIndex = currentReactionIndex;
      window.__3D_STATE__.leftElectrons = leftElectrons;
      window.__3D_STATE__.rightElectrons = rightElectrons;
      window.__3D_STATE__.isBalanced = isBalanced;
      window.__3D_STATE__.balanceStatus = balanceStatus;
      window.__3D_STATE__.score = score;
      window.__3D_STATE__.requiredLeft = reaction.requiredLeft;
      window.__3D_STATE__.requiredRight = reaction.requiredRight;
      window.__3D_STATE__.arrowColorHex = `#${arrowMaterial.color.getHexString()}`;
      window.__3D_STATE__.horseLoaded = horseLoaded;
      window.__3D_STATE__.horseRotationY = horse ? horse.rotation.y : 0;
      window.__3D_STATE__.electronMeshCount = leftElectronGroup.children.length + rightElectronGroup.children.length;
      window.__3D_STATE__.totalElectrons = leftElectrons + rightElectrons;
      window.__3D_STATE__.reactions = reactions.map(r => ({
        name: r.name,
        requiredLeft: r.requiredLeft,
        requiredRight: r.requiredRight
      }));
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const delta = clock.getDelta();

      controls.update();

      if (horse) {
        horse.rotation.y += 0.3 * delta;
      }

      const orbitRadius = 0.15;
      const orbitSpeed = 1.0;

      [...leftElectronGroup.children, ...rightElectronGroup.children].forEach((group, idx) => {
        const base = group.userData.basePosition;
        const phase = group.userData.phase || 0;
        const t = elapsed * orbitSpeed + phase + idx * 0.12;
        group.position.set(
          base.x + Math.cos(t) * orbitRadius,
          base.y + Math.sin(t) * orbitRadius * 0.55,
          base.z + Math.sin(t) * orbitRadius
        );
      });

      if (balanceStatus === 'balanced') {
        const s = 1.05 + Math.sin(elapsed * Math.PI) * 0.05; // 0.5 Hz
        arrowGroup.scale.set(s, s, s);
      } else {
        arrowGroup.scale.set(1, 1, 1);
      }

      leftPanel.lookAt(camera.position);
      rightPanel.lookAt(camera.position);

      updateState();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updatePanels();
    rebuildElectrons();
    updateHUD();
    setArrowColor('#ffff00');
    animate();
  </script>
</body>
</html>
