<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Path Spline Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
  #canvas-container { position: fixed; top: 0; left: 280px; right: 0; bottom: 0; }
  #panel {
    position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
    background: rgba(10,10,20,0.92); color: #e0e0e0;
    display: flex; flex-direction: column; overflow: hidden;
    border-right: 1px solid rgba(255,255,255,0.1);
  }
  #panel-header { padding: 12px 14px 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  #panel-header h2 { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
  .section { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .section-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .btn-row { display: flex; gap: 6px; }
  .diff-btn {
    flex: 1; padding: 6px 4px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05); color: #ccc; border-radius: 4px;
    cursor: pointer; font-size: 12px; transition: all 0.15s;
  }
  .diff-btn:hover { background: rgba(255,255,255,0.12); }
  .diff-btn.active { background: rgba(255,165,0,0.3); border-color: orange; color: orange; }
  #kf-list { flex: 1; overflow-y: auto; padding: 6px 14px; }
  #kf-list::-webkit-scrollbar { width: 4px; }
  #kf-list::-webkit-scrollbar-track { background: transparent; }
  #kf-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
  .kf-item {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 5px; padding: 7px 8px; margin-bottom: 5px; font-size: 11px;
    transition: border-color 0.15s;
  }
  .kf-item.selected { border-color: #4caf50; background: rgba(76,175,80,0.1); }
  .kf-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .kf-id { font-weight: bold; color: orange; font-size: 12px; }
  .kf-ease { font-size: 10px; color: #888; background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 3px; }
  .kf-pos { color: #aaa; font-size: 10px; margin-bottom: 4px; }
  .kf-time { color: #7ec8e3; font-size: 10px; margin-bottom: 5px; }
  .kf-btns { display: flex; gap: 5px; }
  .kf-select, .kf-delete {
    flex: 1; padding: 3px 0; border: none; border-radius: 3px;
    cursor: pointer; font-size: 10px; transition: opacity 0.15s;
  }
  .kf-select { background: rgba(76,175,80,0.4); color: #c8ffc8; }
  .kf-select:hover { background: rgba(76,175,80,0.6); }
  .kf-delete { background: rgba(220,50,50,0.4); color: #ffc8c8; }
  .kf-delete:hover { background: rgba(220,50,50,0.6); }
  #panel-footer { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.1); }
  .action-btn {
    width: 100%; padding: 7px; margin-bottom: 6px; border: none; border-radius: 4px;
    cursor: pointer; font-size: 12px; font-weight: 600; transition: opacity 0.15s;
  }
  .action-btn:hover { opacity: 0.85; }
  #btn-add-kf { background: rgba(255,165,0,0.7); color: #fff; }
  #btn-play { background: rgba(76,175,80,0.7); color: #fff; }
  #btn-stop { background: rgba(220,50,50,0.7); color: #fff; }
  #playback-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 11px; color: #aaa; }
  #progress-bar-container { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, orange, #ffdd57); border-radius: 3px; transition: width 0.05s; }
  #hints { padding: 8px 14px; font-size: 10px; color: #666; border-top: 1px solid rgba(255,255,255,0.05); line-height: 1.6; }
  #validation-errors { padding: 6px 14px; font-size: 10px; color: #ff6b6b; min-height: 0; }
  .error-item { margin-bottom: 2px; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="panel">
  <div id="panel-header"><h2>Camera Path Editor</h2></div>
  <div class="section">
    <div class="section-label">Difficulty</div>
    <div class="btn-row">
      <button class="diff-btn active" id="btn-easy">Easy</button>
      <button class="diff-btn" id="btn-medium">Medium</button>
      <button class="diff-btn" id="btn-hard">Hard</button>
    </div>
  </div>
  <div id="validation-errors"></div>
  <div id="kf-list"></div>
  <div id="panel-footer">
    <button class="action-btn" id="btn-add-kf">+ Add Keyframe</button>
    <button class="action-btn" id="btn-play">▶ Play Preview</button>
    <button class="action-btn" id="btn-stop">■ Stop Preview</button>
    <div id="playback-info">
      <span>Time: <span id="playback-time">0.00s</span></span>
      <span id="duration-display">Duration: 0.00s</span>
    </div>
    <div id="progress-bar-container"><div id="progress-bar"></div></div>
  </div>
  <div id="hints">
    Arrow keys: move selected KF (X/Z)<br>
    Shift+↑↓: move Y axis<br>
    E: cycle ease type | T: set timestamp
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── State ───────────────────────────────────────────────────────────────────
const EASE_TYPES = ['linear','easeIn','easeOut','easeInOut'];
const DIFFICULTY_CONFIG = {
  Easy:   { max: 5,  minGap: null, durationMin: null, durationMax: null },
  Medium: { max: 8,  minGap: 0.5,  durationMin: null, durationMax: null },
  Hard:   { max: 12, minGap: 0.3,  durationMin: 3,    durationMax: 15   }
};

let keyframes = [
  { id: 'KF0', position: {x:0,  y:10, z:20}, lookAt: {x:0,y:0,z:0},   easeType:'linear', timestamp:0   },
  { id: 'KF1', position: {x:15, y:8,  z:10}, lookAt: {x:5,y:1,z:5},   easeType:'linear', timestamp:3   }
];
let selectedKeyframeIndex = -1;
let difficulty = 'Easy';
let isPlaying = false;
let playbackTime = 0;
let playbackDuration = 0;
let lastAction = 'init';
let validationErrors = [];
let kfIdCounter = 2;

// ─── Three.js Setup ───────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d1a);
scene.fog = new THREE.Fog(0x0d0d1a, 60, 120);

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
camera.position.set(0, 15, 25);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// Ground
const gridHelper = new THREE.GridHelper(50, 50, 0x444466, 0x333355);
scene.add(gridHelper);
const groundGeo = new THREE.PlaneGeometry(50, 50);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x1a1a2e });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Landmarks
function makeLandmark(geo, color, x, y, z) {
  const mat = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  scene.add(mesh);
}
makeLandmark(new THREE.BoxGeometry(2,2,2), 0xff3333, 5, 1, 5);
makeLandmark(new THREE.SphereGeometry(1.2, 16, 16), 0x3366ff, -8, 2, 3);
makeLandmark(new THREE.CylinderGeometry(0.8, 0.8, 2.5, 16), 0x33cc66, 0, 1, -7);
makeLandmark(new THREE.TorusGeometry(1.2, 0.4, 12, 24), 0xffdd00, 10, 1, -5);

// ─── Spline Visualization ─────────────────────────────────────────────────────
const KF_SPHERE_MAT = new THREE.MeshLambertMaterial({ color: 0xff8800 });
const KF_SPHERE_MAT_SEL = new THREE.MeshLambertMaterial({ color: 0x44ff44 });
const KF_SPHERE_GEO = new THREE.SphereGeometry(0.4, 12, 12);
const ARROW_MAT = new THREE.MeshLambertMaterial({ color: 0x4488ff });

let kfSpheres = [];
let kfArrows = [];
let splineLine = null;
let splineCurve = null;

function buildSplineVisualization() {
  // Remove old spheres/arrows
  kfSpheres.forEach(s => scene.remove(s));
  kfArrows.forEach(a => scene.remove(a));
  kfSpheres = [];
  kfArrows = [];

  keyframes.forEach((kf, i) => {
    const sphere = new THREE.Mesh(KF_SPHERE_GEO, i === selectedKeyframeIndex ? KF_SPHERE_MAT_SEL : KF_SPHERE_MAT);
    sphere.position.set(kf.position.x, kf.position.y, kf.position.z);
    scene.add(sphere);
    kfSpheres.push(sphere);

    // Arrow for lookAt direction
    const dir = new THREE.Vector3(
      kf.lookAt.x - kf.position.x,
      kf.lookAt.y - kf.position.y,
      kf.lookAt.z - kf.position.z
    ).normalize();
    const arrowHelper = new THREE.ArrowHelper(dir, sphere.position, 1.5, 0x4488ff, 0.4, 0.25);
    scene.add(arrowHelper);
    kfArrows.push(arrowHelper);
  });

  // Spline line
  if (splineLine) { scene.remove(splineLine); splineLine = null; splineCurve = null; }

  if (keyframes.length >= 2) {
    const points = keyframes.map(kf => new THREE.Vector3(kf.position.x, kf.position.y, kf.position.z));
    splineCurve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
    const splinePoints = splineCurve.getPoints(100);
    const geo = new THREE.BufferGeometry().setFromPoints(splinePoints);
    const mat = new THREE.LineBasicMaterial({ color: 0xffee00, linewidth: 2 });
    splineLine = new THREE.Line(geo, mat);
    scene.add(splineLine);
  }
}

// ─── Validation ───────────────────────────────────────────────────────────────
function validate() {
  validationErrors = [];
  const cfg = DIFFICULTY_CONFIG[difficulty];

  if (cfg.minGap !== null) {
    for (let i = 1; i < keyframes.length; i++) {
      const gap = keyframes[i].timestamp - keyframes[i-1].timestamp;
      if (gap < cfg.minGap) {
        validationErrors.push(`KF${i-1}→KF${i}: gap ${gap.toFixed(2)}s < min ${cfg.minGap}s`);
      }
    }
  }

  if (cfg.durationMin !== null && keyframes.length >= 2) {
    const dur = keyframes[keyframes.length-1].timestamp - keyframes[0].timestamp;
    if (dur < cfg.durationMin) validationErrors.push(`Duration ${dur.toFixed(2)}s < min ${cfg.durationMin}s`);
    if (dur > cfg.durationMax) validationErrors.push(`Duration ${dur.toFixed(2)}s > max ${cfg.durationMax}s`);
  }

  const errEl = document.getElementById('validation-errors');
  errEl.innerHTML = validationErrors.map(e => `<div class="error-item">⚠ ${e}</div>`).join('');
}

// ─── State Sync ───────────────────────────────────────────────────────────────
function syncState() {
  validate();
  playbackDuration = keyframes.length >= 2
    ? keyframes[keyframes.length-1].timestamp - keyframes[0].timestamp
    : 0;

  const splineLen = splineCurve ? splineCurve.getLength() : 0;

  window.__3D_STATE__ = {
    keyframes: keyframes.map(kf => ({
      id: kf.id,
      position: { ...kf.position },
      lookAt: { ...kf.lookAt },
      easeType: kf.easeType,
      timestamp: kf.timestamp
    })),
    selectedKeyframeIndex,
    difficulty,
    maxKeyframes: DIFFICULTY_CONFIG[difficulty].max,
    isPlaying,
    playbackTime,
    playbackDuration,
    splinePointCount: 101,
    splineCurveLength: splineLen,
    keyframeCount: keyframes.length,
    lastAction,
    validationErrors: [...validationErrors]
  };

  document.getElementById('duration-display').textContent = `Duration: ${playbackDuration.toFixed(2)}s`;
}

// ─── UI Rendering ─────────────────────────────────────────────────────────────
function renderPanel() {
  const list = document.getElementById('kf-list');
  list.innerHTML = '';
  keyframes.forEach((kf, i) => {
    const div = document.createElement('div');
    div.className = 'kf-item' + (i === selectedKeyframeIndex ? ' selected' : '');
    div.innerHTML = `
      <div class="kf-item-header">
        <span class="kf-id">${kf.id}</span>
        <span class="kf-ease">${kf.easeType}</span>
      </div>
      <div class="kf-pos">pos (${kf.position.x.toFixed(1)}, ${kf.position.y.toFixed(1)}, ${kf.position.z.toFixed(1)})</div>
      <div class="kf-time">t = ${kf.timestamp.toFixed(2)}s</div>
      <div class="kf-btns">
        <button class="kf-select" data-idx="${i}">Select</button>
        <button class="kf-delete" data-idx="${i}">Delete</button>
      </div>`;
    list.appendChild(div);
  });

  // Difficulty buttons
  ['Easy','Medium','Hard'].forEach(d => {
    document.getElementById(`btn-${d.toLowerCase()}`).classList.toggle('active', difficulty === d);
  });
}

function fullUpdate(action) {
  lastAction = action;
  buildSplineVisualization();
  renderPanel();
  syncState();
}

// ─── Easing Functions ─────────────────────────────────────────────────────────
function applyEase(t, type) {
  switch(type) {
    case 'easeIn':    return t * t;
    case 'easeOut':   return t * (2 - t);
    case 'easeInOut': return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    default:          return t;
  }
}

// ─── Playback ─────────────────────────────────────────────────────────────────
let playbackStartWallTime = 0;
let previewCamera = { position: new THREE.Vector3(), lookAt: new THREE.Vector3() };

function getInterpolatedCameraState(t) {
  if (keyframes.length < 2) return null;
  const totalDur = keyframes[keyframes.length-1].timestamp - keyframes[0].timestamp;
  if (totalDur <= 0) return null;

  const clampedT = Math.max(0, Math.min(totalDur, t));

  // Find segment
  let segIdx = 0;
  for (let i = 0; i < keyframes.length - 1; i++) {
    if (clampedT >= keyframes[i].timestamp && clampedT <= keyframes[i+1].timestamp) {
      segIdx = i; break;
    }
    if (i === keyframes.length - 2) segIdx = i;
  }

  const kfA = keyframes[segIdx];
  const kfB = keyframes[segIdx + 1];
  const segDur = kfB.timestamp - kfA.timestamp;
  let localT = segDur > 0 ? (clampedT - kfA.timestamp) / segDur : 1;
  localT = Math.max(0, Math.min(1, localT));
  localT = applyEase(localT, kfA.easeType);

  // Position from spline
  const normalizedSplineT = segDur > 0
    ? (kfA.timestamp + localT * segDur - keyframes[0].timestamp) / totalDur
    : segIdx / (keyframes.length - 1);

  const pos = splineCurve ? splineCurve.getPoint(Math.max(0, Math.min(1, normalizedSplineT))) : new THREE.Vector3();

  // LookAt linear interpolation
  const laA = new THREE.Vector3(kfA.lookAt.x, kfA.lookAt.y, kfA.lookAt.z);
  const laB = new THREE.Vector3(kfB.lookAt.x, kfB.lookAt.y, kfB.lookAt.z);
  const lookAt = laA.lerp(laB, localT);

  return { position: pos, lookAt };
}

// ─── Animation Loop ───────────────────────────────────────────────────────────
let lastTime = 0;
function animate(time) {
  requestAnimationFrame(animate);
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  if (isPlaying && splineCurve && keyframes.length >= 2) {
    playbackTime = (performance.now() - playbackStartWallTime) / 1000;
    const state = getInterpolatedCameraState(playbackTime);
    if (state) {
      camera.position.copy(state.position);
      camera.lookAt(state.lookAt);
      controls.target.copy(state.lookAt);
    }

    const progress = playbackDuration > 0 ? Math.min(1, playbackTime / playbackDuration) : 0;
    document.getElementById('progress-bar').style.width = (progress * 100) + '%';
    document.getElementById('playback-time').textContent = playbackTime.toFixed(2) + 's';

    if (playbackTime >= playbackDuration) {
      stopPlayback();
    } else {
      syncState();
    }
  } else {
    controls.update();
  }

  renderer.render(scene, camera);
}

function startPlayback() {
  if (keyframes.length < 2 || !splineCurve) return;
  isPlaying = true;
  playbackTime = 0;
  playbackStartWallTime = performance.now();
  controls.enabled = false;
  lastAction = 'started_playback';
  syncState();
}

function stopPlayback() {
  isPlaying = false;
  playbackTime = 0;
  controls.enabled = true;
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('playback-time').textContent = '0.00s';
  // Restore editor camera
  camera.position.set(0, 15, 25);
  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  lastAction = 'stopped_playback';
  syncState();
}

// ─── Keyframe Operations ──────────────────────────────────────────────────────
function addKeyframe() {
  const cfg = DIFFICULTY_CONFIG[difficulty];
  if (keyframes.length >= cfg.max) return;

  const last = keyframes[keyframes.length - 1];
  const prev = keyframes.length >= 2 ? keyframes[keyframes.length - 2] : null;

  let dir = new THREE.Vector3(0, 0, -1);
  if (prev) {
    dir.set(
      last.position.x - prev.position.x,
      last.position.y - prev.position.y,
      last.position.z - prev.position.z
    ).normalize();
  }

  const newPos = {
    x: last.position.x + dir.x * 2,
    y: last.position.y + dir.y * 2,
    z: last.position.z + dir.z * 2
  };

  keyframes.push({
    id: `KF${kfIdCounter++}`,
    position: newPos,
    lookAt: { x: 0, y: 0, z: 0 },
    easeType: 'linear',
    timestamp: last.timestamp + 1.5
  });

  fullUpdate('added_keyframe');
}

function deleteKeyframe(idx) {
  if (keyframes.length <= 1) return;
  keyframes.splice(idx, 1);
  if (selectedKeyframeIndex >= keyframes.length) selectedKeyframeIndex = keyframes.length - 1;
  else if (selectedKeyframeIndex === idx) selectedKeyframeIndex = -1;
  fullUpdate('deleted_keyframe');
}

function selectKeyframe(idx) {
  selectedKeyframeIndex = idx;
  fullUpdate('selected_keyframe');
}

function setDifficulty(d) {
  difficulty = d;
  const cfg = DIFFICULTY_CONFIG[d];
  while (keyframes.length > cfg.max) keyframes.pop();
  if (selectedKeyframeIndex >= keyframes.length) selectedKeyframeIndex = -1;
  fullUpdate('changed_difficulty');
}

// ─── Event Listeners ──────────────────────────────────────────────────────────
document.getElementById('btn-easy').addEventListener('click', () => setDifficulty('Easy'));
document.getElementById('btn-medium').addEventListener('click', () => setDifficulty('Medium'));
document.getElementById('btn-hard').addEventListener('click', () => setDifficulty('Hard'));
document.getElementById('btn-add-kf').addEventListener('click', addKeyframe);
document.getElementById('btn-play').addEventListener('click', startPlayback);
document.getElementById('btn-stop').addEventListener('click', stopPlayback);

document.getElementById('kf-list').addEventListener('click', e => {
  const idx = parseInt(e.target.dataset.idx);
  if (isNaN(idx)) return;
  if (e.target.classList.contains('kf-select')) selectKeyframe(idx);
  if (e.target.classList.contains('kf-delete')) deleteKeyframe(idx);
});

document.addEventListener('keydown', e => {
  if (isPlaying) return;
  if (selectedKeyframeIndex < 0 || selectedKeyframeIndex >= keyframes.length) return;

  const kf = keyframes[selectedKeyframeIndex];
  const step = 0.5;
  let moved = false;

  if (e.key === 'ArrowLeft')  { kf.position.x -= step; moved = true; }
  if (e.key === 'ArrowRight') { kf.position.x += step; moved = true; }
  if (!e.shiftKey && e.key === 'ArrowUp')   { kf.position.z -= step; moved = true; }
  if (!e.shiftKey && e.key === 'ArrowDown')  { kf.position.z += step; moved = true; }
  if (e.shiftKey && e.key === 'ArrowUp')   { kf.position.y += step; moved = true; }
  if (e.shiftKey && e.key === 'ArrowDown')  { kf.position.y -= step; moved = true; }

  if (moved) { e.preventDefault(); fullUpdate('moved_keyframe'); return; }

  if (e.key === 'e' || e.key === 'E') {
    const idx = EASE_TYPES.indexOf(kf.easeType);
    kf.easeType = EASE_TYPES[(idx + 1) % EASE_TYPES.length];
    fullUpdate('changed_ease');
    return;
  }

  if (e.key === 't' || e.key === 'T') {
    const val = prompt(`Set timestamp for ${kf.id} (current: ${kf.timestamp.toFixed(2)}s):`);
    if (val !== null) {
      const num = parseFloat(val);
      if (!isNaN(num)) {
        kf.timestamp = num;
        fullUpdate('changed_timestamp');
      }
    }
  }
});

window.addEventListener('resize', () => {
  const w = window.innerWidth - 280;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {});
const w = window.innerWidth - 280;
const h = window.innerHeight;
camera.aspect = w / h;
camera.updateProjectionMatrix();
renderer.setSize(w, h);

fullUpdate('init');
animate(0);
</script>
</body>
</html>
