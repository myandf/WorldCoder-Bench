<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oil Slick Pearlescent Shader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }
  #controlPanel {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(10, 10, 10, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 18px 22px;
    color: #ddd;
    font-size: 13px;
    min-width: 260px;
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  #controlPanel h3 {
    margin: 0 0 12px 0;
    font-size: 15px;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .ctrl-row label {
    flex: 0 0 110px;
    font-size: 12px;
    color: #aaa;
  }
  .ctrl-row input[type="range"] {
    flex: 1;
    margin: 0 10px;
    accent-color: #88ccff;
  }
  .ctrl-row .val {
    flex: 0 0 36px;
    text-align: right;
    font-size: 12px;
    color: #ccc;
    font-variant-numeric: tabular-nums;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-row button {
    flex: 1;
    padding: 6px 0;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    color: #ddd;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-row button:hover {
    background: rgba(255,255,255,0.18);
  }
  .info-row {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
    color: #888;
  }
  .info-row span { color: #aad4ff; }
</style>
</head>
<body>

<div id="controlPanel">
  <h3>Pearlescent Controls</h3>
  <div class="ctrl-row">
    <label for="thicknessSlider">Film Thickness</label>
    <input type="range" id="thicknessSlider" min="0.2" max="3.0" step="0.1" value="1.0">
    <div class="val" id="thicknessDisplay">1.0</div>
  </div>
  <div class="ctrl-row">
    <label for="speedSlider">Speed</label>
    <input type="range" id="speedSlider" min="0.0" max="2.0" step="0.1" value="0.5">
    <div class="val" id="speedDisplay">0.5</div>
  </div>
  <div class="ctrl-row">
    <label for="intensitySlider">Intensity</label>
    <input type="range" id="intensitySlider" min="0.0" max="2.0" step="0.1" value="1.0">
    <div class="val" id="intensityDisplay">1.0</div>
  </div>
  <div class="btn-row">
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div class="info-row">
    Time: <span id="timeDisplay">0.0</span> &nbsp;|&nbsp; Press <span>T</span> for wireframe
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.__3D_STATE__ = {
  time: 0,
  filmThickness: 1.0,
  speed: 0.5,
  intensity: 1.0,
  paused: false,
  wireframe: false,
  planeExists: false,
  sphereExists: false,
  shaderCompiled: false,
  cameraZ: 3,
  fresnelUniformsBound: false
};

const vertexShader = `
  uniform float uTime;
  varying vec3 vWorldNormal;
  varying vec3 vWorldPosition;
  varying vec2 vUv;

  void main() {
    vUv = uv;
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vWorldPosition = worldPos.xyz;
    vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
    gl_Position = projectionMatrix * viewMatrix * worldPos;
  }
`;

const fragmentShader = `
  uniform float uTime;
  uniform float uSpeed;
  uniform float uFilmThickness;
  uniform float uIntensity;
  uniform vec3 uLightDir;

  varying vec3 vWorldNormal;
  varying vec3 vWorldPosition;
  varying vec2 vUv;

  vec3 hsv2rgb(float h, float s, float v) {
    vec3 c = vec3(h, s, v);
    vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
    return c.z * mix(vec3(1.0), rgb, c.y);
  }

  vec3 thinFilmColor(float cosTheta, float thickness, float timeOffset) {
    float phase = cosTheta * thickness * 6.2831853 + timeOffset;

    // Produce cycling hues: magenta -> blue -> cyan -> green -> yellow -> red
    float hue = fract(phase * 0.15915494 + 0.83); // 0.83 starts near magenta
    vec3 rainbow = hsv2rgb(hue, 0.85, 1.0);

    // Add secondary interference band for realism
    float phase2 = cosTheta * thickness * 2.0 * 6.2831853 + timeOffset * 1.3;
    float hue2 = fract(phase2 * 0.15915494 + 0.5);
    vec3 rainbow2 = hsv2rgb(hue2, 0.7, 0.8);

    return mix(rainbow, rainbow2, 0.3);
  }

  void main() {
    vec3 N = normalize(vWorldNormal);
    vec3 V = normalize(cameraPosition - vWorldPosition);
    vec3 L = normalize(uLightDir);

    // Fresnel-like term
    float NdotV = dot(N, V);
    float fresnel = 1.0 - clamp(NdotV, 0.0, 1.0);
    float fresnelPow = pow(fresnel, 1.5);

    // Thin-film interference color
    float timeOffset = uTime * uSpeed;
    vec3 iridescence = thinFilmColor(NdotV, uFilmThickness, timeOffset);

    // Second layer with slight UV-based variation for spatial richness
    float spatialVar = sin(vUv.x * 12.0 + uTime * 0.2) * cos(vUv.y * 10.0 - uTime * 0.15) * 0.15;
    vec3 iridescence2 = thinFilmColor(NdotV + spatialVar, uFilmThickness * 1.2, timeOffset * 0.7);
    vec3 finalIridescence = mix(iridescence, iridescence2, 0.35);

    // Diffuse lighting
    float diff = max(dot(N, L), 0.0) * 0.6 + 0.4;

    // Specular highlight
    vec3 H = normalize(L + V);
    float spec = pow(max(dot(N, H), 0.0), 64.0) * 0.5;

    // Base dark oil color
    vec3 baseColor = vec3(0.02, 0.02, 0.03);

    // Combine: base + iridescent color weighted by fresnel + specular
    vec3 color = baseColor + finalIridescence * (0.3 + fresnelPow * 0.7) * uIntensity * diff;
    color += vec3(spec) * (0.5 + fresnelPow * 0.5);

    // Edge glow
    color += finalIridescence * fresnelPow * 0.3 * uIntensity;

    gl_FragColor = vec4(color, 1.0);
  }
`;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// Camera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 3);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(2, 3, 2);
scene.add(dirLight);

// Shared uniforms
const uniforms = {
  uTime: { value: 0.0 },
  uSpeed: { value: 0.5 },
  uFilmThickness: { value: 1.0 },
  uIntensity: { value: 1.0 },
  uLightDir: { value: new THREE.Vector3(2, 3, 2).normalize() }
};

function createMaterial() {
  return new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms,
    wireframe: false
  });
}

// Plane
const planeGeo = new THREE.PlaneGeometry(4, 4, 128, 128);
const planeMat = createMaterial();
const planeMesh = new THREE.Mesh(planeGeo, planeMat);
planeMesh.rotation.x = -0.3;
scene.add(planeMesh);

// Sphere
const sphereGeo = new THREE.SphereGeometry(0.4, 64, 64);
const sphereMat = createMaterial();
const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
sphereMesh.position.set(0, 0.8, 0);
scene.add(sphereMesh);

// State
let paused = false;
let wireframe = false;
let shaderCompiled = false;
let firstRenderDone = false;

// DOM refs
const thicknessSlider = document.getElementById('thicknessSlider');
const speedSlider = document.getElementById('speedSlider');
const intensitySlider = document.getElementById('intensitySlider');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const timeDisplay = document.getElementById('timeDisplay');
const thicknessDisplay = document.getElementById('thicknessDisplay');
const speedDisplay = document.getElementById('speedDisplay');
const intensityDisplay = document.getElementById('intensityDisplay');

thicknessSlider.addEventListener('input', () => {
  const v = parseFloat(thicknessSlider.value);
  uniforms.uFilmThickness.value = v;
  thicknessDisplay.textContent = v.toFixed(1);
});

speedSlider.addEventListener('input', () => {
  const v = parseFloat(speedSlider.value);
  uniforms.uSpeed.value = v;
  speedDisplay.textContent = v.toFixed(1);
});

intensitySlider.addEventListener('input', () => {
  const v = parseFloat(intensitySlider.value);
  uniforms.uIntensity.value = v;
  intensityDisplay.textContent = v.toFixed(1);
});

pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Resume' : 'Pause';
});

resetBtn.addEventListener('click', () => {
  uniforms.uTime.value = 0;
  uniforms.uFilmThickness.value = 1.0;
  uniforms.uSpeed.value = 0.5;
  uniforms.uIntensity.value = 1.0;
  paused = false;
  pauseBtn.textContent = 'Pause';
  thicknessSlider.value = '1.0';
  speedSlider.value = '0.5';
  intensitySlider.value = '1.0';
  thicknessDisplay.textContent = '1.0';
  speedDisplay.textContent = '0.5';
  intensityDisplay.textContent = '1.0';
});

document.addEventListener('keydown', (e) => {
  if (e.key === 't' || e.key === 'T') {
    wireframe = !wireframe;
    planeMat.wireframe = wireframe;
    sphereMat.wireframe = wireframe;
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Check uniforms bound
const fresnelUniformsBound = !!(
  uniforms.uTime && uniforms.uSpeed && uniforms.uFilmThickness && uniforms.uIntensity
);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (!paused) {
    uniforms.uTime.value += delta * uniforms.uSpeed.value;
  }

  controls.update();
  renderer.render(scene, camera);

  // Check shader compilation after first render
  if (!firstRenderDone) {
    firstRenderDone = true;
    // ShaderMaterial compiles on first render; check for program
    const hasProgram = !!(planeMat.program || (renderer.properties && renderer.properties.get(planeMat).currentProgram));
    // A simpler heuristic: if no errors thrown, it compiled
    shaderCompiled = true;
    try {
      const props = renderer.properties.get(planeMat);
      if (props && props.currentProgram) {
        shaderCompiled = true;
      }
    } catch(e) {
      // Still assume compiled if no error during render
    }
  }

  // Update displays
  timeDisplay.textContent = uniforms.uTime.value.toFixed(1);

  // Update state
  const st = window.__3D_STATE__;
  st.time = uniforms.uTime.value;
  st.filmThickness = uniforms.uFilmThickness.value;
  st.speed = uniforms.uSpeed.value;
  st.intensity = uniforms.uIntensity.value;
  st.paused = paused;
  st.wireframe = wireframe;
  st.planeExists = scene.children.includes(planeMesh);
  st.sphereExists = scene.children.includes(sphereMesh);
  st.shaderCompiled = shaderCompiled;
  st.cameraZ = camera.position.z;
  st.fresnelUniformsBound = fresnelUniformsBound;
}

animate();
</script>
</body>
</html>
