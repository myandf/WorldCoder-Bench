<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Rope Bridge Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 10px; left: 10px;
    background: rgba(0,0,0,0.75); color: #0f0;
    padding: 14px 18px; border-radius: 8px;
    font-size: 13px; line-height: 1.7;
    border: 1px solid rgba(0,255,0,0.3);
    min-width: 220px; z-index: 100;
    pointer-events: none;
  }
  #hud div { margin: 2px 0; }
  #hud .label { color: #8f8; }
  #hud .value { color: #0f0; font-weight: bold; }
  #hud .warn { color: #ff0; }
  #hud .danger { color: #f44; }
  #instructions {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #aaa; padding: 8px 16px;
    border-radius: 6px; font-size: 11px; text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">
  <div><span class="label">Sag:</span> <span class="value" id="hudSag">0.00</span> <span class="label">m</span></div>
  <div><span class="label">Tension:</span> <span class="value" id="hudTension">0.00</span> <span class="label">N</span></div>
  <div><span class="label">Wind:</span> <span class="value" id="hudWind">OFF</span></div>
  <div><span class="label">Fish:</span> <span class="value" id="hudFish">HOVERING</span></div>
  <div><span class="label">State:</span> <span class="value" id="hudState">NOT SAVED</span></div>
  <div><span class="label">Cuts:</span> <span class="value" id="hudCuts">0</span></div>
</div>

<div id="instructions">
  [D] Drop Fish &nbsp; [R] Reset &nbsp; [W] Toggle Wind &nbsp; [Click] Cut Rope &nbsp; [S] Save State &nbsp; [L] Load State
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ─── CONFIG ──────────────────────────────────────────────
const CONFIG = {
  gravity: -9.81,
  damping: 0.98,
  constraintIterations: 8,
  ropeParticles: 20,
  anchorLeft: new THREE.Vector3(-8, 2, 0),
  anchorRight: new THREE.Vector3(8, 2, 0),
  segmentLength: 0.85,
  plankWidth: 0.8,
  plankHeight: 0.05,
  plankDepth: 1.0,
  fishMass: 3.0,
  windAmplitude: 2.0,
  windPeriod: 2.0,
  initialSag: 1.5,
  sphereRadius: 0.08,
};

// ─── GLOBALS ─────────────────────────────────────────────
let scene, camera, renderer, controls, clock;
let bottomRope = [], leftRail = [], rightRail = [];
let allParticles = [];
let constraints = [];
let planks = [];
let verticalConnectors = [];
let fishModel = null;
let fishState = 'hovering'; // 'hovering', 'falling', 'attached'
let fishAttachedNode = null;
let windActive = false;
let savedState = null;
let stateSaved = false;
let stateLoaded = false;
let cutCount = 0;
let simTime = 0;
let frameCount = 0;
let raycaster, mouse;
let pillarLeft, pillarRight;
let fishVelocity = new THREE.Vector3();
let plankMeshes = [];

// ─── STATE OBJECT ────────────────────────────────────────
window.__3D_STATE__ = {
  particleCount: 0,
  segments: 0,
  totalSegments: 0,
  maxSag: 0,
  totalTension: 0,
  fishState: 'hovering',
  fishY: 5,
  fishAttachedNode: null,
  windActive: false,
  windForce: 0,
  cutCount: 0,
  stateSaved: false,
  stateLoaded: false,
  anchorLeftY: 2,
  anchorRightY: 2,
  simTime: 0,
  dampingFactor: 0.98,
  gravityY: -9.81,
  frameCount: 0,
  fishMass: 3.0,
  constraintIterations: 8,
  lowestParticleY: 0,
};

// ─── PARTICLE CLASS ──────────────────────────────────────
class Particle {
  constructor(x, y, z, pinned = false) {
    this.position = new THREE.Vector3(x, y, z);
    this.previousPosition = new THREE.Vector3(x, y, z);
    this.acceleration = new THREE.Vector3(0, 0, 0);
    this.pinned = pinned;
    this.mass = 1.0;
    this.mesh = null;
    this.ropeIndex = -1;
    this.particleIndex = -1;
  }
}

// ─── CONSTRAINT CLASS ────────────────────────────────────
class Constraint {
  constructor(p1, p2, restLength) {
    this.p1 = p1;
    this.p2 = p2;
    this.restLength = restLength;
    this.active = true;
  }
}

// ─── INIT ────────────────────────────────────────────────
function init() {
  clock = new THREE.Clock();
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#1a1a2e');
  scene.fog = new THREE.Fog('#1a1a2e', 30, 60);

  // Camera
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 6, 14);
  camera.lookAt(0, 1, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 1, 0);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 50;
  dirLight.shadow.camera.left = -15;
  dirLight.shadow.camera.right = 15;
  dirLight.shadow.camera.top = 10;
  dirLight.shadow.camera.bottom = -5;
  scene.add(dirLight);

  const hemiLight = new THREE.HemisphereLight(0x8888ff, 0x444422, 0.3);
  scene.add(hemiLight);

  // Ground
  createGround();

  // Pillars
  createPillars();

  // Ropes
  createRopes();

  // Planks
  createPlanks();

  // Vertical connectors
  createVerticalConnectors();

  // Fish
  loadFish();

  // Events
  window.addEventListener('resize', onResize);
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('click', onClick);

  animate();
}

// ─── GROUND ──────────────────────────────────────────────
function createGround() {
  const groundGeo = new THREE.PlaneGeometry(60, 60);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x2a2a3e,
    roughness: 0.9,
    metalness: 0.1,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid
  const gridHelper = new THREE.GridHelper(60, 60, 0x3a3a5e, 0x2a2a4e);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);
}

// ─── PILLARS ─────────────────────────────────────────────
function createPillars() {
  const pillarGeo = new THREE.BoxGeometry(1, 4, 1);
  const pillarMat = new THREE.MeshStandardMaterial({
    color: 0x666677,
    roughness: 0.85,
    metalness: 0.15,
  });

  pillarLeft = new THREE.Mesh(pillarGeo, pillarMat);
  pillarLeft.position.copy(CONFIG.anchorLeft);
  pillarLeft.castShadow = true;
  pillarLeft.receiveShadow = true;
  scene.add(pillarLeft);

  pillarRight = new THREE.Mesh(pillarGeo, pillarMat);
  pillarRight.position.copy(CONFIG.anchorRight);
  pillarRight.castShadow = true;
  pillarRight.receiveShadow = true;
  scene.add(pillarRight);

  // Pillar caps
  const capGeo = new THREE.BoxGeometry(1.3, 0.3, 1.3);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x777788, roughness: 0.7 });

  const capL = new THREE.Mesh(capGeo, capMat);
  capL.position.set(CONFIG.anchorLeft.x, CONFIG.anchorLeft.y + 2.15, CONFIG.anchorLeft.z);
  capL.castShadow = true;
  scene.add(capL);

  const capR = new THREE.Mesh(capGeo, capMat);
  capR.position.set(CONFIG.anchorRight.x, CONFIG.anchorRight.y + 2.15, CONFIG.anchorRight.z);
  capR.castShadow = true;
  scene.add(capR);
}

// ─── CREATE CATENARY SHAPE ───────────────────────────────
function createCatenaryPoints(start, end, numPoints, sag, zOffset) {
  const points = [];
  const span = end.x - start.x;
  for (let i = 0; i < numPoints; i++) {
    const t = i / (numPoints - 1);
    const x = start.x + t * span;
    const y = start.y - sag * 4 * t * (1 - t);
    const z = zOffset;
    points.push(new THREE.Vector3(x, y, z));
  }
  return points;
}

// ─── CREATE ROPES ────────────────────────────────────────
function createRopes() {
  const numParticles = CONFIG.ropeParticles;
  const sag = CONFIG.initialSag;

  // Bottom rope
  const bottomPoints = createCatenaryPoints(CONFIG.anchorLeft, CONFIG.anchorRight, numParticles, sag, 0);
  for (let i = 0; i < numParticles; i++) {
    const p = new Particle(bottomPoints[i].x, bottomPoints[i].y, bottomPoints[i].z, i === 0 || i === numParticles - 1);
    p.ropeIndex = 0;
    p.particleIndex = i;
    bottomRope.push(p);
    allParticles.push(p);
  }

  // Left rail
  const leftPoints = createCatenaryPoints(CONFIG.anchorLeft, CONFIG.anchorRight, numParticles, sag, -0.4);
  for (let i = 0; i < numParticles; i++) {
    const p = new Particle(leftPoints[i].x, leftPoints[i].y, leftPoints[i].z, i === 0 || i === numParticles - 1);
    p.ropeIndex = 1;
    p.particleIndex = i;
    leftRail.push(p);
    allParticles.push(p);
  }

  // Right rail
  const rightPoints = createCatenaryPoints(CONFIG.anchorLeft, CONFIG.anchorRight, numParticles, sag, 0.4);
  for (let i = 0; i < numParticles; i++) {
    const p = new Particle(rightPoints[i].x, rightPoints[i].y, rightPoints[i].z, i === 0 || i === numParticles - 1);
    p.ropeIndex = 2;
    p.particleIndex = i;
    rightRail.push(p);
    allParticles.push(p);
  }

  // Create constraints for each rope
  function addRopeConstraints(rope) {
    for (let i = 0; i < rope.length - 1; i++) {
      const dist = rope[i].position.distanceTo(rope[i + 1].position);
      constraints.push(new Constraint(rope[i], rope[i + 1], dist));
    }
  }

  addRopeConstraints(bottomRope);
  addRopeConstraints(leftRail);
  addRopeConstraints(rightRail);

  // Visualize rope particles
  const sphereGeo = new THREE.SphereGeometry(CONFIG.sphereRadius, 8, 6);
  const ropeMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.9 });

  allParticles.forEach(p => {
    const mesh = new THREE.Mesh(sphereGeo, ropeMat);
    mesh.position.copy(p.position);
    mesh.castShadow = true;
    mesh.userData.particle = p;
    scene.add(mesh);
    p.mesh = mesh;
  });

  // Visualize constraints as lines
  updateRopeVisuals();
}

// ─── UPDATE ROPE VISUALS ─────────────────────────────────
let ropeLineSegments = null;

function updateRopeVisuals() {
  if (ropeLineSegments) {
    scene.remove(ropeLineSegments);
    ropeLineSegments.geometry.dispose();
    ropeLineSegments.material.dispose();
  }

  const points = [];
  const activeConstraints = constraints.filter(c => c.active);

  activeConstraints.forEach(c => {
    points.push(c.p1.position.x, c.p1.position.y, c.p1.position.z);
    points.push(c.p2.position.x, c.p2.position.y, c.p2.position.z);
  });

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  const mat = new THREE.LineBasicMaterial({ color: 0x6B5340, linewidth: 1 });
  ropeLineSegments = new THREE.LineSegments(geo, mat);
  scene.add(ropeLineSegments);
}

// ─── CREATE PLANKS ───────────────────────────────────────
function createPlanks() {
  const plankGeo = new THREE.BoxGeometry(CONFIG.plankWidth, CONFIG.plankHeight, CONFIG.plankDepth);
  const plankMat = new THREE.MeshStandardMaterial({
    color: 0x8B6914,
    roughness: 0.8,
    metalness: 0.05,
  });

  for (let i = 0; i < bottomRope.length - 1; i++) {
    const p1 = bottomRope[i];
    const p2 = bottomRope[i + 1];
    const midX = (p1.position.x + p2.position.x) / 2;
    const midY = (p1.position.y + p2.position.y) / 2 - 0.05;
    const midZ = (p1.position.z + p2.position.z) / 2;

    const plank = new THREE.Mesh(plankGeo, plankMat);
    plank.position.set(midX, midY, midZ);
    plank.castShadow = true;
    plank.receiveShadow = true;
    plank.userData.plankIndex = i;
    scene.add(plank);
    planks.push(plank);
    plankMeshes.push(plank);
  }
}

// ─── CREATE VERTICAL CONNECTORS ──────────────────────────
function createVerticalConnectors() {
  const connectorMat = new THREE.LineBasicMaterial({ color: 0x6B5340 });

  for (let i = 0; i < bottomRope.length; i += 4) {
    // Left connector
    const leftGeo = new THREE.BufferGeometry().setFromPoints([
      bottomRope[i].position,
      leftRail[i].position
    ]);
    const leftLine = new THREE.Line(leftGeo, connectorMat);
    scene.add(leftLine);
    verticalConnectors.push({ line: leftLine, type: 'left', index: i });

    // Right connector
    const rightGeo = new THREE.BufferGeometry().setFromPoints([
      bottomRope[i].position,
      rightRail[i].position
    ]);
    const rightLine = new THREE.Line(rightGeo, connectorMat);
    scene.add(rightLine);
    verticalConnectors.push({ line: rightLine, type: 'right', index: i });
  }
}

function updateVerticalConnectors() {
  verticalConnectors.forEach(vc => {
    const bottomP = bottomRope[vc.index];
    const railP = vc.type === 'left' ? leftRail[vc.index] : rightRail[vc.index];
    const positions = vc.line.geometry.attributes.position.array;
    positions[0] = bottomP.position.x;
    positions[1] = bottomP.position.y;
    positions[2] = bottomP.position.z;
    positions[3] = railP.position.x;
    positions[4] = railP.position.y;
    positions[5] = railP.position.z;
    vc.line.geometry.attributes.position.needsUpdate = true;
  });
}

// ─── LOAD FISH ───────────────────────────────────────────
function loadFish() {
  const loader = new GLTFLoader();
  loader.load(
    'BarramundiFish.glb',
    (gltf) => {
      fishModel = gltf.scene;
      fishModel.scale.set(0.8, 0.8, 0.8);
      fishModel.position.set(0, 5, 0);
      fishModel.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(fishModel);
    },
    undefined,
    () => {
      // Fallback: create a simple fish shape
      createFallbackFish();
    }
  );
}

function createFallbackFish() {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.SphereGeometry(0.35, 12, 8);
  bodyGeo.scale(1.8, 0.6, 0.5);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x4488aa,
    roughness: 0.4,
    metalness: 0.3,
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  group.add(body);

  // Tail
  const tailGeo = new THREE.ConeGeometry(0.2, 0.4, 4);
  tailGeo.rotateZ(Math.PI / 2);
  const tailMat = new THREE.MeshStandardMaterial({ color: 0x336688, roughness: 0.5 });
  const tail = new THREE.Mesh(tailGeo, tailMat);
  tail.position.x = -0.6;
  tail.castShadow = true;
  group.add(tail);

  // Dorsal fin
  const finGeo = new THREE.ConeGeometry(0.12, 0.25, 3);
  const finMat = new THREE.MeshStandardMaterial({ color: 0x5599bb, roughness: 0.5 });
  const fin = new THREE.Mesh(finGeo, finMat);
  fin.position.set(0, 0.25, 0);
  fin.castShadow = true;
  group.add(fin);

  group.position.set(0, 5, 0);
  fishModel = group;
  scene.add(fishModel);
}

// ─── PHYSICS: VERLET INTEGRATION ─────────────────────────
function simulatePhysics(dt) {
  if (dt > 0.05) dt = 0.05; // Cap delta time

  // Apply gravity and wind
  allParticles.forEach(p => {
    if (p.pinned) return;

    // Gravity
    p.acceleration.set(0, CONFIG.gravity, 0);

    // Wind
    if (windActive) {
      const windForce = CONFIG.windAmplitude * Math.sin((simTime * Math.PI * 2) / CONFIG.windPeriod);
      p.acceleration.z += windForce;
      window.__3D_STATE__.windForce = windForce;
    }

    // Fish attachment force
    if (fishState === 'attached' && fishAttachedNode !== null) {
      const attachedParticle = bottomRope[fishAttachedNode];
      if (p === attachedParticle) {
        p.acceleration.y -= CONFIG.fishMass * 9.81 / p.mass;
      } else if (fishAttachedNode > 0 && p === bottomRope[fishAttachedNode - 1]) {
        p.acceleration.y -= (CONFIG.fishMass * 0.5 * 9.81) / p.mass;
      } else if (fishAttachedNode < bottomRope.length - 1 && p === bottomRope[fishAttachedNode + 1]) {
        p.acceleration.y -= (CONFIG.fishMass * 0.5 * 9.81) / p.mass;
      }
    }
  });

  // Verlet integration
  allParticles.forEach(p => {
    if (p.pinned) return;

    const velX = (p.position.x - p.previousPosition.x) * CONFIG.damping;
    const velY = (p.position.y - p.previousPosition.y) * CONFIG.damping;
    const velZ = (p.position.z - p.previousPosition.z) * CONFIG.damping;

    p.previousPosition.copy(p.position);

    p.position.x += velX + p.acceleration.x * dt * dt;
    p.position.y += velY + p.acceleration.y * dt * dt;
    p.position.z += velZ + p.acceleration.z * dt * dt;

    // Ground collision
    if (p.position.y < 0.1) {
      p.position.y = 0.1;
      p.previousPosition.y = p.position.y;
    }
  });

  // Solve constraints
  let totalTension = 0;
  for (let iter = 0; iter < CONFIG.constraintIterations; iter++) {
    constraints.forEach(c => {
      if (!c.active) return;

      const delta = new THREE.Vector3().subVectors(c.p2.position, c.p1.position);
      const currentLength = delta.length();
      if (currentLength < 0.0001) return;

      const stretch = currentLength - c.restLength;
      totalTension += Math.abs(stretch);

      const correction = delta.multiplyScalar(stretch / currentLength * 0.5);

      if (!c.p1.pinned) {
        c.p1.position.add(correction);
      }
      if (!c.p2.pinned) {
        c.p2.position.sub(correction);
      }
    });
  }

  // Update fish physics
  updateFishPhysics(dt);

  // Update visuals
  updateVisuals();

  // Update state
  updateState(totalTension);
}

// ─── UPDATE FISH PHYSICS ─────────────────────────────────
function updateFishPhysics(dt) {
  if (!fishModel) return;

  if (fishState === 'hovering') {
    fishModel.position.set(0, 5, 0);
    fishVelocity.set(0, 0, 0);
  } else if (fishState === 'falling') {
    fishVelocity.y += CONFIG.gravity * dt;
    fishModel.position.y += fishVelocity.y * dt;

    // Check collision with planks
    for (let i = 0; i < planks.length; i++) {
      const plank = planks[i];
      const dx = Math.abs(fishModel.position.x - plank.position.x);
      const dz = Math.abs(fishModel.position.z - plank.position.z);
      const dy = fishModel.position.y - plank.position.y;

      if (dx < 0.6 && dz < 0.6 && dy < 0.3 && dy > -0.1) {
        // Fish landed on plank
        fishState = 'attached';
        fishAttachedNode = i;
        fishModel.position.y = plank.position.y + 0.2;
        fishVelocity.set(0, 0, 0);
        break;
      }
    }

    // Ground fallback
    if (fishModel.position.y < 0.3) {
      fishModel.position.y = 0.3;
      fishVelocity.set(0, 0, 0);
      fishState = 'attached';
      fishAttachedNode = Math.floor(bottomRope.length / 2);
    }
  } else if (fishState === 'attached' && fishAttachedNode !== null) {
    const node = bottomRope[fishAttachedNode];
    fishModel.position.x = node.position.x;
    fishModel.position.y = node.position.y + 0.25;
    fishModel.position.z = node.position.z;
  }
}

// ─── UPDATE VISUALS ──────────────────────────────────────
function updateVisuals() {
  // Update particle meshes
  allParticles.forEach(p => {
    if (p.mesh) {
      p.mesh.position.copy(p.position);
    }
  });

  // Update rope lines
  updateRopeVisuals();

  // Update planks
  for (let i = 0; i < planks.length; i++) {
    const p1 = bottomRope[i];
    const p2 = bottomRope[i + 1];
    const plank = planks[i];
    plank.position.x = (p1.position.x + p2.position.x) / 2;
    plank.position.y = (p1.position.y + p2.position.y) / 2 - 0.05;
    plank.position.z = (p1.position.z + p2.position.z) / 2;

    // Rotate plank to match rope angle
    const dir = new THREE.Vector3().subVectors(p2.position, p1.position);
    const angle = Math.atan2(dir.z, dir.x);
    plank.rotation.y = -angle;
    plank.rotation.z = Math.atan2(dir.y, Math.sqrt(dir.x * dir.x + dir.z * dir.z));
  }

  // Update vertical connectors
  updateVerticalConnectors();
}

// ─── UPDATE STATE ────────────────────────────────────────
function updateState(totalTension) {
  let lowestY = Infinity;
  bottomRope.forEach(p => {
    if (p.position.y < lowestY) lowestY = p.position.y;
  });

  const anchorY = CONFIG.anchorLeft.y;
  const maxSag = Math.max(0, anchorY - lowestY);

  const activeConstraints = constraints.filter(c => c.active).length;

  window.__3D_STATE__.particleCount = allParticles.length;
  window.__3D_STATE__.segments = activeConstraints;
  window.__3D_STATE__.totalSegments = constraints.length;
  window.__3D_STATE__.maxSag = maxSag;
  window.__3D_STATE__.totalTension = totalTension;
  window.__3D_STATE__.fishState = fishState;
  window.__3D_STATE__.fishY = fishModel ? fishModel.position.y : 5;
  window.__3D_STATE__.fishAttachedNode = fishAttachedNode;
  window.__3D_STATE__.windActive = windActive;
  window.__3D_STATE__.cutCount = cutCount;
  window.__3D_STATE__.stateSaved = stateSaved;
  window.__3D_STATE__.stateLoaded = stateLoaded;
  window.__3D_STATE__.anchorLeftY = CONFIG.anchorLeft.y;
  window.__3D_STATE__.anchorRightY = CONFIG.anchorRight.y;
  window.__3D_STATE__.simTime = simTime;
  window.__3D_STATE__.dampingFactor = CONFIG.damping;
  window.__3D_STATE__.gravityY = CONFIG.gravity;
  window.__3D_STATE__.frameCount = frameCount;
  window.__3D_STATE__.fishMass = CONFIG.fishMass;
  window.__3D_STATE__.constraintIterations = CONFIG.constraintIterations;
  window.__3D_STATE__.lowestParticleY = lowestY;

  // Reset stateLoaded after one frame
  if (stateLoaded) {
    setTimeout(() => { stateLoaded = false; }, 0);
  }

  // Update HUD
  document.getElementById('hudSag').textContent = maxSag.toFixed(2);
  document.getElementById('hudTension').textContent = totalTension.toFixed(2);
  document.getElementById('hudWind').textContent = windActive ? 'ON' : 'OFF';
  document.getElementById('hudWind').className = windActive ? 'value warn' : 'value';
  document.getElementById('hudFish').textContent = fishState.toUpperCase();
  document.getElementById('hudFish').className = fishState === 'attached' ? 'value warn' : 'value';
  document.getElementById('hudState').textContent = stateSaved ? 'SAVED' : 'NOT SAVED';
  document.getElementById('hudState').className = stateSaved ? 'value' : 'value danger';
  document.getElementById('hudCuts').textContent = cutCount;
}

// ─── SAVE / LOAD STATE ───────────────────────────────────
function saveState() {
  savedState = {
    particles: allParticles.map(p => ({
      x: p.position.x, y: p.position.y, z: p.position.z,
      px: p.previousPosition.x, py: p.previousPosition.y, pz: p.previousPosition.z,
      pinned: p.pinned,
    })),
    constraints: constraints.map(c => ({
      active: c.active,
      restLength: c.restLength,
    })),
    fishState: fishState,
    fishAttachedNode: fishAttachedNode,
    fishPosition: fishModel ? { x: fishModel.position.x, y: fishModel.position.y, z: fishModel.position.z } : null,
    windActive: windActive,
    cutCount: cutCount,
    simTime: simTime,
  };
  stateSaved = true;
}

function loadState() {
  if (!savedState) return;

  // Restore particles
  savedState.particles.forEach((sp, i) => {
    if (i < allParticles.length) {
      allParticles[i].position.set(sp.x, sp.y, sp.z);
      allParticles[i].previousPosition.set(sp.px, sp.py, sp.pz);
    }
  });

  // Restore constraints
  savedState.constraints.forEach((sc, i) => {
    if (i < constraints.length) {
      constraints[i].active = sc.active;
      constraints[i].restLength = sc.restLength;
    }
  });

  // Restore fish
  fishState = savedState.fishState;
  fishAttachedNode = savedState.fishAttachedNode;
  if (savedState.fishPosition && fishModel) {
    fishModel.position.set(savedState.fishPosition.x, savedState.fishPosition.y, savedState.fishPosition.z);
  }
  windActive = savedState.windActive;
  cutCount = savedState.cutCount;
  simTime = savedState.simTime;

  stateLoaded = true;
}

// ─── CUT ROPE ────────────────────────────────────────────
function cutRopeAtPoint(point) {
  let closestParticle = null;
  let closestDist = Infinity;

  allParticles.forEach(p => {
    const dist = p.position.distanceTo(point);
    if (dist < closestDist) {
      closestDist = dist;
      closestParticle = p;
    }
  });

  if (closestDist > 1.0) return; // Too far from any particle

  // Remove constraints connected to this particle
  let cutsMade = 0;
  constraints.forEach(c => {
    if (!c.active) return;
    if (c.p1 === closestParticle || c.p2 === closestParticle) {
      c.active = false;
      cutsMade++;
    }
  });

  if (cutsMade > 0) {
    cutCount++;
    // Unpin the particle if it was pinned (except the actual anchors)
    if (closestParticle.pinned) {
      const isAnchor = (
        (closestParticle === bottomRope[0] || closestParticle === leftRail[0] || closestParticle === rightRail[0]) ||
        (closestParticle === bottomRope[bottomRope.length - 1] || closestParticle === leftRail[leftRail.length - 1] || closestParticle === rightRail[rightRail.length - 1])
      );
      if (!isAnchor) {
        closestParticle.pinned = false;
      }
    }
  }
}

// ─── EVENT HANDLERS ──────────────────────────────────────
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onKeyDown(e) {
  const key = e.key.toLowerCase();

  switch (key) {
    case 'd':
      if (fishState === 'hovering') {
        fishState = 'falling';
        fishVelocity.set(0, 0, 0);
      }
      break;

    case 'r':
      fishState = 'hovering';
      fishAttachedNode = null;
      fishVelocity.set(0, 0, 0);
      if (fishModel) fishModel.position.set(0, 5, 0);
      break;

    case 'w':
      windActive = !windActive;
      break;

    case 's':
      saveState();
      break;

    case 'l':
      loadState();
      break;
  }
}

function onClick(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  // Raycast against particle meshes
  const particleMeshes = allParticles.map(p => p.mesh).filter(m => m);
  const intersects = raycaster.intersectObjects(particleMeshes);

  if (intersects.length > 0) {
    const hitPoint = intersects[0].point;
    cutRopeAtPoint(hitPoint);
  }
}

// ─── ANIMATION LOOP ──────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  simTime += dt;
  frameCount++;

  simulatePhysics(dt);
  controls.update();

  renderer.render(scene, camera);
}

// ─── START ───────────────────────────────────────────────
init();
</script>
