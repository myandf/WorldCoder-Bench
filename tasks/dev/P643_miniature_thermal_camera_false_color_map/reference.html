<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Camera Diorama</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border: 1px solid #555;
            border-radius: 5px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .hud-item { margin-bottom: 5px; }
        .hud-label { color: #aaa; }
        .hud-value { font-weight: bold; color: #0f0; }
        #controls-help {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        #legend-container {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
        }
        #colorbar {
            width: 20px;
            height: 200px;
            border: 1px solid #fff;
            margin: 10px 0;
        }
        .legend-label {
            font-size: 12px;
            font-weight: bold;
        }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="hud">
        <div class="hud-item"><span class="hud-label">Palette:</span> <span id="hud-palette" class="hud-value">ironbow</span></div>
        <div class="hud-item"><span class="hud-label">Range:</span> <span id="hud-range" class="hud-value">0°C - 100°C</span></div>
        <div class="hud-item"><span class="hud-label">Lamp:</span> <span id="hud-lamp" class="hud-value">ON</span></div>
        <div class="hud-item"><span class="hud-label">Hottest:</span> <span id="hud-hottest" class="hud-value">Car (85.0°C)</span></div>
        <div class="hud-item"><span class="hud-label">Zoom:</span> <span id="hud-zoom" class="hud-value">10.0</span></div>
        
        <div id="controls-help">
            [C] Cycle Palette<br>
            [L] Toggle Lamp<br>
            [+/-] Max Range<br>
            [[/]] Min Range<br>
            [R] Reset<br>
            Click Person to heat<br>
            Scroll to zoom
        </div>
    </div>

    <div id="legend-container">
        <div id="legend-max" class="legend-label">100°C</div>
        <div id="colorbar"></div>
        <div id="legend-min" class="legend-label">0°C</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // --- STATE MANAGEMENT ---
        const state = {
            paletteIndex: 0,
            paletteName: 'ironbow',
            minRange: 0,
            maxRange: 100,
            lampOn: true,
            lampTemp: 60,
            carTemp: 85,
            personTemp: 37,
            houseTemp: 22,
            treeTemp: 18,
            groundTemp: 15,
            hottestObject: 'Car',
            hottestTemp: 85,
            zoomLevel: 10,
            personClicked: false,
            objectCount: 5,
            frameCount: 0,
            elapsedTime: 0,
            paletteNames: ['ironbow', 'rainbow', 'whiteHot', 'blackHot', 'arctic']
        };
        window.__3D_STATE__ = state;

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Camera
        const aspect = window.innerWidth / window.innerHeight;
        let frustumSize = 10;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2, frustumSize * aspect / 2,
            frustumSize / 2, frustumSize / -2,
            1, 1000
        );
        camera.position.set(10, 10, 10); // 45-degree angle looking down
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Lighting (Added to scene as requested, though thermal shader uses custom shading)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // --- THERMAL MATERIALS ---
        const globalUniforms = {
            uMinRange: { value: state.minRange },
            uMaxRange: { value: state.maxRange }
        };

        const thermalVertexShader = `
            varying vec3 vNormal;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const thermalFragmentShader = `
            varying vec3 vNormal;
            uniform float uTemp;
            uniform float uMinRange;
            uniform float uMaxRange;
            void main() {
                // Normalize temperature
                float tempNorm = clamp((uTemp - uMinRange) / (uMaxRange - uMinRange), 0.0, 1.0);
                
                // Simple directional lighting for 3D definition
                vec3 lightDir = normalize(vec3(1.0, 1.0, 0.5));
                float diff = max(dot(vNormal, lightDir), 0.0);
                float light = 0.3 + diff * 0.7; // ambient + diffuse
                
                // Output temp to Red, light to Green
                gl_FragColor = vec4(tempNorm, light, 0.0, 1.0);
            }
        `;

        function createThermalMaterial(temp) {
            return new THREE.ShaderMaterial({
                vertexShader: thermalVertexShader,
                fragmentShader: thermalFragmentShader,
                uniforms: {
                    uTemp: { value: temp },
                    uMinRange: globalUniforms.uMinRange,
                    uMaxRange: globalUniforms.uMaxRange
                }
            });
        }

        // --- DIORAMA OBJECTS ---
        const logicalObjects = [];

        // 0. Ground Plane
        const groundGeo = new THREE.BoxGeometry(10, 0.1, 10);
        const groundMat = createThermalMaterial(state.groundTemp);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.set(0, -0.05, 0);
        scene.add(ground);
        logicalObjects.push({ name: 'Ground', getTemp: () => state.groundTemp });

        // 1. House
        const houseGeo = new THREE.BoxGeometry(2, 1.5, 2);
        const houseMat = createThermalMaterial(state.houseTemp);
        const house = new THREE.Mesh(houseGeo, houseMat);
        house.position.set(-2, 0.75, -1);
        scene.add(house);
        logicalObjects.push({ name: 'House', getTemp: () => state.houseTemp });

        // 2. Car
        const carGeo = new THREE.BoxGeometry(1.5, 0.6, 0.8);
        const carMat = createThermalMaterial(state.carTemp);
        const car = new THREE.Mesh(carGeo, carMat);
        car.position.set(1, 0.3, 1);
        scene.add(car);
        logicalObjects.push({ name: 'Car', getTemp: () => state.carTemp });

        // 3. Tree
        const treeGroup = new THREE.Group();
        const treeMat = createThermalMaterial(state.treeTemp);
        const trunkGeo = new THREE.CylinderGeometry(0.1, 0.1, 1);
        const trunk = new THREE.Mesh(trunkGeo, treeMat);
        trunk.position.set(0, 0.5, 0);
        const leavesGeo = new THREE.ConeGeometry(0.8, 1.5);
        const leaves = new THREE.Mesh(leavesGeo, treeMat);
        leaves.position.set(0, 1.5, 0);
        treeGroup.add(trunk);
        treeGroup.add(leaves);
        treeGroup.position.set(-3, 0, 2);
        scene.add(treeGroup);
        logicalObjects.push({ name: 'Tree', getTemp: () => state.treeTemp });

        // 4. Person
        const personGeo = new THREE.CapsuleGeometry(0.15, 0.5); // total height 0.8
        const personMat = createThermalMaterial(state.personTemp);
        const person = new THREE.Mesh(personGeo, personMat);
        person.position.set(2, 0.4, -2);
        scene.add(person);
        logicalObjects.push({ name: 'Person', getTemp: () => state.personTemp });

        // 5. Street Lamp
        const lampGroup = new THREE.Group();
        const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 2);
        const poleMat = createThermalMaterial(25); // Pole constant 25
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(0, 1, 0);
        const bulbGeo = new THREE.SphereGeometry(0.2);
        const bulbMat = createThermalMaterial(state.lampTemp);
        const bulb = new THREE.Mesh(bulbGeo, bulbMat);
        bulb.position.set(0, 2, 0);
        lampGroup.add(pole);
        lampGroup.add(bulb);
        lampGroup.position.set(0, 0, 0);
        scene.add(lampGroup);
        logicalObjects.push({ name: 'Lamp', getTemp: () => state.lampTemp });

        // --- POST-PROCESSING ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const thermalPostShader = {
            uniforms: {
                tDiffuse: { value: null },
                uPalette: { value: state.paletteIndex }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform int uPalette;
                varying vec2 vUv;

                vec3 ironbow(float t) {
                    if (t < 0.2) return mix(vec3(0.0, 0.0, 0.0), vec3(0.0, 0.0, 1.0), t / 0.2);
                    if (t < 0.4) return mix(vec3(0.0, 0.0, 1.0), vec3(1.0, 0.0, 1.0), (t - 0.2) / 0.2);
                    if (t < 0.6) return mix(vec3(1.0, 0.0, 1.0), vec3(1.0, 0.65, 0.0), (t - 0.4) / 0.2);
                    if (t < 0.8) return mix(vec3(1.0, 0.65, 0.0), vec3(1.0, 1.0, 0.0), (t - 0.6) / 0.2);
                    return mix(vec3(1.0, 1.0, 0.0), vec3(1.0, 1.0, 1.0), (t - 0.8) / 0.2);
                }

                vec3 rainbow(float t) {
                    if (t < 0.25) return mix(vec3(0.0, 0.0, 1.0), vec3(0.0, 1.0, 1.0), t / 0.25);
                    if (t < 0.5) return mix(vec3(0.0, 1.0, 1.0), vec3(0.0, 1.0, 0.0), (t - 0.25) / 0.25);
                    if (t < 0.75) return mix(vec3(0.0, 1.0, 0.0), vec3(1.0, 1.0, 0.0), (t - 0.5) / 0.25);
                    return mix(vec3(1.0, 1.0, 0.0), vec3(1.0, 0.0, 0.0), (t - 0.75) / 0.25);
                }

                vec3 arctic(float t) {
                    if (t < 0.25) return mix(vec3(0.0, 0.0, 0.5), vec3(0.0, 0.5, 1.0), t / 0.25);
                    if (t < 0.5) return mix(vec3(0.0, 0.5, 1.0), vec3(1.0, 1.0, 1.0), (t - 0.25) / 0.25);
                    if (t < 0.75) return mix(vec3(1.0, 1.0, 1.0), vec3(1.0, 1.0, 0.0), (t - 0.5) / 0.25);
                    return mix(vec3(1.0, 1.0, 0.0), vec3(1.0, 0.0, 0.0), (t - 0.75) / 0.25);
                }

                void main() {
                    vec4 texel = texture2D(tDiffuse, vUv);
                    float t = texel.r;
                    float light = texel.g;
                    vec3 color;

                    if (uPalette == 0) color = ironbow(t);
                    else if (uPalette == 1) color = rainbow(t);
                    else if (uPalette == 2) color = vec3(t);
                    else if (uPalette == 3) color = vec3(1.0 - t);
                    else if (uPalette == 4) color = arctic(t);

                    // Apply subtle shading to give 3D volume
                    color *= (0.4 + 0.6 * light);

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        };
        const thermalPass = new ShaderPass(thermalPostShader);
        composer.addPass(thermalPass);

        // --- INTERACTIONS ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObject(person);
            if (intersects.length > 0) {
                state.personTemp = Math.min(42, state.personTemp + 5);
                state.personClicked = true;
            }
        });

        window.addEventListener('wheel', (e) => {
            frustumSize += e.deltaY * 0.01;
            frustumSize = Math.max(4, Math.min(20, frustumSize));
            state.zoomLevel = frustumSize;
            updateCamera();
        });

        function updateCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            updateCamera();
        });

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'c') {
                state.paletteIndex = (state.paletteIndex + 1) % 5;
                state.paletteName = state.paletteNames[state.paletteIndex];
                thermalPass.uniforms.uPalette.value = state.paletteIndex;
                updateLegendUI();
            } else if (key === 'l') {
                state.lampOn = !state.lampOn;
                state.lampTemp = state.lampOn ? 60 : 15;
            } else if (key === '=' || key === '+') {
                state.maxRange = Math.min(200, state.maxRange + 10);
                globalUniforms.uMaxRange.value = state.maxRange;
            } else if (key === '-') {
                state.maxRange = Math.max(50, state.maxRange - 10);
                globalUniforms.uMaxRange.value = state.maxRange;
            } else if (key === ']') {
                state.minRange = Math.min(30, state.minRange + 5);
                globalUniforms.uMinRange.value = state.minRange;
            } else if (key === '[') {
                state.minRange = Math.max(-20, state.minRange - 5);
                globalUniforms.uMinRange.value = state.minRange;
            } else if (key === 'r') {
                // Reset
                state.paletteIndex = 0;
                state.paletteName = 'ironbow';
                thermalPass.uniforms.uPalette.value = 0;
                state.minRange = 0;
                state.maxRange = 100;
                globalUniforms.uMinRange.value = 0;
                globalUniforms.uMaxRange.value = 100;
                state.lampOn = true;
                state.lampTemp = 60;
                state.personTemp = 37;
                frustumSize = 10;
                state.zoomLevel = 10;
                updateCamera();
                updateLegendUI();
            }
        });

        // --- UI UPDATES ---
        const hudPalette = document.getElementById('hud-palette');
        const hudRange = document.getElementById('hud-range');
        const hudLamp = document.getElementById('hud-lamp');
        const hudHottest = document.getElementById('hud-hottest');
        const hudZoom = document.getElementById('hud-zoom');
        const colorbar = document.getElementById('colorbar');
        const legendMax = document.getElementById('legend-max');
        const legendMin = document.getElementById('legend-min');

        function updateLegendUI() {
            let gradient = '';
            switch(state.paletteIndex) {
                case 0: gradient = 'linear-gradient(to top, black 0%, blue 20%, magenta 40%, orange 60%, yellow 80%, white 100%)'; break;
                case 1: gradient = 'linear-gradient(to top, blue 0%, cyan 25%, green 50%, yellow 75%, red 100%)'; break;
                case 2: gradient = 'linear-gradient(to top, black, white)'; break;
                case 3: gradient = 'linear-gradient(to top, white, black)'; break;
                case 4: gradient = 'linear-gradient(to top, #000080 0%, #0080ff 25%, white 50%, yellow 75%, red 100%)'; break;
            }
            colorbar.style.background = gradient;
        }
        updateLegendUI();

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            state.elapsedTime = clock.getElapsedTime();
            state.frameCount++;

            // 1. Update dynamic temperatures
            // Car oscillates 70-100 over 4s
            state.carTemp = 85 + 15 * Math.sin(state.elapsedTime * 2 * Math.PI / 4);
            
            // Person cools down
            if (state.personTemp > 37) {
                state.personTemp = Math.max(37, state.personTemp - delta * 1.0);
            }

            // 2. Apply temperatures to materials
            carMat.uniforms.uTemp.value = state.carTemp;
            personMat.uniforms.uTemp.value = state.personTemp;
            bulbMat.uniforms.uTemp.value = state.lampTemp;

            // 3. Find hottest object
            let maxT = -Infinity;
            let maxName = '';
            for (const obj of logicalObjects) {
                const t = obj.getTemp();
                if (t > maxT) {
                    maxT = t;
                    maxName = obj.name;
                }
            }
            state.hottestObject = maxName;
            state.hottestTemp = maxT;

            // 4. Update HUD DOM
            hudPalette.innerText = state.paletteName;
            hudRange.innerText = `${state.minRange}°C - ${state.maxRange}°C`;
            hudLamp.innerText = state.lampOn ? 'ON' : 'OFF';
            hudLamp.style.color = state.lampOn ? '#0f0' : '#f00';
            hudHottest.innerText = `${state.hottestObject} (${state.hottestTemp.toFixed(1)}°C)`;
            hudZoom.innerText = state.zoomLevel.toFixed(1);
            legendMax.innerText = `${state.maxRange}°C`;
            legendMin.innerText = `${state.minRange}°C`;

            // 5. Render
            composer.render();
        }

        animate();
    </script>
</body>
</html>
