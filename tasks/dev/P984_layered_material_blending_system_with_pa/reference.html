<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layered Material Blending System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a0a; font-family: monospace; }
canvas { display: block; }
#buttons {
  position: absolute;
  top: 10px;
  left: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}
#buttons button {
  background: #1a1a1a;
  color: #ccc;
  border: 2px solid #333;
  padding: 8px 16px;
  cursor: pointer;
  font-family: monospace;
  font-size: 14px;
  border-radius: 4px;
  transition: border-color 0.2s;
}
#buttons button.active {
  border-color: #00ff88;
  color: #fff;
}
#hud {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.7);
  color: #aaa;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.6;
  border-radius: 4px;
  z-index: 10;
  min-width: 260px;
}
#hud span { color: #00ff88; }
</style>
</head>
<body>

<div id="buttons">
  <button id="btn0" class="active" onclick="toggleLayer(0)">Layer 0</button>
  <button id="btn1" onclick="toggleLayer(1)">Layer 1</button>
  <button id="btn2" onclick="toggleLayer(2)">Layer 2</button>
  <button id="btn3" onclick="toggleLayer(3)">Layer 3</button>
</div>

<div id="hud">
  Active Layers: <span id="hudActive">1</span><br>
  Dominant Layer: <span id="hudDominant">0</span><br>
  Avg Roughness: <span id="hudRoughness">0.80</span><br>
  Speed Multiplier: <span id="hudSpeed">0.44</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const layers = [
  { color: [1.0, 0.2, 0.1], roughness: 0.8, metalness: 0.1, opacity: 1.0 },
  { color: [0.8, 0.8, 0.9], roughness: 0.2, metalness: 0.9, opacity: 0.0 },
  { color: [0.1, 0.9, 0.3], roughness: 0.5, metalness: 0.0, opacity: 0.0 },
  { color: [0.3, 0.3, 1.0], roughness: 0.1, metalness: 0.7, opacity: 0.0 }
];

const initialLayers = layers.map(l => ({ ...l, color: [...l.color] }));

let particlesVisible = true;
let resetCount = 0;
let frameCount = 0;

window.__3D_STATE__ = {};

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 5, 5);
scene.add(dirLight);

// Sphere shader
const vertexShader = `
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  void main() {
    vNormal = normalize(normalMatrix * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const fragmentShader = `
  uniform vec3 layerColors[4];
  uniform float layerRoughness[4];
  uniform float layerMetalness[4];
  uniform float layerOpacity[4];
  uniform vec3 lightDir;
  uniform vec3 camPos;

  varying vec3 vNormal;
  varying vec3 vWorldPos;

  void main() {
    // Alpha composite layers 3 down to 0
    vec3 blended = vec3(0.0);
    float blendedRoughness = 0.5;
    float blendedMetalness = 0.0;
    float accumAlpha = 0.0;

    for (int i = 3; i >= 0; i--) {
      float a = layerOpacity[i];
      if (a > 0.0) {
        blended = mix(blended, layerColors[i], a);
        blendedRoughness = mix(blendedRoughness, layerRoughness[i], a);
        blendedMetalness = mix(blendedMetalness, layerMetalness[i], a);
        accumAlpha = accumAlpha + a * (1.0 - accumAlpha);
      }
    }

    if (accumAlpha < 0.001) {
      blended = vec3(0.1);
      blendedRoughness = 0.5;
    }

    // Simple PBR-ish lighting
    vec3 N = normalize(vNormal);
    vec3 L = normalize(lightDir);
    vec3 V = normalize(camPos - vWorldPos);
    vec3 H = normalize(L + V);

    float NdotL = max(dot(N, L), 0.0);
    float NdotH = max(dot(N, H), 0.0);

    float specPow = mix(256.0, 4.0, blendedRoughness);
    float spec = pow(NdotH, specPow);

    vec3 ambient = blended * 0.15;
    vec3 diffuse = blended * NdotL * (1.0 - blendedMetalness * 0.5);
    vec3 specColor = mix(vec3(0.04), blended, blendedMetalness) * spec * 2.0;

    vec3 finalColor = ambient + diffuse + specColor;
    gl_FragColor = vec4(finalColor, 1.0);
  }
`;

const sphereMaterial = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: {
    layerColors: { value: layers.map(l => new THREE.Vector3(...l.color)) },
    layerRoughness: { value: layers.map(l => l.roughness) },
    layerMetalness: { value: layers.map(l => l.metalness) },
    layerOpacity: { value: layers.map(l => l.opacity) },
    lightDir: { value: new THREE.Vector3(5, 5, 5).normalize() },
    camPos: { value: camera.position.clone() }
  }
});

const sphereGeom = new THREE.SphereGeometry(1.2, 64, 64);
const sphere = new THREE.Mesh(sphereGeom, sphereMaterial);
scene.add(sphere);

// Particles
const PARTICLE_COUNT = 1500;
const particleGeom = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);
const particleSpeeds = new Float32Array(PARTICLE_COUNT);
const particleTheta = new Float32Array(PARTICLE_COUNT);
const particlePhi = new Float32Array(PARTICLE_COUNT);
const particleRadius = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const r = 1.5 + Math.random() * 1.0;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);

  particleRadius[i] = r;
  particleTheta[i] = theta;
  particlePhi[i] = phi;
  particleSpeeds[i] = 0.3 + Math.random() * 0.7;

  positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  positions[i * 3 + 1] = r * Math.cos(phi);
  positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

  colors[i * 3] = layers[0].color[0];
  colors[i * 3 + 1] = layers[0].color[1];
  colors[i * 3 + 2] = layers[0].color[2];
}

particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.03,
  vertexColors: true,
  transparent: true,
  opacity: 0.8,
  sizeAttenuation: true
});

const particles = new THREE.Points(particleGeom, particleMat);
scene.add(particles);

// Helpers
function getActiveLayerCount() {
  return layers.filter(l => l.opacity > 0).length;
}

function getDominantLayerIndex() {
  let maxOp = -1, idx = 0;
  for (let i = 0; i < 4; i++) {
    if (layers[i].opacity > maxOp) {
      maxOp = layers[i].opacity;
      idx = i;
    }
  }
  return idx;
}

function getAverageRoughness() {
  const active = layers.filter(l => l.opacity > 0);
  if (active.length === 0) return 0;
  return active.reduce((s, l) => s + l.roughness, 0) / active.length;
}

function getBlendedColor() {
  let r = 0, g = 0, b = 0;
  for (let i = 3; i >= 0; i--) {
    const a = layers[i].opacity;
    if (a > 0) {
      r = r * (1 - a) + layers[i].color[0] * a;
      g = g * (1 - a) + layers[i].color[1] * a;
      b = b * (1 - a) + layers[i].color[2] * a;
    }
  }
  return [r, g, b];
}

function getEditTargetLayerIndex() {
  for (let i = 3; i >= 0; i--) {
    if (layers[i].opacity > 0) return i;
  }
  return -1;
}

function updateButtons() {
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById('btn' + i);
    if (layers[i].opacity > 0) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }
}

function updateShaderUniforms() {
  sphereMaterial.uniforms.layerColors.value = layers.map(l => new THREE.Vector3(...l.color));
  sphereMaterial.uniforms.layerRoughness.value = layers.map(l => l.roughness);
  sphereMaterial.uniforms.layerMetalness.value = layers.map(l => l.metalness);
  sphereMaterial.uniforms.layerOpacity.value = layers.map(l => l.opacity);
}

function updateHUD() {
  document.getElementById('hudActive').textContent = getActiveLayerCount();
  document.getElementById('hudDominant').textContent = getDominantLayerIndex();
  document.getElementById('hudRoughness').textContent = getAverageRoughness().toFixed(2);
  document.getElementById('hudSpeed').textContent = (1.0 - getAverageRoughness() * 0.7).toFixed(2);
}

// Interactions
window.toggleLayer = function(idx) {
  layers[idx].opacity = layers[idx].opacity > 0 ? 0.0 : 1.0;
  updateButtons();
  updateShaderUniforms();
  updateHUD();
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    for (let i = 0; i < 4; i++) {
      layers[i].color = [...initialLayers[i].color];
      layers[i].roughness = initialLayers[i].roughness;
      layers[i].metalness = initialLayers[i].metalness;
      layers[i].opacity = initialLayers[i].opacity;
    }
    // Reset particle colors to layer 0
    const colAttr = particleGeom.attributes.color;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      colAttr.array[i * 3] = layers[0].color[0];
      colAttr.array[i * 3 + 1] = layers[0].color[1];
      colAttr.array[i * 3 + 2] = layers[0].color[2];
    }
    colAttr.needsUpdate = true;
    resetCount++;
    updateButtons();
    updateShaderUniforms();
    updateHUD();
  } else if (e.key === 'p' || e.key === 'P') {
    particlesVisible = !particlesVisible;
    particles.visible = particlesVisible;
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const idx = getEditTargetLayerIndex();
    if (idx >= 0) {
      layers[idx].roughness = Math.min(1.0, layers[idx].roughness + 0.1);
      layers[idx].roughness = Math.round(layers[idx].roughness * 100) / 100;
      updateShaderUniforms();
      updateHUD();
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    const idx = getEditTargetLayerIndex();
    if (idx >= 0) {
      layers[idx].roughness = Math.max(0.0, layers[idx].roughness - 0.1);
      layers[idx].roughness = Math.round(layers[idx].roughness * 100) / 100;
      updateShaderUniforms();
      updateHUD();
    }
  }
});

// Animation
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // Sphere gentle rotation
  sphere.rotation.y += dt * 0.2;

  // Particle update
  const avgRoughness = getAverageRoughness();
  const speedMult = 1.0 - avgRoughness * 0.7;
  const dominantIdx = getDominantLayerIndex();
  const domColor = layers[dominantIdx].color;

  const posAttr = particleGeom.attributes.position;
  const colAttr = particleGeom.attributes.color;
  let totalDist = 0;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    // Orbit around Y
    particleTheta[i] += particleSpeeds[i] * 0.5 * speedMult * dt;

    const r = particleRadius[i];
    const phi = particlePhi[i];
    const theta = particleTheta[i];

    posAttr.array[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    posAttr.array[i * 3 + 1] = r * Math.cos(phi);
    posAttr.array[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const dx = posAttr.array[i * 3];
    const dy = posAttr.array[i * 3 + 1];
    const dz = posAttr.array[i * 3 + 2];
    totalDist += Math.sqrt(dx * dx + dy * dy + dz * dz);

    // Lerp color toward dominant
    colAttr.array[i * 3] += (domColor[0] - colAttr.array[i * 3]) * 0.05;
    colAttr.array[i * 3 + 1] += (domColor[1] - colAttr.array[i * 3 + 1]) * 0.05;
    colAttr.array[i * 3 + 2] += (domColor[2] - colAttr.array[i * 3 + 2]) * 0.05;
  }

  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;

  const avgDist = totalDist / PARTICLE_COUNT;
  const blended = getBlendedColor();

  frameCount++;

  window.__3D_STATE__ = {
    layers: layers.map(l => ({
      color: [...l.color],
      roughness: l.roughness,
      metalness: l.metalness,
      opacity: l.opacity
    })),
    activeLayerCount: getActiveLayerCount(),
    dominantLayerIndex: dominantIdx,
    averageRoughness: avgRoughness,
    particleSpeedMultiplier: speedMult,
    particlesVisible: particlesVisible,
    particleCount: PARTICLE_COUNT,
    avgParticleDistance: avgDist,
    blendedColor: blended,
    editTargetLayerIndex: getEditTargetLayerIndex(),
    frameCount: frameCount,
    sphereRadius: 1.2,
    resetCount: resetCount
  };

  updateHUD();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
