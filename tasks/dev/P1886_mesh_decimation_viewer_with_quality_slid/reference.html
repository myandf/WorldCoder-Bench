<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesh Decimation Viewer</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: rgba(18, 18, 30, 0.78);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.75);
      --accent: #4fc3f7;
      --accent-2: #ff8a65;
      --button: rgba(255, 255, 255, 0.08);
      --button-hover: rgba(255, 255, 255, 0.16);
      --button-active: rgba(79, 195, 247, 0.32);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    canvas {
      display: block;
    }

    #info-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 320px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    #info-panel h1 {
      margin: 0 0 12px 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .row {
      margin-bottom: 12px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--muted);
    }

    #quality-value {
      color: var(--accent);
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--button);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    button.active {
      background: var(--button-active);
      border-color: rgba(79,195,247,0.6);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    label.checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    #stats-display {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-line;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="info-panel">
    <h1>Mesh Decimation Viewer</h1>

    <div class="row">
      <div class="label-row">
        <span>Quality</span>
        <span id="quality-value">1.00</span>
      </div>
      <input id="quality-slider" type="range" min="0.05" max="1.0" step="0.05" value="1.0" />
    </div>

    <div class="button-row">
      <button id="btn-solid" class="active">Solid</button>
      <button id="btn-wireframe">Wireframe</button>
      <button id="btn-points">Points</button>
    </div>

    <div class="controls-row">
      <label class="checkbox">
        <input id="auto-rotate-toggle" type="checkbox" checked />
        <span>Auto-Rotate</span>
      </label>
      <button id="btn-reset">Reset</button>
    </div>

    <div id="stats-display"></div>

    <div class="hint">
      Keys: ↑/↓ quality, 1/2/3 modes, R auto-rotate
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    const qualitySlider = document.getElementById('quality-slider');
    const qualityValue = document.getElementById('quality-value');
    const statsDisplay = document.getElementById('stats-display');
    const btnSolid = document.getElementById('btn-solid');
    const btnWireframe = document.getElementById('btn-wireframe');
    const btnPoints = document.getElementById('btn-points');
    const autoRotateToggle = document.getElementById('auto-rotate-toggle');
    const btnReset = document.getElementById('btn-reset');

    const originalGeometry = new THREE.TorusKnotGeometry(1, 0.35, 200, 32).toNonIndexed();
    originalGeometry.computeVertexNormals();
    originalGeometry.computeBoundingBox();

    const bbox = originalGeometry.boundingBox.clone();
    const size = new THREE.Vector3();
    bbox.getSize(size);
    const maxBBoxDim = Math.max(size.x, size.y, size.z);

    const originalFaces = originalGeometry.attributes.position.count / 3;

    const solidMaterial = new THREE.MeshStandardMaterial({
      color: '#4fc3f7',
      metalness: 0.3,
      roughness: 0.4,
      wireframe: false
    });

    const wireframeMaterial = new THREE.MeshStandardMaterial({
      color: '#4fc3f7',
      metalness: 0.3,
      roughness: 0.4,
      wireframe: true
    });

    const pointsMaterial = new THREE.PointsMaterial({
      color: '#ff8a65',
      size: 0.02
    });

    let currentObject = null;
    let currentGeometry = null;
    let currentMode = 'solid';
    let lastDecimationTime = 0;
    let lastCellSize = 0;
    let currentFaces = originalFaces;
    let currentVertices = originalGeometry.attributes.position.count;
    let meshVisible = true;

    function cloneOriginalGeometry() {
      const g = originalGeometry.clone();
      g.computeVertexNormals();
      return g;
    }

    function decimateGeometryByClustering(sourceGeometry, quality) {
      const start = performance.now();

      if (quality >= 0.999) {
        const geom = cloneOriginalGeometry();
        const end = performance.now();
        return {
          geometry: geom,
          faces: geom.attributes.position.count / 3,
          vertices: geom.attributes.position.count,
          cellSize: maxBBoxDim * (1.05 - quality) * 0.5,
          time: end - start
        };
      }

      const positionAttr = sourceGeometry.attributes.position;
      const positions = positionAttr.array;
      const cellSize = maxBBoxDim * (1.05 - quality) * 0.5;
      const min = sourceGeometry.boundingBox.min;

      const clusterMap = new Map();
      const vertexCluster = new Array(positionAttr.count);

      for (let i = 0; i < positionAttr.count; i++) {
        const x = positions[i * 3];
        const y = positions[i * 3 + 1];
        const z = positions[i * 3 + 2];

        const gx = Math.floor((x - min.x) / cellSize);
        const gy = Math.floor((y - min.y) / cellSize);
        const gz = Math.floor((z - min.z) / cellSize);
        const key = `${gx},${gy},${gz}`;

        let cluster = clusterMap.get(key);
        if (!cluster) {
          cluster = {
            sumX: 0,
            sumY: 0,
            sumZ: 0,
            count: 0,
            index: -1
          };
          clusterMap.set(key, cluster);
        }

        cluster.sumX += x;
        cluster.sumY += y;
        cluster.sumZ += z;
        cluster.count += 1;
        vertexCluster[i] = cluster;
      }

      const newPositions = [];
      let clusterIndex = 0;
      for (const cluster of clusterMap.values()) {
        cluster.index = clusterIndex++;
        newPositions.push(
          cluster.sumX / cluster.count,
          cluster.sumY / cluster.count,
          cluster.sumZ / cluster.count
        );
      }

      const newTriangles = [];
      const triangleCount = positionAttr.count / 3;

      for (let t = 0; t < triangleCount; t++) {
        const i0 = t * 3;
        const i1 = t * 3 + 1;
        const i2 = t * 3 + 2;

        const c0 = vertexCluster[i0].index;
        const c1 = vertexCluster[i1].index;
        const c2 = vertexCluster[i2].index;

        if (c0 === c1 || c1 === c2 || c0 === c2) continue;

        const ax = newPositions[c0 * 3], ay = newPositions[c0 * 3 + 1], az = newPositions[c0 * 3 + 2];
        const bx = newPositions[c1 * 3], by = newPositions[c1 * 3 + 1], bz = newPositions[c1 * 3 + 2];
        const cx = newPositions[c2 * 3], cy = newPositions[c2 * 3 + 1], cz = newPositions[c2 * 3 + 2];

        const abx = bx - ax, aby = by - ay, abz = bz - az;
        const acx = cx - ax, acy = cy - ay, acz = cz - az;
        const crossX = aby * acz - abz * acy;
        const crossY = abz * acx - abx * acz;
        const crossZ = abx * acy - aby * acx;
        const areaSq = crossX * crossX + crossY * crossY + crossZ * crossZ;

        if (areaSq < 1e-12) continue;

        newTriangles.push(c0, c1, c2);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(newPositions, 3));
      geometry.setIndex(newTriangles);
      geometry.computeVertexNormals();
      geometry.computeBoundingBox();
      geometry.computeBoundingSphere();

      const end = performance.now();

      return {
        geometry,
        faces: newTriangles.length / 3,
        vertices: newPositions.length / 3,
        cellSize,
        time: end - start
      };
    }

    function disposeCurrentObject() {
      if (currentObject) {
        scene.remove(currentObject);
      }
      if (currentGeometry) {
        currentGeometry.dispose();
      }
      currentObject = null;
      currentGeometry = null;
    }

    function buildRenderable(geometry, mode) {
      if (mode === 'points') {
        return new THREE.Points(geometry, pointsMaterial);
      }
      if (mode === 'wireframe') {
        return new THREE.Mesh(geometry, wireframeMaterial);
      }
      return new THREE.Mesh(geometry, solidMaterial);
    }

    function setActiveButton(mode) {
      btnSolid.classList.toggle('active', mode === 'solid');
      btnWireframe.classList.toggle('active', mode === 'wireframe');
      btnPoints.classList.toggle('active', mode === 'points');
    }

    function updateStatsUI(quality) {
      const reductionPercent = ((originalFaces - currentFaces) / originalFaces) * 100;
      qualityValue.textContent = Number(quality).toFixed(2);
      statsDisplay.textContent =
`Original Faces: ${originalFaces}
Current Faces: ${currentFaces}
Reduction: ${reductionPercent.toFixed(1)}%
Vertices: ${currentVertices}`;
    }

    function applyDecimationAndRenderObject() {
      const q = parseFloat(qualitySlider.value);
      const result = decimateGeometryByClustering(originalGeometry, q);

      const prevRotation = currentObject ? currentObject.rotation.y : 0;

      disposeCurrentObject();

      currentGeometry = result.geometry;
      currentFaces = result.faces;
      currentVertices = result.vertices;
      lastCellSize = result.cellSize;
      lastDecimationTime = result.time;

      currentObject = buildRenderable(currentGeometry, currentMode);
      currentObject.rotation.y = prevRotation;
      scene.add(currentObject);

      meshVisible = currentObject.visible !== false;

      updateStatsUI(q);
      setActiveButton(currentMode);
    }

    function setRenderMode(mode) {
      if (!['solid', 'wireframe', 'points'].includes(mode)) return;
      currentMode = mode;
      applyDecimationAndRenderObject();
    }

    function clampQuality(value) {
      return Math.min(1.0, Math.max(0.05, Math.round(value * 20) / 20));
    }

    function setQuality(value) {
      const q = clampQuality(value);
      qualitySlider.value = q.toFixed(2);
      applyDecimationAndRenderObject();
    }

    function resetAll() {
      currentMode = 'solid';
      autoRotateToggle.checked = true;
      qualitySlider.value = '1.00';
      applyDecimationAndRenderObject();
    }

    btnSolid.addEventListener('click', () => setRenderMode('solid'));
    btnWireframe.addEventListener('click', () => setRenderMode('wireframe'));
    btnPoints.addEventListener('click', () => setRenderMode('points'));

    qualitySlider.addEventListener('input', () => {
      applyDecimationAndRenderObject();
    });

    btnReset.addEventListener('click', () => resetAll());

    window.addEventListener('keydown', (event) => {
      const key = event.key;

      if (key === 'ArrowUp') {
        event.preventDefault();
        setQuality(parseFloat(qualitySlider.value) + 0.05);
      } else if (key === 'ArrowDown') {
        event.preventDefault();
        setQuality(parseFloat(qualitySlider.value) - 0.05);
      } else if (key === '1') {
        setRenderMode('solid');
      } else if (key === '2') {
        setRenderMode('wireframe');
      } else if (key === '3') {
        setRenderMode('points');
      } else if (key === 'r' || key === 'R') {
        autoRotateToggle.checked = !autoRotateToggle.checked;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.__3D_STATE__ = {
      quality: 1,
      originalFaces,
      currentFaces: originalFaces,
      currentVertices: originalGeometry.attributes.position.count,
      reductionPercent: 0,
      renderMode: 'solid',
      autoRotate: true,
      meshRotationY: 0,
      cameraDistance: camera.position.length(),
      cellSize: maxBBoxDim * (1.05 - 1.0) * 0.5,
      meshVisible: true,
      decimationTime: 0,
      boundingBoxMax: maxBBoxDim
    };

    applyDecimationAndRenderObject();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (currentObject && autoRotateToggle.checked) {
        currentObject.rotation.y += 0.5 * delta;
      }

      controls.update();
      renderer.render(scene, camera);

      const quality = parseFloat(qualitySlider.value);
      const reductionPercent = Number((((originalFaces - currentFaces) / originalFaces) * 100).toFixed(1));

      window.__3D_STATE__ = {
        quality,
        originalFaces,
        currentFaces,
        currentVertices,
        reductionPercent,
        renderMode: currentMode,
        autoRotate: autoRotateToggle.checked,
        meshRotationY: currentObject ? currentObject.rotation.y : 0,
        cameraDistance: camera.position.distanceTo(new THREE.Vector3(0, 0, 0)),
        cellSize: lastCellSize,
        meshVisible: !!(currentObject && currentObject.visible),
        decimationTime: Number(lastDecimationTime.toFixed(3)),
        boundingBoxMax: maxBBoxDim
      };
    }

    animate();
  </script>
</body>
</html>
