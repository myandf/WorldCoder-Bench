<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Paint Visualizer</title>
  <style>
    :root {
      --bg1: #1a1a2e;
      --bg2: #16213e;
      --panel: rgba(12, 16, 28, 0.78);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f2f4f8;
      --muted: #b8c0d0;
      --accent: #58a6ff;
      --active: #7dd3fc;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    body {
      position: relative;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .ui-panel {
      position: absolute;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      z-index: 10;
    }

    #hud-panel {
      top: 18px;
      left: 18px;
      min-width: 250px;
      padding: 14px 16px;
    }

    #hud-panel .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--active);
    }

    #hud-panel .row {
      font-size: 14px;
      line-height: 1.5;
      margin: 4px 0;
      color: var(--text);
    }

    #finish-panel {
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 140px;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.1);
    }

    .btn.active {
      border-color: var(--active);
      background: rgba(125, 211, 252, 0.18);
      color: #eaf8ff;
    }

    #utility-panel {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    #color-palette {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 40px);
    }

    .color-swatch {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 3px solid rgba(255,255,255,0.25);
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 4px 14px rgba(0,0,0,0.35);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }

    .color-swatch:hover {
      transform: scale(1.08);
    }

    .color-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(88,166,255,0.28), 0 6px 18px rgba(0,0,0,0.4);
    }

    .color-swatch::after {
      content: attr(data-color);
      position: absolute;
      left: 50%;
      bottom: 52px;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 11px;
      color: var(--text);
      background: rgba(0,0,0,0.7);
      padding: 5px 8px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .color-swatch:hover::after {
      opacity: 1;
    }

    #congrats-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 18, 0.55);
      z-index: 20;
      pointer-events: none;
    }

    #congrats-overlay.show {
      display: flex;
    }

    #congrats-overlay .message {
      padding: 22px 28px;
      border-radius: 18px;
      background: rgba(16, 22, 38, 0.88);
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .hidden-ui {
      display: none !important;
    }

    @media (max-width: 768px) {
      #hud-panel {
        min-width: 210px;
      }
      #finish-panel {
        top: auto;
        right: 10px;
        bottom: 90px;
        transform: none;
      }
      #color-palette {
        gap: 10px;
        padding: 10px;
      }
      .color-swatch {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud-panel" class="ui-panel">
      <div class="title">Paint Visualizer</div>
      <div class="row" id="paint-name-display">Paint: Midnight Black</div>
      <div class="row" id="finish-display">Finish: glossy</div>
      <div class="row" id="score-display">Score: 0 / 18</div>
      <div class="row" id="combos-display">Combos: 0 / 18</div>
    </div>

    <div id="finish-panel" class="ui-panel">
      <button class="btn" id="btn-matte">Matte</button>
      <button class="btn active" id="btn-glossy">Glossy</button>
      <button class="btn" id="btn-metallic">Metallic</button>
    </div>

    <div id="utility-panel">
      <button class="btn" id="btn-reset">Reset</button>
      <button class="btn" id="btn-screenshot">Screenshot Mode</button>
    </div>

    <div id="color-palette" aria-label="Color Palette"></div>

    <div id="congrats-overlay">
      <div class="message">All combinations discovered!</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    const PAINTS = [
      { name: 'Midnight Black', hex: '#0a0a0a', finish: 'glossy' },
      { name: 'Pearl White', hex: '#f0f0f0', finish: 'matte' },
      { name: 'Racing Red', hex: '#cc0000', finish: 'glossy' },
      { name: 'Ocean Blue', hex: '#0055aa', finish: 'metallic' },
      { name: 'Forest Green', hex: '#006633', finish: 'matte' },
      { name: 'Sunset Gold', hex: '#cc8800', finish: 'metallic' }
    ];

    const FINISH_PROPS = {
      matte: { roughness: 0.9, metalness: 0.0 },
      glossy: { roughness: 0.2, metalness: 0.3 },
      metallic: { roughness: 0.1, metalness: 0.9 }
    };

    const MAX_SCORE = 18;
    const DEFAULT_COLOR_NAME = 'Midnight Black';
    const DEFAULT_FINISH = 'glossy';

    const app = document.getElementById('app');
    const hudPanel = document.getElementById('hud-panel');
    const paintNameDisplay = document.getElementById('paint-name-display');
    const finishDisplay = document.getElementById('finish-display');
    const scoreDisplay = document.getElementById('score-display');
    const combosDisplay = document.getElementById('combos-display');
    const finishPanel = document.getElementById('finish-panel');
    const colorPalette = document.getElementById('color-palette');
    const congratsOverlay = document.getElementById('congrats-overlay');

    const btnMatte = document.getElementById('btn-matte');
    const btnGlossy = document.getElementById('btn-glossy');
    const btnMetallic = document.getElementById('btn-metallic');
    const btnReset = document.getElementById('btn-reset');
    const btnScreenshot = document.getElementById('btn-screenshot');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    app.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    const hemiLight = new THREE.HemisphereLight(0x8aa6ff, 0x111122, 0.55);
    scene.add(hemiLight);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(8, 64),
      new THREE.MeshStandardMaterial({
        color: 0x111827,
        roughness: 0.85,
        metalness: 0.08
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.1;
    scene.add(floor);

    const envCanvas = document.createElement('canvas');
    envCanvas.width = 64;
    envCanvas.height = 256;
    const envCtx = envCanvas.getContext('2d');
    const grad = envCtx.createLinearGradient(0, 0, 0, envCanvas.height);
    grad.addColorStop(0, '#2a2a44');
    grad.addColorStop(1, '#16213e');
    envCtx.fillStyle = grad;
    envCtx.fillRect(0, 0, envCanvas.width, envCanvas.height);
    const envTexture = new THREE.CanvasTexture(envCanvas);
    envTexture.mapping = THREE.EquirectangularReflectionMapping;
    envTexture.colorSpace = THREE.SRGBColorSpace;
    scene.environment = envTexture;

    let model = null;
    let mixer = null;
    let clock = new THREE.Clock();

    let currentColorName = DEFAULT_COLOR_NAME;
    let currentFinish = DEFAULT_FINISH;
    let currentHex = PAINTS.find(p => p.name === DEFAULT_COLOR_NAME).hex;
    let triedCombinations = new Set();
    let hudVisible = true;
    let screenshotMode = false;
    let isPointerDown = false;
    let animationPlaying = false;

    function createPalette() {
      colorPalette.innerHTML = '';
      PAINTS.forEach((paint) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.dataset.color = paint.name;
        swatch.title = paint.name;
        swatch.style.background = paint.hex;
        if (paint.name === currentColorName) swatch.classList.add('active');
        swatch.addEventListener('click', () => {
          setColor(paint.name);
        });
        colorPalette.appendChild(swatch);
      });
    }

    function updateSwatchActive() {
      [...document.querySelectorAll('.color-swatch')].forEach(el => {
        el.classList.toggle('active', el.dataset.color === currentColorName);
      });
    }

    function updateFinishButtons() {
      btnMatte.classList.toggle('active', currentFinish === 'matte');
      btnGlossy.classList.toggle('active', currentFinish === 'glossy');
      btnMetallic.classList.toggle('active', currentFinish === 'metallic');
    }

    function getCurrentPaintHex() {
      const found = PAINTS.find(p => p.name === currentColorName);
      return found ? found.hex : '#0a0a0a';
    }

    function ensureTrackedCombo() {
      const key = `${currentColorName}__${currentFinish}`;
      const before = triedCombinations.size;
      triedCombinations.add(key);
      if (triedCombinations.size !== before && triedCombinations.size === MAX_SCORE) {
        congratsOverlay.classList.add('show');
      } else if (triedCombinations.size < MAX_SCORE) {
        congratsOverlay.classList.remove('show');
      }
    }

    function updateHUD() {
      paintNameDisplay.textContent = `Paint: ${currentColorName}`;
      finishDisplay.textContent = `Finish: ${currentFinish}`;
      scoreDisplay.textContent = `Score: ${triedCombinations.size} / ${MAX_SCORE}`;
      combosDisplay.textContent = `Combos: ${triedCombinations.size} / ${MAX_SCORE}`;
    }

    function applyPaintToModel() {
      currentHex = getCurrentPaintHex();
      const props = FINISH_PROPS[currentFinish];

      if (model) {
        model.traverse((child) => {
          if (child.isMesh) {
            const oldMat = child.material;
            const newMat = new THREE.MeshStandardMaterial({
              color: new THREE.Color(currentHex),
              roughness: props.roughness,
              metalness: props.metalness,
              envMapIntensity: 1.2,
              skinning: !!child.isSkinnedMesh,
              morphTargets: !!child.morphTargetInfluences,
              morphNormals: !!child.morphTargetInfluences
            });

            if (oldMat && oldMat.map) newMat.map = oldMat.map;
            if (oldMat && oldMat.normalMap) newMat.normalMap = oldMat.normalMap;
            if (oldMat && oldMat.aoMap) newMat.aoMap = oldMat.aoMap;
            if (oldMat && oldMat.roughnessMap) newMat.roughnessMap = oldMat.roughnessMap;
            if (oldMat && oldMat.metalnessMap) newMat.metalnessMap = oldMat.metalnessMap;
            if (oldMat && oldMat.emissiveMap) newMat.emissiveMap = oldMat.emissiveMap;
            if (oldMat && oldMat.transparent) {
              newMat.transparent = oldMat.transparent;
              newMat.opacity = oldMat.opacity;
            }

            child.material = newMat;
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
      }

      ensureTrackedCombo();
      updateSwatchActive();
      updateFinishButtons();
      updateHUD();
    }

    function setColor(name) {
      currentColorName = name;
      currentHex = getCurrentPaintHex();
      applyPaintToModel();
    }

    function setFinish(finish) {
      if (!FINISH_PROPS[finish]) return;
      currentFinish = finish;
      applyPaintToModel();
    }

    function resetPaint() {
      currentColorName = DEFAULT_COLOR_NAME;
      currentFinish = DEFAULT_FINISH;
      currentHex = getCurrentPaintHex();
      applyPaintToModel();
    }

    function toggleHUD(forceValue = null) {
      hudVisible = forceValue === null ? !hudVisible : !!forceValue;
      const hidden = !hudVisible || screenshotMode;
      hudPanel.classList.toggle('hidden-ui', hidden);
      finishPanel.classList.toggle('hidden-ui', hidden);
      colorPalette.classList.toggle('hidden-ui', hidden);
      document.getElementById('utility-panel').classList.toggle('hidden-ui', hidden);
    }

    function toggleScreenshotMode() {
      screenshotMode = !screenshotMode;
      btnScreenshot.classList.toggle('active', screenshotMode);
      toggleHUD(hudVisible);
      congratsOverlay.style.display = screenshotMode ? 'none' : '';
      if (!screenshotMode && triedCombinations.size === MAX_SCORE) {
        congratsOverlay.classList.add('show');
      }
    }

    btnMatte.addEventListener('click', () => setFinish('matte'));
    btnGlossy.addEventListener('click', () => setFinish('glossy'));
    btnMetallic.addEventListener('click', () => setFinish('metallic'));
    btnReset.addEventListener('click', resetPaint);
    btnScreenshot.addEventListener('click', toggleScreenshotMode);

    renderer.domElement.addEventListener('pointerdown', () => {
      isPointerDown = true;
    });

    window.addEventListener('pointerup', () => {
      isPointerDown = false;
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key >= '1' && key <= '6') {
        const idx = parseInt(key, 10) - 1;
        if (PAINTS[idx]) setColor(PAINTS[idx].name);
      } else if (key === 'm') {
        setFinish('matte');
      } else if (key === 'g') {
        setFinish('glossy');
      } else if (key === 't') {
        setFinish('metallic');
      } else if (key === 'r') {
        resetPaint();
      } else if (key === 'h') {
        toggleHUD();
      }
    });

    const loader = new GLTFLoader();
    loader.load(
      'BoxAnimated.glb',
      (gltf) => {
        model = gltf.scene;
        model.position.set(0, 0, 0);

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        model.position.y += size.y * 0.15;

        scene.add(model);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.play();
          });
          animationPlaying = true;
        } else {
          animationPlaying = false;
        }

        applyPaintToModel();
      },
      undefined,
      (error) => {
        console.error('Failed to load BoxAnimated.glb:', error);
        const fallback = new THREE.Mesh(
          new THREE.BoxGeometry(2, 1.2, 1),
          new THREE.MeshStandardMaterial({
            color: currentHex,
            roughness: FINISH_PROPS[currentFinish].roughness,
            metalness: FINISH_PROPS[currentFinish].metalness
          })
        );
        model = new THREE.Group();
        model.add(fallback);
        model.position.set(0, 0, 0);
        scene.add(model);
        animationPlaying = false;
        applyPaintToModel();
      }
    );

    window.addEventListener('resize', onResize);
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    createPalette();
    updateFinishButtons();
    updateHUD();

    window.__3D_STATE__ = {
      modelLoaded: false,
      currentColor: currentColorName,
      currentFinish: currentFinish,
      currentHex: currentHex,
      roughness: FINISH_PROPS[currentFinish].roughness,
      metalness: FINISH_PROPS[currentFinish].metalness,
      score: 0,
      maxScore: MAX_SCORE,
      combinationsTried: 0,
      allDiscovered: false,
      hudVisible: hudVisible,
      screenshotMode: screenshotMode,
      animationPlaying: animationPlaying,
      modelRotationY: 0,
      autoRotating: true
    };

    function update3DState() {
      const props = FINISH_PROPS[currentFinish];
      window.__3D_STATE__.modelLoaded = !!model;
      window.__3D_STATE__.currentColor = currentColorName;
      window.__3D_STATE__.currentFinish = currentFinish;
      window.__3D_STATE__.currentHex = currentHex;
      window.__3D_STATE__.roughness = props.roughness;
      window.__3D_STATE__.metalness = props.metalness;
      window.__3D_STATE__.score = triedCombinations.size;
      window.__3D_STATE__.maxScore = MAX_SCORE;
      window.__3D_STATE__.combinationsTried = triedCombinations.size;
      window.__3D_STATE__.allDiscovered = triedCombinations.size === MAX_SCORE;
      window.__3D_STATE__.hudVisible = hudVisible && !screenshotMode;
      window.__3D_STATE__.screenshotMode = screenshotMode;
      window.__3D_STATE__.animationPlaying = animationPlaying;
      window.__3D_STATE__.modelRotationY = model ? model.rotation.y : 0;
      window.__3D_STATE__.autoRotating = !isPointerDown;
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (mixer) {
        mixer.update(delta);
      }

      if (model && !isPointerDown) {
        model.rotation.y += 0.005;
      }

      controls.update();
      update3DState();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
