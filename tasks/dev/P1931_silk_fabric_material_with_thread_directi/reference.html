<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silk Fabric Material Editor</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: rgba(10, 10, 18, 0.72);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f1f2f7;
      --muted: #aeb4cc;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
    }

    canvas {
      display: block;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      min-width: 220px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      pointer-events: none;
    }

    .hud .title {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .hud .line {
      font-size: 14px;
      line-height: 1.55;
      white-space: nowrap;
    }

    .hud .value {
      color: #ffffff;
      font-weight: 600;
    }

    .controls-panel {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 11;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .preset-box,
    .help-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .preset-box {
      padding: 12px;
    }

    .preset-title,
    .help-title {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      text-align: right;
    }

    .preset-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 220px;
    }

    .preset-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer;
      outline: none;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      box-shadow: inset 0 1px 6px rgba(255,255,255,0.08), 0 4px 10px rgba(0,0,0,0.25);
    }

    .preset-btn:hover {
      transform: scale(1.08);
      border-color: rgba(255,255,255,0.45);
    }

    .preset-btn.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.18), inset 0 1px 6px rgba(255,255,255,0.12), 0 4px 10px rgba(0,0,0,0.25);
      transform: scale(1.06);
    }

    .help-box {
      padding: 10px 12px;
      max-width: 280px;
    }

    .help-box .line {
      font-size: 12px;
      line-height: 1.5;
      color: #d7dbef;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">
    <div class="title">Silk Material HUD</div>
    <div class="line">Warp Angle: <span class="value" id="hud-warp">0°</span></div>
    <div class="line">Thread Density: <span class="value" id="hud-density">40</span></div>
    <div class="line">Sheen: <span class="value" id="hud-sheen">0.7</span></div>
    <div class="line">Drape: <span class="value" id="hud-drape">off</span></div>
    <div class="line">Preset: <span class="value" id="hud-preset">Crimson</span></div>
    <div class="line">Light Mode: <span class="value" id="hud-light">standard</span></div>
  </div>

  <div class="controls-panel">
    <div class="preset-box">
      <div class="preset-title">Color Presets</div>
      <div class="preset-buttons" id="preset-buttons"></div>
    </div>
    <div class="help-box">
      <div class="help-title">Keys</div>
      <div class="line">R rotate warp +15°</div>
      <div class="line">T cycle thread density</div>
      <div class="line">S cycle sheen</div>
      <div class="line">D toggle drape</div>
      <div class="line">L toggle light mode</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const WIDTH_SEGMENTS = 128;
    const HEIGHT_SEGMENTS = 96;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2;
    controls.maxDistance = 10;
    controls.update();

    const directionalLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
    directionalLight.position.set(3, 5, 2);
    scene.add(directionalLight);

    const fillLight = new THREE.DirectionalLight(0xc8d8ff, 0.6);
    fillLight.position.set(-3, 2, -1);
    scene.add(fillLight);

    const ambientLight = new THREE.AmbientLight(0x404060, 0.3);
    scene.add(ambientLight);

    const PRESETS = {
      Crimson: {
        base: [0.6, 0.15, 0.2],
        warp: [0.8, 0.2, 0.25],
        weft: [0.55, 0.12, 0.18],
        swatch: '#9e2333'
      },
      Gold: {
        base: [0.7, 0.55, 0.1],
        warp: [0.85, 0.7, 0.15],
        weft: [0.6, 0.45, 0.08],
        swatch: '#c9a62a'
      },
      Sapphire: {
        base: [0.1, 0.15, 0.55],
        warp: [0.15, 0.2, 0.7],
        weft: [0.08, 0.12, 0.5],
        swatch: '#2c46b8'
      },
      Ivory: {
        base: [0.85, 0.82, 0.75],
        warp: [0.92, 0.9, 0.85],
        weft: [0.78, 0.75, 0.68],
        swatch: '#e7dfcf'
      }
    };

    const state = {
      warpAngle: 0,
      threadDensity: 40,
      sheen: 0.7,
      drapeActive: false,
      drapeAmount: 0,
      colorPreset: 'Crimson',
      lightMode: 'standard',
      drapeTween: {
        active: false,
        startTime: 0,
        from: 0,
        to: 0,
        duration: 500
      },
      frameCount: 0
    };

    function deg(rad) {
      return (rad * 180 / Math.PI + 360) % 360;
    }

    function rad(degValue) {
      return degValue * Math.PI / 180;
    }

    function getWeftAngle() {
      return (state.warpAngle + Math.PI * 0.5) % (Math.PI * 2);
    }

    function colorArrayToColor(arr) {
      return new THREE.Color(arr[0], arr[1], arr[2]);
    }

    const initialPreset = PRESETS[state.colorPreset];

    const uniforms = {
      uTime: { value: 0 },
      uWarpAngle: { value: state.warpAngle },
      uWeftAngle: { value: getWeftAngle() },
      uThreadDensity: { value: state.threadDensity },
      uSheen: { value: state.sheen },
      uBaseColor: { value: colorArrayToColor(initialPreset.base) },
      uWarpColor: { value: colorArrayToColor(initialPreset.warp) },
      uWeftColor: { value: colorArrayToColor(initialPreset.weft) },
      uDrapeAmount: { value: state.drapeAmount },

      uDirLightDir: { value: new THREE.Vector3() },
      uDirLightColor: { value: new THREE.Color(directionalLight.color) },
      uDirLightIntensity: { value: directionalLight.intensity },

      uFillLightDir: { value: new THREE.Vector3() },
      uFillLightColor: { value: new THREE.Color(fillLight.color) },
      uFillLightIntensity: { value: fillLight.intensity },

      uAmbientColor: { value: new THREE.Color(ambientLight.color) },
      uAmbientIntensity: { value: ambientLight.intensity }
    };

    const vertexShader = /* glsl */`
      uniform float uTime;
      uniform float uDrapeAmount;

      varying vec2 vUv;
      varying vec3 vWorldPos;

      void main() {
        vUv = uv;

        vec3 pos = position;

        float waveA = sin(pos.x * 2.25 + uTime * 0.75);
        float waveB = sin(pos.y * 4.0 + pos.x * 1.3 + uTime * 0.55);
        float waveC = cos((uv.x - 0.5) * 6.28318) * 0.5 + 0.5;

        float drape = (waveA * 0.11 + waveB * 0.06 + waveC * -0.07) * uDrapeAmount;
        pos.z += drape;

        vec4 worldPos = modelMatrix * vec4(pos, 1.0);
        vWorldPos = worldPos.xyz;

        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const fragmentShader = /* glsl */`
      precision highp float;

      uniform float uTime;
      uniform float uWarpAngle;
      uniform float uWeftAngle;
      uniform float uThreadDensity;
      uniform float uSheen;
      uniform vec3 uBaseColor;
      uniform vec3 uWarpColor;
      uniform vec3 uWeftColor;

      uniform vec3 uDirLightDir;
      uniform vec3 uDirLightColor;
      uniform float uDirLightIntensity;

      uniform vec3 uFillLightDir;
      uniform vec3 uFillLightColor;
      uniform float uFillLightIntensity;

      uniform vec3 uAmbientColor;
      uniform float uAmbientIntensity;

      varying vec2 vUv;
      varying vec3 vWorldPos;

      float stripeProfile(float x) {
        float f = abs(fract(x) - 0.5) * 2.0;
        return 1.0 - smoothstep(0.46, 0.98, f);
      }

      float ridgeProfile(float x) {
        float f = abs(fract(x) - 0.5) * 2.0;
        return 1.0 - f;
      }

      float anisoSpec(vec3 T, vec3 H, float power) {
        float d = abs(dot(T, H));
        float lobe = pow(max(0.0, 1.0 - d), power);
        return lobe;
      }

      vec3 lightContribution(
        vec3 N,
        vec3 V,
        vec3 L,
        vec3 lightColor,
        float intensity,
        vec3 baseCol,
        vec3 warpTangent,
        vec3 weftTangent,
        float warpMask,
        float weftMask,
        float warpOver,
        float warpRidge,
        float weftRidge,
        float shimmer
      ) {
        float NdotL = max(dot(N, L), 0.0);
        vec3 H = normalize(L + V);

        float warpSpec = anisoSpec(warpTangent, H, 18.0) * (0.65 + 0.35 * warpRidge) * warpMask;
        float weftSpec = anisoSpec(weftTangent, H, 18.0) * (0.65 + 0.35 * weftRidge) * weftMask;

        float spec = (mix(weftSpec, warpSpec, warpOver) * 1.08 + (warpSpec + weftSpec) * 0.18) * uSheen * shimmer;
        vec3 diffuse = baseCol * lightColor * intensity * (0.15 + 0.85 * NdotL);
        vec3 sheen = lightColor * intensity * spec * (0.25 + 0.75 * NdotL);

        return diffuse + sheen;
      }

      void main() {
        vec2 p = (vUv - 0.5) * vec2(4.0, 3.0);

        vec2 warpAxis = vec2(cos(uWarpAngle), sin(uWarpAngle));
        vec2 weftAxis = vec2(cos(uWeftAngle), sin(uWeftAngle));

        float warpU = dot(p, warpAxis) * uThreadDensity;
        float weftU = dot(p, weftAxis) * uThreadDensity;

        float warpMask = stripeProfile(warpU);
        float weftMask = stripeProfile(weftU);

        float warpRidge = ridgeProfile(warpU);
        float weftRidge = ridgeProfile(weftU);

        float parity = mod(floor(warpU) + floor(weftU), 2.0);
        float warpOver = 1.0 - step(0.5, parity);
        float weftOver = 1.0 - warpOver;

        float weaveShadow = mix(
          0.86 + 0.06 * weftRidge,
          1.04 + 0.08 * warpRidge,
          warpOver * warpMask + (1.0 - warpOver) * 0.5
        );

        vec3 woven = uBaseColor;
        woven = mix(woven, uWarpColor, warpMask * (0.42 + 0.34 * warpOver));
        woven = mix(woven, uWeftColor, weftMask * (0.42 + 0.34 * weftOver));

        float crossings = warpMask * weftMask;
        woven *= 0.96 + 0.18 * crossings;
        woven *= weaveShadow;

        vec3 dx = dFdx(vWorldPos);
        vec3 dy = dFdy(vWorldPos);
        vec3 N = normalize(cross(dx, dy));
        if (!gl_FrontFacing) N *= -1.0;

        vec3 V = normalize(cameraPosition - vWorldPos);

        vec3 warpTangent = normalize((modelMatrix * vec4(warpAxis.x, warpAxis.y, 0.0, 0.0)).xyz);
        vec3 weftTangent = normalize((modelMatrix * vec4(weftAxis.x, weftAxis.y, 0.0, 0.0)).xyz);
        warpTangent = normalize(warpTangent - N * dot(warpTangent, N));
        weftTangent = normalize(weftTangent - N * dot(weftTangent, N));

        vec3 ambient = woven * uAmbientColor * uAmbientIntensity;

        vec3 L1 = normalize(uDirLightDir);
        vec3 L2 = normalize(uFillLightDir);

        float shimmer = 0.92 + 0.08 * sin((warpU + weftU) * 0.08 + uTime * 1.15);

        vec3 lit = ambient;
        lit += lightContribution(
          N, V, L1, uDirLightColor, uDirLightIntensity, woven,
          warpTangent, weftTangent, warpMask, weftMask, warpOver, warpRidge, weftRidge, shimmer
        );
        lit += lightContribution(
          N, V, L2, uFillLightColor, uFillLightIntensity, woven,
          warpTangent, weftTangent, warpMask, weftMask, warpOver, warpRidge, weftRidge, shimmer
        );

        float rim = pow(1.0 - max(dot(N, V), 0.0), 2.5) * 0.06 * uSheen;
        lit += rim * (uWarpColor * 0.6 + uWeftColor * 0.4);

        gl_FragColor = vec4(lit, 1.0);
      }
    `;

    const geometry = new THREE.PlaneGeometry(4, 3, WIDTH_SEGMENTS, HEIGHT_SEGMENTS);
    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      side: THREE.DoubleSide
    });

    const fabricMesh = new THREE.Mesh(geometry, material);
    scene.add(fabricMesh);

    const hudWarp = document.getElementById('hud-warp');
    const hudDensity = document.getElementById('hud-density');
    const hudSheen = document.getElementById('hud-sheen');
    const hudDrape = document.getElementById('hud-drape');
    const hudPreset = document.getElementById('hud-preset');
    const hudLight = document.getElementById('hud-light');

    const presetButtonsEl = document.getElementById('preset-buttons');
    const presetButtons = {};

    function createPresetButtons() {
      Object.entries(PRESETS).forEach(([name, preset]) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn' + (name === state.colorPreset ? ' active' : '');
        btn.title = name;
        btn.setAttribute('aria-label', name);
        btn.dataset.preset = name;
        btn.style.background = `radial-gradient(circle at 30% 28%, rgba(255,255,255,0.35), rgba(255,255,255,0.05) 30%, ${preset.swatch} 72%)`;
        btn.addEventListener('click', () => applyPreset(name));
        presetButtonsEl.appendChild(btn);
        presetButtons[name] = btn;
      });
    }

    function applyPreset(name) {
      const preset = PRESETS[name];
      state.colorPreset = name;
      uniforms.uBaseColor.value.setRGB(...preset.base);
      uniforms.uWarpColor.value.setRGB(...preset.warp);
      uniforms.uWeftColor.value.setRGB(...preset.weft);

      Object.entries(presetButtons).forEach(([key, el]) => {
        el.classList.toggle('active', key === name);
      });
    }

    createPresetButtons();
    applyPreset('Crimson');

    function syncPrimaryUniforms() {
      uniforms.uWarpAngle.value = state.warpAngle;
      uniforms.uWeftAngle.value = getWeftAngle();
      uniforms.uThreadDensity.value = state.threadDensity;
      uniforms.uSheen.value = state.sheen;
      uniforms.uDrapeAmount.value = state.drapeAmount;
    }

    function setLightMode(mode) {
      state.lightMode = mode;
      if (mode === 'dramatic') {
        directionalLight.intensity = 3.0;
        fillLight.intensity = 0.1;
      } else {
        directionalLight.intensity = 1.5;
        fillLight.intensity = 0.6;
      }
    }

    setLightMode('standard');

    function startDrapeTween(active) {
      state.drapeActive = active;
      state.drapeTween.active = true;
      state.drapeTween.startTime = performance.now();
      state.drapeTween.from = state.drapeAmount;
      state.drapeTween.to = active ? 1 : 0;
      state.drapeTween.duration = 500;
    }

    function updateDrapeTween(now) {
      const t = state.drapeTween;
      if (!t.active) return;
      const elapsed = now - t.startTime;
      const p = Math.min(elapsed / t.duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      state.drapeAmount = THREE.MathUtils.lerp(t.from, t.to, eased);
      if (p >= 1) {
        state.drapeAmount = t.to;
        t.active = false;
      }
    }

    const densityCycle = [40, 70, 100];
    const sheenCycle = [0.3, 0.5, 0.7, 0.9];

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'r') {
        state.warpAngle = (state.warpAngle + rad(15)) % (Math.PI * 2);
      } else if (key === 't') {
        const i = densityCycle.indexOf(state.threadDensity);
        state.threadDensity = densityCycle[(i + 1) % densityCycle.length];
      } else if (key === 's') {
        const i = sheenCycle.indexOf(Number(state.sheen.toFixed(1)));
        state.sheen = sheenCycle[(i + 1) % sheenCycle.length];
      } else if (key === 'd') {
        startDrapeTween(!state.drapeActive);
      } else if (key === 'l') {
        setLightMode(state.lightMode === 'standard' ? 'dramatic' : 'standard');
      }

      syncPrimaryUniforms();
    });

    function updateShaderLights() {
      uniforms.uDirLightDir.value.copy(directionalLight.position).normalize();
      uniforms.uDirLightColor.value.copy(directionalLight.color);
      uniforms.uDirLightIntensity.value = directionalLight.intensity;

      uniforms.uFillLightDir.value.copy(fillLight.position).normalize();
      uniforms.uFillLightColor.value.copy(fillLight.color);
      uniforms.uFillLightIntensity.value = fillLight.intensity;

      uniforms.uAmbientColor.value.copy(ambientLight.color);
      uniforms.uAmbientIntensity.value = ambientLight.intensity;
    }

    function approx(a, b, eps = 1e-5) {
      return Math.abs(a - b) <= eps;
    }

    function colorToArray(c) {
      return [c.r, c.g, c.b];
    }

    function updateHUD() {
      hudWarp.textContent = `${deg(state.warpAngle).toFixed(0)}°`;
      hudDensity.textContent = `${state.threadDensity}`;
      hudSheen.textContent = `${state.sheen.toFixed(1)}`;
      hudDrape.textContent = state.drapeActive ? 'on' : 'off';
      hudPreset.textContent = state.colorPreset;
      hudLight.textContent = state.lightMode;
    }

    window.__3D_STATE__ = {
      warpAngleDeg: 0,
      weftAngleDeg: 90,
      threadDensity: state.threadDensity,
      sheen: state.sheen,
      drapeActive: state.drapeActive,
      drapeAmount: state.drapeAmount,
      colorPreset: state.colorPreset,
      baseColor: initialPreset.base.slice(),
      warpColor: initialPreset.warp.slice(),
      weftColor: initialPreset.weft.slice(),
      lightMode: state.lightMode,
      directionalIntensity: directionalLight.intensity,
      fillIntensity: fillLight.intensity,
      meshExists: true,
      segmentsX: WIDTH_SEGMENTS,
      segmentsY: HEIGHT_SEGMENTS,
      frameCount: 0,
      uniformsSync: true
    };

    function syncPublicState() {
      const currentPreset = PRESETS[state.colorPreset];

      const warpAngleDeg = deg(state.warpAngle);
      const weftAngleDeg = (warpAngleDeg + 90) % 360;

      const uniformsSync =
        approx(uniforms.uWarpAngle.value, state.warpAngle) &&
        approx(uniforms.uWeftAngle.value, getWeftAngle()) &&
        approx(uniforms.uThreadDensity.value, state.threadDensity) &&
        approx(uniforms.uSheen.value, state.sheen) &&
        approx(uniforms.uDrapeAmount.value, state.drapeAmount);

      window.__3D_STATE__.warpAngleDeg = warpAngleDeg;
      window.__3D_STATE__.weftAngleDeg = weftAngleDeg;
      window.__3D_STATE__.threadDensity = state.threadDensity;
      window.__3D_STATE__.sheen = state.sheen;
      window.__3D_STATE__.drapeActive = state.drapeActive;
      window.__3D_STATE__.drapeAmount = state.drapeAmount;
      window.__3D_STATE__.colorPreset = state.colorPreset;
      window.__3D_STATE__.baseColor = currentPreset.base.slice();
      window.__3D_STATE__.warpColor = currentPreset.warp.slice();
      window.__3D_STATE__.weftColor = currentPreset.weft.slice();
      window.__3D_STATE__.lightMode = state.lightMode;
      window.__3D_STATE__.directionalIntensity = directionalLight.intensity;
      window.__3D_STATE__.fillIntensity = fillLight.intensity;
      window.__3D_STATE__.meshExists = !!fabricMesh && scene.children.includes(fabricMesh);
      window.__3D_STATE__.segmentsX = WIDTH_SEGMENTS;
      window.__3D_STATE__.segmentsY = HEIGHT_SEGMENTS;
      window.__3D_STATE__.frameCount = state.frameCount;
      window.__3D_STATE__.uniformsSync = uniformsSync;
    }

    function animate(now) {
      requestAnimationFrame(animate);

      state.frameCount += 1;
      updateDrapeTween(now);

      uniforms.uTime.value = now * 0.001;
      syncPrimaryUniforms();
      updateShaderLights();

      controls.update();
      updateHUD();
      syncPublicState();

      renderer.render(scene, camera);
    }

    syncPrimaryUniforms();
    updateShaderLights();
    updateHUD();
    syncPublicState();
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
