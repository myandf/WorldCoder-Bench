<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Aberration Particle System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #111111; }
canvas { display: block; }
#hud {
position: fixed;
top: 10px;
left: 10px;
background: rgba(0, 0, 0, 0.7);
padding: 15px;
border-radius: 8px;
color: #fff;
font-family: monospace;
font-size: 13px;
z-index: 100;
min-width: 220px;
}
#hud label { display: block; margin-bottom: 5px; }
#intensity-slider { width: 100%; margin-bottom: 5px; }
#intensity-label { display: block; margin-bottom: 10px; color: #aaa; }
#hud button {
display: inline-block;
padding: 6px 12px;
margin-right: 5px;
margin-bottom: 5px;
background: #333;
color: #fff;
border: 1px solid #555;
border-radius: 4px;
cursor: pointer;
font-family: monospace;
font-size: 12px;
}
#hud button:hover { background: #555; }
</style>
</head>
<body>

<div id="hud">
<label for="intensity-slider">Chromatic Aberration</label>
<input type="range" id="intensity-slider" min="0" max="100" value="20">
<span id="intensity-label">0.0100</span>
<div>
<button id="toggle-particles">Toggle Particles</button>
<button id="reset-btn">Reset</button>
</div>
</div>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const DEFAULT_INTENSITY = 0.01;

window.__3D_STATE__ = {
intensity: DEFAULT_INTENSITY,
particlesVisible: true,
particleCount: 500,
particleRotationY: 0,
icosahedronRotationY: 0,
frameCount: 0,
shaderActive: true
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const icosaGeo = new THREE.IcosahedronGeometry(1.0, 1);
const icosaMat = new THREE.MeshStandardMaterial({
color: 0x4488ff,
metalness: 0.7,
roughness: 0.3
});
const icosahedron = new THREE.Mesh(icosaGeo, icosaMat);
scene.add(icosahedron);

const PARTICLE_COUNT = 500;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT; i++) {
const r = 3.0 * Math.cbrt(Math.random());
const theta = Math.random() * Math.PI * 2;
const phi = Math.acos(2 * Math.random() - 1);
positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
positions[i * 3 + 2] = r * Math.cos(phi);
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const particleMat = new THREE.PointsMaterial({
size: 0.05,
color: 0xffffff,
transparent: true,
opacity: 0.8
});

const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

const ChromaticAberrationShader = {
uniforms: {
tDiffuse: { value: null },
intensity: { value: DEFAULT_INTENSITY }
},
vertexShader: `
varying vec2 vUv;
void main() {
vUv = uv;
gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`,
fragmentShader: `
uniform sampler2D tDiffuse;
uniform float intensity;
varying vec2 vUv;
void main() {
float r = texture2D(tDiffuse, vUv + vec2(intensity, 0.0)).r;
float g = texture2D(tDiffuse, vUv + vec2(0.0, 0.0)).g;
float b = texture2D(tDiffuse, vUv + vec2(-intensity, 0.0)).b;
float a = texture2D(tDiffuse, vUv).a;
gl_FragColor = vec4(r, g, b, a);
}
`
};

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const chromaticPass = new ShaderPass(ChromaticAberrationShader);
composer.addPass(chromaticPass);

function setIntensity(val) {
const clamped = Math.max(0.0, Math.min(0.05, val));
window.__3D_STATE__.intensity = clamped;
chromaticPass.uniforms.intensity.value = clamped;
const sliderVal = Math.round((clamped / 0.05) * 100);
slider.value = sliderVal;
label.textContent = clamped.toFixed(4);
}

const slider = document.getElementById('intensity-slider');
const label = document.getElementById('intensity-label');
const toggleBtn = document.getElementById('toggle-particles');
const resetBtn = document.getElementById('reset-btn');

slider.addEventListener('input', () => {
const val = (parseFloat(slider.value) / 100) * 0.05;
setIntensity(val);
});

toggleBtn.addEventListener('click', () => {
particles.visible = !particles.visible;
window.__3D_STATE__.particlesVisible = particles.visible;
});

resetBtn.addEventListener('click', () => {
setIntensity(DEFAULT_INTENSITY);
particles.visible = true;
window.__3D_STATE__.particlesVisible = true;
});

document.addEventListener('keydown', (e) => {
if (e.key === 'ArrowUp') {
e.preventDefault();
setIntensity(window.__3D_STATE__.intensity + 0.005);
} else if (e.key === 'ArrowDown') {
e.preventDefault();
setIntensity(window.__3D_STATE__.intensity - 0.005);
}
});

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
composer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
requestAnimationFrame(animate);

icosahedron.rotation.y += 0.01;
window.__3D_STATE__.icosahedronRotationY = icosahedron.rotation.y;

particles.rotation.y += 0.002;
window.__3D_STATE__.particleRotationY = particles.rotation.y;

window.__3D_STATE__.frameCount++;

composer.render();
}

animate();
</script>
</body>
</html>
