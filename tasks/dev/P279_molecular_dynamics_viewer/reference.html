<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Molecular Dynamics Viewer</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #0a0a1a;
      font-family: Arial, sans-serif;
      color: white;
    }

    #uiContainer {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    #infoPanel {
      background: rgba(10, 10, 26, 0.75);
      color: white;
      padding: 15px;
      border-radius: 10px;
      min-width: 220px;
      line-height: 1.6;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
    }

    #controlsPanel {
      background: rgba(10, 10, 26, 0.75);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 220px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
    }

    button, input[type="range"] {
      width: 100%;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #2b3a67;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #415a9c;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    #tempLabel {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }

    input[type="range"] {
      accent-color: #7aa2ff;
      cursor: pointer;
    }

    #helpText {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      background: rgba(10, 10, 26, 0.7);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #d7d7e8;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div id="uiContainer">
    <div id="infoPanel">
      <div>Atoms: <span id="atomsCount">15</span></div>
      <div>Bonds: <span id="bondsCount">10</span></div>
      <div>Mode: <span id="modeText">ball-and-stick</span></div>
      <div>Frame: <span id="frameText">0</span></div>
      <div>Selected: <span id="selectedText">None</span></div>
    </div>

    <div id="controlsPanel">
      <button id="playPauseBtn">Pause</button>
      <div>
        <label id="tempLabel" for="tempSlider">Temperature: 300K</label>
        <input id="tempSlider" type="range" min="0" max="500" value="300" />
      </div>
      <button id="displayModeBtn">Display Mode: ball-and-stick</button>
    </div>
  </div>

  <div id="helpText">
    Keys: <b>R</b> Reset, <b>H</b> Toggle Hydrogen
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 10, 10);
    scene.add(directionalLight);

    const playPauseBtn = document.getElementById('playPauseBtn');
    const tempSlider = document.getElementById('tempSlider');
    const tempLabel = document.getElementById('tempLabel');
    const displayModeBtn = document.getElementById('displayModeBtn');

    const modeText = document.getElementById('modeText');
    const frameText = document.getElementById('frameText');
    const selectedText = document.getElementById('selectedText');

    const moleculeBasePositions = [
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(4, 2, 0),
      new THREE.Vector3(-3, 3, 1),
      new THREE.Vector3(2, -3, -1),
      new THREE.Vector3(-2, -2, 2)
    ];

    const atoms = [];
    const bonds = [];
    const molecules = [];

    const oxygenRadius = 0.8;
    const hydrogenRadius = 0.5;
    const bondRadius = 0.1;

    const oxygenColor = 0xff3333;
    const hydrogenColor = 0xffffff;
    const bondColor = 0x888888;

    const atomBaseMaterials = {
      oxygen: new THREE.MeshStandardMaterial({ color: oxygenColor, emissive: 0x000000, emissiveIntensity: 0.6 }),
      hydrogen: new THREE.MeshStandardMaterial({ color: hydrogenColor, emissive: 0x000000, emissiveIntensity: 0.6 })
    };

    const bondMaterial = new THREE.MeshStandardMaterial({ color: bondColor });

    const sphereGeoO = new THREE.SphereGeometry(1, 32, 32);
    const sphereGeoH = new THREE.SphereGeometry(1, 24, 24);
    const cylinderGeo = new THREE.CylinderGeometry(1, 1, 1, 16);

    const localO = new THREE.Vector3(0, 0, 0);
    const localH1 = new THREE.Vector3(1.4, 0.9, 0);
    const localH2 = new THREE.Vector3(-1.4, 0.9, 0);

    let isPlaying = true;
    let temperature = 300;
    let displayMode = 'ball-and-stick';
    let hydrogenVisible = true;
    let selectedAtomIndex = -1;
    let frameCount = 0;

    function createAtom(type, radius, materialTemplate, atomIndex, moleculeIndex) {
      const material = materialTemplate.clone();
      const geometry = type === 'oxygen' ? sphereGeoO : sphereGeoH;
      const mesh = new THREE.Mesh(geometry, material);
      mesh.scale.setScalar(radius);
      mesh.userData = {
        type,
        atomIndex,
        moleculeIndex,
        baseRadius: radius
      };
      scene.add(mesh);
      atoms.push(mesh);
      return mesh;
    }

    function createBond(moleculeIndex) {
      const mesh = new THREE.Mesh(cylinderGeo, bondMaterial.clone());
      mesh.userData = { moleculeIndex, baseRadius: bondRadius };
      scene.add(mesh);
      bonds.push(mesh);
      return mesh;
    }

    function randomRotationEuler() {
      return new THREE.Euler(
        Math.random() * Math.PI * 0.5,
        Math.random() * Math.PI * 0.5,
        Math.random() * Math.PI * 0.5
      );
    }

    function buildMolecule(index, basePosition) {
      const oxygen = createAtom('oxygen', oxygenRadius, atomBaseMaterials.oxygen, atoms.length, index);
      const hydrogen1 = createAtom('hydrogen', hydrogenRadius, atomBaseMaterials.hydrogen, atoms.length, index);
      const hydrogen2 = createAtom('hydrogen', hydrogenRadius, atomBaseMaterials.hydrogen, atoms.length, index);

      const bond1 = createBond(index);
      const bond2 = createBond(index);

      const rotation = new THREE.Quaternion().setFromEuler(randomRotationEuler());
      const frequency = 0.5 + (index / (moleculeBasePositions.length - 1)) * 1.5;
      const phase = Math.random() * Math.PI * 2;

      const molecule = {
        index,
        oxygen,
        hydrogens: [hydrogen1, hydrogen2],
        bonds: [bond1, bond2],
        rotation,
        frequency,
        bobFrequency: 0.3,
        phase,
        currentCenter: basePosition.clone(),
        originalCenter: basePosition.clone(),
        localEquilibrium: {
          oxygen: localO.clone(),
          h1: localH1.clone(),
          h2: localH2.clone()
        }
      };

      molecules.push(molecule);
    }

    moleculeBasePositions.forEach((pos, i) => buildMolecule(i, pos));

    function setBondBetweenPoints(mesh, start, end, radius) {
      const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();

      mesh.position.copy(midpoint);
      mesh.scale.set(radius, length, radius);

      const up = new THREE.Vector3(0, 1, 0);
      mesh.quaternion.setFromUnitVectors(up, direction.clone().normalize());
    }

    function getModeScale(type) {
      if (displayMode === 'space-fill') return type === 'oxygen' ? oxygenRadius * 1.5 : hydrogenRadius * 1.5;
      if (displayMode === 'wireframe') return type === 'oxygen' ? oxygenRadius * 0.5 : hydrogenRadius * 0.5;
      return type === 'oxygen' ? oxygenRadius : hydrogenRadius;
    }

    function applyDisplayMode() {
      atoms.forEach(atom => {
        const scale = getModeScale(atom.userData.type);
        atom.scale.setScalar(scale);
        atom.material.wireframe = displayMode === 'wireframe';
        if (atom.userData.type === 'hydrogen') {
          atom.visible = hydrogenVisible;
        } else {
          atom.visible = true;
        }
      });

      bonds.forEach(bond => {
        bond.visible = displayMode !== 'space-fill';
      });

      modeText.textContent = displayMode;
      displayModeBtn.textContent = `Display Mode: ${displayMode}`;
    }

    function resetSimulation() {
      molecules.forEach((molecule, i) => {
        molecule.currentCenter.copy(molecule.originalCenter);
        molecule.rotation.setFromEuler(randomRotationEuler());
        molecule.phase = Math.random() * Math.PI * 2;
      });
      temperature = 300;
      tempSlider.value = String(temperature);
      tempLabel.textContent = `Temperature: ${temperature}K`;
    }

    function clearSelection() {
      atoms.forEach(atom => {
        atom.material.emissive.setHex(0x000000);
      });
      selectedAtomIndex = -1;
    }

    function selectAtom(index) {
      clearSelection();
      const atom = atoms[index];
      if (!atom) return;
      atom.material.emissive.setHex(0xffff00);
      selectedAtomIndex = index;
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('click', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const visibleAtoms = atoms.filter(a => a.visible);
      const intersects = raycaster.intersectObjects(visibleAtoms, false);

      if (intersects.length > 0) {
        selectAtom(intersects[0].object.userData.atomIndex);
      }
    });

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPauseBtn.textContent = isPlaying ? 'Pause' : 'Play';
    });

    tempSlider.addEventListener('input', () => {
      temperature = Number(tempSlider.value);
      tempLabel.textContent = `Temperature: ${temperature}K`;
    });

    const displayModes = ['ball-and-stick', 'space-fill', 'wireframe'];
    displayModeBtn.addEventListener('click', () => {
      const nextIndex = (displayModes.indexOf(displayMode) + 1) % displayModes.length;
      displayMode = displayModes[nextIndex];
      applyDisplayMode();
    });

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'r') {
        resetSimulation();
      } else if (key === 'h') {
        hydrogenVisible = !hydrogenVisible;
        applyDisplayMode();
      }
    });

    function updateMolecules(timeSec) {
      const tempScale = temperature / 300;
      const vibAmplitude = 0.15 * tempScale;

      molecules.forEach((molecule) => {
        const centerDir = molecule.currentCenter.clone().normalize();

        if (temperature > 400) {
          if (centerDir.lengthSq() > 0) {
            molecule.currentCenter.add(centerDir.multiplyScalar(0.002));
          }
        } else if (temperature < 100) {
          if (centerDir.lengthSq() > 0) {
            molecule.currentCenter.add(centerDir.multiplyScalar(-0.001));
          }
        }

        const bobOffset = Math.sin((timeSec * molecule.bobFrequency * Math.PI * 2) + molecule.phase) * 0.3;

        const h1Vib = Math.sin((timeSec * molecule.frequency * Math.PI * 2) + molecule.phase) * vibAmplitude;
        const h2Vib = Math.sin((timeSec * molecule.frequency * Math.PI * 2) + molecule.phase + Math.PI) * vibAmplitude;

        const h1Local = molecule.localEquilibrium.h1.clone();
        const h2Local = molecule.localEquilibrium.h2.clone();

        h1Local.normalize().multiplyScalar(h1Vib);
        h2Local.normalize().multiplyScalar(h2Vib);

        const oLocal = molecule.localEquilibrium.oxygen.clone();
        const h1FinalLocal = molecule.localEquilibrium.h1.clone().add(h1Local);
        const h2FinalLocal = molecule.localEquilibrium.h2.clone().add(h2Local);

        const oWorld = oLocal.clone().applyQuaternion(molecule.rotation).add(molecule.currentCenter).add(new THREE.Vector3(0, bobOffset, 0));
        const h1World = h1FinalLocal.clone().applyQuaternion(molecule.rotation).add(molecule.currentCenter).add(new THREE.Vector3(0, bobOffset, 0));
        const h2World = h2FinalLocal.clone().applyQuaternion(molecule.rotation).add(molecule.currentCenter).add(new THREE.Vector3(0, bobOffset, 0));

        molecule.oxygen.position.copy(oWorld);
        molecule.hydrogens[0].position.copy(h1World);
        molecule.hydrogens[1].position.copy(h2World);

        setBondBetweenPoints(molecule.bonds[0], oWorld, h1World, bondRadius);
        setBondBetweenPoints(molecule.bonds[1], oWorld, h2World, bondRadius);
      });

      atoms.forEach(atom => {
        if (atom.userData.type === 'hydrogen') {
          atom.visible = hydrogenVisible;
        }
      });

      return vibAmplitude;
    }

    function updateInfoPanel() {
      frameText.textContent = frameCount;
      selectedText.textContent = selectedAtomIndex === -1 ? 'None' : String(selectedAtomIndex);
      modeText.textContent = displayMode;
    }

    function computeAverageDistance() {
      let sum = 0;
      for (const molecule of molecules) {
        sum += molecule.currentCenter.length();
      }
      return sum / molecules.length;
    }

    window.__3D_STATE__ = {
      isPlaying: true,
      temperature: 300,
      displayMode: 'ball-and-stick',
      frameCount: 0,
      atomCount: 15,
      bondCount: 10,
      hydrogenVisible: true,
      selectedAtomIndex: -1,
      moleculePositions: moleculeBasePositions.map(v => ({ x: v.x, y: v.y, z: v.z })),
      averageDistance: 0,
      vibrationAmplitude: 0.15
    };

    function updateState(vibrationAmplitude) {
      window.__3D_STATE__ = {
        isPlaying,
        temperature,
        displayMode,
        frameCount,
        atomCount: atoms.length,
        bondCount: bonds.length,
        hydrogenVisible,
        selectedAtomIndex,
        moleculePositions: molecules.map(m => ({
          x: m.currentCenter.x,
          y: m.currentCenter.y,
          z: m.currentCenter.z
        })),
        averageDistance: computeAverageDistance(),
        vibrationAmplitude
      };
    }

    applyDisplayMode();
    updateInfoPanel();
    updateState(0.15);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const timeSec = clock.getElapsedTime();
      let vibrationAmplitude = 0.15 * (temperature / 300);

      if (isPlaying) {
        frameCount++;
        vibrationAmplitude = updateMolecules(timeSec);
      }

      updateInfoPanel();
      updateState(vibrationAmplitude);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
