<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Wood Grain Material</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  canvas { display: block; }
  #controls-panel {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(20, 20, 20, 0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 16px 18px;
    color: #e0d8cf;
    font-size: 13px;
    min-width: 270px;
    backdrop-filter: blur(8px);
    z-index: 10;
    max-height: 95vh;
    overflow-y: auto;
  }
  #controls-panel h3 {
    margin: 0 0 10px 0;
    font-size: 15px;
    color: #c8a87a;
    border-bottom: 1px solid rgba(200,168,122,0.3);
    padding-bottom: 6px;
  }
  .ctrl-row {
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ctrl-row label {
    font-size: 12px;
    color: #b0a898;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ctrl-row label .val {
    color: #d4b88c;
    font-weight: 600;
    min-width: 40px;
    text-align: right;
  }
  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #c8a87a;
    cursor: pointer;
  }
  input[type="color"] {
    width: 50px; height: 26px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    padding: 1px;
  }
  .color-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .color-row label { font-size: 12px; color: #b0a898; }
  .btn-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .btn-row button {
    flex: 1;
    min-width: 70px;
    padding: 7px 6px;
    border: 1px solid rgba(200,168,122,0.4);
    background: rgba(200,168,122,0.12);
    color: #d4b88c;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn-row button:hover {
    background: rgba(200,168,122,0.3);
    border-color: rgba(200,168,122,0.7);
  }
  #label-save-status {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    color: #7dce82;
    min-height: 16px;
    text-align: center;
    transition: opacity 0.3s;
  }
  .shortcuts-info {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
    color: #807868;
    line-height: 1.6;
  }
  .shortcuts-info kbd {
    background: rgba(255,255,255,0.1);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: monospace;
    color: #b0a898;
  }
</style>
</head>
<body>

<div id="controls-panel">
  <h3>🪵 Wood Grain Controls</h3>

  <div class="ctrl-row">
    <label>Grain Frequency <span class="val" id="val-grain-freq">10.0</span></label>
    <input type="range" id="slider-grain-freq" min="2" max="30" step="0.5" value="10">
  </div>

  <div class="ctrl-row">
    <label>Knot Density <span class="val" id="val-knot-density">3.0</span></label>
    <input type="range" id="slider-knot-density" min="0" max="10" step="0.5" value="3">
  </div>

  <div class="ctrl-row">
    <label>Knot Size <span class="val" id="val-knot-size">0.30</span></label>
    <input type="range" id="slider-knot-size" min="0.05" max="1.0" step="0.05" value="0.3">
  </div>

  <div class="ctrl-row">
    <label>Noise Scale <span class="val" id="val-noise-scale">1.5</span></label>
    <input type="range" id="slider-noise-scale" min="0.1" max="5.0" step="0.1" value="1.5">
  </div>

  <div class="color-row">
    <label>Base Color</label>
    <input type="color" id="picker-base-color" value="#8C5926">
  </div>

  <div class="color-row">
    <label>Dark Color</label>
    <input type="color" id="picker-dark-color" value="#4D2E14">
  </div>

  <div class="btn-row">
    <button id="btn-save">Save (S)</button>
    <button id="btn-load">Load (L)</button>
    <button id="btn-reset">Reset (R)</button>
  </div>

  <span id="label-save-status"></span>

  <div class="shortcuts-info">
    <kbd>S</kbd> Save &nbsp; <kbd>L</kbd> Load &nbsp; <kbd>R</kbd> Reset<br>
    <kbd>1</kbd> Fine Oak &nbsp; <kbd>2</kbd> Knotty Pine
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DEFAULTS = {
  grainFrequency: 10.0,
  knotDensity: 3.0,
  knotSize: 0.3,
  noiseScale: 1.5,
  baseColor: [0.55, 0.35, 0.15],
  darkColor: [0.3, 0.18, 0.08]
};

const DEFAULTS_HEX = {
  baseColor: '#8C5926',
  darkColor: '#4D2E14'
};

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a2a);

// --- Camera ---
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// --- Lights ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 8, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 30;
dirLight.shadow.camera.left = -6;
dirLight.shadow.camera.right = 6;
dirLight.shadow.camera.top = 6;
dirLight.shadow.camera.bottom = -6;
scene.add(dirLight);

// --- Ground plane for shadow catching ---
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.16;
ground.receiveShadow = true;
scene.add(ground);

// --- GLSL Shaders ---
const vertexShader = `
  varying vec3 vPosition;
  varying vec3 vNormal;
  varying vec2 vUv;

  void main() {
    vPosition = position;
    vNormal = normalize(normalMatrix * normal);
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const fragmentShader = `
  precision highp float;

  uniform float grainFrequency;
  uniform float knotDensity;
  uniform float knotSize;
  uniform float noiseScale;
  uniform vec3 baseColor;
  uniform vec3 darkColor;

  varying vec3 vPosition;
  varying vec3 vNormal;
  varying vec2 vUv;

  // Simple 3D noise based on sin hashing
  float hash(vec3 p) {
    p = fract(p * vec3(443.897, 441.423, 437.195));
    p += dot(p, p.yzx + 19.19);
    return fract((p.x + p.y) * p.z);
  }

  float noise3D(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);

    float n000 = hash(i);
    float n100 = hash(i + vec3(1,0,0));
    float n010 = hash(i + vec3(0,1,0));
    float n110 = hash(i + vec3(1,1,0));
    float n001 = hash(i + vec3(0,0,1));
    float n101 = hash(i + vec3(1,0,1));
    float n011 = hash(i + vec3(0,1,1));
    float n111 = hash(i + vec3(1,1,1));

    float nx00 = mix(n000, n100, f.x);
    float nx10 = mix(n010, n110, f.x);
    float nx01 = mix(n001, n101, f.x);
    float nx11 = mix(n011, n111, f.x);

    float nxy0 = mix(nx00, nx10, f.y);
    float nxy1 = mix(nx01, nx11, f.y);

    return mix(nxy0, nxy1, f.z);
  }

  float fbm(vec3 p) {
    float val = 0.0;
    float amp = 0.5;
    float freq = 1.0;
    for (int i = 0; i < 4; i++) {
      val += amp * noise3D(p * freq);
      freq *= 2.0;
      amp *= 0.5;
    }
    return val;
  }

  // Pseudo-random knot position from seed
  vec2 knotPos(float seed) {
    return vec2(
      fract(sin(seed * 127.1 + 311.7) * 43758.5453) * 2.0 - 1.0,
      fract(sin(seed * 269.5 + 183.3) * 43758.5453) * 0.6 - 0.3
    );
  }

  void main() {
    vec3 p = vPosition * noiseScale;

    // Turbulence from noise
    float turb = fbm(p * 2.0) * 0.5;

    // Radial distance for ring pattern (along x-z plane)
    float dist = sqrt(p.y * p.y + p.z * p.z);

    // Apply knot distortions
    int numKnots = int(floor(knotDensity));
    float knotEffect = 0.0;
    for (int i = 0; i < 10; i++) {
      if (i >= numKnots) break;
      vec2 kp = knotPos(float(i) + 1.0);
      // Knot center in local xz space
      float kx = kp.x * 1.8;
      float kz = kp.y * 0.6;
      float dx = vPosition.x - kx;
      float dz = vPosition.z - kz;
      float kDist = sqrt(dx * dx + dz * dz);
      float influence = smoothstep(knotSize, 0.0, kDist);
      knotEffect += influence * 2.5;
    }
    // Fractional knot density: partial influence of one more knot
    float fracPart = fract(knotDensity);
    if (fracPart > 0.001 && numKnots < 10) {
      vec2 kp = knotPos(float(numKnots) + 1.0);
      float kx = kp.x * 1.8;
      float kz = kp.y * 0.6;
      float dx = vPosition.x - kx;
      float dz = vPosition.z - kz;
      float kDist = sqrt(dx * dx + dz * dz);
      float influence = smoothstep(knotSize, 0.0, kDist);
      knotEffect += influence * 2.5 * fracPart;
    }

    // Wood grain rings
    float grain = sin((dist + turb + knotEffect) * grainFrequency);
    grain = grain * 0.5 + 0.5; // normalize to 0-1

    // Sharpen the grain lines
    grain = smoothstep(0.3, 0.7, grain);

    // Fine grain detail
    float fineGrain = noise3D(vPosition * vec3(40.0, 2.0, 10.0)) * 0.08;

    // Mix colors
    vec3 color = mix(darkColor, baseColor, grain);
    color += fineGrain;

    // Simple diffuse lighting
    vec3 lightDir = normalize(vec3(5.0, 8.0, 5.0));
    float diff = max(dot(vNormal, lightDir), 0.0);
    float ambient = 0.35;
    float lighting = ambient + diff * 0.65;

    color *= lighting;

    // Subtle specular
    vec3 viewDir = normalize(cameraPosition - vPosition);
    vec3 halfDir = normalize(lightDir + viewDir);
    float spec = pow(max(dot(vNormal, halfDir), 0.0), 32.0) * 0.15;
    color += vec3(spec);

    gl_FragColor = vec4(color, 1.0);
  }
`;

// --- Shared Uniforms ---
const uniforms = {
  grainFrequency: { value: DEFAULTS.grainFrequency },
  knotDensity: { value: DEFAULTS.knotDensity },
  knotSize: { value: DEFAULTS.knotSize },
  noiseScale: { value: DEFAULTS.noiseScale },
  baseColor: { value: new THREE.Vector3(...DEFAULTS.baseColor) },
  darkColor: { value: new THREE.Vector3(...DEFAULTS.darkColor) }
};

const woodMaterial = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms
});

// --- Main Plank ---
const mainPlankGeo = new THREE.BoxGeometry(4, 0.3, 1.5);
const mainPlank = new THREE.Mesh(mainPlankGeo, woodMaterial);
mainPlank.position.set(0, 0, 0);
mainPlank.castShadow = true;
mainPlank.receiveShadow = true;
scene.add(mainPlank);

// --- Preview Plank ---
const previewPlankGeo = new THREE.BoxGeometry(2, 0.3, 1.0);
const previewPlank = new THREE.Mesh(previewPlankGeo, woodMaterial);
previewPlank.position.set(0, 1.5, 0);
previewPlank.castShadow = true;
previewPlank.receiveShadow = true;
scene.add(previewPlank);

// --- State ---
window.__3D_STATE__ = {
  grainFrequency: DEFAULTS.grainFrequency,
  knotDensity: DEFAULTS.knotDensity,
  knotSize: DEFAULTS.knotSize,
  noiseScale: DEFAULTS.noiseScale,
  baseColor: [...DEFAULTS.baseColor],
  darkColor: [...DEFAULTS.darkColor],
  plankCount: 2,
  mainPlankPosition: [0, 0, 0],
  previewPlankPosition: [0, 1.5, 0],
  lastAction: 'init',
  saveSlotOccupied: localStorage.getItem('woodGrainState') !== null,
  uniformsSynced: true,
  cameraDistance: camera.position.length(),
  frameCount: 0
};

// --- UI References ---
const sliderGrainFreq = document.getElementById('slider-grain-freq');
const sliderKnotDensity = document.getElementById('slider-knot-density');
const sliderKnotSize = document.getElementById('slider-knot-size');
const sliderNoiseScale = document.getElementById('slider-noise-scale');
const pickerBaseColor = document.getElementById('picker-base-color');
const pickerDarkColor = document.getElementById('picker-dark-color');
const btnSave = document.getElementById('btn-save');
const btnLoad = document.getElementById('btn-load');
const btnReset = document.getElementById('btn-reset');
const labelStatus = document.getElementById('label-save-status');

const valGrainFreq = document.getElementById('val-grain-freq');
const valKnotDensity = document.getElementById('val-knot-density');
const valKnotSize = document.getElementById('val-knot-size');
const valNoiseScale = document.getElementById('val-noise-scale');

// --- Helpers ---
function hexToRgb01(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  return [r, g, b];
}

function rgb01ToHex(rgb) {
  const r = Math.round(rgb[0] * 255).toString(16).padStart(2, '0');
  const g = Math.round(rgb[1] * 255).toString(16).padStart(2, '0');
  const b = Math.round(rgb[2] * 255).toString(16).padStart(2, '0');
  return `#${r}${g}${b}`.toUpperCase();
}

let statusTimeout = null;
function showStatus(msg) {
  labelStatus.textContent = msg;
  labelStatus.style.opacity = '1';
  if (statusTimeout) clearTimeout(statusTimeout);
  statusTimeout = setTimeout(() => {
    labelStatus.style.opacity = '0';
    setTimeout(() => { labelStatus.textContent = ''; }, 300);
  }, 2000);
}

function syncUniformsFromState() {
  uniforms.grainFrequency.value = window.__3D_STATE__.grainFrequency;
  uniforms.knotDensity.value = window.__3D_STATE__.knotDensity;
  uniforms.knotSize.value = window.__3D_STATE__.knotSize;
  uniforms.noiseScale.value = window.__3D_STATE__.noiseScale;
  uniforms.baseColor.value.set(...window.__3D_STATE__.baseColor);
  uniforms.darkColor.value.set(...window.__3D_STATE__.darkColor);
}

function syncUIFromState() {
  const s = window.__3D_STATE__;
  sliderGrainFreq.value = s.grainFrequency;
  sliderKnotDensity.value = s.knotDensity;
  sliderKnotSize.value = s.knotSize;
  sliderNoiseScale.value = s.noiseScale;
  pickerBaseColor.value = rgb01ToHex(s.baseColor);
  pickerDarkColor.value = rgb01ToHex(s.darkColor);
  valGrainFreq.textContent = s.grainFrequency.toFixed(1);
  valKnotDensity.textContent = s.knotDensity.toFixed(1);
  valKnotSize.textContent = s.knotSize.toFixed(2);
  valNoiseScale.textContent = s.noiseScale.toFixed(1);
}

function applyParams(params, action) {
  const s = window.__3D_STATE__;
  s.grainFrequency = params.grainFrequency;
  s.knotDensity = params.knotDensity;
  s.knotSize = params.knotSize;
  s.noiseScale = params.noiseScale;
  s.baseColor = [...params.baseColor];
  s.darkColor = [...params.darkColor];
  s.lastAction = action;
  syncUniformsFromState();
  syncUIFromState();
}

function checkUniformsSynced() {
  const s = window.__3D_STATE__;
  const bc = uniforms.baseColor.value;
  const dc = uniforms.darkColor.value;
  const eps = 0.001;
  return (
    Math.abs(uniforms.grainFrequency.value - s.grainFrequency) < eps &&
    Math.abs(uniforms.knotDensity.value - s.knotDensity) < eps &&
    Math.abs(uniforms.knotSize.value - s.knotSize) < eps &&
    Math.abs(uniforms.noiseScale.value - s.noiseScale) < eps &&
    Math.abs(bc.x - s.baseColor[0]) < eps &&
    Math.abs(bc.y - s.baseColor[1]) < eps &&
    Math.abs(bc.z - s.baseColor[2]) < eps &&
    Math.abs(dc.x - s.darkColor[0]) < eps &&
    Math.abs(dc.y - s.darkColor[1]) < eps &&
    Math.abs(dc.z - s.darkColor[2]) < eps
  );
}

// --- Slider Events ---
sliderGrainFreq.addEventListener('input', () => {
  const v = parseFloat(sliderGrainFreq.value);
  window.__3D_STATE__.grainFrequency = v;
  uniforms.grainFrequency.value = v;
  valGrainFreq.textContent = v.toFixed(1);
  window.__3D_STATE__.lastAction = 'slider';
});

sliderKnotDensity.addEventListener('input', () => {
  const v = parseFloat(sliderKnotDensity.value);
  window.__3D_STATE__.knotDensity = v;
  uniforms.knotDensity.value = v;
  valKnotDensity.textContent = v.toFixed(1);
  window.__3D_STATE__.lastAction = 'slider';
});

sliderKnotSize.addEventListener('input', () => {
  const v = parseFloat(sliderKnotSize.value);
  window.__3D_STATE__.knotSize = v;
  uniforms.knotSize.value = v;
  valKnotSize.textContent = v.toFixed(2);
  window.__3D_STATE__.lastAction = 'slider';
});

sliderNoiseScale.addEventListener('input', () => {
  const v = parseFloat(sliderNoiseScale.value);
  window.__3D_STATE__.noiseScale = v;
  uniforms.noiseScale.value = v;
  valNoiseScale.textContent = v.toFixed(1);
  window.__3D_STATE__.lastAction = 'slider';
});

pickerBaseColor.addEventListener('input', () => {
  const rgb = hexToRgb01(pickerBaseColor.value);
  window.__3D_STATE__.baseColor = rgb;
  uniforms.baseColor.value.set(...rgb);
  window.__3D_STATE__.lastAction = 'slider';
});

pickerDarkColor.addEventListener('input', () => {
  const rgb = hexToRgb01(pickerDarkColor.value);
  window.__3D_STATE__.darkColor = rgb;
  uniforms.darkColor.value.set(...rgb);
  window.__3D_STATE__.lastAction = 'slider';
});

// --- Save / Load / Reset ---
function doSave() {
  const s = window.__3D_STATE__;
  const data = {
    grainFrequency: s.grainFrequency,
    knotDensity: s.knotDensity,
    knotSize: s.knotSize,
    noiseScale: s.noiseScale,
    baseColor: [...s.baseColor],
    darkColor: [...s.darkColor]
  };
  localStorage.setItem('woodGrainState', JSON.stringify(data));
  s.lastAction = 'save';
  s.saveSlotOccupied = true;
  showStatus('Saved!');
}

function doLoad() {
  const raw = localStorage.getItem('woodGrainState');
  if (!raw) {
    showStatus('No saved state found.');
    return;
  }
  try {
    const data = JSON.parse(raw);
    applyParams(data, 'load');
    showStatus('Loaded!');
  } catch (e) {
    showStatus('Error loading state.');
  }
}

function doReset() {
  applyParams({
    grainFrequency: DEFAULTS.grainFrequency,
    knotDensity: DEFAULTS.knotDensity,
    knotSize: DEFAULTS.knotSize,
    noiseScale: DEFAULTS.noiseScale,
    baseColor: [...DEFAULTS.baseColor],
    darkColor: [...DEFAULTS.darkColor]
  }, 'reset');
  showStatus('Reset!');
}

btnSave.addEventListener('click', doSave);
btnLoad.addEventListener('click', doLoad);
btnReset.addEventListener('click', doReset);

// --- Keyboard Shortcuts ---
window.addEventListener('keydown', (e) => {
  // Ignore if typing in an input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  const key = e.key.toLowerCase();
  if (key === 's') {
    e.preventDefault();
    doSave();
  } else if (key === 'l') {
    e.preventDefault();
    doLoad();
  } else if (key === 'r') {
    e.preventDefault();
    doReset();
  } else if (key === '1') {
    applyParams({
      grainFrequency: 22,
      knotDensity: 1.5,
      knotSize: 0.15,
      noiseScale: 0.8,
      baseColor: [0.65, 0.45, 0.2],
      darkColor: [0.4, 0.25, 0.1]
    }, 'preset_fine_oak');
    showStatus('Preset: Fine Oak');
  } else if (key === '2') {
    applyParams({
      grainFrequency: 8,
      knotDensity: 8.0,
      knotSize: 0.6,
      noiseScale: 3.0,
      baseColor: [0.7, 0.5, 0.25],
      darkColor: [0.35, 0.2, 0.08]
    }, 'preset_knotty_pine');
    showStatus('Preset: Knotty Pine');
  }
});

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Animation Loop ---
function animate() {
  requestAnimationFrame(animate);

  controls.update();

  // Update state
  const s = window.__3D_STATE__;
  s.mainPlankPosition = [mainPlank.position.x, mainPlank.position.y, mainPlank.position.z];
  s.previewPlankPosition = [previewPlank.position.x, previewPlank.position.y, previewPlank.position.z];
  s.cameraDistance = camera.position.length();
  s.saveSlotOccupied = localStorage.getItem('woodGrainState') !== null;
  s.uniformsSynced = checkUniformsSynced();
  s.frameCount++;

  // Gentle rotation on preview plank
  previewPlank.rotation.y += 0.003;

  renderer.render(scene, camera);
}

animate();
</script>
