<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSS Skin Approximation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
canvas { display: block; }

#controls-panel {
  position: absolute;
  top: 15px;
  left: 15px;
  background: rgba(10, 10, 30, 0.85);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 18px;
  color: #e0e0e0;
  font-size: 13px;
  min-width: 260px;
  backdrop-filter: blur(10px);
  z-index: 10;
}

#controls-panel h3 {
  margin-bottom: 12px;
  font-size: 15px;
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  padding-bottom: 8px;
}

.slider-group {
  margin-bottom: 10px;
}

.slider-group label {
  display: block;
  margin-bottom: 3px;
  font-size: 12px;
  color: #b0b0c0;
}

.slider-group input[type="range"] {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  outline: none;
}

.slider-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffe0c0;
  cursor: pointer;
}

#toggle-wireframe {
  margin-top: 10px;
  padding: 6px 14px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 5px;
  color: #e0e0e0;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.2s;
}

#toggle-wireframe:hover {
  background: rgba(255,255,255,0.2);
}

.key-hints {
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 11px;
  color: #808090;
  line-height: 1.6;
}

.key-hints kbd {
  background: rgba(255,255,255,0.1);
  padding: 1px 5px;
  border-radius: 3px;
  font-family: monospace;
}

#hud-panel {
  position: absolute;
  top: 15px;
  right: 15px;
  background: rgba(10, 10, 30, 0.85);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 15px;
  color: #c0c0d0;
  font-size: 12px;
  font-family: 'Consolas', 'Courier New', monospace;
  min-width: 220px;
  backdrop-filter: blur(10px);
  z-index: 10;
  line-height: 1.7;
}

#hud-panel h4 {
  color: #fff;
  margin-bottom: 8px;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  padding-bottom: 6px;
}

.hud-row {
  display: flex;
  justify-content: space-between;
}

.hud-label { color: #808090; }
.hud-value { color: #ffe0c0; }
</style>
</head>
<body>

<div id="controls-panel">
  <h3>SSS Skin Controls</h3>
  <div class="slider-group">
    <label>SSS Intensity: <span id="sss-intensity-val">0.50</span></label>
    <input type="range" id="sss-intensity-slider" min="0" max="2" step="0.01" value="0.5">
  </div>
  <div class="slider-group">
    <label>SSS Distortion: <span id="sss-distortion-val">0.20</span></label>
    <input type="range" id="sss-distortion-slider" min="0" max="1" step="0.01" value="0.2">
  </div>
  <div class="slider-group">
    <label>Roughness: <span id="roughness-val">0.55</span></label>
    <input type="range" id="roughness-slider" min="0" max="1" step="0.01" value="0.55">
  </div>
  <div class="slider-group">
    <label>Wrap Factor: <span id="wrap-factor-val">0.50</span></label>
    <input type="range" id="wrap-factor-slider" min="0" max="1" step="0.01" value="0.5">
  </div>
  <button id="toggle-wireframe">Toggle Wireframe</button>
  <div class="key-hints">
    <kbd>L</kbd> Toggle light orbit<br>
    <kbd>R</kbd> Reset defaults<br>
    <kbd>1</kbd> Fair skin <kbd>2</kbd> Medium <kbd>3</kbd> Deep
  </div>
</div>

<div id="hud-panel">
  <h4>Scene State</h4>
  <div class="hud-row"><span class="hud-label">SSS Intensity</span><span class="hud-value" id="hud-sss-int">0.50</span></div>
  <div class="hud-row"><span class="hud-label">Distortion</span><span class="hud-value" id="hud-distortion">0.20</span></div>
  <div class="hud-row"><span class="hud-label">Roughness</span><span class="hud-value" id="hud-roughness">0.55</span></div>
  <div class="hud-row"><span class="hud-label">Wrap Factor</span><span class="hud-value" id="hud-wrap">0.50</span></div>
  <div class="hud-row"><span class="hud-label">Skin Preset</span><span class="hud-value" id="hud-preset">Fair</span></div>
  <div class="hud-row"><span class="hud-label">Light Orbit</span><span class="hud-value" id="hud-orbit">OFF</span></div>
  <div class="hud-row"><span class="hud-label">Wireframe</span><span class="hud-value" id="hud-wireframe">OFF</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const vertexShader = `
  uniform vec3 u_lightPos;
  varying vec3 vWorldPos;
  varying vec3 vWorldNormal;
  varying vec3 vViewDir;
  varying float vThickness;

  void main() {
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vWorldPos = worldPos.xyz;
    vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
    vViewDir = normalize(cameraPosition - worldPos.xyz);

    vec3 N = normalize(vWorldNormal);
    vThickness = clamp(dot(N, vec3(0.0, 0.0, -1.0)) * 0.5 + 0.5, 0.0, 1.0);

    gl_Position = projectionMatrix * viewMatrix * worldPos;
  }
`;

const fragmentShader = `
  precision highp float;

  uniform vec3 u_lightPos;
  uniform vec3 u_lightColor;
  uniform float u_lightIntensity;
  uniform vec3 u_ambientColor;
  uniform float u_ambientIntensity;
  uniform vec3 u_fillLightPos;
  uniform vec3 u_fillLightColor;
  uniform float u_fillLightIntensity;
  uniform vec3 u_sssColor;
  uniform float u_sssIntensity;
  uniform float u_sssDistortion;
  uniform float u_sssPower;
  uniform vec3 u_skinBaseColor;
  uniform float u_roughness;
  uniform float u_specularIntensity;
  uniform float u_wrapFactor;
  uniform float u_time;

  varying vec3 vWorldPos;
  varying vec3 vWorldNormal;
  varying vec3 vViewDir;
  varying float vThickness;

  void main() {
    vec3 N = normalize(vWorldNormal);
    vec3 V = normalize(vViewDir);

    // Key light
    vec3 L = normalize(u_lightPos - vWorldPos);

    // SSS approximation
    vec3 sssLightDir = L + N * u_sssDistortion;
    float sssDot = pow(clamp(dot(normalize(sssLightDir), V), 0.0, 1.0), u_sssPower) * u_sssIntensity;
    vec3 sssContribution = sssDot * vThickness * u_sssColor * u_lightColor * u_lightIntensity;

    // Wrap diffuse
    float NdotL = dot(N, L);
    float wrapDiffuse = max((NdotL + u_wrapFactor) / (1.0 + u_wrapFactor), 0.0);

    // Blinn-Phong specular
    vec3 H = normalize(L + V);
    float specPow = mix(16.0, 128.0, 1.0 - u_roughness);
    float spec = pow(max(dot(N, H), 0.0), specPow) * u_specularIntensity;

    // Ambient
    vec3 ambient = u_ambientColor * u_ambientIntensity * u_skinBaseColor;

    // Key light contribution
    vec3 keyDiffuse = wrapDiffuse * u_skinBaseColor * u_lightColor * u_lightIntensity;
    vec3 keySpec = spec * u_lightColor * u_lightIntensity;

    // Fill light (no SSS)
    vec3 Lf = normalize(u_fillLightPos - vWorldPos);
    float NdotLf = dot(N, Lf);
    float wrapDiffuseFill = max((NdotLf + u_wrapFactor) / (1.0 + u_wrapFactor), 0.0);
    vec3 Hf = normalize(Lf + V);
    float specFill = pow(max(dot(N, Hf), 0.0), specPow) * u_specularIntensity;
    vec3 fillDiffuse = wrapDiffuseFill * u_skinBaseColor * u_fillLightColor * u_fillLightIntensity;
    vec3 fillSpec = specFill * u_fillLightColor * u_fillLightIntensity;

    // Fresnel rim glow
    float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0) * 0.15 * (0.8 + 0.2 * sin(u_time * 2.0));
    vec3 fresnelColor = fresnel * vec3(0.6, 0.7, 1.0);

    // Final
    vec3 color = ambient + keyDiffuse + keySpec + sssContribution + fillDiffuse + fillSpec + fresnelColor;

    // Tone mapping
    color = color / (color + vec3(1.0));
    color = pow(color, vec3(1.0 / 2.2));

    gl_FragColor = vec4(color, 1.0);
  }
`;

// Defaults
const DEFAULTS = {
  sssIntensity: 0.5,
  sssDistortion: 0.2,
  roughness: 0.55,
  wrapFactor: 0.5,
  sssPower: 1.5,
  specularIntensity: 0.4,
};

const PRESETS = {
  fair:   { base: [0.95, 0.82, 0.72], sss: [0.8, 0.2, 0.1], name: 'fair', label: 'Fair' },
  medium: { base: [0.85, 0.65, 0.5],  sss: [0.7, 0.15, 0.08], name: 'medium', label: 'Medium' },
  deep:   { base: [0.55, 0.35, 0.25], sss: [0.5, 0.1, 0.05], name: 'deep', label: 'Deep' },
};

// State
let currentPreset = 'fair';
let lightOrbitActive = false;
let wireframeActive = false;
let frameCount = 0;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Geometry
const geometry = new THREE.SphereGeometry(1, 64, 64);
geometry.scale(1, 1.15, 1);

const preset = PRESETS[currentPreset];

const uniforms = {
  u_lightPos:          { value: new THREE.Vector3(2, 1, 3) },
  u_lightColor:        { value: new THREE.Vector3(1.0, 0.878, 0.753) },
  u_lightIntensity:    { value: 2.0 },
  u_ambientColor:      { value: new THREE.Vector3(0.125, 0.125, 0.251) },
  u_ambientIntensity:  { value: 0.3 },
  u_fillLightPos:      { value: new THREE.Vector3(-1.5, -0.5, 2) },
  u_fillLightColor:    { value: new THREE.Vector3(0.753, 0.816, 1.0) },
  u_fillLightIntensity:{ value: 0.6 },
  u_sssColor:          { value: new THREE.Vector3(...preset.sss) },
  u_sssIntensity:      { value: DEFAULTS.sssIntensity },
  u_sssDistortion:     { value: DEFAULTS.sssDistortion },
  u_sssPower:          { value: DEFAULTS.sssPower },
  u_skinBaseColor:     { value: new THREE.Vector3(...preset.base) },
  u_roughness:         { value: DEFAULTS.roughness },
  u_specularIntensity: { value: DEFAULTS.specularIntensity },
  u_wrapFactor:        { value: DEFAULTS.wrapFactor },
  u_time:              { value: 0.0 },
};

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms,
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// Wireframe overlay
const wireframeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.08 });
const wireframeMesh = new THREE.Mesh(geometry, wireframeMat);
wireframeMesh.visible = false;
scene.add(wireframeMesh);

// Sliders
const sssIntSlider = document.getElementById('sss-intensity-slider');
const sssDistSlider = document.getElementById('sss-distortion-slider');
const roughnessSlider = document.getElementById('roughness-slider');
const wrapSlider = document.getElementById('wrap-factor-slider');

sssIntSlider.addEventListener('input', () => {
  uniforms.u_sssIntensity.value = parseFloat(sssIntSlider.value);
  document.getElementById('sss-intensity-val').textContent = parseFloat(sssIntSlider.value).toFixed(2);
});
sssDistSlider.addEventListener('input', () => {
  uniforms.u_sssDistortion.value = parseFloat(sssDistSlider.value);
  document.getElementById('sss-distortion-val').textContent = parseFloat(sssDistSlider.value).toFixed(2);
});
roughnessSlider.addEventListener('input', () => {
  uniforms.u_roughness.value = parseFloat(roughnessSlider.value);
  document.getElementById('roughness-val').textContent = parseFloat(roughnessSlider.value).toFixed(2);
});
wrapSlider.addEventListener('input', () => {
  uniforms.u_wrapFactor.value = parseFloat(wrapSlider.value);
  document.getElementById('wrap-factor-val').textContent = parseFloat(wrapSlider.value).toFixed(2);
});

// Wireframe button
document.getElementById('toggle-wireframe').addEventListener('click', () => {
  wireframeActive = !wireframeActive;
  wireframeMesh.visible = wireframeActive;
});

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  currentPreset = name;
  uniforms.u_skinBaseColor.value.set(...p.base);
  uniforms.u_sssColor.value.set(...p.sss);
}

function resetDefaults() {
  uniforms.u_sssIntensity.value = DEFAULTS.sssIntensity;
  uniforms.u_sssDistortion.value = DEFAULTS.sssDistortion;
  uniforms.u_roughness.value = DEFAULTS.roughness;
  uniforms.u_wrapFactor.value = DEFAULTS.wrapFactor;
  uniforms.u_sssPower.value = DEFAULTS.sssPower;
  uniforms.u_specularIntensity.value = DEFAULTS.specularIntensity;

  sssIntSlider.value = DEFAULTS.sssIntensity;
  sssDistSlider.value = DEFAULTS.sssDistortion;
  roughnessSlider.value = DEFAULTS.roughness;
  wrapSlider.value = DEFAULTS.wrapFactor;

  document.getElementById('sss-intensity-val').textContent = DEFAULTS.sssIntensity.toFixed(2);
  document.getElementById('sss-distortion-val').textContent = DEFAULTS.sssDistortion.toFixed(2);
  document.getElementById('roughness-val').textContent = DEFAULTS.roughness.toFixed(2);
  document.getElementById('wrap-factor-val').textContent = DEFAULTS.wrapFactor.toFixed(2);

  lightOrbitActive = false;
  uniforms.u_lightPos.value.set(2, 1, 3);

  applyPreset('fair');
}

// Keyboard
window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'l') {
    lightOrbitActive = !lightOrbitActive;
    if (!lightOrbitActive) {
      uniforms.u_lightPos.value.set(2, 1, 3);
    }
  } else if (key === 'r') {
    resetDefaults();
  } else if (key === '1') {
    applyPreset('fair');
  } else if (key === '2') {
    applyPreset('medium');
  } else if (key === '3') {
    applyPreset('deep');
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// State
window.__3D_STATE__ = {};

const clock = new THREE.Clock();

function updateHUD() {
  document.getElementById('hud-sss-int').textContent = uniforms.u_sssIntensity.value.toFixed(2);
  document.getElementById('hud-distortion').textContent = uniforms.u_sssDistortion.value.toFixed(2);
  document.getElementById('hud-roughness').textContent = uniforms.u_roughness.value.toFixed(2);
  document.getElementById('hud-wrap').textContent = uniforms.u_wrapFactor.value.toFixed(2);
  document.getElementById('hud-preset').textContent = PRESETS[currentPreset].label;
  document.getElementById('hud-orbit').textContent = lightOrbitActive ? 'ON' : 'OFF';
  document.getElementById('hud-wireframe').textContent = wireframeActive ? 'ON' : 'OFF';
}

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();
  uniforms.u_time.value = elapsed;

  if (lightOrbitActive) {
    uniforms.u_lightPos.value.x = Math.cos(elapsed) * 3.5;
    uniforms.u_lightPos.value.z = Math.sin(elapsed) * 3.5;
    uniforms.u_lightPos.value.y = 1;
  }

  controls.update();
  renderer.render(scene, camera);

  frameCount++;

  const lp = uniforms.u_lightPos.value;
  const bc = uniforms.u_skinBaseColor.value;
  const sc = uniforms.u_sssColor.value;

  window.__3D_STATE__ = {
    sssIntensity: uniforms.u_sssIntensity.value,
    sssDistortion: uniforms.u_sssDistortion.value,
    roughness: uniforms.u_roughness.value,
    wrapFactor: uniforms.u_wrapFactor.value,
    skinBaseColor: [bc.x, bc.y, bc.z],
    sssColor: [sc.x, sc.y, sc.z],
    skinPreset: currentPreset,
    lightOrbitActive: lightOrbitActive,
    lightPosition: [lp.x, lp.y, lp.z],
    specularIntensity: uniforms.u_specularIntensity.value,
    wireframeActive: wireframeActive,
    fresnelActive: true,
    meshVertexCount: geometry.attributes.position.count,
    elapsedTime: elapsed,
    frameCount: frameCount,
    fillLightIntensity: uniforms.u_fillLightIntensity.value,
    ambientIntensity: uniforms.u_ambientIntensity.value,
    sssPower: uniforms.u_sssPower.value,
  };

  updateHUD();
}

animate();
</script>
</body>
</html>
