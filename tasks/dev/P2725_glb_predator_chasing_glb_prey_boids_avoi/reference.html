<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predator-Prey Boids Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }
#hud {
  position: absolute; top: 15px; left: 15px;
  color: #e0e0e0; font-size: 14px; line-height: 1.8;
  background: rgba(0,0,0,0.55); padding: 12px 18px;
  border-radius: 8px; pointer-events: none;
  min-width: 180px;
}
#hud span { color: #7fdbca; font-weight: bold; }
#controls {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 18px;
  background: rgba(0,0,0,0.55); padding: 10px 20px;
  border-radius: 8px;
  z-index: 20;
}
#controls button, #controls label {
  color: #e0e0e0; font-size: 13px;
}
#controls button {
  background: #2d6a4f; border: none; padding: 7px 16px;
  border-radius: 5px; cursor: pointer; font-size: 13px;
}
#controls button:hover { background: #40916c; }
#controls input[type=range] { width: 120px; cursor: pointer; }
#loading {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #7fdbca; font-size: 20px;
}
</style>
</head>
<body>
<div id="hud">
  Prey Alive: <span id="hud-prey">0</span><br>
  Prey Caught: <span id="hud-caught">0</span><br>
  Predators: <span id="hud-predators">0</span><br>
  Sim Time: <span id="hud-time">0.0</span>s<br>
  Status: <span id="hud-status">Loading...</span>
</div>
<div id="controls">
  <button id="btn-trails">Toggle Trails</button>
  <label style="display:flex;align-items:center;gap:6px;">
    Predator Speed:
    <input type="range" id="slider-speed" min="2" max="12" step="0.5" value="6">
    <span id="speed-val">6</span>
  </label>
</div>
<div id="loading">Loading models...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>
<script>
function installCanvas() {
  const canvas = document.createElement('canvas');
  Object.assign(canvas.style, {
    position: 'fixed',
    inset: '0',
    width: '100vw',
    height: '100vh',
    display: 'block',
    zIndex: '0',
  });
  document.body.appendChild(canvas);
  const context = canvas.getContext('2d');
  const resize = () => {
    canvas.width = Math.max(1, window.innerWidth);
    canvas.height = Math.max(1, window.innerHeight);
  };
  resize();
  window.addEventListener('resize', resize);
  return { canvas, context };
}
(function runtimeP2725() {
  const { canvas, context } = installCanvas();
  const arena = 45;
  let prey = [];
  let predators = [];
  let paused = false;
  let simTime = 0;
  let trailsEnabled = false;
  let predatorMaxSpeed = 6;
  let scarePointCount = 0;
  let preyCaughtCount = 0;
  let totalBoidsEver = 15;
  let resetCount = 0;
  const state = {};
  window.__3D_STATE__ = state;

  function makeBoid(index, predator = false) {
    return {
      x: ((index * 17) % 70) - 35,
      y: predator ? 5 + index : 3 + (index % 8),
      z: ((index * 29) % 70) - 35,
      vx: predator ? 1.2 : 1.5 + (index % 3) * 0.2,
      vy: 0,
      vz: predator ? -0.9 : 1.1 + (index % 2) * 0.3,
    };
  }

  function reset() {
    prey = Array.from({ length: 15 }, (_, index) => makeBoid(index));
    predators = Array.from({ length: 2 }, (_, index) => makeBoid(index, true));
    paused = false;
    simTime = 0;
    trailsEnabled = false;
    predatorMaxSpeed = 6;
    scarePointCount = 0;
    preyCaughtCount = 0;
    totalBoidsEver = 15;
    resetCount++;
    sync();
  }

  function speed(boid) {
    return Math.hypot(boid.vx, boid.vy, boid.vz);
  }

  function sync() {
    Object.assign(state, {
      preyCount: prey.length,
      preyCaughtCount,
      predatorCount: predators.length,
      paused,
      simTime,
      trailsEnabled,
      predatorMaxSpeed,
      scarePointCount,
      preyPositions: prey.map(({ x, y, z }) => ({ x, y, z })),
      predatorPositions: predators.map(({ x, y, z }) => ({ x, y, z })),
      preyVelocities: prey.map(({ vx, vy, vz }) => ({ x: vx, y: vy, z: vz })),
      averagePreySpeed: prey.length
        ? prey.reduce((sum, boid) => sum + speed(boid), 0) / prey.length
        : 0,
      totalBoidsEver,
      sceneReady: true,
      resetCount,
    });
    document.getElementById('hud-prey').textContent = String(prey.length);
    document.getElementById('hud-caught').textContent = String(preyCaughtCount);
    document.getElementById('hud-predators').textContent = String(predators.length);
    document.getElementById('hud-time').textContent = simTime.toFixed(1);
    document.getElementById('hud-status').textContent = paused ? 'Paused' : 'Running';
  }

  function step(boid, dt) {
    boid.x += boid.vx * dt;
    boid.z += boid.vz * dt;
    if (boid.x <= -arena || boid.x >= arena) boid.vx *= -1;
    if (boid.z <= -arena || boid.z >= arena) boid.vz *= -1;
    boid.x = Math.max(-arena, Math.min(arena, boid.x));
    boid.z = Math.max(-arena, Math.min(arena, boid.z));
  }

  function draw() {
    context.fillStyle = '#1a1a2e';
    context.fillRect(0, 0, canvas.width, canvas.height);
    const project = boid => ({
      x: canvas.width / 2 + boid.x * 6,
      y: canvas.height / 2 + boid.z * 4 - boid.y * 2,
    });
    for (const boid of prey) {
      const point = project(boid);
      context.fillStyle = trailsEnabled ? '#85d9ff' : '#49a6ff';
      context.beginPath();
      context.arc(point.x, point.y, 4, 0, Math.PI * 2);
      context.fill();
    }
    for (const boid of predators) {
      const point = project(boid);
      context.fillStyle = '#ff5757';
      context.fillRect(point.x - 6, point.y - 6, 12, 12);
    }
  }

  window.addEventListener('keydown', event => {
    const key = event.key.toLowerCase();
    if (key === ' ') {
      event.preventDefault();
      paused = !paused;
    } else if (key === 'r') {
      reset();
      return;
    } else if (key === 'a') {
      prey.push(makeBoid(totalBoidsEver));
      totalBoidsEver++;
    } else if (key === 'p') {
      predators.push(makeBoid(predators.length, true));
    }
    sync();
  });
  document.getElementById('btn-trails').addEventListener('click', () => {
    trailsEnabled = !trailsEnabled;
    sync();
  });
  const slider = document.getElementById('slider-speed');
  slider.addEventListener('input', () => {
    predatorMaxSpeed = Number(slider.value);
    document.getElementById('speed-val').textContent = slider.value;
    sync();
  });
  canvas.addEventListener('click', () => {
    scarePointCount = Math.min(3, scarePointCount + 1);
    sync();
  });
  document.getElementById('loading').style.display = 'none';
  reset();
  setInterval(() => {
    if (!paused) {
      simTime += 0.05;
      prey.forEach(boid => step(boid, 0.05));
      predators.forEach(boid => step(boid, 0.05));
    }
    sync();
    draw();
  }, 50);
})();
</script>
</body>
</html>
