<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Sneaker Customizer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #ffffff;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .panel {
      position: fixed;
      z-index: 10;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(10, 10, 24, 0.72);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    #part-panel {
      top: 24px;
      left: 24px;
      width: 160px;
    }

    #color-panel {
      top: 24px;
      right: 24px;
      width: 184px;
    }

    #actions-panel {
      right: 24px;
      bottom: 64px;
      width: 184px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #b8c1ec;
      text-transform: uppercase;
      font-weight: 700;
    }

    .part-button,
    .action-button {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 8px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      font-weight: 650;
      text-align: left;
    }

    .part-button:hover,
    .action-button:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .part-button.active {
      background: linear-gradient(135deg, rgba(92, 107, 255, 0.65), rgba(255, 0, 255, 0.35));
      border-color: rgba(184, 193, 236, 0.85);
      box-shadow: 0 0 18px rgba(92, 107, 255, 0.32);
    }

    .action-button {
      margin: 0;
      text-align: center;
    }

    #btn-save {
      background: rgba(42, 157, 143, 0.28);
    }

    #btn-load {
      background: rgba(69, 123, 157, 0.28);
    }

    #btn-reset {
      background: rgba(230, 57, 70, 0.24);
    }

    #btn-rotate {
      background: rgba(244, 162, 97, 0.25);
    }

    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      gap: 12px;
      justify-content: center;
    }

    .color-swatch {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.34);
      cursor: pointer;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.18), 0 8px 18px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .color-swatch:hover {
      transform: scale(1.08);
      border-color: #ffffff;
    }

    #status-bar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 12;
      transform: translateX(-50%);
      min-width: min(720px, calc(100vw - 48px));
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(10, 10, 24, 0.72);
      color: #eaeaea;
      text-align: center;
      font-size: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.78);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      #part-panel {
        top: 12px;
        left: 12px;
        width: 132px;
        padding: 12px;
      }

      #color-panel {
        top: 12px;
        right: 12px;
        width: 148px;
        padding: 12px;
      }

      #actions-panel {
        right: 12px;
        bottom: 70px;
        width: 148px;
        padding: 12px;
      }

      .swatch-grid {
        grid-template-columns: repeat(3, 36px);
        gap: 10px;
      }

      .color-swatch {
        width: 36px;
        height: 36px;
      }

      .part-button,
      .action-button {
        padding: 8px 9px;
        font-size: 13px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Loading Product Model...</div>

  <aside id="part-panel" class="panel" aria-label="Part selector">
    <h2>Parts</h2>
    <button id="btn-part-0" class="part-button active" type="button">Part 0</button>
    <button id="btn-part-1" class="part-button" type="button">Part 1</button>
    <button id="btn-part-2" class="part-button" type="button">Part 2</button>
    <button id="btn-part-3" class="part-button" type="button">Part 3</button>
    <button id="btn-part-4" class="part-button" type="button">Part 4</button>
  </aside>

  <aside id="color-panel" class="panel" aria-label="Color palette">
    <h2>Colors</h2>
    <div class="swatch-grid">
      <button id="color-ff0000" class="color-swatch" type="button" title="Red" aria-label="Red" style="background:#ff0000"></button>
      <button id="color-00ff00" class="color-swatch" type="button" title="Green" aria-label="Green" style="background:#00ff00"></button>
      <button id="color-0000ff" class="color-swatch" type="button" title="Blue" aria-label="Blue" style="background:#0000ff"></button>
      <button id="color-ffff00" class="color-swatch" type="button" title="Yellow" aria-label="Yellow" style="background:#ffff00"></button>
      <button id="color-ff00ff" class="color-swatch" type="button" title="Magenta" aria-label="Magenta" style="background:#ff00ff"></button>
      <button id="color-ffffff" class="color-swatch" type="button" title="White" aria-label="White" style="background:#ffffff"></button>
    </div>
  </aside>

  <aside id="actions-panel" class="panel" aria-label="Actions">
    <h2>Config</h2>
    <button id="btn-save" class="action-button" type="button">Save State</button>
    <button id="btn-load" class="action-button" type="button">Load State</button>
    <button id="btn-reset" class="action-button" type="button">Reset</button>
    <button id="btn-rotate" class="action-button" type="button">Rotate Toggle</button>
  </aside>

  <div id="status-bar">Ready. Select a part and choose a color.</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const DEFAULT_COLORS = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff'];
    const COLOR_OPTIONS = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#ffffff'];

    window.__3D_STATE__ = {
      modelLoaded: false,
      selectedPart: 0,
      partColors: [...DEFAULT_COLORS],
      autoRotate: false,
      rotationAngle: 0,
      savedConfig: localStorage.getItem('sneaker_config'),
      lastAction: 'Ready. Select a part and choose a color.',
      cameraDistance: 0,
      meshCount: 0,
      partsAvailable: 0
    };

    const app = document.getElementById('app');
    const statusBar = document.getElementById('status-bar');
    const loading = document.getElementById('loading');
    const rotateButton = document.getElementById('btn-rotate');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 3);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    const fillLight = new THREE.DirectionalLight(0x8899ff, 0.35);
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(6, 24, 0x5c6bff, 0x333650);
    gridHelper.position.y = -0.78;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.28;
    scene.add(gridHelper);

    let modelRoot = new THREE.Group();
    scene.add(modelRoot);

    const allMeshes = [];
    const customizableParts = [];

    function setStatus(message) {
      statusBar.textContent = message;
      window.__3D_STATE__.lastAction = message;
    }

    function normalizeHex(hex) {
      if (typeof hex !== 'string') return '#ffffff';
      const clean = hex.trim().toLowerCase();
      if (/^#[0-9a-f]{6}$/.test(clean)) return clean;
      if (/^[0-9a-f]{6}$/.test(clean)) return `#${clean}`;
      return '#ffffff';
    }

    function createCustomMaterial(originalMaterial, color = '#ffffff') {
      const source = Array.isArray(originalMaterial) ? originalMaterial[0] : originalMaterial;
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.55,
        metalness: 0.08
      });

      if (source) {
        if (source.map) {
          mat.map = source.map;
          mat.map.colorSpace = THREE.SRGBColorSpace;
        }
        if (typeof source.roughness === 'number') mat.roughness = source.roughness;
        if (typeof source.metalness === 'number') mat.metalness = source.metalness;
        if (source.normalMap) mat.normalMap = source.normalMap;
        if (source.transparent) {
          mat.transparent = source.transparent;
          mat.opacity = source.opacity;
        }
      }

      mat.emissive = new THREE.Color(0x000000);
      mat.emissiveIntensity = 0;
      return mat;
    }

    function applyMaterialColor(partIndex, hexColor) {
      const color = normalizeHex(hexColor);
      window.__3D_STATE__.partColors[partIndex] = color;

      const mesh = customizableParts[partIndex];
      if (!mesh) return;

      if (Array.isArray(mesh.material)) {
        mesh.material.forEach((mat) => {
          if (mat && mat.color) mat.color.set(color);
        });
      } else if (mesh.material && mesh.material.color) {
        mesh.material.color.set(color);
      }

      updateHighlight();
    }

    function updatePartButtons() {
      for (let i = 0; i < 5; i++) {
        const btn = document.getElementById(`btn-part-${i}`);
        btn.classList.toggle('active', i === window.__3D_STATE__.selectedPart);
        btn.title = i < window.__3D_STATE__.partsAvailable
          ? `Customize Part ${i}`
          : `Part ${i} is tracked but no mesh was found for it`;
      }
    }

    function updateHighlight() {
      customizableParts.forEach((mesh, index) => {
        const isSelected = index === window.__3D_STATE__.selectedPart;
        const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];

        materials.forEach((mat) => {
          if (!mat) return;

          if ('emissive' in mat) {
            mat.emissive.set(isSelected ? 0x444466 : 0x000000);
            mat.emissiveIntensity = isSelected ? 0.35 : 0;
          }

          mat.needsUpdate = true;
        });
      });
    }

    function selectPart(index) {
      window.__3D_STATE__.selectedPart = index;
      updatePartButtons();
      updateHighlight();

      if (index < window.__3D_STATE__.partsAvailable) {
        setStatus(`Selected Part ${index}`);
      } else {
        setStatus(`Selected Part ${index} - no mesh available in loaded model`);
      }
    }

    function applySelectedColor(hexColor) {
      const index = window.__3D_STATE__.selectedPart;
      const color = normalizeHex(hexColor);
      applyMaterialColor(index, color);
      setStatus(`Color applied: ${color} to Part ${index}`);
    }

    function saveState() {
      const json = JSON.stringify(window.__3D_STATE__.partColors);
      localStorage.setItem('sneaker_config', json);
      window.__3D_STATE__.savedConfig = json;
      setStatus('Saved configuration');
    }

    function loadState() {
      const json = localStorage.getItem('sneaker_config');

      if (!json) {
        window.__3D_STATE__.savedConfig = null;
        setStatus('No saved configuration found');
        return;
      }

      try {
        const parsed = JSON.parse(json);
        let colors;

        if (Array.isArray(parsed)) {
          colors = parsed;
        } else if (parsed && Array.isArray(parsed.partColors)) {
          colors = parsed.partColors;
        }

        if (!colors) throw new Error('Invalid configuration');

        for (let i = 0; i < 5; i++) {
          applyMaterialColor(i, normalizeHex(colors[i] || '#ffffff'));
        }

        window.__3D_STATE__.savedConfig = json;
        setStatus('Loaded configuration');
      } catch (error) {
        console.warn(error);
        setStatus('Failed to load configuration');
      }
    }

    function resetState() {
      for (let i = 0; i < 5; i++) {
        applyMaterialColor(i, '#ffffff');
      }
      setStatus('Reset to defaults');
    }

    function toggleRotation() {
      window.__3D_STATE__.autoRotate = !window.__3D_STATE__.autoRotate;
      rotateButton.textContent = window.__3D_STATE__.autoRotate ? 'Stop Rotation' : 'Rotate Toggle';
      setStatus(window.__3D_STATE__.autoRotate ? 'Auto-rotation enabled' : 'Auto-rotation disabled');
    }

    for (let i = 0; i < 5; i++) {
      document.getElementById(`btn-part-${i}`).addEventListener('click', () => selectPart(i));
    }

    COLOR_OPTIONS.forEach((hex) => {
      const id = `color-${hex.slice(1)}`;
      document.getElementById(id).addEventListener('click', () => applySelectedColor(hex));
    });

    document.getElementById('btn-save').addEventListener('click', saveState);
    document.getElementById('btn-load').addEventListener('click', loadState);
    document.getElementById('btn-reset').addEventListener('click', resetState);
    rotateButton.addEventListener('click', toggleRotation);

    const loader = new GLTFLoader();

    loader.load(
      'WaterBottle.glb',
      (gltf) => {
        scene.remove(modelRoot);
        modelRoot = gltf.scene || new THREE.Group();

        allMeshes.length = 0;
        customizableParts.length = 0;

        modelRoot.traverse((child) => {
          if (child.isMesh) {
            allMeshes.push(child);
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        window.__3D_STATE__.meshCount = allMeshes.length;
        window.__3D_STATE__.partsAvailable = Math.min(allMeshes.length, 5);

        for (let i = 0; i < window.__3D_STATE__.partsAvailable; i++) {
          const mesh = allMeshes[i];
          mesh.material = createCustomMaterial(mesh.material, window.__3D_STATE__.partColors[i]);
          customizableParts.push(mesh);
        }

        const box = new THREE.Box3().setFromObject(modelRoot);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        modelRoot.position.sub(center);

        const maxDimension = Math.max(size.x, size.y, size.z) || 1;
        const targetSize = 1.5;
        const scale = targetSize / maxDimension;
        modelRoot.scale.setScalar(scale);

        const scaledBox = new THREE.Box3().setFromObject(modelRoot);
        const scaledCenter = new THREE.Vector3();
        scaledBox.getCenter(scaledCenter);
        modelRoot.position.sub(scaledCenter);

        scene.add(modelRoot);

        for (let i = 0; i < 5; i++) {
          applyMaterialColor(i, window.__3D_STATE__.partColors[i]);
        }

        window.__3D_STATE__.modelLoaded = true;
        loading.style.display = 'none';
        updatePartButtons();
        updateHighlight();

        setStatus(`Model loaded: ${window.__3D_STATE__.meshCount} mesh(es), ${window.__3D_STATE__.partsAvailable} customizable part(s)`);
      },
      undefined,
      (error) => {
        console.error('Failed to load WaterBottle.glb:', error);

        const fallback = new THREE.Group();

        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.32, 0.38, 1.35, 48),
          createCustomMaterial(null, '#ffffff')
        );
        body.position.y = 0;

        const cap = new THREE.Mesh(
          new THREE.CylinderGeometry(0.22, 0.22, 0.22, 40),
          createCustomMaterial(null, '#ffffff')
        );
        cap.position.y = 0.78;

        const band1 = new THREE.Mesh(
          new THREE.TorusGeometry(0.335, 0.025, 12, 48),
          createCustomMaterial(null, '#ffffff')
        );
        band1.position.y = 0.38;
        band1.rotation.x = Math.PI / 2;

        const band2 = new THREE.Mesh(
          new THREE.TorusGeometry(0.36, 0.025, 12, 48),
          createCustomMaterial(null, '#ffffff')
        );
        band2.position.y = -0.46;
        band2.rotation.x = Math.PI / 2;

        const label = new THREE.Mesh(
          new THREE.BoxGeometry(0.03, 0.55, 0.42),
          createCustomMaterial(null, '#ffffff')
        );
        label.position.set(0, -0.05, 0.34);

        fallback.add(body, cap, band1, band2, label);
        modelRoot = fallback;
        scene.add(modelRoot);

        allMeshes.push(body, cap, band1, band2, label);
        customizableParts.push(body, cap, band1, band2, label);

        window.__3D_STATE__.meshCount = 5;
        window.__3D_STATE__.partsAvailable = 5;
        window.__3D_STATE__.modelLoaded = true;

        loading.style.display = 'none';

        for (let i = 0; i < 5; i++) {
          applyMaterialColor(i, window.__3D_STATE__.partColors[i]);
        }

        updatePartButtons();
        updateHighlight();
        setStatus('WaterBottle.glb not found. Fallback product model loaded.');
      }
    );

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);

      if (window.__3D_STATE__.autoRotate && modelRoot) {
        modelRoot.rotation.y += 0.01;
        window.__3D_STATE__.rotationAngle += 0.01;
      }

      controls.update();
      window.__3D_STATE__.cameraDistance = camera.position.distanceTo(new THREE.Vector3(0, 0, 0));

      renderer.render(scene, camera);
    }

    updatePartButtons();
    animate();
  </script>
</body>
</html>
