<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paint Visualizer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #1a1a2e;
    }

    canvas {
      display: block;
    }

    #control-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 290px;
      background: rgba(20, 20, 28, 0.78);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px;
      box-sizing: border-box;
      backdrop-filter: blur(6px);
    }

    #control-panel h2 {
      margin: 0 0 12px 0;
      font-size: 20px;
      font-weight: 700;
    }

    .section {
      margin-bottom: 14px;
    }

    .label {
      font-size: 13px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .swatch-row, .finish-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .swatch-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      cursor: pointer;
      outline: none;
      box-sizing: border-box;
    }

    .swatch-btn.active {
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
    }

    .finish-btn, #auto-rotate-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    .finish-btn.active, #auto-rotate-btn.active {
      background: #3d6df2;
      border-color: #7ea0ff;
    }

    #time-slider {
      width: 100%;
      margin-top: 6px;
    }

    #time-label {
      margin-top: 6px;
      font-size: 13px;
      color: #d8e6ff;
    }

    #info {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="control-panel">
    <h2>Paint Visualizer</h2>

    <div class="section">
      <div class="label">Paint Color</div>
      <div class="swatch-row" id="swatch-row"></div>
    </div>

    <div class="section">
      <div class="label">Finish Type</div>
      <div class="finish-row">
        <button class="finish-btn" id="finish-0">Glossy</button>
        <button class="finish-btn" id="finish-1">Matte</button>
        <button class="finish-btn" id="finish-2">Metallic</button>
      </div>
    </div>

    <div class="section">
      <div class="label">Time of Day</div>
      <input id="time-slider" type="range" min="0" max="100" value="50" />
      <div id="time-label">12:00 PM</div>
    </div>

    <div class="section">
      <button id="auto-rotate-btn">Rotate Model</button>
    </div>
  </div>

  <div id="info">Keys: 1-5 colors, G/M/L finish, R rotate, T cycle time</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js';

    const PAINTS = [
      { name: 'Ruby Red', color: '#CC0000' },
      { name: 'Ocean Blue', color: '#0055AA' },
      { name: 'Forest Green', color: '#228B22' },
      { name: 'Midnight Black', color: '#111111' },
      { name: 'Pearl White', color: '#F5F5F5' }
    ];

    const FINISHES = [
      { name: 'Glossy', roughness: 0.15, metalness: 0.8 },
      { name: 'Matte', roughness: 0.8, metalness: 0.2 },
      { name: 'Metallic', roughness: 0.25, metalness: 0.95 }
    ];

    let currentPaintIndex = 0;
    let currentFinishIndex = 0;
    let autoRotate = false;
    let frameCount = 0;
    let modelRoot = null;
    let modelLoaded = false;
    let timeSliderValue = 50;
    let currentSunAngle = Math.PI / 2;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87CEEB');

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = envTexture;

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5, 64),
      new THREE.MeshStandardMaterial({ color: '#444444', roughness: 0.9, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const hemiLight = new THREE.HemisphereLight('#87CEEB', '#444444', 0.4);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight('#FFFFFF', 1);
    sunLight.position.set(0, 8, 2);
    scene.add(sunLight);
    scene.add(sunLight.target);
    sunLight.target.position.set(0, 0.8, 0);

    const fillLight = new THREE.PointLight(0xffffff, 0.3, 20);
    fillLight.position.set(0, 4, 4);
    scene.add(fillLight);

    const swatchRow = document.getElementById('swatch-row');
    const timeSlider = document.getElementById('time-slider');
    const timeLabel = document.getElementById('time-label');
    const autoRotateBtn = document.getElementById('auto-rotate-btn');

    PAINTS.forEach((paint, index) => {
      const btn = document.createElement('button');
      btn.id = `swatch-${index}`;
      btn.className = 'swatch-btn';
      btn.style.background = paint.color;
      btn.title = paint.name;
      btn.addEventListener('click', () => setPaint(index));
      swatchRow.appendChild(btn);
    });

    document.getElementById('finish-0').addEventListener('click', () => setFinish(0));
    document.getElementById('finish-1').addEventListener('click', () => setFinish(1));
    document.getElementById('finish-2').addEventListener('click', () => setFinish(2));

    autoRotateBtn.addEventListener('click', () => {
      autoRotate = !autoRotate;
      updateUI();
    });

    timeSlider.addEventListener('input', () => {
      timeSliderValue = clampNumber(parseInt(timeSlider.value, 10), 0, 100, 50);
      updateTimeOfDay();
      updateUI();
    });

    function setPaint(index) {
      currentPaintIndex = clampNumber(index, 0, PAINTS.length - 1, 0);
      applyPaintMaterial();
      updateUI();
    }

    function setFinish(index) {
      currentFinishIndex = clampNumber(index, 0, FINISHES.length - 1, 0);
      applyPaintMaterial();
      updateUI();
    }

    function updateUI() {
      PAINTS.forEach((_, i) => {
        const el = document.getElementById(`swatch-${i}`);
        if (el) el.classList.toggle('active', i === currentPaintIndex);
      });

      FINISHES.forEach((_, i) => {
        const el = document.getElementById(`finish-${i}`);
        if (el) el.classList.toggle('active', i === currentFinishIndex);
      });

      autoRotateBtn.classList.toggle('active', autoRotate);
      timeSlider.value = String(timeSliderValue);
      timeLabel.textContent = formatTimeLabel(timeSliderValue);
    }

    function formatTimeLabel(value) {
      const v = clampNumber(value, 0, 100, 50);
      const totalMinutes = 6 * 60 + (12 * 60) * (v / 100);
      let hours = Math.floor(totalMinutes / 60);
      const minutes = Math.round(totalMinutes % 60);
      const suffix = hours >= 12 ? 'PM' : 'AM';
      if (hours > 12) hours -= 12;
      if (hours === 0) hours = 12;
      const mm = String(minutes).padStart(2, '0');
      return `${hours}:${mm} ${suffix}`;
    }

    function updateTimeOfDay() {
      const t = clampNumber(timeSliderValue / 100, 0, 1, 0.5);
      currentSunAngle = 0.05 + t * (Math.PI - 0.1);

      const x = 8 * Math.cos(currentSunAngle);
      const y = 8 * Math.sin(currentSunAngle);
      const z = 2;

      sunLight.position.set(x, y, z);

      const warm = new THREE.Color('#FF8C42');
      const noon = new THREE.Color('#FFFFFF');
      const noonFactor = Math.max(0, Math.sin(currentSunAngle));
      sunLight.color.copy(warm).lerp(noon, noonFactor);

      sunLight.intensity = Math.max(0.1, noonFactor);

      const bgNightish = new THREE.Color('#1a1a2e');
      const bgNoon = new THREE.Color('#87CEEB');
      scene.background = bgNightish.clone().lerp(bgNoon, noonFactor);
    }

    function applyPaintMaterial() {
      if (!modelRoot) return;

      const paint = PAINTS[currentPaintIndex] || PAINTS[0];
      const finish = FINISHES[currentFinishIndex] || FINISHES[0];

      modelRoot.traverse((child) => {
        if (child.isMesh) {
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose && m.dispose());
            } else if (child.material.dispose) {
              child.material.dispose();
            }
          }

          child.material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(paint.color),
            metalness: finish.metalness,
            roughness: finish.roughness,
            envMapIntensity: 1.0
          });
          child.castShadow = false;
          child.receiveShadow = false;
        }
      });

      modelLoaded = true;
    }

    const loader = new GLTFLoader();
    loader.load(
      'Duck.glb',
      (gltf) => {
        modelRoot = gltf.scene;
        modelRoot.position.set(0, 0, 0);
        modelRoot.scale.set(2, 2, 2);
        scene.add(modelRoot);
        applyPaintMaterial();
      },
      undefined,
      () => {
        const fallback = new THREE.Mesh(
          new THREE.SphereGeometry(1, 32, 32),
          new THREE.MeshStandardMaterial({ color: PAINTS[0].color, metalness: 0.8, roughness: 0.15, envMapIntensity: 1.0 })
        );
        fallback.position.set(0, 1, 0);
        modelRoot = new THREE.Group();
        modelRoot.add(fallback);
        modelRoot.position.set(0, 0, 0);
        modelRoot.scale.set(1.2, 1.2, 1.2);
        scene.add(modelRoot);
        applyPaintMaterial();
      }
    );

    function clampNumber(value, min, max, fallback) {
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    function cycleTimePreset() {
      const presets = [15, 50, 85];
      const current = timeSliderValue;
      let next = presets[0];
      for (let i = 0; i < presets.length; i++) {
        if (Math.abs(current - presets[i]) < 1) {
          next = presets[(i + 1) % presets.length];
          timeSliderValue = next;
          updateTimeOfDay();
          updateUI();
          return;
        }
      }
      if (current < 32.5) next = 50;
      else if (current < 67.5) next = 85;
      else next = 15;
      timeSliderValue = next;
      updateTimeOfDay();
      updateUI();
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key;

      if (key >= '1' && key <= '5') {
        setPaint(parseInt(key, 10) - 1);
      } else if (key === 'g' || key === 'G') {
        setFinish(0);
      } else if (key === 'm' || key === 'M') {
        setFinish(1);
      } else if (key === 'l' || key === 'L') {
        setFinish(2);
      } else if (key === 'r' || key === 'R') {
        autoRotate = !autoRotate;
        updateUI();
      } else if (key === 't' || key === 'T') {
        cycleTimePreset();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.__3D_STATE__ = {
      modelLoaded: false,
      currentPaintIndex: 0,
      currentPaintName: PAINTS[0].name,
      currentPaintColor: PAINTS[0].color,
      currentFinishIndex: 0,
      currentFinishName: FINISHES[0].name,
      materialRoughness: FINISHES[0].roughness,
      materialMetalness: FINISHES[0].metalness,
      timeSliderValue: 50,
      sunAngle: Math.PI / 2,
      sunPositionY: 8,
      sunIntensity: 1,
      autoRotate: false,
      modelRotationY: 0,
      frameCount: 0
    };

    const clock = new THREE.Clock();

    function updateState() {
      const paint = PAINTS[currentPaintIndex] || PAINTS[0];
      const finish = FINISHES[currentFinishIndex] || FINISHES[0];
      const rotationY = modelRoot ? clampNumber(modelRoot.rotation.y, -1e9, 1e9, 0) : 0;

      window.__3D_STATE__.modelLoaded = !!modelLoaded;
      window.__3D_STATE__.currentPaintIndex = clampNumber(currentPaintIndex, 0, 4, 0);
      window.__3D_STATE__.currentPaintName = paint.name;
      window.__3D_STATE__.currentPaintColor = paint.color;
      window.__3D_STATE__.currentFinishIndex = clampNumber(currentFinishIndex, 0, 2, 0);
      window.__3D_STATE__.currentFinishName = finish.name;
      window.__3D_STATE__.materialRoughness = clampNumber(finish.roughness, 0, 1, 0.15);
      window.__3D_STATE__.materialMetalness = clampNumber(finish.metalness, 0, 1, 0.8);
      window.__3D_STATE__.timeSliderValue = clampNumber(timeSliderValue, 0, 100, 50);
      window.__3D_STATE__.sunAngle = clampNumber(currentSunAngle, 0, Math.PI, Math.PI / 2);
      window.__3D_STATE__.sunPositionY = clampNumber(sunLight.position.y, -1000, 1000, 0);
      window.__3D_STATE__.sunIntensity = clampNumber(sunLight.intensity, 0, 100, 0.1);
      window.__3D_STATE__.autoRotate = !!autoRotate;
      window.__3D_STATE__.modelRotationY = rotationY;
      window.__3D_STATE__.frameCount = frameCount;
    }

    updateTimeOfDay();
    updateUI();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clampNumber(clock.getDelta(), 0, 0.1, 0.016);
      frameCount++;

      if (autoRotate && modelRoot) {
        modelRoot.rotation.y += 0.5 * delta;
        if (!Number.isFinite(modelRoot.rotation.y)) modelRoot.rotation.y = 0;
      }

      controls.update();
      updateState();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
