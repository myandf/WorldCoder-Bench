<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Hologram Shader</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: Arial, Helvetica, sans-serif;
      color: #cffff6;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 20, 28, 0.45);
      border: 1px solid rgba(0, 255, 204, 0.25);
      border-radius: 8px;
      color: #a8fff1;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
      white-space: pre-line;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 18px rgba(0,255,204,0.08);
    }

    #help {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 10px 12px;
      background: rgba(0, 20, 28, 0.35);
      border: 1px solid rgba(0, 255, 204, 0.18);
      border-radius: 8px;
      color: #88d9cc;
      font-size: 12px;
      line-height: 1.4;
      user-select: none;
    }

    #btn-reset {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 10px 18px;
      border: 1px solid rgba(0, 255, 204, 0.45);
      background: rgba(0, 255, 204, 0.08);
      color: #cffff6;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 16px rgba(0,255,204,0.12);
    }

    #btn-reset:hover {
      background: rgba(0, 255, 204, 0.14);
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="help">
    G: Glitch<br>
    S: Scanlines<br>
    F: Fresnel<br>
    R: Rotation<br>
    C: Color<br>
    Wheel: Scanline Speed
  </div>
  <button id="btn-reset">Reset</button>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050510, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);
    camera.lookAt(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0x003344, 0.3);
    scene.add(ambientLight);

    const grid = new THREE.GridHelper(6, 20, 0x00ffcc, 0x00ffcc);
    grid.position.y = -1.5;
    if (Array.isArray(grid.material)) {
      grid.material.forEach(m => {
        m.transparent = true;
        m.opacity = 0.2;
      });
    } else {
      grid.material.transparent = true;
      grid.material.opacity = 0.2;
    }
    scene.add(grid);

    const densityPresets = [
      { name: 'LOW', value: 15.0 },
      { name: 'MEDIUM', value: 30.0 },
      { name: 'HIGH', value: 60.0 }
    ];

    const fresnelPresets = [1.5, 2.5, 4.0];

    const colorPresets = [
      { name: 'CYAN', value: [0.0, 1.0, 0.8] },
      { name: 'MAGENTA', value: [1.0, 0.0, 0.8] },
      { name: 'GOLD', value: [1.0, 0.85, 0.0] }
    ];

    const defaults = {
      glitchActive: false,
      glitchAmount: 0.0,
      densityIndex: 1,
      fresnelIndex: 1,
      rotationEnabled: true,
      colorIndex: 0,
      scanlineSpeed: 2.0
    };

    const state = {
      glitchActive: defaults.glitchActive,
      densityIndex: defaults.densityIndex,
      fresnelIndex: defaults.fresnelIndex,
      rotationEnabled: defaults.rotationEnabled,
      colorIndex: defaults.colorIndex,
      flickerValue: 1.0,
      shaderCompiled: false
    };

    const uniforms = {
      time: { value: 0.0 },
      fresnelPower: { value: fresnelPresets[state.fresnelIndex] },
      scanlineFrequency: { value: densityPresets[state.densityIndex].value },
      scanlineSpeed: { value: defaults.scanlineSpeed },
      scanlineIntensity: { value: 0.4 },
      hologramColor: { value: new THREE.Vector3(...colorPresets[state.colorIndex].value) },
      glitchAmount: { value: defaults.glitchAmount },
      flicker: { value: 1.0 }
    };

    const vertexShader = `
      varying vec3 vPosition;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;

      uniform float glitchAmount;
      uniform float time;

      void main() {
        vPosition = position;
        vNormal = normalize(normalMatrix * normal);

        vec3 displaced = position;

        if (glitchAmount > 0.0) {
          float gate = step(0.65, sin(position.y * 18.0 + time * 12.0) * 0.5 + 0.5);
          displaced.x += glitchAmount * gate;
        }

        vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
        vWorldPosition = worldPos.xyz;

        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const fragmentShader = `
      varying vec3 vPosition;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;

      uniform float time;
      uniform float fresnelPower;
      uniform float scanlineFrequency;
      uniform float scanlineSpeed;
      uniform float scanlineIntensity;
      uniform vec3 hologramColor;
      uniform float flicker;

      void main() {
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(cameraPosition - vWorldPosition);

        float fresnel = pow(1.0 - abs(dot(viewDir, normal)), fresnelPower);

        float scan = sin(vWorldPosition.y * scanlineFrequency + time * scanlineSpeed);
        float scan01 = scan * 0.5 + 0.5;
        float scanBoost = mix(1.0 - scanlineIntensity, 1.0, scan01);

        vec3 color = hologramColor * (0.45 + fresnel * 1.6);
        color *= scanBoost;
        color *= flicker;

        float alpha = (0.22 + fresnel * 0.75);
        alpha *= mix(1.0 - scanlineIntensity, 1.0, scan01);
        alpha *= flicker;

        gl_FragColor = vec4(color, alpha);
      }
    `;

    const geometry = new THREE.TorusKnotGeometry(1, 0.35, 128, 32);
    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const hud = document.getElementById('hud');
    const resetBtn = document.getElementById('btn-reset');

    function applyStateToUniforms() {
      uniforms.glitchAmount.value = state.glitchActive ? 0.15 : 0.0;
      uniforms.scanlineFrequency.value = densityPresets[state.densityIndex].value;
      uniforms.fresnelPower.value = fresnelPresets[state.fresnelIndex];
      uniforms.hologramColor.value.set(...colorPresets[state.colorIndex].value);
    }

    function resetAll() {
      state.glitchActive = defaults.glitchActive;
      state.densityIndex = defaults.densityIndex;
      state.fresnelIndex = defaults.fresnelIndex;
      state.rotationEnabled = defaults.rotationEnabled;
      state.colorIndex = defaults.colorIndex;
      uniforms.scanlineSpeed.value = defaults.scanlineSpeed;
      applyStateToUniforms();
    }

    function updateHUD() {
      const density = densityPresets[state.densityIndex];
      const color = colorPresets[state.colorIndex];
      hud.textContent =
`Scanline Density: ${density.name}
Fresnel Power: ${uniforms.fresnelPower.value.toFixed(1)}
Glitch: ${state.glitchActive ? 'ON' : 'OFF'}
Rotation: ${state.rotationEnabled ? 'ON' : 'OFF'}
Color: ${color.name}
Scanline Speed: ${uniforms.scanlineSpeed.value.toFixed(1)}`;
    }

    window.__3D_STATE__ = {
      glitchActive: state.glitchActive,
      glitchAmount: uniforms.glitchAmount.value,
      scanlineDensity: densityPresets[state.densityIndex].name,
      scanlineFrequency: uniforms.scanlineFrequency.value,
      scanlineSpeed: uniforms.scanlineSpeed.value,
      fresnelPower: uniforms.fresnelPower.value,
      rotationEnabled: state.rotationEnabled,
      rotationAngle: mesh.rotation.y,
      colorName: colorPresets[state.colorIndex].name,
      colorRGB: [...colorPresets[state.colorIndex].value],
      elapsedTime: uniforms.time.value,
      meshExists: !!mesh,
      shaderCompiled: false,
      flickerValue: state.flickerValue
    };

    function syncExposedState() {
      window.__3D_STATE__.glitchActive = state.glitchActive;
      window.__3D_STATE__.glitchAmount = uniforms.glitchAmount.value;
      window.__3D_STATE__.scanlineDensity = densityPresets[state.densityIndex].name;
      window.__3D_STATE__.scanlineFrequency = uniforms.scanlineFrequency.value;
      window.__3D_STATE__.scanlineSpeed = uniforms.scanlineSpeed.value;
      window.__3D_STATE__.fresnelPower = uniforms.fresnelPower.value;
      window.__3D_STATE__.rotationEnabled = state.rotationEnabled;
      window.__3D_STATE__.rotationAngle = mesh.rotation.y;
      window.__3D_STATE__.colorName = colorPresets[state.colorIndex].name;
      window.__3D_STATE__.colorRGB = [...colorPresets[state.colorIndex].value];
      window.__3D_STATE__.elapsedTime = uniforms.time.value;
      window.__3D_STATE__.meshExists = !!mesh;
      window.__3D_STATE__.shaderCompiled = state.shaderCompiled;
      window.__3D_STATE__.flickerValue = state.flickerValue;
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'g') {
        state.glitchActive = !state.glitchActive;
        applyStateToUniforms();
      } else if (key === 's') {
        state.densityIndex = (state.densityIndex + 1) % densityPresets.length;
        applyStateToUniforms();
      } else if (key === 'f') {
        state.fresnelIndex = (state.fresnelIndex + 1) % fresnelPresets.length;
        applyStateToUniforms();
      } else if (key === 'r') {
        state.rotationEnabled = !state.rotationEnabled;
      } else if (key === 'c') {
        state.colorIndex = (state.colorIndex + 1) % colorPresets.length;
        applyStateToUniforms();
      }

      updateHUD();
      syncExposedState();
    });

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const direction = e.deltaY > 0 ? -1 : 1;
      const next = uniforms.scanlineSpeed.value + direction * 0.5;
      uniforms.scanlineSpeed.value = THREE.MathUtils.clamp(Math.round(next * 10) / 10, 0.5, 8.0);
      updateHUD();
      syncExposedState();
    }, { passive: false });

    resetBtn.addEventListener('click', () => {
      resetAll();
      updateHUD();
      syncExposedState();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    applyStateToUniforms();
    updateHUD();
    syncExposedState();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      uniforms.time.value = elapsed;

      if (state.rotationEnabled) {
        mesh.rotation.y += 0.5 * delta;
      }

      state.flickerValue = 1.0 + (Math.random() * 0.1 - 0.05);
      uniforms.flicker.value = state.flickerValue;

      syncExposedState();
      renderer.render(scene, camera);

      if (!state.shaderCompiled) {
        state.shaderCompiled = true;
        syncExposedState();
      }
    }

    animate();
  </script>
</body>
</html>
