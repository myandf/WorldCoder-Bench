<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Procedural City Builder</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #hud-topleft {
    position: fixed; top: 12px; left: 12px;
    background: rgba(0,0,0,0.65); color: #fff;
    padding: 10px 16px; border-radius: 8px;
    font-size: 15px; line-height: 1.7;
    border-left: 4px solid #ff4444;
    min-width: 200px;
  }
  #hud-topright {
    position: fixed; top: 12px; right: 12px;
    background: rgba(0,0,0,0.65); color: #fff;
    padding: 10px 16px; border-radius: 8px;
    font-size: 15px; line-height: 1.7;
    text-align: right;
  }
  #hud-bottom {
    position: fixed; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 10px 16px; border-radius: 10px;
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; justify-content: center;
  }
  .btn-type {
    padding: 7px 14px; border-radius: 6px;
    border: 2px solid transparent; cursor: pointer;
    font-size: 13px; font-weight: 600;
    transition: all 0.15s; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .btn-type:hover { filter: brightness(1.2); }
  .btn-type.selected { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.6); }
  #btn-residential { background: #2255cc; }
  #btn-commercial   { background: #ccaa00; color: #111; text-shadow: none; }
  #btn-industrial   { background: #667788; }
  #btn-park         { background: #228833; }
  #btn-road         { background: #444455; }
  #btn-reset        { background: #882222; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; color: #fff; }
  #btn-reset:hover  { background: #aa3333; }
  #msg-overlay {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(200,50,50,0.9); color: #fff;
    padding: 12px 24px; border-radius: 8px;
    font-size: 16px; font-weight: 700;
    display: none; pointer-events: none;
    z-index: 100;
  }
  #key-hint {
    position: fixed; bottom: 70px; right: 12px;
    background: rgba(0,0,0,0.5); color: #aaa;
    padding: 8px 12px; border-radius: 6px;
    font-size: 11px; line-height: 1.8;
  }
  #player-turn-label { font-weight: 700; font-size: 16px; }
</style>
</head>
<body>

<div id="hud-topleft">
  <div id="player-turn-label">Player 1 Turn</div>
  <div id="turn-number">Turn: 1</div>
  <div id="selected-type-label">Selected: None</div>
  <div id="population-label">Population: 0</div>
</div>

<div id="hud-topright">
  <div id="p1-score" style="color:#ff8888;">P1 Score: 0</div>
  <div id="p2-score" style="color:#8888ff;">P2 Score: 0</div>
</div>

<div id="hud-bottom">
  <button class="btn-type" id="btn-residential" onclick="selectType('residential')">Residential (R)</button>
  <button class="btn-type" id="btn-commercial"  onclick="selectType('commercial')">Commercial (C)</button>
  <button class="btn-type" id="btn-industrial"  onclick="selectType('industrial')">Industrial (I)</button>
  <button class="btn-type" id="btn-park"        onclick="selectType('park')">Park (P)</button>
  <button class="btn-type" id="btn-road"        onclick="selectType('road')">Road (O)</button>
  <button id="btn-reset" onclick="resetCity()">Reset City</button>
</div>

<div id="msg-overlay"></div>

<div id="key-hint">
  R/C/I/P/O — select type<br>
  Z — undo last<br>
  Drag — orbit camera
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene Setup ────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(30, 40, 30);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(20, 30, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 200;
dirLight.shadow.camera.left = -40;
dirLight.shadow.camera.right = 40;
dirLight.shadow.camera.top = 40;
dirLight.shadow.camera.bottom = -40;
scene.add(dirLight);

// Ground plane
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x5a7a3a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const gridHelper = new THREE.GridHelper(40, 20, 0x333322, 0x444433);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// ─── Grid State ─────────────────────────────────────────────────────────────
const GRID_SIZE = 20;
const CELL_SIZE = 2;
const GRID_ORIGIN_X = -20;
const GRID_ORIGIN_Z = -20;

let gridOccupancy = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill('empty'));
let gridMeshes    = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));

// ─── Game State ─────────────────────────────────────────────────────────────
let currentPlayer  = 1;
let turnNumber     = 1;
let selectedType   = null;
let player1Score   = 0;
let player2Score   = 0;
let hoveredCell    = null;
let lastPlacement  = null;
let canUndo        = false;
let undoSnapshot   = null;
let buildingCounts = { residential: 0, commercial: 0, industrial: 0, park: 0, road: 0 };

const PLAYER_COLORS = { 1: new THREE.Color(0xff3333), 2: new THREE.Color(0x3333ff) };
const PLAYER_HEX    = { 1: '#ff4444', 2: '#4466ff' };

// ─── Cursor Torus ────────────────────────────────────────────────────────────
const torusGeo = new THREE.TorusGeometry(1.1, 0.08, 8, 32);
const torusMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
const cursorTorus = new THREE.Mesh(torusGeo, torusMat);
cursorTorus.rotation.x = Math.PI / 2;
cursorTorus.visible = false;
scene.add(cursorTorus);

// ─── Raycasting ──────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint    = new THREE.Vector3();

function worldToCell(wx, wz) {
  const col = Math.floor((wx - GRID_ORIGIN_X) / CELL_SIZE);
  const row = Math.floor((wz - GRID_ORIGIN_Z) / CELL_SIZE);
  return { row, col };
}

function cellToWorld(row, col) {
  return {
    x: GRID_ORIGIN_X + col * CELL_SIZE + CELL_SIZE / 2,
    z: GRID_ORIGIN_Z + row * CELL_SIZE + CELL_SIZE / 2
  };
}

function isValidCell(row, col) {
  return row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE;
}

// ─── Building Creation ───────────────────────────────────────────────────────
function deterministicHeight(row, col, type) {
  const seed = row * 20 + col;
  if (type === 'residential') return 2 + ((seed * 7) % 10) / 10 * 4;
  if (type === 'commercial')  return 3 + ((seed * 13) % 10) / 10 * 5;
  if (type === 'industrial')  return 2 + ((seed * 11) % 10) / 10 * 3;
  return 1;
}

function mixColor(baseHex, playerColor, ratio = 0.2) {
  const base = new THREE.Color(baseHex);
  base.lerp(playerColor, ratio);
  return base;
}

function createBuilding(row, col, type, player) {
  const { x, z } = cellToWorld(row, col);
  const pColor = PLAYER_COLORS[player];
  const group = new THREE.Group();

  if (type === 'residential') {
    const h = deterministicHeight(row, col, type);
    const color = mixColor(0x2255cc, pColor);
    const geo = new THREE.BoxGeometry(1.6, h, 1.6);
    const mat = new THREE.MeshLambertMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, h / 2, 0);
    mesh.castShadow = true; mesh.receiveShadow = true;
    group.add(mesh);
    // small roof
    const roofGeo = new THREE.ConeGeometry(1.1, 0.6, 4);
    const roofMat = new THREE.MeshLambertMaterial({ color: 0xcc4422 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.set(0, h + 0.3, 0);
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    group.add(roof);

  } else if (type === 'commercial') {
    const h = deterministicHeight(row, col, type);
    const color = mixColor(0xccaa00, pColor);
    const geo = new THREE.BoxGeometry(1.8, h, 1.8);
    const mat = new THREE.MeshLambertMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, h / 2, 0);
    mesh.castShadow = true; mesh.receiveShadow = true;
    group.add(mesh);
    // glass top
    const topGeo = new THREE.BoxGeometry(1.8, 0.3, 1.8);
    const topMat = new THREE.MeshLambertMaterial({ color: 0x88ccff, transparent: true, opacity: 0.7 });
    const top = new THREE.Mesh(topGeo, topMat);
    top.position.set(0, h + 0.15, 0);
    group.add(top);

  } else if (type === 'industrial') {
    const h = deterministicHeight(row, col, type);
    const color = mixColor(0x667788, pColor);
    const geo = new THREE.CylinderGeometry(0.8, 0.8, h, 12);
    const mat = new THREE.MeshLambertMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, h / 2, 0);
    mesh.castShadow = true; mesh.receiveShadow = true;
    group.add(mesh);
    // smoke stack top
    const capGeo = new THREE.CylinderGeometry(0.85, 0.85, 0.15, 12);
    const capMat = new THREE.MeshLambertMaterial({ color: 0x445566 });
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.set(0, h + 0.075, 0);
    group.add(cap);

  } else if (type === 'park') {
    // base green plane
    const baseGeo = new THREE.PlaneGeometry(1.9, 1.9);
    const baseMat = new THREE.MeshLambertMaterial({ color: 0x33aa44 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.rotation.x = -Math.PI / 2;
    base.position.set(0, 0.02, 0);
    group.add(base);
    // sphere tree
    const color = mixColor(0x228833, pColor);
    const geo = new THREE.SphereGeometry(0.7, 10, 10);
    const mat = new THREE.MeshLambertMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 0.7, 0);
    mesh.castShadow = true;
    group.add(mesh);
    // trunk
    const trunkGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.5, 6);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x885522 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.set(0, 0.25, 0);
    group.add(trunk);

  } else if (type === 'road') {
    const color = mixColor(0x444455, pColor, 0.1);
    const geo = new THREE.BoxGeometry(2, 0.05, 2);
    const mat = new THREE.MeshLambertMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 0.025, 0);
    mesh.receiveShadow = true;
    group.add(mesh);
    // road markings
    const lineGeo = new THREE.BoxGeometry(0.08, 0.06, 1.4);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.position.set(0, 0.03, 0);
    group.add(line);
  }

  group.position.set(x, 0, z);
  group.userData = { row, col, type, player };
  scene.add(group);
  return group;
}

// ─── Scoring ─────────────────────────────────────────────────────────────────
function getAdjacentCells(row, col) {
  return [
    [row - 1, col], [row + 1, col],
    [row, col - 1], [row, col + 1]
  ].filter(([r, c]) => isValidCell(r, c));
}

function calcPlacementScore(row, col, type) {
  let score = 10;
  const adj = getAdjacentCells(row, col);

  if (type === 'residential') {
    for (const [r, c] of adj) {
      if (gridOccupancy[r][c] === 'park') score += 5;
    }
  } else if (type === 'commercial') {
    for (const [r, c] of adj) {
      if (gridOccupancy[r][c] === 'road') score += 3;
    }
  } else if (type === 'industrial') {
    let adjRes = false;
    for (const [r, c] of adj) {
      if (gridOccupancy[r][c] === 'residential') { adjRes = true; break; }
    }
    if (!adjRes) score += 4;
  }
  return score;
}

// ─── Population ──────────────────────────────────────────────────────────────
function calcPopulation() {
  let pop = 0;
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (gridOccupancy[r][c] === 'residential') {
        const h = deterministicHeight(r, c, 'residential');
        pop += 10 + Math.floor(h * 5);
      }
    }
  }
  return pop;
}

// ─── Placement ───────────────────────────────────────────────────────────────
function placeBuilding(row, col) {
  if (!selectedType) return;
  if (!isValidCell(row, col)) return;
  if (gridOccupancy[row][col] !== 'empty') {
    showMessage('Cell Occupied!', 1500);
    return;
  }

  // Save undo snapshot
  undoSnapshot = {
    row, col,
    type: selectedType,
    player: currentPlayer,
    p1Score: player1Score,
    p2Score: player2Score,
    turnNumber,
    buildingCounts: { ...buildingCounts }
  };
  canUndo = true;

  const score = calcPlacementScore(row, col, selectedType);
  if (currentPlayer === 1) player1Score += score;
  else player2Score += score;

  gridOccupancy[row][col] = selectedType;
  buildingCounts[selectedType]++;

  const mesh = createBuilding(row, col, selectedType, currentPlayer);
  gridMeshes[row][col] = mesh;

  lastPlacement = { row, col, type: selectedType, player: currentPlayer };

  currentPlayer = currentPlayer === 1 ? 2 : 1;
  if (currentPlayer === 1) turnNumber++;

  updateHUD();
  updateState();
}

// ─── Undo ─────────────────────────────────────────────────────────────────────
function undoLast() {
  if (!canUndo || !undoSnapshot) return;
  const s = undoSnapshot;

  // Remove mesh
  if (gridMeshes[s.row][s.col]) {
    scene.remove(gridMeshes[s.row][s.col]);
    gridMeshes[s.row][s.col] = null;
  }
  gridOccupancy[s.row][s.col] = 'empty';
  buildingCounts[s.type]--;

  player1Score = s.p1Score;
  player2Score = s.p2Score;
  currentPlayer = s.player;
  turnNumber = s.turnNumber;
  buildingCounts = { ...s.buildingCounts };
  lastPlacement = null;
  canUndo = false;
  undoSnapshot = null;

  updateHUD();
  updateState();
}

// ─── Reset ────────────────────────────────────────────────────────────────────
function resetCity() {
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (gridMeshes[r][c]) {
        scene.remove(gridMeshes[r][c]);
        gridMeshes[r][c] = null;
      }
      gridOccupancy[r][c] = 'empty';
    }
  }
  currentPlayer = 1;
  turnNumber = 1;
  player1Score = 0;
  player2Score = 0;
  lastPlacement = null;
  canUndo = false;
  undoSnapshot = null;
  buildingCounts = { residential: 0, commercial: 0, industrial: 0, park: 0, road: 0 };
  updateHUD();
  updateState();
}
window.resetCity = resetCity;

// ─── Type Selection ───────────────────────────────────────────────────────────
function selectType(type) {
  selectedType = type;
  document.querySelectorAll('.btn-type').forEach(b => b.classList.remove('selected'));
  const btn = document.getElementById('btn-' + type);
  if (btn) btn.classList.add('selected');
  updateHUD();
  updateState();
}
window.selectType = selectType;

// ─── HUD Update ───────────────────────────────────────────────────────────────
function updateHUD() {
  const ptLabel = document.getElementById('player-turn-label');
  ptLabel.textContent = `Player ${currentPlayer} Turn`;
  ptLabel.style.color = PLAYER_HEX[currentPlayer];

  document.getElementById('turn-number').textContent = `Turn: ${turnNumber}`;
  document.getElementById('selected-type-label').textContent =
    `Selected: ${selectedType ? selectedType.charAt(0).toUpperCase() + selectedType.slice(1) : 'None'}`;

  document.getElementById('p1-score').textContent = `P1 Score: ${player1Score}`;
  document.getElementById('p2-score').textContent = `P2 Score: ${player2Score}`;

  const pop = calcPopulation();
  document.getElementById('population-label').textContent = `Population: ${pop}`;

  // Update border color of HUD
  document.getElementById('hud-topleft').style.borderLeftColor = PLAYER_HEX[currentPlayer];

  // Update torus color
  torusMat.color.set(currentPlayer === 1 ? 0xff3333 : 0x3333ff);
}

// ─── Message Overlay ─────────────────────────────────────────────────────────
let msgTimer = null;
function showMessage(text, duration) {
  const el = document.getElementById('msg-overlay');
  el.textContent = text;
  el.style.display = 'block';
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.style.display = 'none'; }, duration);
}

// ─── State Export ─────────────────────────────────────────────────────────────
function updateState() {
  const totalBuildings = Object.values(buildingCounts).reduce((a, b) => a + b, 0);
  window.__3D_STATE__ = {
    currentPlayer,
    turnNumber,
    selectedType,
    player1Score,
    player2Score,
    totalBuildings,
    population: calcPopulation(),
    gridOccupancy: gridOccupancy.map(row => [...row]),
    hoveredCell: hoveredCell ? { ...hoveredCell } : null,
    lastPlacement: lastPlacement ? { ...lastPlacement } : null,
    buildingCounts: { ...buildingCounts },
    canUndo
  };
}

// ─── Mouse Events ─────────────────────────────────────────────────────────────
window.addEventListener('mousemove', (e) => {
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.ray.intersectPlane(groundPlane, hitPoint);

  if (hit) {
    const { row, col } = worldToCell(hitPoint.x, hitPoint.z);
    if (isValidCell(row, col)) {
      hoveredCell = { row, col };
      const { x, z } = cellToWorld(row, col);
      cursorTorus.position.set(x, 0.06, z);
      cursorTorus.visible = true;
    } else {
      hoveredCell = null;
      cursorTorus.visible = false;
    }
  } else {
    hoveredCell = null;
    cursorTorus.visible = false;
  }
  updateState();
});

window.addEventListener('click', (e) => {
  // Ignore clicks on UI elements
  if (e.target !== renderer.domElement) return;
  if (hoveredCell) {
    placeBuilding(hoveredCell.row, hoveredCell.col);
  }
});

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'r') selectType('residential');
  else if (key === 'c') selectType('commercial');
  else if (key === 'i') selectType('industrial');
  else if (key === 'p') selectType('park');
  else if (key === 'o') selectType('road');
  else if (key === 'z') undoLast();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Animate ──────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
updateHUD();
updateState();
animate();
</script>
</body>
</html>
