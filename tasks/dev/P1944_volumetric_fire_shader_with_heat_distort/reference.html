<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js Volumetric Fire with Heat Distortion</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 260px;
      padding: 12px 14px;
      background: rgba(0,0,0,0.58);
      color: #f2f2f2;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      z-index: 10;
      line-height: 1.45;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      box-sizing: border-box;
    }
    #hud .title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #ffd27a;
    }
    #hud .row {
      white-space: nowrap;
    }
    #hint {
      position: fixed;
      bottom: 10px;
      left: 12px;
      color: rgba(255,255,255,0.72);
      font-size: 12px;
      background: rgba(0,0,0,0.35);
      padding: 8px 10px;
      border-radius: 6px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="title">Fire Controls</div>
    <div class="row">Intensity: <span id="hud-intensity">1.00</span></div>
    <div class="row">Flame Height: <span id="hud-height">1.50</span></div>
    <div class="row">Distortion: <span id="hud-distortion">0.0300</span></div>
    <div class="row">Distortion Active: <span id="hud-distortion-active">ON</span></div>
    <div class="row">Color Preset: <span id="hud-preset">classic</span></div>
    <div class="row">FPS: <span id="hud-fps">0</span></div>
  </div>
  <div id="hint">Keys: I/K intensity, H/L height, D distortion, 1/2/3 presets, R reset, mouse wheel distortion</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    renderer.autoClear = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);

    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(4, 6, 3);
    scene.add(dir);

    const point = new THREE.PointLight(0xffaa55, 2.0, 10, 2);
    point.position.set(0, 1.5, 0);
    scene.add(point);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.y = 0;
    scene.add(ground);

    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0xb8bcc3,
      metalness: 0.95,
      roughness: 0.18,
      envMapIntensity: 1.0
    });

    const spherePositions = [
      new THREE.Vector3(-2, 0.3, 0),
      new THREE.Vector3(2, 0.3, 0),
      new THREE.Vector3(0, 0.3, 2)
    ];

    for (const p of spherePositions) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), sphereMat);
      s.position.copy(p);
      scene.add(s);
    }

    const defaults = {
      intensity: 1.0,
      flameHeight: 1.5,
      distortionStrength: 0.03,
      colorPreset: 'classic',
      colorBase: new THREE.Color(1.0, 0.27, 0.0),
      colorTip: new THREE.Color(1.0, 0.84, 0.0)
    };

    const presets = {
      classic: {
        base: new THREE.Color(1.0, 0.27, 0.0),
        tip: new THREE.Color(1.0, 0.84, 0.0)
      },
      blue: {
        base: new THREE.Color(0.0, 0.27, 1.0),
        tip: new THREE.Color(0.0, 0.8, 1.0)
      },
      green: {
        base: new THREE.Color(0.0, 0.67, 0.0),
        tip: new THREE.Color(0.67, 1.0, 0.0)
      }
    };

    let currentPreset = defaults.colorPreset;
    let distortionActive = true;
    let storedDistortionStrength = defaults.distortionStrength;
    let frameCount = 0;
    let fps = 0;
    let lastFpsTime = performance.now();
    let fpsFrames = 0;

    const fireUniforms = {
      uTime: { value: 0.0 },
      uIntensity: { value: defaults.intensity },
      uFlameHeight: { value: defaults.flameHeight },
      uColorBase: { value: defaults.colorBase.clone() },
      uColorTip: { value: defaults.colorTip.clone() }
    };

    const fireVertexShader = /* glsl */`
      varying vec2 vUv;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const fireFragmentShader = /* glsl */`
      precision highp float;

      varying vec2 vUv;
      varying vec3 vWorldPos;

      uniform float uTime;
      uniform float uIntensity;
      uniform float uFlameHeight;
      uniform vec3 uColorBase;
      uniform vec3 uColorTip;

      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x * 34.0) + 10.0) * x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod289(i);
        vec4 p = permute(
                  permute(
                    permute(i.z + vec4(0.0, i1.z, i2.z, 1.0))
                  + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 1.0 / 7.0;
        vec3 ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }

      float fbm(vec3 p) {
        float value = 0.0;
        float amp = 0.5;
        for (int i = 0; i < 5; i++) {
          value += amp * snoise(p);
          p *= 2.03;
          amp *= 0.5;
        }
        return value;
      }

      void main() {
        vec2 uv = vUv;
        vec2 centered = uv * 2.0 - 1.0;

        float heightNorm = clamp(uv.y * uFlameHeight, 0.0, 1.0);
        float width = mix(0.85, 0.12, pow(heightNorm, 1.1));
        float taperMask = 1.0 - smoothstep(width, width + 0.18, abs(centered.x));

        vec3 p = vec3(centered.x * 1.4, uv.y * 2.2 - uTime * 1.7, uTime * 0.45);
        float n1 = fbm(p * vec3(1.2, 1.0, 1.0));
        float n2 = fbm(p * vec3(2.1, 1.8, 1.5) + vec3(0.0, uTime * 0.4, 3.7));
        float n3 = fbm(vec3(centered.x * 2.8, uv.y * 3.4 - uTime * 2.8, 7.2));
        float noise = 0.5 + 0.5 * (0.55 * n1 + 0.3 * n2 + 0.15 * n3);

        float verticalFalloff = smoothstep(0.0, 0.08, uv.y) * (1.0 - smoothstep(0.65, 1.0, uv.y));
        float baseBoost = 1.0 - smoothstep(0.0, 0.35, uv.y);
        float flicker = 0.92 + 0.08 * sin(uTime * 13.0 + uv.y * 9.0);

        float density = noise * taperMask * verticalFalloff * flicker;
        density += baseBoost * taperMask * 0.22;
        density *= uIntensity;

        float edgeFade = 1.0 - smoothstep(0.55, 1.0, abs(centered.x));
        float topFade = 1.0 - smoothstep(0.72, 1.0, uv.y);
        float alpha = clamp(density * edgeFade * topFade, 0.0, 1.0);

        float colorMix = clamp(pow(uv.y, 0.8) + noise * 0.25, 0.0, 1.0);
        vec3 color = mix(uColorBase, uColorTip, colorMix);

        color *= (0.7 + 1.8 * density);
        color *= alpha;

        if (alpha < 0.01) discard;

        gl_FragColor = vec4(color, alpha);
      }
    `;

    const fireMaterial = new THREE.ShaderMaterial({
      uniforms: fireUniforms,
      vertexShader: fireVertexShader,
      fragmentShader: fireFragmentShader,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });

    const fireQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 3), fireMaterial);
    fireQuad.position.set(0, 1.5, 0);
    scene.add(fireQuad);

    fireQuad.onBeforeRender = () => {
      fireQuad.quaternion.copy(camera.quaternion);
    };

    const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.UnsignedByteType,
      depthBuffer: true,
      stencilBuffer: false
    });

    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const distortionUniforms = {
      uSceneTex: { value: renderTarget.texture },
      uTime: { value: 0.0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uDistortionStrength: { value: defaults.distortionStrength }
    };

    const postVertexShader = /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const postFragmentShader = /* glsl */`
      precision highp float;

      varying vec2 vUv;
      uniform sampler2D uSceneTex;
      uniform float uTime;
      uniform vec2 uResolution;
      uniform float uDistortionStrength;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);

        return mix(
          mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm2(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * noise(p);
          p *= 2.0;
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec2 uv = vUv;
        float strength = uDistortionStrength;

        vec2 centered = uv - 0.5;
        float hotspotX = 1.0 - smoothstep(0.12, 0.42, abs(centered.x));
        float hotspotY = smoothstep(0.35, 0.88, uv.y) * (1.0 - smoothstep(0.88, 1.0, uv.y));
        float verticalBias = hotspotX * hotspotY;

        vec2 flow = vec2(
          fbm2(vec2(uv.x * 12.0, uv.y * 18.0 - uTime * 3.2)),
          fbm2(vec2(uv.x * 10.0 + 7.3, uv.y * 16.0 - uTime * 4.1))
        );

        flow = (flow - 0.5) * 2.0;
        vec2 offset = vec2(flow.x * 0.7, flow.y * 1.1) * strength * verticalBias;

        vec4 color = texture2D(uSceneTex, clamp(uv + offset, 0.0, 1.0));
        gl_FragColor = color;
      }
    `;

    const postMaterial = new THREE.ShaderMaterial({
      uniforms: distortionUniforms,
      vertexShader: postVertexShader,
      fragmentShader: postFragmentShader,
      depthTest: false,
      depthWrite: false
    });

    const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
    postScene.add(postQuad);

    function safeNumber(n, fallback = 0) {
      return Number.isFinite(n) ? n : fallback;
    }

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function setPreset(name) {
      const p = presets[name];
      if (!p) return;
      currentPreset = name;
      fireUniforms.uColorBase.value.copy(p.base);
      fireUniforms.uColorTip.value.copy(p.tip);
    }

    function resetAll() {
      fireUniforms.uIntensity.value = defaults.intensity;
      fireUniforms.uFlameHeight.value = defaults.flameHeight;
      storedDistortionStrength = defaults.distortionStrength;
      distortionActive = true;
      distortionUniforms.uDistortionStrength.value = storedDistortionStrength;
      setPreset(defaults.colorPreset);
    }

    function updateHud() {
      document.getElementById('hud-intensity').textContent = safeNumber(window.__3D_STATE__.intensity).toFixed(2);
      document.getElementById('hud-height').textContent = safeNumber(window.__3D_STATE__.flameHeight).toFixed(2);
      document.getElementById('hud-distortion').textContent = safeNumber(window.__3D_STATE__.distortionStrength).toFixed(4);
      document.getElementById('hud-distortion-active').textContent = window.__3D_STATE__.distortionActive ? 'ON' : 'OFF';
      document.getElementById('hud-preset').textContent = window.__3D_STATE__.colorPreset;
      document.getElementById('hud-fps').textContent = String(Math.round(safeNumber(window.__3D_STATE__.fps)));
    }

    window.__3D_STATE__ = {
      intensity: defaults.intensity,
      flameHeight: defaults.flameHeight,
      distortionStrength: defaults.distortionStrength,
      distortionActive: true,
      colorPreset: defaults.colorPreset,
      colorBase: [defaults.colorBase.r, defaults.colorBase.g, defaults.colorBase.b],
      colorTip: [defaults.colorTip.r, defaults.colorTip.g, defaults.colorTip.b],
      elapsedTime: 0,
      fps: 0,
      frameCount: 0,
      cameraPosition: [camera.position.x, camera.position.y, camera.position.z],
      renderTargetActive: true,
      fireShaderCompiled: false,
      distortionShaderCompiled: false
    };

    function markShadersCompiled() {
      try {
        renderer.compile(scene, camera);
        renderer.compile(postScene, postCamera);
        window.__3D_STATE__.fireShaderCompiled = !!fireMaterial.program || fireMaterial.fragmentShader.length > 0;
        window.__3D_STATE__.distortionShaderCompiled = !!postMaterial.program || postMaterial.fragmentShader.length > 0;
      } catch (e) {
        window.__3D_STATE__.fireShaderCompiled = false;
        window.__3D_STATE__.distortionShaderCompiled = false;
        console.error(e);
      }
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'i') {
        fireUniforms.uIntensity.value = clamp(fireUniforms.uIntensity.value + 0.2, 0.1, 3.0);
      } else if (key === 'k') {
        fireUniforms.uIntensity.value = clamp(fireUniforms.uIntensity.value - 0.2, 0.1, 3.0);
      } else if (key === 'h') {
        fireUniforms.uFlameHeight.value = clamp(fireUniforms.uFlameHeight.value + 0.25, 0.5, 3.0);
      } else if (key === 'l') {
        fireUniforms.uFlameHeight.value = clamp(fireUniforms.uFlameHeight.value - 0.25, 0.5, 3.0);
      } else if (key === 'd') {
        distortionActive = !distortionActive;
        if (distortionActive) {
          distortionUniforms.uDistortionStrength.value = storedDistortionStrength;
        } else {
          if (distortionUniforms.uDistortionStrength.value > 0.0) {
            storedDistortionStrength = distortionUniforms.uDistortionStrength.value;
          }
          distortionUniforms.uDistortionStrength.value = 0.0;
        }
      } else if (key === '1') {
        setPreset('classic');
      } else if (key === '2') {
        setPreset('blue');
      } else if (key === '3') {
        setPreset('green');
      } else if (key === 'r') {
        resetAll();
      }
    });

    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.005 : 0.005;
      storedDistortionStrength = clamp(storedDistortionStrength + delta, 0.0, 0.1);
      if (distortionActive) {
        distortionUniforms.uDistortionStrength.value = storedDistortionStrength;
      }
    }, { passive: false });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderTarget.setSize(w, h);
      distortionUniforms.uResolution.value.set(w, h);
    }

    window.addEventListener('resize', resize);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = safeNumber(clock.getElapsedTime(), 0);
      fireUniforms.uTime.value = elapsed;
      distortionUniforms.uTime.value = elapsed;

      controls.update();

      fireQuad.quaternion.copy(camera.quaternion);
      point.intensity = 1.5 + fireUniforms.uIntensity.value * 1.2;
      point.position.y = 1.2 + 0.2 * Math.sin(elapsed * 6.0);

      renderer.setRenderTarget(renderTarget);
      renderer.clear();
      renderer.render(scene, camera);

      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(postScene, postCamera);

      frameCount++;
      fpsFrames++;
      const now = performance.now();
      if (now - lastFpsTime >= 500) {
        fps = (fpsFrames * 1000) / (now - lastFpsTime);
        fpsFrames = 0;
        lastFpsTime = now;
      }

      const base = fireUniforms.uColorBase.value;
      const tip = fireUniforms.uColorTip.value;

      window.__3D_STATE__.intensity = safeNumber(fireUniforms.uIntensity.value, defaults.intensity);
      window.__3D_STATE__.flameHeight = safeNumber(fireUniforms.uFlameHeight.value, defaults.flameHeight);
      window.__3D_STATE__.distortionStrength = safeNumber(distortionUniforms.uDistortionStrength.value, 0.0);
      window.__3D_STATE__.distortionActive = !!distortionActive;
      window.__3D_STATE__.colorPreset = currentPreset;
      window.__3D_STATE__.colorBase = [safeNumber(base.r), safeNumber(base.g), safeNumber(base.b)];
      window.__3D_STATE__.colorTip = [safeNumber(tip.r), safeNumber(tip.g), safeNumber(tip.b)];
      window.__3D_STATE__.elapsedTime = elapsed;
      window.__3D_STATE__.fps = safeNumber(fps, 0);
      window.__3D_STATE__.frameCount = frameCount;
      window.__3D_STATE__.cameraPosition = [
        safeNumber(camera.position.x),
        safeNumber(camera.position.y),
        safeNumber(camera.position.z)
      ];
      window.__3D_STATE__.renderTargetActive = !!renderTarget && true;
      window.__3D_STATE__.fireShaderCompiled = window.__3D_STATE__.fireShaderCompiled || !!fireMaterial.program;
      window.__3D_STATE__.distortionShaderCompiled = window.__3D_STATE__.distortionShaderCompiled || !!postMaterial.program;

      updateHud();
    }

    setPreset('classic');
    resize();
    markShadersCompiled();
    animate();
  </script>
</body>
</html>
