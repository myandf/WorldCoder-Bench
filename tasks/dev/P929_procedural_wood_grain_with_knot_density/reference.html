<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Wood Grain Material</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a1a; font-family: Arial, sans-serif; }
canvas { display: block; }

#controls {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 280px;
  background: rgba(20, 20, 20, 0.88);
  color: #fff;
  font-size: 14px;
  padding: 16px;
  border-radius: 8px;
  z-index: 10;
  max-height: 95vh;
  overflow-y: auto;
  user-select: none;
}

#controls h3 {
  margin-bottom: 12px;
  font-size: 16px;
  color: #c8a87a;
  border-bottom: 1px solid #444;
  padding-bottom: 6px;
}

.ctrl-group {
  margin-bottom: 10px;
}

.ctrl-group label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3px;
  font-size: 13px;
}

.ctrl-group label span.val {
  color: #c8a87a;
  font-weight: bold;
}

.ctrl-group input[type="range"] {
  width: 100%;
  cursor: pointer;
  accent-color: #c8a87a;
}

.ctrl-group select {
  width: 100%;
  padding: 4px;
  background: #333;
  color: #fff;
  border: 1px solid #555;
  border-radius: 4px;
  font-size: 13px;
}

#resetBtn {
  width: 100%;
  padding: 8px;
  background: #c8a87a;
  color: #1a1a1a;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 6px;
  margin-bottom: 8px;
}

#resetBtn:hover { background: #dbb98a; }

.ctrl-group.checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ctrl-group.checkbox-group input { accent-color: #c8a87a; cursor: pointer; }

#info {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 12px;
  font-family: Arial, sans-serif;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="controls">
  <h3>🪵 Wood Grain Controls</h3>

  <div class="ctrl-group">
    <label>Knot Density <span class="val" id="valKnotDensity">3.0</span></label>
    <input type="range" id="sliderKnotDensity" min="0" max="10" step="0.1" value="3.0">
  </div>

  <div class="ctrl-group">
    <label>Ring Frequency <span class="val" id="valRingFrequency">10.0</span></label>
    <input type="range" id="sliderRingFrequency" min="2" max="30" step="0.5" value="10.0">
  </div>

  <div class="ctrl-group">
    <label>Grain Contrast <span class="val" id="valGrainContrast">0.50</span></label>
    <input type="range" id="sliderGrainContrast" min="0" max="1" step="0.01" value="0.5">
  </div>

  <div class="ctrl-group">
    <label>Noise Scale <span class="val" id="valNoiseScale">1.0</span></label>
    <input type="range" id="sliderNoiseScale" min="0.1" max="5" step="0.1" value="1.0">
  </div>

  <div class="ctrl-group">
    <label>Knot Size <span class="val" id="valKnotSize">0.15</span></label>
    <input type="range" id="sliderKnotSize" min="0.05" max="0.5" step="0.01" value="0.15">
  </div>

  <div class="ctrl-group">
    <label>Wood Preset</label>
    <select id="presetSelect">
      <option value="Oak">Oak</option>
      <option value="Pine">Pine</option>
      <option value="Maple">Maple</option>
      <option value="Walnut">Walnut</option>
      <option value="Custom">Custom</option>
    </select>
  </div>

  <button id="resetBtn">Reset Defaults</button>

  <div class="ctrl-group checkbox-group">
    <input type="checkbox" id="animateCheck">
    <label for="animateCheck">Animate Grain</label>
  </div>
</div>

<div id="info">Click objects to select · Keys 1/2/3 to select · R to rotate selected</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const presets = {
  Oak:    { ringFrequency: 10, knotDensity: 3,  grainContrast: 0.5, noiseScale: 1.0, knotSize: 0.15 },
  Pine:   { ringFrequency: 6,  knotDensity: 7,  grainContrast: 0.7, noiseScale: 1.5, knotSize: 0.25 },
  Maple:  { ringFrequency: 18, knotDensity: 1,  grainContrast: 0.3, noiseScale: 0.5, knotSize: 0.08 },
  Walnut: { ringFrequency: 12, knotDensity: 4,  grainContrast: 0.8, noiseScale: 2.0, knotSize: 0.2  }
};

const vertexShader = `
  varying vec3 vPosition;
  varying vec3 vNormal;
  varying vec3 vWorldPosition;

  void main() {
    vPosition = position;
    vNormal = normalize(normalMatrix * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPosition = wp.xyz;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const fragmentShader = `
  precision highp float;

  uniform float u_ringFrequency;
  uniform float u_knotDensity;
  uniform float u_grainContrast;
  uniform float u_noiseScale;
  uniform float u_knotSize;
  uniform float u_time;
  uniform vec3 u_lightDir;

  varying vec3 vPosition;
  varying vec3 vNormal;
  varying vec3 vWorldPosition;

  // Hash functions for pseudo-random
  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
  }

  float hash3(vec3 p) {
    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
  }

  // 3D noise
  float noise3D(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);

    float n000 = hash3(i);
    float n100 = hash3(i + vec3(1,0,0));
    float n010 = hash3(i + vec3(0,1,0));
    float n110 = hash3(i + vec3(1,1,0));
    float n001 = hash3(i + vec3(0,0,1));
    float n101 = hash3(i + vec3(1,0,1));
    float n011 = hash3(i + vec3(0,1,1));
    float n111 = hash3(i + vec3(1,1,1));

    float nx00 = mix(n000, n100, f.x);
    float nx10 = mix(n010, n110, f.x);
    float nx01 = mix(n001, n101, f.x);
    float nx11 = mix(n011, n111, f.x);

    float nxy0 = mix(nx00, nx10, f.y);
    float nxy1 = mix(nx01, nx11, f.y);

    return mix(nxy0, nxy1, f.z);
  }

  float fbm(vec3 p) {
    float v = 0.0;
    float a = 0.5;
    vec3 shift = vec3(100.0);
    for (int i = 0; i < 4; i++) {
      v += a * noise3D(p);
      p = p * 2.0 + shift;
      a *= 0.5;
    }
    return v;
  }

  void main() {
    vec3 lightColor = vec3(0.76, 0.60, 0.42);
    vec3 darkColor = vec3(0.45, 0.28, 0.14);

    vec3 pos = vPosition;

    // Add time-based subtle shimmer
    float timeOffset = u_time * 0.1;

    // Noise perturbation for grain waviness
    float noiseVal = fbm(pos * u_noiseScale * 2.0 + vec3(0.0, 0.0, timeOffset)) * u_noiseScale;

    // Radial distance from local Y-axis for ring pattern
    float radialDist = length(pos.xz + noiseVal * 0.3);

    // Knot distortion
    float knotEffect = 0.0;
    if (u_knotDensity > 0.0) {
      int numKnots = int(u_knotDensity * 3.0) + 1;
      for (int i = 0; i < 30; i++) {
        if (i >= numKnots) break;
        // Deterministic knot positions based on index and density
        float fi = float(i);
        float seed = fi * 0.7 + u_knotDensity * 0.13;
        vec3 knotPos = vec3(
          (hash(vec2(fi * 1.3, seed)) - 0.5) * 2.0,
          (hash(vec2(fi * 2.7, seed + 3.1)) - 0.5) * 2.5,
          (hash(vec2(fi * 0.9, seed + 7.3)) - 0.5) * 2.0
        );

        vec3 diff = pos - knotPos;
        // Elliptical knot shape (compressed along Y)
        float knotDist = length(vec3(diff.x, diff.y * 2.0, diff.z));
        float knotRadius = u_knotSize * (0.7 + 0.6 * hash(vec2(fi, seed + 11.0)));

        if (knotDist < knotRadius * 3.0) {
          float knotInfluence = smoothstep(knotRadius * 3.0, knotRadius * 0.3, knotDist);
          // Swirl effect near knots
          float swirl = atan(diff.x, diff.z) * 2.0;
          knotEffect += knotInfluence * (sin(swirl * 3.0 + knotDist * 20.0) * 0.5 + 0.5) * 0.6;
          // Darken near knot centers
          knotEffect += smoothstep(knotRadius, 0.0, knotDist) * 0.4;
        }
      }
    }

    // Ring pattern
    float rings = sin((radialDist + noiseVal * 0.15 + knotEffect * 0.3) * u_ringFrequency + timeOffset * 0.5);
    rings = rings * 0.5 + 0.5; // normalize to 0-1

    // Apply contrast
    float grain = pow(rings, mix(0.5, 3.0, u_grainContrast));

    // Add fine grain detail
    float fineGrain = noise3D(pos * 40.0 + timeOffset) * 0.08;

    // Mix colors
    float mixFactor = clamp(grain + fineGrain + knotEffect * 0.3, 0.0, 1.0);
    vec3 woodColor = mix(lightColor, darkColor, mixFactor);

    // Darken knot centers more
    woodColor = mix(woodColor, darkColor * 0.5, clamp(knotEffect * 0.5, 0.0, 1.0));

    // Simple lighting
    vec3 normal = normalize(vNormal);
    float diff = max(dot(normal, normalize(u_lightDir)), 0.0);
    float ambient = 0.3;
    vec3 finalColor = woodColor * (ambient + diff * 0.85);

    // Subtle specular
    vec3 viewDir = normalize(cameraPosition - vWorldPosition);
    vec3 halfDir = normalize(normalize(u_lightDir) + viewDir);
    float spec = pow(max(dot(normal, halfDir), 0.0), 32.0) * 0.15;
    finalColor += vec3(spec);

    gl_FragColor = vec4(finalColor, 1.0);
  }
`;

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a2a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// Lights
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 8, 5);
scene.add(dirLight);

const ambLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambLight);

// Shared uniforms
const uniforms = {
  u_ringFrequency: { value: 10.0 },
  u_knotDensity: { value: 3.0 },
  u_grainContrast: { value: 0.5 },
  u_noiseScale: { value: 1.0 },
  u_knotSize: { value: 0.15 },
  u_time: { value: 0.0 },
  u_lightDir: { value: new THREE.Vector3(5, 8, 5).normalize() }
};

function createWoodMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      u_ringFrequency: uniforms.u_ringFrequency,
      u_knotDensity: uniforms.u_knotDensity,
      u_grainContrast: uniforms.u_grainContrast,
      u_noiseScale: uniforms.u_noiseScale,
      u_knotSize: uniforms.u_knotSize,
      u_time: uniforms.u_time,
      u_lightDir: uniforms.u_lightDir
    },
    vertexShader,
    fragmentShader
  });
}

// Create objects
const objects = [];
const outlines = [];

// 1. Cylinder (wooden post)
const cylGeo = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 64);
const cylMesh = new THREE.Mesh(cylGeo, createWoodMaterial());
cylMesh.position.set(-2.5, 0, 0);
cylMesh.userData.index = 0;
scene.add(cylMesh);
objects.push(cylMesh);

// 2. Box (wooden plank)
const boxGeo = new THREE.BoxGeometry(2, 1.5, 0.3);
const boxMesh = new THREE.Mesh(boxGeo, createWoodMaterial());
boxMesh.position.set(0, 0, 0);
boxMesh.userData.index = 1;
scene.add(boxMesh);
objects.push(boxMesh);

// 3. Sphere (turned wooden ball)
const sphGeo = new THREE.SphereGeometry(1.0, 32, 32);
const sphMesh = new THREE.Mesh(sphGeo, createWoodMaterial());
sphMesh.position.set(2.5, 0, 0);
sphMesh.userData.index = 2;
scene.add(sphMesh);
objects.push(sphMesh);

// Selection outlines (wireframe overlays)
const outlineMat = new THREE.MeshBasicMaterial({ color: 0xffcc44, wireframe: true, transparent: true, opacity: 0.4 });

objects.forEach((obj, i) => {
  const outlineMesh = new THREE.Mesh(obj.geometry.clone(), outlineMat.clone());
  outlineMesh.position.copy(obj.position);
  outlineMesh.rotation.copy(obj.rotation);
  outlineMesh.scale.multiplyScalar(1.02);
  outlineMesh.visible = (i === 0);
  scene.add(outlineMesh);
  outlines.push(outlineMesh);
});

// State
let selectedObject = 0;
let animateGrain = false;
let timeValue = 0;
let activePreset = 'Oak';
let rotationAnimations = [];

// UI elements
const sliderKD = document.getElementById('sliderKnotDensity');
const sliderRF = document.getElementById('sliderRingFrequency');
const sliderGC = document.getElementById('sliderGrainContrast');
const sliderNS = document.getElementById('sliderNoiseScale');
const sliderKS = document.getElementById('sliderKnotSize');
const valKD = document.getElementById('valKnotDensity');
const valRF = document.getElementById('valRingFrequency');
const valGC = document.getElementById('valGrainContrast');
const valNS = document.getElementById('valNoiseScale');
const valKS = document.getElementById('valKnotSize');
const presetSelect = document.getElementById('presetSelect');
const resetBtn = document.getElementById('resetBtn');
const animateCheck = document.getElementById('animateCheck');

function updateDisplayValues() {
  valKD.textContent = parseFloat(sliderKD.value).toFixed(1);
  valRF.textContent = parseFloat(sliderRF.value).toFixed(1);
  valGC.textContent = parseFloat(sliderGC.value).toFixed(2);
  valNS.textContent = parseFloat(sliderNS.value).toFixed(1);
  valKS.textContent = parseFloat(sliderKS.value).toFixed(2);
}

function syncUniforms() {
  uniforms.u_knotDensity.value = parseFloat(sliderKD.value);
  uniforms.u_ringFrequency.value = parseFloat(sliderRF.value);
  uniforms.u_grainContrast.value = parseFloat(sliderGC.value);
  uniforms.u_noiseScale.value = parseFloat(sliderNS.value);
  uniforms.u_knotSize.value = parseFloat(sliderKS.value);
  updateDisplayValues();
}

function checkIfPreset() {
  for (const [name, p] of Object.entries(presets)) {
    if (
      Math.abs(uniforms.u_ringFrequency.value - p.ringFrequency) < 0.01 &&
      Math.abs(uniforms.u_knotDensity.value - p.knotDensity) < 0.01 &&
      Math.abs(uniforms.u_grainContrast.value - p.grainContrast) < 0.01 &&
      Math.abs(uniforms.u_noiseScale.value - p.noiseScale) < 0.01 &&
      Math.abs(uniforms.u_knotSize.value - p.knotSize) < 0.01
    ) {
      activePreset = name;
      presetSelect.value = name;
      return;
    }
  }
  activePreset = 'Custom';
  presetSelect.value = 'Custom';
}

function applyPreset(name) {
  const p = presets[name];
  if (!p) return;
  sliderRF.value = p.ringFrequency;
  sliderKD.value = p.knotDensity;
  sliderGC.value = p.grainContrast;
  sliderNS.value = p.noiseScale;
  sliderKS.value = p.knotSize;
  syncUniforms();
  activePreset = name;
  presetSelect.value = name;
}

function selectObject(idx) {
  if (idx < 0 || idx > 2) return;
  selectedObject = idx;
  outlines.forEach((o, i) => { o.visible = (i === idx); });
}

// Slider events
[sliderKD, sliderRF, sliderGC, sliderNS, sliderKS].forEach(s => {
  s.addEventListener('input', () => {
    syncUniforms();
    checkIfPreset();
  });
});

presetSelect.addEventListener('change', (e) => {
  if (e.target.value !== 'Custom') {
    applyPreset(e.target.value);
  }
});

resetBtn.addEventListener('click', () => {
  applyPreset('Oak');
});

animateCheck.addEventListener('change', (e) => {
  animateGrain = e.target.checked;
});

// Raycaster for click selection
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(objects);
  if (hits.length > 0) {
    selectObject(hits[0].object.userData.index);
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === '1') selectObject(0);
  else if (key === '2') selectObject(1);
  else if (key === '3') selectObject(2);
  else if (key === 'r') {
    // Animate 45 degree rotation
    const obj = objects[selectedObject];
    const outline = outlines[selectedObject];
    const startRot = obj.rotation.y;
    const endRot = startRot + Math.PI / 4;
    const duration = 300;
    const startTime = performance.now();
    rotationAnimations.push({ obj, outline, startRot, endRot, startTime, duration });
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// State object
window.__3D_STATE__ = {
  knotDensity: 3.0,
  ringFrequency: 10.0,
  grainContrast: 0.5,
  noiseScale: 1.0,
  knotSize: 0.15,
  activePreset: 'Oak',
  selectedObject: 0,
  objectRotations: [0, 0, 0],
  animateGrain: false,
  timeValue: 0,
  objectCount: 3,
  uniformsSynced: true
};

// Animation loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const now = performance.now();

  // Update time
  if (animateGrain) {
    timeValue += delta;
    uniforms.u_time.value = timeValue;
  }

  // Process rotation animations
  rotationAnimations = rotationAnimations.filter(anim => {
    const elapsed = now - anim.startTime;
    const t = Math.min(elapsed / anim.duration, 1.0);
    const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const currentRot = anim.startRot + (anim.endRot - anim.startRot) * eased;
    anim.obj.rotation.y = currentRot;
    anim.outline.rotation.y = currentRot;
    return t < 1.0;
  });

  // Sync outline transforms
  outlines.forEach((o, i) => {
    o.position.copy(objects[i].position);
    o.rotation.copy(objects[i].rotation);
  });

  controls.update();

  // Check uniforms synced (all share same uniform references)
  const u0 = objects[0].material.uniforms;
  const u1 = objects[1].material.uniforms;
  const u2 = objects[2].material.uniforms;
  const synced = (
    u0.u_knotDensity.value === u1.u_knotDensity.value &&
    u1.u_knotDensity.value === u2.u_knotDensity.value &&
    u0.u_ringFrequency.value === u1.u_ringFrequency.value &&
    u1.u_ringFrequency.value === u2.u_ringFrequency.value &&
    u0.u_grainContrast.value === u1.u_grainContrast.value &&
    u1.u_grainContrast.value === u2.u_grainContrast.value &&
    u0.u_noiseScale.value === u1.u_noiseScale.value &&
    u1.u_noiseScale.value === u2.u_noiseScale.value &&
    u0.u_knotSize.value === u1.u_knotSize.value &&
    u1.u_knotSize.value === u2.u_knotSize.value
  );

  // Update state
  const state = window.__3D_STATE__;
  state.knotDensity = uniforms.u_knotDensity.value;
  state.ringFrequency = uniforms.u_ringFrequency.value;
  state.grainContrast = uniforms.u_grainContrast.value;
  state.noiseScale = uniforms.u_noiseScale.value;
  state.knotSize = uniforms.u_knotSize.value;
  state.activePreset = activePreset;
  state.selectedObject = selectedObject;
  state.objectRotations = objects.map(o => o.rotation.y);
  state.animateGrain = animateGrain;
  state.timeValue = timeValue;
  state.objectCount = 3;
  state.uniformsSynced = synced;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
