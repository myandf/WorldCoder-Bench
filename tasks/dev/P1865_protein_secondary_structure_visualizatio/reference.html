<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Secondary Structure Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            pointer-events: auto;
        }
        .top-container {
            display: flex;
            justify-content: space-between;
        }
        .bottom-container {
            display: flex;
            justify-content: center;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .info-row {
            margin: 5px 0;
            font-size: 14px;
        }
        .key {
            display: inline-block;
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #ffeb3b;
            margin-right: 5px;
        }
        .val {
            font-weight: bold;
        }
        .val.on { color: #4caf50; }
        .val.off { color: #f44336; }
        
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            pointer-events: auto;
        }
        button:hover {
            background: #1976d2;
        }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud">
        <div class="top-container">
            <div class="panel" id="controls-panel">
                <h2>Controls & State</h2>
                <div class="info-row"><span class="key">V</span> Mode: <span id="ui-mode" class="val">cartoon</span></div>
                <div class="info-row"><span class="key">A</span> Animation: <span id="ui-anim" class="val off">OFF</span></div>
                <div class="info-row"><span class="key">H</span> H-Bonds: <span id="ui-hbond" class="val off">OFF</span></div>
                <div class="info-row"><span class="key">T</span> B-Factor: <span id="ui-bfactor" class="val off">OFF</span></div>
            </div>
            <div class="panel" id="info-panel">
                <h2>Protein Info</h2>
                <div class="info-row">Total Residues: <span class="val">60</span></div>
                <hr style="border-color: #444; margin: 10px 0;">
                <div class="info-row">Selected: <span id="ui-sel-idx" class="val">None</span></div>
                <div class="info-row">Type: <span id="ui-sel-type" class="val">-</span></div>
                <div class="info-row">Position: <span id="ui-sel-pos" class="val">-</span></div>
            </div>
        </div>
        <div class="bottom-container">
            <button id="resetBtn">Reset View</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- STATE MANAGEMENT ---
        const state = {
            residueCount: 60,
            visualizationMode: 'cartoon',
            animationActive: false,
            animationProgress: 0,
            selectedResidue: null,
            selectedResidueType: null,
            hbondsVisible: false,
            hbondCount: 0,
            bfactorColoring: false,
            cameraDistance: 0,
            modeChangeCount: 0
        };
        window.__3D_STATE__ = state;

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 15, 10);
        scene.add(dirLight);

        // --- DATA GENERATION ---
        const points = [];
        const types = [];
        
        // Generate a continuous path with distinct secondary structure shapes
        for (let i = 0; i < 60; i++) {
            let x, y, z, type;
            if (i <= 14) { // Alpha Helix 1 (0-14)
                type = 'helix';
                x = -12 + i * 0.5;
                y = Math.sin(i * 1.2) * 1.8;
                z = Math.cos(i * 1.2) * 1.8;
            } else if (i <= 24) { // Random Coil 1 (15-24)
                type = 'coil';
                let t = (i - 14) / 10;
                let start = new THREE.Vector3(-12 + 14 * 0.5, Math.sin(14 * 1.2) * 1.8, Math.cos(14 * 1.2) * 1.8);
                let end = new THREE.Vector3(-2, 4, -4);
                x = start.x + (end.x - start.x) * t;
                y = start.y + (end.y - start.y) * t + Math.sin(t * Math.PI) * 2;
                z = start.z + (end.z - start.z) * t;
            } else if (i <= 39) { // Beta Sheet (25-39)
                type = 'sheet';
                let t = (i - 24) / 15;
                let start = new THREE.Vector3(-2, 4, -4);
                let end = new THREE.Vector3(8, -2, -4);
                x = start.x + (end.x - start.x) * t;
                y = start.y + (end.y - start.y) * t + (i % 2 === 0 ? 0.6 : -0.6); // Zigzag
                z = start.z + (end.z - start.z) * t;
            } else if (i <= 49) { // Random Coil 2 (40-49)
                type = 'coil';
                let t = (i - 39) / 10;
                let start = new THREE.Vector3(8, -2 + (39 % 2 === 0 ? 0.6 : -0.6), -4);
                let end = new THREE.Vector3(10, -4, 2);
                x = start.x + (end.x - start.x) * t;
                y = start.y + (end.y - start.y) * t - Math.sin(t * Math.PI) * 2;
                z = start.z + (end.z - start.z) * t;
            } else { // Alpha Helix 2 (50-59)
                type = 'helix';
                let t = i - 49;
                x = 10 + t * 0.5;
                y = -4 + Math.sin(t * 1.2) * 1.8;
                z = 2 + Math.cos(t * 1.2) * 1.8;
            }
            points.push(new THREE.Vector3(x, y, z));
            types.push(type);
        }

        // --- MATERIALS ---
        const materials = [];
        for (let i = 0; i < 60; i++) {
            materials.push(new THREE.MeshPhongMaterial({
                color: getBaseColor(types[i]),
                shininess: 60
            }));
        }

        function getBaseColor(type) {
            if (type === 'helix') return 0xff4444;
            if (type === 'sheet') return 0x4444ff;
            return 0x888888;
        }

        function getBFactorColor(index) {
            let center, range;
            if (index <= 14) { center = 7; range = 7; }
            else if (index <= 24) { center = 19.5; range = 4.5; }
            else if (index <= 39) { center = 32; range = 7; }
            else if (index <= 49) { center = 44.5; range = 4.5; }
            else { center = 54.5; range = 4.5; }
            
            let t = Math.abs(index - center) / range;
            t = Math.max(0, Math.min(1, t)); // clamp
            
            // Sine-based mapping as requested (though linear lerp is standard, we'll use sine for smooth transition)
            let sineT = Math.sin(t * Math.PI / 2); 
            
            return new THREE.Color().lerpColors(new THREE.Color(0x0000ff), new THREE.Color(0xff0000), sineT);
        }

        function updateColors() {
            for (let i = 0; i < 60; i++) {
                if (state.bfactorColoring) {
                    materials[i].color.copy(getBFactorColor(i));
                } else {
                    materials[i].color.setHex(getBaseColor(types[i]));
                }
            }
        }

        // --- GEOMETRY CONSTRUCTION ---
        const proteinGroup = new THREE.Group();
        scene.add(proteinGroup);

        const backboneGroup = new THREE.Group();
        const cartoonGroup = new THREE.Group();
        const ballstickGroup = new THREE.Group();
        const hitboxGroup = new THREE.Group();
        
        proteinGroup.add(backboneGroup);
        proteinGroup.add(cartoonGroup);
        proteinGroup.add(ballstickGroup);
        proteinGroup.add(hitboxGroup);

        // Helper to create cylinders between points
        function createCylinder(p1, p2, radius, material) {
            const dist = p1.distanceTo(p2);
            const geo = new THREE.CylinderGeometry(radius, radius, dist, 12);
            geo.translate(0, dist / 2, 0);
            geo.rotateX(Math.PI / 2);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.copy(p1);
            mesh.lookAt(p2);
            return mesh;
        }

        // Helper to create flat boxes for sheets
        function createBox(p1, p2, width, height, material) {
            const dist = p1.distanceTo(p2);
            const geo = new THREE.BoxGeometry(width, height, dist);
            geo.translate(0, 0, dist / 2);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.copy(p1);
            // Prevent twisting by setting a consistent up vector
            mesh.up.set(0, 1, 0); 
            mesh.lookAt(p2);
            return mesh;
        }

        for (let i = 0; i < 60; i++) {
            const p1 = points[i];
            const p2 = i < 59 ? points[i + 1] : null;
            const mat = materials[i];
            const type = types[i];

            // Hitbox (invisible spheres for raycasting)
            const hitMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.8, 8, 8),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            hitMesh.position.copy(p1);
            hitMesh.userData = { index: i, type: type };
            hitboxGroup.add(hitMesh);

            // 1. Backbone Mode
            const bbSphere = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), mat);
            bbSphere.position.copy(p1);
            backboneGroup.add(bbSphere);
            if (p2) backboneGroup.add(createCylinder(p1, p2, 0.15, mat));

            // 2. Cartoon Mode
            if (type === 'helix') {
                const cSphere = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), mat);
                cSphere.position.copy(p1);
                cartoonGroup.add(cSphere);
                if (p2) cartoonGroup.add(createCylinder(p1, p2, 0.6, mat));
            } else if (type === 'sheet') {
                if (p2) cartoonGroup.add(createBox(p1, p2, 1.2, 0.2, mat));
                // Joint for sheet
                const joint = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), mat);
                joint.scale.set(1, 0.16, 1); // Flatten sphere to match box height roughly
                joint.position.copy(p1);
                if (i > 0) {
                    let dir = p1.clone().sub(points[i-1]).normalize();
                    joint.lookAt(p1.clone().add(dir));
                }
                cartoonGroup.add(joint);
            } else { // coil
                const cSphere = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), mat);
                cSphere.position.copy(p1);
                cartoonGroup.add(cSphere);
                if (p2) cartoonGroup.add(createCylinder(p1, p2, 0.1, mat));
            }

            // 3. Ballstick Mode
            const bsSphere = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), mat);
            bsSphere.position.copy(p1);
            ballstickGroup.add(bsSphere);
            if (p2) ballstickGroup.add(createCylinder(p1, p2, 0.08, mat));
        }

        // --- HYDROGEN BONDS ---
        const hbondGroup = new THREE.Group();
        proteinGroup.add(hbondGroup);
        
        const hbondPoints = [];
        let totalHbonds = 0;
        
        // Helix 1 (i to i+4)
        for (let i = 0; i <= 10; i++) { hbondPoints.push(points[i], points[i+4]); totalHbonds++; }
        // Helix 2 (i to i+4)
        for (let i = 50; i <= 55; i++) { hbondPoints.push(points[i], points[i+4]); totalHbonds++; }
        // Sheet specific pairs
        const sheetPairs = [[25, 35], [27, 37], [29, 39]];
        for (let pair of sheetPairs) { hbondPoints.push(points[pair[0]], points[pair[1]]); totalHbonds++; }

        const hbondGeo = new THREE.BufferGeometry().setFromPoints(hbondPoints);
        const hbondMat = new THREE.LineDashedMaterial({ color: 0xffff00, dashSize: 0.4, gapSize: 0.2, linewidth: 2 });
        const hbondLines = new THREE.LineSegments(hbondGeo, hbondMat);
        hbondLines.computeLineDistances();
        hbondGroup.add(hbondLines);
        hbondGroup.visible = false;

        // --- SELECTION HIGHLIGHT ---
        const highlightSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.8, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true })
        );
        highlightSphere.visible = false;
        scene.add(highlightSphere);

        // --- VISIBILITY LOGIC ---
        function updateVisibility() {
            backboneGroup.visible = state.visualizationMode === 'backbone';
            cartoonGroup.visible = state.visualizationMode === 'cartoon';
            ballstickGroup.visible = state.visualizationMode === 'ballstick';
        }
        updateVisibility();

        // --- INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(hitboxGroup.children);
            
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                state.selectedResidue = hit.userData.index;
                state.selectedResidueType = hit.userData.type;
                highlightSphere.position.copy(hit.position);
                highlightSphere.visible = true;
            } else {
                state.selectedResidue = null;
                state.selectedResidueType = null;
                highlightSphere.visible = false;
            }
        });

        window.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();
            if (key === 'V') {
                const modes = ['backbone', 'cartoon', 'ballstick'];
                let idx = modes.indexOf(state.visualizationMode);
                state.visualizationMode = modes[(idx + 1) % 3];
                state.modeChangeCount++;
                updateVisibility();
            } else if (key === 'A') {
                state.animationActive = !state.animationActive;
            } else if (key === 'H') {
                state.hbondsVisible = !state.hbondsVisible;
                hbondGroup.visible = state.hbondsVisible;
                state.hbondCount = state.hbondsVisible ? totalHbonds : 0;
            } else if (key === 'T') {
                state.bfactorColoring = !state.bfactorColoring;
                updateColors();
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            camera.position.set(0, 5, 25);
            controls.target.set(0, 0, 0);
            state.selectedResidue = null;
            state.selectedResidueType = null;
            highlightSphere.visible = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- UI UPDATE ---
        function updateHUD() {
            document.getElementById('ui-mode').textContent = state.visualizationMode;
            
            const animEl = document.getElementById('ui-anim');
            animEl.textContent = state.animationActive ? 'ON' : 'OFF';
            animEl.className = 'val ' + (state.animationActive ? 'on' : 'off');
            
            const hbondEl = document.getElementById('ui-hbond');
            hbondEl.textContent = state.hbondsVisible ? `ON (${state.hbondCount})` : 'OFF';
            hbondEl.className = 'val ' + (state.hbondsVisible ? 'on' : 'off');
            
            const bfactorEl = document.getElementById('ui-bfactor');
            bfactorEl.textContent = state.bfactorColoring ? 'ON' : 'OFF';
            bfactorEl.className = 'val ' + (state.bfactorColoring ? 'on' : 'off');

            if (state.selectedResidue !== null) {
                document.getElementById('ui-sel-idx').textContent = state.selectedResidue;
                document.getElementById('ui-sel-type').textContent = state.selectedResidueType;
                const p = points[state.selectedResidue];
                document.getElementById('ui-sel-pos').textContent = `${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}`;
            } else {
                document.getElementById('ui-sel-idx').textContent = 'None';
                document.getElementById('ui-sel-type').textContent = '-';
                document.getElementById('ui-sel-pos').textContent = '-';
            }
        }

        // --- ANIMATION LOOP ---
        let lastTime = performance.now();

        function animate(time) {
            requestAnimationFrame(animate);
            
            const delta = time - lastTime;
            lastTime = time;

            controls.update();

            // Handle Backbone Animation (Pulsing Glow)
            if (state.animationActive) {
                // 60 residues in 4 seconds = 15 residues per second
                state.animationProgress += (delta / 1000) * 15;
                if (state.animationProgress >= 60) state.animationProgress -= 60;

                const pulse = Math.sin(time * 0.01) * 0.5 + 0.5; // 0.0 to 1.0

                for (let i = 0; i < 60; i++) {
                    let dist = Math.abs(i - state.animationProgress);
                    if (dist > 30) dist = 60 - dist; // Wrap around distance
                    
                    // Glow spreads over ~4 residues
                    let intensity = Math.max(0, 1 - dist / 2); 
                    
                    if (intensity > 0) {
                        materials[i].emissive.setHex(0xffff00);
                        materials[i].emissiveIntensity = intensity * (0.4 + pulse * 0.6);
                    } else {
                        materials[i].emissive.setHex(0x000000);
                    }
                }
            } else {
                state.animationProgress = 0;
                for (let i = 0; i < 60; i++) {
                    materials[i].emissive.setHex(0x000000);
                }
            }

            // Update state object
            state.cameraDistance = camera.position.distanceTo(new THREE.Vector3(0, 0, 0));
            window.__3D_STATE__ = { ...state };

            updateHUD();
            renderer.render(scene, camera);
        }

        animate(performance.now());
    </script>
</body>
</html>
