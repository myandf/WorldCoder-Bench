<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paint Visualizer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
    }

    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: white;
    }

    #title {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    #top-right-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      background: rgba(0,0,0,0.25);
      padding: 10px 12px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    #palette-container {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    #palette-bar {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(4px);
    }

    .paint-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      box-sizing: border-box;
      outline: none;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .paint-btn:hover {
      transform: scale(1.08);
    }

    #paint-name-label {
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #bottom-right-controls {
      position: absolute;
      right: 16px;
      bottom: 24px;
      pointer-events: auto;
      background: rgba(0,0,0,0.28);
      padding: 12px 14px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      min-width: 220px;
    }

    #bottom-right-controls label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
    }

    #roughness-slider {
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="ui">
      <div id="title">Paint Visualizer</div>

      <div id="top-right-controls">
        <input type="checkbox" id="auto-rotate-toggle" checked />
        <label for="auto-rotate-toggle">Auto Rotate</label>
      </div>

      <div id="palette-container">
        <div id="palette-bar"></div>
        <div id="paint-name-label">Midnight Black</div>
      </div>

      <div id="bottom-right-controls">
        <label for="roughness-slider">Roughness Override</label>
        <input id="roughness-slider" type="range" min="0" max="100" step="1" value="10" />
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    const app = document.getElementById('app');
    const paletteBar = document.getElementById('palette-bar');
    const paintNameLabel = document.getElementById('paint-name-label');
    const autoRotateToggle = document.getElementById('auto-rotate-toggle');
    const roughnessSlider = document.getElementById('roughness-slider');

    const paintPresets = [
      { name: 'Midnight Black', color: '#0a0a0a', metalness: 0.9, roughness: 0.1, clearcoat: 1.0, clearcoatRoughness: 0.05 },
      { name: 'Racing Red', color: '#cc0000', metalness: 0.7, roughness: 0.15, clearcoat: 0.9, clearcoatRoughness: 0.1 },
      { name: 'Pearl White', color: '#f0f0f0', metalness: 0.3, roughness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.05 },
      { name: 'Electric Blue', color: '#0044cc', metalness: 0.8, roughness: 0.1, clearcoat: 1.0, clearcoatRoughness: 0.08 },
      { name: 'Forest Green', color: '#005522', metalness: 0.6, roughness: 0.2, clearcoat: 0.8, clearcoatRoughness: 0.15 },
      { name: 'Sunset Orange', color: '#ff6600', metalness: 0.7, roughness: 0.15, clearcoat: 0.9, clearcoatRoughness: 0.1 }
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight1.position.set(5, 10, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(new THREE.Color('#aaccff'), 0.8);
    dirLight2.position.set(-5, 5, -5);
    scene.add(dirLight2);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(new THREE.Color('#fff5e0'), 1.0);
    pointLight.position.set(0, 5, 0);
    scene.add(pointLight);

    const groundGeometry = new THREE.CircleGeometry(4, 64);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: '#333333',
      metalness: 0.9,
      roughness: 0.1
    });
    const groundPlane = new THREE.Mesh(groundGeometry, groundMaterial);
    groundPlane.rotation.x = -Math.PI / 2;
    groundPlane.position.y = 0;
    scene.add(groundPlane);

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    let horseRoot = null;
    let horseMaterials = [];
    let currentPaintIndex = 0;
    let modelLoaded = false;

    function createPaintButtons() {
      paintPresets.forEach((preset, index) => {
        const btn = document.createElement('button');
        btn.id = `paint-btn-${index}`;
        btn.className = 'paint-btn';
        btn.style.background = preset.color;
        btn.style.border = index === currentPaintIndex ? '3px solid white' : '1px solid #666';
        btn.title = preset.name;
        btn.addEventListener('click', () => applyPaint(index));
        paletteBar.appendChild(btn);
      });
    }

    function updateButtonStyles() {
      for (let i = 0; i < paintPresets.length; i++) {
        const btn = document.getElementById(`paint-btn-${i}`);
        if (!btn) continue;
        btn.style.border = i === currentPaintIndex ? '3px solid white' : '1px solid #666';
      }
    }

    function applyPaint(index) {
      currentPaintIndex = index;
      const preset = paintPresets[index];
      paintNameLabel.textContent = preset.name;
      roughnessSlider.value = String(Math.round(preset.roughness * 100));
      updateButtonStyles();
      applyMaterialProperties();
    }

    function applyMaterialProperties() {
      if (!horseMaterials.length) return;
      const preset = paintPresets[currentPaintIndex];
      const roughnessOverride = Number(roughnessSlider.value) / 100;

      horseMaterials.forEach((material) => {
        material.color.set(preset.color);
        material.metalness = preset.metalness;
        material.roughness = roughnessOverride;
        material.clearcoat = preset.clearcoat;
        material.clearcoatRoughness = preset.clearcoatRoughness;
        material.needsUpdate = true;
      });
    }

    createPaintButtons();

    const loader = new GLTFLoader();
    loader.load(
      'Fox.glb',
      (gltf) => {
        horseRoot = gltf.scene;

        const box = new THREE.Box3().setFromObject(horseRoot);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        const targetHeight = 2.5;
        const scale = size.y > 0 ? targetHeight / size.y : 1;
        horseRoot.scale.setScalar(scale);

        const scaledBox = new THREE.Box3().setFromObject(horseRoot);
        const scaledCenter = new THREE.Vector3();
        const scaledSize = new THREE.Vector3();
        scaledBox.getCenter(scaledCenter);
        scaledBox.getSize(scaledSize);

        horseRoot.position.x -= scaledCenter.x;
        horseRoot.position.z -= scaledCenter.z;
        horseRoot.position.y -= scaledBox.min.y;

        horseRoot.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = false;
            child.receiveShadow = false;
            const mat = new THREE.MeshPhysicalMaterial({
              color: paintPresets[currentPaintIndex].color,
              metalness: paintPresets[currentPaintIndex].metalness,
              roughness: paintPresets[currentPaintIndex].roughness,
              clearcoat: paintPresets[currentPaintIndex].clearcoat,
              clearcoatRoughness: paintPresets[currentPaintIndex].clearcoatRoughness
            });
            child.material = mat;
            horseMaterials.push(mat);
          }
        });

        modelGroup.add(horseRoot);
        applyMaterialProperties();
        modelLoaded = true;
      },
      undefined,
      (error) => {
        console.error('Failed to load Fox.glb:', error);
      }
    );

    roughnessSlider.addEventListener('input', () => {
      applyMaterialProperties();
    });

    window.addEventListener('keydown', (event) => {
      const keyNum = Number(event.key);
      if (keyNum >= 1 && keyNum <= 6) {
        applyPaint(keyNum - 1);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.__3D_STATE__ = {
      modelLoaded: false,
      currentPaintIndex: 0,
      currentPaintName: paintPresets[0].name,
      materialColor: paintPresets[0].color,
      materialMetalness: paintPresets[0].metalness,
      materialRoughness: Number(roughnessSlider.value) / 100,
      materialClearcoat: paintPresets[0].clearcoat,
      autoRotate: autoRotateToggle.checked,
      modelRotationY: 0,
      roughnessSliderValue: Number(roughnessSlider.value),
      paintButtonCount: paintPresets.length,
      groundPlaneExists: !!groundPlane
    };

    const clock = new THREE.Clock();

    function updateState() {
      const preset = paintPresets[currentPaintIndex];
      window.__3D_STATE__.modelLoaded = modelLoaded;
      window.__3D_STATE__.currentPaintIndex = currentPaintIndex;
      window.__3D_STATE__.currentPaintName = preset.name;
      window.__3D_STATE__.materialColor = new THREE.Color(preset.color).getStyle().startsWith('rgb')
        ? preset.color.toLowerCase()
        : preset.color.toLowerCase();
      window.__3D_STATE__.materialMetalness = preset.metalness;
      window.__3D_STATE__.materialRoughness = Number(roughnessSlider.value) / 100;
      window.__3D_STATE__.materialClearcoat = preset.clearcoat;
      window.__3D_STATE__.autoRotate = autoRotateToggle.checked;
      window.__3D_STATE__.modelRotationY = modelGroup.rotation.y;
      window.__3D_STATE__.roughnessSliderValue = Number(roughnessSlider.value);
      window.__3D_STATE__.paintButtonCount = document.querySelectorAll('.paint-btn').length;
      window.__3D_STATE__.groundPlaneExists = !!groundPlane && scene.children.includes(groundPlane);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (autoRotateToggle.checked) {
        modelGroup.rotation.y += 0.5 * delta;
      }

      controls.update();
      updateState();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
