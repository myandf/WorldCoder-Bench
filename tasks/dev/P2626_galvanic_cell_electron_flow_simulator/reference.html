<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galvanic Cell Electron Flow Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Courier New', monospace; }
canvas { display: block; }

#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0, 0, 0, 0.75);
  color: #ffffff;
  padding: 15px 20px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.8;
  min-width: 240px;
  border: 1px solid rgba(255,255,255,0.15);
  z-index: 10;
}
#hud div { margin-bottom: 2px; }
#hud span { color: #00ffaa; }

#controls {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 15px;
  background: rgba(0,0,0,0.75);
  padding: 12px 24px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.15);
  z-index: 10;
}
#controls button {
  background: #00aa66;
  color: #fff;
  border: none;
  padding: 8px 20px;
  border-radius: 5px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  font-weight: bold;
}
#controls button:hover { background: #00cc77; }
#controls button#btn-reset { background: #aa3333; }
#controls button#btn-reset:hover { background: #cc4444; }
#controls label { color: #fff; font-size: 13px; font-family: 'Courier New', monospace; }
#controls input[type=range] { width: 120px; cursor: pointer; }

#tooltip {
  position: absolute;
  display: none;
  background: rgba(0,0,0,0.85);
  color: #ffff00;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  pointer-events: none;
  border: 1px solid #ffff00;
  z-index: 20;
}

#loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #00ffaa;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  z-index: 30;
}
</style>
</head>
<body>

<div id="hud">
  <div>Cell Voltage: <span id="hud-voltage">1.10 V</span></div>
  <div>Electrons Transferred: <span id="hud-electrons">0</span></div>
  <div>Zn Mass: <span id="hud-zn-mass">65.380 g</span></div>
  <div>Cu Mass: <span id="hud-cu-mass">63.550 g</span></div>
  <div>Resistance: <span id="hud-resistance">5</span></div>
  <div>Status: <span id="hud-status">Stopped</span></div>
</div>

<div id="controls">
  <button id="btn-start">Start</button>
  <button id="btn-reset">Reset</button>
  <label>Resistance: <input type="range" id="slider-resistance" min="1" max="10" value="5"></label>
</div>

<div id="tooltip"></div>
<div id="loading">Loading models...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── State ──
const INITIAL_ZN_MASS = 65.38;
const INITIAL_CU_MASS = 63.55;
const INITIAL_VOLTAGE = 1.10;
const MASS_PER_TRANSFER = 0.001;
const ZN_DEPLETION_THRESHOLD = 60.0;
const ELECTRON_COUNT = 20;
const ZN_ION_COUNT = 10;
const SO4_ION_COUNT = 10;
const THEORETICAL_MAX_TRANSFERS = (INITIAL_ZN_MASS - ZN_DEPLETION_THRESHOLD) / MASS_PER_TRANSFER;

window.__3D_STATE__ = {
  modelsLoaded: false,
  simulationRunning: false,
  totalElectronsTransferred: 0,
  ionsMigrated: 0,
  znMass: INITIAL_ZN_MASS,
  cuMass: INITIAL_CU_MASS,
  cellVoltage: INITIAL_VOLTAGE,
  resistance: 5,
  faradayEfficiency: 0,
  electronPositions: [],
  selectedElectrode: null,
  simStatus: 'Stopped',
  elapsedTime: 0,
  massConservationDelta: 0
};

const state = window.__3D_STATE__;

// ── Renderer ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x1a1a2e);
document.body.appendChild(renderer.domElement);

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// ── Camera ──
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 8, 14);
camera.lookAt(0, 0, 0);

// ── Controls ──
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

// ── Lights ──
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// ── GLTF Loading ──
const loader = new GLTFLoader();
let modelsLoadedCount = 0;
const loadingEl = document.getElementById('loading');

function checkModelsLoaded() {
  modelsLoadedCount++;
  if (modelsLoadedCount >= 2) {
    state.modelsLoaded = true;
    loadingEl.style.display = 'none';
  }
}

function loadModelSafe(url, scale, position) {
  loader.load(
    url,
    (gltf) => {
      const model = gltf.scene;
      model.scale.set(scale.x, scale.y, scale.z);
      model.position.set(position.x, position.y, position.z);
      scene.add(model);
      checkModelsLoaded();
    },
    undefined,
    (err) => {
      console.warn(`Could not load ${url}, using placeholder.`, err);
      const geo = new THREE.BoxGeometry(scale.x * 2, scale.y * 2, scale.z * 2);
      const mat = new THREE.MeshStandardMaterial({ color: 0x555555, transparent: true, opacity: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(position.x, position.y, position.z);
      scene.add(mesh);
      checkModelsLoaded();
    }
  );
}

loadModelSafe('coffeemat.glb', { x: 2, y: 0.3, z: 3 }, { x: 0, y: -1, z: 0 });
loadModelSafe('PrimaryIonDrive.glb', { x: 1.5, y: 1.5, z: 1.5 }, { x: 0, y: 2, z: -2 });

// ── Beaker helper ──
function createBeaker(x) {
  const group = new THREE.Group();
  // Outer cylinder (glass)
  const outerGeo = new THREE.CylinderGeometry(1.5, 1.5, 3, 32, 1, true);
  const outerMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, transparent: true, opacity: 0.15,
    roughness: 0.1, metalness: 0, side: THREE.DoubleSide, depthWrite: false
  });
  const outer = new THREE.Mesh(outerGeo, outerMat);
  group.add(outer);
  // Bottom
  const bottomGeo = new THREE.CircleGeometry(1.5, 32);
  const bottomMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false
  });
  const bottom = new THREE.Mesh(bottomGeo, bottomMat);
  bottom.rotation.x = -Math.PI / 2;
  bottom.position.y = -1.5;
  group.add(bottom);
  group.position.set(x, 0.5, 0);
  return group;
}

const znBeaker = createBeaker(-3.5);
scene.add(znBeaker);
const cuBeaker = createBeaker(3.5);
scene.add(cuBeaker);

// ── Liquids ──
function createLiquid(x, color) {
  const geo = new THREE.CylinderGeometry(1.45, 1.45, 2.2, 32);
  const mat = new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 0.1, 0);
  return mesh;
}

scene.add(createLiquid(-3.5, 0x4488cc));
scene.add(createLiquid(3.5, 0x22aa88));

// ── Electrodes ──
const znElectrodeGeo = new THREE.BoxGeometry(0.3, 2.5, 0.3);
const znElectrodeMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.3 });
const znElectrode = new THREE.Mesh(znElectrodeGeo, znElectrodeMat);
znElectrode.position.set(-3.5, 0.75, 0);
znElectrode.userData.type = 'Zn';
scene.add(znElectrode);

const cuElectrodeGeo = new THREE.BoxGeometry(0.3, 2.5, 0.3);
const cuElectrodeMat = new THREE.MeshStandardMaterial({ color: 0xcc7733, metalness: 0.8, roughness: 0.3 });
const cuElectrode = new THREE.Mesh(cuElectrodeGeo, cuElectrodeMat);
cuElectrode.position.set(3.5, 0.75, 0);
cuElectrode.userData.type = 'Cu';
scene.add(cuElectrode);

// ── Wire path (curved, over the salt bridge area) ──
const wirePoints = [];
const WIRE_SEGMENTS = 100;
const znTop = new THREE.Vector3(-3.5, 2.0, 0);
const cuTop = new THREE.Vector3(3.5, 2.0, 0);

const wireCurve = new THREE.CatmullRomCurve3([
  znTop,
  new THREE.Vector3(-3.5, 3.0, 0),
  new THREE.Vector3(-2.0, 4.0, -1.0),
  new THREE.Vector3(0, 4.5, -2.0),
  new THREE.Vector3(2.0, 4.0, -1.0),
  new THREE.Vector3(3.5, 3.0, 0),
  cuTop
]);

const tubeGeo = new THREE.TubeGeometry(wireCurve, 64, 0.04, 8, false);
const tubeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });
const wireMesh = new THREE.Mesh(tubeGeo, tubeMat);
scene.add(wireMesh);

// ── Salt bridge visual (tube between beakers) ──
const saltBridgeCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-3.5, 1.2, 0),
  new THREE.Vector3(-1.5, 2.2, -0.5),
  new THREE.Vector3(0, 2.5, -1.0),
  new THREE.Vector3(1.5, 2.2, -0.5),
  new THREE.Vector3(3.5, 1.2, 0)
]);
const saltGeo = new THREE.TubeGeometry(saltBridgeCurve, 32, 0.2, 8, false);
const saltMat = new THREE.MeshStandardMaterial({ color: 0xddddaa, transparent: true, opacity: 0.5 });
const saltBridge = new THREE.Mesh(saltGeo, saltMat);
scene.add(saltBridge);

// ── Electrons ──
const electrons = [];
const electronGeo = new THREE.SphereGeometry(0.08, 12, 12);
const electronMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.8 });

for (let i = 0; i < ELECTRON_COUNT; i++) {
  const mesh = new THREE.Mesh(electronGeo, electronMat);
  mesh.position.copy(znTop);
  scene.add(mesh);
  electrons.push({ mesh, t: i / ELECTRON_COUNT, active: false });
}

state.electronPositions = electrons.map(e => ({ x: e.mesh.position.x, y: e.mesh.position.y, z: e.mesh.position.z }));

// ── Zn2+ ions ──
const znIons = [];
const znIonGeo = new THREE.SphereGeometry(0.06, 8, 8);
const znIonMat = new THREE.MeshStandardMaterial({ color: 0x00ff44, emissive: 0x00ff44, emissiveIntensity: 0.4 });

for (let i = 0; i < ZN_ION_COUNT; i++) {
  const mesh = new THREE.Mesh(znIonGeo, znIonMat);
  mesh.position.set(-3.5, 0.5, 0);
  mesh.visible = false;
  scene.add(mesh);
  znIons.push({ mesh, t: 0, active: false, targetX: -3.5 + (Math.random() - 0.5) * 2, targetY: -0.2 + Math.random() * 1.5, targetZ: (Math.random() - 0.5) * 2 });
}

// ── SO4^2- ions ──
const so4Ions = [];
const so4Geo = new THREE.SphereGeometry(0.06, 8, 8);
const so4Mat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0xff3333, emissiveIntensity: 0.4 });

for (let i = 0; i < SO4_ION_COUNT; i++) {
  const mesh = new THREE.Mesh(so4Geo, so4Mat);
  const startT = Math.random();
  const p = saltBridgeCurve.getPointAt(0.3 + Math.random() * 0.4);
  mesh.position.copy(p);
  mesh.visible = false;
  scene.add(mesh);
  so4Ions.push({ mesh, t: 0.3 + Math.random() * 0.4, active: false });
}

// ── Raycasting ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let highlightedElectrode = null;

function clearHighlight() {
  if (highlightedElectrode) {
    if (highlightedElectrode.userData.type === 'Zn') {
      highlightedElectrode.material.emissive.setHex(0x000000);
    } else {
      highlightedElectrode.material.emissive.setHex(0x000000);
    }
    highlightedElectrode = null;
    state.selectedElectrode = null;
    tooltip.style.display = 'none';
  }
}

renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects([znElectrode, cuElectrode]);
  clearHighlight();

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    obj.material.emissive.setHex(0xffff00);
    obj.material.emissiveIntensity = 0.3;
    highlightedElectrode = obj;
    state.selectedElectrode = obj.userData.type;

    const mass = obj.userData.type === 'Zn' ? state.znMass : state.cuMass;
    tooltip.textContent = `${obj.userData.type} Electrode: ${mass.toFixed(3)} g`;
    tooltip.style.display = 'block';
    tooltip.style.left = event.clientX + 15 + 'px';
    tooltip.style.top = event.clientY - 10 + 'px';
  }
});

// ── UI Controls ──
const btnStart = document.getElementById('btn-start');
const btnReset = document.getElementById('btn-reset');
const sliderRes = document.getElementById('slider-resistance');

function startPause() {
  if (state.simStatus === 'Depleted') return;
  state.simulationRunning = !state.simulationRunning;
  state.simStatus = state.simulationRunning ? 'Running' : 'Stopped';
  btnStart.textContent = state.simulationRunning ? 'Pause' : 'Start';
}

function resetSim() {
  state.simulationRunning = false;
  state.totalElectronsTransferred = 0;
  state.ionsMigrated = 0;
  state.znMass = INITIAL_ZN_MASS;
  state.cuMass = INITIAL_CU_MASS;
  state.cellVoltage = INITIAL_VOLTAGE;
  state.faradayEfficiency = 0;
  state.selectedElectrode = null;
  state.simStatus = 'Stopped';
  state.elapsedTime = 0;
  state.massConservationDelta = 0;
  btnStart.textContent = 'Start';
  clearHighlight();
  tooltip.style.display = 'none';

  electrons.forEach((e, i) => {
    e.t = i / ELECTRON_COUNT;
    e.active = false;
    e.mesh.position.copy(znTop);
  });

  znIons.forEach(ion => {
    ion.active = false;
    ion.t = 0;
    ion.mesh.visible = false;
    ion.mesh.position.set(-3.5, 0.5, 0);
  });

  so4Ions.forEach(ion => {
    ion.active = false;
    ion.t = 0.3 + Math.random() * 0.4;
    ion.mesh.visible = false;
    const p = saltBridgeCurve.getPointAt(ion.t);
    ion.mesh.position.copy(p);
  });

  sliderRes.value = 5;
  state.resistance = 5;
  simStartTime = null;
  accumulatedTime = 0;
}

btnStart.addEventListener('click', startPause);
btnReset.addEventListener('click', resetSim);

sliderRes.addEventListener('input', () => {
  state.resistance = parseInt(sliderRes.value);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    if (e.target.tagName === 'INPUT') return;
    resetSim();
  }
  if (e.key === '+' || e.key === '=') {
    state.resistance = Math.min(10, state.resistance + 1);
    sliderRes.value = state.resistance;
  }
  if (e.key === '-' || e.key === '_') {
    state.resistance = Math.max(1, state.resistance - 1);
    sliderRes.value = state.resistance;
  }
});

// ── HUD update ──
function updateHUD() {
  document.getElementById('hud-voltage').textContent = state.cellVoltage.toFixed(2) + ' V';
  document.getElementById('hud-electrons').textContent = state.totalElectronsTransferred;
  document.getElementById('hud-zn-mass').textContent = state.znMass.toFixed(3) + ' g';
  document.getElementById('hud-cu-mass').textContent = state.cuMass.toFixed(3) + ' g';
  document.getElementById('hud-resistance').textContent = state.resistance;
  document.getElementById('hud-status').textContent = state.simStatus;
}

// ── Animation ──
let prevTime = performance.now();
let simStartTime = null;
let accumulatedTime = 0;
let nextZnIonIndex = 0;
let nextSo4IonIndex = 0;
let ionSpawnTimer = 0;

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - prevTime) / 1000, 0.05);
  prevTime = now;

  controls.update();

  if (state.simulationRunning) {
    if (simStartTime === null) simStartTime = now;
    accumulatedTime += dt;
    state.elapsedTime = accumulatedTime;

    const speed = (0.3 / state.resistance) * 1.5;

    // Move electrons
    electrons.forEach((e) => {
      e.active = true;
      e.t += speed * dt;

      if (e.t >= 1.0) {
        e.t -= 1.0;
        state.totalElectronsTransferred++;

        // Chemistry
        state.znMass -= MASS_PER_TRANSFER;
        state.cuMass += MASS_PER_TRANSFER;

        // Voltage
        const znRemaining = state.znMass - ZN_DEPLETION_THRESHOLD;
        const znTotal = INITIAL_ZN_MASS - ZN_DEPLETION_THRESHOLD;
        state.cellVoltage = Math.max(0, INITIAL_VOLTAGE * (znRemaining / znTotal));

        if (state.znMass < ZN_DEPLETION_THRESHOLD) {
          state.znMass = Math.max(state.znMass, ZN_DEPLETION_THRESHOLD - 0.5);
          state.cellVoltage = 0;
          state.simulationRunning = false;
          state.simStatus = 'Depleted';
          btnStart.textContent = 'Start';
        }
      }

      const clampedT = Math.max(0, Math.min(1, e.t));
      const pos = wireCurve.getPointAt(clampedT);
      e.mesh.position.copy(pos);
    });

    // Spawn ions periodically
    ionSpawnTimer += dt;
    if (ionSpawnTimer > 0.8) {
      ionSpawnTimer = 0;

      if (nextZnIonIndex < ZN_ION_COUNT) {
        const ion = znIons[nextZnIonIndex];
        ion.active = true;
        ion.mesh.visible = true;
        ion.t = 0;
        nextZnIonIndex++;
        state.ionsMigrated++;
      }

      if (nextSo4IonIndex < SO4_ION_COUNT) {
        const ion = so4Ions[nextSo4IonIndex];
        ion.active = true;
        ion.mesh.visible = true;
        nextSo4IonIndex++;
        state.ionsMigrated++;
      }
    }

    // Animate Zn2+ ions drifting into solution
    znIons.forEach(ion => {
      if (!ion.active) return;
      ion.t = Math.min(ion.t + dt * 0.3, 1.0);
      ion.mesh.position.set(
        THREE.MathUtils.lerp(-3.5, ion.targetX, ion.t),
        THREE.MathUtils.lerp(0.5, ion.targetY, ion.t),
        THREE.MathUtils.lerp(0, ion.targetZ, ion.t)
      );
    });

    // Animate SO4^2- ions drifting toward Zn half-cell
    so4Ions.forEach(ion => {
      if (!ion.active) return;
      ion.t = Math.max(ion.t - dt * 0.05, 0);
      const p = saltBridgeCurve.getPointAt(ion.t);
      ion.mesh.position.copy(p);
    });

    // Faraday efficiency
    if (state.totalElectronsTransferred > 0) {
      state.faradayEfficiency = Math.min(1, state.totalElectronsTransferred / THEORETICAL_MAX_TRANSFERS);
    }

    // Mass conservation
    const znLoss = INITIAL_ZN_MASS - state.znMass;
    const cuGain = state.cuMass - INITIAL_CU_MASS;
    state.massConservationDelta = Math.abs(znLoss - cuGain);

    // Clamp voltage
    state.cellVoltage = Math.max(0, Math.min(INITIAL_VOLTAGE, state.cellVoltage));
    state.resistance = Math.max(1, Math.min(10, state.resistance));
  }

  // Update electron positions for state
  state.electronPositions = electrons.map(e => ({
    x: e.mesh.position.x,
    y: e.mesh.position.y,
    z: e.mesh.position.z
  }));

  // Update tooltip if electrode selected
  if (highlightedElectrode) {
    const mass = highlightedElectrode.userData.type === 'Zn' ? state.znMass : state.cuMass;
    tooltip.textContent = `${highlightedElectrode.userData.type} Electrode: ${mass.toFixed(3)} g`;
  }

  updateHUD();
  renderer.render(scene, camera);
}

// ── Grid for reference ──
const gridHelper = new THREE.GridHelper(20, 20, 0x333355, 0x222244);
gridHelper.position.y = -1.5;
scene.add(gridHelper);

// ── Labels (simple sprite text) ──
function createLabel(text, position, color = '#ffffff') {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 28px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(text, 128, 40);
  const texture = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.position.copy(position);
  sprite.scale.set(2, 0.5, 1);
  return sprite;
}

scene.add(createLabel('Zn (Anode)', new THREE.Vector3(-3.5, 2.8, 0), '#88aaff'));
scene.add(createLabel('Cu (Cathode)', new THREE.Vector3(3.5, 2.8, 0), '#ffaa44'));
scene.add(createLabel('Salt Bridge', new THREE.Vector3(0, 3.0, -1.0), '#ddddaa'));

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
