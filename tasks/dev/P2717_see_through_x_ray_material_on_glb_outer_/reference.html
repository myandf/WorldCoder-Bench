<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Ray See-Through Material Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
canvas { display: block; }

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  color: #aaccee;
  font-size: 13px;
  line-height: 1.6;
  background: rgba(5, 5, 20, 0.75);
  padding: 12px 16px;
  border-radius: 8px;
  border: 1px solid rgba(0, 170, 255, 0.2);
  pointer-events: none;
  z-index: 10;
  min-width: 220px;
}
#hud .label { color: #667799; }
#hud .value { color: #00ccff; }

#controlPanel {
  position: fixed;
  top: 12px;
  right: 12px;
  background: rgba(5, 5, 20, 0.82);
  padding: 16px 18px;
  border-radius: 8px;
  border: 1px solid rgba(0, 170, 255, 0.2);
  color: #aaccee;
  font-size: 13px;
  z-index: 10;
  min-width: 210px;
}
#controlPanel .ctrl-group { margin-bottom: 10px; }
#controlPanel label { display: block; margin-bottom: 3px; color: #667799; font-size: 12px; }
#controlPanel input[type="range"] { width: 100%; accent-color: #00ccff; cursor: pointer; }
#controlPanel input[type="color"] { width: 40px; height: 26px; border: 1px solid #334; background: transparent; cursor: pointer; vertical-align: middle; }
#controlPanel .val { color: #00ccff; float: right; font-size: 12px; }

#resetBtn {
  margin-top: 8px;
  width: 100%;
  padding: 7px;
  background: rgba(0, 170, 255, 0.15);
  color: #00ccff;
  border: 1px solid rgba(0, 170, 255, 0.3);
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
}
#resetBtn:hover { background: rgba(0, 170, 255, 0.3); }

#keysHelp {
  position: fixed;
  bottom: 12px;
  left: 12px;
  color: #556677;
  font-size: 11px;
  line-height: 1.5;
  background: rgba(5, 5, 20, 0.6);
  padding: 10px 14px;
  border-radius: 8px;
  pointer-events: none;
  z-index: 10;
}
</style>
</head>
<body>

<div id="hud"></div>

<div id="controlPanel">
  <div class="ctrl-group">
    <label>X-Ray Opacity <span class="val" id="opacityVal">0.35</span></label>
    <input type="range" id="opacitySlider" min="0.05" max="1.0" step="0.05" value="0.35">
  </div>
  <div class="ctrl-group">
    <label>Fresnel Power <span class="val" id="fresnelVal">2.0</span></label>
    <input type="range" id="fresnelSlider" min="0.5" max="5.0" step="0.1" value="2.0">
  </div>
  <div class="ctrl-group">
    <label>Glow Intensity <span class="val" id="glowVal">1.5</span></label>
    <input type="range" id="glowSlider" min="0.1" max="3.0" step="0.1" value="1.5">
  </div>
  <div class="ctrl-group">
    <label>X-Ray Color</label>
    <input type="color" id="colorPicker" value="#00ccff">
  </div>
  <button id="resetBtn">Reset Defaults</button>
</div>

<div id="keysHelp">
  [1] Normal &nbsp; [2] X-Ray Left &nbsp; [3] X-Ray Right &nbsp; [4] X-Ray Both &nbsp; [5] Wireframe<br>
  [Space] Toggle Rotation &nbsp; [R] Reset Rotation
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --- State ---
const state = {
  modelsLoaded: false,
  currentMode: 'normal',
  xrayOpacity: 0.35,
  fresnelPower: 2.0,
  glowIntensity: 1.5,
  xrayColorHex: '#00ccff',
  rotationEnabled: true,
  leftModelRotationY: 0,
  rightModelRotationY: 0,
  leftModelMaterialType: 'original',
  rightModelMaterialType: 'original',
  leftModelVisible: false,
  rightModelVisible: false,
  meshCountLeft: 0,
  meshCountRight: 0,
  cameraDistance: 0,
  frameCount: 0
};
window.__3D_STATE__ = state;

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

// --- Camera ---
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 4);
camera.lookAt(0, 0, 0);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.5, 0);

// --- Lights ---
scene.add(new THREE.AmbientLight(0x334466, 0.3));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);
const pointLight = new THREE.PointLight(0x00aaff, 0.8);
pointLight.position.set(-2, 3, -1);
scene.add(pointLight);

// --- Grid ---
const grid = new THREE.GridHelper(10, 20, 0x222244, 0x222244);
scene.add(grid);

// --- X-Ray Shader Material ---
const xrayVertexShader = `
  varying float vFresnel;
  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vec3 viewDir = normalize(-mvPosition.xyz);
    vec3 worldNormal = normalize(normalMatrix * normal);
    vFresnel = 1.0 - abs(dot(viewDir, worldNormal));
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const xrayFragmentShader = `
  uniform vec3 uColor;
  uniform float uOpacity;
  uniform float uFresnelPower;
  uniform float uGlowIntensity;
  varying float vFresnel;
  void main() {
    float f = pow(vFresnel, uFresnelPower) * uGlowIntensity;
    gl_FragColor = vec4(uColor * f, f * uOpacity);
  }
`;

function createXrayMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(0x00ccff) },
      uOpacity: { value: 0.35 },
      uFresnelPower: { value: 2.0 },
      uGlowIntensity: { value: 1.5 }
    },
    vertexShader: xrayVertexShader,
    fragmentShader: xrayFragmentShader,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
}

const xrayMaterial = createXrayMaterial();
const wireframeMaterial = new THREE.MeshBasicMaterial({ wireframe: true, color: 0x00ff88 });

// --- Model containers ---
let leftModel = null;
let rightModel = null;
let leftLoaded = false;
let rightLoaded = false;
const originalMaterialsLeft = new Map();
const originalMaterialsRight = new Map();

function normalizeModel(object, targetSize) {
  const box = new THREE.Box3().setFromObject(object);
  const size = new THREE.Vector3();
  box.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);
  if (maxDim > 0) {
    const s = targetSize / maxDim;
    object.scale.multiplyScalar(s);
  }
}

function storeMaterials(object, map) {
  let count = 0;
  object.traverse(child => {
    if (child.isMesh) {
      map.set(child, child.material);
      count++;
    }
  });
  return count;
}

function applyMaterial(object, materialMap, type) {
  object.traverse(child => {
    if (child.isMesh) {
      if (type === 'original') {
        child.material = materialMap.get(child) || child.material;
      } else if (type === 'xray') {
        child.material = xrayMaterial;
      } else if (type === 'wireframe') {
        child.material = wireframeMaterial;
      }
    }
  });
}

// --- Load models ---
const loader = new GLTFLoader();

loader.load('SunglassesKhronos.glb', gltf => {
  leftModel = gltf.scene;
  normalizeModel(leftModel, 1.5);
  leftModel.position.set(-1.2, 0.8, 0);
  state.meshCountLeft = storeMaterials(leftModel, originalMaterialsLeft);
  scene.add(leftModel);
  leftLoaded = true;
  state.leftModelVisible = true;
  if (leftLoaded && rightLoaded) state.modelsLoaded = true;
}, undefined, err => console.warn('Left model load error:', err));

loader.load('GlassHurricaneCandleHolder.glb', gltf => {
  rightModel = gltf.scene;
  normalizeModel(rightModel, 1.5);
  rightModel.position.set(1.2, 0, 0);
  state.meshCountRight = storeMaterials(rightModel, originalMaterialsRight);
  scene.add(rightModel);
  rightLoaded = true;
  state.rightModelVisible = true;
  if (leftLoaded && rightLoaded) state.modelsLoaded = true;
}, undefined, err => console.warn('Right model load error:', err));

// --- Mode application ---
function applyMode(mode) {
  state.currentMode = mode;
  if (!leftModel || !rightModel) return;

  if (mode === 'normal') {
    applyMaterial(leftModel, originalMaterialsLeft, 'original');
    applyMaterial(rightModel, originalMaterialsRight, 'original');
    state.leftModelMaterialType = 'original';
    state.rightModelMaterialType = 'original';
  } else if (mode === 'xray_left') {
    applyMaterial(leftModel, originalMaterialsLeft, 'xray');
    applyMaterial(rightModel, originalMaterialsRight, 'original');
    state.leftModelMaterialType = 'xray';
    state.rightModelMaterialType = 'original';
  } else if (mode === 'xray_right') {
    applyMaterial(leftModel, originalMaterialsLeft, 'original');
    applyMaterial(rightModel, originalMaterialsRight, 'xray');
    state.leftModelMaterialType = 'original';
    state.rightModelMaterialType = 'xray';
  } else if (mode === 'xray_both') {
    applyMaterial(leftModel, originalMaterialsLeft, 'xray');
    applyMaterial(rightModel, originalMaterialsRight, 'xray');
    state.leftModelMaterialType = 'xray';
    state.rightModelMaterialType = 'xray';
  } else if (mode === 'wireframe_both') {
    applyMaterial(leftModel, originalMaterialsLeft, 'wireframe');
    applyMaterial(rightModel, originalMaterialsRight, 'wireframe');
    state.leftModelMaterialType = 'wireframe';
    state.rightModelMaterialType = 'wireframe';
  }
}

// --- Keyboard ---
document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (key === '1') applyMode('normal');
  else if (key === '2') applyMode('xray_left');
  else if (key === '3') applyMode('xray_right');
  else if (key === '4') applyMode('xray_both');
  else if (key === '5') applyMode('wireframe_both');
  else if (key === ' ') { e.preventDefault(); state.rotationEnabled = !state.rotationEnabled; }
  else if (key === 'r') {
    if (leftModel) leftModel.rotation.y = 0;
    if (rightModel) rightModel.rotation.y = 0;
    state.leftModelRotationY = 0;
    state.rightModelRotationY = 0;
  }
});

// --- Sliders ---
const opacitySlider = document.getElementById('opacitySlider');
const fresnelSlider = document.getElementById('fresnelSlider');
const glowSlider = document.getElementById('glowSlider');
const colorPicker = document.getElementById('colorPicker');
const opacityVal = document.getElementById('opacityVal');
const fresnelVal = document.getElementById('fresnelVal');
const glowVal = document.getElementById('glowVal');

opacitySlider.addEventListener('input', () => {
  const v = parseFloat(opacitySlider.value);
  xrayMaterial.uniforms.uOpacity.value = v;
  state.xrayOpacity = v;
  opacityVal.textContent = v.toFixed(2);
});

fresnelSlider.addEventListener('input', () => {
  const v = parseFloat(fresnelSlider.value);
  xrayMaterial.uniforms.uFresnelPower.value = v;
  state.fresnelPower = v;
  fresnelVal.textContent = v.toFixed(1);
});

glowSlider.addEventListener('input', () => {
  const v = parseFloat(glowSlider.value);
  xrayMaterial.uniforms.uGlowIntensity.value = v;
  state.glowIntensity = v;
  glowVal.textContent = v.toFixed(1);
});

colorPicker.addEventListener('input', () => {
  const hex = colorPicker.value;
  xrayMaterial.uniforms.uColor.value.set(hex);
  state.xrayColorHex = hex;
});

// --- Reset ---
document.getElementById('resetBtn').addEventListener('click', () => {
  opacitySlider.value = 0.35; opacityVal.textContent = '0.35';
  fresnelSlider.value = 2.0; fresnelVal.textContent = '2.0';
  glowSlider.value = 1.5; glowVal.textContent = '1.5';
  colorPicker.value = '#00ccff';

  xrayMaterial.uniforms.uOpacity.value = 0.35;
  xrayMaterial.uniforms.uFresnelPower.value = 2.0;
  xrayMaterial.uniforms.uGlowIntensity.value = 1.5;
  xrayMaterial.uniforms.uColor.value.set(0x00ccff);

  state.xrayOpacity = 0.35;
  state.fresnelPower = 2.0;
  state.glowIntensity = 1.5;
  state.xrayColorHex = '#00ccff';

  applyMode('normal');
});

// --- HUD ---
const hud = document.getElementById('hud');
function updateHUD() {
  hud.innerHTML =
    `<span class="label">Mode:</span> <span class="value">${state.currentMode}</span><br>` +
    `<span class="label">Opacity:</span> <span class="value">${state.xrayOpacity.toFixed(2)}</span><br>` +
    `<span class="label">Fresnel:</span> <span class="value">${state.fresnelPower.toFixed(1)}</span><br>` +
    `<span class="label">Glow:</span> <span class="value">${state.glowIntensity.toFixed(1)}</span><br>` +
    `<span class="label">Rotation:</span> <span class="value">${state.rotationEnabled ? 'ON' : 'OFF'}</span>`;
}

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Animation ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (state.rotationEnabled) {
    if (leftModel) {
      leftModel.rotation.y += 0.3 * dt;
      state.leftModelRotationY = leftModel.rotation.y;
    }
    if (rightModel) {
      rightModel.rotation.y += -0.2 * dt;
      state.rightModelRotationY = rightModel.rotation.y;
    }
  }

  controls.update();
  state.cameraDistance = camera.position.length();
  state.frameCount++;

  updateHUD();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
