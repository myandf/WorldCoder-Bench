<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Anaglyph Stereo Scene</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111122;
      font-family: monospace;
    }
    canvas {
      display: block;
    }
    #hud-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px;
      z-index: 100;
      line-height: 1.5;
      border: 1px solid rgba(255,255,255,0.15);
      min-width: 260px;
      user-select: none;
    }
    #hud-panel .buttons {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    #hud-panel button {
      background: #22263a;
      color: #fff;
      border: 1px solid #556;
      padding: 6px 10px;
      cursor: pointer;
      font-family: monospace;
    }
    #hud-panel button:hover {
      background: #2f3550;
    }
    #hud-panel .hint {
      margin-top: 10px;
      font-size: 11px;
      opacity: 0.85;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="hud-panel">
    <div id="hud-text">Loading...</div>
    <div class="buttons">
      <button id="btn-subtle">Subtle</button>
      <button id="btn-normal">Normal</button>
      <button id="btn-extreme">Extreme</button>
    </div>
    <div class="hint">[ / ] Eye Sep
- / = Focal Len
Space Toggle Mode
↑ / ↓ Rot Speed
A / D Orbit Camera
C Toggle Plane</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { AnaglyphEffect } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/effects/AnaglyphEffect.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const effect = new AnaglyphEffect(renderer);
    effect.setSize(window.innerWidth, window.innerHeight);

    const objects = [];
    const basePositions = [];

    const standardMaterial = (color) => new THREE.MeshStandardMaterial({ color });

    const torusKnot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.8, 0.3, 100, 16),
      standardMaterial(0xff3333)
    );
    torusKnot.position.set(-3, 1, 0);
    scene.add(torusKnot);
    objects.push(torusKnot);
    basePositions.push(torusKnot.position.y);

    const icosahedron = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1, 0),
      standardMaterial(0x33ff33)
    );
    icosahedron.position.set(3, 1, 0);
    scene.add(icosahedron);
    objects.push(icosahedron);
    basePositions.push(icosahedron.position.y);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      standardMaterial(0x3333ff)
    );
    box.position.set(0, 1, -3);
    scene.add(box);
    objects.push(box);
    basePositions.push(box.position.y);

    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.7, 2, 8),
      standardMaterial(0xffff33)
    );
    cone.position.set(-1.5, 1, 3);
    scene.add(cone);
    objects.push(cone);
    basePositions.push(cone.position.y);

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 32, 24),
      standardMaterial(0x33ffff)
    );
    sphere.position.set(1.5, 1, 3);
    scene.add(sphere);
    objects.push(sphere);
    basePositions.push(sphere.position.y);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x444466, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const convergencePlane = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 8),
      new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.12,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    convergencePlane.visible = false;
    scene.add(convergencePlane);

    let eyeSeparation = 0.064;
    let focalLength = 15;
    let anaglyphEnabled = true;
    let rotationSpeed = 0.01;
    let cameraAngleDeg = 0;
    let frameCount = 0;
    let activePreset = 'normal';

    const hudText = document.getElementById('hud-text');

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function updateEffectParameters() {
      effect.eyeSeparation = eyeSeparation;
      if (effect.stereo && effect.stereo.cameraL && effect.stereo.cameraR) {
        effect.stereo.cameraL.focalLength = focalLength;
        effect.stereo.cameraR.focalLength = focalLength;
      }
      if (effect.stereo && typeof effect.stereo.eyeSep !== 'undefined') {
        effect.stereo.eyeSep = eyeSeparation;
      }
      if (effect.stereo && typeof effect.stereo.aspect !== 'undefined') {
        effect.stereo.aspect = 0.5;
      }
      if (camera && typeof camera.setFocalLength === 'function') {
        camera.setFocalLength(focalLength);
      }
    }

    function setPreset(name) {
      if (name === 'subtle') {
        eyeSeparation = 0.032;
        focalLength = 20;
      } else if (name === 'normal') {
        eyeSeparation = 0.064;
        focalLength = 15;
      } else if (name === 'extreme') {
        eyeSeparation = 0.150;
        focalLength = 8;
      }
      activePreset = name;
      updateEffectParameters();
    }

    document.getElementById('btn-subtle').addEventListener('click', () => setPreset('subtle'));
    document.getElementById('btn-normal').addEventListener('click', () => setPreset('normal'));
    document.getElementById('btn-extreme').addEventListener('click', () => setPreset('extreme'));

    function updateCameraOrbit() {
      const radius = Math.sqrt(camera.position.x * camera.position.x + camera.position.z * camera.position.z);
      const y = camera.position.y;
      const rad = THREE.MathUtils.degToRad(cameraAngleDeg);
      camera.position.x = Math.sin(rad) * radius;
      camera.position.z = Math.cos(rad) * radius;
      camera.position.y = y;
      camera.lookAt(0, 0, 0);
    }

    function markCustomIfNeeded() {
      const presets = {
        subtle: { eye: 0.032, focal: 20 },
        normal: { eye: 0.064, focal: 15 },
        extreme: { eye: 0.150, focal: 8 }
      };
      const match = Object.entries(presets).find(([, p]) =>
        Math.abs(eyeSeparation - p.eye) < 1e-6 && Math.abs(focalLength - p.focal) < 1e-6
      );
      activePreset = match ? match[0] : 'custom';
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key;

      if (key === '[') {
        eyeSeparation = clamp(eyeSeparation - 0.008, 0.008, 0.200);
        markCustomIfNeeded();
        updateEffectParameters();
      } else if (key === ']') {
        eyeSeparation = clamp(eyeSeparation + 0.008, 0.008, 0.200);
        markCustomIfNeeded();
        updateEffectParameters();
      } else if (key === '-') {
        focalLength = clamp(focalLength - 1, 5, 50);
        markCustomIfNeeded();
        updateEffectParameters();
      } else if (key === '=') {
        focalLength = clamp(focalLength + 1, 5, 50);
        markCustomIfNeeded();
        updateEffectParameters();
      } else if (key === ' ' || key === 'Spacebar' || e.code === 'Space') {
        e.preventDefault();
        anaglyphEnabled = !anaglyphEnabled;
      } else if (key === 'ArrowUp') {
        e.preventDefault();
        rotationSpeed = clamp(rotationSpeed + 0.005, 0.0, 0.1);
      } else if (key === 'ArrowDown') {
        e.preventDefault();
        rotationSpeed = clamp(rotationSpeed - 0.005, 0.0, 0.1);
      } else if (key === 'a' || key === 'A') {
        cameraAngleDeg -= 15;
        updateCameraOrbit();
      } else if (key === 'd' || key === 'D') {
        cameraAngleDeg += 15;
        updateCameraOrbit();
      } else if (key === 'c' || key === 'C') {
        convergencePlane.visible = !convergencePlane.visible;
      }
    });

    function updateConvergencePlane() {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      const camPos = camera.position.clone();
      const planePos = camPos.clone().add(camDir.multiplyScalar(focalLength));
      convergencePlane.position.copy(planePos);
      convergencePlane.quaternion.copy(camera.quaternion);
    }

    function updateHUD() {
      const normalizedAngle = ((cameraAngleDeg % 360) + 360) % 360;
      hudText.innerHTML =
        `Eye Sep: ${eyeSeparation.toFixed(3)}<br>` +
        `Focal Len: ${focalLength}<br>` +
        `Mode: ${anaglyphEnabled ? 'Anaglyph' : 'Mono'}<br>` +
        `Rot Speed: ${rotationSpeed.toFixed(3)}<br>` +
        `Camera Angle: ${normalizedAngle}°`;
    }

    function countSceneMeshes() {
      let count = 0;
      scene.traverse((obj) => {
        if (obj.isMesh && obj !== convergencePlane) count++;
      });
      return count;
    }

    function updateState() {
      window.__3D_STATE__ = {
        eyeSeparation,
        focalLength,
        anaglyphEnabled,
        rotationSpeed,
        cameraAngleDeg: ((cameraAngleDeg % 360) + 360) % 360,
        cameraPosition: {
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z
        },
        convergencePlaneVisible: convergencePlane.visible,
        objectCount: countSceneMeshes(),
        objectRotations: objects.map(o => o.rotation.y),
        activePreset,
        frameCount,
        rendererSize: {
          width: renderer.domElement.width,
          height: renderer.domElement.height
        },
        torusKnotY: torusKnot.position.y,
        effectType: anaglyphEnabled ? 'anaglyph' : 'mono'
      };
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      effect.setSize(window.innerWidth, window.innerHeight);
      updateEffectParameters();
    }

    window.addEventListener('resize', onResize);

    updateEffectParameters();
    updateCameraOrbit();
    updateHUD();
    updateState();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      frameCount++;

      for (let i = 0; i < objects.length; i++) {
        objects[i].rotation.y += rotationSpeed;
      }

      torusKnot.position.y = basePositions[0] + Math.sin(t) * 0.3;

      updateConvergencePlane();
      updateHUD();
      updateState();

      if (anaglyphEnabled) {
        effect.render(scene, camera);
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();
  </script>
</body>
</html>
