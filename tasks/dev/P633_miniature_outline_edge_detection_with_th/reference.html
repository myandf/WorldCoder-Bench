<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diorama Edge Controls</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      overflow: hidden;
    }
    body {
      width: 100vw;
      height: 100vh;
      font-family: monospace;
    }
    canvas {
      display: block;
      margin: 0;
    }
    #controls {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 260px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      padding: 15px;
      color: white;
      z-index: 1000;
      box-sizing: border-box;
      user-select: none;
    }
    #controls .title {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .control-group input[type="range"] {
      width: 100%;
    }
    .control-group input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #243b55;
      color: white;
      cursor: pointer;
      font-family: monospace;
    }
    button:hover {
      background: #2f4b6b;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      color: #c7c7d9;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="title">Diorama Edge Controls</div>

    <div class="control-group">
      <label for="thicknessSlider">
        <span>Edge Thickness</span>
        <span id="thicknessValue">1.0</span>
      </label>
      <input id="thicknessSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
    </div>

    <div class="control-group">
      <label for="strengthSlider">
        <span>Edge Strength</span>
        <span id="strengthValue">1.0</span>
      </label>
      <input id="strengthSlider" type="range" min="0" max="2" step="0.05" value="1.0" />
    </div>

    <div class="control-group">
      <label for="thresholdSlider">
        <span>Edge Threshold</span>
        <span id="thresholdValue">0.10</span>
      </label>
      <input id="thresholdSlider" type="range" min="0" max="1" step="0.01" value="0.1" />
    </div>

    <div class="control-group">
      <label for="blurSlider">
        <span>Blur Amount</span>
        <span id="blurValue">2.0</span>
      </label>
      <input id="blurSlider" type="range" min="0" max="6" step="0.1" value="2.0" />
    </div>

    <div class="control-group">
      <label for="edgeColorPicker">
        <span>Edge Color</span>
      </label>
      <input id="edgeColorPicker" type="color" value="#000000" />
    </div>

    <button id="blendModeBtn">Blend Mode: Overlay</button>
    <button id="tiltShiftBtn">Toggle Tilt-Shift: ON</button>
    <button id="resetBtn">Reset All</button>

    <div class="hint">
      Keys: 1/2/3 blend mode, T tilt-shift, R reset, +/- thickness, E edge pass on/off
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';

    const WIDTH = 960;
    const HEIGHT = 600;
    const BG = '#1a1a2e';

    const defaults = {
      edgeThickness: 1.0,
      edgeStrength: 1.0,
      edgeThreshold: 0.1,
      blurAmount: 2.0,
      edgeColor: '#000000',
      blendMode: 0,
      tiltShiftEnabled: true,
      edgePassEnabled: true
    };

    const blendModeNames = ['Overlay', 'Edges Only', 'Inverted'];

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(WIDTH, HEIGHT);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(BG);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG);

    const camera = new THREE.PerspectiveCamera(45, WIDTH / HEIGHT, 0.1, 100);
    camera.position.set(6, 5, 6);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 15;
    controls.target.set(0, 0.6, 0);

    const ambient = new THREE.AmbientLight('#404060', 0.5);
    scene.add(ambient);

    const hemi = new THREE.HemisphereLight('#87ceeb', '#3d2b1f', 0.3);
    scene.add(hemi);

    const dirLight = new THREE.DirectionalLight('#ffffff', 1.2);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.left = -8;
    dirLight.shadow.camera.right = 8;
    dirLight.shadow.camera.top = 8;
    dirLight.shadow.camera.bottom = -8;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 25;
    scene.add(dirLight);

    const dioramaGroup = new THREE.Group();
    scene.add(dioramaGroup);

    const woodMat = new THREE.MeshStandardMaterial({ color: '#8B6914', roughness: 0.8, metalness: 0.1 });
    const base = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.3, 64), woodMat);
    base.position.y = -0.15;
    base.receiveShadow = true;
    base.castShadow = true;
    dioramaGroup.add(base);

    const houseMat = new THREE.MeshStandardMaterial({ color: '#c0392b', roughness: 0.7 });
    const house = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 1), houseMat);
    house.position.set(-0.8, 0.4, 0);
    house.castShadow = true;
    house.receiveShadow = true;
    dioramaGroup.add(house);

    const roofMat = new THREE.MeshStandardMaterial({ color: '#2c3e50', roughness: 0.7 });
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.85, 0.6, 4), roofMat);
    roof.position.set(-0.8, 1.1, 0);
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    roof.receiveShadow = true;
    dioramaGroup.add(roof);

    const trunkMat = new THREE.MeshStandardMaterial({ color: '#5d4037', roughness: 0.9 });
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.8, 8), trunkMat);
    trunk.position.set(1, 0.4, 0.5);
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    dioramaGroup.add(trunk);

    const foliageMat = new THREE.MeshStandardMaterial({ color: '#27ae60', roughness: 0.9 });
    const foliage = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), foliageMat);
    foliage.position.set(1, 1.1, 0.5);
    foliage.castShadow = true;
    foliage.receiveShadow = true;
    dioramaGroup.add(foliage);

    const fenceMat = new THREE.MeshStandardMaterial({ color: '#deb887', roughness: 0.8 });
    const postXs = [-0.2, 0.3667, 0.9333, 1.5];
    postXs.forEach(x => {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.05), fenceMat);
      post.position.set(x, 0.15, 1.2);
      post.castShadow = true;
      post.receiveShadow = true;
      dioramaGroup.add(post);
    });

    const rail = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.04, 0.04), fenceMat);
    rail.position.set(0.65, 0.22, 1.2);
    rail.castShadow = true;
    rail.receiveShadow = true;
    dioramaGroup.add(rail);

    const boulderMat = new THREE.MeshStandardMaterial({ color: '#7f8c8d', roughness: 0.95 });
    const boulder = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), boulderMat);
    boulder.position.set(0.5, 0.1, -0.8);
    boulder.castShadow = true;
    boulder.receiveShadow = true;
    dioramaGroup.add(boulder);

    const renderPass = new RenderPass(scene, camera);

    const edgeShader = {
      uniforms: {
        tDiffuse: { value: null },
        uResolution: { value: new THREE.Vector2(WIDTH, HEIGHT) },
        uEdgeThickness: { value: defaults.edgeThickness },
        uEdgeColor: { value: new THREE.Color(defaults.edgeColor) },
        uEdgeStrength: { value: defaults.edgeStrength },
        uThreshold: { value: defaults.edgeThreshold },
        uBlendMode: { value: defaults.blendMode },
        uEnabled: { value: defaults.edgePassEnabled }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2 uResolution;
        uniform float uEdgeThickness;
        uniform vec3 uEdgeColor;
        uniform float uEdgeStrength;
        uniform float uThreshold;
        uniform int uBlendMode;
        uniform bool uEnabled;
        varying vec2 vUv;

        float luminance(vec3 c) {
          return dot(c, vec3(0.299, 0.587, 0.114));
        }

        void main() {
          vec4 base = texture2D(tDiffuse, vUv);

          if (!uEnabled) {
            gl_FragColor = base;
            return;
          }

          vec2 texel = (1.0 / uResolution) * max(uEdgeThickness, 0.0001);

          float tl = luminance(texture2D(tDiffuse, vUv + texel * vec2(-1.0, -1.0)).rgb);
          float tc = luminance(texture2D(tDiffuse, vUv + texel * vec2( 0.0, -1.0)).rgb);
          float tr = luminance(texture2D(tDiffuse, vUv + texel * vec2( 1.0, -1.0)).rgb);

          float ml = luminance(texture2D(tDiffuse, vUv + texel * vec2(-1.0,  0.0)).rgb);
          float mc = luminance(texture2D(tDiffuse, vUv).rgb);
          float mr = luminance(texture2D(tDiffuse, vUv + texel * vec2( 1.0,  0.0)).rgb);

          float bl = luminance(texture2D(tDiffuse, vUv + texel * vec2(-1.0,  1.0)).rgb);
          float bc = luminance(texture2D(tDiffuse, vUv + texel * vec2( 0.0,  1.0)).rgb);
          float br = luminance(texture2D(tDiffuse, vUv + texel * vec2( 1.0,  1.0)).rgb);

          float gx = -tl - 2.0 * ml - bl + tr + 2.0 * mr + br;
          float gy = -tl - 2.0 * tc - tr + bl + 2.0 * bc + br;

          float edge = length(vec2(gx, gy)) * uEdgeStrength;
          edge = smoothstep(uThreshold, uThreshold + 0.2, edge);

          vec3 edgeCol = mix(base.rgb, uEdgeColor, edge);

          vec3 outColor;
          if (uBlendMode == 0) {
            outColor = mix(base.rgb, uEdgeColor, edge);
          } else if (uBlendMode == 1) {
            outColor = mix(vec3(1.0), uEdgeColor, edge);
          } else {
            outColor = vec3(1.0) - mix(base.rgb, uEdgeColor, edge);
          }

          gl_FragColor = vec4(outColor, base.a);
        }
      `
    };

    const tiltShiftShader = {
      uniforms: {
        tDiffuse: { value: null },
        uResolution: { value: new THREE.Vector2(WIDTH, HEIGHT) },
        uTiltShiftEnabled: { value: defaults.tiltShiftEnabled },
        uBlurAmount: { value: defaults.blurAmount }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2 uResolution;
        uniform bool uTiltShiftEnabled;
        uniform float uBlurAmount;
        varying vec2 vUv;

        void main() {
          vec4 center = texture2D(tDiffuse, vUv);

          if (!uTiltShiftEnabled || uBlurAmount <= 0.001) {
            gl_FragColor = center;
            return;
          }

          float distFromCenter = abs(vUv.y - 0.5) * 2.0;
          float blurFactor = smoothstep(0.15, 1.0, distFromCenter) * uBlurAmount;
          vec2 texel = 1.0 / uResolution;
          vec2 offset = vec2(0.0, texel.y * blurFactor);

          vec4 color = vec4(0.0);
          color += texture2D(tDiffuse, vUv - offset * 2.0) * 0.12;
          color += texture2D(tDiffuse, vUv - offset * 1.0) * 0.18;
          color += texture2D(tDiffuse, vUv) * 0.40;
          color += texture2D(tDiffuse, vUv + offset * 1.0) * 0.18;
          color += texture2D(tDiffuse, vUv + offset * 2.0) * 0.12;

          gl_FragColor = color;
        }
      `
    };

    const composer = new EffectComposer(renderer);
    composer.setSize(WIDTH, HEIGHT);

    const edgePass = new ShaderPass(edgeShader);
    const tiltShiftPass = new ShaderPass(tiltShiftShader);

    composer.addPass(renderPass);
    composer.addPass(edgePass);
    composer.addPass(tiltShiftPass);

    const el = {
      thicknessSlider: document.getElementById('thicknessSlider'),
      strengthSlider: document.getElementById('strengthSlider'),
      thresholdSlider: document.getElementById('thresholdSlider'),
      blurSlider: document.getElementById('blurSlider'),
      edgeColorPicker: document.getElementById('edgeColorPicker'),
      blendModeBtn: document.getElementById('blendModeBtn'),
      tiltShiftBtn: document.getElementById('tiltShiftBtn'),
      resetBtn: document.getElementById('resetBtn'),
      thicknessValue: document.getElementById('thicknessValue'),
      strengthValue: document.getElementById('strengthValue'),
      thresholdValue: document.getElementById('thresholdValue'),
      blurValue: document.getElementById('blurValue')
    };

    const state = {
      edgeThickness: defaults.edgeThickness,
      edgeStrength: defaults.edgeStrength,
      edgeThreshold: defaults.edgeThreshold,
      edgeColor: new THREE.Color(defaults.edgeColor),
      blendMode: defaults.blendMode,
      tiltShiftEnabled: defaults.tiltShiftEnabled,
      blurAmount: defaults.blurAmount,
      edgePassEnabled: defaults.edgePassEnabled,
      frameCount: 0
    };

    function countMeshes(root) {
      let count = 0;
      root.traverse(obj => {
        if (obj.isMesh) count++;
      });
      return count;
    }

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function syncUniforms() {
      edgePass.uniforms.uEdgeThickness.value = state.edgeThickness;
      edgePass.uniforms.uEdgeStrength.value = state.edgeStrength;
      edgePass.uniforms.uThreshold.value = state.edgeThreshold;
      edgePass.uniforms.uEdgeColor.value.copy(state.edgeColor);
      edgePass.uniforms.uBlendMode.value = state.blendMode;
      edgePass.uniforms.uEnabled.value = state.edgePassEnabled;

      tiltShiftPass.uniforms.uTiltShiftEnabled.value = state.tiltShiftEnabled;
      tiltShiftPass.uniforms.uBlurAmount.value = state.blurAmount;
    }

    function syncUI() {
      el.thicknessSlider.value = state.edgeThickness.toFixed(1);
      el.strengthSlider.value = state.edgeStrength.toFixed(2);
      el.thresholdSlider.value = state.edgeThreshold.toFixed(2);
      el.blurSlider.value = state.blurAmount.toFixed(1);
      el.edgeColorPicker.value = '#' + state.edgeColor.getHexString();

      el.thicknessValue.textContent = state.edgeThickness.toFixed(1);
      el.strengthValue.textContent = state.edgeStrength.toFixed(2);
      el.thresholdValue.textContent = state.edgeThreshold.toFixed(2);
      el.blurValue.textContent = state.blurAmount.toFixed(1);

      el.blendModeBtn.textContent = `Blend Mode: ${blendModeNames[state.blendMode]}`;
      el.tiltShiftBtn.textContent = `Toggle Tilt-Shift: ${state.tiltShiftEnabled ? 'ON' : 'OFF'}`;
    }

    function updateExposedState() {
      window.__3D_STATE__ = {
        edgeThickness: state.edgeThickness,
        edgeStrength: state.edgeStrength,
        edgeThreshold: state.edgeThreshold,
        edgeColor: {
          r: state.edgeColor.r,
          g: state.edgeColor.g,
          b: state.edgeColor.b
        },
        blendMode: state.blendMode,
        blendModeName: blendModeNames[state.blendMode],
        tiltShiftEnabled: state.tiltShiftEnabled,
        blurAmount: state.blurAmount,
        edgePassEnabled: state.edgePassEnabled,
        objectCount: countMeshes(dioramaGroup),
        composerPassCount: composer.passes.length,
        cameraDistance: camera.position.length(),
        frameCount: state.frameCount,
        rendererInfo: {
          drawCalls: renderer.info.render.calls,
          triangles: renderer.info.render.triangles
        }
      };
    }

    function applyAll() {
      syncUniforms();
      syncUI();
      updateExposedState();
    }

    function setBlendMode(mode) {
      state.blendMode = ((mode % 3) + 3) % 3;
      applyAll();
    }

    function toggleTiltShift() {
      state.tiltShiftEnabled = !state.tiltShiftEnabled;
      applyAll();
    }

    function toggleEdgePass() {
      state.edgePassEnabled = !state.edgePassEnabled;
      applyAll();
    }

    function resetAll() {
      state.edgeThickness = defaults.edgeThickness;
      state.edgeStrength = defaults.edgeStrength;
      state.edgeThreshold = defaults.edgeThreshold;
      state.blurAmount = defaults.blurAmount;
      state.edgeColor.set(defaults.edgeColor);
      state.blendMode = defaults.blendMode;
      state.tiltShiftEnabled = defaults.tiltShiftEnabled;
      state.edgePassEnabled = defaults.edgePassEnabled;
      applyAll();
    }

    el.thicknessSlider.addEventListener('input', () => {
      state.edgeThickness = parseFloat(el.thicknessSlider.value);
      applyAll();
    });

    el.strengthSlider.addEventListener('input', () => {
      state.edgeStrength = parseFloat(el.strengthSlider.value);
      applyAll();
    });

    el.thresholdSlider.addEventListener('input', () => {
      state.edgeThreshold = parseFloat(el.thresholdSlider.value);
      applyAll();
    });

    el.blurSlider.addEventListener('input', () => {
      state.blurAmount = parseFloat(el.blurSlider.value);
      applyAll();
    });

    el.edgeColorPicker.addEventListener('input', () => {
      state.edgeColor.set(el.edgeColorPicker.value);
      applyAll();
    });

    el.blendModeBtn.addEventListener('click', () => {
      setBlendMode(state.blendMode + 1);
    });

    el.tiltShiftBtn.addEventListener('click', () => {
      toggleTiltShift();
    });

    el.resetBtn.addEventListener('click', () => {
      resetAll();
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key;

      if (key === '1') setBlendMode(0);
      else if (key === '2') setBlendMode(1);
      else if (key === '3') setBlendMode(2);
      else if (key === 't' || key === 'T') toggleTiltShift();
      else if (key === 'r' || key === 'R') resetAll();
      else if (key === 'e' || key === 'E') toggleEdgePass();
      else if (key === '+' || key === '=') {
        state.edgeThickness = clamp(Math.round((state.edgeThickness + 0.5) * 10) / 10, 0, 5);
        applyAll();
      } else if (key === '-' || key === '−' || key === '_') {
        state.edgeThickness = clamp(Math.round((state.edgeThickness - 0.5) * 10) / 10, 0, 5);
        applyAll();
      }
    });

    applyAll();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      state.frameCount++;
      composer.render();
      updateExposedState();
    }

    animate();
  </script>
</body>
</html>
