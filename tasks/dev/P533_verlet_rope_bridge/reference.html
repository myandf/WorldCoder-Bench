<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js Verlet Rope Bridge</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(255,255,255,0.88);
      padding: 12px 14px;
      border-radius: 8px;
      min-width: 250px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      font-size: 14px;
      line-height: 1.35;
    }
    #ui h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    .row {
      margin: 7px 0;
    }
    .row label {
      display: block;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #333;
    }
    #hud {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(0,0,0,0.15);
    }
    #hud div {
      margin: 3px 0;
    }
    input[type="range"] {
      width: 100%;
    }
    .value {
      font-weight: normal;
      color: #222;
    }
  </style>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <div id="ui">
    <h3>Verlet Rope Bridge</h3>

    <div class="row">
      <label for="slider-gravity">Gravity: <span id="gravity-value" class="value">9.81</span></label>
      <input id="slider-gravity" type="range" min="1" max="30" step="0.5" value="9.81" />
    </div>

    <div class="row">
      <label for="slider-iterations">Constraint Iterations: <span id="iterations-value" class="value">5</span></label>
      <input id="slider-iterations" type="range" min="1" max="20" step="1" value="5" />
    </div>

    <div class="hint">
      Keys: <b>Space</b> Play/Pause, <b>W</b> Add weight, <b>Q</b> Remove weight, <b>S</b> Snap bridge, <b>R</b> Reset
    </div>

    <div id="hud">
      <div>Particle count: <span id="hud-particles">30</span></div>
      <div>Bridge sag: <span id="hud-sag">0.00</span></div>
      <div>Weight active: <span id="hud-weight">No</span></div>
      <div>Bridge intact: <span id="hud-intact">Yes</span></div>
      <div>Gravity: <span id="hud-gravity">9.81</span></div>
      <div>Paused: <span id="hud-paused">Playing</span></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 2, 0);

    const ambient = new THREE.AmbientLight(0x606060);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 15, 10);
    scene.add(dirLight);

    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x3fa34d });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2;
    scene.add(ground);

    const pillarMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
    const pillarGeo = new THREE.CylinderGeometry(0.6, 0.8, 5, 20);

    const leftPillar = new THREE.Mesh(pillarGeo, pillarMat);
    leftPillar.position.set(-15, 2.5, 0);
    scene.add(leftPillar);

    const rightPillar = new THREE.Mesh(pillarGeo, pillarMat);
    rightPillar.position.set(15, 2.5, 0);
    scene.add(rightPillar);

    const anchorMarkerGeo = new THREE.SphereGeometry(0.25, 16, 16);
    const anchorMarkerMat = new THREE.MeshStandardMaterial({ color: 0x553311 });
    const leftAnchorMarker = new THREE.Mesh(anchorMarkerGeo, anchorMarkerMat);
    const rightAnchorMarker = new THREE.Mesh(anchorMarkerGeo, anchorMarkerMat);
    leftAnchorMarker.position.set(-15, 5, 0);
    rightAnchorMarker.position.set(15, 5, 0);
    scene.add(leftAnchorMarker, rightAnchorMarker);

    const PARTICLE_COUNT = 30;
    const REST_DISTANCE = 1.0;
    const ANCHOR_LEFT = new THREE.Vector3(-15, 5, 0);
    const ANCHOR_RIGHT = new THREE.Vector3(15, 5, 0);
    const MID_INDEX = 15;
    const ANCHOR_Y = 5;
    const PARTICLE_RADIUS = 0.15;
    const SEGMENT_RADIUS = 0.09;
    const RAILING_HEIGHT = 1.0;
    const FIXED_DT = 1 / 60;
    const MAX_STEPS = 3;

    let gravityValue = parseFloat(document.getElementById('slider-gravity').value);
    let constraintIterations = parseInt(document.getElementById('slider-iterations').value, 10);
    let hasWeight = false;
    let isIntact = true;
    let isPaused = false;
    let frameCount = 0;

    const particles = [];
    const constraints = [];

    const particleGroup = new THREE.Group();
    const segmentGroup = new THREE.Group();
    const railingGroup = new THREE.Group();
    scene.add(segmentGroup, railingGroup, particleGroup);

    const particleGeo = new THREE.SphereGeometry(PARTICLE_RADIUS, 16, 16);
    const particleMat = new THREE.MeshStandardMaterial({ color: 0xd8c3a5, roughness: 0.7, metalness: 0.05 });

    const segmentGeo = new THREE.CylinderGeometry(SEGMENT_RADIUS, SEGMENT_RADIUS, 1, 10);
    const segmentMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });

    const railingMat = new THREE.LineBasicMaterial({ color: 0x444444 });

    function makeParticleMesh() {
      return new THREE.Mesh(particleGeo, particleMat);
    }

    function makeSegmentMesh() {
      return new THREE.Mesh(segmentGeo, segmentMat);
    }

    function makeRailingLine() {
      const geom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(),
        new THREE.Vector3(0, RAILING_HEIGHT, 0)
      ]);
      return new THREE.Line(geom, railingMat);
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const mesh = makeParticleMesh();
      particleGroup.add(mesh);

      particles.push({
        pos: new THREE.Vector3(),
        oldPos: new THREE.Vector3(),
        acc: new THREE.Vector3(),
        pinned: i === 0 || i === PARTICLE_COUNT - 1,
        massMultiplier: 1,
        mesh
      });
    }

    for (let i = 0; i < PARTICLE_COUNT - 1; i++) {
      const mesh = makeSegmentMesh();
      segmentGroup.add(mesh);

      const line = makeRailingLine();
      railingGroup.add(line);

      constraints.push({
        a: i,
        b: i + 1,
        rest: REST_DISTANCE,
        active: true,
        mesh,
        railing: line
      });
    }

    const upAxis = new THREE.Vector3(0, 1, 0);

    function resetBridge() {
      hasWeight = false;
      isIntact = true;

      const step = new THREE.Vector3().subVectors(ANCHOR_RIGHT, ANCHOR_LEFT).divideScalar(PARTICLE_COUNT - 1);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        const pos = new THREE.Vector3().copy(ANCHOR_LEFT).addScaledVector(step, i);
        p.pos.copy(pos);
        p.oldPos.copy(pos);
        p.acc.set(0, 0, 0);
        p.massMultiplier = 1;
      }

      particles[0].pos.copy(ANCHOR_LEFT);
      particles[0].oldPos.copy(ANCHOR_LEFT);
      particles[PARTICLE_COUNT - 1].pos.copy(ANCHOR_RIGHT);
      particles[PARTICLE_COUNT - 1].oldPos.copy(ANCHOR_RIGHT);

      for (let i = 0; i < constraints.length; i++) {
        constraints[i].active = true;
        constraints[i].mesh.visible = true;
        constraints[i].railing.visible = true;
      }

      updateVisuals();
      updateHUDAndState();
    }

    function applyWeight() {
      hasWeight = true;
      particles[MID_INDEX].massMultiplier = 3;
    }

    function removeWeight() {
      hasWeight = false;
      particles[MID_INDEX].massMultiplier = 1;
    }

    function snapBridge() {
      const c = constraints.find(con => con.a === 14 && con.b === 15);
      if (c) {
        c.active = false;
        c.mesh.visible = false;
      }
      isIntact = false;
    }

    function integrate(dt) {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];

        if (p.pinned) {
          if (i === 0) {
            p.pos.copy(ANCHOR_LEFT);
            p.oldPos.copy(ANCHOR_LEFT);
          } else if (i === PARTICLE_COUNT - 1) {
            p.pos.copy(ANCHOR_RIGHT);
            p.oldPos.copy(ANCHOR_RIGHT);
          }
          continue;
        }

        const velocity = new THREE.Vector3().subVectors(p.pos, p.oldPos).multiplyScalar(0.99);
        const current = p.pos.clone();
        const effectiveAcc = new THREE.Vector3(0, -gravityValue * p.massMultiplier, 0);

        p.pos.add(velocity).addScaledVector(effectiveAcc, dt * dt);
        p.oldPos.copy(current);
      }
    }

    function solveConstraints() {
      for (let iter = 0; iter < constraintIterations; iter++) {
        for (let i = 0; i < constraints.length; i++) {
          const c = constraints[i];
          if (!c.active) continue;

          const p1 = particles[c.a];
          const p2 = particles[c.b];

          const delta = new THREE.Vector3().subVectors(p2.pos, p1.pos);
          let dist = delta.length();
          if (dist === 0) dist = 1e-8;

          const diff = (dist - c.rest) / dist;

          if (!p1.pinned && !p2.pinned) {
            p1.pos.addScaledVector(delta, 0.5 * diff);
            p2.pos.addScaledVector(delta, -0.5 * diff);
          } else if (p1.pinned && !p2.pinned) {
            p2.pos.addScaledVector(delta, -diff);
          } else if (!p1.pinned && p2.pinned) {
            p1.pos.addScaledVector(delta, diff);
          }
        }

        particles[0].pos.copy(ANCHOR_LEFT);
        particles[PARTICLE_COUNT - 1].pos.copy(ANCHOR_RIGHT);
      }
    }

    function updateVisuals() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles[i].mesh.position.copy(particles[i].pos);
      }

      for (let i = 0; i < constraints.length; i++) {
        const c = constraints[i];
        const p1 = particles[c.a].pos;
        const p2 = particles[c.b].pos;

        c.railing.position.copy(p1);

        if (!c.active) {
          c.mesh.visible = false;
          continue;
        }

        c.mesh.visible = true;

        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        const dir = new THREE.Vector3().subVectors(p2, p1);
        const len = dir.length();

        c.mesh.position.copy(mid);
        c.mesh.scale.set(1, len, 1);
        c.mesh.quaternion.setFromUnitVectors(upAxis, dir.clone().normalize());
      }
    }

    function computeMetrics() {
      let lowestY = Infinity;
      let valid = true;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i].pos;
        if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.z)) {
          valid = false;
        }
        if (p.y < lowestY) lowestY = p.y;
      }

      const sag = Math.max(0, ANCHOR_Y - lowestY);
      return { lowestY, sag, valid };
    }

    function updateHUDAndState() {
      const metrics = computeMetrics();
      const midpoint = particles[MID_INDEX].pos;

      document.getElementById('hud-particles').textContent = String(PARTICLE_COUNT);
      document.getElementById('hud-sag').textContent = metrics.sag.toFixed(2);
      document.getElementById('hud-weight').textContent = hasWeight ? 'Yes' : 'No';
      document.getElementById('hud-intact').textContent = isIntact ? 'Yes' : 'No';
      document.getElementById('hud-gravity').textContent = gravityValue.toFixed(2);
      document.getElementById('hud-paused').textContent = isPaused ? 'Paused' : 'Playing';

      window.__3D_STATE__ = {
        particleCount: PARTICLE_COUNT,
        bridgeSag: Number(metrics.sag.toFixed(3)),
        hasWeight,
        isIntact,
        isPaused,
        gravity: gravityValue,
        constraintIterations,
        lowestParticleY: Number(metrics.lowestY.toFixed(3)),
        frameCount,
        particlesValid: metrics.valid,
        midpointPosition: {
          x: Number(midpoint.x.toFixed(3)),
          y: Number(midpoint.y.toFixed(3)),
          z: Number(midpoint.z.toFixed(3))
        }
      };
    }

    document.getElementById('slider-gravity').addEventListener('input', (e) => {
      gravityValue = parseFloat(e.target.value);
      document.getElementById('gravity-value').textContent = gravityValue.toFixed(2);
    });

    document.getElementById('slider-iterations').addEventListener('input', (e) => {
      constraintIterations = parseInt(e.target.value, 10);
      document.getElementById('iterations-value').textContent = String(constraintIterations);
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (e.code === 'Space') {
        e.preventDefault();
        isPaused = !isPaused;
        return;
      }
      if (key === 'w') {
        applyWeight();
      } else if (key === 'q') {
        removeWeight();
      } else if (key === 's') {
        snapBridge();
      } else if (key === 'r') {
        resetBridge();
      }
    });

    let accumulator = 0;
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const deltaSec = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      accumulator += deltaSec;

      controls.update();

      if (!isPaused) {
        let steps = 0;
        while (accumulator >= FIXED_DT && steps < MAX_STEPS) {
          integrate(FIXED_DT);
          solveConstraints();
          accumulator -= FIXED_DT;
          steps++;
        }
      } else {
        accumulator = 0;
      }

      updateVisuals();
      frameCount++;
      updateHUDAndState();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetBridge();
    document.getElementById('gravity-value').textContent = gravityValue.toFixed(2);
    document.getElementById('iterations-value').textContent = String(constraintIterations);
    updateHUDAndState();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
