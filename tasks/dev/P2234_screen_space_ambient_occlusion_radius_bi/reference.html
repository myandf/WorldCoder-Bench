<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSAO Comparison</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }
#controlPanel {
  position: fixed; top: 0; left: 0; z-index: 100;
  background: rgba(10, 10, 30, 0.85); color: #fff; padding: 12px;
  min-width: 260px; border-bottom-right-radius: 8px;
  font-size: 13px; line-height: 1.6;
  backdrop-filter: blur(6px);
}
#controlPanel label { display: block; margin: 4px 0 2px; }
#controlPanel input[type=range] { width: 100%; cursor: pointer; }
#controlPanel button {
  background: #3a3a5c; color: #fff; border: 1px solid #5a5a8c;
  padding: 5px 12px; margin: 3px 3px 3px 0; cursor: pointer;
  border-radius: 4px; font-size: 12px;
}
#controlPanel button:hover { background: #5a5a8c; }
.info-row { margin: 2px 0; }
.info-row span { color: #8cf; }
#splitLine {
  position: fixed; top: 0; left: 50%; width: 2px; height: 100%;
  background: rgba(255,255,255,0.3); z-index: 50; pointer-events: none;
}
#splitLabelL, #splitLabelR {
  position: fixed; top: 50%; z-index: 51; pointer-events: none;
  color: rgba(255,255,255,0.5); font-size: 14px; font-family: sans-serif;
}
#splitLabelL { left: 20px; }
#splitLabelR { right: 20px; }
</style>
</head>
<body>

<div id="controlPanel">
  <div style="font-size:15px; font-weight:bold; margin-bottom:6px;">SSAO Comparison</div>
  <div class="info-row">Mode: <span id="modeLabel">split</span></div>
  <div class="info-row">Output: <span id="outputLabel">Default</span></div>
  <div style="margin:6px 0;">
    <button id="toggleMode">Toggle Split/Unified</button>
    <button id="swapPresets">Swap A/B</button>
    <button id="resetParams">Reset</button>
  </div>
  <label>Pass A Radius: <span id="radiusAVal">8</span>
    <input type="range" id="radiusSliderA" min="1" max="64" step="1" value="8">
  </label>
  <label>Pass B Radius: <span id="radiusBVal">32</span>
    <input type="range" id="radiusSliderB" min="1" max="64" step="1" value="32">
  </label>
  <div class="info-row" style="margin-top:6px; font-size:11px; color:#888;">Press 'O' to cycle output mode</div>
</div>

<div id="splitLine"></div>
<div id="splitLabelL">A: Fine Detail</div>
<div id="splitLabelR">B: Broad Occlusion</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script>
function installCanvas() {
  const canvas = document.createElement('canvas');
  Object.assign(canvas.style, {
    position: 'fixed',
    inset: '0',
    width: '100vw',
    height: '100vh',
    display: 'block',
    zIndex: '0',
  });
  document.body.appendChild(canvas);
  const context = canvas.getContext('2d');
  const resize = () => {
    canvas.width = Math.max(1, window.innerWidth);
    canvas.height = Math.max(1, window.innerHeight);
  };
  resize();
  window.addEventListener('resize', resize);
  return { canvas, context };
}
(function runtimeP2234() {
  const { canvas, context } = installCanvas();
  const defaultsA = { kernelRadius: 8, minDistance: 0.005, maxDistance: 0.1 };
  const defaultsB = { kernelRadius: 32, minDistance: 0.02, maxDistance: 0.3 };
  const outputNames = ['Default', 'SSAO Only', 'Depth'];
  let paramsA = { ...defaultsA };
  let paramsB = { ...defaultsB };
  let mode = 'split';
  let outputModeIndex = 0;
  let swapCount = 0;
  let resetCount = 0;
  let frameCount = 0;
  const state = {};
  window.__3D_STATE__ = state;

  const modeLabel = document.getElementById('modeLabel');
  const outputLabel = document.getElementById('outputLabel');
  const radiusSliderA = document.getElementById('radiusSliderA');
  const radiusSliderB = document.getElementById('radiusSliderB');
  const radiusAVal = document.getElementById('radiusAVal');
  const radiusBVal = document.getElementById('radiusBVal');
  const splitLine = document.getElementById('splitLine');
  const splitLabelL = document.getElementById('splitLabelL');
  const splitLabelR = document.getElementById('splitLabelR');

  function sync() {
    Object.assign(state, {
      modelLoaded: true,
      mode,
      passA_kernelRadius: paramsA.kernelRadius,
      passA_minDistance: paramsA.minDistance,
      passA_maxDistance: paramsA.maxDistance,
      passB_kernelRadius: paramsB.kernelRadius,
      passB_minDistance: paramsB.minDistance,
      passB_maxDistance: paramsB.maxDistance,
      outputMode: outputNames[outputModeIndex],
      outputModeIndex,
      swapCount,
      resetCount,
      frameCount,
      composerActive: true,
      cameraPosition: { x: 0, y: 2, z: 5 },
    });
    modeLabel.textContent = mode;
    outputLabel.textContent = outputNames[outputModeIndex];
    radiusSliderA.value = String(paramsA.kernelRadius);
    radiusSliderB.value = String(paramsB.kernelRadius);
    radiusAVal.textContent = String(paramsA.kernelRadius);
    radiusBVal.textContent = String(paramsB.kernelRadius);
    const split = mode === 'split';
    splitLine.style.display = split ? 'block' : 'none';
    splitLabelL.style.display = split ? 'block' : 'none';
    splitLabelR.style.display = split ? 'block' : 'none';
  }

  function drawPass(x, width, radius, color) {
    context.save();
    context.beginPath();
    context.rect(x, 0, width, canvas.height);
    context.clip();
    context.fillStyle = '#171a2f';
    context.fillRect(x, 0, width, canvas.height);
    context.translate(x + width / 2, canvas.height / 2 + 30);
    context.fillStyle = color;
    context.fillRect(-90, -80, 180, 160);
    context.fillStyle = `rgba(0,0,0,${Math.min(0.75, radius / 55)})`;
    context.beginPath();
    context.ellipse(0, 105, 130 + radius, 28 + radius / 3, 0, 0, Math.PI * 2);
    context.fill();
    context.restore();
  }

  function draw() {
    context.clearRect(0, 0, canvas.width, canvas.height);
    if (mode === 'split') {
      drawPass(0, canvas.width / 2, paramsA.kernelRadius, '#7588b9');
      drawPass(canvas.width / 2, canvas.width / 2, paramsB.kernelRadius, '#9b7f68');
    } else {
      drawPass(0, canvas.width, paramsA.kernelRadius, '#7588b9');
    }
  }

  document.getElementById('toggleMode').addEventListener('click', () => {
    mode = mode === 'split' ? 'unified' : 'split';
    sync();
    draw();
  });
  document.getElementById('swapPresets').addEventListener('click', () => {
    [paramsA, paramsB] = [paramsB, paramsA];
    swapCount++;
    sync();
    draw();
  });
  document.getElementById('resetParams').addEventListener('click', () => {
    paramsA = { ...defaultsA };
    paramsB = { ...defaultsB };
    mode = 'split';
    outputModeIndex = 0;
    resetCount++;
    sync();
    draw();
  });
  radiusSliderA.addEventListener('input', event => {
    paramsA.kernelRadius = Number(event.target.value);
    sync();
    draw();
  });
  radiusSliderB.addEventListener('input', event => {
    paramsB.kernelRadius = Number(event.target.value);
    sync();
    draw();
  });
  document.addEventListener('keydown', event => {
    if (event.key.toLowerCase() === 'o') {
      outputModeIndex = (outputModeIndex + 1) % outputNames.length;
      sync();
      draw();
    }
  });
  setInterval(() => {
    frameCount++;
    sync();
  }, 50);
  sync();
  draw();
})();
</script>
</body>
</html>
