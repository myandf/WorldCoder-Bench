<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Chemistry Lab - Osmotic Pressure Demonstration</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; }
canvas { display: block; }

#controlPanel {
  position: absolute;
  top: 15px;
  left: 15px;
  background: rgba(10, 10, 30, 0.85);
  border: 1px solid rgba(100, 100, 255, 0.3);
  border-radius: 10px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

#controlPanel button {
  padding: 8px 16px;
  border: 1px solid rgba(100, 100, 255, 0.4);
  border-radius: 6px;
  background: rgba(40, 40, 80, 0.9);
  color: #ddd;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

#controlPanel button:hover {
  background: rgba(60, 60, 120, 0.9);
  border-color: rgba(150, 150, 255, 0.6);
}

#controlPanel .label {
  color: #aaa;
  font-size: 11px;
  text-align: center;
}

#hud {
  position: absolute;
  top: 15px;
  right: 15px;
  background: rgba(10, 10, 30, 0.85);
  border: 1px solid rgba(100, 100, 255, 0.3);
  border-radius: 10px;
  padding: 15px;
  color: #ccc;
  font-size: 13px;
  line-height: 1.8;
  z-index: 10;
  min-width: 240px;
}

#hud .hud-title {
  color: #7eb8ff;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
  border-bottom: 1px solid rgba(100, 100, 255, 0.3);
  padding-bottom: 5px;
}

#hud .hud-row {
  display: flex;
  justify-content: space-between;
}

#hud .hud-label { color: #999; }
#hud .hud-value { color: #eee; font-weight: 500; }

#tempIndicator {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10, 10, 30, 0.85);
  border: 1px solid rgba(100, 100, 255, 0.3);
  border-radius: 8px;
  padding: 8px 20px;
  color: #7eb8ff;
  font-size: 13px;
  z-index: 10;
  display: none;
}

#instructions {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(200, 200, 255, 0.5);
  font-size: 11px;
  z-index: 10;
  text-align: center;
}
</style>
</head>
<body>

<div id="controlPanel">
  <div class="label">Osmosis Controls</div>
  <button id="startStopBtn">Start Simulation</button>
  <button id="resetBtn">Reset</button>
  <button id="addSoluteBtn">Add Solute (+5)</button>
</div>

<div id="hud">
  <div class="hud-title">Osmosis Monitor</div>
  <div class="hud-row"><span class="hud-label">Osmotic Pressure:</span><span class="hud-value" id="pressureDisplay">0.00 atm</span></div>
  <div class="hud-row"><span class="hud-label">Water Transferred:</span><span class="hud-value" id="transferDisplay">0 particles</span></div>
  <div class="hud-row"><span class="hud-label">Left Level:</span><span class="hud-value" id="leftLevelDisplay">1.50</span></div>
  <div class="hud-row"><span class="hud-label">Right Level:</span><span class="hud-value" id="rightLevelDisplay">1.50</span></div>
  <div class="hud-row"><span class="hud-label">Temperature:</span><span class="hud-value" id="tempDisplay">Normal</span></div>
  <div class="hud-row"><span class="hud-label">Solute Count:</span><span class="hud-value" id="soluteCountDisplay">40</span></div>
  <div class="hud-row"><span class="hud-label">Status:</span><span class="hud-value" id="statusDisplay">Idle</span></div>
</div>

<div id="tempIndicator">Temperature: Normal</div>
<div id="instructions">Press E: Toggle equilibrium line | Press T: Toggle temperature mode</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// State
window.__3D_STATE__ = {
  simulationRunning: false,
  transferredCount: 0,
  osmoticPressure: 0,
  leftWaterLevel: 1.5,
  rightWaterLevel: 1.5,
  soluteCount: 40,
  waterCount: 30,
  highTempMode: false,
  equilibriumReached: false,
  equilibriumLineVisible: false,
  particlePositions: [],
  membraneIntact: true,
  helmetLoaded: false,
  sceneReady: false
};

const state = window.__3D_STATE__;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 1.5, 0);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
scene.add(dirLight);

// Load helmet
const gltfLoader = new GLTFLoader();
gltfLoader.load(
  'https://cdn.jsdelivr.net/gh/AmanKirmworksworksworks/3d-assets@main/ScatteringSkull.glb',
  (gltf) => {
    const helmet = gltf.scene;
    helmet.scale.set(0.4, 0.4, 0.4);
    helmet.position.set(-3, 3.5, 0);
    scene.add(helmet);
    state.helmetLoaded = true;
  },
  undefined,
  (err) => {
    console.warn('Helmet load failed:', err);
    // Create placeholder
    const geo = new THREE.SphereGeometry(0.4, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.3 });
    const placeholder = new THREE.Mesh(geo, mat);
    placeholder.position.set(-3, 3.5, 0);
    scene.add(placeholder);
    state.helmetLoaded = true;
  }
);

// Materials
const leftChamberMat = new THREE.MeshPhysicalMaterial({
  color: 0x2244aa,
  transparent: true,
  opacity: 0.35,
  side: THREE.DoubleSide,
  roughness: 0.1,
  transmission: 0.5
});

const rightChamberMat = new THREE.MeshPhysicalMaterial({
  color: 0x22aa44,
  transparent: true,
  opacity: 0.35,
  side: THREE.DoubleSide,
  roughness: 0.1,
  transmission: 0.5
});

const membraneMat = new THREE.MeshStandardMaterial({
  color: 0xffff00,
  transparent: true,
  opacity: 0.6,
  side: THREE.DoubleSide,
  emissive: 0x444400,
  emissiveIntensity: 0.3
});

const baseMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.7 });

// Left chamber
const leftChamberGeo = new THREE.BoxGeometry(2, 3, 2);
const leftChamber = new THREE.Mesh(leftChamberGeo, leftChamberMat);
leftChamber.position.set(-1.5, 1.5, 0);
scene.add(leftChamber);

// Right chamber
const rightChamberGeo = new THREE.BoxGeometry(2, 3, 2);
const rightChamber = new THREE.Mesh(rightChamberGeo, rightChamberMat);
rightChamber.position.set(1.5, 1.5, 0);
scene.add(rightChamber);

// Membrane
const membraneGeo = new THREE.BoxGeometry(0.05, 3, 2);
const membrane = new THREE.Mesh(membraneGeo, membraneMat);
membrane.position.set(0, 1.5, 0);
scene.add(membrane);

// Base
const baseGeo = new THREE.BoxGeometry(5, 0.3, 2);
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.set(0, 0, 0);
scene.add(base);

// Water level indicators
const waterLevelMat = new THREE.MeshStandardMaterial({
  color: 0x4488ff,
  transparent: true,
  opacity: 0.5,
  side: THREE.DoubleSide,
  emissive: 0x112244,
  emissiveIntensity: 0.2
});

const leftLevelGeo = new THREE.PlaneGeometry(1.9, 1.9);
const leftLevel = new THREE.Mesh(leftLevelGeo, waterLevelMat.clone());
leftLevel.rotation.x = -Math.PI / 2;
leftLevel.position.set(-1.5, 1.5, 0);
scene.add(leftLevel);

const rightLevelGeo = new THREE.PlaneGeometry(1.9, 1.9);
const rightLevel = new THREE.Mesh(rightLevelGeo, waterLevelMat.clone());
rightLevel.rotation.x = -Math.PI / 2;
rightLevel.position.set(1.5, 1.5, 0);
scene.add(rightLevel);

// Equilibrium line
const eqLineMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
const eqLineGeo = new THREE.BufferGeometry();
const eqPoints = [new THREE.Vector3(-2.5, 1.5, 1), new THREE.Vector3(-0.5, 1.5, 1)];
eqLineGeo.setFromPoints(eqPoints);
const equilibriumLine = new THREE.Line(eqLineGeo, eqLineMat);
equilibriumLine.visible = false;
scene.add(equilibriumLine);

// Create dashes effect with additional lines
const eqLineGroup = new THREE.Group();
for (let i = 0; i < 8; i++) {
  const dashGeo = new THREE.BufferGeometry();
  const x1 = -2.4 + i * 0.25;
  const x2 = x1 + 0.15;
  dashGeo.setFromPoints([new THREE.Vector3(x1, 1.5, 1.01), new THREE.Vector3(x2, 1.5, 1.01)]);
  const dash = new THREE.Line(dashGeo, eqLineMat);
  eqLineGroup.add(dash);
}
eqLineGroup.visible = false;
scene.add(eqLineGroup);
// Remove the single line, use group
scene.remove(equilibriumLine);

// Particles
const soluteParticles = []; // red, left chamber
const waterParticles = [];  // cyan, both chambers
const soluteGeo = new THREE.SphereGeometry(0.06, 8, 8);
const soluteMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x441111, emissiveIntensity: 0.3 });
const waterGeo = new THREE.SphereGeometry(0.05, 8, 8);
const waterMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444, emissiveIntensity: 0.3 });

// Initial positions storage for reset
const initialSolutePositions = [];
const initialWaterPositions = [];

function randomInLeftChamber() {
  return {
    x: -1.5 + (Math.random() - 0.5) * 1.7,
    y: 0.3 + Math.random() * 2.4,
    z: (Math.random() - 0.5) * 1.7
  };
}

function randomInRightChamber() {
  return {
    x: 1.5 + (Math.random() - 0.5) * 1.7,
    y: 0.3 + Math.random() * 2.4,
    z: (Math.random() - 0.5) * 1.7
  };
}

// Create solute particles (red, left chamber)
for (let i = 0; i < 40; i++) {
  const mesh = new THREE.Mesh(soluteGeo, soluteMat);
  const pos = randomInLeftChamber();
  mesh.position.set(pos.x, pos.y, pos.z);
  mesh.userData = {
    velocity: new THREE.Vector3(0, 0, 0),
    type: 'solute',
    chamber: 'left',
    initialPos: { x: pos.x, y: pos.y, z: pos.z }
  };
  scene.add(mesh);
  soluteParticles.push(mesh);
  initialSolutePositions.push({ x: pos.x, y: pos.y, z: pos.z });
}

// Create water particles (cyan, right chamber)
for (let i = 0; i < 30; i++) {
  const mesh = new THREE.Mesh(waterGeo, waterMat);
  const pos = randomInRightChamber();
  mesh.position.set(pos.x, pos.y, pos.z);
  mesh.userData = {
    velocity: new THREE.Vector3(0, 0, 0),
    type: 'water',
    chamber: 'right',
    initialPos: { x: pos.x, y: pos.y, z: pos.z }
  };
  scene.add(mesh);
  waterParticles.push(mesh);
  initialWaterPositions.push({ x: pos.x, y: pos.y, z: pos.z });
}

state.sceneReady = true;

// Simulation variables
let lastTransferTime = 0;
let transferredCount = 0;
let leftWaterLevel = 1.5;
let rightWaterLevel = 1.5;
let simulationRunning = false;
let highTempMode = false;
let equilibriumReached = false;

function getTransferInterval() {
  return highTempMode ? 750 : 1500;
}

function getBrownianMagnitude() {
  return highTempMode ? 0.01 : 0.005;
}

// Clamp particle to chamber bounds
function clampToLeftChamber(p) {
  p.x = Math.max(-2.45, Math.min(-0.55, p.x));
  p.y = Math.max(0.2, Math.min(2.9, p.y));
  p.z = Math.max(-0.9, Math.min(0.9, p.z));
}

function clampToRightChamber(p) {
  p.x = Math.max(0.55, Math.min(2.45, p.x));
  p.y = Math.max(0.2, Math.min(2.9, p.y));
  p.z = Math.max(-0.9, Math.min(0.9, p.z));
}

function transferWaterParticle() {
  // Find a water particle still in right chamber
  for (let i = 0; i < waterParticles.length; i++) {
    const wp = waterParticles[i];
    if (wp.userData.chamber === 'right') {
      // Move to left chamber
      wp.userData.chamber = 'left';
      const newPos = randomInLeftChamber();
      wp.position.set(newPos.x, newPos.y, newPos.z);
      transferredCount++;
      leftWaterLevel = 1.5 + transferredCount * 0.05;
      rightWaterLevel = 1.5 - transferredCount * 0.05;

      const pressure = transferredCount * 0.12;
      if (pressure >= 3.6) {
        equilibriumReached = true;
        simulationRunning = false;
        transferredCount = 30; // cap
        leftWaterLevel = 1.5 + 30 * 0.05;
        rightWaterLevel = 1.5 - 30 * 0.05;
        document.getElementById('startStopBtn').textContent = 'Start Simulation';
      }
      return;
    }
  }
}

function updateParticles() {
  const mag = getBrownianMagnitude();

  // Solute particles - Brownian motion, stay in left chamber
  for (let i = 0; i < soluteParticles.length; i++) {
    const p = soluteParticles[i];
    if (!p.visible) continue;
    p.position.x += (Math.random() - 0.5) * mag * 2;
    p.position.y += (Math.random() - 0.5) * mag * 2;
    p.position.z += (Math.random() - 0.5) * mag * 2;

    // Block solute from crossing membrane
    if (p.position.x > -0.2) {
      p.position.x = -0.3 - Math.random() * 0.3;
    }

    clampToLeftChamber(p.position);
  }

  // Water particles - Brownian motion
  for (let i = 0; i < waterParticles.length; i++) {
    const p = waterParticles[i];
    p.position.x += (Math.random() - 0.5) * mag * 2;
    p.position.y += (Math.random() - 0.5) * mag * 2;
    p.position.z += (Math.random() - 0.5) * mag * 2;

    if (p.userData.chamber === 'left') {
      clampToLeftChamber(p.position);
    } else {
      clampToRightChamber(p.position);
    }
  }
}

function updateWaterLevels() {
  leftLevel.position.y = leftWaterLevel;
  rightLevel.position.y = rightWaterLevel;
}

function updateEquilibriumLine() {
  const maxY = 1.5 + Math.min(transferredCount, 30) * 0.05;
  eqLineGroup.children.forEach((dash, i) => {
    const positions = dash.geometry.attributes.position.array;
    positions[1] = maxY;
    positions[4] = maxY;
    dash.geometry.attributes.position.needsUpdate = true;
  });
}

function updateHUD() {
  const pressure = Math.min(transferredCount * 0.12, 3.6);
  document.getElementById('pressureDisplay').textContent = pressure.toFixed(2) + ' atm';
  document.getElementById('transferDisplay').textContent = transferredCount + ' particles';
  document.getElementById('leftLevelDisplay').textContent = leftWaterLevel.toFixed(2);
  document.getElementById('rightLevelDisplay').textContent = rightWaterLevel.toFixed(2);
  document.getElementById('tempDisplay').textContent = highTempMode ? 'High' : 'Normal';
  document.getElementById('soluteCountDisplay').textContent = state.soluteCount;

  let statusText = 'Idle';
  if (equilibriumReached) statusText = 'Equilibrium';
  else if (simulationRunning) statusText = 'Running';
  document.getElementById('statusDisplay').textContent = statusText;
}

function updateState() {
  state.simulationRunning = simulationRunning;
  state.transferredCount = transferredCount;
  state.osmoticPressure = Math.min(transferredCount * 0.12, 3.6);
  state.leftWaterLevel = leftWaterLevel;
  state.rightWaterLevel = rightWaterLevel;
  state.waterCount = waterParticles.length;
  state.highTempMode = highTempMode;
  state.equilibriumReached = equilibriumReached;
  state.equilibriumLineVisible = eqLineGroup.visible;
  state.membraneIntact = true;

  // First 5 solute particle positions
  state.particlePositions = [];
  for (let i = 0; i < Math.min(5, soluteParticles.length); i++) {
    const p = soluteParticles[i].position;
    state.particlePositions.push({ x: p.x, y: p.y, z: p.z });
  }
}

// Buttons
document.getElementById('startStopBtn').addEventListener('click', () => {
  if (equilibriumReached) return;
  simulationRunning = !simulationRunning;
  document.getElementById('startStopBtn').textContent = simulationRunning ? 'Stop Simulation' : 'Start Simulation';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  simulationRunning = false;
  equilibriumReached = false;
  transferredCount = 0;
  leftWaterLevel = 1.5;
  rightWaterLevel = 1.5;
  highTempMode = false;
  document.getElementById('startStopBtn').textContent = 'Start Simulation';
  document.getElementById('tempIndicator').style.display = 'none';

  // Remove extra solute particles beyond initial 40
  while (soluteParticles.length > 40) {
    const p = soluteParticles.pop();
    scene.remove(p);
  }
  state.soluteCount = 40;

  // Reset solute positions
  for (let i = 0; i < soluteParticles.length; i++) {
    const pos = initialSolutePositions[i] || randomInLeftChamber();
    soluteParticles[i].position.set(pos.x, pos.y, pos.z);
    soluteParticles[i].visible = true;
  }

  // Remove extra water particles beyond initial 30
  while (waterParticles.length > 30) {
    const p = waterParticles.pop();
    scene.remove(p);
  }

  // Reset water positions (all back to right chamber)
  for (let i = 0; i < waterParticles.length; i++) {
    const pos = initialWaterPositions[i] || randomInRightChamber();
    waterParticles[i].position.set(pos.x, pos.y, pos.z);
    waterParticles[i].userData.chamber = 'right';
  }

  lastTransferTime = 0;
  updateWaterLevels();
  updateHUD();
  updateState();
});

document.getElementById('addSoluteBtn').addEventListener('click', () => {
  if (state.soluteCount >= 60) return;
  for (let i = 0; i < 5; i++) {
    if (state.soluteCount >= 60) break;
    const mesh = new THREE.Mesh(soluteGeo, soluteMat);
    const pos = randomInLeftChamber();
    mesh.position.set(pos.x, pos.y, pos.z);
    mesh.userData = {
      velocity: new THREE.Vector3(0, 0, 0),
      type: 'solute',
      chamber: 'left',
      initialPos: { x: pos.x, y: pos.y, z: pos.z }
    };
    scene.add(mesh);
    soluteParticles.push(mesh);
    state.soluteCount++;
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'e' || e.key === 'E') {
    eqLineGroup.visible = !eqLineGroup.visible;
    state.equilibriumLineVisible = eqLineGroup.visible;
  }
  if (e.key === 't' || e.key === 'T') {
    highTempMode = !highTempMode;
    const indicator = document.getElementById('tempIndicator');
    indicator.style.display = 'block';
    indicator.textContent = highTempMode ? 'Temperature: High Temp' : 'Temperature: Normal Temp';
    indicator.style.color = highTempMode ? '#ff8844' : '#7eb8ff';
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Add some grid/floor for visual reference
const gridHelper = new THREE.GridHelper(10, 20, 0x333355, 0x222244);
gridHelper.position.y = -0.15;
scene.add(gridHelper);

// Animation loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime() * 1000;
  controls.update();

  if (simulationRunning && !equilibriumReached) {
    // Transfer water particles at interval
    const interval = getTransferInterval();
    if (elapsed - lastTransferTime > interval) {
      if (transferredCount < 30) {
        transferWaterParticle();
        lastTransferTime = elapsed;
      }
    }
  }

  // Always update Brownian motion if simulation running
  if (simulationRunning) {
    updateParticles();
  }

  updateWaterLevels();
  updateEquilibriumLine();
  updateHUD();
  updateState();

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
