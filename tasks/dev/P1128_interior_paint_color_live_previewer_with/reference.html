<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interior Room Paint Previewer</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
    }

    canvas {
      display: block;
    }

    .panel {
      position: absolute;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 10px;
      z-index: 10;
      box-sizing: border-box;
    }

    #leftPanel {
      top: 16px;
      left: 16px;
      width: 230px;
    }

    #rightPanel {
      top: 16px;
      right: 16px;
      width: 220px;
    }

    #bottomPanel {
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: min(700px, calc(100vw - 32px));
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    .section-title {
      margin: 12px 0 8px 0;
      font-size: 14px;
      font-weight: bold;
      color: #ddd;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .swatch {
      height: 36px;
      border-radius: 6px;
      border: 2px solid #fff;
      cursor: pointer;
      box-sizing: border-box;
    }

    .wall-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .wall-btn, .toggle-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #888;
      background: #222;
      color: #fff;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
    }

    .wall-btn.selected {
      border: 3px solid #FFD700;
    }

    .toggle-btn {
      text-align: center;
      width: 100%;
    }

    .perceived-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0;
      font-size: 14px;
    }

    .perceived-swatch {
      width: 64px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #fff;
      flex-shrink: 0;
    }

    #timeSlider {
      flex: 1;
      min-width: 220px;
    }

    #timeLabel, #timeValue {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="leftPanel" class="panel">
    <h3>Paint Palette</h3>
    <div class="palette" id="palette"></div>

    <div class="section-title">Select Wall</div>
    <div class="wall-buttons">
      <button class="wall-btn selected" data-wall="back">Back Wall</button>
      <button class="wall-btn" data-wall="left">Left Wall</button>
      <button class="wall-btn" data-wall="right">Right Wall</button>
      <button class="wall-btn" data-wall="front">Front Wall</button>
    </div>

    <button id="roomLightToggle" class="toggle-btn">Room Light: OFF</button>
  </div>

  <div id="rightPanel" class="panel">
    <h3>Perceived Colors</h3>
    <div class="perceived-item"><span>Back Wall</span><div id="perceived-back" class="perceived-swatch"></div></div>
    <div class="perceived-item"><span>Left Wall</span><div id="perceived-left" class="perceived-swatch"></div></div>
    <div class="perceived-item"><span>Right Wall</span><div id="perceived-right" class="perceived-swatch"></div></div>
    <div class="perceived-item"><span>Front Wall</span><div id="perceived-front" class="perceived-swatch"></div></div>
  </div>

  <div id="bottomPanel" class="panel">
    <span id="timeLabel">Time of Day</span>
    <input id="timeSlider" type="range" min="0" max="24" step="0.5" value="12" />
    <span id="timeValue">12:00</span>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x20232a);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 6);
    camera.lookAt(0, 2, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2, 0);
    controls.enableDamping = true;
    controls.minDistance = 3;
    controls.maxDistance = 20;
    controls.update();

    const ROOM = {
      width: 10,
      height: 4,
      depth: 8
    };

    const defaultWallColor = '#E8E0D0';
    const wallColors = {
      back: defaultWallColor,
      left: defaultWallColor,
      right: defaultWallColor,
      front: defaultWallColor
    };

    const paintHistory = [];

    const wallMaterials = {
      back: new THREE.MeshStandardMaterial({ color: wallColors.back, side: THREE.BackSide }),
      left: new THREE.MeshStandardMaterial({ color: wallColors.left, side: THREE.BackSide }),
      right: new THREE.MeshStandardMaterial({ color: wallColors.right, side: THREE.BackSide }),
      front: new THREE.MeshStandardMaterial({ color: wallColors.front, side: THREE.BackSide }),
      floor: new THREE.MeshStandardMaterial({ color: '#8A7F73', side: THREE.BackSide }),
      ceiling: new THREE.MeshStandardMaterial({ color: '#F0F0EE', side: THREE.BackSide })
    };

    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    function createPlane(w, h, material) {
      return new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
    }

    // Back wall
    const backWall = createPlane(ROOM.width, ROOM.height, wallMaterials.back);
    backWall.position.set(0, ROOM.height / 2, -ROOM.depth / 2);
    roomGroup.add(backWall);

    // Left wall
    const leftWall = createPlane(ROOM.depth, ROOM.height, wallMaterials.left);
    leftWall.position.set(-ROOM.width / 2, ROOM.height / 2, 0);
    leftWall.rotation.y = Math.PI / 2;
    roomGroup.add(leftWall);

    // Right wall
    const rightWall = createPlane(ROOM.depth, ROOM.height, wallMaterials.right);
    rightWall.position.set(ROOM.width / 2, ROOM.height / 2, 0);
    rightWall.rotation.y = -Math.PI / 2;
    roomGroup.add(rightWall);

    // Floor
    const floor = createPlane(ROOM.width, ROOM.depth, wallMaterials.floor);
    floor.position.set(0, 0, 0);
    floor.rotation.x = -Math.PI / 2;
    roomGroup.add(floor);

    // Ceiling
    const ceiling = createPlane(ROOM.width, ROOM.depth, wallMaterials.ceiling);
    ceiling.position.set(0, ROOM.height, 0);
    ceiling.rotation.x = Math.PI / 2;
    roomGroup.add(ceiling);

    // Front wall with window opening at z = +depth/2
    const frontZ = ROOM.depth / 2;
    const winW = 3;
    const winH = 2;
    const winCenterY = 2;
    const winBottom = winCenterY - winH / 2;
    const winTop = winCenterY + winH / 2;

    const frontWallGroup = new THREE.Group();

    const frontTop = createPlane(ROOM.width, ROOM.height - winTop, wallMaterials.front);
    frontTop.position.set(0, winTop + (ROOM.height - winTop) / 2, frontZ);
    frontTop.rotation.y = Math.PI;
    frontWallGroup.add(frontTop);

    const frontBottom = createPlane(ROOM.width, winBottom, wallMaterials.front);
    frontBottom.position.set(0, winBottom / 2, frontZ);
    frontBottom.rotation.y = Math.PI;
    frontWallGroup.add(frontBottom);

    const sideW = (ROOM.width - winW) / 2;

    const frontLeft = createPlane(sideW, winH, wallMaterials.front);
    frontLeft.position.set(-ROOM.width / 2 + sideW / 2, winCenterY, frontZ);
    frontLeft.rotation.y = Math.PI;
    frontWallGroup.add(frontLeft);

    const frontRight = createPlane(sideW, winH, wallMaterials.front);
    frontRight.position.set(ROOM.width / 2 - sideW / 2, winCenterY, frontZ);
    frontRight.rotation.y = Math.PI;
    frontWallGroup.add(frontRight);

    roomGroup.add(frontWallGroup);

    // Window frame
    const frameMat = new THREE.MeshStandardMaterial({ color: '#d6d6d6' });
    const frameDepth = 0.08;
    const frameThickness = 0.08;

    const topFrame = new THREE.Mesh(new THREE.BoxGeometry(winW + frameThickness * 2, frameThickness, frameDepth), frameMat);
    topFrame.position.set(0, winTop, frontZ - 0.02);
    scene.add(topFrame);

    const bottomFrame = new THREE.Mesh(new THREE.BoxGeometry(winW + frameThickness * 2, frameThickness, frameDepth), frameMat);
    bottomFrame.position.set(0, winBottom, frontZ - 0.02);
    scene.add(bottomFrame);

    const leftFrame = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, winH, frameDepth), frameMat);
    leftFrame.position.set(-winW / 2, winCenterY, frontZ - 0.02);
    scene.add(leftFrame);

    const rightFrame = new THREE.Mesh(new THREE.BoxGeometry(frameThickness, winH, frameDepth), frameMat);
    rightFrame.position.set(winW / 2, winCenterY, frontZ - 0.02);
    scene.add(rightFrame);

    // Outside light hint
    const outsidePane = new THREE.Mesh(
      new THREE.PlaneGeometry(winW - 0.12, winH - 0.12),
      new THREE.MeshBasicMaterial({ color: '#9fd3ff', transparent: true, opacity: 0.5 })
    );
    outsidePane.position.set(0, winCenterY, frontZ + 0.01);
    outsidePane.rotation.y = Math.PI;
    scene.add(outsidePane);

    // Furniture
    const furnitureMatSofa = new THREE.MeshStandardMaterial({ color: '#6F7D8C' });
    const furnitureMatTable = new THREE.MeshStandardMaterial({ color: '#7A5C43' });
    const furnitureMatShelf = new THREE.MeshStandardMaterial({ color: '#5A3E2B' });

    const sofa = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 1.2), furnitureMatSofa);
    sofa.position.set(0, 0.5, -2.7);
    scene.add(sofa);

    const table = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.7, 1), furnitureMatTable);
    table.position.set(0, 0.35, 0);
    scene.add(table);

    const bookshelf = new THREE.Mesh(new THREE.BoxGeometry(1, 3.5, 0.5), furnitureMatShelf);
    bookshelf.position.set(-4.45, 1.75, -1.5);
    scene.add(bookshelf);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
    sunLight.position.set(5, 5, 6);
    scene.add(sunLight);

    const roomLight = new THREE.PointLight(0xfff2cc, 0, 20, 2);
    roomLight.position.set(0, 3.5, 0);
    scene.add(roomLight);

    const sunTarget = new THREE.Object3D();
    sunTarget.position.set(0, 1.8, 0);
    scene.add(sunTarget);
    sunLight.target = sunTarget;

    const paletteColors = [
      { hex: '#FFFFFF', name: 'White' },
      { hex: '#4A6741', name: 'Forest Green' },
      { hex: '#8B4513', name: 'Saddle Brown' },
      { hex: '#2C3E6B', name: 'Navy Blue' },
      { hex: '#C2185B', name: 'Crimson' },
      { hex: '#F5E6CC', name: 'Cream' }
    ];

    const paletteEl = document.getElementById('palette');
    const timeSlider = document.getElementById('timeSlider');
    const timeValue = document.getElementById('timeValue');
    const wallButtons = [...document.querySelectorAll('.wall-btn')];
    const roomLightToggle = document.getElementById('roomLightToggle');

    let selectedWall = 'back';
    let timeOfDay = 12;
    let roomLightOn = false;

    function clamp01(v) {
      return Math.min(1, Math.max(0, Number.isFinite(v) ? v : 0));
    }

    function safeNumber(v, fallback = 0) {
      return Number.isFinite(v) ? v : fallback;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function colorLerp(hex1, hex2, t) {
      const c1 = new THREE.Color(hex1);
      const c2 = new THREE.Color(hex2);
      return c1.lerp(c2, clamp01(t));
    }

    function toHexString(color) {
      return '#' + color.getHexString().toUpperCase();
    }

    function formatTime(hours) {
      const safe = safeNumber(hours, 12);
      const h = Math.floor(safe) % 24;
      const m = Math.round((safe - Math.floor(safe)) * 60);
      const mm = m === 60 ? 0 : m;
      const hh = m === 60 ? (h + 1) % 24 : h;
      return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    }

    function updateWallButtonUI() {
      wallButtons.forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.wall === selectedWall);
      });
    }

    function applyPaintToWall(wall, hex) {
      if (!wallMaterials[wall]) return;
      const prev = wallColors[wall];
      wallColors[wall] = hex.toUpperCase();
      wallMaterials[wall].color.set(hex);
      paintHistory.push({
        wall,
        fromColor: prev.toUpperCase(),
        toColor: hex.toUpperCase(),
        timestamp: Date.now()
      });
      updatePerceivedColors();
      updateState();
    }

    paletteColors.forEach(item => {
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = item.hex;
      sw.title = `${item.name} (${item.hex})`;
      sw.addEventListener('click', () => applyPaintToWall(selectedWall, item.hex));
      paletteEl.appendChild(sw);
    });

    wallButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        selectedWall = btn.dataset.wall;
        updateWallButtonUI();
        updateState();
      });
    });

    roomLightToggle.addEventListener('click', () => {
      roomLightOn = !roomLightOn;
      roomLight.intensity = roomLightOn ? 0.8 : 0;
      roomLightToggle.textContent = `Room Light: ${roomLightOn ? 'ON' : 'OFF'}`;
      updatePerceivedColors();
      updateState();
    });

    function getSunSettings(time) {
      const t = safeNumber(time, 12);
      let intensity = 1;
      let color = new THREE.Color('#FFFFFF');

      if (t >= 0 && t < 5) {
        intensity = 0.05;
        color = new THREE.Color('#1a1a3e');
      } else if (t >= 5 && t < 7) {
        const k = (t - 5) / 2;
        intensity = lerp(0.05, 0.6, k);
        color = colorLerp('#1a1a3e', '#FF8C42', k);
      } else if (t >= 7 && t < 10) {
        const k = (t - 7) / 3;
        intensity = lerp(0.6, 0.9, k);
        color = colorLerp('#FF8C42', '#FFFBE6', k);
      } else if (t >= 10 && t < 14) {
        intensity = 1.0;
        color = new THREE.Color('#FFFFFF');
      } else if (t >= 14 && t < 17) {
        const k = (t - 14) / 3;
        intensity = lerp(1.0, 0.7, k);
        color = colorLerp('#FFFFFF', '#FFD27F', k);
      } else if (t >= 17 && t < 19) {
        const k = (t - 17) / 2;
        intensity = lerp(0.7, 0.2, k);
        color = colorLerp('#FFD27F', '#FF6B35', k);
      } else {
        const start = 19;
        const duration = 5;
        const k = clamp01((t - start) / duration);
        intensity = lerp(0.2, 0.05, k);
        color = colorLerp('#FF6B35', '#1a1a3e', k);
      }

      intensity = safeNumber(intensity, 1);
      if (!Number.isFinite(intensity)) intensity = 1;

      const angle = ((t - 6) / 12) * Math.PI;
      const yRaw = 3 + 2 * Math.sin(angle);
      const isNight = (t < 5 || t >= 19);
      const y = isNight ? Math.max(0.25, yRaw) : Math.max(0.6, yRaw);
      const x = 5 * Math.cos(angle);

      return {
        intensity,
        color,
        position: new THREE.Vector3(
          safeNumber(x, 5),
          safeNumber(y, 3),
          6
        )
      };
    }

    function updateLighting() {
      const s = getSunSettings(timeOfDay);
      sunLight.intensity = safeNumber(s.intensity, 1);
      sunLight.color.copy(s.color);
      sunLight.position.copy(s.position);
      timeValue.textContent = formatTime(timeOfDay);
      updatePerceivedColors();
      updateState();
    }

    timeSlider.addEventListener('input', () => {
      timeOfDay = parseFloat(timeSlider.value);
      if (!Number.isFinite(timeOfDay)) timeOfDay = 12;
      updateLighting();
    });

    function computePerceivedHex(paintHex) {
      const paint = new THREE.Color(paintHex);
      const sunColor = sunLight.color.clone();

      const totalIntensity = safeNumber(sunLight.intensity, 0) +
                             safeNumber(ambientLight.intensity, 0) +
                             safeNumber(roomLight.intensity, 0);

      const r = clamp01(paint.r * totalIntensity * sunColor.r);
      const g = clamp01(paint.g * totalIntensity * sunColor.g);
      const b = clamp01(paint.b * totalIntensity * sunColor.b);

      return '#' + new THREE.Color(r, g, b).getHexString().toUpperCase();
    }

    function updatePerceivedColors() {
      const perceived = {
        back: computePerceivedHex(wallColors.back),
        left: computePerceivedHex(wallColors.left),
        right: computePerceivedHex(wallColors.right),
        front: computePerceivedHex(wallColors.front)
      };

      document.getElementById('perceived-back').style.background = perceived.back;
      document.getElementById('perceived-left').style.background = perceived.left;
      document.getElementById('perceived-right').style.background = perceived.right;
      document.getElementById('perceived-front').style.background = perceived.front;

      if (!window.__3D_STATE__) window.__3D_STATE__ = {};
      window.__3D_STATE__.perceivedColors = perceived;
    }

    function updateState() {
      const sunHex = toHexString(sunLight.color);
      const perceivedColors = window.__3D_STATE__?.perceivedColors || {
        back: computePerceivedHex(wallColors.back),
        left: computePerceivedHex(wallColors.left),
        right: computePerceivedHex(wallColors.right),
        front: computePerceivedHex(wallColors.front)
      };

      window.__3D_STATE__ = {
        selectedWall,
        wallColors: {
          back: wallColors.back.toUpperCase(),
          left: wallColors.left.toUpperCase(),
          right: wallColors.right.toUpperCase(),
          front: wallColors.front.toUpperCase()
        },
        timeOfDay: safeNumber(timeOfDay, 12),
        sunIntensity: safeNumber(sunLight.intensity, 0),
        sunColorHex: sunHex,
        roomLightOn: !!roomLightOn,
        roomLightIntensity: safeNumber(roomLight.intensity, 0),
        ambientIntensity: safeNumber(ambientLight.intensity, 0.15),
        perceivedColors,
        paintHistory: paintHistory.slice(),
        furnitureCount: 3,
        cameraPosition: {
          x: safeNumber(camera.position.x, 0),
          y: safeNumber(camera.position.y, 0),
          z: safeNumber(camera.position.z, 0)
        }
      };
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateState();
    });

    updateWallButtonUI();
    updateLighting();
    roomLightToggle.textContent = 'Room Light: OFF';
    updatePerceivedColors();
    updateState();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateState();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
