<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Anatomy Skeleton Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #f4f1ea;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: rgba(10, 12, 22, 0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 220px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      font-size: 14px;
      line-height: 1.5;
    }

    #hud strong {
      color: #ffd9c8;
    }

    #label-bone {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 20;
      background: rgba(255, 102, 68, 0.14);
      border: 1px solid rgba(255, 102, 68, 0.45);
      color: #ffd9cf;
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 140px;
      text-align: left;
      font-size: 14px;
      backdrop-filter: blur(6px);
    }

    #help {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 20;
      background: rgba(10, 12, 22, 0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #d7d7df;
      line-height: 1.45;
      max-width: 420px;
    }

    .key {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      margin: 0 2px;
    }
  </style>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div><strong>Selected:</strong> <span id="hud-bone">None</span></div>
    <div><strong>Total Bones:</strong> <span id="hud-total">22</span></div>
    <div><strong>Transparency:</strong> <span id="hud-transparent">OFF</span></div>
    <div><strong>Explode:</strong> <span id="hud-explode">OFF</span></div>
    <div><strong>Camera View:</strong> <span id="hud-view">Free</span></div>
  </div>

  <div id="label-bone">Bone: <span id="label-bone-name">None</span></div>

  <div id="help">
    Click a bone to select it.<br>
    <span class="key">T</span> transparency
    <span class="key">E</span> explode
    <span class="key">R</span> reset
    <span class="key">1</span> front
    <span class="key">2</span> side
    <span class="key">3</span> top
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const hudBone = document.getElementById('hud-bone');
    const hudTotal = document.getElementById('hud-total');
    const hudTransparent = document.getElementById('hud-transparent');
    const hudExplode = document.getElementById('hud-explode');
    const hudView = document.getElementById('hud-view');
    const labelBoneName = document.getElementById('label-bone-name');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 8, 15);
    camera.lookAt(0, 6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 6, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    const ambient = new THREE.AmbientLight(0x606080, 1.0);
    scene.add(ambient);

    const hemi = new THREE.HemisphereLight(0xaaaaff, 0x444422, 0.6);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 15, 10);
    scene.add(dir);

    const skeletonRoot = new THREE.Group();
    scene.add(skeletonRoot);

    const BONE_COLOR = 0xf5e6ca;
    const JOINT_COLOR = 0xddccaa;
    const SELECT_COLOR = 0xff6644;

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    let selectedBone = null;
    let isTransparent = false;
    let isExploded = false;
    let cameraView = 'free';
    let frameCount = 0;

    let cameraAnim = null;

    const bones = [];
    const clickableMeshes = [];

    function makeMaterial(color = BONE_COLOR) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.78,
        metalness: 0.05,
        transparent: true,
        opacity: 1
      });
    }

    function createBone(name, start, end, radius = 0.18, parent = skeletonRoot, options = {}) {
      const boneGroup = new THREE.Group();
      boneGroup.name = name;
      parent.add(boneGroup);

      const dir = new THREE.Vector3().subVectors(end, start);
      const length = dir.length();
      const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);

      const geo = new THREE.CylinderGeometry(radius, radius, length, options.radialSegments || 10);
      const mesh = new THREE.Mesh(geo, makeMaterial(BONE_COLOR));
      mesh.position.copy(midpoint);
      const axis = new THREE.Vector3(0, 1, 0);
      mesh.quaternion.setFromUnitVectors(axis, dir.clone().normalize());
      mesh.userData.boneName = name;
      boneGroup.add(mesh);

      const startJoint = new THREE.Mesh(
        new THREE.SphereGeometry(radius * 1.15, 12, 12),
        new THREE.MeshStandardMaterial({
          color: JOINT_COLOR,
          roughness: 0.85,
          metalness: 0.02,
          transparent: true,
          opacity: 1
        })
      );
      startJoint.position.copy(start);
      boneGroup.add(startJoint);

      const endJoint = new THREE.Mesh(
        new THREE.SphereGeometry(radius * 1.15, 12, 12),
        new THREE.MeshStandardMaterial({
          color: JOINT_COLOR,
          roughness: 0.85,
          metalness: 0.02,
          transparent: true,
          opacity: 1
        })
      );
      endJoint.position.copy(end);
      boneGroup.add(endJoint);

      const center = midpoint.clone();
      const explodeDir = center.clone().sub(new THREE.Vector3(0, 6, 0));
      if (explodeDir.lengthSq() < 1e-6) explodeDir.set(0, 1, 0);
      explodeDir.normalize();

      const record = {
        name,
        type: 'bone',
        object: boneGroup,
        mesh,
        joints: [startJoint, endJoint],
        originalPosition: boneGroup.position.clone(),
        explodeVector: explodeDir.multiplyScalar(1.5),
      };

      bones.push(record);
      clickableMeshes.push(mesh);
      return boneGroup;
    }

    function createRib(name, center, side = 1, yRot = 0) {
      const group = new THREE.Group();
      group.name = name;
      skeletonRoot.add(group);

      const geo = new THREE.TorusGeometry(0.9, 0.08, 10, 32, Math.PI * 0.9);
      const mesh = new THREE.Mesh(geo, makeMaterial(BONE_COLOR));
      mesh.position.copy(center);
      mesh.rotation.z = side > 0 ? -Math.PI / 2 : Math.PI / 2;
      mesh.rotation.y = yRot;
      mesh.userData.boneName = name;
      group.add(mesh);

      const centerDir = center.clone().sub(new THREE.Vector3(0, 6, 0));
      if (centerDir.lengthSq() < 1e-6) centerDir.set(side, 0, 0);
      centerDir.normalize();

      const record = {
        name,
        type: 'rib',
        object: group,
        mesh,
        joints: [],
        originalPosition: group.position.clone(),
        explodeVector: centerDir.multiplyScalar(1.5)
      };

      bones.push(record);
      clickableMeshes.push(mesh);
      return group;
    }

    const pelvis = createBone('pelvis', new THREE.Vector3(-0.7, 5.0, 0), new THREE.Vector3(0.7, 5.0, 0), 0.22);
    createBone('lumbar', new THREE.Vector3(0, 5.1, 0), new THREE.Vector3(0, 6.4, 0), 0.20);
    createBone('thorax', new THREE.Vector3(0, 6.4, 0), new THREE.Vector3(0, 8.4, 0), 0.22);
    createBone('neck', new THREE.Vector3(0, 8.4, 0), new THREE.Vector3(0, 9.4, 0), 0.15);
    createBone('skull', new THREE.Vector3(0, 9.5, 0), new THREE.Vector3(0, 11.2, 0), 0.42);

    createBone('l_clavicle', new THREE.Vector3(0, 8.2, 0), new THREE.Vector3(-1.3, 8.2, 0.2), 0.12);
    createBone('l_upper_arm', new THREE.Vector3(-1.3, 8.2, 0.2), new THREE.Vector3(-2.8, 6.9, 0.1), 0.16);
    createBone('l_forearm', new THREE.Vector3(-2.8, 6.9, 0.1), new THREE.Vector3(-3.6, 5.4, 0.0), 0.13);
    createBone('l_hand', new THREE.Vector3(-3.6, 5.4, 0.0), new THREE.Vector3(-4.15, 5.0, 0.15), 0.10);

    createBone('r_clavicle', new THREE.Vector3(0, 8.2, 0), new THREE.Vector3(1.3, 8.2, 0.2), 0.12);
    createBone('r_upper_arm', new THREE.Vector3(1.3, 8.2, 0.2), new THREE.Vector3(2.8, 6.9, 0.1), 0.16);
    createBone('r_forearm', new THREE.Vector3(2.8, 6.9, 0.1), new THREE.Vector3(3.6, 5.4, 0.0), 0.13);
    createBone('r_hand', new THREE.Vector3(3.6, 5.4, 0.0), new THREE.Vector3(4.15, 5.0, 0.15), 0.10);

    createBone('l_thigh', new THREE.Vector3(-0.45, 4.9, 0), new THREE.Vector3(-0.8, 2.5, 0.0), 0.20);
    createBone('l_shin', new THREE.Vector3(-0.8, 2.5, 0.0), new THREE.Vector3(-0.7, 0.7, 0.05), 0.16);
    createBone('l_foot', new THREE.Vector3(-0.7, 0.7, 0.05), new THREE.Vector3(-0.5, 0.2, 0.95), 0.11);

    createBone('r_thigh', new THREE.Vector3(0.45, 4.9, 0), new THREE.Vector3(0.8, 2.5, 0.0), 0.20);
    createBone('r_shin', new THREE.Vector3(0.8, 2.5, 0.0), new THREE.Vector3(0.7, 0.7, 0.05), 0.16);
    createBone('r_foot', new THREE.Vector3(0.7, 0.7, 0.05), new THREE.Vector3(0.5, 0.2, 0.95), 0.11);

    createRib('rib_l_1', new THREE.Vector3(-0.85, 7.8, 0.0), -1, 0.15);
    createRib('rib_r_1', new THREE.Vector3(0.85, 7.8, 0.0), 1, -0.15);
    createRib('rib_l_2', new THREE.Vector3(-0.95, 7.15, 0.0), -1, 0.10);
    createRib('rib_r_2', new THREE.Vector3(0.95, 7.15, 0.0), 1, -0.10);
    createRib('rib_l_3', new THREE.Vector3(-0.9, 6.5, 0.0), -1, 0.05);
    createRib('rib_r_3', new THREE.Vector3(0.9, 6.5, 0.0), 1, -0.05);

    hudTotal.textContent = String(bones.length);

    function setSelectedBone(name) {
      selectedBone = name;

      bones.forEach(b => {
        const isSel = b.name === selectedBone;
        b.mesh.material.color.setHex(isSel ? SELECT_COLOR : BONE_COLOR);
      });

      updateTransparencyVisuals();
      updateHUD();
    }

    function updateTransparencyVisuals() {
      bones.forEach(b => {
        const isSel = b.name === selectedBone;
        const targetOpacity = isTransparent && !isSel ? 0.3 : 1.0;
        b.mesh.material.opacity = targetOpacity;
        b.mesh.material.transparent = targetOpacity < 1.0;

        b.joints.forEach(j => {
          j.material.opacity = targetOpacity;
          j.material.transparent = targetOpacity < 1.0;
        });
      });
    }

    function updateExplodeVisuals() {
      bones.forEach(b => {
        if (isExploded) {
          b.object.position.copy(b.explodeVector);
        } else {
          b.object.position.copy(b.originalPosition);
        }
      });
    }

    function resetAll() {
      selectedBone = null;
      isTransparent = false;
      isExploded = false;
      cameraView = 'free';
      cameraAnim = null;
      bones.forEach(b => {
        b.mesh.material.color.setHex(BONE_COLOR);
      });
      updateTransparencyVisuals();
      updateExplodeVisuals();
      controls.enabled = true;
      controls.target.set(0, 6, 0);
      updateHUD();
    }

    function updateHUD() {
      hudBone.textContent = selectedBone || 'None';
      labelBoneName.textContent = selectedBone || 'None';
      hudTransparent.textContent = isTransparent ? 'ON' : 'OFF';
      hudExplode.textContent = isExploded ? 'ON' : 'OFF';

      const labelMap = {
        front: 'Front',
        side: 'Side',
        top: 'Top',
        free: 'Free'
      };
      hudView.textContent = labelMap[cameraView] || 'Free';
    }

    function animateCameraTo(position, target, viewName) {
      cameraAnim = {
        fromPos: camera.position.clone(),
        toPos: position.clone(),
        fromTarget: controls.target.clone(),
        toTarget: target.clone(),
        t: 0,
        duration: 0.7,
        viewName
      };
      cameraView = viewName;
    }

    renderer.domElement.addEventListener('pointerdown', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(clickableMeshes, false);
      if (hits.length > 0) {
        const hit = hits[0].object;
        setSelectedBone(hit.userData.boneName || null);
      }
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 't') {
        isTransparent = !isTransparent;
        updateTransparencyVisuals();
        updateHUD();
      } else if (key === 'e') {
        isExploded = !isExploded;
        updateExplodeVisuals();
        updateHUD();
      } else if (key === 'r') {
        resetAll();
      } else if (key === '1') {
        animateCameraTo(new THREE.Vector3(0, 8, 15), new THREE.Vector3(0, 6, 0), 'front');
      } else if (key === '2') {
        animateCameraTo(new THREE.Vector3(15, 8, 0), new THREE.Vector3(0, 6, 0), 'side');
      } else if (key === '3') {
        animateCameraTo(new THREE.Vector3(0, 20, 0.01), new THREE.Vector3(0, 6, 0), 'top');
      }
    });

    controls.addEventListener('start', () => {
      if (!cameraAnim) cameraView = 'free';
    });

    function bonesAreValid() {
      for (const b of bones) {
        const p = b.object.position;
        if (
          Number.isNaN(p.x) || Number.isNaN(p.y) || Number.isNaN(p.z) ||
          !Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.z)
        ) {
          return false;
        }
      }
      return true;
    }

    window.__3D_STATE__ = {
      selectedBone: null,
      totalBones: 22,
      isTransparent: false,
      isExploded: false,
      cameraView: 'free',
      frameCount: 0,
      bonesValid: true,
      cameraDistance: 0
    };

    function updateState() {
      const camDist = camera.position.distanceTo(controls.target);
      window.__3D_STATE__ = {
        selectedBone,
        totalBones: 22,
        isTransparent,
        isExploded,
        cameraView,
        frameCount,
        bonesValid: bonesAreValid(),
        cameraDistance: Math.round(camDist * 10) / 10
      };
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;

      const dt = clock.getDelta();

      if (cameraAnim) {
        cameraAnim.t += dt / cameraAnim.duration;
        const t = Math.min(cameraAnim.t, 1);
        const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        camera.position.lerpVectors(cameraAnim.fromPos, cameraAnim.toPos, eased);
        controls.target.lerpVectors(cameraAnim.fromTarget, cameraAnim.toTarget, eased);

        if (t >= 1) {
          cameraAnim = null;
        }
      }

      controls.update();
      updateHUD();
      updateState();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateTransparencyVisuals();
    updateExplodeVisuals();
    updateHUD();
    animate();
  </script>
</body>
</html>
