<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Volumetric Cloud Sculpting Tool</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a2e;
      color: #fff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #toolbar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
      background: rgba(10, 10, 30, 0.45);
      padding: 10px 12px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
    }

    #toolbar button,
    #toolbar label {
      font-size: 14px;
    }

    #toolbar button {
      color: white;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    #toolbar button:hover {
      background: rgba(255,255,255,0.16);
    }

    #toolbar button.active {
      border-color: #7fd7ff;
      box-shadow: 0 0 12px rgba(127,215,255,0.7);
      background: rgba(80,140,255,0.18);
    }

    #density-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 8px;
      margin-left: 4px;
      border-left: 1px solid rgba(255,255,255,0.18);
      color: #dbe7ff;
    }

    #slider-density {
      width: 120px;
    }

    #hud-panel {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 20;
      min-width: 220px;
      background: rgba(10, 10, 30, 0.5);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 12px 14px;
      backdrop-filter: blur(8px);
      line-height: 1.6;
      font-size: 14px;
      color: #eef3ff;
    }

    .hud-row strong {
      color: #9fd0ff;
    }

    #instructions {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      background: rgba(10, 10, 30, 0.4);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      max-width: 280px;
      font-size: 13px;
      color: #dfe6ff;
      line-height: 1.45;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="btn-add" class="active">Add Tool</button>
      <button id="btn-remove">Remove Tool</button>
      <button id="btn-shape">Shape Tool</button>
      <div id="density-wrap">
        <label for="slider-density">Density</label>
        <input id="slider-density" type="range" min="1" max="10" value="5" />
        <span id="density-value">5</span>
      </div>
    </div>

    <div id="hud-panel">
      <div class="hud-row">Particles: <strong id="hud-particle-count">0</strong></div>
      <div class="hud-row">Active Tool: <strong id="hud-active-tool">add</strong></div>
      <div class="hud-row">Players: <strong id="hud-player-count">3 Players</strong></div>
      <div class="hud-row">FPS: <strong id="hud-fps">0</strong></div>
    </div>

    <div id="instructions">
      Click to add/remove clouds. Use Shape Tool and drag to push particles.
      Orbit with mouse to inspect the sky.
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const btnAdd = document.getElementById('btn-add');
    const btnRemove = document.getElementById('btn-remove');
    const btnShape = document.getElementById('btn-shape');
    const sliderDensity = document.getElementById('slider-density');
    const densityValue = document.getElementById('density-value');

    const hudParticleCount = document.getElementById('hud-particle-count');
    const hudActiveTool = document.getElementById('hud-active-tool');
    const hudPlayerCount = document.getElementById('hud-player-count');
    const hudFps = document.getElementById('hud-fps');

    const scene = new THREE.Scene();

    const bgGeo = new THREE.SphereGeometry(400, 32, 32);
    const bgMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color('#0a0a2e') },
        bottomColor: { value: new THREE.Color('#1a1a4e') }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition).y * 0.5 + 0.5;
          vec3 color = mix(bottomColor, topColor, smoothstep(0.0, 1.0, h));
          gl_FragColor = vec4(color, 1.0);
        }
      `
    });
    const bgSphere = new THREE.Mesh(bgGeo, bgMat);
    scene.add(bgSphere);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 8, 0);

    const ambient = new THREE.AmbientLight('#8888cc', 0.3);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight('#ffe0a0', 1.2);
    sun.position.set(20, 30, 10);
    sun.castShadow = false;
    scene.add(sun);

    const interactionPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
    );
    interactionPlane.rotation.x = -Math.PI / 2;
    interactionPlane.position.y = 10;
    scene.add(interactionPlane);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const cloudParticles = [];
    const particleGeometry = new THREE.SphereGeometry(1, 16, 16);

    function createParticle(x, y, z, radius, opacity, playerId = 1, color = null) {
      const material = new THREE.MeshPhongMaterial({
        color: color || new THREE.Color().setRGB(
          0.9 + Math.random() * 0.1,
          0.9 + Math.random() * 0.1,
          0.9 + Math.random() * 0.1
        ),
        transparent: true,
        opacity: opacity,
        depthWrite: false,
        shininess: 20
      });

      const mesh = new THREE.Mesh(particleGeometry, material);
      mesh.position.set(x, y, z);
      mesh.scale.setScalar(radius);
      scene.add(mesh);

      const particle = { x, y, z, radius, opacity, playerId, mesh };
      cloudParticles.push(particle);
      return particle;
    }

    function removeParticleAtIndex(index) {
      const p = cloudParticles[index];
      if (!p) return;
      scene.remove(p.mesh);
      p.mesh.geometry = p.mesh.geometry;
      p.mesh.material.dispose();
      cloudParticles.splice(index, 1);
    }

    function createInitialClouds() {
      for (let i = 0; i < 32; i++) {
        createParticle(
          THREE.MathUtils.randFloat(-10, 10),
          THREE.MathUtils.randFloat(5, 15),
          THREE.MathUtils.randFloat(-10, 10),
          THREE.MathUtils.randFloat(0.5, 2.0),
          THREE.MathUtils.randFloat(0.4, 0.7),
          1
        );
      }
    }
    createInitialClouds();

    const player2 = {
      id: 2,
      mesh: new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 16, 16),
        new THREE.MeshBasicMaterial({ color: '#ff4444' })
      ),
      position: new THREE.Vector3()
    };
    scene.add(player2.mesh);

    const player3 = {
      id: 3,
      mesh: new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 16, 16),
        new THREE.MeshBasicMaterial({ color: '#44ff44' })
      ),
      position: new THREE.Vector3()
    };
    scene.add(player3.mesh);

    let activeTool = 'add';
    let isDragging = false;
    let frameCount = 0;
    const simulationStartedAt = performance.now();
    let lastActionType = 'none';
    let lastActionParticlesDelta = 0;

    const state = {
      particleCount: cloudParticles.length,
      activeTool: activeTool,
      playerCount: 3,
      density: Number(sliderDensity.value),
      player2Position: { x: 0, y: 10, z: 0 },
      player3Position: { x: 0, y: 12, z: 0 },
      cameraDistance: camera.position.length(),
      frameCount: 0,
      lastActionType: 'none',
      lastActionParticlesDelta: 0,
      cloudBounds: { minY: 0, maxY: 0 }
    };
    window.__3D_STATE__ = state;

    function updateToolButtons() {
      btnAdd.classList.toggle('active', activeTool === 'add');
      btnRemove.classList.toggle('active', activeTool === 'remove');
      btnShape.classList.toggle('active', activeTool === 'shape');
      hudActiveTool.textContent = activeTool;
    }

    function setTool(tool) {
      activeTool = tool;
      updateToolButtons();
    }

    btnAdd.addEventListener('click', () => setTool('add'));
    btnRemove.addEventListener('click', () => setTool('remove'));
    btnShape.addEventListener('click', () => setTool('shape'));

    sliderDensity.addEventListener('input', () => {
      densityValue.textContent = sliderDensity.value;
    });

    function getIntersection(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(interactionPlane, false);
      return hits.length ? hits[0] : null;
    }

    function addClusterAt(point, playerId = 1, countOverride = null) {
      const count = countOverride ?? Number(sliderDensity.value);
      let added = 0;
      for (let i = 0; i < count; i++) {
        const offset = new THREE.Vector3(
          THREE.MathUtils.randFloatSpread(4),
          THREE.MathUtils.randFloatSpread(2),
          THREE.MathUtils.randFloatSpread(4)
        );
        if (offset.length() > 2) offset.setLength(THREE.MathUtils.randFloat(0.2, 2));
        createParticle(
          point.x + offset.x,
          point.y + offset.y,
          point.z + offset.z,
          THREE.MathUtils.randFloat(0.35, 1.0),
          THREE.MathUtils.randFloat(0.4, 0.7),
          playerId
        );
        added++;
      }
      return added;
    }

    function removeNear(point, radius) {
      let removed = 0;
      for (let i = cloudParticles.length - 1; i >= 0; i--) {
        const p = cloudParticles[i];
        const d = Math.sqrt(
          (p.x - point.x) ** 2 +
          (p.y - point.y) ** 2 +
          (p.z - point.z) ** 2
        );
        if (d <= radius) {
          removeParticleAtIndex(i);
          removed++;
        }
      }
      return removed;
    }

    function shapeNear(point, rayDirection) {
      let affected = 0;
      const pushDir = rayDirection.clone().normalize();
      for (let i = 0; i < cloudParticles.length; i++) {
        const p = cloudParticles[i];
        const dx = p.x - point.x;
        const dy = p.y - point.y;
        const dz = p.z - point.z;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d <= 5) {
          p.x += pushDir.x * 0.5;
          p.y += pushDir.y * 0.5;
          p.z += pushDir.z * 0.5;
          p.mesh.position.set(p.x, p.y, p.z);
          affected++;
        }
      }
      return affected;
    }

    renderer.domElement.addEventListener('pointerdown', (event) => {
      isDragging = true;
      const hit = getIntersection(event);
      if (!hit) return;

      if (activeTool === 'add') {
        const added = addClusterAt(hit.point, 1);
        lastActionType = 'add';
        lastActionParticlesDelta = added;
      } else if (activeTool === 'remove') {
        const removed = removeNear(hit.point, 3);
        lastActionType = 'remove';
        lastActionParticlesDelta = -removed;
      } else if (activeTool === 'shape') {
        const affected = shapeNear(hit.point, raycaster.ray.direction);
        lastActionType = 'shape';
        lastActionParticlesDelta = 0;
        if (affected === 0) lastActionParticlesDelta = 0;
      }
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    renderer.domElement.addEventListener('pointermove', (event) => {
      if (!isDragging || activeTool !== 'shape') return;
      const hit = getIntersection(event);
      if (!hit) return;
      const affected = shapeNear(hit.point, raycaster.ray.direction);
      if (affected > 0) {
        lastActionType = 'shape';
        lastActionParticlesDelta = 0;
      }
    });

    let fps = 0;
    let fpsFrames = 0;
    let fpsLastTime = performance.now();

    function updateParticles() {
      for (let i = 0; i < cloudParticles.length; i++) {
        const p = cloudParticles[i];
        p.y += 0.02;
        p.radius = Math.min(4.0, p.radius + 0.001);
        p.mesh.position.set(p.x, p.y, p.z);
        p.mesh.scale.setScalar(p.radius);
      }
    }

    function updateSimulatedPlayers() {
      const t = frameCount * 0.02;

      player2.position.set(
        Math.cos(t * 0.6) * 8,
        10,
        Math.sin(t * 0.6) * 8
      );
      player2.mesh.position.copy(player2.position);

      player3.position.set(
        Math.sin(t * 0.9) * 7,
        12,
        Math.sin(t * 1.8) * 3.5
      );
      player3.mesh.position.copy(player3.position);

      if (frameCount % 120 === 0) {
        addClusterAt(player2.position, 2, 1);
      }

      if (frameCount % 200 === 0) {
        removeNear(player3.position, 2);
      }
    }

    function updateHUD() {
      hudParticleCount.textContent = String(cloudParticles.length);
      hudPlayerCount.textContent = '3 Players';
      hudFps.textContent = String(fps);
    }

    function updateState() {
      let minY = Infinity;
      let maxY = -Infinity;

      for (let i = 0; i < cloudParticles.length; i++) {
        const y = cloudParticles[i].y;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }

      if (cloudParticles.length === 0) {
        minY = 0;
        maxY = 0;
      }

      state.particleCount = cloudParticles.length;
      state.activeTool = activeTool;
      state.playerCount = 3;
      state.density = Number(sliderDensity.value);
      state.player2Position = {
        x: player2.position.x,
        y: player2.position.y,
        z: player2.position.z
      };
      state.player3Position = {
        x: player3.position.x,
        y: player3.position.y,
        z: player3.position.z
      };
      state.cameraDistance = camera.position.distanceTo(new THREE.Vector3(0, 0, 0));
      state.frameCount = Math.floor((performance.now() - simulationStartedAt) / (1000 / 60));
      state.lastActionType = lastActionType;
      state.lastActionParticlesDelta = lastActionParticlesDelta;
      state.cloudBounds = { minY, maxY };
    }

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;

      controls.update();
      updateParticles();
      updateSimulatedPlayers();

      fpsFrames++;
      const now = performance.now();
      if (now - fpsLastTime >= 1000) {
        fps = Math.round((fpsFrames * 1000) / (now - fpsLastTime));
        fpsFrames = 0;
        fpsLastTime = now;
      }

      updateHUD();
      updateState();
      renderer.render(scene, camera);
    }

    updateToolButtons();
    densityValue.textContent = sliderDensity.value;
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
