<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobel vs Laplacian Edge Detection</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #111111; }
canvas { display: block; }
#hud-panel {
  position: fixed; top: 10px; left: 10px;
  background: rgba(0,0,0,0.75); color: #fff;
  font: 14px monospace; padding: 12px 16px;
  border-radius: 6px; z-index: 100;
  line-height: 1.6; pointer-events: none;
}
#button-bar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 100;
}
#button-bar button {
  font: 13px monospace; padding: 8px 14px;
  background: rgba(255,255,255,0.12); color: #fff;
  border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
  cursor: pointer; transition: background 0.2s;
}
#button-bar button:hover { background: rgba(255,255,255,0.25); }
#button-bar button.active { background: rgba(100,200,150,0.4); border-color: #0f8; }
#loading {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #aaa; font: 18px monospace; z-index: 200;
}
</style>
</head>
<body>
<div id="loading">Loading model...</div>
<div id="hud-panel">
  <div>Mode: <span id="hud-mode">original</span></div>
  <div>Strength: <span id="hud-strength">1.0</span></div>
  <div>Threshold: <span id="hud-threshold">0.10</span></div>
  <div>AutoRotate: <span id="hud-rotate">ON</span></div>
  <div>Sobel Color: <span id="hud-sobel-color">#00ff80</span></div>
  <div>Laplacian Color: <span id="hud-laplacian-color">#ff4d00</span></div>
  <div>FPS: <span id="hud-fps">0</span></div>
</div>
<div id="button-bar">
  <button id="btn-original" class="active">Original</button>
  <button id="btn-sobel">Sobel</button>
  <button id="btn-laplacian">Laplacian</button>
  <button id="btn-split">Split</button>
  <button id="btn-overlay">Overlay</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const MODE_NAMES = ['original','sobel','laplacian','split','overlay'];
const SOBEL_GX = [-1,0,1,-2,0,2,-1,0,1];
const LAPLACIAN_K = [0,-1,0,-1,4,-1,0,-1,0];

let state = {
  sceneReady: false, modelLoaded: false,
  modelBBoxSize: {x:0,y:0,z:0},
  currentMode: 0, currentModeName: 'original',
  edgeStrength: 1.0, threshold: 0.10,
  autoRotate: true, modelRotationY: 0.0,
  sobelColorHex: '#00ff80', laplacianColorHex: '#ff4d00',
  composerPassCount: 1,
  sobelKernel: [...SOBEL_GX], laplacianKernel: [...LAPLACIAN_K],
  fps: 0, frameCount: 0,
  renderTargetWidth: window.innerWidth, renderTargetHeight: window.innerHeight,
  modeHistory: [0]
};
window.__3D_STATE__ = state;

let sobelColor = new THREE.Vector3(0.0, 1.0, 0.5);
let laplacianColor = new THREE.Vector3(1.0, 0.3, 0.0);

function vec3ToHex(v) {
  const r = Math.round(Math.min(1,Math.max(0,v.x))*255);
  const g = Math.round(Math.min(1,Math.max(0,v.y))*255);
  const b = Math.round(Math.min(1,Math.max(0,v.z))*255);
  return '#' + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x111111);
document.body.appendChild(renderer.domElement);

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// Camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 6);
camera.lookAt(0, 0, 0);

// Lights
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 8, 5);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const pointLight = new THREE.PointLight(0xffffff, 0.8);
pointLight.position.set(-3, 2, -3);
scene.add(pointLight);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.update();

// Model container
const modelGroup = new THREE.Group();
scene.add(modelGroup);

// --- SHADERS ---

const SobelEdgeShader = {
  uniforms: {
    tDiffuse: { value: null },
    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    edgeStrength: { value: 1.0 },
    edgeColor: { value: sobelColor.clone() },
    threshold: { value: 0.1 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 resolution;
    uniform float edgeStrength;
    uniform vec3 edgeColor;
    uniform float threshold;
    varying vec2 vUv;

    float luminance(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

    void main() {
      vec2 texel = 1.0 / resolution;
      float tl = luminance(texture2D(tDiffuse, vUv + vec2(-texel.x, texel.y)).rgb);
      float tm = luminance(texture2D(tDiffuse, vUv + vec2(0.0, texel.y)).rgb);
      float tr = luminance(texture2D(tDiffuse, vUv + vec2(texel.x, texel.y)).rgb);
      float ml = luminance(texture2D(tDiffuse, vUv + vec2(-texel.x, 0.0)).rgb);
      float mr = luminance(texture2D(tDiffuse, vUv + vec2(texel.x, 0.0)).rgb);
      float bl = luminance(texture2D(tDiffuse, vUv + vec2(-texel.x, -texel.y)).rgb);
      float bm = luminance(texture2D(tDiffuse, vUv + vec2(0.0, -texel.y)).rgb);
      float br = luminance(texture2D(tDiffuse, vUv + vec2(texel.x, -texel.y)).rgb);

      float gx = -1.0*tl + 1.0*tr + -2.0*ml + 2.0*mr + -1.0*bl + 1.0*br;
      float gy = -1.0*tl + -2.0*tm + -1.0*tr + 1.0*bl + 2.0*bm + 1.0*br;
      float mag = sqrt(gx*gx + gy*gy) * edgeStrength;
      mag = mag < threshold ? 0.0 : mag;
      mag = clamp(mag, 0.0, 1.0);
      gl_FragColor = vec4(edgeColor * mag, 1.0);
    }
  `
};

const LaplacianEdgeShader = {
  uniforms: {
    tDiffuse: { value: null },
    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    edgeStrength: { value: 1.0 },
    edgeColor: { value: laplacianColor.clone() },
    threshold: { value: 0.1 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 resolution;
    uniform float edgeStrength;
    uniform vec3 edgeColor;
    uniform float threshold;
    varying vec2 vUv;

    float luminance(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

    void main() {
      vec2 texel = 1.0 / resolution;
      float tm = luminance(texture2D(tDiffuse, vUv + vec2(0.0, texel.y)).rgb);
      float ml = luminance(texture2D(tDiffuse, vUv + vec2(-texel.x, 0.0)).rgb);
      float mc = luminance(texture2D(tDiffuse, vUv).rgb);
      float mr = luminance(texture2D(tDiffuse, vUv + vec2(texel.x, 0.0)).rgb);
      float bm = luminance(texture2D(tDiffuse, vUv + vec2(0.0, -texel.y)).rgb);

      float lap = (-1.0*tm + -1.0*ml + 4.0*mc + -1.0*mr + -1.0*bm) * edgeStrength;
      float mag = abs(lap);
      mag = mag < threshold ? 0.0 : mag;
      mag = clamp(mag, 0.0, 1.0);
      gl_FragColor = vec4(edgeColor * mag, 1.0);
    }
  `
};

const SplitShader = {
  uniforms: {
    tSobel: { value: null },
    tLaplacian: { value: null },
    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tSobel;
    uniform sampler2D tLaplacian;
    uniform vec2 resolution;
    varying vec2 vUv;
    void main() {
      if (gl_FragCoord.x / resolution.x < 0.5) {
        gl_FragColor = texture2D(tSobel, vUv);
      } else {
        gl_FragColor = texture2D(tLaplacian, vUv);
      }
    }
  `
};

const OverlayBlendShader = {
  uniforms: {
    tOriginal: { value: null },
    tSobel: { value: null },
    tLaplacian: { value: null }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tOriginal;
    uniform sampler2D tSobel;
    uniform sampler2D tLaplacian;
    varying vec2 vUv;
    void main() {
      vec4 orig = texture2D(tOriginal, vUv);
      vec4 s = texture2D(tSobel, vUv);
      vec4 l = texture2D(tLaplacian, vUv);
      gl_FragColor = vec4(clamp(orig.rgb + s.rgb + l.rgb, 0.0, 1.0), 1.0);
    }
  `
};

// --- COMPOSERS & RENDER TARGETS ---
const renderPass = new RenderPass(scene, camera);

let sobelPass, laplacianPass;
let composerMain, composerSobel, composerLaplacian;
let rtSobel, rtLaplacian, rtOriginal;
let splitPass, overlayPass;
let composerSplit, composerOverlay;

function createEdgePasses() {
  sobelPass = new ShaderPass(SobelEdgeShader);
  laplacianPass = new ShaderPass(LaplacianEdgeShader);
  syncUniforms();
}

function syncUniforms() {
  if (sobelPass) {
    sobelPass.uniforms.edgeStrength.value = state.edgeStrength;
    sobelPass.uniforms.threshold.value = state.threshold;
    sobelPass.uniforms.edgeColor.value.copy(sobelColor);
    sobelPass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
  }
  if (laplacianPass) {
    laplacianPass.uniforms.edgeStrength.value = state.edgeStrength;
    laplacianPass.uniforms.threshold.value = state.threshold;
    laplacianPass.uniforms.edgeColor.value.copy(laplacianColor);
    laplacianPass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
  }
}

function createRenderTargets() {
  const w = window.innerWidth, h = window.innerHeight;
  const params = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat };
  if (rtSobel) rtSobel.dispose();
  if (rtLaplacian) rtLaplacian.dispose();
  if (rtOriginal) rtOriginal.dispose();
  rtSobel = new THREE.WebGLRenderTarget(w, h, params);
  rtLaplacian = new THREE.WebGLRenderTarget(w, h, params);
  rtOriginal = new THREE.WebGLRenderTarget(w, h, params);
  state.renderTargetWidth = w;
  state.renderTargetHeight = h;
}

function buildComposers() {
  createEdgePasses();
  createRenderTargets();

  const w = window.innerWidth, h = window.innerHeight;

  // Main composer for modes 0,1,2
  composerMain = new EffectComposer(renderer);
  composerMain.setSize(w, h);

  // Sobel-only composer rendering to rtSobel
  composerSobel = new EffectComposer(renderer, rtSobel);
  composerSobel.setSize(w, h);
  composerSobel.addPass(new RenderPass(scene, camera));
  const sobelPass2 = new ShaderPass(SobelEdgeShader);
  composerSobel.addPass(sobelPass2);

  // Laplacian-only composer rendering to rtLaplacian
  composerLaplacian = new EffectComposer(renderer, rtLaplacian);
  composerLaplacian.setSize(w, h);
  composerLaplacian.addPass(new RenderPass(scene, camera));
  const lapPass2 = new ShaderPass(LaplacianEdgeShader);
  composerLaplacian.addPass(lapPass2);

  // Original composer rendering to rtOriginal
  const composerOrig = new EffectComposer(renderer, rtOriginal);
  composerOrig.setSize(w, h);
  composerOrig.addPass(new RenderPass(scene, camera));

  // Split composer
  splitPass = new ShaderPass({
    uniforms: {
      tSobel: { value: rtSobel.texture },
      tLaplacian: { value: rtLaplacian.texture },
      resolution: { value: new THREE.Vector2(w, h) }
    },
    vertexShader: SplitShader.vertexShader,
    fragmentShader: SplitShader.fragmentShader
  });

  composerSplit = new EffectComposer(renderer);
  composerSplit.setSize(w, h);
  composerSplit.addPass(splitPass);

  // Overlay composer
  overlayPass = new ShaderPass({
    uniforms: {
      tOriginal: { value: rtOriginal.texture },
      tSobel: { value: rtSobel.texture },
      tLaplacian: { value: rtLaplacian.texture }
    },
    vertexShader: OverlayBlendShader.vertexShader,
    fragmentShader: OverlayBlendShader.fragmentShader
  });

  composerOverlay = new EffectComposer(renderer);
  composerOverlay.setSize(w, h);
  composerOverlay.addPass(overlayPass);

  // Store references for uniform sync
  window._sobelPass2 = sobelPass2;
  window._lapPass2 = lapPass2;
  window._composerOrig = composerOrig;
}

function rebuildMainComposer() {
  const w = window.innerWidth, h = window.innerHeight;
  composerMain = new EffectComposer(renderer);
  composerMain.setSize(w, h);
  composerMain.addPass(renderPass);

  if (state.currentMode === 1) {
    composerMain.addPass(sobelPass);
  } else if (state.currentMode === 2) {
    composerMain.addPass(laplacianPass);
  }
  state.composerPassCount = composerMain.passes.length;
}

function syncAllEdgeUniforms() {
  const w = window.innerWidth, h = window.innerHeight;
  const res = new THREE.Vector2(w, h);
  const passes = [sobelPass, window._sobelPass2];
  passes.forEach(p => {
    if (!p) return;
    p.uniforms.edgeStrength.value = state.edgeStrength;
    p.uniforms.threshold.value = state.threshold;
    p.uniforms.edgeColor.value.copy(sobelColor);
    p.uniforms.resolution.value.copy(res);
  });
  const lpasses = [laplacianPass, window._lapPass2];
  lpasses.forEach(p => {
    if (!p) return;
    p.uniforms.edgeStrength.value = state.edgeStrength;
    p.uniforms.threshold.value = state.threshold;
    p.uniforms.edgeColor.value.copy(laplacianColor);
    p.uniforms.resolution.value.copy(res);
  });
  if (splitPass) {
    splitPass.uniforms.resolution.value.copy(res);
  }
}

buildComposers();
rebuildMainComposer();

// --- MODEL LOADING ---
const loader = new GLTFLoader();
loader.load('PrimaryIonDrive.glb', (gltf) => {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxAxis = Math.max(size.x, size.y, size.z);
  const scale = 4.0 / maxAxis;
  model.scale.setScalar(scale);

  box.setFromObject(model);
  const newCenter = box.getCenter(new THREE.Vector3());
  model.position.sub(newCenter);

  const overrideMat = new THREE.MeshStandardMaterial({
    color: 0x8899aa, roughness: 0.5, metalness: 0.4
  });
  model.traverse((child) => {
    if (child.isMesh) {
      child.material = overrideMat;
    }
  });

  modelGroup.add(model);

  const finalBox = new THREE.Box3().setFromObject(modelGroup);
  const finalSize = finalBox.getSize(new THREE.Vector3());
  state.modelBBoxSize = { x: +finalSize.x.toFixed(3), y: +finalSize.y.toFixed(3), z: +finalSize.z.toFixed(3) };
  state.modelLoaded = true;
  document.getElementById('loading').style.display = 'none';
}, undefined, (err) => {
  console.error('Model load error:', err);
  document.getElementById('loading').textContent = 'Model load failed. Place PrimaryIonDrive.glb in same directory.';
  // Create fallback geometry
  const geo = new THREE.TorusKnotGeometry(1.2, 0.4, 128, 32);
  const mat = new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.5, metalness: 0.4 });
  const mesh = new THREE.Mesh(geo, mat);
  modelGroup.add(mesh);
  const box = new THREE.Box3().setFromObject(modelGroup);
  const size = box.getSize(new THREE.Vector3());
  state.modelBBoxSize = { x: +size.x.toFixed(3), y: +size.y.toFixed(3), z: +size.z.toFixed(3) };
  state.modelLoaded = true;
  document.getElementById('loading').style.display = 'none';
});

// --- MODE SWITCHING ---
function setMode(m) {
  state.currentMode = ((m % 5) + 5) % 5;
  state.currentModeName = MODE_NAMES[state.currentMode];
  state.modeHistory.push(state.currentMode);
  if (state.modeHistory.length > 10) state.modeHistory.shift();
  rebuildMainComposer();
  updateButtons();
  updateHUD();
}

function updateButtons() {
  document.querySelectorAll('#button-bar button').forEach(b => b.classList.remove('active'));
  const id = 'btn-' + MODE_NAMES[state.currentMode];
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

// --- HUD ---
function updateHUD() {
  document.getElementById('hud-mode').textContent = state.currentModeName;
  document.getElementById('hud-strength').textContent = state.edgeStrength.toFixed(1);
  document.getElementById('hud-threshold').textContent = state.threshold.toFixed(2);
  document.getElementById('hud-rotate').textContent = state.autoRotate ? 'ON' : 'OFF';
  state.sobelColorHex = vec3ToHex(sobelColor);
  state.laplacianColorHex = vec3ToHex(laplacianColor);
  document.getElementById('hud-sobel-color').textContent = state.sobelColorHex;
  document.getElementById('hud-laplacian-color').textContent = state.laplacianColorHex;
}

// --- KEYBOARD ---
window.addEventListener('keydown', (e) => {
  const key = e.key;
  if (key === 'm' && !e.shiftKey) {
    setMode(state.currentMode + 1);
  } else if (key === 'M' && e.shiftKey) {
    setMode(state.currentMode - 1);
  } else if (key === 'r' || key === 'R') {
    state.autoRotate = !state.autoRotate;
    updateHUD();
  } else if (key === 'ArrowUp') {
    state.edgeStrength = Math.min(3.0, +(state.edgeStrength + 0.1).toFixed(1));
    updateHUD();
  } else if (key === 'ArrowDown') {
    state.edgeStrength = Math.max(0.1, +(state.edgeStrength - 0.1).toFixed(1));
    updateHUD();
  } else if (key === 't' && !e.shiftKey) {
    state.threshold = Math.min(1.0, +(state.threshold + 0.05).toFixed(2));
    updateHUD();
  } else if (key === 'T' && e.shiftKey) {
    state.threshold = Math.max(0.0, +(state.threshold - 0.05).toFixed(2));
    updateHUD();
  } else if (key === '1') {
    sobelColor.set(0, 1, 0.5);
    updateHUD();
  } else if (key === '2') {
    sobelColor.set(0, 1, 1);
    updateHUD();
  } else if (key === '3') {
    laplacianColor.set(1, 0.3, 0);
    updateHUD();
  } else if (key === '4') {
    laplacianColor.set(1, 0, 1);
    updateHUD();
  }
});

// --- BUTTONS ---
document.getElementById('btn-original').addEventListener('click', () => setMode(0));
document.getElementById('btn-sobel').addEventListener('click', () => setMode(1));
document.getElementById('btn-laplacian').addEventListener('click', () => setMode(2));
document.getElementById('btn-split').addEventListener('click', () => setMode(3));
document.getElementById('btn-overlay').addEventListener('click', () => setMode(4));

// --- RESIZE ---
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  buildComposers();
  rebuildMainComposer();
});

// --- ANIMATION ---
let lastTime = performance.now();
let fpsFrames = 0;
let fpsTime = 0;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  const now = performance.now();

  // FPS
  fpsFrames++;
  fpsTime += now - lastTime;
  lastTime = now;
  if (fpsTime >= 500) {
    state.fps = Math.round(fpsFrames / (fpsTime / 1000));
    document.getElementById('hud-fps').textContent = state.fps;
    fpsFrames = 0;
    fpsTime = 0;
  }

  // Auto-rotate
  if (state.autoRotate) {
    modelGroup.rotation.y += 0.3 * dt;
  }
  state.modelRotationY = modelGroup.rotation.y;

  controls.update();
  syncAllEdgeUniforms();

  const mode = state.currentMode;

  if (mode === 0 || mode === 1 || mode === 2) {
    composerMain.render();
    state.composerPassCount = composerMain.passes.length;
  } else if (mode === 3) {
    // Split: render sobel to rtSobel, laplacian to rtLaplacian, then composite
    composerSobel.render();
    composerLaplacian.render();
    splitPass.uniforms.tSobel.value = rtSobel.texture;
    splitPass.uniforms.tLaplacian.value = rtLaplacian.texture;
    composerSplit.render();
    state.composerPassCount = 5; // 2+2+1
  } else if (mode === 4) {
    // Overlay: render original, sobel, laplacian, then blend
    window._composerOrig.render();
    composerSobel.render();
    composerLaplacian.render();
    overlayPass.uniforms.tOriginal.value = rtOriginal.texture;
    overlayPass.uniforms.tSobel.value = rtSobel.texture;
    overlayPass.uniforms.tLaplacian.value = rtLaplacian.texture;
    composerOverlay.render();
    state.composerPassCount = 6;
  }

  state.frameCount++;
  if (!state.sceneReady && state.frameCount > 0) {
    state.sceneReady = true;
  }
}

updateHUD();
animate();
</script>
</body>
</html>
