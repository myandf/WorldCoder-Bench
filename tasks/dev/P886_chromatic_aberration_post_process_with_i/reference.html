<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Chromatic Aberration</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    canvas {
      display: block;
    }

    #ui-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px;
      width: 260px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
    }

    #ui-panel h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      font-weight: 600;
    }

    .row {
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
    }

    #intensity-slider {
      width: 100%;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: #2e2e2e;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: #404040;
    }

    button:active {
      transform: translateY(1px);
    }

    .hint {
      font-size: 11px;
      line-height: 1.4;
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
  <div id="ui-panel">
    <h3>Chromatic Aberration</h3>

    <div class="row">
      <label for="intensity-slider">
        Intensity: <span id="intensity-label">0.005</span>
      </label>
      <input id="intensity-slider" type="range" min="0" max="50" step="1" value="5" />
    </div>

    <div class="row button-row">
      <button id="toggle-btn">CA: ON</button>
      <button id="pause-btn">Pause</button>
    </div>

    <div class="row button-row">
      <button id="preset-low">Low</button>
      <button id="preset-medium">Medium</button>
      <button id="preset-high">High</button>
    </div>

    <div class="row hint">
      Keys: <b>r</b> reset, <b>+</b>/<b>=</b> increase, <b>-</b> decrease
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101218);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.8, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(3, 5, 4);
    scene.add(directionalLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.1, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const commonMat = (color) => new THREE.MeshStandardMaterial({
      color,
      metalness: 0.3,
      roughness: 0.5
    });

    const objects = [];

    const torusKnot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.5, 0.18, 128, 16),
      commonMat(0xff3333)
    );
    torusKnot.position.set(-2, 1, 0);
    scene.add(torusKnot);
    objects.push(torusKnot);

    const icosahedron = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.7, 0),
      commonMat(0x3333ff)
    );
    icosahedron.position.set(2, 1, 0);
    scene.add(icosahedron);
    objects.push(icosahedron);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      commonMat(0x33ff33)
    );
    box.position.set(0, 0.5, -2);
    scene.add(box);
    objects.push(box);

    const cylinder = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.45, 1, 32),
      commonMat(0xffff33)
    );
    cylinder.position.set(-1, 0.5, 2);
    scene.add(cylinder);
    objects.push(cylinder);

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 32, 32),
      commonMat(0xff33ff)
    );
    sphere.position.set(1, 0.5, 2);
    scene.add(sphere);
    objects.push(sphere);

    const renderPass = new RenderPass(scene, camera);

    const chromaticAberrationShader = {
      uniforms: {
        tDiffuse: { value: null },
        uIntensity: { value: 0.005 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uIntensity;
        varying vec2 vUv;

        void main() {
          vec2 center = vec2(0.5, 0.5);
          vec2 dir = vUv - center;

          vec2 offset = dir * uIntensity;

          vec2 uvR = clamp(vUv + offset, 0.0, 1.0);
          vec2 uvG = clamp(vUv, 0.0, 1.0);
          vec2 uvB = clamp(vUv - offset, 0.0, 1.0);

          float r = texture2D(tDiffuse, uvR).r;
          float g = texture2D(tDiffuse, uvG).g;
          float b = texture2D(tDiffuse, uvB).b;

          gl_FragColor = vec4(r, g, b, 1.0);
        }
      `
    };

    const caPass = new ShaderPass(chromaticAberrationShader);

    const composer = new EffectComposer(renderer);
    composer.addPass(renderPass);
    composer.addPass(caPass);

    const slider = document.getElementById('intensity-slider');
    const intensityLabel = document.getElementById('intensity-label');
    const toggleBtn = document.getElementById('toggle-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const presetLowBtn = document.getElementById('preset-low');
    const presetMediumBtn = document.getElementById('preset-medium');
    const presetHighBtn = document.getElementById('preset-high');

    let enabled = true;
    let paused = false;
    let frameCount = 0;
    let presetActive = null;

    function sliderToIntensity(value) {
      return Number(value) / 1000;
    }

    function intensityToSliderValue(intensity) {
      return Math.round(THREE.MathUtils.clamp(intensity, 0, 0.05) * 1000);
    }

    function setIntensity(intensity, preset = null) {
      const clamped = THREE.MathUtils.clamp(intensity, 0, 0.05);
      const raw = intensityToSliderValue(clamped);
      slider.value = String(raw);
      caPass.uniforms.uIntensity.value = raw / 1000;
      intensityLabel.textContent = (raw / 1000).toFixed(3);
      presetActive = preset;
      updateState();
    }

    function updateToggleButton() {
      toggleBtn.textContent = enabled ? 'CA: ON' : 'CA: OFF';
    }

    function updatePauseButton() {
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    }

    function updateState() {
      window.__3D_STATE__ = {
        intensity: Number(caPass.uniforms.uIntensity.value),
        enabled,
        paused,
        objectCount: objects.length,
        frameCount,
        sliderValue: Number(slider.value),
        objectRotations: objects.map(obj => obj.rotation.y),
        cameraPosition: {
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z
        },
        shaderUniformIntensity: Number(caPass.uniforms.uIntensity.value),
        presetActive
      };
    }

    slider.addEventListener('input', () => {
      const intensity = sliderToIntensity(slider.value);
      caPass.uniforms.uIntensity.value = intensity;
      intensityLabel.textContent = intensity.toFixed(3);

      if (Math.abs(intensity - 0.002) < 0.0005) presetActive = 'low';
      else if (Math.abs(intensity - 0.015) < 0.0005) presetActive = 'medium';
      else if (Math.abs(intensity - 0.040) < 0.0005) presetActive = 'high';
      else presetActive = null;

      updateState();
    });

    toggleBtn.addEventListener('click', () => {
      enabled = !enabled;
      caPass.enabled = enabled;
      updateToggleButton();
      updateState();
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      updatePauseButton();
      updateState();
    });

    presetLowBtn.addEventListener('click', () => setIntensity(0.002, 'low'));
    presetMediumBtn.addEventListener('click', () => setIntensity(0.015, 'medium'));
    presetHighBtn.addEventListener('click', () => setIntensity(0.040, 'high'));

    window.addEventListener('keydown', (e) => {
      const key = e.key;

      if (key === 'r' || key === 'R') {
        enabled = true;
        caPass.enabled = true;
        updateToggleButton();
        setIntensity(0.005, null);
      } else if (key === '+' || key === '=') {
        e.preventDefault();
        setIntensity(caPass.uniforms.uIntensity.value + 0.001, null);
      } else if (key === '-') {
        e.preventDefault();
        setIntensity(caPass.uniforms.uIntensity.value - 0.001, null);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      updateState();
    });

    updateToggleButton();
    updatePauseButton();
    setIntensity(0.005, null);

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      if (!paused) {
        for (const obj of objects) {
          obj.rotation.y += 0.01;
        }
        frameCount++;
      }

      if (enabled) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }

      updateState();
    }

    updateState();
    animate();
  </script>
</body>
</html>
