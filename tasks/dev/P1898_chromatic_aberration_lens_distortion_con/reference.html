<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lens Configurator</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: monospace;
    }
    canvas { display: block; }

    #ui {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 320px;
      background: rgba(20, 20, 20, 0.82);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 14px;
      box-sizing: border-box;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    #ui h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 700;
    }
    .control {
      margin-bottom: 12px;
    }
    .control label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .control input[type="range"] {
      width: 100%;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    button {
      background: #2f2f2f;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-family: monospace;
      flex: 1;
    }
    button:hover {
      background: #3b3b3b;
    }
    button.active {
      background: #5a84ff;
      border-color: #87a5ff;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .hint {
      font-size: 11px;
      color: #ccc;
      line-height: 1.4;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Lens Configurator</h2>

    <div class="control">
      <label for="aberration">
        <span>Aberration Strength</span>
        <span id="aberrationValue">0.000</span>
      </label>
      <input id="aberration" type="range" min="0" max="0.05" step="0.002" value="0" />
    </div>

    <div class="control">
      <label for="k1">
        <span>Distortion K1</span>
        <span id="k1Value">0.000</span>
      </label>
      <input id="k1" type="range" min="-1" max="1" step="0.001" value="0" />
    </div>

    <div class="control">
      <label for="k2">
        <span>Distortion K2</span>
        <span id="k2Value">0.000</span>
      </label>
      <input id="k2" type="range" min="-0.5" max="0.5" step="0.001" value="0" />
    </div>

    <div class="control">
      <label for="vOuter">
        <span>Vignette Outer</span>
        <span id="vOuterValue">1.200</span>
      </label>
      <input id="vOuter" type="range" min="0.5" max="2" step="0.001" value="1.2" />
    </div>

    <div class="control">
      <label for="vInner">
        <span>Vignette Inner</span>
        <span id="vInnerValue">0.500</span>
      </label>
      <input id="vInner" type="range" min="0" max="1.5" step="0.001" value="0.5" />
    </div>

    <div class="row">
      <button id="preset0">None</button>
      <button id="preset1">Subtle</button>
      <button id="preset2">Extreme</button>
    </div>

    <div class="checkbox-row">
      <input id="enableEffects" type="checkbox" checked />
      <label for="enableEffects">Enable Effects</label>
    </div>

    <div class="row">
      <button id="resetCamera">Reset Camera</button>
    </div>

    <div class="hint">
      Keys: 1/2/3 presets, E toggle effects, R reset camera, arrows orbit, mouse wheel zoom.
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';
    import { GammaCorrectionShader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/shaders/GammaCorrectionShader.js';

    const state = window.__3D_STATE__ = {
      aberrationStrength: 0.0,
      distortionK1: 0.0,
      distortionK2: 0.0,
      vignetteOuter: 1.2,
      vignetteInner: 0.5,
      effectsEnabled: true,
      activePreset: 0,
      cameraAzimuth: 0,
      cameraPolar: Math.PI / 4,
      cameraRadius: 8,
      objectCount: 5,
      frameCount: 0,
      composerPassCount: 0,
      sceneReady: false
    };

    const PRESETS = [
      { aberration: 0.0,   k1: 0.0,  k2: 0.0,  outer: 1.2, inner: 0.5 },
      { aberration: 0.008, k1: 0.15, k2: 0.05, outer: 1.0, inner: 0.4 },
      { aberration: 0.04,  k1: 0.6,  k2: 0.3,  outer: 0.7, inner: 0.2 }
    ];

    const target = new THREE.Vector3(0, 1, 0);
    const clock = new THREE.Clock();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0b10);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    function updateCameraFromOrbit() {
      const r = state.cameraRadius;
      const polar = state.cameraPolar;
      const azimuth = state.cameraAzimuth;

      const sinP = Math.sin(polar);
      camera.position.set(
        target.x + r * sinP * Math.sin(azimuth),
        target.y + r * Math.cos(polar),
        target.z + r * sinP * Math.cos(azimuth)
      );
      camera.lookAt(target);
    }

    function resetCamera() {
      state.cameraAzimuth = 0;
      state.cameraPolar = Math.PI / 4;
      state.cameraRadius = 8;
      updateCameraFromOrbit();
    }

    resetCamera();

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    function createCheckerTexture(size = 1024, cells = 20) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const cellSize = size / cells;
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? '#222222' : '#eeeeee';
          ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const groundTex = createCheckerTexture(1024, 20);
    const groundMat = new THREE.MeshStandardMaterial({ map: groundTex });
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      groundMat
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const rotatingObjects = [];

    function addRotatingMesh(mesh, speed) {
      rotatingObjects.push({ mesh, speed });
      scene.add(mesh);
    }

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(1, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xff3333 })
    );
    sphere.position.set(-4, 1.5, 0);
    addRotatingMesh(sphere, 0.3);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.MeshStandardMaterial({ color: 0x33ff33 })
    );
    box.position.set(-1.5, 0.75, 0);
    addRotatingMesh(box, 0.5);

    const torus = new THREE.Mesh(
      new THREE.TorusGeometry(0.8, 0.3, 24, 48),
      new THREE.MeshStandardMaterial({ color: 0x3333ff })
    );
    torus.position.set(1.5, 1.2, 0);
    addRotatingMesh(torus, 0.7);

    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.8, 2, 32),
      new THREE.MeshStandardMaterial({ color: 0xffff33 })
    );
    cone.position.set(4, 1, 0);
    addRotatingMesh(cone, 0.4);

    const ico = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.7, 0),
      new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    ico.position.set(0, 2.5, -2);
    addRotatingMesh(ico, 0.6);

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);

    const ChromaticAberrationShader = {
      uniforms: {
        tDiffuse: { value: null },
        uAberrationStrength: { value: 0.0 }
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse;
        uniform float uAberrationStrength;
        varying vec2 vUv;

        vec4 sampleSafe(vec2 uv) {
          if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec4(0.0);
          return texture2D(tDiffuse, uv);
        }

        void main() {
          vec2 center = vec2(0.5);
          vec2 dir = vUv - center;
          float dist = length(dir);
          vec2 n = dist > 0.00001 ? normalize(dir) : vec2(0.0);
          vec2 offset = n * uAberrationStrength * dist;

          float r = sampleSafe(vUv + offset).r;
          float g = sampleSafe(vUv).g;
          float b = sampleSafe(vUv - offset).b;
          float a = sampleSafe(vUv).a;

          gl_FragColor = vec4(r, g, b, a);
        }
      `
    };

    const LensDistortionShader = {
      uniforms: {
        tDiffuse: { value: null },
        uDistortionK1: { value: 0.0 },
        uDistortionK2: { value: 0.0 }
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse;
        uniform float uDistortionK1;
        uniform float uDistortionK2;
        varying vec2 vUv;

        void main() {
          vec2 center = vec2(0.5);
          vec2 delta = vUv - center;
          float r = length(delta);
          float r2 = r * r;
          float r4 = r2 * r2;
          vec2 distorted = center + delta * (1.0 + uDistortionK1 * r2 + uDistortionK2 * r4);

          if (distorted.x < 0.0 || distorted.x > 1.0 || distorted.y < 0.0 || distorted.y > 1.0) {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          } else {
            gl_FragColor = texture2D(tDiffuse, distorted);
          }
        }
      `
    };

    const VignetteShader = {
      uniforms: {
        tDiffuse: { value: null },
        uVignetteOuter: { value: 1.2 },
        uVignetteInner: { value: 0.5 }
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse;
        uniform float uVignetteOuter;
        uniform float uVignetteInner;
        varying vec2 vUv;

        void main() {
          vec4 color = texture2D(tDiffuse, vUv);
          vec2 centered = (vUv - vec2(0.5)) * 2.0;
          float r = length(centered);
          float factor = smoothstep(uVignetteOuter, uVignetteInner, r);
          vec3 finalColor = color.rgb * factor;
          gl_FragColor = vec4(finalColor, color.a);
        }
      `
    };

    const aberrationPass = new ShaderPass(ChromaticAberrationShader);
    const distortionPass = new ShaderPass(LensDistortionShader);
    const vignettePass = new ShaderPass(VignetteShader);
    const gammaPass = new ShaderPass(GammaCorrectionShader);

    composer.addPass(renderPass);
    composer.addPass(aberrationPass);
    composer.addPass(distortionPass);
    composer.addPass(vignettePass);
    composer.addPass(gammaPass);

    state.composerPassCount = composer.passes.length;

    const ui = {
      aberration: document.getElementById('aberration'),
      k1: document.getElementById('k1'),
      k2: document.getElementById('k2'),
      vOuter: document.getElementById('vOuter'),
      vInner: document.getElementById('vInner'),
      aberrationValue: document.getElementById('aberrationValue'),
      k1Value: document.getElementById('k1Value'),
      k2Value: document.getElementById('k2Value'),
      vOuterValue: document.getElementById('vOuterValue'),
      vInnerValue: document.getElementById('vInnerValue'),
      enableEffects: document.getElementById('enableEffects'),
      presetButtons: [
        document.getElementById('preset0'),
        document.getElementById('preset1'),
        document.getElementById('preset2')
      ],
      resetCamera: document.getElementById('resetCamera')
    };

    function fmt(v) {
      return Number(v).toFixed(3);
    }

    function syncUniformsFromState() {
      aberrationPass.uniforms.uAberrationStrength.value = state.aberrationStrength;
      distortionPass.uniforms.uDistortionK1.value = state.distortionK1;
      distortionPass.uniforms.uDistortionK2.value = state.distortionK2;
      vignettePass.uniforms.uVignetteOuter.value = state.vignetteOuter;
      vignettePass.uniforms.uVignetteInner.value = state.vignetteInner;

      aberrationPass.enabled = state.effectsEnabled;
      distortionPass.enabled = state.effectsEnabled;
      vignettePass.enabled = state.effectsEnabled;
    }

    function updateUILabels() {
      ui.aberrationValue.textContent = fmt(state.aberrationStrength);
      ui.k1Value.textContent = fmt(state.distortionK1);
      ui.k2Value.textContent = fmt(state.distortionK2);
      ui.vOuterValue.textContent = fmt(state.vignetteOuter);
      ui.vInnerValue.textContent = fmt(state.vignetteInner);

      ui.aberration.value = state.aberrationStrength;
      ui.k1.value = state.distortionK1;
      ui.k2.value = state.distortionK2;
      ui.vOuter.value = state.vignetteOuter;
      ui.vInner.value = state.vignetteInner;
      ui.enableEffects.checked = state.effectsEnabled;

      ui.presetButtons.forEach((btn, i) => {
        btn.classList.toggle('active', state.activePreset === i);
      });
    }

    function valuesMatchPreset(p, eps = 1e-6) {
      return (
        Math.abs(state.aberrationStrength - p.aberration) < eps &&
        Math.abs(state.distortionK1 - p.k1) < eps &&
        Math.abs(state.distortionK2 - p.k2) < eps &&
        Math.abs(state.vignetteOuter - p.outer) < eps &&
        Math.abs(state.vignetteInner - p.inner) < eps
      );
    }

    function detectActivePreset() {
      let found = -1;
      for (let i = 0; i < PRESETS.length; i++) {
        if (valuesMatchPreset(PRESETS[i])) {
          found = i;
          break;
        }
      }
      state.activePreset = found;
    }

    function refreshAll() {
      detectActivePreset();
      syncUniformsFromState();
      updateUILabels();
    }

    function applyPreset(index) {
      const p = PRESETS[index];
      state.aberrationStrength = p.aberration;
      state.distortionK1 = p.k1;
      state.distortionK2 = p.k2;
      state.vignetteOuter = p.outer;
      state.vignetteInner = p.inner;
      state.activePreset = index;
      refreshAll();
    }

    ui.presetButtons[0].addEventListener('click', () => applyPreset(0));
    ui.presetButtons[1].addEventListener('click', () => applyPreset(1));
    ui.presetButtons[2].addEventListener('click', () => applyPreset(2));

    ui.aberration.addEventListener('input', () => {
      state.aberrationStrength = parseFloat(ui.aberration.value);
      refreshAll();
    });

    ui.k1.addEventListener('input', () => {
      state.distortionK1 = parseFloat(ui.k1.value);
      refreshAll();
    });

    ui.k2.addEventListener('input', () => {
      state.distortionK2 = parseFloat(ui.k2.value);
      refreshAll();
    });

    ui.vOuter.addEventListener('input', () => {
      state.vignetteOuter = parseFloat(ui.vOuter.value);
      refreshAll();
    });

    ui.vInner.addEventListener('input', () => {
      state.vignetteInner = parseFloat(ui.vInner.value);
      refreshAll();
    });

    ui.enableEffects.addEventListener('change', () => {
      state.effectsEnabled = ui.enableEffects.checked;
      refreshAll();
    });

    ui.resetCamera.addEventListener('click', resetCamera);

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      const typing = tag === 'INPUT' && document.activeElement.type !== 'checkbox';

      if (!typing) {
        if (e.key === '1') applyPreset(0);
        if (e.key === '2') applyPreset(1);
        if (e.key === '3') applyPreset(2);

        if (e.key === 'e' || e.key === 'E') {
          state.effectsEnabled = !state.effectsEnabled;
          refreshAll();
        }

        if (e.key === 'r' || e.key === 'R') {
          resetCamera();
        }

        if (e.key === 'ArrowLeft') {
          state.cameraAzimuth -= 0.1;
          updateCameraFromOrbit();
          e.preventDefault();
        }
        if (e.key === 'ArrowRight') {
          state.cameraAzimuth += 0.1;
          updateCameraFromOrbit();
          e.preventDefault();
        }
        if (e.key === 'ArrowUp') {
          state.cameraPolar = Math.max(0.1, state.cameraPolar - 0.1);
          updateCameraFromOrbit();
          e.preventDefault();
        }
        if (e.key === 'ArrowDown') {
          state.cameraPolar = Math.min(Math.PI - 0.1, state.cameraPolar + 0.1);
          updateCameraFromOrbit();
          e.preventDefault();
        }
      }
    });

    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      state.cameraRadius += e.deltaY > 0 ? 0.5 : -0.5;
      state.cameraRadius = THREE.MathUtils.clamp(state.cameraRadius, 3, 20);
      updateCameraFromOrbit();
    }, { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    refreshAll();
    state.sceneReady = true;

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      for (const item of rotatingObjects) {
        item.mesh.rotation.y += item.speed * dt;
      }

      composer.render();

      state.frameCount += 1;
      state.objectCount = rotatingObjects.length;
      state.composerPassCount = composer.passes.length;
      state.cameraAzimuth = state.cameraAzimuth;
      state.cameraPolar = state.cameraPolar;
      state.cameraRadius = state.cameraRadius;
    }

    animate();
  </script>
</body>
</html>
