<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Raymarched SDF Boolean Ops</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.58);
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.45;
      font-size: 14px;
      min-width: 220px;
      user-select: none;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    #hud b {
      color: #9fd3ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>Operation: <b id="hud-operation">union</b></div>
    <div>Smooth k: <b id="hud-smooth-k">0.50</b></div>
    <div>Orbit angle: <b id="hud-orbit">0.00</b></div>
    <div>Animation: <b id="hud-anim">ON</b></div>
    <div>FPS: <b id="hud-fps">0.0</b></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const BOOL_OPS = ['union', 'intersection', 'subtraction', 'smooth_union'];
    const DEFAULTS = {
      boolOpIndex: 0,
      smoothK: 0.5,
      orbitAngle: 0.0,
      animating: true
    };

    let boolOpIndex = DEFAULTS.boolOpIndex;
    let smoothK = DEFAULTS.smoothK;
    let orbitAngle = DEFAULTS.orbitAngle;
    let animating = DEFAULTS.animating;

    let accumulatedTime = 0;
    let lastTimestamp = performance.now() * 0.001;
    let frameCount = 0;

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      u_time: { value: 0.0 },
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      u_boolOp: { value: boolOpIndex },
      u_smoothK: { value: smoothK },
      u_orbitAngle: { value: orbitAngle },
      u_animating: { value: animating }
    };

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      varying vec2 vUv;

      uniform float u_time;
      uniform vec2 u_resolution;
      uniform int u_boolOp;
      uniform float u_smoothK;
      uniform float u_orbitAngle;
      uniform bool u_animating;

      const int MAX_STEPS = 128;
      const float MAX_DIST = 50.0;
      const float SURF_EPS = 0.001;

      vec3 rotateY(vec3 p, float a) {
        float c = cos(a);
        float s = sin(a);
        return vec3(
          c * p.x + s * p.z,
          p.y,
          -s * p.x + c * p.z
        );
      }

      float sdSphere(vec3 p, float r) {
        return length(p) - r;
      }

      float sdBox(vec3 p, vec3 b) {
        vec3 q = abs(p) - b;
        return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
      }

      float sdTorus(vec3 p, vec2 t) {
        vec2 q = vec2(length(p.xz) - t.x, p.y);
        return length(q) - t.y;
      }

      float sdCappedCylinder(vec3 p, float h, float r) {
        vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h * 0.5);
        return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
      }

      float sdPlane(vec3 p) {
        return p.y + 1.0;
      }

      float opUnion(float a, float b) {
        return min(a, b);
      }

      float opIntersection(float a, float b) {
        return max(a, b);
      }

      float opSubtraction(float a, float b) {
        return max(a, -b);
      }

      float opSmoothUnion(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      vec2 combineSphereBox(float ds, float db, float k, int op) {
        float d;
        if (op == 0) {
          d = opUnion(ds, db);
        } else if (op == 1) {
          d = opIntersection(ds, db);
        } else if (op == 2) {
          d = opSubtraction(ds, db);
        } else {
          d = opSmoothUnion(ds, db, k);
        }
        return vec2(d, 1.0);
      }

      vec2 sceneSDF(vec3 p) {
        float sphereYOffset = sin(u_time * 6.28318530718) * 0.5;
        vec3 sphereCenter = vec3(0.0, sphereYOffset, 0.0);
        vec3 boxCenter = vec3(2.0, 0.0, 0.0);
        vec3 torusCenter = vec3(-2.0, 0.0, 0.0);
        vec3 cylinderCenter = vec3(0.0, 0.0, -2.0);

        float ds = sdSphere(p - sphereCenter, 1.0);
        float db = sdBox(p - boxCenter, vec3(0.8));
        float dt = sdTorus(p - torusCenter, vec2(1.0, 0.3));
        float dc = sdCappedCylinder(p - cylinderCenter, 2.0, 0.5);
        float dg = sdPlane(p);

        vec2 res = combineSphereBox(ds, db, u_smoothK, u_boolOp);
        if (dt < res.x) res = vec2(dt, 2.0);
        if (dc < res.x) res = vec2(dc, 3.0);
        if (dg < res.x) res = vec2(dg, 4.0);

        return res;
      }

      vec3 getNormal(vec3 p) {
        vec2 e = vec2(0.001, 0.0);
        float dx = sceneSDF(p + vec3(e.x, e.y, e.y)).x - sceneSDF(p - vec3(e.x, e.y, e.y)).x;
        float dy = sceneSDF(p + vec3(e.y, e.x, e.y)).x - sceneSDF(p - vec3(e.y, e.x, e.y)).x;
        float dz = sceneSDF(p + vec3(e.y, e.y, e.x)).x - sceneSDF(p - vec3(e.y, e.y, e.x)).x;
        return normalize(vec3(dx, dy, dz));
      }

      float calcAO(vec3 p, vec3 n) {
        float occ = 0.0;
        float sca = 1.0;
        for (int i = 0; i < 5; i++) {
          float h = 0.02 + 0.08 * float(i);
          float d = sceneSDF(p + n * h).x;
          occ += (h - d) * sca;
          sca *= 0.7;
        }
        return clamp(1.0 - occ, 0.0, 1.0);
      }

      float softShadow(vec3 ro, vec3 rd, float tmin, float tmax) {
        float res = 1.0;
        float t = tmin;
        for (int i = 0; i < 48; i++) {
          float h = sceneSDF(ro + rd * t).x;
          if (h < 0.001) return 0.0;
          res = min(res, 12.0 * h / t);
          t += clamp(h, 0.02, 0.2);
          if (t > tmax) break;
        }
        return clamp(res, 0.0, 1.0);
      }

      vec3 getMaterialColor(float id, vec3 p) {
        if (id < 1.5) return vec3(0.95, 0.35, 0.25);
        if (id < 2.5) return vec3(0.25, 0.8, 0.95);
        if (id < 3.5) return vec3(0.4, 0.95, 0.45);
        float checker = mod(floor(p.x) + floor(p.z), 2.0);
        return mix(vec3(0.18), vec3(0.28), checker);
      }

      void main() {
        vec2 uv = vUv * 2.0 - 1.0;
        float aspect = u_resolution.x / max(u_resolution.y, 1.0);
        uv.x *= aspect;

        vec3 baseCam = vec3(0.0, 2.0, 5.0);
        vec3 ro = rotateY(baseCam, u_orbitAngle);
        vec3 ta = vec3(0.0, 0.0, 0.0);

        vec3 ww = normalize(ta - ro);
        vec3 uu = normalize(cross(vec3(0.0, 1.0, 0.0), ww));
        vec3 vv = cross(ww, uu);

        float focal = 1.6;
        vec3 rd = normalize(uv.x * uu + uv.y * vv + focal * ww);

        float t = 0.0;
        float hitId = -1.0;
        bool hit = false;

        for (int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * t;
          vec2 res = sceneSDF(p);
          if (res.x < SURF_EPS) {
            hit = true;
            hitId = res.y;
            break;
          }
          t += res.x;
          if (t > MAX_DIST) break;
        }

        vec3 col;
        if (hit) {
          vec3 p = ro + rd * t;
          vec3 n = getNormal(p);
          vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
          float diff = max(dot(n, lightDir), 0.0);
          float ao = calcAO(p, n);
          float sh = softShadow(p + n * 0.01, lightDir, 0.02, 12.0);
          vec3 base = getMaterialColor(hitId, p);
          vec3 halfDir = normalize(lightDir - rd);
          float spec = pow(max(dot(n, halfDir), 0.0), 32.0);

          float amb = 0.2;
          float lighting = amb + diff * 0.8 * sh;
          col = base * lighting * ao + vec3(1.0) * spec * 0.2 * sh;

          float fog = exp(-0.03 * t * t);
          vec3 sky = mix(vec3(0.70, 0.82, 0.96), vec3(0.25, 0.35, 0.55), clamp(0.5 + 0.5 * rd.y, 0.0, 1.0));
          col = mix(sky, col, fog);
        } else {
          col = mix(vec3(0.70, 0.82, 0.96), vec3(0.25, 0.35, 0.55), clamp(0.5 + 0.5 * rd.y, 0.0, 1.0));
        }

        col = pow(col, vec3(0.4545));
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader
    });

    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(quad);

    const hudOperation = document.getElementById('hud-operation');
    const hudSmoothK = document.getElementById('hud-smooth-k');
    const hudOrbit = document.getElementById('hud-orbit');
    const hudAnim = document.getElementById('hud-anim');
    const hudFps = document.getElementById('hud-fps');

    function getCameraPosition(angle) {
      const x = Math.sin(angle) * 5.0;
      const z = Math.cos(angle) * 5.0;
      return { x, y: 2.0, z };
    }

    function getSphereCenter(time) {
      return { x: 0.0, y: Math.sin(time * Math.PI * 2.0) * 0.5, z: 0.0 };
    }

    function updateHUD(fps) {
      hudOperation.textContent = BOOL_OPS[boolOpIndex];
      hudSmoothK.textContent = smoothK.toFixed(2);
      hudOrbit.textContent = orbitAngle.toFixed(2);
      hudAnim.textContent = animating ? 'ON' : 'OFF';
      hudFps.textContent = fps.toFixed(1);
    }

    function uniformsAreValid() {
      const values = [
        uniforms.u_time.value,
        uniforms.u_resolution.value.x,
        uniforms.u_resolution.value.y,
        uniforms.u_boolOp.value,
        uniforms.u_smoothK.value,
        uniforms.u_orbitAngle.value
      ];
      return values.every(v => Number.isFinite(v)) && typeof uniforms.u_animating.value === 'boolean';
    }

    window.__3D_STATE__ = {
      boolOperation: BOOL_OPS[boolOpIndex],
      boolOpIndex,
      smoothK,
      orbitAngle,
      animating,
      elapsedTime: accumulatedTime,
      rayMaxSteps: 128,
      rayMaxDist: 50.0,
      raySurfaceEpsilon: 0.001,
      sphereCenter: getSphereCenter(accumulatedTime),
      boxCenter: { x: 2.0, y: 0.0, z: 0.0 },
      torusCenter: { x: -2.0, y: 0.0, z: 0.0 },
      cylinderCenter: { x: 0.0, y: 0.0, z: -2.0 },
      cameraPosition: getCameraPosition(orbitAngle),
      frameCount: 0,
      primitiveCount: 5,
      uniformsValid: uniformsAreValid()
    };

    function syncUniforms() {
      uniforms.u_time.value = accumulatedTime;
      uniforms.u_boolOp.value = boolOpIndex;
      uniforms.u_smoothK.value = smoothK;
      uniforms.u_orbitAngle.value = orbitAngle;
      uniforms.u_animating.value = animating;
    }

    function updateState() {
      const camPos = getCameraPosition(orbitAngle);
      const sphereCenter = getSphereCenter(accumulatedTime);
      Object.assign(window.__3D_STATE__, {
        boolOperation: BOOL_OPS[boolOpIndex],
        boolOpIndex,
        smoothK,
        orbitAngle,
        animating,
        elapsedTime: accumulatedTime,
        rayMaxSteps: 128,
        rayMaxDist: 50.0,
        raySurfaceEpsilon: 0.001,
        sphereCenter,
        boxCenter: { x: 2.0, y: 0.0, z: 0.0 },
        torusCenter: { x: -2.0, y: 0.0, z: 0.0 },
        cylinderCenter: { x: 0.0, y: 0.0, z: -2.0 },
        cameraPosition: camPos,
        frameCount,
        primitiveCount: 5,
        uniformsValid: uniformsAreValid()
      });
    }

    function resetState() {
      boolOpIndex = DEFAULTS.boolOpIndex;
      smoothK = DEFAULTS.smoothK;
      orbitAngle = DEFAULTS.orbitAngle;
      animating = DEFAULTS.animating;
      accumulatedTime = 0;
      lastTimestamp = performance.now() * 0.001;
      syncUniforms();
      updateState();
      updateHUD(0);
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === '1') boolOpIndex = 0;
      else if (key === '2') boolOpIndex = 1;
      else if (key === '3') boolOpIndex = 2;
      else if (key === '4') boolOpIndex = 3;
      else if (key === 'a' || key === 'A') orbitAngle -= 0.1;
      else if (key === 'd' || key === 'D') orbitAngle += 0.1;
      else if (key === 'w' || key === 'W') smoothK = Math.min(2.0, smoothK + 0.05);
      else if (key === 's' || key === 'S') smoothK = Math.max(0.05, smoothK - 0.05);
      else if (key === 'r' || key === 'R') resetState();
      else if (key === ' ') {
        e.preventDefault();
        animating = !animating;
      }

      smoothK = Math.min(2.0, Math.max(0.05, smoothK));
      syncUniforms();
      updateState();
    });

    window.addEventListener('resize', () => {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
      updateState();
    });

    let fps = 0;
    let fpsFrames = 0;
    let fpsTimeAccum = 0;

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now() * 0.001;
      const dt = Math.max(0, now - lastTimestamp);
      lastTimestamp = now;

      if (animating) {
        accumulatedTime += dt;
      }

      syncUniforms();

      renderer.render(scene, camera);

      frameCount++;

      fpsFrames++;
      fpsTimeAccum += dt;
      if (fpsTimeAccum >= 0.25) {
        fps = fpsFrames / fpsTimeAccum;
        fpsFrames = 0;
        fpsTimeAccum = 0;
      }

      updateHUD(fps);
      updateState();
    }

    syncUniforms();
    updateHUD(0);
    updateState();
    animate();
  </script>
</body>
</html>
