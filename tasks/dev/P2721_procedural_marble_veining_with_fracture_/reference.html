<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Marble Veining & Fracture System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; font-family: sans-serif; color: white; }
        canvas { display: block; }
        #ui-panel {
            position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.7);
            padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            max-width: 320px; pointer-events: auto; z-index: 10;
        }
        .info-row { margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
        .info-label { color: #aaa; }
        .info-value { color: #fff; font-weight: bold; }
        .control-group { margin-top: 12px; }
        .control-group label { display: block; font-size: 13px; color: #ccc; margin-bottom: 4px; }
        .control-group input[type=range] { width: 100%; accent-color: #4caf50; }
        .btn-reset {
            margin-top: 15px; padding: 8px 16px; background: #333; color: white;
            border: 1px solid #555; border-radius: 4px; cursor: pointer; width: 100%;
            transition: background 0.2s;
        }
        .btn-reset:hover { background: #555; }
    </style>
</head>
<body>
    <div id="ui-panel">
        <div class="info-row"><span class="info-label">Vein Preset:</span> <span id="val-preset" class="info-value">green</span></div>
        <div class="info-row"><span class="info-label">Vein Frequency:</span> <span id="val-freq" class="info-value">3.0</span></div>
        <div class="info-row"><span class="info-label">Vein Sharpness:</span> <span id="val-sharp" class="info-value">5.0</span></div>
        <div class="info-row"><span class="info-label">Fracture Progress (Left):</span> <span id="val-prog-l" class="info-value">0%</span></div>
        <div class="info-row"><span class="info-label">Fracture Progress (Right):</span> <span id="val-prog-r" class="info-value">0%</span></div>
        <div class="info-row"><span class="info-label">Fracture Plane Y:</span> <span id="val-plane-y" class="info-value">0.5</span></div>
        <div class="info-row"><span class="info-label">Models Loaded:</span> <span id="val-loaded" class="info-value">No</span></div>
        
        <div class="control-group">
            <label>Vein Frequency (1.0 - 10.0)</label>
            <input type="range" id="slider-freq" min="1.0" max="10.0" step="0.1" value="3.0">
        </div>
        <div class="control-group">
            <label>Vein Sharpness (1.0 - 20.0)</label>
            <input type="range" id="slider-sharp" min="1.0" max="20.0" step="0.5" value="5.0">
        </div>
        <button id="btn-reset" class="btn-reset">Reset All</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- State Management ---
        window.__3D_STATE__ = {
            modelsLoaded: false,
            loadError: '',
            veinPresetIndex: 0,
            veinPresetName: 'green',
            veinFrequency: 3.0,
            veinSharpness: 5.0,
            fractureProgressRight: 0.0,
            fractureProgressLeft: 0.0,
            fractureAnimating: false,
            fractureDirection: 'idle',
            fracturePlaneY: 0.5,
            leftFractureSynced: false,
            meshCountLeft: 0,
            meshCountRight: 0,
            elapsedTime: 0.0,
            cameraDistance: 0.0
        };

        // --- Presets ---
        const veinPresets = [
            { name: 'green', color: new THREE.Vector3(0.05, 0.15, 0.05) },
            { name: 'red', color: new THREE.Vector3(0.3, 0.02, 0.02) },
            { name: 'blue', color: new THREE.Vector3(0.02, 0.05, 0.25) },
            { name: 'gold', color: new THREE.Vector3(0.4, 0.3, 0.05) }
        ];

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1a2e');

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.update();

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(3, 5, 2);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- Shaders ---
        const vertexShader = `
            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            varying vec2 vUv;

            void main() {
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPos.xyz;
                vNormal = normalize(mat3(modelMatrix) * normal);
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        // 3D Simplex Noise (Ashima Arts)
        const noiseGLSL = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) { 
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }
        `;

        const fragmentShader = `
            precision highp float;

            uniform float u_time;
            uniform vec3 u_veinColor;
            uniform vec3 u_baseColor;
            uniform float u_veinFrequency;
            uniform float u_veinSharpness;
            uniform float u_fractureProgress;
            uniform float u_fracturePlaneY;
            uniform int u_noiseOctaves;

            varying vec3 vWorldPosition;
            varying vec3 vNormal;
            varying vec2 vUv;

            ${noiseGLSL}

            float fbm(vec3 p) {
                float value = 0.0;
                float amplitude = 0.5;
                float frequency = 1.0;
                for (int i = 0; i < 8; i++) {
                    if (i >= u_noiseOctaves) break;
                    value += amplitude * snoise(p * frequency + u_time * 0.1);
                    frequency *= 2.0;
                    amplitude *= 0.5;
                }
                return value;
            }

            void main() {
                vec3 pos = vWorldPosition;
                
                // Fracture plane calculation
                // At progress=0, threshold is very high (100.0) so nothing is clipped (intact).
                // At progress=1, threshold is u_fracturePlaneY, clipping everything above it.
                float threshold = 100.0 * (1.0 - u_fractureProgress) + u_fracturePlaneY * u_fractureProgress;
                
                if (pos.y > threshold) {
                    discard;
                }

                // Base marble veining
                float noiseVal = fbm(pos * 0.5);
                float pattern = sin(pos.x * u_veinFrequency + noiseVal * 4.0);
                float vein = 1.0 - pow(abs(pattern), u_veinSharpness);
                vec3 color = mix(u_baseColor, u_veinColor, vein);

                // Subsurface scattering approximation (Fresnel)
                vec3 viewDir = normalize(cameraPosition - pos);
                float fresnel = pow(1.0 - abs(dot(vNormal, viewDir)), 3.0);
                color += u_baseColor * fresnel * 0.2;

                // Cross-section near fracture plane
                float distToPlane = abs(pos.y - threshold);
                if (distToPlane < 0.05 && u_fractureProgress > 0.0) {
                    float denseNoise = fbm(pos * 2.0);
                    float densePattern = sin(pos.x * u_veinFrequency * 2.0 + denseNoise * 6.0);
                    float denseVein = 1.0 - pow(abs(densePattern), u_veinSharpness * 1.5);
                    vec3 crossColor = mix(u_baseColor * 1.2, u_veinColor * 1.5, denseVein);
                    // Blend cross section smoothly over the 0.05 distance
                    float blend = smoothstep(0.05, 0.0, distToPlane);
                    color = mix(color, crossColor, blend);
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- Material Management ---
        const leftMaterials = [];
        const rightMaterials = [];
        const allMaterials = [];

        function createMarbleMaterial() {
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    u_time: { value: 0.0 },
                    u_veinColor: { value: veinPresets[0].color.clone() },
                    u_baseColor: { value: new THREE.Vector3(0.95, 0.93, 0.88) },
                    u_veinFrequency: { value: 3.0 },
                    u_veinSharpness: { value: 5.0 },
                    u_fractureProgress: { value: 0.0 },
                    u_fracturePlaneY: { value: 0.5 },
                    u_noiseOctaves: { value: 4 }
                },
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                side: THREE.DoubleSide // Crucial for seeing inside the clipped model
            });
            allMaterials.push(mat);
            return mat;
        }

        // --- Model Loading ---
        const loader = new GLTFLoader();
        let leftModel = null;
        let rightModel = null;
        let modelsLoadedCount = 0;

        function applyMarbleMaterial(model, targetArray) {
            let count = 0;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    child.material = createMarbleMaterial();
                    targetArray.push(child.material);
                    count++;
                }
            });
            return count;
        }

        // Load Left Model (CesiumMan.glb)
        loader.load('CesiumMan.glb', (gltf) => {
            leftModel = gltf.scene;
            leftModel.position.set(-2, 0, 0);
            leftModel.scale.set(1.5, 1.5, 1.5);
            window.__3D_STATE__.meshCountLeft = applyMarbleMaterial(leftModel, leftMaterials);
            scene.add(leftModel);
            modelsLoadedCount++;
            checkAllLoaded();
        }, undefined, (error) => {
            console.error('Error loading CesiumMan.glb:', error);
            window.__3D_STATE__.loadError += 'CesiumMan.glb failed; ';
        });

        // Load Right Model (DirectionalLight.glb)
        loader.load('DirectionalLight.glb', (gltf) => {
            rightModel = gltf.scene;
            rightModel.position.set(2, 0, 0);
            rightModel.scale.set(1.0, 1.0, 1.0);
            window.__3D_STATE__.meshCountRight = applyMarbleMaterial(rightModel, rightMaterials);
            scene.add(rightModel);
            modelsLoadedCount++;
            checkAllLoaded();
        }, undefined, (error) => {
            console.error('Error loading DirectionalLight.glb:', error);
            window.__3D_STATE__.loadError += 'DirectionalLight.glb failed; ';
        });

        function checkAllLoaded() {
            if (modelsLoadedCount === 2) {
                window.__3D_STATE__.modelsLoaded = true;
            }
        }

        // --- Fracture Animation State ---
        let rightFractureState = 'closed'; // 'closed', 'opening', 'open', 'closing'
        let rightAnimStartTime = 0;
        let rightAnimStartValue = 0;
        let leftFractureProgressVal = 0.0;
        let rightFractureProgressVal = 0.0;

        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        // --- UI & Interaction ---
        const sliderFreq = document.getElementById('slider-freq');
        const sliderSharp = document.getElementById('slider-sharp');
        const btnReset = document.getElementById('btn-reset');

        sliderFreq.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            window.__3D_STATE__.veinFrequency = val;
            allMaterials.forEach(m => m.uniforms.u_veinFrequency.value = val);
        });

        sliderSharp.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            window.__3D_STATE__.veinSharpness = val;
            allMaterials.forEach(m => m.uniforms.u_veinSharpness.value = val);
        });

        btnReset.addEventListener('click', resetAll);

        function resetAll() {
            // Reset uniforms
            window.__3D_STATE__.veinPresetIndex = 0;
            window.__3D_STATE__.veinPresetName = 'green';
            window.__3D_STATE__.veinFrequency = 3.0;
            window.__3D_STATE__.veinSharpness = 5.0;
            window.__3D_STATE__.fracturePlaneY = 0.5;
            window.__3D_STATE__.leftFractureSynced = false;
            
            leftFractureProgressVal = 0.0;
            rightFractureProgressVal = 0.0;
            rightFractureState = 'closed';
            
            allMaterials.forEach(m => {
                m.uniforms.u_veinColor.value.copy(veinPresets[0].color);
                m.uniforms.u_veinFrequency.value = 3.0;
                m.uniforms.u_veinSharpness.value = 5.0;
                m.uniforms.u_fracturePlaneY.value = 0.5;
            });
            leftMaterials.forEach(m => m.uniforms.u_fractureProgress.value = 0.0);
            rightMaterials.forEach(m => m.uniforms.u_fractureProgress.value = 0.0);

            // Reset UI elements
            sliderFreq.value = 3.0;
            sliderSharp.value = 5.0;
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'v' || e.key === 'V') {
                let idx = (window.__3D_STATE__.veinPresetIndex + 1) % veinPresets.length;
                window.__3D_STATE__.veinPresetIndex = idx;
                window.__3D_STATE__.veinPresetName = veinPresets[idx].name;
                allMaterials.forEach(m => m.uniforms.u_veinColor.value.copy(veinPresets[idx].color));
            } 
            else if (e.key === 'f' || e.key === 'F') {
                if (rightFractureState === 'closed' || rightFractureState === 'closing') {
                    rightFractureState = 'opening';
                    rightAnimStartTime = clock.getElapsedTime();
                    rightAnimStartValue = rightFractureProgressVal;
                } else if (rightFractureState === 'open' || rightFractureState === 'opening') {
                    rightFractureState = 'closing';
                    rightAnimStartTime = clock.getElapsedTime();
                    rightAnimStartValue = rightFractureProgressVal;
                }
            } 
            else if (e.key === 'g' || e.key === 'G') {
                if (window.__3D_STATE__.leftFractureSynced) {
                    // Reset left
                    leftFractureProgressVal = 0.0;
                    window.__3D_STATE__.leftFractureSynced = false;
                    leftMaterials.forEach(m => m.uniforms.u_fractureProgress.value = 0.0);
                } else {
                    // Sync left to right
                    leftFractureProgressVal = rightFractureProgressVal;
                    window.__3D_STATE__.leftFractureSynced = true;
                    leftMaterials.forEach(m => m.uniforms.u_fractureProgress.value = leftFractureProgressVal);
                }
            } 
            else if (e.key === 'ArrowUp') {
                let y = window.__3D_STATE__.fracturePlaneY + 0.1;
                if (y > 2.0) y = 2.0;
                window.__3D_STATE__.fracturePlaneY = y;
                allMaterials.forEach(m => m.uniforms.u_fracturePlaneY.value = y);
            } 
            else if (e.key === 'ArrowDown') {
                let y = window.__3D_STATE__.fracturePlaneY - 0.1;
                if (y < 0.0) y = 0.0;
                window.__3D_STATE__.fracturePlaneY = y;
                allMaterials.forEach(m => m.uniforms.u_fracturePlaneY.value = y);
            }
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function updateUI() {
            document.getElementById('val-preset').innerText = window.__3D_STATE__.veinPresetName;
            document.getElementById('val-freq').innerText = window.__3D_STATE__.veinFrequency.toFixed(1);
            document.getElementById('val-sharp').innerText = window.__3D_STATE__.veinSharpness.toFixed(1);
            document.getElementById('val-prog-l').innerText = (window.__3D_STATE__.fractureProgressLeft * 100).toFixed(0) + '%';
            document.getElementById('val-prog-r').innerText = (window.__3D_STATE__.fractureProgressRight * 100).toFixed(0) + '%';
            document.getElementById('val-plane-y').innerText = window.__3D_STATE__.fracturePlaneY.toFixed(1);
            document.getElementById('val-loaded').innerText = window.__3D_STATE__.modelsLoaded ? 'Yes' : 'No';
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();
            window.__3D_STATE__.elapsedTime = elapsed;

            // Update time uniform
            allMaterials.forEach(m => m.uniforms.u_time.value = elapsed);

            // Handle Right Model Fracture Animation
            if (rightFractureState === 'opening') {
                const animElapsed = elapsed - rightAnimStartTime;
                const t = Math.min(animElapsed / 2.0, 1.0);
                rightFractureProgressVal = rightAnimStartValue + (1.0 - rightAnimStartValue) * easeInOut(t);
                if (t >= 1.0) {
                    rightFractureState = 'open';
                    rightFractureProgressVal = 1.0;
                }
            } else if (rightFractureState === 'closing') {
                const animElapsed = elapsed - rightAnimStartTime;
                const t = Math.min(animElapsed / 2.0, 1.0);
                rightFractureProgressVal = rightAnimStartValue + (0.0 - rightAnimStartValue) * easeInOut(t);
                if (t >= 1.0) {
                    rightFractureState = 'closed';
                    rightFractureProgressVal = 0.0;
                }
            }

            rightMaterials.forEach(m => m.uniforms.u_fractureProgress.value = rightFractureProgressVal);
            window.__3D_STATE__.fractureProgressRight = rightFractureProgressVal;

            // Handle Left Model Sync
            if (window.__3D_STATE__.leftFractureSynced) {
                leftFractureProgressVal = rightFractureProgressVal;
                leftMaterials.forEach(m => m.uniforms.u_fractureProgress.value = leftFractureProgressVal);
            }
            window.__3D_STATE__.fractureProgressLeft = leftFractureProgressVal;

            // Update State Direction and Animating flags
            window.__3D_STATE__.fractureAnimating = (rightFractureState === 'opening' || rightFractureState === 'closing');
            if (rightFractureState === 'opening') window.__3D_STATE__.fractureDirection = 'opening';
            else if (rightFractureState === 'closing') window.__3D_STATE__.fractureDirection = 'closing';
            else window.__3D_STATE__.fractureDirection = 'idle';

            // Update Camera Distance
            window.__3D_STATE__.cameraDistance = camera.position.distanceTo(new THREE.Vector3(0,0,0));

            // Update UI
            updateUI();

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
