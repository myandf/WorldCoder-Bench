<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Per-Object Motion Blur via Velocity Buffer</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.75);
      color: white;
      padding: 12px;
      border-radius: 8px;
      min-width: 240px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      font-size: 14px;
      line-height: 1.35;
    }
    #hud .row {
      margin-bottom: 10px;
    }
    #hud label {
      display: block;
      margin-bottom: 4px;
    }
    #hud input[type="range"],
    #hud select,
    #hud button {
      width: 100%;
      box-sizing: border-box;
    }
    #hud button {
      margin-top: 4px;
      padding: 6px 8px;
      background: #2c2c2c;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
    }
    #hud button:hover {
      background: #3a3a3a;
    }
    #hud .value {
      color: #9fd3ff;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="row">
      <label for="blurStrength">Blur Strength <span id="blurStrengthValue" class="value">1.0</span></label>
      <input id="blurStrength" type="range" min="0" max="3" step="0.1" value="1.0" />
    </div>

    <div class="row">
      <label for="sampleCount">Sample Count</label>
      <select id="sampleCount">
        <option value="4">4</option>
        <option value="8" selected>8</option>
        <option value="16">16</option>
        <option value="32">32</option>
      </select>
    </div>

    <div class="row">
      <button id="toggleBlur">Disable Blur</button>
    </div>

    <div class="row">
      <button id="pauseBtn">Pause</button>
    </div>

    <div class="row">
      <label for="speedMultiplier">Speed Multiplier <span id="speedMultiplierValue" class="value">1.0</span></label>
      <input id="speedMultiplier" type="range" min="0.1" max="5.0" step="0.1" value="1.0" />
    </div>

    <div class="row">
      <div id="fpsDisplay">FPS: 0.0</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 10);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.y = 0;
    scene.add(ground);

    const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 24);

    const sphereDefs = [
      { color: 0xff3333, radius: 4, speed: 1.0, angleOffset: Math.PI, start: new THREE.Vector3(-4, 1, 0) },
      { color: 0x33ff66, radius: 3, speed: 1.8, angleOffset: 0.0, start: new THREE.Vector3(0, 1, 0) },
      { color: 0x3388ff, radius: 5, speed: 0.6, angleOffset: 0.0, start: new THREE.Vector3(4, 1, 0) }
    ];

    const spheres = [];
    const movingObjects = [];

    for (const def of sphereDefs) {
      const mesh = new THREE.Mesh(
        sphereGeometry,
        new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.35, metalness: 0.1 })
      );
      mesh.position.copy(def.start);
      scene.add(mesh);

      const velocityMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uPrevMVP: { value: new THREE.Matrix4() },
          uCurrMVP: { value: new THREE.Matrix4() }
        },
        vertexShader: `
          uniform mat4 uPrevMVP;
          uniform mat4 uCurrMVP;
          varying vec2 vVelocity;
          void main() {
            vec4 currClip = uCurrMVP * vec4(position, 1.0);
            vec4 prevClip = uPrevMVP * vec4(position, 1.0);

            vec2 currNDC = currClip.xy / max(currClip.w, 0.00001);
            vec2 prevNDC = prevClip.xy / max(prevClip.w, 0.00001);

            vVelocity = currNDC - prevNDC;
            gl_Position = currClip;
          }
        `,
        fragmentShader: `
          varying vec2 vVelocity;
          void main() {
            vec2 enc = vVelocity * 0.5 + 0.5;
            gl_FragColor = vec4(enc, 0.5, 1.0);
          }
        `,
        depthTest: true,
        depthWrite: true
      });

      spheres.push({
        mesh,
        radius: def.radius,
        speed: def.speed,
        angleOffset: def.angleOffset,
        prevMVP: new THREE.Matrix4(),
        currMVP: new THREE.Matrix4(),
        velocityMaterial,
        screenVelocity: new THREE.Vector2()
      });
      movingObjects.push(mesh);
    }

    const velocityScene = new THREE.Scene();
    const velocityObjects = [];

    for (const s of spheres) {
      const vMesh = new THREE.Mesh(s.mesh.geometry, s.velocityMaterial);
      vMesh.position.copy(s.mesh.position);
      vMesh.quaternion.copy(s.mesh.quaternion);
      vMesh.scale.copy(s.mesh.scale);
      velocityScene.add(vMesh);
      velocityObjects.push(vMesh);
      s.velocityProxy = vMesh;
    }

    const rtOptions = {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.UnsignedByteType,
      depthBuffer: true,
      stencilBuffer: false
    };

    const sceneRenderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, rtOptions);
    const velocityRenderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, rtOptions);

    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const blurMaterial = new THREE.ShaderMaterial({
      uniforms: {
        tColor: { value: sceneRenderTarget.texture },
        tVelocity: { value: velocityRenderTarget.texture },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uBlurStrength: { value: 1.0 },
        uSampleCount: { value: 8 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tColor;
        uniform sampler2D tVelocity;
        uniform vec2 uResolution;
        uniform float uBlurStrength;
        uniform int uSampleCount;
        varying vec2 vUv;

        void main() {
          vec4 velTex = texture2D(tVelocity, vUv);
          vec2 velocity = (velTex.xy * 2.0 - 1.0) * uBlurStrength;

          float speed = length(velocity);
          if (speed < 0.0005) {
            gl_FragColor = texture2D(tColor, vUv);
            return;
          }

          vec4 accum = vec4(0.0);
          float total = 0.0;

          const int MAX_SAMPLES = 32;
          for (int i = 0; i < MAX_SAMPLES; i++) {
            if (i >= uSampleCount) break;
            float t = (float(i) / float(max(uSampleCount - 1, 1))) - 0.5;
            vec2 offset = velocity * t;
            accum += texture2D(tColor, vUv + offset);
            total += 1.0;
          }

          gl_FragColor = accum / max(total, 1.0);
        }
      `
    });

    const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blurMaterial);
    postScene.add(postQuad);

    const blurStrengthInput = document.getElementById('blurStrength');
    const sampleCountSelect = document.getElementById('sampleCount');
    const toggleBlurBtn = document.getElementById('toggleBlur');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedMultiplierInput = document.getElementById('speedMultiplier');
    const fpsDisplay = document.getElementById('fpsDisplay');
    const blurStrengthValue = document.getElementById('blurStrengthValue');
    const speedMultiplierValue = document.getElementById('speedMultiplierValue');

    let blurEnabled = true;
    let paused = false;
    let elapsedTime = 0;
    let frameCount = 0;
    let fps = 0;

    window.__3D_STATE__ = {
      blurEnabled: true,
      blurStrength: 1.0,
      sampleCount: 8,
      paused: false,
      speedMultiplier: 1.0,
      fps: 0,
      spherePositions: spheres.map(() => ({ x: 0, y: 1, z: 0 })),
      sphereVelocitiesScreenSpace: spheres.map(() => ({ x: 0, y: 0 })),
      elapsedTime: 0,
      velocityBufferActive: false,
      frameCount: 0
    };

    blurStrengthInput.addEventListener('input', () => {
      const v = parseFloat(blurStrengthInput.value);
      blurMaterial.uniforms.uBlurStrength.value = v;
      blurStrengthValue.textContent = v.toFixed(1);
    });

    sampleCountSelect.addEventListener('change', () => {
      blurMaterial.uniforms.uSampleCount.value = parseInt(sampleCountSelect.value, 10);
    });

    toggleBlurBtn.addEventListener('click', () => {
      blurEnabled = !blurEnabled;
      toggleBlurBtn.textContent = blurEnabled ? 'Disable Blur' : 'Enable Blur';
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    });

    speedMultiplierInput.addEventListener('input', () => {
      speedMultiplierValue.textContent = parseFloat(speedMultiplierInput.value).toFixed(1);
    });

    blurStrengthValue.textContent = parseFloat(blurStrengthInput.value).toFixed(1);
    speedMultiplierValue.textContent = parseFloat(speedMultiplierInput.value).toFixed(1);

    const tempProjView = new THREE.Matrix4();
    const tempVec4 = new THREE.Vector4();

    function computeMVP(object, cam) {
      object.updateMatrixWorld();
      cam.updateMatrixWorld();
      tempProjView.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
      return new THREE.Matrix4().multiplyMatrices(tempProjView, object.matrixWorld);
    }

    function updateSphereTransforms(timeSeconds) {
      const speedMul = parseFloat(speedMultiplierInput.value);

      for (let i = 0; i < spheres.length; i++) {
        const s = spheres[i];
        const angle = s.angleOffset + timeSeconds * s.speed * speedMul;
        const x = Math.cos(angle) * s.radius;
        const z = Math.sin(angle) * s.radius;
        s.mesh.position.set(x, 1, z);

        s.velocityProxy.position.copy(s.mesh.position);
        s.velocityProxy.quaternion.copy(s.mesh.quaternion);
        s.velocityProxy.scale.copy(s.mesh.scale);
      }
    }

    function updateVelocityData() {
      camera.updateMatrixWorld();
      camera.updateProjectionMatrix();

      for (const s of spheres) {
        s.currMVP.copy(computeMVP(s.mesh, camera));
        s.velocityMaterial.uniforms.uPrevMVP.value.copy(s.prevMVP);
        s.velocityMaterial.uniforms.uCurrMVP.value.copy(s.currMVP);

        tempVec4.set(0, 0, 0, 1).applyMatrix4(s.currMVP);
        const currNDC = new THREE.Vector2(tempVec4.x / tempVec4.w, tempVec4.y / tempVec4.w);

        tempVec4.set(0, 0, 0, 1).applyMatrix4(s.prevMVP);
        const prevNDC = new THREE.Vector2(tempVec4.x / tempVec4.w, tempVec4.y / tempVec4.w);

        s.screenVelocity.copy(currNDC.sub(prevNDC));
      }
    }

    let lastTime = performance.now();
    let fpsAccumTime = 0;
    let fpsFrames = 0;

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      sceneRenderTarget.setSize(w, h);
      velocityRenderTarget.setSize(w, h);
      blurMaterial.uniforms.uResolution.value.set(w, h);
    }
    window.addEventListener('resize', resize);

    function render(now) {
      requestAnimationFrame(render);

      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      controls.update();

      if (!paused) {
        elapsedTime += dt;
      }

      updateSphereTransforms(elapsedTime);
      updateVelocityData();

      fpsAccumTime += dt;
      fpsFrames++;
      if (fpsAccumTime >= 0.25) {
        fps = fpsFrames / fpsAccumTime;
        fpsAccumTime = 0;
        fpsFrames = 0;
        fpsDisplay.textContent = `FPS: ${fps.toFixed(1)}`;
      }

      if (blurEnabled) {
        window.__3D_STATE__.velocityBufferActive = true;

        renderer.setRenderTarget(sceneRenderTarget);
        renderer.clear();
        renderer.render(scene, camera);

        renderer.setRenderTarget(velocityRenderTarget);
        renderer.setClearColor(0x808080, 1);
        renderer.clear();
        renderer.render(velocityScene, camera);

        renderer.setRenderTarget(null);
        renderer.render(postScene, postCamera);

        renderer.setClearColor(scene.background, 1);
      } else {
        window.__3D_STATE__.velocityBufferActive = false;
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
      }

      for (const s of spheres) {
        s.prevMVP.copy(s.currMVP);
      }

      frameCount++;

      window.__3D_STATE__.blurEnabled = blurEnabled;
      window.__3D_STATE__.blurStrength = parseFloat(blurStrengthInput.value);
      window.__3D_STATE__.sampleCount = parseInt(sampleCountSelect.value, 10);
      window.__3D_STATE__.paused = paused;
      window.__3D_STATE__.speedMultiplier = parseFloat(speedMultiplierInput.value);
      window.__3D_STATE__.fps = fps;
      window.__3D_STATE__.spherePositions = spheres.map(s => ({
        x: s.mesh.position.x,
        y: s.mesh.position.y,
        z: s.mesh.position.z
      }));
      window.__3D_STATE__.sphereVelocitiesScreenSpace = spheres.map(s => ({
        x: s.screenVelocity.x,
        y: s.screenVelocity.y
      }));
      window.__3D_STATE__.elapsedTime = elapsedTime;
      window.__3D_STATE__.frameCount = frameCount;
    }

    updateSphereTransforms(0);
    updateVelocityData();
    for (const s of spheres) {
      s.prevMVP.copy(s.currMVP);
    }

    blurMaterial.uniforms.uBlurStrength.value = parseFloat(blurStrengthInput.value);
    blurMaterial.uniforms.uSampleCount.value = parseInt(sampleCountSelect.value, 10);

    resize();
    requestAnimationFrame(render);
  </script>
</body>
</html>
