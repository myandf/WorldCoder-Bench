<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecular Dynamics Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
canvas { display: block; }

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 280px;
  background: rgba(10, 10, 46, 0.85);
  border: 1px solid rgba(100, 100, 255, 0.3);
  border-radius: 10px;
  padding: 18px;
  color: #e0e0ff;
  font-size: 13px;
  backdrop-filter: blur(10px);
  z-index: 100;
  user-select: none;
}

#hud h2 {
  text-align: center;
  margin-bottom: 12px;
  font-size: 16px;
  color: #aabbff;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-bottom: 1px solid rgba(100, 100, 255, 0.2);
  padding-bottom: 8px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.stat-label { color: #8899cc; }
.stat-value { color: #ffffff; font-weight: bold; }

.controls {
  margin-top: 12px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.controls button {
  flex: 1;
  min-width: 75px;
  padding: 8px 4px;
  border: 1px solid rgba(100, 100, 255, 0.4);
  border-radius: 6px;
  background: rgba(40, 40, 100, 0.6);
  color: #ccccff;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  transition: all 0.2s;
}

.controls button:hover {
  background: rgba(60, 60, 150, 0.8);
  border-color: rgba(150, 150, 255, 0.6);
}

.slider-container {
  margin-top: 12px;
}

.slider-container label {
  display: block;
  color: #8899cc;
  margin-bottom: 4px;
  font-size: 12px;
}

#temp-slider {
  width: 100%;
  -webkit-appearance: none;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(to right, #4444ff, #ff4444);
  outline: none;
}

#temp-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ffffff;
  cursor: pointer;
  border: 2px solid #6666ff;
}
</style>
</head>
<body>

<div id="hud">
  <h2>Molecular Dynamics</h2>
  <div class="stat-row"><span class="stat-label">Mode:</span><span class="stat-value" id="s-mode">paused</span></div>
  <div class="stat-row"><span class="stat-label">Temperature:</span><span class="stat-value" id="s-temp">300 K</span></div>
  <div class="stat-row"><span class="stat-label">Score:</span><span class="stat-value" id="s-score">0</span></div>
  <div class="stat-row"><span class="stat-label">Interactions:</span><span class="stat-value" id="s-inter">0</span></div>
  <div class="stat-row"><span class="stat-label">Frozen:</span><span class="stat-value" id="s-frozen">0</span></div>
  <div class="stat-row"><span class="stat-label">Active:</span><span class="stat-value" id="s-active">50</span></div>
  <div class="controls">
    <button id="btn-toggle">Start</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-excite">Excite</button>
  </div>
  <div class="slider-container">
    <label>Temperature: <span id="slider-val">300</span> K</label>
    <input type="range" id="temp-slider" min="50" max="1000" step="50" value="300">
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --- State ---
const state = {
  mode: 'paused',
  temperature: 300,
  score: 0,
  interactions: 0,
  frozenCount: 0,
  activeParticles: 50,
  particleCount: 50,
  modelLoaded: false,
  ringCount: 5,
  frameCount: 0,
  cameraDistance: 0
};
window.__3D_STATE__ = state;

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a2e);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// --- Lights ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// --- Load Helmet Model ---
const loader = new GLTFLoader();
loader.load(
  './ScatteringSkull.glb',
  (gltf) => {
    const model = gltf.scene;
    model.position.set(0, 0, 0);
    model.scale.set(1.5, 1.5, 1.5);
    scene.add(model);
    state.modelLoaded = true;
  },
  undefined,
  (error) => {
    console.warn('Model load failed, creating placeholder:', error);
    const geo = new THREE.IcosahedronGeometry(1.2, 2);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x667788,
      metalness: 0.7,
      roughness: 0.3,
      wireframe: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.scale.set(1.5, 1.5, 1.5);
    scene.add(mesh);
    state.modelLoaded = true;
  }
);

// --- Ring Configuration ---
const ringConfigs = [
  { radius: 2.5, color: 0xff4444, speed: 0.02 },
  { radius: 3.5, color: 0x44ff44, speed: 0.015 },
  { radius: 4.5, color: 0x4444ff, speed: 0.012 },
  { radius: 5.5, color: 0xffff44, speed: 0.009 },
  { radius: 6.5, color: 0xff44ff, speed: 0.006 }
];

// --- Create Particles ---
const particles = [];
const particleMeshes = [];
const raycasterTargets = [];

for (let r = 0; r < 5; r++) {
  const cfg = ringConfigs[r];
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2;
    const geo = new THREE.SphereGeometry(0.15, 16, 16);
    const mat = new THREE.MeshStandardMaterial({
      color: cfg.color,
      emissive: cfg.color,
      emissiveIntensity: 0.3,
      metalness: 0.4,
      roughness: 0.3
    });
    const mesh = new THREE.Mesh(geo, mat);

    const x = Math.cos(angle) * cfg.radius;
    const z = Math.sin(angle) * cfg.radius;
    mesh.position.set(x, 0, z);
    scene.add(mesh);

    const particleData = {
      mesh: mesh,
      ring: r,
      index: i,
      angle: angle,
      radius: cfg.radius,
      baseSpeed: cfg.speed,
      energy: 100,
      frozen: false,
      originalColor: cfg.color,
      baseY: 0
    };

    particles.push(particleData);
    particleMeshes.push(mesh);
    raycasterTargets.push(mesh);
  }
}

// --- Add orbital ring lines ---
for (let r = 0; r < 5; r++) {
  const cfg = ringConfigs[r];
  const ringGeo = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    pts.push(Math.cos(a) * cfg.radius, 0, Math.sin(a) * cfg.radius);
  }
  ringGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const ringMat = new THREE.LineBasicMaterial({ color: cfg.color, transparent: true, opacity: 0.15 });
  const ringLine = new THREE.Line(ringGeo, ringMat);
  scene.add(ringLine);
}

// --- Raycaster for clicking ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(raycasterTargets);

  if (intersects.length > 0) {
    const hitMesh = intersects[0].object;
    const p = particles.find(pp => pp.mesh === hitMesh);
    if (p && !p.frozen) {
      p.energy = Math.max(0, p.energy - 10);
      state.score += 5;
      state.interactions += 1;

      if (p.energy <= 0) {
        p.frozen = true;
        p.mesh.material.color.set(0xffffff);
        p.mesh.material.emissive.set(0xffffff);
        p.mesh.material.emissiveIntensity = 0.5;
        state.frozenCount++;
        state.activeParticles = state.particleCount - state.frozenCount;
      } else {
        // Flash effect
        p.mesh.material.emissiveIntensity = 1.0;
        setTimeout(() => {
          if (!p.frozen) p.mesh.material.emissiveIntensity = 0.3;
        }, 150);
      }
    }
  }
});

// --- Keyboard Controls ---
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    state.temperature = Math.min(1000, state.temperature + 50);
    updateTemperatureEffects();
  } else if (e.key === 'ArrowDown') {
    state.temperature = Math.max(50, state.temperature - 50);
    updateTemperatureEffects();
  }
});

function updateTemperatureEffects() {
  document.getElementById('temp-slider').value = state.temperature;
  document.getElementById('slider-val').textContent = state.temperature;

  if (state.temperature > 700 && state.mode === 'running') {
    state.mode = 'excited';
  } else if (state.temperature <= 700 && state.mode === 'excited') {
    state.mode = 'running';
  }
}

// --- Button Handlers ---
document.getElementById('btn-toggle').addEventListener('click', () => {
  if (state.mode === 'paused') {
    state.mode = state.temperature > 700 ? 'excited' : 'running';
  } else {
    state.mode = 'paused';
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  state.mode = 'paused';
  state.temperature = 300;
  state.score = 0;
  state.interactions = 0;
  state.frozenCount = 0;
  state.activeParticles = 50;

  document.getElementById('temp-slider').value = 300;
  document.getElementById('slider-val').textContent = '300';

  particles.forEach((p, idx) => {
    p.energy = 100;
    p.frozen = false;
    p.angle = (p.index / 10) * Math.PI * 2;
    p.mesh.material.color.set(p.originalColor);
    p.mesh.material.emissive.set(p.originalColor);
    p.mesh.material.emissiveIntensity = 0.3;
    const x = Math.cos(p.angle) * p.radius;
    const z = Math.sin(p.angle) * p.radius;
    p.mesh.position.set(x, 0, z);
  });
});

document.getElementById('btn-excite').addEventListener('click', () => {
  if (state.mode === 'running') {
    state.mode = 'excited';
  } else if (state.mode === 'excited') {
    state.mode = state.temperature > 700 ? 'excited' : 'running';
  }
});

document.getElementById('temp-slider').addEventListener('input', (e) => {
  state.temperature = parseInt(e.target.value);
  document.getElementById('slider-val').textContent = state.temperature;
  updateTemperatureEffects();
});

// --- HUD Update ---
function updateHUD() {
  document.getElementById('s-mode').textContent = state.mode;
  document.getElementById('s-temp').textContent = state.temperature + ' K';
  document.getElementById('s-score').textContent = state.score;
  document.getElementById('s-inter').textContent = state.interactions;
  document.getElementById('s-frozen').textContent = state.frozenCount;
  document.getElementById('s-active').textContent = state.activeParticles;

  const btn = document.getElementById('btn-toggle');
  btn.textContent = state.mode === 'paused' ? 'Start' : 'Pause';

  // Color mode indicator
  const modeEl = document.getElementById('s-mode');
  if (state.mode === 'paused') modeEl.style.color = '#aaaaaa';
  else if (state.mode === 'running') modeEl.style.color = '#44ff44';
  else modeEl.style.color = '#ff4444';
}

// --- Animation Loop ---
function animate() {
  requestAnimationFrame(animate);
  state.frameCount++;

  controls.update();

  // Camera distance
  state.cameraDistance = camera.position.length();

  const isMoving = state.mode === 'running' || state.mode === 'excited';
  const speedMultiplier = (state.temperature / 300);
  const excitedMultiplier = state.mode === 'excited' ? 3.0 : 1.0;

  if (isMoving) {
    particles.forEach((p) => {
      if (p.frozen) return;

      const totalSpeed = p.baseSpeed * speedMultiplier * excitedMultiplier;
      p.angle += totalSpeed;

      const x = Math.cos(p.angle) * p.radius;
      const z = Math.sin(p.angle) * p.radius;
      p.mesh.position.x = x;
      p.mesh.position.z = z;

      if (state.mode === 'excited') {
        p.mesh.position.y = Math.sin(p.angle * 2 + p.index) * 0.5;
      } else {
        p.mesh.position.y = 0;
      }
    });
  }

  updateHUD();
  renderer.render(scene, camera);
}

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
