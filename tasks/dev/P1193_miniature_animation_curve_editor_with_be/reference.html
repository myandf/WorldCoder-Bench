<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curve Editor Diorama</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
canvas { display: block; }
#hud {
  position: absolute;
  top: 16px;
  left: 16px;
  color: #aaccdd;
  font-size: 13px;
  line-height: 1.6;
  background: rgba(10, 10, 30, 0.75);
  padding: 14px 18px;
  border-radius: 8px;
  border: 1px solid #2a3a5a;
  pointer-events: none;
  user-select: none;
}
#hud .title {
  font-size: 16px;
  font-weight: 600;
  color: #00ffcc;
  margin-bottom: 6px;
}
#hud .label { color: #667788; }
#hud .value { color: #ccddee; }
#resetBtn {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 28px;
  background: rgba(20, 20, 50, 0.85);
  color: #00ffcc;
  border: 1px solid #00ffcc44;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
#resetBtn:hover {
  background: rgba(0, 255, 204, 0.15);
  border-color: #00ffcc;
}
</style>
</head>
<body>

<div id="hud">
  <div class="title">Curve Editor Diorama</div>
  <div><span class="label">Playing: </span><span class="value" id="hudPlaying">true</span></div>
  <div><span class="label">Selected: </span><span class="value" id="hudSelected">None</span></div>
  <div><span class="label">P1: </span><span class="value" id="hudP1">(-1.50, 1.50)</span></div>
  <div><span class="label">P2: </span><span class="value" id="hudP2">(1.50, -1.00)</span></div>
  <div><span class="label">Preview t: </span><span class="value" id="hudT">0.00</span></div>
</div>

<button id="resetBtn">Reset Handles</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CURVE_SEGMENTS = 64;
const P1_DEFAULT = { x: -1.5, z: 1.5 };
const P2_DEFAULT = { x: 1.5, z: -1.0 };

window.__3D_STATE__ = {
  initialized: false,
  playing: true,
  selectedHandle: null,
  p1: { x: P1_DEFAULT.x, z: P1_DEFAULT.z },
  p2: { x: P2_DEFAULT.x, z: P2_DEFAULT.z },
  p1Default: { x: P1_DEFAULT.x, z: P1_DEFAULT.z },
  p2Default: { x: P2_DEFAULT.x, z: P2_DEFAULT.z },
  previewT: 0,
  curveSegments: CURVE_SEGMENTS,
  handleDragging: false,
  previewPosition: { x: 0, y: 0, z: 0 },
  curveLength: 0,
  resetCount: 0
};

const state = window.__3D_STATE__;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// Camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 5, 12);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1, 0);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// Grid
const grid = new THREE.GridHelper(20, 20, 0x2a2a4a, 0x2a2a4a);
scene.add(grid);

// Platform
const platformGeo = new THREE.BoxGeometry(10, 0.3, 6, 4, 1, 4);
const platformMat = new THREE.MeshStandardMaterial({ color: 0x222244, roughness: 0.4, metalness: 0.2 });
const platform = new THREE.Mesh(platformGeo, platformMat);
platform.position.set(0, 0, 0);
scene.add(platform);

// Panel group - everything panel-local lives here
const panelGroup = new THREE.Group();
panelGroup.position.set(0, 1, 0);
scene.add(panelGroup);

// Panel background
const panelGeo = new THREE.BoxGeometry(8, 0.1, 4);
const panelMat = new THREE.MeshStandardMaterial({
  color: 0x111122,
  transparent: true,
  opacity: 0.7,
  roughness: 0.6
});
const panel = new THREE.Mesh(panelGeo, panelMat);
panel.position.set(0, 0, 0);
panelGroup.add(panel);

// Panel grid lines
function createPanelGrid() {
  const points = [];
  const gridColor = new THREE.Color(0x1a3a4a);
  // 8 vertical lines spanning X from -3.5 to 3.5
  for (let i = 0; i < 8; i++) {
    const x = -3.5 + i * (7 / 7);
    points.push(new THREE.Vector3(x, 0.06, -1.8));
    points.push(new THREE.Vector3(x, 0.06, 1.8));
  }
  // 4 horizontal lines spanning Z from -1.8 to 1.8
  for (let i = 0; i < 4; i++) {
    const z = -1.8 + i * (3.6 / 3);
    points.push(new THREE.Vector3(-3.5, 0.06, z));
    points.push(new THREE.Vector3(3.5, 0.06, z));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: gridColor });
  return new THREE.LineSegments(geo, mat);
}
panelGroup.add(createPanelGrid());

// Control points
const p0Pos = new THREE.Vector3(-3.5, 0.1, -1.5);
const p1Pos = new THREE.Vector3(P1_DEFAULT.x, 0.1, P1_DEFAULT.z);
const p2Pos = new THREE.Vector3(P2_DEFAULT.x, 0.1, P2_DEFAULT.z);
const p3Pos = new THREE.Vector3(3.5, 0.1, 1.5);

const sphereGeo = new THREE.SphereGeometry(0.15, 16, 16);
const anchorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.3 });
const handleMat = new THREE.MeshStandardMaterial({ color: 0xff8844, emissive: 0xff8844, emissiveIntensity: 0.3 });
const handleHighlightMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.5 });

const p0Sphere = new THREE.Mesh(sphereGeo, anchorMat);
p0Sphere.position.copy(p0Pos);
panelGroup.add(p0Sphere);

const p1Sphere = new THREE.Mesh(sphereGeo, handleMat.clone());
p1Sphere.position.copy(p1Pos);
p1Sphere.userData.handleId = 'P1';
panelGroup.add(p1Sphere);

const p2Sphere = new THREE.Mesh(sphereGeo, handleMat.clone());
p2Sphere.position.copy(p2Pos);
p2Sphere.userData.handleId = 'P2';
panelGroup.add(p2Sphere);

const p3Sphere = new THREE.Mesh(sphereGeo, anchorMat);
p3Sphere.position.copy(p3Pos);
panelGroup.add(p3Sphere);

// Tangent lines
const tangentMat = new THREE.LineBasicMaterial({ color: 0xff8844 });
let tangent1Geo = new THREE.BufferGeometry().setFromPoints([p0Pos, p1Pos]);
const tangent1Line = new THREE.Line(tangent1Geo, tangentMat);
panelGroup.add(tangent1Line);

let tangent2Geo = new THREE.BufferGeometry().setFromPoints([p2Pos, p3Pos]);
const tangent2Line = new THREE.Line(tangent2Geo, tangentMat);
panelGroup.add(tangent2Line);

// Bezier curve
let currentCurve = null;
let curveMesh = null;

function buildCurve() {
  currentCurve = new THREE.CubicBezierCurve3(
    p0Pos.clone(), p1Pos.clone(), p2Pos.clone(), p3Pos.clone()
  );

  const curvePoints = currentCurve.getPoints(CURVE_SEGMENTS);
  state.curveLength = currentCurve.getLength();

  if (curveMesh) {
    panelGroup.remove(curveMesh);
    curveMesh.geometry.dispose();
    curveMesh.material.dispose();
  }

  const tubeGeo = new THREE.TubeGeometry(currentCurve, CURVE_SEGMENTS, 0.04, 8, false);
  const tubeMat = new THREE.MeshStandardMaterial({
    color: 0x00ffcc,
    emissive: 0x00ffcc,
    emissiveIntensity: 0.5,
    roughness: 0.3
  });
  curveMesh = new THREE.Mesh(tubeGeo, tubeMat);
  panelGroup.add(curveMesh);
}

function updateTangentLines() {
  tangent1Line.geometry.dispose();
  tangent1Line.geometry = new THREE.BufferGeometry().setFromPoints([p0Pos, p1Pos]);
  tangent2Line.geometry.dispose();
  tangent2Line.geometry = new THREE.BufferGeometry().setFromPoints([p2Pos, p3Pos]);
}

function updateCurve() {
  buildCurve();
  updateTangentLines();
  state.p1.x = p1Pos.x;
  state.p1.z = p1Pos.z;
  state.p2.x = p2Pos.x;
  state.p2.z = p2Pos.z;
}

buildCurve();

// Preview sphere
const previewGeo = new THREE.SphereGeometry(0.25, 20, 20);
const previewMat = new THREE.MeshStandardMaterial({
  color: 0x00ff88,
  emissive: 0x00ff88,
  emissiveIntensity: 0.6,
  roughness: 0.2
});
const previewSphere = new THREE.Mesh(previewGeo, previewMat);
panelGroup.add(previewSphere);

// Shadow line (vertical drop from preview to platform)
const shadowLineMat = new THREE.LineBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.5 });
let shadowLineGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(0, -1, 0)
]);
const shadowLine = new THREE.Line(shadowLineGeo, shadowLineMat);
panelGroup.add(shadowLine);

// Raycaster for dragging
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.1);
const intersection = new THREE.Vector3();
let dragging = null;

const draggableHandles = [p1Sphere, p2Sphere];

function onPointerDown(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(draggableHandles);
  if (hits.length > 0) {
    dragging = hits[0].object;
    state.handleDragging = dragging.userData.handleId;
    controls.enabled = false;
  }
}

function clampHandle(pos) {
  pos.x = Math.max(-3.5, Math.min(3.5, pos.x));
  pos.z = Math.max(-1.8, Math.min(1.8, pos.z));
  pos.y = 0.1;
}

function onPointerMove(e) {
  if (!dragging) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
    // Convert world intersection to panel-local
    const local = panelGroup.worldToLocal(intersection.clone());
    local.y = 0.1;
    clampHandle(local);

    if (dragging.userData.handleId === 'P1') {
      p1Pos.copy(local);
      p1Sphere.position.copy(local);
    } else {
      p2Pos.copy(local);
      p2Sphere.position.copy(local);
    }
    updateCurve();
  }
}

function onPointerUp() {
  if (dragging) {
    dragging = null;
    state.handleDragging = false;
    controls.enabled = true;
  }
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);

// Selection and keyboard
function updateHandleVisuals() {
  if (state.selectedHandle === 'P1') {
    p1Sphere.material.color.set(0xffff00);
    p1Sphere.material.emissive.set(0xffff00);
    p2Sphere.material.color.set(0xff8844);
    p2Sphere.material.emissive.set(0xff8844);
  } else if (state.selectedHandle === 'P2') {
    p2Sphere.material.color.set(0xffff00);
    p2Sphere.material.emissive.set(0xffff00);
    p1Sphere.material.color.set(0xff8844);
    p1Sphere.material.emissive.set(0xff8844);
  } else {
    p1Sphere.material.color.set(0xff8844);
    p1Sphere.material.emissive.set(0xff8844);
    p2Sphere.material.color.set(0xff8844);
    p2Sphere.material.emissive.set(0xff8844);
  }
}

function resetHandles() {
  p1Pos.set(P1_DEFAULT.x, 0.1, P1_DEFAULT.z);
  p2Pos.set(P2_DEFAULT.x, 0.1, P2_DEFAULT.z);
  p1Sphere.position.copy(p1Pos);
  p2Sphere.position.copy(p2Pos);
  updateCurve();
  state.resetCount++;
}

document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'r') {
    resetHandles();
  } else if (key === ' ' || e.code === 'Space') {
    e.preventDefault();
    state.playing = !state.playing;
  } else if (key === '1') {
    state.selectedHandle = state.selectedHandle === 'P1' ? null : 'P1';
    updateHandleVisuals();
  } else if (key === '2') {
    state.selectedHandle = state.selectedHandle === 'P2' ? null : 'P2';
    updateHandleVisuals();
  } else if (state.selectedHandle && ['arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(key)) {
    e.preventDefault();
    const pos = state.selectedHandle === 'P1' ? p1Pos : p2Pos;
    const sphere = state.selectedHandle === 'P1' ? p1Sphere : p2Sphere;
    if (key === 'arrowleft') pos.x -= 0.3;
    if (key === 'arrowright') pos.x += 0.3;
    if (key === 'arrowup') pos.z += 0.3;
    if (key === 'arrowdown') pos.z -= 0.3;
    clampHandle(pos);
    sphere.position.copy(pos);
    updateCurve();
  }
});

document.getElementById('resetBtn').addEventListener('click', resetHandles);

// HUD update
const hudPlaying = document.getElementById('hudPlaying');
const hudSelected = document.getElementById('hudSelected');
const hudP1 = document.getElementById('hudP1');
const hudP2 = document.getElementById('hudP2');
const hudT = document.getElementById('hudT');

function updateHUD() {
  hudPlaying.textContent = state.playing;
  hudSelected.textContent = state.selectedHandle || 'None';
  hudP1.textContent = `(${state.p1.x.toFixed(2)}, ${state.p1.z.toFixed(2)})`;
  hudP2.textContent = `(${state.p2.x.toFixed(2)}, ${state.p2.z.toFixed(2)})`;
  hudT.textContent = state.previewT.toFixed(2);
}

// Animation
const clock = new THREE.Clock();
let animTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  controls.update();

  if (state.playing) {
    animTime += delta;
  }

  const t = (animTime % 3) / 3;
  state.previewT = t;

  if (currentCurve) {
    const pt = currentCurve.getPoint(t);
    previewSphere.position.copy(pt);
    previewSphere.position.y = pt.y + 0.05;

    // Update shadow line
    const worldPt = panelGroup.localToWorld(pt.clone());
    shadowLine.geometry.dispose();
    shadowLine.geometry = new THREE.BufferGeometry().setFromPoints([
      pt.clone(),
      new THREE.Vector3(pt.x, -1, pt.z)
    ]);

    state.previewPosition.x = worldPt.x;
    state.previewPosition.y = worldPt.y;
    state.previewPosition.z = worldPt.z;
  }

  updateHUD();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

state.initialized = true;
animate();
</script>
</body>
</html>
