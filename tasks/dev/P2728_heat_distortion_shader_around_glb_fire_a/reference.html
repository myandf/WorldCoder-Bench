<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Heat Distortion Fire Shader</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #111118;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      padding: 12px 14px;
      border-radius: 8px;
      z-index: 100;
      font-size: 14px;
      line-height: 1.5;
      min-width: 230px;
      box-shadow: 0 0 12px rgba(255, 102, 0, 0.25);
      user-select: none;
    }

    #toggleFlamingoBtn {
      margin-top: 8px;
      padding: 7px 10px;
      background: #ff6600;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #toggleFlamingoBtn:hover {
      background: #ff8533;
    }

    #hint {
      margin-top: 8px;
      color: #ddd;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="distortionLine">Distortion: ON</div>
    <div id="strengthLine">Strength: 0.015</div>
    <div id="fireLine">Fire: ON</div>
    <div id="flamingoLine">Flamingo Anim: PLAYING</div>
    <button id="toggleFlamingoBtn">Toggle Flamingo Animation</button>
    <div id="hint">
      Keys: D toggle distortion, ↑/↓ strength,<br>
      F toggle fire, R reset
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let frameCount = 0;

    const DEFAULTS = {
      strength: 0.015,
      frequency: 30.0,
      radius: 0.4,
      enabled: true
    };

    const state = {
      distortionEnabled: true,
      distortionStrength: DEFAULTS.strength,
      distortionFrequency: DEFAULTS.frequency,
      fireVisible: true,
      fireLightIntensity: 2,
      cesiumManLoaded: false,
      flamingoLoaded: false,
      cesiumManPosition: { x: 1.5, y: 0, z: 0 },
      flamingoPosition: { x: -1.5, y: 2.5, z: 0 },
      flamingoAnimPlaying: true,
      frameCount: 0,
      shaderTimeUniform: 0,
      distortionRadius: DEFAULTS.radius,
      modelsCount: 0
    };

    window.__3D_STATE__ = state;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#111118');

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 1.5, 5);
    camera.lookAt(0, 0.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.8, 0);
    controls.enableDamping = true;
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const fireLight = new THREE.PointLight(0xff6600, 2, 10);
    fireLight.position.set(0, 1.5, 0);
    scene.add(fireLight);

    const groundGeometry = new THREE.PlaneGeometry(20, 20);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: '#333333',
      roughness: 0.85,
      metalness: 0.05
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const fireGroup = new THREE.Group();
    fireGroup.position.set(0, 0, 0);
    scene.add(fireGroup);

    const fireParticles = [];
    const flameColors = [0xff3300, 0xff6600, 0xffaa00, 0xffff55, 0xcc2200];

    for (let i = 0; i < 45; i++) {
      const radius = THREE.MathUtils.randFloat(0.03, 0.08);
      const geometry = new THREE.SphereGeometry(radius, 12, 12);
      const color = flameColors[Math.floor(Math.random() * flameColors.length)];
      const material = new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: THREE.MathUtils.randFloat(1.8, 3.8),
        roughness: 0.4
      });

      const particle = new THREE.Mesh(geometry, material);
      const angle = Math.random() * Math.PI * 2;
      const spread = THREE.MathUtils.randFloat(0.0, 0.22);
      particle.position.set(
        Math.cos(angle) * spread,
        THREE.MathUtils.randFloat(0.05, 1.0),
        Math.sin(angle) * spread
      );

      const data = {
        mesh: particle,
        baseRadius: spread,
        angle,
        speed: THREE.MathUtils.randFloat(0.45, 1.2),
        drift: THREE.MathUtils.randFloat(0.7, 2.0),
        maxHeight: THREE.MathUtils.randFloat(0.75, 1.35),
        phase: Math.random() * Math.PI * 2
      };

      fireParticles.push(data);
      fireGroup.add(particle);
    }

    const coreCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.35, 1.1, 32, 1, true),
      new THREE.MeshStandardMaterial({
        color: 0xff5500,
        emissive: 0xff3300,
        emissiveIntensity: 1.8,
        transparent: true,
        opacity: 0.35,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    coreCone.position.y = 0.55;
    fireGroup.add(coreCone);

    const loader = new GLTFLoader();

    let cesiumMan = null;
    let flamingo = null;
    let cesiumMixer = null;
    let flamingoMixer = null;
    let flamingoAnimPlaying = true;

    function loadModel(url, onLoad, onErrorFallback) {
      loader.load(
        url,
        onLoad,
        undefined,
        err => {
          console.warn(`Could not load ${url}. Creating fallback placeholder.`, err);
          onErrorFallback();
        }
      );
    }

    loadModel(
      'CesiumMan.glb',
      gltf => {
        cesiumMan = gltf.scene;
        cesiumMan.position.set(1.5, 0, 0);
        cesiumMan.scale.set(1, 1, 1);
        scene.add(cesiumMan);

        if (gltf.animations && gltf.animations.length > 0) {
          cesiumMixer = new THREE.AnimationMixer(cesiumMan);
          cesiumMixer.clipAction(gltf.animations[0]).play();
        }

        state.cesiumManLoaded = true;
        state.modelsCount++;
      },
      () => {
        const fallback = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.25, 1.2, 8, 16),
          new THREE.MeshStandardMaterial({ color: 0x66aaff, roughness: 0.55 })
        );
        fallback.position.set(1.5, 0.8, 0);
        scene.add(fallback);
        cesiumMan = fallback;
        state.cesiumManLoaded = false;
      }
    );

    loadModel(
      'Fox.glb',
      gltf => {
        flamingo = gltf.scene;
        flamingo.position.set(-1.5, 2.5, 0);
        flamingo.scale.set(0.01, 0.01, 0.01);
        scene.add(flamingo);

        if (gltf.animations && gltf.animations.length > 0) {
          flamingoMixer = new THREE.AnimationMixer(flamingo);
          flamingoMixer.clipAction(gltf.animations[0]).play();
          flamingoAnimPlaying = true;
        } else {
          flamingoAnimPlaying = false;
        }

        state.flamingoLoaded = true;
        state.flamingoAnimPlaying = flamingoAnimPlaying;
        state.modelsCount++;
      },
      () => {
        const fallback = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.SphereGeometry(0.22, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xff77aa, emissive: 0x331122 })
        );
        const wingA = new THREE.Mesh(
          new THREE.BoxGeometry(0.65, 0.04, 0.18),
          new THREE.MeshStandardMaterial({ color: 0xff99bb })
        );
        const wingB = wingA.clone();
        wingA.position.x = -0.35;
        wingB.position.x = 0.35;
        fallback.add(body, wingA, wingB);
        fallback.position.set(-1.5, 2.5, 0);
        scene.add(fallback);
        flamingo = fallback;
        state.flamingoLoaded = false;
        state.flamingoAnimPlaying = false;
      }
    );

    const renderTarget = new THREE.WebGLRenderTarget(
      window.innerWidth,
      window.innerHeight,
      {
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat
      }
    );

    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const distortionUniforms = {
      tDiffuse: { value: renderTarget.texture },
      uTime: { value: 0 },
      uDistortionStrength: { value: DEFAULTS.strength },
      uFrequency: { value: DEFAULTS.frequency },
      uFireScreenPos: { value: new THREE.Vector2(0.5, 0.5) },
      uRadius: { value: DEFAULTS.radius },
      uEnabled: { value: 1.0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const distortionMaterial = new THREE.ShaderMaterial({
      uniforms: distortionUniforms,
      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uDistortionStrength;
        uniform float uFrequency;
        uniform vec2 uFireScreenPos;
        uniform float uRadius;
        uniform float uEnabled;

        varying vec2 vUv;

        void main() {
          vec2 uv = vUv;

          float dist = distance(uv, uFireScreenPos);
          float falloff = smoothstep(uRadius, 0.0, dist);

          float waveX = sin(uv.y * uFrequency + uTime * 4.0);
          float waveY = cos(uv.x * (uFrequency * 0.75) + uTime * 3.2);

          vec2 offset = vec2(waveX, waveY) * uDistortionStrength * falloff * uEnabled;

          vec2 sampledUv = clamp(uv + offset, 0.001, 0.999);
          vec4 color = texture2D(tDiffuse, sampledUv);

          float shimmer = falloff * uEnabled * 0.045 * sin(uTime * 8.0 + uv.y * 60.0);
          color.rgb += vec3(shimmer * 1.2, shimmer * 0.55, 0.0);

          gl_FragColor = color;
        }
      `,
      depthWrite: false,
      depthTest: false
    });

    const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), distortionMaterial);
    postScene.add(postQuad);

    const clock = new THREE.Clock();
    const fireWorldPosition = new THREE.Vector3(0, 0.75, 0);
    const fireScreenPos = new THREE.Vector3();

    const hud = {
      distortionLine: document.getElementById('distortionLine'),
      strengthLine: document.getElementById('strengthLine'),
      fireLine: document.getElementById('fireLine'),
      flamingoLine: document.getElementById('flamingoLine'),
      toggleFlamingoBtn: document.getElementById('toggleFlamingoBtn')
    };

    function updateHUD() {
      hud.distortionLine.textContent = `Distortion: ${state.distortionEnabled ? 'ON' : 'OFF'}`;
      hud.strengthLine.textContent = `Strength: ${state.distortionStrength.toFixed(3)}`;
      hud.fireLine.textContent = `Fire: ${state.fireVisible ? 'ON' : 'OFF'}`;
      hud.flamingoLine.textContent = `Flamingo Anim: ${state.flamingoAnimPlaying ? 'PLAYING' : 'PAUSED'}`;
    }

    function setDistortionEnabled(enabled) {
      state.distortionEnabled = enabled;
      distortionUniforms.uEnabled.value = enabled ? 1.0 : 0.0;
      updateHUD();
    }

    function setFireVisible(visible) {
      fireGroup.visible = visible;
      state.fireVisible = visible;
      fireLight.intensity = visible ? 2 : 0.2;
      state.fireLightIntensity = fireLight.intensity;
      updateHUD();
    }

    function setStrength(value) {
      state.distortionStrength = THREE.MathUtils.clamp(value, 0.0, 0.05);
      distortionUniforms.uDistortionStrength.value = state.distortionStrength;
      updateHUD();
    }

    function resetParameters() {
      setStrength(DEFAULTS.strength);
      state.distortionFrequency = DEFAULTS.frequency;
      distortionUniforms.uFrequency.value = DEFAULTS.frequency;
      distortionUniforms.uRadius.value = DEFAULTS.radius;
      state.distortionRadius = DEFAULTS.radius;
      setDistortionEnabled(true);
      setFireVisible(true);
    }

    function toggleFlamingoAnimation() {
      if (!flamingoMixer) {
        state.flamingoAnimPlaying = false;
        flamingoAnimPlaying = false;
        updateHUD();
        return;
      }

      flamingoAnimPlaying = !flamingoAnimPlaying;
      state.flamingoAnimPlaying = flamingoAnimPlaying;
      flamingoMixer.timeScale = flamingoAnimPlaying ? 1 : 0;
      updateHUD();
    }

    hud.toggleFlamingoBtn.addEventListener('click', toggleFlamingoAnimation);

    window.addEventListener('keydown', event => {
      if (event.key === 'd' || event.key === 'D') {
        setDistortionEnabled(!state.distortionEnabled);
      } else if (event.key === 'ArrowUp') {
        setStrength(state.distortionStrength + 0.005);
      } else if (event.key === 'ArrowDown') {
        setStrength(state.distortionStrength - 0.005);
      } else if (event.key === 'f' || event.key === 'F') {
        setFireVisible(!state.fireVisible);
      } else if (event.key === 'r' || event.key === 'R') {
        resetParameters();
      }
    });

    function updateFire(delta, elapsed) {
      for (const p of fireParticles) {
        p.mesh.position.y += delta * p.speed;

        const heightRatio = p.mesh.position.y / p.maxHeight;
        const swirl = elapsed * p.drift + p.phase;
        const radial = Math.max(0.02, p.baseRadius * (1.0 - heightRatio * 0.65));

        p.mesh.position.x = Math.cos(p.angle + swirl) * radial + Math.sin(elapsed * 3.0 + p.phase) * 0.035;
        p.mesh.position.z = Math.sin(p.angle + swirl) * radial + Math.cos(elapsed * 2.5 + p.phase) * 0.035;

        const scale = Math.max(0.25, 1.15 - heightRatio * 0.75);
        p.mesh.scale.setScalar(scale);

        if (p.mesh.position.y > p.maxHeight) {
          p.mesh.position.y = THREE.MathUtils.randFloat(0.03, 0.15);
          p.angle = Math.random() * Math.PI * 2;
          p.baseRadius = THREE.MathUtils.randFloat(0.0, 0.22);
        }
      }

      coreCone.rotation.y += delta * 1.5;
      coreCone.scale.x = 1 + Math.sin(elapsed * 7.0) * 0.08;
      coreCone.scale.z = 1 + Math.cos(elapsed * 6.0) * 0.08;
      coreCone.material.opacity = 0.28 + Math.sin(elapsed * 9.0) * 0.07;
    }

    function updateState() {
      state.distortionEnabled = distortionUniforms.uEnabled.value > 0.5;
      state.distortionStrength = distortionUniforms.uDistortionStrength.value;
      state.distortionFrequency = distortionUniforms.uFrequency.value;
      state.fireVisible = fireGroup.visible;
      state.fireLightIntensity = fireLight.intensity;
      state.flamingoAnimPlaying = flamingoAnimPlaying;
      state.frameCount = frameCount;
      state.shaderTimeUniform = distortionUniforms.uTime.value;
      state.distortionRadius = distortionUniforms.uRadius.value;

      if (cesiumMan) {
        state.cesiumManPosition = {
          x: cesiumMan.position.x,
          y: cesiumMan.position.y,
          z: cesiumMan.position.z
        };
      }

      if (flamingo) {
        state.flamingoPosition = {
          x: flamingo.position.x,
          y: flamingo.position.y,
          z: flamingo.position.z
        };
      }

      window.__3D_STATE__ = state;
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.elapsedTime;
      frameCount++;

      controls.update();

      updateFire(delta, elapsed);

      if (cesiumMixer) cesiumMixer.update(delta);
      if (flamingoMixer) flamingoMixer.update(delta);

      distortionUniforms.uTime.value = elapsed;

      fireScreenPos.copy(fireWorldPosition).project(camera);
      distortionUniforms.uFireScreenPos.value.set(
        fireScreenPos.x * 0.5 + 0.5,
        fireScreenPos.y * 0.5 + 0.5
      );

      renderer.setRenderTarget(renderTarget);
      renderer.clear();
      renderer.render(scene, camera);

      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(postScene, postCamera);

      updateState();
      updateHUD();
    }

    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      renderTarget.setSize(width, height);
      distortionUniforms.uResolution.value.set(width, height);
    });

    updateHUD();
    animate();
  </script>
</body>
</html>
