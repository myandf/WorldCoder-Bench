<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js Displacement Terrain with Height Particles</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #canvas-container {
      width: 960px;
      height: 600px;
      position: relative;
      margin: 0;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 20;
      background: rgba(0,0,0,0.45);
      padding: 10px 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    #hud {
      position: absolute;
      top: 80px;
      left: 10px;
      z-index: 20;
      background: rgba(0,0,0,0.45);
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.4;
      white-space: pre-line;
      min-width: 220px;
      backdrop-filter: blur(4px);
    }
    #height-slider {
      width: 220px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="ui">
      <label id="height-label" for="height-slider">Height Scale: 5.0</label>
      <input id="height-slider" type="range" min="0.5" max="20" step="0.5" value="5.0" />
    </div>
    <div id="hud"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const hud = document.getElementById('hud');
    const heightSlider = document.getElementById('height-slider');
    const heightLabel = document.getElementById('height-label');

    const WIDTH = 960;
    const HEIGHT = 600;
    const TERRAIN_SIZE = 80;
    const SEGMENTS = 256;
    const GRID_SIZE = SEGMENTS + 1;
    const TERRAIN_VERTEX_COUNT = GRID_SIZE * GRID_SIZE;
    const PARTICLE_COUNT = 3000;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(60, WIDTH / HEIGHT, 0.1, 500);
    camera.position.set(0, 30, 50);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(WIDTH, HEIGHT);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(10, 40, 20);
    scene.add(directionalLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    let heightScale = 5.0;
    let particlesPaused = false;
    let rotationMode = false;
    let speedMultiplier = 1.0;
    let colorSchemeIndex = 0;
    let frameCount = 0;
    let fps = 0;
    const startTime = performance.now();

    const colorSchemes = [
      {
        name: 'natural',
        c0: new THREE.Color('#0b3d91'),
        c1: new THREE.Color('#2e8b57'),
        c2: new THREE.Color('#8b5a2b'),
        c3: new THREE.Color('#ffffff')
      },
      {
        name: 'volcanic',
        c0: new THREE.Color('#111111'),
        c1: new THREE.Color('#7a0000'),
        c2: new THREE.Color('#ff6a00'),
        c3: new THREE.Color('#ffe066')
      },
      {
        name: 'alien',
        c0: new THREE.Color('#5b2c83'),
        c1: new THREE.Color('#00d5ff'),
        c2: new THREE.Color('#ff00aa'),
        c3: new THREE.Color('#ffffff')
      }
    ];

    const heightData = new Float32Array(TERRAIN_VERTEX_COUNT);

    function fract(x) {
      return x - Math.floor(x);
    }

    function rand2(x, y) {
      return fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453123);
    }

    function smoothNoise(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;

      const a = rand2(ix, iy);
      const b = rand2(ix + 1, iy);
      const c = rand2(ix, iy + 1);
      const d = rand2(ix + 1, iy + 1);

      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);

      return THREE.MathUtils.lerp(
        THREE.MathUtils.lerp(a, b, ux),
        THREE.MathUtils.lerp(c, d, ux),
        uy
      );
    }

    function fbm(x, y) {
      let value = 0;
      let amplitude = 0.5;
      let frequency = 1.0;
      let norm = 0;
      for (let i = 0; i < 5; i++) {
        value += smoothNoise(x * frequency, y * frequency) * amplitude;
        norm += amplitude;
        amplitude *= 0.5;
        frequency *= 2.0;
      }
      value /= norm;

      const ridged = 1.0 - Math.abs(2.0 * smoothNoise(x * 1.7, y * 1.7) - 1.0);
      const waves = 0.5 + 0.5 * Math.sin(x * 3.1) * Math.cos(y * 2.7);

      return THREE.MathUtils.clamp(value * 0.65 + ridged * 0.2 + waves * 0.15, 0, 1);
    }

    function generateHeightData() {
      let idx = 0;
      for (let z = 0; z < GRID_SIZE; z++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const nx = x / SEGMENTS - 0.5;
          const nz = z / SEGMENTS - 0.5;
          const e = fbm(nx * 6.0 + 10.0, nz * 6.0 - 3.0);
          const radial = Math.sqrt(nx * nx + nz * nz);
          const island = THREE.MathUtils.clamp(1.0 - radial * 1.35, 0.0, 1.0);
          const shaped = e * 0.8 + island * 0.2;
          heightData[idx++] = shaped;
        }
      }
    }

    generateHeightData();

    const terrainGeometry = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, SEGMENTS, SEGMENTS);
    terrainGeometry.rotateX(-Math.PI / 2);

    const terrainUniforms = {
      uHeightScale: { value: heightScale },
      uLightDir: { value: new THREE.Vector3().copy(directionalLight.position).normalize() },
      uAmbient: { value: ambientLight.intensity },
      uColor0: { value: colorSchemes[colorSchemeIndex].c0.clone() },
      uColor1: { value: colorSchemes[colorSchemeIndex].c1.clone() },
      uColor2: { value: colorSchemes[colorSchemeIndex].c2.clone() },
      uColor3: { value: colorSchemes[colorSchemeIndex].c3.clone() }
    };

    const terrainMaterial = new THREE.ShaderMaterial({
      uniforms: terrainUniforms,
      vertexShader: `
        varying float vWorldY;
        varying vec3 vNormalW;
        varying vec3 vWorldPos;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldY = worldPos.y;
          vWorldPos = worldPos.xyz;
          vNormalW = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform float uHeightScale;
        uniform vec3 uLightDir;
        uniform float uAmbient;
        uniform vec3 uColor0;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        varying float vWorldY;
        varying vec3 vNormalW;

        void main() {
          float h = vWorldY;
          vec3 baseColor;
          if (h < 0.2 * uHeightScale) {
            baseColor = uColor0;
          } else if (h < 0.5 * uHeightScale) {
            baseColor = uColor1;
          } else if (h < 0.8 * uHeightScale) {
            baseColor = uColor2;
          } else {
            baseColor = uColor3;
          }

          float diff = max(dot(normalize(vNormalW), normalize(uLightDir)), 0.0);
          float lighting = uAmbient + diff * 0.9;
          gl_FragColor = vec4(baseColor * lighting, 1.0);
        }
      `,
      side: THREE.DoubleSide
    });

    const terrainMesh = new THREE.Mesh(terrainGeometry, terrainMaterial);
    scene.add(terrainMesh);

    let avgTerrainHeight = 0;
    let minTerrainHeight = 0;
    let maxTerrainHeight = 0;
    let terrainNormalsValid = true;

    function updateTerrainGeometry() {
      const pos = terrainGeometry.attributes.position;
      let sum = 0;
      minTerrainHeight = Infinity;
      maxTerrainHeight = -Infinity;

      for (let i = 0; i < TERRAIN_VERTEX_COUNT; i++) {
        const y = heightData[i] * heightScale;
        pos.setY(i, y);
        sum += y;
        if (y < minTerrainHeight) minTerrainHeight = y;
        if (y > maxTerrainHeight) maxTerrainHeight = y;
      }

      pos.needsUpdate = true;
      terrainGeometry.computeVertexNormals();
      terrainGeometry.attributes.normal.needsUpdate = true;
      terrainGeometry.computeBoundingSphere();

      avgTerrainHeight = sum / TERRAIN_VERTEX_COUNT;
      terrainUniforms.uHeightScale.value = heightScale;

      terrainNormalsValid = true;
      const normals = terrainGeometry.attributes.normal.array;
      for (let i = 0; i < normals.length; i++) {
        if (!Number.isFinite(normals[i])) {
          terrainNormalsValid = false;
          break;
        }
      }
    }

    function setColorScheme(index) {
      colorSchemeIndex = index % colorSchemes.length;
      const scheme = colorSchemes[colorSchemeIndex];
      terrainUniforms.uColor0.value.copy(scheme.c0);
      terrainUniforms.uColor1.value.copy(scheme.c1);
      terrainUniforms.uColor2.value.copy(scheme.c2);
      terrainUniforms.uColor3.value.copy(scheme.c3);
    }

    function worldToHeightData(x, z) {
      const half = TERRAIN_SIZE / 2;
      const tx = THREE.MathUtils.clamp((x + half) / TERRAIN_SIZE, 0, 1);
      const tz = THREE.MathUtils.clamp((z + half) / TERRAIN_SIZE, 0, 1);

      const gx = tx * SEGMENTS;
      const gz = tz * SEGMENTS;

      const x0 = Math.floor(gx);
      const z0 = Math.floor(gz);
      const x1 = Math.min(x0 + 1, SEGMENTS);
      const z1 = Math.min(z0 + 1, SEGMENTS);

      const fx = gx - x0;
      const fz = gz - z0;

      const i00 = z0 * GRID_SIZE + x0;
      const i10 = z0 * GRID_SIZE + x1;
      const i01 = z1 * GRID_SIZE + x0;
      const i11 = z1 * GRID_SIZE + x1;

      const h00 = heightData[i00] * heightScale;
      const h10 = heightData[i10] * heightScale;
      const h01 = heightData[i01] * heightScale;
      const h11 = heightData[i11] * heightScale;

      const h0 = THREE.MathUtils.lerp(h00, h10, fx);
      const h1 = THREE.MathUtils.lerp(h01, h11, fx);
      return THREE.MathUtils.lerp(h0, h1, fz);
    }

    function getParticleColorByTerrainHeight(terrainY) {
      const scheme = colorSchemes[colorSchemeIndex];
      if (terrainY < 0.2 * heightScale) return scheme.c0;
      if (terrainY < 0.5 * heightScale) return scheme.c1;
      if (terrainY < 0.8 * heightScale) return scheme.c2;
      return scheme.c3;
    }

    const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
    const particleColors = new Float32Array(PARTICLE_COUNT * 3);
    const particleSizes = new Float32Array(PARTICLE_COUNT);
    const particleAlphas = new Float32Array(PARTICLE_COUNT);
    const particleBaseXZ = new Float32Array(PARTICLE_COUNT * 2);
    const particleBaseTerrainY = new Float32Array(PARTICLE_COUNT);
    const particleOffsetY = new Float32Array(PARTICLE_COUNT);
    const particleSpeed = new Float32Array(PARTICLE_COUNT);
    const particleAngle = new Float32Array(PARTICLE_COUNT);
    const particleRadius = new Float32Array(PARTICLE_COUNT);

    let particleSizeMin = Infinity;
    let particleSizeMax = -Infinity;

    function respawnParticle(i, randomizeOffset = true) {
      const x = particleBaseXZ[i * 2];
      const z = particleBaseXZ[i * 2 + 1];
      const terrainY = worldToHeightData(x, z);
      particleBaseTerrainY[i] = terrainY;

      if (randomizeOffset) {
        particleOffsetY[i] = THREE.MathUtils.randFloat(2, 8);
      } else {
        particleOffsetY[i] = THREE.MathUtils.clamp(particleOffsetY[i], 2, 8);
      }

      particlePositions[i * 3] = x;
      particlePositions[i * 3 + 1] = terrainY + particleOffsetY[i];
      particlePositions[i * 3 + 2] = z;

      const color = getParticleColorByTerrainHeight(terrainY);
      particleColors[i * 3] = color.r;
      particleColors[i * 3 + 1] = color.g;
      particleColors[i * 3 + 2] = color.b;

      const normalizedHeight = THREE.MathUtils.clamp(terrainY / Math.max(heightScale, 0.0001), 0, 1);
      const size = 0.3 + 0.2 * normalizedHeight;
      particleSizes[i] = size;

      const rise = particlePositions[i * 3 + 1] - terrainY;
      const alpha = THREE.MathUtils.clamp(1.0 - (rise / 15.0) * 0.9, 0.1, 1.0);
      particleAlphas[i] = alpha;
    }

    function initializeParticles() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const x = THREE.MathUtils.randFloat(-40, 40);
        const z = THREE.MathUtils.randFloat(-40, 40);
        particleBaseXZ[i * 2] = x;
        particleBaseXZ[i * 2 + 1] = z;
        particleSpeed[i] = THREE.MathUtils.randFloat(0.5, 2.0);
        particleAngle[i] = Math.atan2(z, x);
        particleRadius[i] = Math.sqrt(x * x + z * z);
        respawnParticle(i, true);
      }
      computeParticleSizeRange();
    }

    function computeParticleSizeRange() {
      particleSizeMin = Infinity;
      particleSizeMax = -Infinity;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const s = particleSizes[i];
        if (s < particleSizeMin) particleSizeMin = s;
        if (s > particleSizeMax) particleSizeMax = s;
      }
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
    particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(particleSizes, 1));
    particleGeometry.setAttribute('aAlpha', new THREE.BufferAttribute(particleAlphas, 1));

    const particleMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      vertexColors: true,
      uniforms: {
        uPixelRatio: { value: renderer.getPixelRatio() }
      },
      vertexShader: `
        attribute float aSize;
        attribute float aAlpha;
        varying vec3 vColor;
        varying float vAlpha;
        uniform float uPixelRatio;
        void main() {
          vColor = color;
          vAlpha = aAlpha;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * 30.0 * uPixelRatio / max(1.0, -mvPosition.z * 0.08);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec2 p = gl_PointCoord - vec2(0.5);
          float d = length(p);
          float m = smoothstep(0.5, 0.0, d);
          gl_FragColor = vec4(vColor, vAlpha * m);
        }
      `
    });

    const points = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(points);

    function refreshParticlesForTerrainChange() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        respawnParticle(i, false);
      }
      particleGeometry.attributes.position.needsUpdate = true;
      particleGeometry.attributes.color.needsUpdate = true;
      particleGeometry.attributes.aSize.needsUpdate = true;
      particleGeometry.attributes.aAlpha.needsUpdate = true;
      computeParticleSizeRange();
    }

    updateTerrainGeometry();
    setColorScheme(0);
    initializeParticles();

    heightSlider.addEventListener('input', () => {
      heightScale = parseFloat(heightSlider.value);
      heightLabel.textContent = `Height Scale: ${heightScale.toFixed(1)}`;
      updateTerrainGeometry();
      refreshParticlesForTerrainChange();
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === 'r' || key === 'R') {
        rotationMode = !rotationMode;
      } else if (key === 'p' || key === 'P') {
        particlesPaused = !particlesPaused;
      } else if (key === 'c' || key === 'C') {
        setColorScheme((colorSchemeIndex + 1) % colorSchemes.length);
        refreshParticlesForTerrainChange();
      } else if (key === '+' || key === '=') {
        speedMultiplier = THREE.MathUtils.clamp(speedMultiplier + 0.25, 0.25, 4.0);
      } else if (key === '-' || key === '_') {
        speedMultiplier = THREE.MathUtils.clamp(speedMultiplier - 0.25, 0.25, 4.0);
      }
    });

    let lastTime = performance.now();
    let fpsAccum = 0;
    let fpsFrames = 0;
    let fpsLast = performance.now();

    function updateParticles(dt) {
      if (particlesPaused) return;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        let x = particlePositions[i * 3];
        let y = particlePositions[i * 3 + 1];
        let z = particlePositions[i * 3 + 2];

        let terrainY = particleBaseTerrainY[i];

        if (rotationMode) {
          particleAngle[i] += dt * 0.35 * speedMultiplier;
          x = Math.cos(particleAngle[i]) * particleRadius[i];
          z = Math.sin(particleAngle[i]) * particleRadius[i];
          particleBaseXZ[i * 2] = x;
          particleBaseXZ[i * 2 + 1] = z;
          terrainY = worldToHeightData(x, z);
          particleBaseTerrainY[i] = terrainY;
          particlePositions[i * 3] = x;
          particlePositions[i * 3 + 2] = z;
        }

        y += particleSpeed[i] * dt * speedMultiplier;

        if (y > terrainY + 15.0) {
          particleOffsetY[i] = 0.0;
          y = terrainY;
        }

        particlePositions[i * 3 + 1] = y;

        const color = getParticleColorByTerrainHeight(terrainY);
        particleColors[i * 3] = color.r;
        particleColors[i * 3 + 1] = color.g;
        particleColors[i * 3 + 2] = color.b;

        const normalizedHeight = THREE.MathUtils.clamp(terrainY / Math.max(heightScale, 0.0001), 0, 1);
        particleSizes[i] = 0.3 + 0.2 * normalizedHeight;

        const rise = y - terrainY;
        particleAlphas[i] = THREE.MathUtils.clamp(1.0 - (rise / 15.0) * 0.9, 0.1, 1.0);
      }

      particleGeometry.attributes.position.needsUpdate = true;
      particleGeometry.attributes.color.needsUpdate = true;
      particleGeometry.attributes.aSize.needsUpdate = true;
      particleGeometry.attributes.aAlpha.needsUpdate = true;
      computeParticleSizeRange();
    }

    function updateHUD() {
      hud.textContent =
`Particle count: ${PARTICLE_COUNT}
Color scheme: ${colorSchemes[colorSchemeIndex].name}
Particle animation: ${particlesPaused ? 'Paused' : 'Running'}
Rotation mode: ${rotationMode ? 'On' : 'Off'}
Speed multiplier: ${speedMultiplier.toFixed(2)}
FPS: ${fps.toFixed(1)}
Average terrain height: ${avgTerrainHeight.toFixed(3)}`;
    }

    function updateState(now) {
      window.__3D_STATE__ = {
        heightScale,
        particleCount: PARTICLE_COUNT,
        colorScheme: colorSchemes[colorSchemeIndex].name,
        particlesPaused,
        rotationMode,
        speedMultiplier,
        fps,
        avgTerrainHeight,
        minTerrainHeight,
        maxTerrainHeight,
        particlePositions: Array.from({ length: 10 }, (_, i) => particlePositions[i * 3 + 1]),
        terrainVertexCount: TERRAIN_VERTEX_COUNT,
        colorSchemeIndex,
        particleSizeRange: {
          min: particleSizeMin,
          max: particleSizeMax
        },
        terrainNormalsValid,
        frameCount,
        elapsedTime: (now - startTime) / 1000
      };
    }

    function animate(now) {
      requestAnimationFrame(animate);
      frameCount++;

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      fpsAccum += 1000 / Math.max(1, now - (fpsLast - fpsAccum));
      fpsFrames++;
      if (now - fpsLast >= 250) {
        fps = fpsFrames / ((now - fpsLast) / 1000);
        fpsLast = now;
        fpsFrames = 0;
      }

      terrainUniforms.uLightDir.value.copy(directionalLight.position).normalize();

      updateParticles(dt);
      controls.update();
      updateHUD();
      updateState(now);
      renderer.render(scene, camera);
    }

    updateHUD();
    updateState(performance.now());
    requestAnimationFrame(animate);
  </script>
</body>
</html>
