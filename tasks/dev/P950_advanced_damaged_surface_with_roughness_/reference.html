<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damaged Surface Material Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: monospace; }
  canvas { display: block; }
  #hud {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.7);
    color: #ffffff;
    padding: 15px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.8;
    z-index: 100;
    min-width: 220px;
    pointer-events: none;
  }
  #hud span { color: #00ffaa; }
  #resetBtn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 12px 30px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 14px;
    cursor: pointer;
    z-index: 100;
    transition: background 0.2s;
  }
  #resetBtn:hover { background: rgba(255, 255, 255, 0.25); }
  #instructions {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-family: monospace;
    font-size: 12px;
    text-align: center;
    pointer-events: none;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="hud">
  <div>Damage Hits: <span id="hits">0</span></div>
  <div>Avg Roughness: <span id="avgRough">0.000</span></div>
  <div>Score: <span id="score">0</span></div>
  <div>Brush: <span id="brush">medium</span></div>
  <div>Max Roughness: <span id="maxRough">0.000</span></div>
</div>

<button id="resetBtn">Reset Surface</button>

<div id="instructions">
  Click surface to damage | 1/2/3: brush size | M: toggle metalness
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Value Noise Implementation ---
function createValueNoise(size) {
  const perm = new Uint8Array(size * 2);
  for (let i = 0; i < size * 2; i++) perm[i] = i;
  for (let i = size * 2 - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [perm[i], perm[j]] = [perm[j], perm[i]];
  }

  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }

  function noise2D(x, y) {
    const X = Math.floor(x) & (size - 1);
    const Y = Math.floor(y) & (size - 1);
    x -= Math.floor(x);
    y -= Math.floor(y);
    const u = fade(x);
    const v = fade(y);
    const A = perm[X] + Y;
    const B = perm[X + 1] + Y;
    return lerp(
      lerp(grad(perm[A], x, y), grad(perm[B], x - 1, y), u),
      lerp(grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1), u),
      v
    );
  }

  function fbm(x, y, octaves) {
    let val = 0, amp = 0.5, freq = 1;
    for (let i = 0; i < octaves; i++) {
      val += amp * noise2D(x * freq, y * freq);
      amp *= 0.5;
      freq *= 2.0;
    }
    return val;
  }

  return { fbm };
}

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// --- Lights ---
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 8, 5);
scene.add(dirLight);

const ambLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambLight);

// --- Procedural Environment Map ---
function createProceduralEnvTexture() {
  const width = 512;
  const height = 256;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const u = x / width;
      const v = y / height;
      const theta = u * Math.PI * 2;
      const phi = v * Math.PI;

      // Create a gradient sky-like environment
      const ny = Math.cos(phi);
      const baseR = 0.1 + 0.15 * Math.max(0, ny);
      const baseG = 0.1 + 0.12 * Math.max(0, ny);
      const baseB = 0.15 + 0.2 * Math.max(0, ny);

      // Add some bright spots for reflections
      const spot1 = Math.exp(-((theta - 1.0) ** 2 + (phi - 1.2) ** 2) * 8) * 2.0;
      const spot2 = Math.exp(-((theta - 3.5) ** 2 + (phi - 0.8) ** 2) * 12) * 1.5;
      const spot3 = Math.exp(-((theta - 5.0) ** 2 + (phi - 1.5) ** 2) * 10) * 1.0;

      const r = Math.min(1, baseR + spot1 * 0.8 + spot2 * 0.3);
      const g = Math.min(1, baseG + spot1 * 0.7 + spot2 * 0.4 + spot3 * 0.2);
      const b = Math.min(1, baseB + spot1 * 0.6 + spot2 * 0.5 + spot3 * 0.3);

      ctx.fillStyle = `rgb(${Math.floor(r * 255)},${Math.floor(g * 255)},${Math.floor(b * 255)})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.mapping = THREE.EquirectangularReflectionMapping;
  return texture;
}

const envTexture = createProceduralEnvTexture();
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const envMap = pmremGenerator.fromEquirectangular(envTexture).texture;
scene.environment = envMap;
envTexture.dispose();
pmremGenerator.dispose();

// --- Roughness Map ---
const TEX_SIZE = 256;
const noiseGen = createValueNoise(256);

function generateInitialRoughnessData() {
  const data = new Uint8Array(TEX_SIZE * TEX_SIZE);
  for (let y = 0; y < TEX_SIZE; y++) {
    for (let x = 0; x < TEX_SIZE; x++) {
      const u = x / TEX_SIZE;
      const v = y / TEX_SIZE;
      let n = noiseGen.fbm(u * 8, v * 8, 5);
      // Normalize to 0..1 range (fbm returns roughly -1..1)
      n = (n + 1) * 0.5;
      // Map to roughness range 0.1 to 0.6
      const roughness = 0.1 + n * 0.5;
      data[y * TEX_SIZE + x] = Math.floor(roughness * 255);
    }
  }
  return data;
}

let roughnessData = generateInitialRoughnessData();
const roughnessTexture = new THREE.DataTexture(roughnessData, TEX_SIZE, TEX_SIZE, THREE.RedFormat);
roughnessTexture.needsUpdate = true;

// --- Main Plane ---
const planeGeometry = new THREE.PlaneGeometry(6, 6, 256, 256);
const planeMaterial = new THREE.MeshStandardMaterial({
  color: 0xb0b0b0,
  metalness: 0.85,
  roughness: 0.3,
  roughnessMap: roughnessTexture,
  envMap: envMap,
  envMapIntensity: 1.0,
});

const plane = new THREE.Mesh(planeGeometry, planeMaterial);
plane.rotation.x = -Math.PI / 2;
plane.position.y = 0;
scene.add(plane);

// --- State ---
let damageHits = 0;
let brushMode = 'medium';
let isReset = true;
let currentMetalness = 0.85;

const brushSettings = {
  small: { radius: 0.04, intensity: 0.15 },
  medium: { radius: 0.08, intensity: 0.25 },
  large: { radius: 0.15, intensity: 0.40 },
};

// --- Raycaster ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function applyDamage(uv) {
  const settings = brushSettings[brushMode];
  const radius = settings.radius;
  const intensity = settings.intensity;

  const cx = uv.x * TEX_SIZE;
  const cy = uv.y * TEX_SIZE;
  const r = radius * TEX_SIZE;

  let changed = false;

  for (let y = 0; y < TEX_SIZE; y++) {
    for (let x = 0; x < TEX_SIZE; x++) {
      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < r) {
        const idx = y * TEX_SIZE + x;
        const currentRough = roughnessData[idx] / 255;
        // Smooth falloff based on distance
        const falloff = 1.0 - (dist / r);
        const add = intensity * falloff;
        const newRough = Math.min(1.0, currentRough + add);
        roughnessData[idx] = Math.floor(newRough * 255);
        changed = true;
      }
    }
  }

  if (changed) {
    roughnessTexture.needsUpdate = true;
    damageHits++;
    isReset = false;
  }
}

function calculateRoughnessStats() {
  let sum = 0;
  let max = 0;
  for (let i = 0; i < roughnessData.length; i++) {
    const val = roughnessData[i] / 255;
    sum += val;
    if (val > max) max = val;
  }
  const avg = sum / roughnessData.length;
  return { avg, max };
}

// --- Click Handler ---
renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(plane);

  if (intersects.length > 0) {
    const uv = intersects[0].uv;
    applyDamage(uv);
  }
});

// --- Keyboard Handler ---
window.addEventListener('keydown', (event) => {
  const key = event.key.toLowerCase();
  if (key === '1') brushMode = 'small';
  else if (key === '2') brushMode = 'medium';
  else if (key === '3') brushMode = 'large';
  else if (key === 'm') {
    currentMetalness = currentMetalness > 0.5 ? 0.15 : 0.85;
    planeMaterial.metalness = currentMetalness;
  }
});

// --- Reset Button ---
document.getElementById('resetBtn').addEventListener('click', () => {
  roughnessData = generateInitialRoughnessData();
  roughnessTexture.needsUpdate = true;
  damageHits = 0;
  isReset = true;
});

// --- HUD Update ---
const hitsEl = document.getElementById('hits');
const avgRoughEl = document.getElementById('avgRough');
const scoreEl = document.getElementById('score');
const brushEl = document.getElementById('brush');
const maxRoughEl = document.getElementById('maxRough');

function updateHUD() {
  const stats = calculateRoughnessStats();
  const score = damageHits * 10 + Math.floor(stats.avg * 100);

  hitsEl.textContent = damageHits;
  avgRoughEl.textContent = stats.avg.toFixed(3);
  scoreEl.textContent = score;
  brushEl.textContent = brushMode;
  maxRoughEl.textContent = stats.max.toFixed(3);
}

// --- State Object ---
window.__3D_STATE__ = {
  damageHits: 0,
  avgRoughness: 0,
  maxRoughness: 0,
  score: 0,
  brushMode: 'medium',
  metalness: 0.85,
  baseRoughness: 0.3,
  surfaceExists: true,
  roughnessMapResolution: 256,
  isReset: true,
};

// --- Animation Loop ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  const stats = calculateRoughnessStats();
  const score = damageHits * 10 + Math.floor(stats.avg * 100);

  window.__3D_STATE__.damageHits = damageHits;
  window.__3D_STATE__.avgRoughness = stats.avg;
  window.__3D_STATE__.maxRoughness = stats.max;
  window.__3D_STATE__.score = score;
  window.__3D_STATE__.brushMode = brushMode;
  window.__3D_STATE__.metalness = currentMetalness;
  window.__3D_STATE__.baseRoughness = 0.3;
  window.__3D_STATE__.surfaceExists = scene.children.includes(plane);
  window.__3D_STATE__.roughnessMapResolution = 256;
  window.__3D_STATE__.isReset = isReset;

  updateHUD();
  renderer.render(scene, camera);
}

animate();

// --- Resize Handler ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
