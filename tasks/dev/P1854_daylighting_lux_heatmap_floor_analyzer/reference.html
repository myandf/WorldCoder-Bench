<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daylighting Lux Heatmap Analyzer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
    }

    .panel {
      position: absolute;
      background: rgba(15, 18, 35, 0.88);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    #controls {
      top: 12px;
      left: 12px;
      width: 320px;
    }

    #stats-panel {
      bottom: 12px;
      left: 12px;
      width: 320px;
      line-height: 1.5;
    }

    #cell-info {
      top: 12px;
      right: 12px;
      width: 220px;
    }

    #legend {
      top: 200px;
      right: 12px;
      width: 220px;
    }

    .row {
      margin-bottom: 10px;
    }

    .row label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #d9dcff;
    }

    input[type="range"] {
      width: 100%;
    }

    select, button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #2a2f52;
      color: white;
      box-sizing: border-box;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .toggle-btn {
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .toggle-btn.active {
      background: #179c43;
    }

    .toggle-btn.inactive {
      background: #b12b2b;
    }

    #legend-gradient {
      height: 24px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.25);
      background: linear-gradient(
        to right,
        #000033 0%,
        #0000ff 25%,
        #00ff00 50%,
        #ffff00 75%,
        #ff0000 100%
      );
      margin: 8px 0 6px 0;
    }

    #legend-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #d0d0e8;
    }

    .small {
      font-size: 12px;
      color: #c9c9df;
    }

    .title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .value {
      color: #8ee6ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="controls" class="panel">
      <div class="title">Daylighting Controls</div>

      <div class="row">
        <label for="azimuth-slider">Sun Azimuth: <span id="azimuth-value" class="value">180</span>°</label>
        <input id="azimuth-slider" type="range" min="0" max="360" step="1" value="180" />
      </div>

      <div class="row">
        <label for="altitude-slider">Sun Altitude: <span id="altitude-value" class="value">45</span>°</label>
        <input id="altitude-slider" type="range" min="5" max="90" step="1" value="45" />
      </div>

      <div class="row">
        <label>Windows</label>
        <div class="button-row">
          <button id="toggle-w1" class="toggle-btn active">W1 ON</button>
          <button id="toggle-w2" class="toggle-btn active">W2 ON</button>
          <button id="toggle-w3" class="toggle-btn active">W3 ON</button>
        </div>
      </div>

      <div class="row">
        <label for="analysis-mode">Analysis Mode</label>
        <select id="analysis-mode">
          <option value="lux" selected>lux</option>
          <option value="compliance">compliance</option>
          <option value="uniformity">uniformity</option>
        </select>
      </div>

      <div class="small">Keyboard: R reset, + altitude up, - altitude down</div>
    </div>

    <div id="cell-info" class="panel">
      <div class="title">Selected Cell</div>
      <div id="cell-info-content">Click a grid cell to inspect.</div>
    </div>

    <div id="legend" class="panel">
      <div class="title">Lux Legend</div>
      <div id="legend-gradient"></div>
      <div id="legend-ticks">
        <span>0</span>
        <span>500</span>
        <span>1000</span>
        <span>1500</span>
        <span>2000</span>
      </div>
      <div class="small" style="margin-top:8px;">Color scale in lux mode.</div>
    </div>

    <div id="stats-panel" class="panel">
      <div class="title">Statistics</div>
      <div id="stats-content"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const ROOM_W = 20;
    const ROOM_H = 14;
    const GRID_COLS = 20;
    const GRID_ROWS = 14;
    const CELL_SIZE = 1;
    const WALL_THICKNESS = 0.2;
    const WALL_HEIGHT = 3;

    const app = document.getElementById('app');
    const azimuthSlider = document.getElementById('azimuth-slider');
    const altitudeSlider = document.getElementById('altitude-slider');
    const azimuthValue = document.getElementById('azimuth-value');
    const altitudeValue = document.getElementById('altitude-value');
    const toggleW1 = document.getElementById('toggle-w1');
    const toggleW2 = document.getElementById('toggle-w2');
    const toggleW3 = document.getElementById('toggle-w3');
    const analysisModeSelect = document.getElementById('analysis-mode');
    const statsContent = document.getElementById('stats-content');
    const cellInfoContent = document.getElementById('cell-info-content');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    let aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 26;
    let camera = new THREE.OrthographicCamera(
      -frustumSize * aspect / 2,
      frustumSize * aspect / 2,
      frustumSize / 2,
      -frustumSize / 2,
      0.1,
      100
    );
    camera.position.set(0, 25, 0);
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
    scene.add(sunLight);
    scene.add(sunLight.target);
    sunLight.target.position.set(0, 0, 0);

    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    const floorBase = new THREE.Mesh(
      new THREE.PlaneGeometry(ROOM_W, ROOM_H),
      new THREE.MeshBasicMaterial({ color: 0x111122, side: THREE.DoubleSide })
    );
    floorBase.rotation.x = -Math.PI / 2;
    floorBase.position.y = -0.01;
    roomGroup.add(floorBase);

    const cellMeshes = [];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const cellGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);

    for (let row = 0; row < GRID_ROWS; row++) {
      for (let col = 0; col < GRID_COLS; col++) {
        const mat = new THREE.MeshBasicMaterial({
          color: 0x000033,
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(cellGeo, mat);
        mesh.rotation.x = -Math.PI / 2;
        const x = -ROOM_W / 2 + 0.5 + col;
        const z = -ROOM_H / 2 + 0.5 + row;
        mesh.position.set(x, 0.001, z);
        mesh.userData = { col, row, lux: 0 };
        roomGroup.add(mesh);
        cellMeshes.push(mesh);
      }
    }

    const gridPoints = [];
    for (let c = 0; c <= GRID_COLS; c++) {
      const x = -ROOM_W / 2 + c;
      gridPoints.push(x, 0.02, -ROOM_H / 2, x, 0.02, ROOM_H / 2);
    }
    for (let r = 0; r <= GRID_ROWS; r++) {
      const z = -ROOM_H / 2 + r;
      gridPoints.push(-ROOM_W / 2, 0.02, z, ROOM_W / 2, 0.02, z);
    }
    const gridGeo = new THREE.BufferGeometry();
    gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridPoints, 3));
    const gridLines = new THREE.LineSegments(
      gridGeo,
      new THREE.LineBasicMaterial({ color: 0x222222 })
    );
    roomGroup.add(gridLines);

    function wallMesh(w, h, d, x, y, z) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color: 0x888888 })
      );
      m.position.set(x, y, z);
      roomGroup.add(m);
      return m;
    }

    wallMesh(ROOM_W + WALL_THICKNESS * 2, WALL_HEIGHT, WALL_THICKNESS, 0, WALL_HEIGHT / 2, -ROOM_H / 2 - WALL_THICKNESS / 2);
    wallMesh(ROOM_W + WALL_THICKNESS * 2, WALL_HEIGHT, WALL_THICKNESS, 0, WALL_HEIGHT / 2, ROOM_H / 2 + WALL_THICKNESS / 2);
    wallMesh(WALL_THICKNESS, WALL_HEIGHT, ROOM_H, -ROOM_W / 2 - WALL_THICKNESS / 2, WALL_HEIGHT / 2, 0);
    wallMesh(WALL_THICKNESS, WALL_HEIGHT, ROOM_H, ROOM_W / 2 + WALL_THICKNESS / 2, WALL_HEIGHT / 2, 0);

    const windows = [
      { id: 'W1', x: -6, z: ROOM_H / 2 + 0.01, width: 3, height: 2, mesh: null, active: true },
      { id: 'W2', x: 0,  z: ROOM_H / 2 + 0.01, width: 4, height: 2.5, mesh: null, active: true },
      { id: 'W3', x: 6,  z: ROOM_H / 2 + 0.01, width: 3, height: 2, mesh: null, active: true }
    ];

    windows.forEach(w => {
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(w.width, w.height),
        new THREE.MeshBasicMaterial({
          color: 0x4da6ff,
          transparent: true,
          opacity: 0.55,
          side: THREE.DoubleSide
        })
      );
      mesh.position.set(w.x, w.height / 2, w.z);
      mesh.rotation.y = Math.PI;
      roomGroup.add(mesh);
      w.mesh = mesh;
    });

    const selectionOutline = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE)),
      new THREE.LineBasicMaterial({ color: 0xffffff })
    );
    selectionOutline.rotation.x = -Math.PI / 2;
    selectionOutline.position.set(0, 0.05, 0);
    selectionOutline.visible = false;
    roomGroup.add(selectionOutline);

    const state = {
      sunAzimuth: 180,
      sunAltitude: 45,
      windowStates: [true, true, true],
      analysisMode: 'lux',
      gridLux: new Array(GRID_COLS * GRID_ROWS).fill(0),
      selectedCell: null,
      stats: {
        avgLux: 0,
        minLux: 0,
        maxLux: 0,
        complianceRate: 0,
        uniformityRatio: 0
      },
      cellCount: GRID_COLS * GRID_ROWS,
      gridCols: GRID_COLS,
      gridRows: GRID_ROWS,
      totalWindowArea: 0
    };

    window.__3D_STATE__ = state;

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function hexToColor(hex) {
      return new THREE.Color(hex);
    }

    const luxStops = [
      { value: 0, color: hexToColor('#000033') },
      { value: 500, color: hexToColor('#0000FF') },
      { value: 1000, color: hexToColor('#00FF00') },
      { value: 1500, color: hexToColor('#FFFF00') },
      { value: 2000, color: hexToColor('#FF0000') }
    ];

    function getLuxColor(lux) {
      const v = clamp(lux, 0, 2000);
      for (let i = 0; i < luxStops.length - 1; i++) {
        const a = luxStops[i];
        const b = luxStops[i + 1];
        if (v >= a.value && v <= b.value) {
          const t = (v - a.value) / (b.value - a.value);
          return a.color.clone().lerp(b.color, t);
        }
      }
      return luxStops[luxStops.length - 1].color.clone();
    }

    function getWindowAreaFactor(w) {
      return (w.width * w.height) / 10;
    }

    function updateSunLight() {
      const az = THREE.MathUtils.degToRad(state.sunAzimuth);
      const alt = THREE.MathUtils.degToRad(state.sunAltitude);
      const r = 20;
      const x = r * Math.sin(az) * Math.cos(alt);
      const y = r * Math.sin(alt);
      const z = r * Math.cos(az) * Math.cos(alt);
      sunLight.position.set(x, y, z);
    }

    function isCellLitFromSouthWall(cellZ) {
      const az = ((state.sunAzimuth % 360) + 360) % 360;
      return az >= 90 && az <= 270 && cellZ <= ROOM_H / 2;
    }

    function recalculateLux() {
      updateSunLight();

      const altitudeRad = THREE.MathUtils.degToRad(state.sunAltitude);
      const avgInput = [];
      let totalWindowArea = 0;

      for (let i = 0; i < windows.length; i++) {
        if (state.windowStates[i]) totalWindowArea += windows[i].width * windows[i].height;
      }
      state.totalWindowArea = totalWindowArea;

      for (let i = 0; i < cellMeshes.length; i++) {
        const mesh = cellMeshes[i];
        const x = mesh.position.x;
        const z = mesh.position.z;
        let lux = 0;

        for (let w = 0; w < windows.length; w++) {
          const win = windows[w];
          if (!state.windowStates[w]) continue;

          if (!isCellLitFromSouthWall(z)) continue;

          const baseLux = 5000 * Math.sin(altitudeRad) * getWindowAreaFactor(win);
          const dx = x - win.x;
          const dz = z - ROOM_H / 2;
          const distance = Math.sqrt(dx * dx + dz * dz);
          const contribution = baseLux / (1 + 0.15 * distance * distance);
          lux += contribution;
        }

        lux = clamp(lux, 0, 2000);
        mesh.userData.lux = lux;
        state.gridLux[i] = lux;
        avgInput.push(lux);
      }

      const sum = avgInput.reduce((a, b) => a + b, 0);
      const avg = sum / avgInput.length;
      const min = Math.min(...avgInput);
      const max = Math.max(...avgInput);
      const compliantCount = avgInput.filter(v => v >= 300).length;
      const complianceRate = (compliantCount / avgInput.length) * 100;
      const uniformityRatio = avg > 0 ? min / avg : 0;

      state.stats = {
        avgLux: avg,
        minLux: min,
        maxLux: max,
        complianceRate,
        uniformityRatio
      };

      applyCellColors(avgInput, avg);
      updateStatsPanel();
      updateSelectedCellPanel();
      window.__3D_STATE__ = state;
    }

    function applyCellColors(values, avg) {
      for (let i = 0; i < cellMeshes.length; i++) {
        const lux = values[i];
        let color;

        if (state.analysisMode === 'lux') {
          color = getLuxColor(lux);
        } else if (state.analysisMode === 'compliance') {
          color = new THREE.Color(lux >= 300 ? '#00CC00' : '#CC0000');
        } else {
          const deviation = avg > 0 ? Math.abs(lux - avg) / avg : 0;
          if (deviation <= 0.2) color = new THREE.Color('#00CC00');
          else if (deviation <= 0.5) color = new THREE.Color('#FFFF00');
          else color = new THREE.Color('#CC0000');
        }

        cellMeshes[i].material.color.copy(color);
      }
    }

    function updateStatsPanel() {
      const s = state.stats;
      statsContent.innerHTML = `
        <div>Average lux: <span class="value">${s.avgLux.toFixed(1)}</span></div>
        <div>Min lux: <span class="value">${Math.round(s.minLux)}</span></div>
        <div>Max lux: <span class="value">${Math.round(s.maxLux)}</span></div>
        <div>Compliance rate: <span class="value">${s.complianceRate.toFixed(1)}%</span></div>
        <div>Uniformity ratio: <span class="value">${s.uniformityRatio.toFixed(3)}</span></div>
      `;
    }

    function updateSelectedCellPanel() {
      if (!state.selectedCell) {
        cellInfoContent.innerHTML = 'Click a grid cell to inspect.';
        selectionOutline.visible = false;
        return;
      }

      const lux = state.selectedCell.lux;
      const pass = lux >= 300 ? 'Pass' : 'Fail';
      cellInfoContent.innerHTML = `
        <div>Grid position: <span class="value">(${state.selectedCell.col}, ${state.selectedCell.row})</span></div>
        <div>Lux value: <span class="value">${Math.round(lux)}</span></div>
        <div>Compliance: <span class="value">${pass}</span></div>
      `;
      selectionOutline.visible = true;
    }

    function setSelectedCell(mesh) {
      const { col, row, lux } = mesh.userData;
      state.selectedCell = { col, row, lux };
      selectionOutline.position.set(mesh.position.x, 0.05, mesh.position.z);
      updateSelectedCellPanel();
      window.__3D_STATE__ = state;
    }

    function updateToggleButton(btn, active, label) {
      btn.classList.toggle('active', active);
      btn.classList.toggle('inactive', !active);
      btn.textContent = `${label} ${active ? 'ON' : 'OFF'}`;
    }

    function syncControls() {
      azimuthSlider.value = String(state.sunAzimuth);
      altitudeSlider.value = String(state.sunAltitude);
      azimuthValue.textContent = String(state.sunAzimuth);
      altitudeValue.textContent = String(state.sunAltitude);
      analysisModeSelect.value = state.analysisMode;
      updateToggleButton(toggleW1, state.windowStates[0], 'W1');
      updateToggleButton(toggleW2, state.windowStates[1], 'W2');
      updateToggleButton(toggleW3, state.windowStates[2], 'W3');

      windows.forEach((w, i) => {
        w.mesh.visible = state.windowStates[i];
        w.mesh.material.opacity = state.windowStates[i] ? 0.55 : 0.15;
      });
    }

    azimuthSlider.addEventListener('input', () => {
      state.sunAzimuth = Number(azimuthSlider.value);
      azimuthValue.textContent = String(state.sunAzimuth);
      recalculateLux();
    });

    altitudeSlider.addEventListener('input', () => {
      state.sunAltitude = Number(altitudeSlider.value);
      altitudeValue.textContent = String(state.sunAltitude);
      recalculateLux();
    });

    toggleW1.addEventListener('click', () => {
      state.windowStates[0] = !state.windowStates[0];
      syncControls();
      recalculateLux();
    });

    toggleW2.addEventListener('click', () => {
      state.windowStates[1] = !state.windowStates[1];
      syncControls();
      recalculateLux();
    });

    toggleW3.addEventListener('click', () => {
      state.windowStates[2] = !state.windowStates[2];
      syncControls();
      recalculateLux();
    });

    analysisModeSelect.addEventListener('change', () => {
      state.analysisMode = analysisModeSelect.value;
      recalculateLux();
    });

    function resetState() {
      state.sunAzimuth = 180;
      state.sunAltitude = 45;
      state.windowStates = [true, true, true];
      state.analysisMode = 'lux';
      state.selectedCell = null;
      syncControls();
      recalculateLux();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        resetState();
      } else if (e.key === '+' || e.key === '=') {
        state.sunAltitude = clamp(state.sunAltitude + 5, 5, 90);
        syncControls();
        recalculateLux();
      } else if (e.key === '-') {
        state.sunAltitude = clamp(state.sunAltitude - 5, 5, 90);
        syncControls();
        recalculateLux();
      }
    });

    renderer.domElement.addEventListener('click', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(cellMeshes, false);
      if (intersects.length > 0) {
        setSelectedCell(intersects[0].object);
      }
    });

    function onResize() {
      const aspect = window.innerWidth / window.innerHeight;
      camera.left = -frustumSize * aspect / 2;
      camera.right = frustumSize * aspect / 2;
      camera.top = frustumSize / 2;
      camera.bottom = -frustumSize / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    syncControls();
    recalculateLux();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
