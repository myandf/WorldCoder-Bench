<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Procedural Heat Haze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      color: #eaf6ff;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-line;
      user-select: none;
      pointer-events: none;
      min-width: 180px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    #info {
      position: fixed;
      bottom: 10px;
      left: 12px;
      z-index: 10;
      color: #cfd8dc;
      background: rgba(0,0,0,0.4);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="info">Keys: 1/2 Strength, 3/4 Frequency, 5/6 Speed, V Vertical Fade, H Toggle, R Reset</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const hud = document.getElementById('hud');

    const DEFAULTS = Object.freeze({
      strength: 0.03,
      frequency: 8.0,
      speed: 1.5,
      verticalFade: 0.7,
      enabled: true
    });

    const verticalFadePresets = [0.0, 0.3, 0.5, 0.7, 1.0];

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function safeNumber(v, fallback = 0) {
      return Number.isFinite(v) ? v : fallback;
    }

    function findFadeIndex(value) {
      let idx = verticalFadePresets.findIndex(v => Math.abs(v - value) < 1e-6);
      return idx >= 0 ? idx : 0;
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87a9c4);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);

    const ambient = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    function createCheckerTexture(size = 512, divisions = 16) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const cell = size / divisions;
      for (let y = 0; y < divisions; y++) {
        for (let x = 0; x < divisions; x++) {
          const even = (x + y) % 2 === 0;
          ctx.fillStyle = even ? '#d9d9d9' : '#555555';
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }

      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= divisions; i++) {
        const p = i * cell;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(size, p);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4, 4);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const groundMat = new THREE.MeshStandardMaterial({
      map: createCheckerTexture(),
      roughness: 0.9,
      metalness: 0.0
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const boxGeo = new THREE.BoxGeometry(1, 2, 1);
    const boxData = [
      { color: 0xff3333, pos: [-2, 1, 0] },
      { color: 0x33ff33, pos: [0, 1, 0] },
      { color: 0x3366ff, pos: [2, 1, 0] }
    ];
    const boxes = [];
    boxData.forEach(d => {
      const mesh = new THREE.Mesh(
        boxGeo,
        new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.45, metalness: 0.1 })
      );
      mesh.position.set(d.pos[0], d.pos[1], d.pos[2]);
      scene.add(mesh);
      boxes.push(mesh);
    });

    const heatSource = new THREE.Mesh(
      new THREE.PlaneGeometry(4, 1),
      new THREE.MeshStandardMaterial({
        color: 0xff7a00,
        emissive: 0xff5a00,
        emissiveIntensity: 2.2,
        side: THREE.DoubleSide,
        roughness: 0.8
      })
    );
    heatSource.position.set(0, 0.05, -2);
    heatSource.rotation.x = -Math.PI / 2;
    heatSource.scale.y = 0.1;
    scene.add(heatSource);

    const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
      colorSpace: THREE.SRGBColorSpace,
      depthBuffer: true,
      stencilBuffer: false
    });

    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const postUniforms = {
      tDiffuse: { value: renderTarget.texture },
      uTime: { value: 0.0 },
      uDistortionStrength: { value: DEFAULTS.strength },
      uFrequency: { value: DEFAULTS.frequency },
      uSpeed: { value: DEFAULTS.speed },
      uVerticalFade: { value: DEFAULTS.verticalFade },
      uEnabled: { value: DEFAULTS.enabled ? 1 : 0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const postMaterial = new THREE.ShaderMaterial({
      uniforms: postUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;

        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uDistortionStrength;
        uniform float uFrequency;
        uniform float uSpeed;
        uniform float uVerticalFade;
        uniform float uEnabled;
        uniform vec2 uResolution;

        varying vec2 vUv;

        vec2 hash(vec2 p) {
          p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
          return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
        }

        float noise(in vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);

          float a = dot(hash(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0));
          float b = dot(hash(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
          float c = dot(hash(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
          float d = dot(hash(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));

          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }

        float fbm(vec2 p) {
          float value = 0.0;
          float amplitude = 0.5;
          for (int i = 0; i < 4; i++) {
            value += amplitude * noise(p);
            p *= 2.02;
            amplitude *= 0.5;
          }
          return value;
        }

        void main() {
          vec2 uv = vUv;

          if (uEnabled < 0.5) {
            gl_FragColor = texture2D(tDiffuse, uv);
            return;
          }

          float bottomMask = 1.0 - smoothstep(0.0, max(0.0001, uVerticalFade), uv.y);
          vec2 aspect = vec2(uResolution.x / max(uResolution.y, 1.0), 1.0);

          float t = uTime * uSpeed;
          vec2 p = uv * aspect * uFrequency;

          float n1 = fbm(vec2(p.x * 1.25, p.y * 2.4 + t * 1.7));
          float n2 = fbm(vec2(p.x * 0.9 - t * 1.2, p.y * 2.8 + t * 1.4 + 13.7));

          float xOffset = n1 * uDistortionStrength * bottomMask;
          float yOffset = (n2 * 0.35) * uDistortionStrength * bottomMask;

          vec2 distortedUv = uv + vec2(xOffset, yOffset);
          distortedUv = clamp(distortedUv, 0.0, 1.0);

          gl_FragColor = texture2D(tDiffuse, distortedUv);
        }
      `
    });

    const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
    postScene.add(postQuad);

    let shaderCompiled = true;

    try {
      renderer.compile(scene, camera);
      renderer.compile(postScene, postCamera);
    } catch (e) {
      shaderCompiled = false;
      console.error('Shader compilation error:', e);
    }

    const state = {
      enabled: DEFAULTS.enabled,
      distortionStrength: DEFAULTS.strength,
      frequency: DEFAULTS.frequency,
      speed: DEFAULTS.speed,
      verticalFade: DEFAULTS.verticalFade,
      verticalFadeIndex: findFadeIndex(DEFAULTS.verticalFade),
      time: 0,
      frame: 0,
      fps: 0,
      boxCount: boxes.length,
      shaderCompiled,
      renderTargetWidth: renderTarget.width,
      renderTargetHeight: renderTarget.height
    };
    window.__3D_STATE__ = state;

    function applyStateToUniforms() {
      state.distortionStrength = clamp(safeNumber(state.distortionStrength, DEFAULTS.strength), 0.0, 0.1);
      state.frequency = clamp(safeNumber(state.frequency, DEFAULTS.frequency), 1.0, 20.0);
      state.speed = clamp(safeNumber(state.speed, DEFAULTS.speed), 0.1, 5.0);
      state.verticalFade = clamp(safeNumber(state.verticalFade, DEFAULTS.verticalFade), 0.0, 1.0);
      state.time = safeNumber(state.time, 0);
      state.frame = Math.max(0, safeNumber(state.frame, 0));
      state.fps = Math.max(0, safeNumber(state.fps, 0));

      postUniforms.uDistortionStrength.value = state.distortionStrength;
      postUniforms.uFrequency.value = state.frequency;
      postUniforms.uSpeed.value = state.speed;
      postUniforms.uVerticalFade.value = state.verticalFade;
      postUniforms.uEnabled.value = state.enabled ? 1 : 0;
      postUniforms.uTime.value = state.time;
    }

    function resetParameters() {
      state.enabled = DEFAULTS.enabled;
      state.distortionStrength = DEFAULTS.strength;
      state.frequency = DEFAULTS.frequency;
      state.speed = DEFAULTS.speed;
      state.verticalFade = DEFAULTS.verticalFade;
      state.verticalFadeIndex = findFadeIndex(DEFAULTS.verticalFade);
      applyStateToUniforms();
    }

    function cycleVerticalFade() {
      state.verticalFadeIndex = (safeNumber(state.verticalFadeIndex, 0) + 1) % verticalFadePresets.length;
      state.verticalFade = verticalFadePresets[state.verticalFadeIndex];
      applyStateToUniforms();
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key;

      if (key === '1') state.distortionStrength -= 0.005;
      else if (key === '2') state.distortionStrength += 0.005;
      else if (key === '3') state.frequency -= 1.0;
      else if (key === '4') state.frequency += 1.0;
      else if (key === '5') state.speed -= 0.2;
      else if (key === '6') state.speed += 0.2;
      else if (key === 'h' || key === 'H') state.enabled = !state.enabled;
      else if (key === 'r' || key === 'R') resetParameters();
      else if (key === 'v' || key === 'V') cycleVerticalFade();

      if (!['r','R','v','V'].includes(key)) {
        if (Math.abs(state.verticalFade - verticalFadePresets[state.verticalFadeIndex]) > 1e-6) {
          state.verticalFadeIndex = findFadeIndex(state.verticalFade);
        }
      }

      applyStateToUniforms();
    });

    function resize() {
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      renderTarget.setSize(w, h);
      postUniforms.uResolution.value.set(w, h);

      state.renderTargetWidth = renderTarget.width;
      state.renderTargetHeight = renderTarget.height;
    }

    window.addEventListener('resize', resize);

    let lastTime = performance.now();
    let fpsTimeAccum = 0;
    let fpsFrameAccum = 0;

    function updateHUD() {
      hud.textContent =
`Strength: ${state.distortionStrength.toFixed(3)}
Frequency: ${state.frequency.toFixed(1)}
Speed: ${state.speed.toFixed(1)}
Vertical Fade: ${state.verticalFade.toFixed(1)}
Effect: ${state.enabled ? 'ON' : 'OFF'}
Frame: ${state.frame}`;
    }

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min(0.1, Math.max(0.0, (now - lastTime) / 1000));
      lastTime = now;

      state.time = safeNumber(state.time + dt, 0);
      state.frame = safeNumber(state.frame + 1, 0);

      fpsTimeAccum += dt;
      fpsFrameAccum += 1;
      if (fpsTimeAccum >= 0.5) {
        state.fps = safeNumber(fpsFrameAccum / fpsTimeAccum, 0);
        fpsTimeAccum = 0;
        fpsFrameAccum = 0;
      }

      boxes[0].rotation.y += dt * 0.6;
      boxes[1].rotation.y += dt * 0.8;
      boxes[2].rotation.y += dt * 1.0;

      applyStateToUniforms();

      renderer.setRenderTarget(renderTarget);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.render(postScene, postCamera);

      state.shaderCompiled = shaderCompiled;
      state.boxCount = boxes.length;
      state.renderTargetWidth = renderTarget.width;
      state.renderTargetHeight = renderTarget.height;

      updateHUD();
    }

    resize();
    resetParameters();
    updateHUD();
    requestAnimationFrame((t) => {
      lastTime = t;
      animate(t);
    });
  </script>
</body>
</html>
