<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis Horse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #solar-wind-panel {
    position: fixed; top: 16px; right: 16px;
    background: rgba(5, 10, 30, 0.85);
    border: 1px solid rgba(0, 255, 136, 0.3);
    border-radius: 8px; padding: 16px; width: 240px;
    color: #aaffcc; font-size: 12px;
    backdrop-filter: blur(4px);
  }
  #solar-wind-panel h3 {
    color: #00ffcc; margin-bottom: 12px; font-size: 13px;
    text-align: center; letter-spacing: 1px;
  }
  .ctrl { margin-bottom: 10px; }
  .ctrl label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .ctrl input[type=range] {
    width: 100%; accent-color: #00ffcc;
    background: transparent; cursor: pointer;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; padding: 7px 4px; border: 1px solid rgba(0,255,136,0.4);
    background: rgba(0,255,136,0.08); color: #00ffcc;
    border-radius: 4px; cursor: pointer; font-size: 11px;
    font-family: monospace; transition: background 0.2s;
  }
  .btn:hover { background: rgba(0,255,136,0.2); }
  #solar-storm-btn.active { background: rgba(255,100,0,0.3); border-color: #ff6600; color: #ffaa44; }
  #status-bar {
    position: fixed; bottom: 12px; left: 12px;
    color: rgba(0,255,136,0.5); font-size: 11px; font-family: monospace;
  }
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #00ffcc; font-size: 16px; font-family: monospace;
    text-align: center;
  }
</style>
</head>
<body>
<div id="loading">Loading aurora horse...<br><small style="color:#446688">Fox.glb</small></div>

<div id="solar-wind-panel">
  <h3>☀ SOLAR WIND CONTROL</h3>
  <div class="ctrl">
    <label><span>Solar Wind Intensity</span><span id="wind-val">0.30</span></label>
    <input type="range" id="wind-slider" min="0" max="1" step="0.01" value="0.3">
  </div>
  <div class="ctrl">
    <label><span>Aurora Speed</span><span id="speed-val">1.0</span></label>
    <input type="range" id="speed-slider" min="0.1" max="3.0" step="0.1" value="1.0">
  </div>
  <div class="ctrl">
    <label><span>Color Phase</span><span id="phase-val">0.00</span></label>
    <input type="range" id="color-phase-slider" min="0" max="6.28" step="0.01" value="0">
  </div>
  <div class="btn-row">
    <button class="btn" id="solar-storm-btn">Solar Storm</button>
    <button class="btn" id="reset-btn">Reset</button>
  </div>
</div>

<div id="status-bar" id="status-bar">Frame: 0 | Paused: false</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── State ──────────────────────────────────────────────────────────────────
window.__3D_STATE__ = {
  modelLoaded: false, windIntensity: 0.3, timeScale: 1.0, colorPhase: 0.0,
  elapsedTime: 0, isPaused: false, stormActive: false,
  activePreset: 'default', particleCount: 500, visibleParticleSpeed: 0,
  vertexDisplacementMax: 0.3 * 0.15, materialBlending: 'AdditiveBlending',
  frameCount: 0, cameraDistance: 8
};

// ── Renderer ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050510);
document.body.appendChild(renderer.domElement);

// ── Scene / Camera ─────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0, 3, 8);
camera.lookAt(0, 0, 0);

// ── Lights ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x112244, 0.15));
const dirLight = new THREE.DirectionalLight(0x8888ff, 0.3);
dirLight.position.set(3, 5, 2);
scene.add(dirLight);

// ── Controls ───────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// ── Ground ─────────────────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x0a0a1a, transparent: true, opacity: 0.85 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
scene.add(ground);

// ── Aurora Shader ──────────────────────────────────────────────────────────
const auroraVert = `
uniform float uTime;
uniform float uWindIntensity;
varying vec3 vWorldPos;
varying vec3 vNormal;
varying vec3 vViewDir;

void main() {
  vNormal = normalize(normalMatrix * normal);
  vec4 worldPos4 = modelMatrix * vec4(position, 1.0);
  vWorldPos = worldPos4.xyz;

  float disp = uWindIntensity * 0.15 * (
    sin(position.y * 4.0 + uTime * 2.1) * 0.5 +
    sin(position.x * 3.0 + uTime * 1.7 + 1.3) * 0.3 +
    sin(position.z * 5.0 + uTime * 2.8 + 2.1) * 0.2
  );
  vec3 displaced = position + normal * disp;
  vec4 mvPos = modelViewMatrix * vec4(displaced, 1.0);
  vViewDir = normalize(-mvPos.xyz);
  gl_Position = projectionMatrix * mvPos;
}
`;

const auroraFrag = `
uniform float uTime;
uniform float uWindIntensity;
uniform float uTimeScale;
uniform float uColorPhase;
varying vec3 vWorldPos;
varying vec3 vNormal;
varying vec3 vViewDir;

float hash(float n) { return fract(sin(n) * 43758.5453); }
float noise(float x) {
  float i = floor(x); float f = fract(x);
  return mix(hash(i), hash(i+1.0), smoothstep(0.0,1.0,f));
}

void main() {
  float y = vWorldPos.y;
  float t = uTime;

  // vertical band noise
  float n1 = noise(y * 1.2 + t * 0.4 + uColorPhase);
  float n2 = noise(y * 2.3 - t * 0.6 + uColorPhase + 1.0);
  float n3 = noise(y * 0.8 + t * 0.3 + uColorPhase + 2.5);

  // aurora colors
  vec3 green  = vec3(0.0, 1.0, 0.533);   // #00ff88
  vec3 cyan   = vec3(0.0, 1.0, 0.8);     // #00ffcc
  vec3 purple = vec3(0.533, 0.0, 1.0);   // #8800ff
  vec3 blue   = vec3(0.0, 0.267, 1.0);   // #0044ff

  vec3 col = mix(green, cyan, n1);
  col = mix(col, purple, n2 * 0.6);
  col = mix(col, blue, n3 * 0.4);

  // phase shift
  float phase = uColorPhase / 6.28318;
  col = mix(col, vec3(col.z, col.x, col.y), phase * 0.5);

  // Fresnel rim
  float fresnel = pow(1.0 - max(dot(vNormal, vViewDir), 0.0), 2.5);
  col += fresnel * vec3(0.2, 0.8, 0.6) * 0.8;

  // brightness by wind
  float brightness = 0.4 + uWindIntensity * 0.8;
  col *= brightness;

  // curtain shimmer
  float shimmer = 0.7 + 0.3 * sin(y * 8.0 + t * 3.0);
  col *= shimmer;

  float alpha = (0.5 + fresnel * 0.5) * (0.3 + uWindIntensity * 0.5);
  alpha = clamp(alpha, 0.0, 1.0);

  gl_FragColor = vec4(col, alpha);
}
`;

function makeAuroraMaterial() {
  return new THREE.ShaderMaterial({
    vertexShader: auroraVert,
    fragmentShader: auroraFrag,
    uniforms: {
      uTime:          { value: 0 },
      uWindIntensity: { value: 0.3 },
      uTimeScale:     { value: 1.0 },
      uColorPhase:    { value: 0.0 }
    },
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
}

// ── Particles ──────────────────────────────────────────────────────────────
const PARTICLE_COUNT = 500;
const pPositions = new Float32Array(PARTICLE_COUNT * 3);
const pVelocities = new Float32Array(PARTICLE_COUNT);

function resetParticle(i) {
  pPositions[i * 3]     = (Math.random() - 0.5) * 8;
  pPositions[i * 3 + 1] = 5 + Math.random() * 3;
  pPositions[i * 3 + 2] = (Math.random() - 0.5) * 8;
  pVelocities[i] = 0.5 + Math.random() * 1.5;
}
for (let i = 0; i < PARTICLE_COUNT; i++) resetParticle(i);

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

const pMat = new THREE.PointsMaterial({
  color: 0x88ffcc, size: 0.05,
  blending: THREE.AdditiveBlending,
  transparent: true, depthWrite: false,
  sizeAttenuation: true
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// ── Load Model ─────────────────────────────────────────────────────────────
let auroraMaterials = [];
const loader = new GLTFLoader();
loader.load('Fox.glb',
  (gltf) => {
    const model = gltf.scene;
    // center + scale
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 4 / maxDim; // bounding sphere ~2
    model.position.sub(center.multiplyScalar(scale));
    model.scale.setScalar(scale);

    // replace materials
    model.traverse(child => {
      if (child.isMesh) {
        const mat = makeAuroraMaterial();
        child.material = mat;
        auroraMaterials.push(mat);
      }
    });

    scene.add(model);
    document.getElementById('loading').style.display = 'none';
    window.__3D_STATE__.modelLoaded = true;
  },
  undefined,
  (err) => {
    document.getElementById('loading').innerHTML =
      '<span style="color:#ff4444">Failed to load Fox.glb</span><br><small>Place Fox.glb in same directory</small>';
    console.error(err);
  }
);

// ── UI Controls ────────────────────────────────────────────────────────────
const windSlider      = document.getElementById('wind-slider');
const speedSlider     = document.getElementById('speed-slider');
const colorPhaseSlider= document.getElementById('color-phase-slider');
const windVal         = document.getElementById('wind-val');
const speedVal        = document.getElementById('speed-val');
const phaseVal        = document.getElementById('phase-val');
const stormBtn        = document.getElementById('solar-storm-btn');
const resetBtn        = document.getElementById('reset-btn');
const statusBar       = document.getElementById('status-bar');

let windIntensity = 0.3, timeScale = 1.0, colorPhase = 0.0;
let isPaused = false, stormActive = false;
let stormTimer = 0, stormPhase = 'idle';
let preStormWind = 0.3, preStormSpeed = 1.0;
let activePreset = 'default';

function setUniforms() {
  auroraMaterials.forEach(m => {
    m.uniforms.uWindIntensity.value = windIntensity;
    m.uniforms.uTimeScale.value = timeScale;
    m.uniforms.uColorPhase.value = colorPhase;
  });
}

function updateSliderUI() {
  windSlider.value = windIntensity;
  speedSlider.value = timeScale;
  colorPhaseSlider.value = colorPhase;
  windVal.textContent = windIntensity.toFixed(2);
  speedVal.textContent = timeScale.toFixed(1);
  phaseVal.textContent = colorPhase.toFixed(2);
}

windSlider.addEventListener('input', () => {
  windIntensity = parseFloat(windSlider.value);
  windVal.textContent = windIntensity.toFixed(2);
  activePreset = 'custom';
  setUniforms();
});
speedSlider.addEventListener('input', () => {
  timeScale = parseFloat(speedSlider.value);
  speedVal.textContent = timeScale.toFixed(1);
  activePreset = 'custom';
  setUniforms();
});
colorPhaseSlider.addEventListener('input', () => {
  colorPhase = parseFloat(colorPhaseSlider.value);
  phaseVal.textContent = colorPhase.toFixed(2);
  activePreset = 'custom';
  setUniforms();
});

function triggerStorm() {
  if (stormActive) return;
  preStormWind = windIntensity;
  preStormSpeed = timeScale;
  stormActive = true;
  stormPhase = 'ramp';
  stormTimer = 0;
  stormBtn.classList.add('active');
}

stormBtn.addEventListener('click', triggerStorm);

function doReset() {
  windIntensity = 0.3; timeScale = 1.0; colorPhase = 0.0;
  activePreset = 'default';
  updateSliderUI();
  setUniforms();
}
resetBtn.addEventListener('click', doReset);

// ── Keyboard ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === '1') {
    windIntensity = 0.3; timeScale = 1.0; colorPhase = 0.0;
    activePreset = 'green'; updateSliderUI(); setUniforms();
  } else if (e.key === '2') {
    windIntensity = 0.6; timeScale = 1.5; colorPhase = 3.14;
    activePreset = 'purple'; updateSliderUI(); setUniforms();
  } else if (e.key === '3') {
    windIntensity = 0.5; timeScale = 0.8; colorPhase = 4.71;
    activePreset = 'blue'; updateSliderUI(); setUniforms();
  } else if (e.key === ' ') {
    e.preventDefault();
    isPaused = !isPaused;
  } else if (e.key === 'r' || e.key === 'R') {
    doReset();
  }
});

// ── Resize ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animation Loop ─────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let uTime = 0;
let frameCount = 0;

function lerp(a, b, t) { return a + (b - a) * t; }

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  frameCount++;

  // storm logic
  if (stormActive) {
    stormTimer += delta;
    if (stormPhase === 'ramp') {
      const t = Math.min(stormTimer / 0.5, 1.0);
      windIntensity = lerp(preStormWind, 1.0, t);
      timeScale = lerp(preStormSpeed, 3.0, t);
      if (stormTimer >= 0.5) { stormPhase = 'hold'; stormTimer = 0; }
    } else if (stormPhase === 'hold') {
      windIntensity = 1.0; timeScale = 3.0;
      if (stormTimer >= 2.0) { stormPhase = 'decay'; stormTimer = 0; }
    } else if (stormPhase === 'decay') {
      const t = Math.min(stormTimer / 0.5, 1.0);
      windIntensity = lerp(1.0, preStormWind, t);
      timeScale = lerp(3.0, preStormSpeed, t);
      if (stormTimer >= 0.5) {
        stormActive = false; stormPhase = 'idle';
        windIntensity = preStormWind; timeScale = preStormSpeed;
        stormBtn.classList.remove('active');
      }
    }
    updateSliderUI();
    setUniforms();
  }

  // time
  if (!isPaused) {
    uTime += delta * timeScale;
    auroraMaterials.forEach(m => { m.uniforms.uTime.value = uTime; });
  }

  // particles
  const speedFactor = 0.05 + windIntensity * 2.5;
  const pos = pGeo.attributes.position.array;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    pos[i * 3 + 1] -= delta * speedFactor * pVelocities[i];
    if (pos[i * 3 + 1] < -1) resetParticle(i);
  }
  pGeo.attributes.position.needsUpdate = true;
  pMat.opacity = 0.2 + windIntensity * 0.7;

  controls.update();

  // state
  const s = window.__3D_STATE__;
  s.windIntensity = windIntensity;
  s.timeScale = timeScale;
  s.colorPhase = colorPhase;
  s.elapsedTime = uTime;
  s.isPaused = isPaused;
  s.stormActive = stormActive;
  s.activePreset = activePreset;
  s.visibleParticleSpeed = speedFactor;
  s.vertexDisplacementMax = windIntensity * 0.15;
  s.frameCount = frameCount;
  s.cameraDistance = camera.position.length();

  statusBar.textContent = `Frame: ${frameCount} | Paused: ${isPaused} | Wind: ${windIntensity.toFixed(2)} | Preset: ${activePreset}`;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
