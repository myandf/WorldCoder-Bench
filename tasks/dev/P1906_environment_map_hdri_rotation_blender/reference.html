<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js HDRI Rotation Blender</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 320px;
      background: rgba(20, 20, 26, 0.86);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      font-size: 13px;
    }
    #control-panel h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }
    #control-panel .row {
      margin: 8px 0;
    }
    #control-panel label {
      display: block;
      margin-bottom: 3px;
    }
    #control-panel input[type="range"],
    #control-panel select,
    #control-panel button {
      width: 100%;
      box-sizing: border-box;
    }
    #control-panel button {
      margin-top: 6px;
      padding: 7px 8px;
      border: none;
      border-radius: 6px;
      background: #2f6df6;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    #control-panel button:hover {
      background: #2559cb;
    }
    #control-panel .small {
      font-size: 12px;
      opacity: 0.9;
    }
    #blend-display {
      display: inline-block;
      margin-top: 4px;
      font-weight: bold;
      color: #ffd98a;
    }
    .hint {
      margin-top: 8px;
      line-height: 1.35;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="control-panel">
    <h3>HDRI Blender</h3>

    <div class="row">
      <label for="slider-a">Blend A - Sunset</label>
      <input id="slider-a" type="range" min="0" max="100" step="1" value="100" />
    </div>
    <div class="row">
      <label for="slider-b">Blend B - Studio</label>
      <input id="slider-b" type="range" min="0" max="100" step="1" value="0" />
    </div>
    <div class="row">
      <label for="slider-c">Blend C - Night</label>
      <input id="slider-c" type="range" min="0" max="100" step="1" value="0" />
    </div>

    <div class="row">
      <label for="rot-a">Rotation A (deg)</label>
      <input id="rot-a" type="range" min="0" max="360" step="1" value="0" />
    </div>
    <div class="row">
      <label for="rot-b">Rotation B (deg)</label>
      <input id="rot-b" type="range" min="0" max="360" step="1" value="0" />
    </div>
    <div class="row">
      <label for="rot-c">Rotation C (deg)</label>
      <input id="rot-c" type="range" min="0" max="360" step="1" value="0" />
    </div>

    <div class="row">
      <label for="tone-mapping-select">Tone Mapping</label>
      <select id="tone-mapping-select">
        <option selected>ACES Filmic</option>
        <option>Reinhard</option>
        <option>Linear</option>
        <option>Cineon</option>
      </select>
    </div>

    <div class="row">
      <label for="exposure-slider">Exposure</label>
      <input id="exposure-slider" type="range" min="0.1" max="5.0" step="0.1" value="1.0" />
    </div>

    <div class="row small">
      Blend: <span id="blend-display">A:1.00 B:0.00 C:0.00</span>
    </div>

    <button id="btn-reset">Reset All</button>
    <button id="btn-preset-blend">Equal Blend</button>
    <button id="btn-snapshot">Snapshot State</button>

    <div class="hint small">
      Keys: 1/2/3 env presets, R reset rotations, E cycle tone mapping, +/- exposure, Space roughness anim.
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

    const ENV_W = 512;
    const ENV_H = 256;

    const ui = {
      sliderA: document.getElementById('slider-a'),
      sliderB: document.getElementById('slider-b'),
      sliderC: document.getElementById('slider-c'),
      rotA: document.getElementById('rot-a'),
      rotB: document.getElementById('rot-b'),
      rotC: document.getElementById('rot-c'),
      toneMapping: document.getElementById('tone-mapping-select'),
      exposure: document.getElementById('exposure-slider'),
      reset: document.getElementById('btn-reset'),
      equalBlend: document.getElementById('btn-preset-blend'),
      snapshot: document.getElementById('btn-snapshot'),
      blendDisplay: document.getElementById('blend-display'),
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function frac(x) {
      return x - Math.floor(x);
    }

    function pseudoRandom(i) {
      return frac(Math.sin(i * 12.9898 + 78.233) * 43758.5453123);
    }

    function sampleNearest(data, w, h, u, v) {
      let x = Math.floor(frac(u) * w);
      let y = Math.floor(clamp(v, 0, 0.999999) * h);
      x = (x % w + w) % w;
      y = clamp(y, 0, h - 1);
      const idx = (y * w + x) * 4;
      return [data[idx], data[idx + 1], data[idx + 2], data[idx + 3]];
    }

    function createFloatTextureFromArray(array, width, height) {
      const tex = new THREE.DataTexture(array, width, height, THREE.RGBAFormat, THREE.FloatType);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.magFilter = THREE.LinearFilter;
      tex.minFilter = THREE.LinearFilter;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.generateMipmaps = false;
      tex.needsUpdate = true;
      return tex;
    }

    function makeSunsetEnv() {
      const data = new Float32Array(ENV_W * ENV_H * 4);

      const top = [0.05, 0.05, 0.2];
      const horizon = [1.0, 0.4, 0.1];
      const bottom = [0.15, 0.08, 0.02];
      const sunU = 0.25;
      const sunV = 0.45;

      for (let y = 0; y < ENV_H; y++) {
        const v = y / (ENV_H - 1);
        let r, g, b;

        if (v < 0.5) {
          const t = v / 0.5;
          r = lerp(top[0], horizon[0], t);
          g = lerp(top[1], horizon[1], t);
          b = lerp(top[2], horizon[2], t);
        } else {
          const t = (v - 0.5) / 0.5;
          r = lerp(horizon[0], bottom[0], t);
          g = lerp(horizon[1], bottom[1], t);
          b = lerp(horizon[2], bottom[2], t);
        }

        for (let x = 0; x < ENV_W; x++) {
          const u = x / ENV_W;
          const idx = (y * ENV_W + x) * 4;

          const duRaw = Math.abs(u - sunU);
          const du = Math.min(duRaw, 1.0 - duRaw);
          const dv = Math.abs(v - sunV);
          const d = Math.sqrt(du * du + dv * dv);

          const sun = Math.exp(-(d * d) / (2.0 * 0.018 * 0.018)) * 8.0;
          data[idx] = r + sun;
          data[idx + 1] = g + sun * 0.85;
          data[idx + 2] = b + sun * 0.55;
          data[idx + 3] = 1.0;
        }
      }

      return data;
    }

    function makeStudioEnv() {
      const data = new Float32Array(ENV_W * ENV_H * 4);

      const top = [0.6, 0.6, 0.65];
      const middle = [0.9, 0.9, 0.9];
      const bottom = [0.3, 0.3, 0.32];
      const patches = [
        { u: 0.15, v: 0.5, halfW: 0.06, halfH: 0.16, intensity: 3.0 },
        { u: 0.65, v: 0.5, halfW: 0.06, halfH: 0.16, intensity: 3.0 }
      ];

      for (let y = 0; y < ENV_H; y++) {
        const v = y / (ENV_H - 1);
        let r, g, b;

        if (v < 0.5) {
          const t = v / 0.5;
          r = lerp(top[0], middle[0], t);
          g = lerp(top[1], middle[1], t);
          b = lerp(top[2], middle[2], t);
        } else {
          const t = (v - 0.5) / 0.5;
          r = lerp(middle[0], bottom[0], t);
          g = lerp(middle[1], bottom[1], t);
          b = lerp(middle[2], bottom[2], t);
        }

        for (let x = 0; x < ENV_W; x++) {
          const u = x / ENV_W;
          const idx = (y * ENV_W + x) * 4;

          let pr = r, pg = g, pb = b;

          for (const p of patches) {
            const duRaw = Math.abs(u - p.u);
            const du = Math.min(duRaw, 1.0 - duRaw);
            const dv = Math.abs(v - p.v);

            const sx = 1.0 - smoothstep(p.halfW * 0.7, p.halfW * 1.3, du);
            const sy = 1.0 - smoothstep(p.halfH * 0.7, p.halfH * 1.3, dv);
            const patch = sx * sy * p.intensity;

            pr += patch;
            pg += patch;
            pb += patch;
          }

          data[idx] = pr;
          data[idx + 1] = pg;
          data[idx + 2] = pb;
          data[idx + 3] = 1.0;
        }
      }

      return data;
    }

    function makeNightEnv() {
      const data = new Float32Array(ENV_W * ENV_H * 4);

      const top = [0.01, 0.01, 0.05];
      const horizon = [0.02, 0.03, 0.08];
      const bottom = [0.005, 0.005, 0.01];

      const stars = [];
      const starCount = 180;
      for (let i = 0; i < starCount; i++) {
        stars.push({
          u: pseudoRandom(i * 2 + 1),
          v: pseudoRandom(i * 2 + 2),
          size: 0.0015 + pseudoRandom(i * 5 + 3) * 0.004,
          intensity: 2.0 + pseudoRandom(i * 7 + 4) * 3.0
        });
      }

      for (let y = 0; y < ENV_H; y++) {
        const v = y / (ENV_H - 1);
        let r, g, b;

        if (v < 0.5) {
          const t = v / 0.5;
          r = lerp(top[0], horizon[0], t);
          g = lerp(top[1], horizon[1], t);
          b = lerp(top[2], horizon[2], t);
        } else {
          const t = (v - 0.5) / 0.5;
          r = lerp(horizon[0], bottom[0], t);
          g = lerp(horizon[1], bottom[1], t);
          b = lerp(horizon[2], bottom[2], t);
        }

        for (let x = 0; x < ENV_W; x++) {
          const u = x / ENV_W;
          const idx = (y * ENV_W + x) * 4;
          let pr = r, pg = g, pb = b;

          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            const duRaw = Math.abs(u - s.u);
            const du = Math.min(duRaw, 1.0 - duRaw);
            const dv = Math.abs(v - s.v);
            const d2 = du * du + dv * dv;
            const star = Math.exp(-d2 / (2.0 * s.size * s.size)) * s.intensity;
            pr += star;
            pg += star;
            pb += star * 1.1;
          }

          data[idx] = pr;
          data[idx + 1] = pg;
          data[idx + 2] = pb;
          data[idx + 3] = 1.0;
        }
      }

      return data;
    }

    const sourceArrays = {
      a: makeSunsetEnv(),
      b: makeStudioEnv(),
      c: makeNightEnv()
    };

    const sourceTextures = {
      a: createFloatTextureFromArray(sourceArrays.a, ENV_W, ENV_H),
      b: createFloatTextureFromArray(sourceArrays.b, ENV_W, ENV_H),
      c: createFloatTextureFromArray(sourceArrays.c, ENV_W, ENV_H)
    };

    // Convert each source DataTexture through PMREM once, satisfying the spec.
    const sourcePmrems = {
      a: pmremGenerator.fromEquirectangular(sourceTextures.a),
      b: pmremGenerator.fromEquirectangular(sourceTextures.b),
      c: pmremGenerator.fromEquirectangular(sourceTextures.c)
    };

    const blendedArray = new Float32Array(ENV_W * ENV_H * 4);
    let blendedTexture = createFloatTextureFromArray(blendedArray, ENV_W, ENV_H);
    let currentPmremRT = null;

    function getRawWeights() {
      return {
        a: parseFloat(ui.sliderA.value),
        b: parseFloat(ui.sliderB.value),
        c: parseFloat(ui.sliderC.value)
      };
    }

    function getNormalizedWeights() {
      const raw = getRawWeights();
      let sum = raw.a + raw.b + raw.c;
      if (sum <= 0) {
        raw.a = 100;
        raw.b = 0;
        raw.c = 0;
        sum = 100;
        ui.sliderA.value = '100';
        ui.sliderB.value = '0';
        ui.sliderC.value = '0';
      }
      return {
        a: raw.a / sum,
        b: raw.b / sum,
        c: raw.c / sum
      };
    }

    function updateBlendDisplay() {
      const n = getNormalizedWeights();
      ui.blendDisplay.textContent = `A:${n.a.toFixed(2)} B:${n.b.toFixed(2)} C:${n.c.toFixed(2)}`;
    }

    function blendEnvironments() {
      const weights = getNormalizedWeights();

      const rotA = THREE.MathUtils.degToRad(parseFloat(ui.rotA.value));
      const rotB = THREE.MathUtils.degToRad(parseFloat(ui.rotB.value));
      const rotC = THREE.MathUtils.degToRad(parseFloat(ui.rotC.value));

      const shiftA = rotA / (Math.PI * 2.0);
      const shiftB = rotB / (Math.PI * 2.0);
      const shiftC = rotC / (Math.PI * 2.0);

      for (let y = 0; y < ENV_H; y++) {
        const v = y / ENV_H;
        for (let x = 0; x < ENV_W; x++) {
          const u = x / ENV_W;
          const idx = (y * ENV_W + x) * 4;

          const sa = sampleNearest(sourceArrays.a, ENV_W, ENV_H, u - shiftA, v);
          const sb = sampleNearest(sourceArrays.b, ENV_W, ENV_H, u - shiftB, v);
          const sc = sampleNearest(sourceArrays.c, ENV_W, ENV_H, u - shiftC, v);

          blendedArray[idx]     = sa[0] * weights.a + sb[0] * weights.b + sc[0] * weights.c;
          blendedArray[idx + 1] = sa[1] * weights.a + sb[1] * weights.b + sc[1] * weights.c;
          blendedArray[idx + 2] = sa[2] * weights.a + sb[2] * weights.b + sc[2] * weights.c;
          blendedArray[idx + 3] = 1.0;
        }
      }

      blendedTexture.needsUpdate = true;

      if (currentPmremRT) currentPmremRT.dispose();
      currentPmremRT = pmremGenerator.fromEquirectangular(blendedTexture);

      scene.environment = currentPmremRT.texture;
      scene.background = currentPmremRT.texture;

      updateBlendDisplay();
    }

    const sphereGeo = new THREE.SphereGeometry(0.8, 64, 64);
    const planeGeo = new THREE.PlaneGeometry(10, 10);

    const sphere1 = new THREE.Mesh(
      sphereGeo,
      new THREE.MeshStandardMaterial({ metalness: 1.0, roughness: 0.0, color: 0xffffff })
    );
    sphere1.position.set(-2.5, 0, 0);
    scene.add(sphere1);

    const sphere2 = new THREE.Mesh(
      sphereGeo,
      new THREE.MeshStandardMaterial({ metalness: 1.0, roughness: 0.3, color: 0xffffff })
    );
    sphere2.position.set(0, 0, 0);
    scene.add(sphere2);

    const sphere3 = new THREE.Mesh(
      sphereGeo,
      new THREE.MeshStandardMaterial({ metalness: 0.0, roughness: 0.1, color: '#4488ff' })
    );
    sphere3.position.set(2.5, 0, 0);
    scene.add(sphere3);

    const ground = new THREE.Mesh(
      planeGeo,
      new THREE.MeshStandardMaterial({ metalness: 0.2, roughness: 0.5, color: '#888888' })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.2;
    scene.add(ground);

    const toneMappingModes = [
      { name: 'ACES Filmic', value: THREE.ACESFilmicToneMapping },
      { name: 'Reinhard', value: THREE.ReinhardToneMapping },
      { name: 'Linear', value: THREE.LinearToneMapping },
      { name: 'Cineon', value: THREE.CineonToneMapping },
    ];

    function applyToneMappingByName(name) {
      const mode = toneMappingModes.find(m => m.name === name) || toneMappingModes[0];
      renderer.toneMapping = mode.value;
      ui.toneMapping.value = mode.name;
    }

    function cycleToneMapping() {
      const idx = toneMappingModes.findIndex(m => m.name === ui.toneMapping.value);
      const next = toneMappingModes[(idx + 1 + toneMappingModes.length) % toneMappingModes.length];
      applyToneMappingByName(next.name);
    }

    function setExposure(value) {
      const v = clamp(parseFloat(value), 0.1, 5.0);
      renderer.toneMappingExposure = v;
      ui.exposure.value = v.toFixed(1);
    }

    function resetRotations() {
      ui.rotA.value = '0';
      ui.rotB.value = '0';
      ui.rotC.value = '0';
    }

    function resetAll() {
      ui.sliderA.value = '100';
      ui.sliderB.value = '0';
      ui.sliderC.value = '0';
      resetRotations();
      applyToneMappingByName('ACES Filmic');
      setExposure(1.0);
      roughnessAnimActive = false;
      sphere2.material.roughness = 0.3;
      blendEnvironments();
    }

    ui.sliderA.addEventListener('input', blendEnvironments);
    ui.sliderB.addEventListener('input', blendEnvironments);
    ui.sliderC.addEventListener('input', blendEnvironments);
    ui.rotA.addEventListener('input', blendEnvironments);
    ui.rotB.addEventListener('input', blendEnvironments);
    ui.rotC.addEventListener('input', blendEnvironments);

    ui.toneMapping.addEventListener('change', () => {
      applyToneMappingByName(ui.toneMapping.value);
    });

    ui.exposure.addEventListener('input', () => {
      setExposure(ui.exposure.value);
    });

    ui.reset.addEventListener('click', () => {
      resetAll();
    });

    ui.equalBlend.addEventListener('click', () => {
      ui.sliderA.value = '33';
      ui.sliderB.value = '33';
      ui.sliderC.value = '33';
      blendEnvironments();
    });

    let roughnessAnimActive = false;
    const clock = new THREE.Clock();

    window.__3D_STATE__ = {
      envWeights: { a: 100, b: 0, c: 0 },
      normalizedWeights: { a: 1.0, b: 0.0, c: 0.0 },
      envRotations: { a: 0, b: 0, c: 0 },
      toneMapping: 'ACES Filmic',
      exposure: 1.0,
      sphereRoughness: [0, 0.3, 0.1],
      sphereMetalness: [1.0, 1.0, 0.0],
      roughnessAnimActive: false,
      cameraPosition: { x: 0, y: 0, z: 5 },
      blendedEnvApplied: false,
      backgroundIsEnv: false,
      objectCount: 0,
      groundPlaneY: -1.2,
      snapshot: null,
      frameCount: 0,
      weightsSum: 1.0
    };

    function buildState() {
      const raw = getRawWeights();
      const norm = getNormalizedWeights();

      let meshCount = 0;
      scene.traverse(obj => {
        if (obj.isMesh) meshCount++;
      });

      return {
        envWeights: {
          a: raw.a,
          b: raw.b,
          c: raw.c
        },
        normalizedWeights: {
          a: parseFloat(norm.a.toFixed(3)),
          b: parseFloat(norm.b.toFixed(3)),
          c: parseFloat(norm.c.toFixed(3))
        },
        envRotations: {
          a: parseFloat(ui.rotA.value),
          b: parseFloat(ui.rotB.value),
          c: parseFloat(ui.rotC.value)
        },
        toneMapping: ui.toneMapping.value,
        exposure: parseFloat(renderer.toneMappingExposure.toFixed(2)),
        sphereRoughness: [
          parseFloat(sphere1.material.roughness.toFixed(3)),
          parseFloat(sphere2.material.roughness.toFixed(3)),
          parseFloat(sphere3.material.roughness.toFixed(3))
        ],
        sphereMetalness: [
          parseFloat(sphere1.material.metalness.toFixed(3)),
          parseFloat(sphere2.material.metalness.toFixed(3)),
          parseFloat(sphere3.material.metalness.toFixed(3))
        ],
        roughnessAnimActive,
        cameraPosition: {
          x: parseFloat(camera.position.x.toFixed(2)),
          y: parseFloat(camera.position.y.toFixed(2)),
          z: parseFloat(camera.position.z.toFixed(2))
        },
        blendedEnvApplied: scene.environment === (currentPmremRT && currentPmremRT.texture),
        backgroundIsEnv: scene.background === scene.environment,
        objectCount: meshCount,
        groundPlaneY: parseFloat(ground.position.y.toFixed(2)),
        snapshot: window.__3D_STATE__.snapshot,
        frameCount: window.__3D_STATE__.frameCount,
        weightsSum: parseFloat((norm.a + norm.b + norm.c).toFixed(3))
      };
    }

    ui.snapshot.addEventListener('click', () => {
      const current = buildState();
      const snap = JSON.parse(JSON.stringify({
        ...current,
        snapshot: null
      }));
      window.__3D_STATE__.snapshot = snap;
    });

    window.addEventListener('keydown', (e) => {
      if (e.target && ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;

      const key = e.key;

      if (key === '1') {
        ui.sliderA.value = '100';
        ui.sliderB.value = '0';
        ui.sliderC.value = '0';
        blendEnvironments();
      } else if (key === '2') {
        ui.sliderA.value = '0';
        ui.sliderB.value = '100';
        ui.sliderC.value = '0';
        blendEnvironments();
      } else if (key === '3') {
        ui.sliderA.value = '0';
        ui.sliderB.value = '0';
        ui.sliderC.value = '100';
        blendEnvironments();
      } else if (key === 'r' || key === 'R') {
        resetRotations();
        blendEnvironments();
      } else if (key === 'e' || key === 'E') {
        cycleToneMapping();
      } else if (key === '+' || key === '=') {
        setExposure(parseFloat(ui.exposure.value) + 0.2);
      } else if (key === '-' || key === '_') {
        setExposure(parseFloat(ui.exposure.value) - 0.2);
      } else if (key === ' ') {
        e.preventDefault();
        roughnessAnimActive = !roughnessAnimActive;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    applyToneMappingByName('ACES Filmic');
    setExposure(1.0);
    blendEnvironments();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      if (roughnessAnimActive) {
        const t = (Math.sin((elapsed / 3.0) * Math.PI * 2.0) * 0.5 + 0.5);
        sphere2.material.roughness = t;
      }

      controls.update();
      renderer.render(scene, camera);

      window.__3D_STATE__.frameCount = (window.__3D_STATE__.frameCount || 0) + 1;
      const latest = buildState();
      latest.frameCount = window.__3D_STATE__.frameCount;
      if (window.__3D_STATE__.snapshot) latest.snapshot = window.__3D_STATE__.snapshot;
      window.__3D_STATE__ = latest;
    }

    animate();
  </script>
</body>
</html>
