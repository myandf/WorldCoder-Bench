<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js Parametric Vignette with Robot</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #controlPanel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 240px;
      background: rgba(20, 20, 20, 0.78);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      box-sizing: border-box;
      z-index: 10;
      user-select: none;
    }
    #controlPanel h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 600;
    }
    #controlPanel .section {
      margin-bottom: 12px;
    }
    #controlPanel .sectionTitle {
      font-size: 13px;
      margin-bottom: 6px;
      color: #cfcfcf;
    }
    #controlPanel .buttonGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    #controlPanel button {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #666;
      border-radius: 6px;
      padding: 7px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    #controlPanel button.active {
      border: 2px solid #00ff88;
      padding: 6px 7px;
    }
    #controlPanel .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    #controlPanel input[type="range"] {
      width: 100%;
      margin: 4px 0 8px 0;
    }
    #controlPanel input[type="color"] {
      width: 100%;
      height: 34px;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    #status {
      position: absolute;
      bottom: 10px;
      left: 12px;
      color: #bbb;
      background: rgba(0,0,0,0.45);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="controlPanel">
    <h3>Vignette Controls</h3>

    <div class="section">
      <div class="sectionTitle">Shape</div>
      <div class="buttonGrid">
        <button id="btnCircle">Circle</button>
        <button id="btnEllipse">Ellipse</button>
        <button id="btnDiamond">Diamond</button>
        <button id="btnRect">Rect</button>
      </div>
    </div>

    <div class="section">
      <div class="sectionTitle">Falloff Curve</div>
      <div class="buttonGrid">
        <button id="btnSmooth">Smooth</button>
        <button id="btnLinear">Linear</button>
        <button id="btnQuadratic">Quadratic</button>
        <button id="btnCosine">Cosine</button>
      </div>
    </div>

    <div class="section">
      <div class="row">
        <span>Intensity</span>
        <span id="labelIntensity">0.70</span>
      </div>
      <input id="sliderIntensity" type="range" min="0" max="1.5" step="0.05" value="0.7" />
    </div>

    <div class="section">
      <div class="row">
        <span>Radius</span>
        <span id="labelRadius">0.50</span>
      </div>
      <input id="sliderRadius" type="range" min="0.1" max="1.0" step="0.05" value="0.5" />
    </div>

    <div class="section">
      <div class="row">
        <span>Softness</span>
        <span id="labelSoftness">0.50</span>
      </div>
      <input id="sliderSoftness" type="range" min="0.1" max="1.0" step="0.05" value="0.5" />
    </div>

    <div class="section">
      <div class="sectionTitle">Vignette Color</div>
      <input id="colorPicker" type="color" value="#000000" />
    </div>

    <div class="section">
      <button id="btnReset" style="width:100%;">Reset Defaults</button>
    </div>
  </div>

  <div id="status">Loading RobotExpressive.glb...</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';

    const WIDTH = 1024;
    const HEIGHT = 768;

    const DEFAULTS = {
      intensity: 0.7,
      radius: 0.5,
      softness: 0.5,
      shape: 0,
      curve: 0,
      vignetteColor: '#000000'
    };

    const SHAPE_NAMES = ['circle', 'ellipse', 'diamond', 'rect'];
    const CURVE_NAMES = ['smooth', 'linear', 'quadratic', 'cosine'];

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(WIDTH, HEIGHT);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1d);

    const camera = new THREE.PerspectiveCamera(50, WIDTH / HEIGHT, 0.1, 100);
    camera.position.set(0, 1.5, 4);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(3, 5, 3);
    scene.add(directionalLight);

    const grid = new THREE.GridHelper(6, 6, 0x444444, 0x444444);
    grid.position.y = 0;
    grid.material.transparent = true;
    grid.material.opacity = 0.45;
    scene.add(grid);

    let mixer = null;
    let robotRoot = null;
    let modelLoaded = false;
    let animationPlaying = false;

    const statusEl = document.getElementById('status');

    const vignetteShader = {
      uniforms: {
        tDiffuse: { value: null },
        u_intensity: { value: DEFAULTS.intensity },
        u_radius: { value: DEFAULTS.radius },
        u_softness: { value: DEFAULTS.softness },
        u_shape: { value: DEFAULTS.shape },
        u_curve: { value: DEFAULTS.curve },
        u_vignetteColor: { value: new THREE.Color(DEFAULTS.vignetteColor) },
        u_resolution: { value: new THREE.Vector2(WIDTH, HEIGHT) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float u_intensity;
        uniform float u_radius;
        uniform float u_softness;
        uniform int u_shape;
        uniform int u_curve;
        uniform vec3 u_vignetteColor;
        uniform vec2 u_resolution;
        varying vec2 vUv;

        float sdRoundedBox(vec2 p, vec2 b, float r) {
          vec2 q = abs(p) - b + vec2(r);
          return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
        }

        float shapeDistance(vec2 uv) {
          vec2 p = uv - 0.5;
          float aspect = u_resolution.x / u_resolution.y;
          p.x *= aspect;

          if (u_shape == 0) {
            return length(p) / 0.70710678;
          } else if (u_shape == 1) {
            vec2 e = vec2(1.5, 1.0);
            vec2 q = vec2(p.x / e.x, p.y / e.y);
            return length(q) / 0.70710678;
          } else if (u_shape == 2) {
            return (abs(p.x) + abs(p.y)) / 0.70710678;
          } else {
            float d = sdRoundedBox(p, vec2(0.42 * aspect, 0.42), 0.12);
            return max(d + 0.5, 0.0) / 0.5;
          }
        }

        float applyCurve(float t) {
          t = clamp(t, 0.0, 1.0);
          if (u_curve == 0) {
            return smoothstep(0.0, 1.0, t);
          } else if (u_curve == 1) {
            return t;
          } else if (u_curve == 2) {
            return t * t;
          } else {
            return 0.5 - 0.5 * cos(t * 3.14159265);
          }
        }

        void main() {
          vec4 sceneColor = texture2D(tDiffuse, vUv);
          float d = shapeDistance(vUv);
          float t = (d - u_radius) / max(u_softness, 0.0001);
          float vignette = applyCurve(t);
          float amt = clamp(vignette * u_intensity, 0.0, 1.0);
          vec3 color = mix(sceneColor.rgb, u_vignetteColor, amt);
          gl_FragColor = vec4(color, sceneColor.a);
        }
      `
    };

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    const vignettePass = new ShaderPass(vignetteShader);
    composer.addPass(renderPass);
    composer.addPass(vignettePass);
    composer.setSize(WIDTH, HEIGHT);

    const state = {
      shape: DEFAULTS.shape,
      curve: DEFAULTS.curve,
      intensity: DEFAULTS.intensity,
      radius: DEFAULTS.radius,
      softness: DEFAULTS.softness,
      vignetteColor: DEFAULTS.vignetteColor
    };

    const els = {
      btnCircle: document.getElementById('btnCircle'),
      btnEllipse: document.getElementById('btnEllipse'),
      btnDiamond: document.getElementById('btnDiamond'),
      btnRect: document.getElementById('btnRect'),
      btnSmooth: document.getElementById('btnSmooth'),
      btnLinear: document.getElementById('btnLinear'),
      btnQuadratic: document.getElementById('btnQuadratic'),
      btnCosine: document.getElementById('btnCosine'),
      sliderIntensity: document.getElementById('sliderIntensity'),
      sliderRadius: document.getElementById('sliderRadius'),
      sliderSoftness: document.getElementById('sliderSoftness'),
      labelIntensity: document.getElementById('labelIntensity'),
      labelRadius: document.getElementById('labelRadius'),
      labelSoftness: document.getElementById('labelSoftness'),
      colorPicker: document.getElementById('colorPicker'),
      btnReset: document.getElementById('btnReset')
    };

    function setShape(index) {
      state.shape = index;
      vignettePass.uniforms.u_shape.value = index;
      syncUI();
    }

    function setCurve(index) {
      state.curve = index;
      vignettePass.uniforms.u_curve.value = index;
      syncUI();
    }

    function setIntensity(value) {
      state.intensity = parseFloat(value);
      vignettePass.uniforms.u_intensity.value = state.intensity;
      syncUI();
    }

    function setRadius(value) {
      state.radius = parseFloat(value);
      vignettePass.uniforms.u_radius.value = state.radius;
      syncUI();
    }

    function setSoftness(value) {
      state.softness = parseFloat(value);
      vignettePass.uniforms.u_softness.value = state.softness;
      syncUI();
    }

    function setVignetteColor(hex) {
      state.vignetteColor = hex;
      vignettePass.uniforms.u_vignetteColor.value.set(hex);
      syncUI();
    }

    function resetDefaults() {
      setShape(DEFAULTS.shape);
      setCurve(DEFAULTS.curve);
      setIntensity(DEFAULTS.intensity);
      setRadius(DEFAULTS.radius);
      setSoftness(DEFAULTS.softness);
      setVignetteColor(DEFAULTS.vignetteColor);
    }

    function syncUI() {
      els.sliderIntensity.value = String(state.intensity);
      els.sliderRadius.value = String(state.radius);
      els.sliderSoftness.value = String(state.softness);
      els.colorPicker.value = state.vignetteColor;

      els.labelIntensity.textContent = state.intensity.toFixed(2);
      els.labelRadius.textContent = state.radius.toFixed(2);
      els.labelSoftness.textContent = state.softness.toFixed(2);

      const shapeButtons = [els.btnCircle, els.btnEllipse, els.btnDiamond, els.btnRect];
      shapeButtons.forEach((btn, i) => btn.classList.toggle('active', i === state.shape));

      const curveButtons = [els.btnSmooth, els.btnLinear, els.btnQuadratic, els.btnCosine];
      curveButtons.forEach((btn, i) => btn.classList.toggle('active', i === state.curve));
    }

    els.btnCircle.addEventListener('click', () => setShape(0));
    els.btnEllipse.addEventListener('click', () => setShape(1));
    els.btnDiamond.addEventListener('click', () => setShape(2));
    els.btnRect.addEventListener('click', () => setShape(3));

    els.btnSmooth.addEventListener('click', () => setCurve(0));
    els.btnLinear.addEventListener('click', () => setCurve(1));
    els.btnQuadratic.addEventListener('click', () => setCurve(2));
    els.btnCosine.addEventListener('click', () => setCurve(3));

    els.sliderIntensity.addEventListener('input', (e) => setIntensity(e.target.value));
    els.sliderRadius.addEventListener('input', (e) => setRadius(e.target.value));
    els.sliderSoftness.addEventListener('input', (e) => setSoftness(e.target.value));
    els.colorPicker.addEventListener('input', (e) => setVignetteColor(e.target.value));
    els.btnReset.addEventListener('click', resetDefaults);

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === '1') setShape(0);
      else if (key === '2') setShape(1);
      else if (key === '3') setShape(2);
      else if (key === '4') setShape(3);
      else if (key === 'q' || key === 'Q') setCurve(0);
      else if (key === 'w' || key === 'W') setCurve(1);
      else if (key === 'e' || key === 'E') setCurve(2);
      else if (key === 'r' || key === 'R') setCurve(3);
      else if (key === '0') resetDefaults();
    });

    syncUI();

    const loader = new GLTFLoader();
    loader.load(
      'RobotExpressive.glb',
      (gltf) => {
        robotRoot = gltf.scene;
        const box = new THREE.Box3().setFromObject(robotRoot);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        robotRoot.position.sub(center);

        const longestAxis = Math.max(size.x, size.y, size.z) || 1;
        const scale = 2 / longestAxis;
        robotRoot.scale.setScalar(scale);

        const scaledBox = new THREE.Box3().setFromObject(robotRoot);
        const minY = scaledBox.min.y;
        robotRoot.position.y -= minY;

        scene.add(robotRoot);
        modelLoaded = true;
        statusEl.textContent = 'RobotExpressive.glb loaded';

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(robotRoot);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
          animationPlaying = true;
          statusEl.textContent = 'RobotExpressive.glb loaded, animation playing';
        } else {
          animationPlaying = false;
        }
      },
      undefined,
      (err) => {
        console.error('Failed to load RobotExpressive.glb', err);
        statusEl.textContent = 'Failed to load RobotExpressive.glb';
      }
    );

    const clock = new THREE.Clock();

    window.__3D_STATE__ = {
      modelLoaded: false,
      animationPlaying: false,
      shape: state.shape,
      shapeName: SHAPE_NAMES[state.shape],
      curve: state.curve,
      curveName: CURVE_NAMES[state.curve],
      intensity: state.intensity,
      radius: state.radius,
      softness: state.softness,
      vignetteColor: state.vignetteColor,
      composerEnabled: true,
      passCount: composer.passes.length,
      cameraPosition: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
      frameCount: 0
    };

    function updateTestState() {
      window.__3D_STATE__.modelLoaded = modelLoaded;
      window.__3D_STATE__.animationPlaying = animationPlaying;
      window.__3D_STATE__.shape = state.shape;
      window.__3D_STATE__.shapeName = SHAPE_NAMES[state.shape];
      window.__3D_STATE__.curve = state.curve;
      window.__3D_STATE__.curveName = CURVE_NAMES[state.curve];
      window.__3D_STATE__.intensity = state.intensity;
      window.__3D_STATE__.radius = state.radius;
      window.__3D_STATE__.softness = state.softness;
      window.__3D_STATE__.vignetteColor = state.vignetteColor;
      window.__3D_STATE__.composerEnabled = true;
      window.__3D_STATE__.passCount = composer.passes.length;
      window.__3D_STATE__.cameraPosition = {
        x: camera.position.x,
        y: camera.position.y,
        z: camera.position.z
      };
      window.__3D_STATE__.frameCount += 1;
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      controls.update();

      if (mixer) {
        mixer.update(delta);
      }

      composer.render();
      updateTestState();
    }

    animate();
  </script>
</body>
</html>
