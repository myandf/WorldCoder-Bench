<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR Spectroscopy Viewer</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      color: #eaf6ff;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1a1a2e;
    }
    #threeCanvas {
      position: absolute;
      inset: 0;
      display: block;
    }
    #chartCanvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 50vw;
      height: 100vh;
      pointer-events: auto;
      z-index: 5;
    }
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #titleBlock {
      position: absolute;
      top: 12px;
      left: 14px;
      pointer-events: none;
    }
    #titleBlock h1 {
      margin: 0;
      font-size: 24px;
      color: #ffffff;
    }
    #subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #9fe8ff;
      min-height: 18px;
    }
    #peakCount {
      position: absolute;
      top: 74px;
      left: 14px;
      font-size: 13px;
      color: #cfd8ff;
    }
    #modeIndicator {
      position: absolute;
      top: 94px;
      left: 14px;
      font-size: 13px;
      color: #ffd166;
    }
    #infoPanel {
      position: absolute;
      top: 126px;
      left: 14px;
      width: 320px;
      max-width: calc(50vw - 28px);
      background: rgba(8, 12, 22, 0.82);
      border: 1px solid rgba(0,255,255,0.35);
      border-radius: 10px;
      padding: 12px 14px;
      color: #eefbff;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 0 18px rgba(0,255,255,0.12);
      pointer-events: none;
      white-space: pre-line;
    }
    #controlsPanel {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: 340px;
      max-width: calc(50vw - 28px);
      background: rgba(8, 12, 22, 0.82);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      padding: 12px;
      z-index: 12;
      pointer-events: auto;
      box-sizing: border-box;
    }
    #controlsPanel .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    button {
      background: #233554;
      color: #eef6ff;
      border: 1px solid #4f6b99;
      border-radius: 7px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #2d456d;
    }
    input[type="range"] {
      width: 150px;
    }
    #noiseValue {
      color: #9fe8ff;
      min-width: 40px;
      display: inline-block;
    }
    #sampleLabel {
      position: absolute;
      right: 40px;
      top: 18px;
      color: #ffffff;
      font-size: 16px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    #chartHint {
      color: #b9c6e3;
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="threeCanvas"></canvas>
    <canvas id="chartCanvas"></canvas>

    <div id="hud">
      <div id="titleBlock">
        <h1>IR Spectroscopy Viewer</h1>
        <div id="subtitle">No peak selected</div>
      </div>
      <div id="peakCount">Peaks: 8</div>
      <div id="modeIndicator">Mode: Normal</div>
      <div id="infoPanel">Select a peak by clicking the chart or pressing keys 1-8.</div>
      <div id="sampleLabel">Material Sample</div>
    </div>

    <div id="controlsPanel">
      <div class="row">
        <button id="analyzeBtn">Analyze Peak</button>
        <button id="compareBtn">Compare Peaks</button>
      </div>
      <div class="row">
        <label for="noiseSlider">Noise</label>
        <input id="noiseSlider" type="range" min="0" max="20" value="0" />
        <span id="noiseValue">0%</span>
      </div>
      <div id="chartHint">
        Click near a peak to select. Keys: 1-8 select peaks, N/P cycle, Z zoom, R reset.
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/loaders/GLTFLoader.js";

    const PEAK_WAVENUMBERS = [3350, 2920, 2850, 1730, 1640, 1450, 1240, 1050];
    const PEAK_DEPTHS = [25, 40, 45, 15, 30, 50, 35, 20];
    const PEAK_SIGMAS = [80, 40, 35, 60, 50, 45, 55, 70];
    const PEAK_LABELS = [
      "O-H stretch",
      "C-H asym stretch",
      "C-H sym stretch",
      "C=O stretch",
      "C=C stretch",
      "C-H bend",
      "C-O-C asym",
      "C-O stretch"
    ];
    const PEAK_COLORS = [
      "#ff0000",
      "#ff7f00",
      "#ffff00",
      "#00ff00",
      "#00ffff",
      "#0000ff",
      "#4b0082",
      "#8f00ff"
    ];

    const app = document.getElementById("app");
    const threeCanvas = document.getElementById("threeCanvas");
    const chartCanvas = document.getElementById("chartCanvas");
    const chartCtx = chartCanvas.getContext("2d");
    const subtitle = document.getElementById("subtitle");
    const infoPanel = document.getElementById("infoPanel");
    const peakCountEl = document.getElementById("peakCount");
    const modeIndicator = document.getElementById("modeIndicator");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const compareBtn = document.getElementById("compareBtn");
    const noiseSlider = document.getElementById("noiseSlider");
    const noiseValue = document.getElementById("noiseValue");

    const state = window.__3D_STATE__ = {
      peaks: PEAK_WAVENUMBERS.map((w, i) => ({
        wavenumber: w,
        transmittance: PEAK_DEPTHS[i],
        sigma: PEAK_SIGMAS[i],
        label: PEAK_LABELS[i],
        fwhm: null
      })),
      selectedPeakIndex: -1,
      previousPeakIndex: -1,
      zoomMode: false,
      compareMode: false,
      noiseLevel: 0,
      modelLoaded: false,
      modelEmissiveColor: null,
      chartRendered: false,
      fwhmComputed: null,
      peakColors: [...PEAK_COLORS],
      comparisonData: null,
      interactionCount: 0,
      zoomRange: { min: 400, max: 4000 }
    };

    peakCountEl.textContent = `Peaks: ${state.peaks.length}`;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const dir1 = new THREE.DirectionalLight(0xfff3dd, 0.8);
    dir1.position.set(3, 5, 3);
    scene.add(dir1);

    const dir2 = new THREE.DirectionalLight(0xaaccff, 0.5);
    dir2.position.set(-3, 2, -3);
    scene.add(dir2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(1.5, 0.2, 0);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 2.2;
    controls.maxDistance = 8;
    controls.maxPolarAngle = Math.PI * 0.9;

    let sampleRoot = null;
    let modelAutoRotate = true;
    let interactivelyRotating = false;
    let sampleMaterials = [];
    let lastNoiseSeed = 0;

    controls.addEventListener("start", () => {
      interactivelyRotating = true;
      modelAutoRotate = false;
    });
    controls.addEventListener("end", () => {
      interactivelyRotating = false;
    });

    const fallbackGroup = new THREE.Group();
    const sphere = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.55, 2),
      new THREE.MeshStandardMaterial({ color: 0x9099aa, roughness: 0.4, metalness: 0.35 })
    );
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.8, 0.06, 16, 120),
      new THREE.MeshStandardMaterial({ color: 0x4fc3f7, roughness: 0.35, metalness: 0.5 })
    );
    ring.rotation.x = Math.PI / 2.5;
    fallbackGroup.add(sphere, ring);

    function setModelGroup(root) {
      if (sampleRoot) scene.remove(sampleRoot);
      sampleRoot = root;
      scene.add(sampleRoot);
      centerAndScaleModel(sampleRoot);
      sampleRoot.position.x = 1.5;
      sampleRoot.position.y = 0;
      sampleRoot.position.z = 0;
      sampleMaterials = [];
      sampleRoot.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach(mat => {
            if (!mat.emissive) mat.emissive = new THREE.Color(0x000000);
            if (mat.emissiveIntensity === undefined) mat.emissiveIntensity = 1;
            sampleMaterials.push(mat);
          });
        }
      });
      state.modelLoaded = true;
      updateModelEmissive();
    }

    function centerAndScaleModel(root) {
      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      root.position.sub(center);
      const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
      const scale = 1.5 / radius;
      root.scale.setScalar(scale);
      const scaledBox = new THREE.Box3().setFromObject(root);
      const minY = scaledBox.min.y;
      root.position.y -= minY;
    }

    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      "MaterialsVariantsShoe.glb",
      (gltf) => {
        setModelGroup(gltf.scene);
      },
      undefined,
      () => {
        setModelGroup(fallbackGroup);
      }
    );

    function incrementInteraction() {
      state.interactionCount += 1;
    }

    function getModeText() {
      if (state.compareMode) return "Compare";
      if (state.zoomMode) return "Zoom";
      return "Normal";
    }

    function updateModeIndicator() {
      modeIndicator.textContent = `Mode: ${getModeText()}`;
    }

    function deterministicNoiseAt(x, level) {
      if (level <= 0) return 0;
      const a = Math.sin(x * 0.017 + lastNoiseSeed * 0.31) * 43758.5453;
      const b = Math.sin(x * 0.043 + 7.13 + lastNoiseSeed * 0.77) * 24634.6345;
      const u1 = Math.max(0.0001, a - Math.floor(a));
      const u2 = Math.max(0.0001, b - Math.floor(b));
      const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
      return z0 * level;
    }

    function baselineAtWavenumber(w) {
      let t = 95;
      for (let i = 0; i < state.peaks.length; i++) {
        const p = state.peaks[i];
        const amp = 95 - p.transmittance;
        const g = amp * Math.exp(-0.5 * Math.pow((w - p.wavenumber) / p.sigma, 2));
        t -= g;
      }
      t += deterministicNoiseAt(w, state.noiseLevel);
      return Math.max(0, Math.min(100, t));
    }

    function getChartRange() {
      if (state.zoomMode && state.selectedPeakIndex >= 0) {
        const center = state.peaks[state.selectedPeakIndex].wavenumber;
        const min = Math.max(400, center - 200);
        const max = Math.min(4000, center + 200);
        state.zoomRange = { min, max };
        return state.zoomRange;
      }
      state.zoomRange = { min: 400, max: 4000 };
      return state.zoomRange;
    }

    function waveToX(w, dims) {
      const { min, max } = getChartRange();
      const frac = (max - w) / (max - min);
      return dims.left + frac * dims.plotW;
    }

    function transToY(t, dims) {
      return dims.top + (100 - t) / 100 * dims.plotH;
    }

    function xToWave(x, dims) {
      const { min, max } = getChartRange();
      const frac = (x - dims.left) / dims.plotW;
      return max - frac * (max - min);
    }

    function resizeChartCanvas() {
      const dpr = Math.min(window.devicePixelRatio, 2);
      chartCanvas.width = Math.floor(window.innerWidth * 0.5 * dpr);
      chartCanvas.height = Math.floor(window.innerHeight * dpr);
      chartCanvas.style.width = "50vw";
      chartCanvas.style.height = "100vh";
      chartCtx.setTransform(1, 0, 0, 1, 0, 0);
      chartCtx.scale(dpr, dpr);
    }

    function getChartDims() {
      const width = window.innerWidth * 0.5;
      const height = window.innerHeight;
      return {
        width,
        height,
        left: 64,
        right: 20,
        top: 64,
        bottom: 88,
        plotW: width - 64 - 20,
        plotH: height - 64 - 88
      };
    }

    function updateSubtitle() {
      if (state.selectedPeakIndex < 0) {
        subtitle.textContent = "No peak selected";
        return;
      }
      const p = state.peaks[state.selectedPeakIndex];
      subtitle.textContent = `Selected Peak ${state.selectedPeakIndex + 1}: ${p.wavenumber} cm⁻¹ • ${p.label}`;
    }

    function updateComparisonData() {
      if (!state.compareMode || state.selectedPeakIndex < 0 || state.previousPeakIndex < 0 || state.previousPeakIndex === state.selectedPeakIndex) {
        state.comparisonData = null;
        return;
      }
      const a = state.peaks[state.previousPeakIndex];
      const b = state.peaks[state.selectedPeakIndex];
      state.comparisonData = {
        deltaWavenumber: Math.abs(a.wavenumber - b.wavenumber),
        deltaTransmittance: Math.abs(a.transmittance - b.transmittance)
      };
    }

    function updateInfoPanel() {
      if (state.selectedPeakIndex < 0) {
        infoPanel.textContent = "Select a peak by clicking the chart or pressing keys 1-8.";
        return;
      }
      const p = state.peaks[state.selectedPeakIndex];
      let text = "";
      text += `Peak Index: ${state.selectedPeakIndex + 1}\n`;
      text += `Wavenumber: ${p.wavenumber} cm⁻¹\n`;
      text += `Transmittance Min: ${p.transmittance}%\n`;
      text += `Bond Assignment: ${p.label}\n`;
      text += `Width (σ): ${p.sigma} cm⁻¹\n`;
      text += `FWHM: ${p.fwhm !== null ? p.fwhm.toFixed(2) + " cm⁻¹" : "Not analyzed"}`;
      if (state.compareMode && state.comparisonData) {
        text += `\n\nComparison with Peak ${state.previousPeakIndex + 1}:\n`;
        text += `Δ Wavenumber: ${state.comparisonData.deltaWavenumber} cm⁻¹\n`;
        text += `Δ Transmittance: ${state.comparisonData.deltaTransmittance}%`;
      }
      infoPanel.textContent = text;
    }

    function updateModelEmissive() {
      let hex = null;
      if (state.selectedPeakIndex >= 0) {
        hex = state.peakColors[state.selectedPeakIndex];
      }
      state.modelEmissiveColor = hex;
      if (!sampleMaterials.length) return;
      sampleMaterials.forEach((mat) => {
        if (hex) {
          mat.emissive.set(hex);
          mat.emissiveIntensity = 0.85;
        } else {
          mat.emissive.set(0x000000);
          mat.emissiveIntensity = 0;
        }
      });
    }

    function selectPeak(index) {
      if (index < 0 || index >= state.peaks.length) return;
      if (state.selectedPeakIndex !== -1 && state.selectedPeakIndex !== index) {
        state.previousPeakIndex = state.selectedPeakIndex;
      }
      state.selectedPeakIndex = index;
      updateComparisonData();
      updateSubtitle();
      updateInfoPanel();
      updateModelEmissive();
      updateModeIndicator();
      drawChart();
    }

    function resetAll() {
      state.selectedPeakIndex = -1;
      state.previousPeakIndex = -1;
      state.zoomMode = false;
      state.compareMode = false;
      state.fwhmComputed = null;
      state.comparisonData = null;
      state.zoomRange = { min: 400, max: 4000 };
      state.peaks.forEach(p => p.fwhm = null);
      if (sampleRoot) {
        sampleRoot.rotation.set(0, 0, 0);
      }
      controls.target.set(1.5, 0.2, 0);
      camera.position.set(0, 1.5, 4);
      controls.update();
      modelAutoRotate = true;
      updateSubtitle();
      updateInfoPanel();
      updateModelEmissive();
      updateModeIndicator();
      drawChart();
    }

    function analyzeSelectedPeak() {
      if (state.selectedPeakIndex < 0) return;
      const p = state.peaks[state.selectedPeakIndex];
      const fwhm = 2.3548 * p.sigma;
      p.fwhm = fwhm;
      state.fwhmComputed = fwhm;
      updateInfoPanel();
      drawChart();
    }

    function drawChart() {
      const dims = getChartDims();
      const ctx = chartCtx;
      ctx.clearRect(0, 0, dims.width, dims.height);

      const bgGrad = ctx.createLinearGradient(0, 0, 0, dims.height);
      bgGrad.addColorStop(0, "rgba(18,24,44,0.92)");
      bgGrad.addColorStop(1, "rgba(10,14,28,0.75)");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, dims.width, dims.height);

      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 10; i++) {
        const y = dims.top + (i / 10) * dims.plotH;
        ctx.beginPath();
        ctx.moveTo(dims.left, y);
        ctx.lineTo(dims.left + dims.plotW, y);
        ctx.stroke();
      }

      const range = getChartRange();
      const xTicks = state.zoomMode ? 8 : 9;
      for (let i = 0; i <= xTicks; i++) {
        const x = dims.left + (i / xTicks) * dims.plotW;
        ctx.beginPath();
        ctx.moveTo(x, dims.top);
        ctx.lineTo(x, dims.top + dims.plotH);
        ctx.stroke();
      }

      ctx.strokeStyle = "#e5efff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(dims.left, dims.top);
      ctx.lineTo(dims.left, dims.top + dims.plotH);
      ctx.lineTo(dims.left + dims.plotW, dims.top + dims.plotH);
      ctx.stroke();

      ctx.fillStyle = "#dfe8ff";
      ctx.font = "12px Arial";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 5; i++) {
        const t = i * 20;
        const y = transToY(t, dims);
        ctx.fillText(String(t), dims.left - 8, y);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let i = 0; i <= xTicks; i++) {
        const w = range.max - (i / xTicks) * (range.max - range.min);
        const x = dims.left + (i / xTicks) * dims.plotW;
        ctx.fillText(Math.round(w).toString(), x, dims.top + dims.plotH + 8);
      }

      ctx.save();
      ctx.translate(18, dims.top + dims.plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = "#ffffff";
      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("% Transmittance", 0, 0);
      ctx.restore();

      ctx.fillStyle = "#ffffff";
      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Wavenumber (cm⁻¹)", dims.left + dims.plotW / 2, dims.height - 20);

      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(dims.left, transToY(95, dims));
      ctx.lineTo(dims.left + dims.plotW, transToY(95, dims));
      ctx.stroke();
      ctx.setLineDash([]);

      const steps = Math.max(600, Math.floor(dims.plotW * (state.zoomMode ? 2 : 1.2)));
      ctx.strokeStyle = "#9fe8ff";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const frac = i / steps;
        const w = range.max - frac * (range.max - range.min);
        const t = baselineAtWavenumber(w);
        const x = waveToX(w, dims);
        const y = transToY(t, dims);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      const highlighted = [];
      if (state.compareMode && state.previousPeakIndex >= 0 && state.selectedPeakIndex >= 0 && state.previousPeakIndex !== state.selectedPeakIndex) {
        highlighted.push({ index: state.previousPeakIndex, color: "#ff00ff" });
        highlighted.push({ index: state.selectedPeakIndex, color: "#00ffff" });
      } else if (state.selectedPeakIndex >= 0) {
        highlighted.push({ index: state.selectedPeakIndex, color: "#00ffff" });
      }

      state.peaks.forEach((p, i) => {
        if (p.wavenumber < range.min || p.wavenumber > range.max) return;
        const x = waveToX(p.wavenumber, dims);
        const y = transToY(p.transmittance, dims);
        const isSel = state.selectedPeakIndex === i;
        const compareEntry = highlighted.find(h => h.index === i);
        const color = compareEntry ? compareEntry.color : "#ffd166";

        ctx.strokeStyle = color;
        ctx.lineWidth = compareEntry || isSel ? 2.5 : 1.3;
        ctx.beginPath();
        ctx.moveTo(x, transToY(95, dims));
        ctx.lineTo(x, y);
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, compareEntry || isSel ? 5.5 : 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = compareEntry || isSel ? "bold 12px Arial" : "11px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(String(p.wavenumber), x, y - 8);

        ctx.textBaseline = "top";
        ctx.fillStyle = compareEntry ? color : "#c5d0ee";
        ctx.fillText(p.label, x, y + 8);
      });

      state.chartRendered = true;
    }

    chartCanvas.addEventListener("click", (e) => {
      incrementInteraction();
      const dims = getChartDims();
      const rect = chartCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const wave = xToWave(x, dims);

      let bestIndex = -1;
      let bestDist = Infinity;
      state.peaks.forEach((p, i) => {
        const d = Math.abs(p.wavenumber - wave);
        if (d < bestDist) {
          bestDist = d;
          bestIndex = i;
        }
      });

      if (bestDist <= 50) {
        selectPeak(bestIndex);
      }
    });

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      const num = parseInt(key, 10);
      const keysHandled = ["n", "p", "z", "r"];
      if ((num >= 1 && num <= 8) || keysHandled.includes(key)) {
        incrementInteraction();
      }

      if (num >= 1 && num <= 8) {
        selectPeak(num - 1);
        return;
      }
      if (key === "n") {
        const next = state.selectedPeakIndex < 0 ? 0 : (state.selectedPeakIndex + 1) % state.peaks.length;
        selectPeak(next);
        return;
      }
      if (key === "p") {
        const prev = state.selectedPeakIndex < 0 ? state.peaks.length - 1 : (state.selectedPeakIndex - 1 + state.peaks.length) % state.peaks.length;
        selectPeak(prev);
        return;
      }
      if (key === "z") {
        state.zoomMode = !state.zoomMode;
        updateModeIndicator();
        drawChart();
        return;
      }
      if (key === "r") {
        resetAll();
      }
    });

    analyzeBtn.addEventListener("click", () => {
      incrementInteraction();
      analyzeSelectedPeak();
    });

    compareBtn.addEventListener("click", () => {
      incrementInteraction();
      state.compareMode = !state.compareMode;
      updateComparisonData();
      updateModeIndicator();
      updateInfoPanel();
      drawChart();
    });

    noiseSlider.addEventListener("input", () => {
      incrementInteraction();
      state.noiseLevel = Number(noiseSlider.value);
      noiseValue.textContent = `${state.noiseLevel}%`;
      lastNoiseSeed = state.noiseLevel * 13.37 + 1;
      drawChart();
    });

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeChartCanvas();
      drawChart();
    }

    function pointerInRightHalf() {
      return true;
    }

    renderer.domElement.addEventListener("pointerdown", (e) => {
      const rightHalf = e.clientX >= window.innerWidth * 0.5;
      controls.enabled = rightHalf && pointerInRightHalf();
    });
    renderer.domElement.addEventListener("pointermove", (e) => {
      const rightHalf = e.clientX >= window.innerWidth * 0.5;
      if (!interactivelyRotating) controls.enabled = rightHalf;
    });
    renderer.domElement.addEventListener("pointerup", () => {
      controls.enabled = true;
    });

    resizeChartCanvas();
    updateModeIndicator();
    updateSubtitle();
    updateInfoPanel();
    drawChart();

    window.addEventListener("resize", onResize);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (sampleRoot && modelAutoRotate) {
        sampleRoot.rotation.y += dt * 0.45;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
