<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>God Rays Editor</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 320px;
      background: rgba(10, 12, 18, 0.86);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 14px 14px 12px;
      box-sizing: border-box;
      z-index: 10;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    #ui h2 {
      margin: 0 0 12px 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .row {
      margin-bottom: 10px;
    }
    .label-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .label-line span.value {
      color: #ffdba8;
      min-width: 64px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"], select, button {
      width: 100%;
      box-sizing: border-box;
    }
    input[type="range"] {
      accent-color: #f0c27b;
    }
    select, button {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }
    button {
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: rgba(255,255,255,0.13);
    }
    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #b8bfd0;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>God Rays Editor</h2>

    <div class="row" id="controls"></div>

    <div class="row">
      <div class="label-line">
        <label for="blendMode">Blend Mode</label>
      </div>
      <select id="blendMode">
        <option>Additive</option>
        <option>Screen</option>
        <option>Overlay</option>
      </select>
    </div>

    <div class="button-row">
      <button id="toggleRays">Rays: ON</button>
      <button id="resetBtn">Reset Defaults</button>
    </div>

    <div id="status">Loading model...</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/loaders/GLTFLoader.js';

    const DEFAULTS = {
      exposure: 0.3,
      decay: 0.96,
      density: 0.8,
      weight: 0.4,
      numSamples: 80,
      lightHeight: 3.0,
      lightRadius: 2.236,
      lightOrbitAngle: 27,
      raysEnabled: true,
      blendMode: 'Additive'
    };

    const params = { ...DEFAULTS };

    window.__3D_STATE__ = {
      modelLoaded: false,
      lightPosition: { x: 0, y: 0, z: 0 },
      lightScreenUV: { u: 0.5, v: 0.5 },
      exposure: params.exposure,
      decay: params.decay,
      density: params.density,
      weight: params.weight,
      numSamples: params.numSamples,
      lightHeight: params.lightHeight,
      lightRadius: params.lightRadius,
      lightOrbitAngle: params.lightOrbitAngle,
      raysEnabled: params.raysEnabled,
      blendMode: params.blendMode,
      occlusionRTWidth: 0,
      occlusionRTHeight: 0,
      frameCount: 0,
      compositeIntensity: params.exposure * params.weight,
      cameraDistance: 0,
      lightIntensity: 3.0
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0a0a0f, 1);
    renderer.autoClear = false;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.6, 0);

    const ambientLight = new THREE.AmbientLight(0x222233, 0.3);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffeedd, 3.0, 0, 2);
    scene.add(pointLight);

    const indicator = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 24, 24),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffeedd,
        emissiveIntensity: 3.0,
        toneMapped: false
      })
    );
    scene.add(indicator);

    const shoeGroup = new THREE.Group();
    scene.add(shoeGroup);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(6, 64),
      new THREE.MeshStandardMaterial({
        color: 0x111118,
        roughness: 1.0,
        metalness: 0.0
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.9;
    scene.add(floor);

    const loader = new GLTFLoader();
    const statusEl = document.getElementById('status');

    loader.load(
      'MaterialsVariantsShoe.glb',
      (gltf) => {
        const model = gltf.scene;
        shoeGroup.add(model);

        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        model.position.sub(center);

        const box2 = new THREE.Box3().setFromObject(shoeGroup);
        const size2 = new THREE.Vector3();
        const center2 = new THREE.Vector3();
        box2.getSize(size2);
        box2.getCenter(center2);

        const maxDim = Math.max(size2.x, size2.y, size2.z) || 1;
        const scale = 1.5 / maxDim;
        shoeGroup.scale.setScalar(scale);

        const box3 = new THREE.Box3().setFromObject(shoeGroup);
        box3.getCenter(center2);
        box3.getSize(size2);

        shoeGroup.position.sub(center2);
        shoeGroup.position.y += size2.y * 0.5 - 0.2;

        scene.add(shoeGroup);
        window.__3D_STATE__.modelLoaded = true;
        statusEl.textContent = 'Model loaded';
      },
      undefined,
      (err) => {
        console.error(err);
        statusEl.textContent = 'Failed to load model';
      }
    );

    function createRT(w, h) {
      return new THREE.WebGLRenderTarget(w, h, {
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat,
        type: THREE.UnsignedByteType,
        depthBuffer: true,
        stencilBuffer: false
      });
    }

    let occlusionRT = createRT(Math.max(1, Math.floor(window.innerWidth / 2)), Math.max(1, Math.floor(window.innerHeight / 2)));
    let godRaysRT = createRT(Math.max(1, Math.floor(window.innerWidth / 2)), Math.max(1, Math.floor(window.innerHeight / 2)));

    const postScene = new THREE.Scene();
    const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const quadGeo = new THREE.PlaneGeometry(2, 2);

    const godRayMaterial = new THREE.ShaderMaterial({
      uniforms: {
        tInput: { value: occlusionRT.texture },
        lightPositionOnScreen: { value: new THREE.Vector2(0.5, 0.5) },
        exposure: { value: params.exposure },
        decay: { value: params.decay },
        density: { value: params.density },
        weight: { value: params.weight },
        numSamples: { value: params.numSamples }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform sampler2D tInput;
        uniform vec2 lightPositionOnScreen;
        uniform float exposure;
        uniform float decay;
        uniform float density;
        uniform float weight;
        uniform int numSamples;

        void main() {
          vec2 texCoord = vUv;
          vec2 deltaTextCoord = (texCoord - lightPositionOnScreen);
          float ns = float(max(numSamples, 1));
          deltaTextCoord *= 1.0 / ns * density;

          vec3 color = vec3(0.0);
          float illuminationDecay = 1.0;
          vec2 coord = texCoord;

          for (int i = 0; i < 150; i++) {
            if (i >= numSamples) break;
            coord -= deltaTextCoord;
            vec3 sampleColor = texture2D(tInput, coord).rgb;
            sampleColor *= illuminationDecay * weight;
            color += sampleColor;
            illuminationDecay *= decay;
          }

          gl_FragColor = vec4(color * exposure, 1.0);
        }
      `,
      depthWrite: false,
      depthTest: false
    });

    const compositeMaterial = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: null },
        tGodRays: { value: godRaysRT.texture },
        enabled: { value: params.raysEnabled ? 1.0 : 0.0 },
        blendMode: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform sampler2D tScene;
        uniform sampler2D tGodRays;
        uniform float enabled;
        uniform int blendMode;

        vec3 blendScreen(vec3 base, vec3 blend) {
          return 1.0 - (1.0 - base) * (1.0 - blend);
        }

        vec3 blendOverlay(vec3 base, vec3 blend) {
          vec3 low = 2.0 * base * blend;
          vec3 high = 1.0 - 2.0 * (1.0 - base) * (1.0 - blend);
          return mix(low, high, step(0.5, base));
        }

        void main() {
          vec3 base = texture2D(tScene, vUv).rgb;
          vec3 rays = texture2D(tGodRays, vUv).rgb;

          vec3 outCol = base;
          if (enabled > 0.5) {
            if (blendMode == 0) {
              outCol = base + rays;
            } else if (blendMode == 1) {
              outCol = blendScreen(base, rays);
            } else {
              outCol = blendOverlay(base, rays);
            }
          }

          gl_FragColor = vec4(outCol, 1.0);
        }
      `,
      depthWrite: false,
      depthTest: false
    });

    const postQuad = new THREE.Mesh(quadGeo, godRayMaterial);
    postScene.add(postQuad);

    const occlusionScene = new THREE.Scene();
    occlusionScene.background = new THREE.Color(0x000000);

    const occlusionCamera = camera;

    const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });

    const occlusionGroup = new THREE.Group();
    occlusionScene.add(occlusionGroup);

    const occlusionLightSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.1, 24, 24),
      whiteMat
    );
    occlusionScene.add(occlusionLightSphere);

    function buildOcclusionClone() {
      while (occlusionGroup.children.length) {
        const c = occlusionGroup.children.pop();
        c.traverse((o) => {
          if (o.geometry) o.geometry.dispose?.();
        });
      }

      shoeGroup.traverse((obj) => {
        if (obj.isMesh) {
          const mesh = new THREE.Mesh(obj.geometry, blackMat);
          mesh.position.copy(obj.getWorldPosition(new THREE.Vector3()));
          mesh.quaternion.copy(obj.getWorldQuaternion(new THREE.Quaternion()));
          mesh.scale.copy(obj.getWorldScale(new THREE.Vector3()));
          occlusionGroup.add(mesh);
        }
      });
    }

    const mainSceneRT = createRT(window.innerWidth, window.innerHeight);

    const compositeScene = new THREE.Scene();
    const compositeQuad = new THREE.Mesh(quadGeo, compositeMaterial);
    compositeScene.add(compositeQuad);

    function resizeTargets() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      mainSceneRT.setSize(w, h);

      const hw = Math.max(1, Math.floor(w / 2));
      const hh = Math.max(1, Math.floor(h / 2));
      occlusionRT.setSize(hw, hh);
      godRaysRT.setSize(hw, hh);

      window.__3D_STATE__.occlusionRTWidth = hw;
      window.__3D_STATE__.occlusionRTHeight = hh;
    }

    window.addEventListener('resize', resizeTargets);
    resizeTargets();

    function updateLightFromParams() {
      const rad = THREE.MathUtils.degToRad(params.lightOrbitAngle);
      const x = params.lightRadius * Math.cos(rad);
      const y = params.lightHeight;
      const z = params.lightRadius * Math.sin(rad);

      pointLight.position.set(x, y, z);
      indicator.position.copy(pointLight.position);
      occlusionLightSphere.position.copy(pointLight.position);
    }

    updateLightFromParams();

    const controlsContainer = document.getElementById('controls');
    const toggleRaysBtn = document.getElementById('toggleRays');
    const resetBtn = document.getElementById('resetBtn');
    const blendModeSelect = document.getElementById('blendMode');

    const sliderDefs = [
      ['exposure', 'Exposure', 0.0, 1.0, 0.01],
      ['decay', 'Decay', 0.8, 1.0, 0.005],
      ['density', 'Density', 0.1, 2.0, 0.01],
      ['weight', 'Weight', 0.0, 1.0, 0.01],
      ['numSamples', 'Samples', 10, 150, 1],
      ['lightHeight', 'Light Height', 0.5, 6.0, 0.1],
      ['lightRadius', 'Light Radius', 0.5, 5.0, 0.1],
      ['lightOrbitAngle', 'Light Orbit Angle', 0, 360, 1]
    ];

    const sliderEls = {};

    function formatValue(key, val) {
      if (key === 'numSamples' || key === 'lightOrbitAngle') return String(Math.round(val));
      return Number(val).toFixed(key === 'decay' ? 3 : 2);
    }

    sliderDefs.forEach(([key, label, min, max, step]) => {
      const row = document.createElement('div');
      row.className = 'row';

      const line = document.createElement('div');
      line.className = 'label-line';

      const lab = document.createElement('label');
      lab.textContent = label;
      lab.htmlFor = key;

      const val = document.createElement('span');
      val.className = 'value';
      val.textContent = formatValue(key, params[key]);

      line.appendChild(lab);
      line.appendChild(val);

      const input = document.createElement('input');
      input.type = 'range';
      input.id = key;
      input.min = min;
      input.max = max;
      input.step = step;
      input.value = params[key];

      input.addEventListener('input', () => {
        params[key] = key === 'numSamples' || key === 'lightOrbitAngle'
          ? parseInt(input.value, 10)
          : parseFloat(input.value);
        val.textContent = formatValue(key, params[key]);
        syncParams();
      });

      row.appendChild(line);
      row.appendChild(input);
      controlsContainer.appendChild(row);

      sliderEls[key] = { input, valueEl: val };
    });

    blendModeSelect.value = params.blendMode;
    blendModeSelect.addEventListener('change', () => {
      params.blendMode = blendModeSelect.value;
      syncParams();
    });

    toggleRaysBtn.addEventListener('click', () => {
      params.raysEnabled = !params.raysEnabled;
      syncParams();
    });

    resetBtn.addEventListener('click', () => {
      Object.assign(params, DEFAULTS);
      for (const key in sliderEls) {
        sliderEls[key].input.value = params[key];
        sliderEls[key].valueEl.textContent = formatValue(key, params[key]);
      }
      blendModeSelect.value = params.blendMode;
      syncParams();
    });

    function blendModeToInt(mode) {
      if (mode === 'Screen') return 1;
      if (mode === 'Overlay') return 2;
      return 0;
    }

    function syncParams() {
      godRayMaterial.uniforms.exposure.value = params.exposure;
      godRayMaterial.uniforms.decay.value = params.decay;
      godRayMaterial.uniforms.density.value = params.density;
      godRayMaterial.uniforms.weight.value = params.weight;
      godRayMaterial.uniforms.numSamples.value = params.numSamples;

      compositeMaterial.uniforms.enabled.value = params.raysEnabled ? 1.0 : 0.0;
      compositeMaterial.uniforms.blendMode.value = blendModeToInt(params.blendMode);

      toggleRaysBtn.textContent = params.raysEnabled ? 'Rays: ON' : 'Rays: OFF';

      updateLightFromParams();
    }

    syncParams();

    const tempVec = new THREE.Vector3();

    function safeNum(n, fallback = 0) {
      return Number.isFinite(n) ? n : fallback;
    }

    function updateState(lightUV) {
      const lp = pointLight.position;
      window.__3D_STATE__.lightPosition = {
        x: safeNum(lp.x),
        y: safeNum(lp.y),
        z: safeNum(lp.z)
      };
      window.__3D_STATE__.lightScreenUV = {
        u: safeNum(lightUV.x, 0.5),
        v: safeNum(lightUV.y, 0.5)
      };
      window.__3D_STATE__.exposure = safeNum(params.exposure);
      window.__3D_STATE__.decay = safeNum(params.decay);
      window.__3D_STATE__.density = safeNum(params.density);
      window.__3D_STATE__.weight = safeNum(params.weight);
      window.__3D_STATE__.numSamples = Math.max(1, Math.round(safeNum(params.numSamples, 80)));
      window.__3D_STATE__.lightHeight = safeNum(params.lightHeight);
      window.__3D_STATE__.lightRadius = safeNum(params.lightRadius);
      window.__3D_STATE__.lightOrbitAngle = safeNum(params.lightOrbitAngle);
      window.__3D_STATE__.raysEnabled = !!params.raysEnabled;
      window.__3D_STATE__.blendMode = params.blendMode;
      window.__3D_STATE__.compositeIntensity = safeNum(params.exposure * params.weight);
      window.__3D_STATE__.cameraDistance = safeNum(camera.position.distanceTo(new THREE.Vector3(0, 0, 0)));
      window.__3D_STATE__.lightIntensity = safeNum(pointLight.intensity);
      window.__3D_STATE__.occlusionRTWidth = occlusionRT.width;
      window.__3D_STATE__.occlusionRTHeight = occlusionRT.height;
      window.__3D_STATE__.frameCount++;
    }

    function projectLightToScreenUV() {
      tempVec.copy(pointLight.position).project(camera);
      const u = tempVec.x * 0.5 + 0.5;
      const v = tempVec.y * 0.5 + 0.5;
      return new THREE.Vector2(
        safeNum(u, 0.5),
        safeNum(v, 0.5)
      );
    }

    function renderOcclusionPass() {
      occlusionScene.background.set(0x000000);

      if (window.__3D_STATE__.modelLoaded) {
        buildOcclusionClone();
      }

      renderer.setRenderTarget(occlusionRT);
      renderer.clear(true, true, true);
      renderer.render(occlusionScene, occlusionCamera);
    }

    function renderGodRaysPass(lightUV) {
      godRayMaterial.uniforms.tInput.value = occlusionRT.texture;
      godRayMaterial.uniforms.lightPositionOnScreen.value.copy(lightUV);

      postQuad.material = godRayMaterial;
      renderer.setRenderTarget(godRaysRT);
      renderer.clear(true, true, true);
      renderer.render(postScene, postCamera);
    }

    function renderMainScene() {
      renderer.setRenderTarget(mainSceneRT);
      renderer.clear(true, true, true);
      renderer.render(scene, camera);
    }

    function renderComposite() {
      compositeMaterial.uniforms.tScene.value = mainSceneRT.texture;
      compositeMaterial.uniforms.tGodRays.value = godRaysRT.texture;

      compositeQuad.material = compositeMaterial;
      renderer.setRenderTarget(null);
      renderer.clear(true, true, true);
      renderer.render(compositeScene, postCamera);
    }

    function animate() {
      requestAnimationFrame(animate);

      controls.update();
      updateLightFromParams();

      const lightUV = projectLightToScreenUV();

      renderOcclusionPass();
      renderGodRaysPass(lightUV);
      renderMainScene();
      renderComposite();

      updateState(lightUV);
    }

    animate();
  </script>
</body>
</html>
