<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thermal Camera Post-Processing</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }

#mode-label {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  background: rgba(0,0,0,0.7);
  padding: 8px 24px;
  border-radius: 6px;
  font-size: 18px;
  font-weight: bold;
  z-index: 100;
  letter-spacing: 2px;
}

#thermal-panel {
  position: fixed;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 16px;
  border-radius: 8px;
  z-index: 100;
  min-width: 220px;
  font-size: 13px;
}
#thermal-panel label {
  display: block;
  margin-top: 10px;
  margin-bottom: 2px;
}
#thermal-panel input[type=range] {
  width: 100%;
}
#thermal-panel .val {
  float: right;
  font-weight: bold;
  color: #0ff;
}

#temp-readout {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  background: rgba(0,0,0,0.75);
  padding: 8px 20px;
  border-radius: 6px;
  font-size: 15px;
  z-index: 100;
  display: none;
}

#instructions {
  position: fixed;
  bottom: 60px;
  left: 10px;
  color: #aaa;
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 6px;
  font-size: 11px;
  z-index: 100;
  line-height: 1.6;
}
</style>
</head>
<body>

<div id="mode-label">THERMAL</div>

<div id="thermal-panel">
  <strong>Thermal Controls</strong>
  <label>Min Temp: <span class="val" id="min-temp-val">0</span></label>
  <input type="range" id="min-temp-slider" min="-20" max="50" value="0" step="1">
  <label>Max Temp: <span class="val" id="max-temp-val">150</span></label>
  <input type="range" id="max-temp-slider" min="50" max="200" value="150" step="1">
  <label>Sensitivity: <span class="val" id="sensitivity-val">1.0</span></label>
  <input type="range" id="sensitivity-slider" min="0.1" max="3.0" value="1.0" step="0.1">
</div>

<div id="temp-readout"></div>

<div id="instructions">
  [1] RGB &nbsp; [2] Thermal &nbsp; [3] Hybrid<br>
  [H] Heat animation &nbsp; [C] Cooldown<br>
  Click to select &nbsp; [↑/↓] Adjust temp
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- State ----
const state = {
  viewMode: 'THERMAL',
  minTemp: 0,
  maxTemp: 150,
  sensitivity: 1.0,
  heatAnimationActive: false,
  cooldownActive: false,
  cooldownProgress: 0.0,
  selectedObject: null,
  temperatures: { ground: 20, sphere: 80, box: 37, cylinder: 5, torus: 120 },
  objectCount: 5,
  composerEnabled: true,
  paletteRange: { min: 0, max: 150 },
  frameCount: 0
};
window.__3D_STATE__ = state;

// ---- Original temperatures for cooldown restore ----
const originalTemps = { ground: 20, sphere: 80, box: 37, cylinder: 5, torus: 120 };
let cooldownStartTemps = null;
let cooldownStartTime = 0;
const COOLDOWN_DURATION = 3.0;

// ---- Renderer ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---- Scene ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

// ---- Camera ----
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 5, 12);
camera.lookAt(0, 0, 0);

// ---- Controls ----
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.update();

// ---- Lights ----
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// ---- Objects ----
const objects = [];

// Ground
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.name = 'ground';
ground.userData.temperature = 20;
ground.userData.key = 'ground';
scene.add(ground);
objects.push(ground);

// Sphere (hot engine)
const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
const sphereMat = new THREE.MeshStandardMaterial({ color: 0xcc4444 });
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.set(-3, 1.5, 0);
sphere.name = 'sphere';
sphere.userData.temperature = 80;
sphere.userData.key = 'sphere';
scene.add(sphere);
objects.push(sphere);

// Box (human body)
const boxGeo = new THREE.BoxGeometry(1.5, 3, 1.5);
const boxMat = new THREE.MeshStandardMaterial({ color: 0x44aa44 });
const box = new THREE.Mesh(boxGeo, boxMat);
box.position.set(0, 1.5, 0);
box.name = 'box';
box.userData.temperature = 37;
box.userData.key = 'box';
scene.add(box);
objects.push(box);

// Cylinder (cold pipe)
const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
const cylMat = new THREE.MeshStandardMaterial({ color: 0x4444cc });
const cylinder = new THREE.Mesh(cylGeo, cylMat);
cylinder.position.set(3, 1, 0);
cylinder.name = 'cylinder';
cylinder.userData.temperature = 5;
cylinder.userData.key = 'cylinder';
scene.add(cylinder);
objects.push(cylinder);

// Torus (overheating component)
const torusGeo = new THREE.TorusGeometry(0.7, 0.3, 16, 48);
const torusMat = new THREE.MeshStandardMaterial({ color: 0xcc8844 });
const torus = new THREE.Mesh(torusGeo, torusMat);
torus.position.set(-1, 3, 2);
torus.name = 'torus';
torus.userData.temperature = 120;
torus.userData.key = 'torus';
scene.add(torus);
objects.push(torus);

// ---- Thermal encoding materials ----
// For the thermal pass, we render each object with a material that encodes temperature as a grayscale value
const thermalEncodeMaterials = new Map();
const tempToGray = (temp, minT, maxT) => {
  return THREE.MathUtils.clamp((temp - minT) / (maxT - minT), 0, 1);
};

function createEncodeMaterial(normalizedTemp) {
  return new THREE.MeshBasicMaterial({ color: new THREE.Color(normalizedTemp, normalizedTemp, normalizedTemp) });
}

// ---- Render targets ----
const thermalRT = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat
});

const normalRT = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat
});

// ---- Full-screen quad for post-processing ----
const quadGeo = new THREE.PlaneGeometry(2, 2);

const thermalShader = {
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tThermal;
    uniform sampler2D tNormal;
    uniform float uMode; // 0=RGB, 1=THERMAL, 2=HYBRID
    uniform float uSensitivity;
    varying vec2 vUv;

    vec3 thermalPalette(float t) {
      // t is 0..1 normalized temperature
      // Apply sensitivity as contrast around 0.5
      t = clamp((t - 0.5) * uSensitivity + 0.5, 0.0, 1.0);

      // Map to palette:
      // 0.0 = deep blue, ~0.133 = blue/cyan boundary, ~0.38 = cyan/green, ~0.53 = green/yellow, ~0.67 = yellow/red, 1.0 = red/white
      // We define breakpoints based on the temperature ranges relative to 0-150 default:
      // Below 0: deep blue -> but in normalized space this is 0
      // We'll use a smooth multi-stop gradient

      vec3 col;
      if (t < 0.133) {
        // Deep blue to blue
        float f = t / 0.133;
        col = mix(vec3(0.0, 0.0, 0.5), vec3(0.0, 0.0, 1.0), f);
      } else if (t < 0.267) {
        // Blue to cyan
        float f = (t - 0.133) / 0.134;
        col = mix(vec3(0.0, 0.0, 1.0), vec3(0.0, 1.0, 1.0), f);
      } else if (t < 0.38) {
        // Cyan to green
        float f = (t - 0.267) / 0.113;
        col = mix(vec3(0.0, 1.0, 1.0), vec3(0.0, 1.0, 0.0), f);
      } else if (t < 0.53) {
        // Green to yellow
        float f = (t - 0.38) / 0.15;
        col = mix(vec3(0.0, 1.0, 0.0), vec3(1.0, 1.0, 0.0), f);
      } else if (t < 0.8) {
        // Yellow to red
        float f = (t - 0.53) / 0.27;
        col = mix(vec3(1.0, 1.0, 0.0), vec3(1.0, 0.0, 0.0), f);
      } else {
        // Red to white
        float f = (t - 0.8) / 0.2;
        col = mix(vec3(1.0, 0.0, 0.0), vec3(1.0, 1.0, 1.0), f);
      }
      return col;
    }

    void main() {
      vec4 normalColor = texture2D(tNormal, vUv);
      vec4 thermalEncoded = texture2D(tThermal, vUv);
      float temp = thermalEncoded.r; // normalized 0-1

      vec3 thermalColor = thermalPalette(temp);

      if (uMode < 0.5) {
        // RGB mode
        gl_FragColor = normalColor;
      } else if (uMode < 1.5) {
        // Thermal mode
        gl_FragColor = vec4(thermalColor, 1.0);
      } else {
        // Hybrid mode - 50% blend
        gl_FragColor = vec4(mix(normalColor.rgb, thermalColor, 0.5), 1.0);
      }
    }
  `
};

const quadMat = new THREE.ShaderMaterial({
  uniforms: {
    tThermal: { value: thermalRT.texture },
    tNormal: { value: normalRT.texture },
    uMode: { value: 1.0 },
    uSensitivity: { value: 1.0 }
  },
  vertexShader: thermalShader.vertexShader,
  fragmentShader: thermalShader.fragmentShader,
  depthTest: false,
  depthWrite: false
});

const quadMesh = new THREE.Mesh(quadGeo, quadMat);
const quadScene = new THREE.Scene();
const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
quadScene.add(quadMesh);

// ---- Selection ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selectedMesh = null;
let selectionOutline = null;

function selectObject(mesh) {
  // Remove old outline
  if (selectionOutline) {
    scene.remove(selectionOutline);
    selectionOutline.geometry.dispose();
    selectionOutline.material.dispose();
    selectionOutline = null;
  }

  if (mesh) {
    selectedMesh = mesh;
    state.selectedObject = mesh.name;

    // Create wireframe overlay
    const outlineGeo = mesh.geometry.clone();
    const outlineMat = new THREE.MeshBasicMaterial({
      color: 0xffff00,
      wireframe: true,
      transparent: true,
      opacity: 0.6
    });
    selectionOutline = new THREE.Mesh(outlineGeo, outlineMat);
    selectionOutline.position.copy(mesh.position);
    selectionOutline.rotation.copy(mesh.rotation);
    selectionOutline.scale.copy(mesh.scale).multiplyScalar(1.02);
    selectionOutline.userData.isOutline = true;
    scene.add(selectionOutline);

    updateReadout();
  } else {
    selectedMesh = null;
    state.selectedObject = null;
    document.getElementById('temp-readout').style.display = 'none';
  }
}

function updateReadout() {
  if (selectedMesh) {
    const el = document.getElementById('temp-readout');
    el.style.display = 'block';
    el.textContent = `Object: ${selectedMesh.name} | Temp: ${selectedMesh.userData.temperature.toFixed(1)}°C`;
  }
}

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(objects);
  if (intersects.length > 0) {
    selectObject(intersects[0].object);
  } else {
    selectObject(null);
  }
});

// ---- DOM Controls ----
const minSlider = document.getElementById('min-temp-slider');
const maxSlider = document.getElementById('max-temp-slider');
const sensSlider = document.getElementById('sensitivity-slider');

minSlider.addEventListener('input', () => {
  state.minTemp = parseFloat(minSlider.value);
  document.getElementById('min-temp-val').textContent = minSlider.value;
});
maxSlider.addEventListener('input', () => {
  state.maxTemp = parseFloat(maxSlider.value);
  document.getElementById('max-temp-val').textContent = maxSlider.value;
});
sensSlider.addEventListener('input', () => {
  state.sensitivity = parseFloat(sensSlider.value);
  document.getElementById('sensitivity-val').textContent = parseFloat(sensSlider.value).toFixed(1);
});

// ---- Keyboard ----
document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (key === '1') {
    state.viewMode = 'RGB';
    state.composerEnabled = false;
    document.getElementById('mode-label').textContent = 'RGB';
  } else if (key === '2') {
    state.viewMode = 'THERMAL';
    state.composerEnabled = true;
    document.getElementById('mode-label').textContent = 'THERMAL';
  } else if (key === '3') {
    state.viewMode = 'HYBRID';
    state.composerEnabled = true;
    document.getElementById('mode-label').textContent = 'HYBRID';
  } else if (key === 'h' || key === 'H') {
    state.heatAnimationActive = !state.heatAnimationActive;
    if (!state.heatAnimationActive) {
      // Restore original temps for animated objects
      sphere.userData.temperature = originalTemps.sphere;
      torus.userData.temperature = originalTemps.torus;
      state.temperatures.sphere = originalTemps.sphere;
      state.temperatures.torus = originalTemps.torus;
    }
  } else if (key === 'c' || key === 'C') {
    if (!state.cooldownActive) {
      state.cooldownActive = true;
      state.cooldownProgress = 0.0;
      cooldownStartTime = performance.now() / 1000;
      cooldownStartTemps = {};
      for (const obj of objects) {
        cooldownStartTemps[obj.userData.key] = obj.userData.temperature;
      }
    }
  } else if (key === 'ArrowUp') {
    e.preventDefault();
    if (selectedMesh) {
      selectedMesh.userData.temperature = Math.min(200, selectedMesh.userData.temperature + 5);
      state.temperatures[selectedMesh.userData.key] = selectedMesh.userData.temperature;
      originalTemps[selectedMesh.userData.key] = selectedMesh.userData.temperature;
      updateReadout();
    }
  } else if (key === 'ArrowDown') {
    e.preventDefault();
    if (selectedMesh) {
      selectedMesh.userData.temperature = Math.max(-20, selectedMesh.userData.temperature - 5);
      state.temperatures[selectedMesh.userData.key] = selectedMesh.userData.temperature;
      originalTemps[selectedMesh.userData.key] = selectedMesh.userData.temperature;
      updateReadout();
    }
  }
});

// ---- Resize ----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  thermalRT.setSize(window.innerWidth, window.innerHeight);
  normalRT.setSize(window.innerWidth, window.innerHeight);
});

// ---- Store original materials ----
const originalMaterials = new Map();
for (const obj of objects) {
  originalMaterials.set(obj, obj.material);
}

// ---- Animation loop ----
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  const dt = clock.getDelta();

  // Heat animation
  if (state.heatAnimationActive) {
    // Sphere: 60-120°C, 4s period
    const sphereTemp = 90 + 30 * Math.sin(2 * Math.PI * time / 4);
    sphere.userData.temperature = sphereTemp;
    state.temperatures.sphere = sphereTemp;

    // Torus: 100-180°C, 6s period
    const torusTemp = 140 + 40 * Math.sin(2 * Math.PI * time / 6);
    torus.userData.temperature = torusTemp;
    state.temperatures.torus = torusTemp;
  }

  // Cooldown
  if (state.cooldownActive) {
    const elapsed = performance.now() / 1000 - cooldownStartTime;
    state.cooldownProgress = Math.min(elapsed / COOLDOWN_DURATION, 1.0);

    for (const obj of objects) {
      const startT = cooldownStartTemps[obj.userData.key];
      obj.userData.temperature = startT + (15 - startT) * state.cooldownProgress;
      state.temperatures[obj.userData.key] = obj.userData.temperature;
    }

    if (state.cooldownProgress >= 1.0) {
      // Snap back to originals
      for (const obj of objects) {
        obj.userData.temperature = originalTemps[obj.userData.key];
        state.temperatures[obj.userData.key] = originalTemps[obj.userData.key];
      }
      state.cooldownActive = false;
      state.cooldownProgress = 0.0;
      cooldownStartTemps = null;
    }
  }

  // Sync state temperatures
  for (const obj of objects) {
    state.temperatures[obj.userData.key] = obj.userData.temperature;
  }

  // Update palette range
  const effMin = state.minTemp;
  const effMax = state.maxTemp;
  state.paletteRange = { min: effMin, max: effMax };

  // Update readout if selected
  if (selectedMesh) {
    updateReadout();
  }

  controls.update();

  if (state.viewMode === 'RGB') {
    // Direct render
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  } else {
    // Hide outline for thermal pass
    if (selectionOutline) selectionOutline.visible = false;

    // Pass 1: Render thermal encoded to thermalRT
    for (const obj of objects) {
      const normTemp = tempToGray(obj.userData.temperature, effMin, effMax);
      const encodeMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(normTemp, normTemp, normTemp)
      });
      obj.material = encodeMat;
    }

    renderer.setRenderTarget(thermalRT);
    renderer.setClearColor(0x000000, 1);
    renderer.render(scene, camera);

    // Dispose temp materials
    for (const obj of objects) {
      obj.material.dispose();
    }

    // Restore original materials
    for (const obj of objects) {
      obj.material = originalMaterials.get(obj);
    }

    if (selectionOutline) selectionOutline.visible = true;

    // Pass 2: Render normal scene to normalRT (for hybrid)
    renderer.setRenderTarget(normalRT);
    renderer.setClearColor(0x222222, 1);
    renderer.render(scene, camera);

    // Pass 3: Composite
    quadMat.uniforms.tThermal.value = thermalRT.texture;
    quadMat.uniforms.tNormal.value = normalRT.texture;
    quadMat.uniforms.uMode.value = state.viewMode === 'THERMAL' ? 1.0 : 2.0;
    quadMat.uniforms.uSensitivity.value = state.sensitivity;

    renderer.setRenderTarget(null);
    renderer.render(quadScene, quadCamera);
  }

  state.frameCount++;
}

animate();
</script>
</body>
</html>
