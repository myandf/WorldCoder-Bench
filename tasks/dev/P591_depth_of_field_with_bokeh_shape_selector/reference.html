<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js DoF with Selectable Bokeh Shape</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #0b0f14;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 290px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    #ui h2 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 700;
    }
    .row {
      margin-bottom: 10px;
    }
    .row label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .value {
      color: #7fe7ff;
      font-weight: 700;
      margin-left: 6px;
    }
    input[type="range"] {
      width: 100%;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    button {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: rgba(255,255,255,0.14);
    }
    button.active {
      border: 2px solid #00ffff;
    }
    .checkrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      font-size: 14px;
    }
    .hint {
      font-size: 11px;
      color: #c7d2da;
      line-height: 1.35;
      margin-top: 8px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Depth of Field Controls</h2>

    <div class="row">
      <label for="focusSlider">Focus Distance <span id="focusValue" class="value">10.0</span></label>
      <input id="focusSlider" type="range" min="1" max="40" step="0.5" value="10" />
    </div>

    <div class="row">
      <label for="apertureSlider">Aperture <span id="apertureValue" class="value">0.020</span></label>
      <input id="apertureSlider" type="range" min="0.001" max="0.1" step="0.001" value="0.02" />
    </div>

    <div class="row">
      <label for="maxBlurSlider">Max Blur <span id="maxBlurValue" class="value">0.020</span></label>
      <input id="maxBlurSlider" type="range" min="0.0" max="0.05" step="0.001" value="0.02" />
    </div>

    <div class="row">
      <label>Bokeh Shape</label>
      <div class="btn-grid">
        <button id="btn-circle" class="active">Circle</button>
        <button id="btn-hexagon">Hexagon</button>
        <button id="btn-star">Star</button>
        <button id="btn-heart">Heart</button>
      </div>
    </div>

    <div class="checkrow">
      <input id="dofToggle" type="checkbox" checked />
      <label for="dofToggle">Enable DoF</label>
    </div>

    <div class="row">
      <button id="btn-autofocus" style="width:100%;">Auto Focus</button>
    </div>

    <div class="hint">
      Keys: F cycle shape, D toggle DoF, [ / ] aperture.<br/>
      Click a sphere to focus it.
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f14);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 5, 20);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 15, 10);
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.name = 'Ground';
    scene.add(ground);

    const sphereGeom = new THREE.SphereGeometry(0.5, 24, 24);
    const spheres = [];
    const sphereGroup = new THREE.Group();
    scene.add(sphereGroup);

    const cols = 6;
    const rows = 5;
    const xVals = [];
    const zVals = [];
    for (let i = 0; i < cols; i++) xVals.push(THREE.MathUtils.lerp(-15, 15, i / (cols - 1)));
    for (let j = 0; j < rows; j++) zVals.push(THREE.MathUtils.lerp(-15, 15, j / (rows - 1)));

    let sphereIndex = 0;
    for (let zi = 0; zi < rows; zi++) {
      for (let xi = 0; xi < cols; xi++) {
        const hue = Math.random();
        const mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(hue, 0.75, 0.55),
          roughness: 0.35,
          metalness: 0.1
        });
        const sphere = new THREE.Mesh(sphereGeom, mat);
        sphere.position.set(
          xVals[xi] + THREE.MathUtils.randFloatSpread(1.5),
          THREE.MathUtils.randFloat(0.5, 5),
          zVals[zi] + THREE.MathUtils.randFloatSpread(1.5)
        );
        sphere.name = `Sphere_${sphereIndex++}`;
        spheres.push(sphere);
        sphereGroup.add(sphere);
      }
    }

    const size = new THREE.Vector2();
    renderer.getSize(size);

    const renderTarget = new THREE.WebGLRenderTarget(size.x, size.y, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.UnsignedByteType,
      depthBuffer: true,
      stencilBuffer: false
    });
    renderTarget.depthTexture = new THREE.DepthTexture(size.x, size.y, THREE.UnsignedShortType);
    renderTarget.depthTexture.format = THREE.DepthFormat;
    renderTarget.depthTexture.type = THREE.UnsignedShortType;

    const composer = new EffectComposer(renderer, renderTarget);
    const renderPass = new RenderPass(scene, camera);

    const DoFShader = {
      uniforms: {
        tDiffuse: { value: null },
        tDepth: { value: renderTarget.depthTexture },
        resolution: { value: new THREE.Vector2(size.x, size.y) },
        cameraNear: { value: camera.near },
        cameraFar: { value: camera.far },
        focusDistance: { value: 10.0 },
        aperture: { value: 0.02 },
        maxBlur: { value: 0.02 },
        shapeType: { value: 0 },
        dofEnabled: { value: true }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform sampler2D tDepth;
        uniform vec2 resolution;
        uniform float cameraNear;
        uniform float cameraFar;
        uniform float focusDistance;
        uniform float aperture;
        uniform float maxBlur;
        uniform int shapeType;
        uniform bool dofEnabled;
        varying vec2 vUv;

        float readDepth(vec2 uv) {
          float fragCoordZ = texture2D(tDepth, uv).x;
          float z = fragCoordZ * 2.0 - 1.0;
          return (2.0 * cameraNear * cameraFar) / (cameraFar + cameraNear - z * (cameraFar - cameraNear));
        }

        vec2 rotate2D(vec2 p, float a) {
          float c = cos(a), s = sin(a);
          return vec2(c * p.x - s * p.y, s * p.x + c * p.y);
        }

        vec3 sampleCircle(vec2 uv, float radius) {
          vec3 col = texture2D(tDiffuse, uv).rgb;
          float count = 1.0;
          for (int i = 0; i < 12; i++) {
            float a = 6.28318530718 * float(i) / 12.0;
            vec2 off = vec2(cos(a), sin(a)) * radius;
            col += texture2D(tDiffuse, uv + off).rgb;
            count += 1.0;
          }
          return col / count;
        }

        vec3 sampleHexagon(vec2 uv, float radius) {
          vec3 col = texture2D(tDiffuse, uv).rgb * 0.5;
          float count = 0.5;
          for (int i = 0; i < 6; i++) {
            float a = 6.28318530718 * float(i) / 6.0;
            vec2 dir = vec2(cos(a), sin(a));
            col += texture2D(tDiffuse, uv + dir * radius).rgb;
            col += texture2D(tDiffuse, uv + dir * radius * 0.5).rgb * 0.75;
            count += 1.75;
          }
          return col / count;
        }

        vec3 sampleStar(vec2 uv, float radius) {
          vec3 col = texture2D(tDiffuse, uv).rgb;
          float count = 1.0;
          for (int i = 0; i < 10; i++) {
            float a = 6.28318530718 * float(i) / 10.0 - 1.57079632679;
            float r = mod(float(i), 2.0) < 0.5 ? radius : radius * 0.45;
            vec2 off = vec2(cos(a), sin(a)) * r;
            col += texture2D(tDiffuse, uv + off).rgb;
            count += 1.0;
          }
          return col / count;
        }

        vec2 heartPoint(float t) {
          float x = 16.0 * pow(sin(t), 3.0);
          float y = 13.0 * cos(t) - 5.0 * cos(2.0*t) - 2.0 * cos(3.0*t) - cos(4.0*t);
          return vec2(x, y) / 18.0;
        }

        vec3 sampleHeart(vec2 uv, float radius) {
          vec3 col = texture2D(tDiffuse, uv).rgb;
          float count = 1.0;
          for (int i = 0; i < 12; i++) {
            float t = 6.28318530718 * float(i) / 12.0;
            vec2 hp = heartPoint(t);
            hp.y *= -1.0;
            col += texture2D(tDiffuse, uv + hp * radius).rgb;
            count += 1.0;
          }
          return col / count;
        }

        void main() {
          vec3 base = texture2D(tDiffuse, vUv).rgb;
          float linearDepth = readDepth(vUv);
          float coc = clamp(abs(linearDepth - focusDistance) * aperture, 0.0, maxBlur);

          if (!dofEnabled || coc < 0.00001) {
            gl_FragColor = vec4(base, 1.0);
            return;
          }

          float radius = coc;

          vec3 color;
          if (shapeType == 0) {
            color = sampleCircle(vUv, radius);
          } else if (shapeType == 1) {
            color = sampleHexagon(vUv, radius);
          } else if (shapeType == 2) {
            color = sampleStar(vUv, radius);
          } else {
            color = sampleHeart(vUv, radius);
          }

          gl_FragColor = vec4(color, 1.0);
        }
      `
    };

    const dofPass = new ShaderPass(DoFShader);
    composer.addPass(renderPass);
    composer.addPass(dofPass);

    const focusSlider = document.getElementById('focusSlider');
    const apertureSlider = document.getElementById('apertureSlider');
    const maxBlurSlider = document.getElementById('maxBlurSlider');
    const focusValue = document.getElementById('focusValue');
    const apertureValue = document.getElementById('apertureValue');
    const maxBlurValue = document.getElementById('maxBlurValue');
    const dofToggle = document.getElementById('dofToggle');
    const autoFocusBtn = document.getElementById('btn-autofocus');

    const shapeButtons = {
      circle: document.getElementById('btn-circle'),
      hexagon: document.getElementById('btn-hexagon'),
      star: document.getElementById('btn-star'),
      heart: document.getElementById('btn-heart')
    };

    const shapeOrder = ['circle', 'hexagon', 'star', 'heart'];
    const shapeMap = { circle: 0, hexagon: 1, star: 2, heart: 3 };
    const sampleCountMap = { circle: 12, hexagon: 6, star: 10, heart: 12 };

    let currentShape = 'circle';
    let dofEnabled = true;
    let frameCount = 0;
    let lastRaycastHit = null;

    function updateButtonStyles() {
      for (const key in shapeButtons) {
        shapeButtons[key].classList.toggle('active', key === currentShape);
      }
    }

    function setShape(shape) {
      currentShape = shape;
      dofPass.uniforms.shapeType.value = shapeMap[shape];
      updateButtonStyles();
    }

    function syncUI() {
      focusValue.textContent = Number(focusSlider.value).toFixed(1);
      apertureValue.textContent = Number(apertureSlider.value).toFixed(3);
      maxBlurValue.textContent = Number(maxBlurSlider.value).toFixed(3);
    }

    function updateUniformsFromUI() {
      dofPass.uniforms.focusDistance.value = Number(focusSlider.value);
      dofPass.uniforms.aperture.value = Number(apertureSlider.value);
      dofPass.uniforms.maxBlur.value = Number(maxBlurSlider.value);
      dofPass.uniforms.dofEnabled.value = dofEnabled;
      syncUI();
    }

    focusSlider.addEventListener('input', updateUniformsFromUI);
    apertureSlider.addEventListener('input', updateUniformsFromUI);
    maxBlurSlider.addEventListener('input', updateUniformsFromUI);

    dofToggle.addEventListener('change', () => {
      dofEnabled = dofToggle.checked;
      dofPass.enabled = dofEnabled;
      dofPass.uniforms.dofEnabled.value = dofEnabled;
    });

    Object.entries(shapeButtons).forEach(([shape, btn]) => {
      btn.addEventListener('click', () => setShape(shape));
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function setFocusDistance(dist) {
      const clamped = THREE.MathUtils.clamp(dist, Number(focusSlider.min), Number(focusSlider.max));
      focusSlider.value = clamped.toFixed(1);
      updateUniformsFromUI();
    }

    function raycastAtNDC(ndcX, ndcY, sphereOnly = false) {
      raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
      const targets = sphereOnly ? spheres : [ ...spheres, ground ];
      const hits = raycaster.intersectObjects(targets, false);
      return hits;
    }

    renderer.domElement.addEventListener('click', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      const hits = raycastAtNDC(mouse.x, mouse.y, true);
      if (hits.length > 0) {
        const hit = hits[0];
        const dist = camera.position.distanceTo(hit.object.position);
        setFocusDistance(dist);
        lastRaycastHit = {
          objectName: hit.object.name,
          distance: dist
        };
      } else {
        lastRaycastHit = null;
      }
    });

    autoFocusBtn.addEventListener('click', () => {
      const hits = raycastAtNDC(0, 0, false);
      if (hits.length > 0) {
        const hit = hits[0];
        const targetPos = hit.object.position ? hit.object.position : hit.point;
        const dist = camera.position.distanceTo(targetPos);
        setFocusDistance(dist);
        lastRaycastHit = {
          objectName: hit.object.name || 'Unnamed',
          distance: dist
        };
      } else {
        lastRaycastHit = null;
      }
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === 'f' || key === 'F') {
        const idx = shapeOrder.indexOf(currentShape);
        setShape(shapeOrder[(idx + 1) % shapeOrder.length]);
      } else if (key === 'd' || key === 'D') {
        dofEnabled = !dofEnabled;
        dofToggle.checked = dofEnabled;
        dofPass.enabled = dofEnabled;
        dofPass.uniforms.dofEnabled.value = dofEnabled;
      } else if (key === '[') {
        const next = Math.max(0.001, Number(apertureSlider.value) - 0.005);
        apertureSlider.value = next.toFixed(3);
        updateUniformsFromUI();
      } else if (key === ']') {
        const next = Math.min(0.1, Number(apertureSlider.value) + 0.005);
        apertureSlider.value = next.toFixed(3);
        updateUniformsFromUI();
      }
    });

    function linearizeDepth01(depthSample, near, far) {
      const z = depthSample * 2 - 1;
      return (2 * near * far) / (far + near - z * (far - near));
    }

    window.__3D_STATE__ = {
      focusDistance: Number(focusSlider.value),
      aperture: Number(apertureSlider.value),
      maxBlur: Number(maxBlurSlider.value),
      bokehShape: currentShape,
      dofEnabled: dofEnabled,
      sphereCount: spheres.length,
      cocAtCenter: 0,
      frameCount: 0,
      lastRaycastHit: null,
      shaderPassActive: true,
      bokehSamples: sampleCountMap[currentShape],
      depthTextureReady: !!renderTarget.depthTexture,
      cameraNear: camera.near,
      cameraFar: camera.far,
      composerPassCount: composer.passes.length
    };

    function updateState() {
      const state = window.__3D_STATE__;
      state.focusDistance = Number(focusSlider.value);
      state.aperture = Number(apertureSlider.value);
      state.maxBlur = Number(maxBlurSlider.value);
      state.bokehShape = currentShape;
      state.dofEnabled = dofEnabled;
      state.sphereCount = spheres.length;
      state.frameCount = frameCount;
      state.lastRaycastHit = lastRaycastHit;
      state.shaderPassActive = composer.passes.includes(dofPass) && dofPass.enabled;
      state.bokehSamples = sampleCountMap[currentShape];
      state.depthTextureReady = !!renderTarget.depthTexture && renderTarget.depthTexture.image !== undefined;
      state.cameraNear = camera.near;
      state.cameraFar = camera.far;
      state.composerPassCount = composer.passes.length;
    }

    const depthReadTarget = new Uint8Array(4);

    function updateCoCAtCenter() {
      const x = Math.floor(size.x / 2);
      const y = Math.floor(size.y / 2);
      renderer.readRenderTargetPixels(renderTarget, x, y, 1, 1, depthReadTarget);
      const depthApprox = depthReadTarget[0] / 255;
      const linearDepth = linearizeDepth01(depthApprox, camera.near, camera.far);
      const coc = Math.min(Math.abs(linearDepth - Number(focusSlider.value)) * Number(apertureSlider.value), Number(maxBlurSlider.value));
      window.__3D_STATE__.cocAtCenter = Number.isFinite(coc) ? coc : 0;
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);

      renderer.getSize(size);
      dofPass.uniforms.resolution.value.set(size.x, size.y);

      renderTarget.setSize(size.x, size.y);
      renderTarget.depthTexture.dispose();
      renderTarget.depthTexture = new THREE.DepthTexture(size.x, size.y, THREE.UnsignedShortType);
      renderTarget.depthTexture.format = THREE.DepthFormat;
      renderTarget.depthTexture.type = THREE.UnsignedShortType;
      dofPass.uniforms.tDepth.value = renderTarget.depthTexture;
    }

    window.addEventListener('resize', onResize);

    setShape('circle');
    updateUniformsFromUI();
    syncUI();

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;

      composer.render();

      updateCoCAtCenter();
      updateState();
    }

    animate();
  </script>
</body>
</html>
