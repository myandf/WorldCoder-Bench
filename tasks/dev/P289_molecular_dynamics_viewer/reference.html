<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecular Dynamics Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; font-family: 'Courier New', monospace; }
canvas { display: block; }
#hud {
position: absolute;
top: 10px;
left: 10px;
color: #88aacc;
font-size: 13px;
background: rgba(10, 10, 26, 0.8);
padding: 8px 12px;
border: 1px solid #334455;
border-radius: 4px;
pointer-events: none;
z-index: 10;
}
#status {
position: absolute;
top: 10px;
right: 10px;
color: #ff6644;
font-size: 14px;
font-weight: bold;
background: rgba(10, 10, 26, 0.8);
padding: 8px 16px;
border: 1px solid #334455;
border-radius: 4px;
pointer-events: none;
z-index: 10;
}
#selection-info {
position: absolute;
bottom: 10px;
left: 10px;
color: #aaccaa;
font-size: 13px;
background: rgba(10, 10, 26, 0.8);
padding: 8px 12px;
border: 1px solid #334455;
border-radius: 4px;
pointer-events: none;
z-index: 10;
}
</style>
</head>
<body>
<div id="hud">Atoms: 20 | Bonds: 0 | KE: 0.000 | Temp: 0.000 | Mode: kinetic | Time: 0</div>
<div id="status">PAUSED</div>
<div id="selection-info">Selected: none</div>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 30, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(20, 40, 30);
scene.add(dirLight);

const boxGeo = new THREE.BoxGeometry(30, 30, 30);
const edgesGeo = new THREE.EdgesGeometry(boxGeo);
const edgesMat = new THREE.LineBasicMaterial({ color: 0x334455 });
const boundingBox = new THREE.LineSegments(edgesGeo, edgesMat);
scene.add(boundingBox);

const NUM_ATOMS = 20;
const atoms = [];
const atomMeshes = [];
const atomColors = [];

function randomRange(min, max) {
return min + Math.random() * (max - min);
}

function createAtomData() {
const data = [];
for (let i = 0; i < NUM_ATOMS; i++) {
let color;
if (i < 7) color = 0xff3333;
else if (i < 14) color = 0x3366ff;
else color = 0x33ff66;

data.push({
position: new THREE.Vector3(randomRange(-14, 14), randomRange(-14, 14), randomRange(-14, 14)),
velocity: new THREE.Vector3(randomRange(-0.1, 0.1), randomRange(-0.1, 0.1), randomRange(-0.1, 0.1)),
color: color,
frozen: false
});
}
return data;
}

function getColorForIndex(i) {
if (i < 7) return 0xff3333;
else if (i < 14) return 0x3366ff;
else return 0x33ff66;
}

let atomDataArray = createAtomData();

const sphereGeo = new THREE.SphereGeometry(0.8, 16, 12);

for (let i = 0; i < NUM_ATOMS; i++) {
const ad = atomDataArray[i];
const mat = new THREE.MeshStandardMaterial({
color: ad.color,
emissive: ad.color,
emissiveIntensity: 0.3,
roughness: 0.3,
metalness: 0.2
});
const mesh = new THREE.Mesh(sphereGeo, mat);
mesh.position.copy(ad.position);
mesh.userData.atomIndex = i;
scene.add(mesh);
atomMeshes.push(mesh);
atomColors.push(ad.color);
}

// Bond visualization
const MAX_BONDS = NUM_ATOMS * (NUM_ATOMS - 1) / 2;
const bondPositions = new Float32Array(MAX_BONDS * 6);
const bondGeo = new THREE.BufferGeometry();
bondGeo.setAttribute('position', new THREE.BufferAttribute(bondPositions, 3));
bondGeo.setDrawRange(0, 0);
const bondMat = new THREE.LineBasicMaterial({ color: 0x556688, opacity: 0.4, transparent: true });
const bondLines = new THREE.LineSegments(bondGeo, bondMat);
scene.add(bondLines);

// Flamingo
let flamingoLoaded = false;
let mixer = null;
const clock = new THREE.Clock();

const loader = new GLTFLoader();
loader.load(
'https://threejs.org/examples/models/gltf/Flamingo.glb',
(gltf) => {
const model = gltf.scene;
model.scale.set(0.02, 0.02, 0.02);
model.position.set(0, 18, 0);
scene.add(model);
flamingoLoaded = true;
state.flamingoLoaded = true;

if (gltf.animations && gltf.animations.length > 0) {
mixer = new THREE.AnimationMixer(model);
const action = mixer.clipAction(gltf.animations[0]);
action.play();
}
},
undefined,
(err) => {
console.warn('Flamingo model failed to load:', err);
}
);

// State
const state = {
simRunning: false,
simTime: 0,
atomCount: NUM_ATOMS,
atomPositions: [],
atomVelocities: [],
bondCount: 0,
bondsVisible: true,
totalKE: 0,
temperature: 0,
displayMode: 'kinetic',
highlightMode: false,
selectedAtom: -1,
frozenAtoms: [],
flamingoLoaded: false,
atomsInsideBounds: true
};
window.__3D_STATE__ = state;

const displayModes = ['kinetic', 'potential', 'total'];
let displayModeIndex = 0;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function updateStateArrays() {
state.atomPositions = atomDataArray.map(a => ({ x: a.position.x, y: a.position.y, z: a.position.z }));
state.atomVelocities = atomDataArray.map(a => ({ x: a.velocity.x, y: a.velocity.y, z: a.velocity.z }));
state.frozenAtoms = atomDataArray.reduce((acc, a, i) => { if (a.frozen) acc.push(i); return acc; }, []);
}

function computeKE() {
let ke = 0;
for (let i = 0; i < NUM_ATOMS; i++) {
const v = atomDataArray[i].velocity;
ke += 0.5 * (v.x * v.x + v.y * v.y + v.z * v.z);
}
return ke;
}

function updateBonds() {
let bondIdx = 0;
let count = 0;
const posAttr = bondGeo.getAttribute('position');
const arr = posAttr.array;

for (let i = 0; i < NUM_ATOMS; i++) {
for (let j = i + 1; j < NUM_ATOMS; j++) {
const pi = atomDataArray[i].position;
const pj = atomDataArray[j].position;
const dx = pj.x - pi.x;
const dy = pj.y - pi.y;
const dz = pj.z - pi.z;
const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
if (dist < 5.0) {
arr[bondIdx] = pi.x;
arr[bondIdx + 1] = pi.y;
arr[bondIdx + 2] = pi.z;
arr[bondIdx + 3] = pj.x;
arr[bondIdx + 4] = pj.y;
arr[bondIdx + 5] = pj.z;
bondIdx += 6;
count++;
}
}
}

bondGeo.setDrawRange(0, count * 2);
posAttr.needsUpdate = true;
state.bondCount = count;
}

function simulate() {
if (!state.simRunning) return;

// Lennard-Jones-like forces
const forces = [];
for (let i = 0; i < NUM_ATOMS; i++) {
forces.push(new THREE.Vector3(0, 0, 0));
}

for (let i = 0; i < NUM_ATOMS; i++) {
for (let j = i + 1; j < NUM_ATOMS; j++) {
const pi = atomDataArray[i].position;
const pj = atomDataArray[j].position;
const dx = pj.x - pi.x;
const dy = pj.y - pi.y;
const dz = pj.z - pi.z;
const distSq = dx * dx + dy * dy + dz * dz;
const dist = Math.sqrt(distSq);

if (dist < 8 && dist > 0.01) {
let forceMag = 0;
if (dist < 3) {
// Repulsive
forceMag = -0.001 * (3 - dist);
} else {
// Weak attractive
forceMag = 0.001 * (dist - 3) * 0.1;
}
const fx = (dx / dist) * forceMag;
const fy = (dy / dist) * forceMag;
const fz = (dz / dist) * forceMag;
forces[i].x += fx;
forces[i].y += fy;
forces[i].z += fz;
forces[j].x -= fx;
forces[j].y -= fy;
forces[j].z -= fz;
}
}
}

// Update velocities and positions
for (let i = 0; i < NUM_ATOMS; i++) {
const ad = atomDataArray[i];
if (ad.frozen) continue;

ad.velocity.x += forces[i].x;
ad.velocity.y += forces[i].y;
ad.velocity.z += forces[i].z;

ad.position.x += ad.velocity.x;
ad.position.y += ad.velocity.y;
ad.position.z += ad.velocity.z;

// Wall bouncing
for (const axis of ['x', 'y', 'z']) {
if (ad.position[axis] > 15) {
ad.position[axis] = 15;
ad.velocity[axis] = -Math.abs(ad.velocity[axis]);
} else if (ad.position[axis] < -15) {
ad.position[axis] = -15;
ad.velocity[axis] = Math.abs(ad.velocity[axis]);
}
}

atomMeshes[i].position.copy(ad.position);
}

state.simTime++;
}

function checkBounds() {
for (let i = 0; i < NUM_ATOMS; i++) {
const p = atomDataArray[i].position;
if (Math.abs(p.x) > 15.5 || Math.abs(p.y) > 15.5 || Math.abs(p.z) > 15.5) {
state.atomsInsideBounds = false;
return;
}
}
state.atomsInsideBounds = true;
}

function updateHUD() {
const ke = state.totalKE;
const temp = state.temperature;
const hudEl = document.getElementById('hud');
hudEl.textContent = `Atoms: ${NUM_ATOMS} | Bonds: ${state.bondCount} | KE: ${ke.toFixed(3)} | Temp: ${temp.toFixed(3)} | Mode: ${state.displayMode} | Time: ${state.simTime}`;

const statusEl = document.getElementById('status');
statusEl.textContent = state.simRunning ? 'RUNNING' : 'PAUSED';
statusEl.style.color = state.simRunning ? '#44ff88' : '#ff6644';

const selEl = document.getElementById('selection-info');
selEl.textContent = state.selectedAtom >= 0 ? `Selected: ${state.selectedAtom}` : 'Selected: none';
}

// Key handlers
window.addEventListener('keydown', (e) => {
const key = e.key.toLowerCase();

if (key === ' ' || e.code === 'Space') {
e.preventDefault();
state.simRunning = !state.simRunning;
}

if (key === 't') {
displayModeIndex = (displayModeIndex + 1) % displayModes.length;
state.displayMode = displayModes[displayModeIndex];
}

if (key === 'r') {
atomDataArray = createAtomData();
for (let i = 0; i < NUM_ATOMS; i++) {
atomMeshes[i].position.copy(atomDataArray[i].position);
atomMeshes[i].scale.set(1, 1, 1);
atomMeshes[i].material.emissiveIntensity = 0.3;
}
state.simTime = 0;
state.selectedAtom = -1;
state.highlightMode = false;
}

if (key === 'h') {
state.highlightMode = !state.highlightMode;
const s = state.highlightMode ? 1.5 : 1.0;
for (let i = 0; i < NUM_ATOMS; i++) {
atomMeshes[i].scale.set(s, s, s);
}
}

if (key === 'b') {
state.bondsVisible = !state.bondsVisible;
bondLines.visible = state.bondsVisible;
}

if (key === 'f') {
const idx = state.selectedAtom;
if (idx >= 0 && idx < NUM_ATOMS) {
const ad = atomDataArray[idx];
if (ad.frozen) {
ad.frozen = false;
ad.velocity.set(randomRange(-0.1, 0.1), randomRange(-0.1, 0.1), randomRange(-0.1, 0.1));
} else {
ad.frozen = true;
ad.velocity.set(0, 0, 0);
}
}
}
});

// Click handler
renderer.domElement.addEventListener('click', (e) => {
mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

raycaster.setFromCamera(mouse, camera);
const intersects = raycaster.intersectObjects(atomMeshes);

// Deselect previous
if (state.selectedAtom >= 0) {
atomMeshes[state.selectedAtom].material.emissiveIntensity = 0.3;
}

if (intersects.length > 0) {
const idx = intersects[0].object.userData.atomIndex;
state.selectedAtom = idx;
atomMeshes[idx].material.emissiveIntensity = 0.8;
} else {
state.selectedAtom = -1;
}
});

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial state sync
updateStateArrays();

function animate() {
requestAnimationFrame(animate);

const delta = clock.getDelta();
if (mixer) mixer.update(delta);

simulate();
updateBonds();

state.totalKE = computeKE();
state.temperature = (2 / 3) * (state.totalKE / NUM_ATOMS);

checkBounds();
updateStateArrays();
updateHUD();

controls.update();
renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
