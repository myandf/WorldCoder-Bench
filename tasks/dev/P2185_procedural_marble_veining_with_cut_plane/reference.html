<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Veining Slicer</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; }
  canvas { display: block; }
  #controlPanel {
    position: absolute; top: 15px; left: 15px;
    background: rgba(0,0,0,0.75); padding: 15px; border-radius: 8px;
    color: #fff; font-family: monospace; font-size: 12px;
    z-index: 10; min-width: 240px;
  }
  #controlPanel .row { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  #controlPanel label { margin-right: 8px; }
  #controlPanel input[type=range] { width: 110px; }
  #controlPanel select, #controlPanel button {
    background: #333; color: #fff; border: 1px solid #555;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-family: monospace;
  }
  #controlPanel button:hover { background: #555; }
  .val { min-width: 36px; text-align: right; display: inline-block; }
</style>
</head>
<body>

<div id="controlPanel">
  <div class="row">
    <label>Cut Height</label>
    <input type="range" id="cutHeightSlider" min="-1.5" max="1.5" step="0.01" value="0">
    <span class="val" id="cutHeightVal">0.00</span>
  </div>
  <div class="row">
    <label>Vein Scale</label>
    <input type="range" id="veinScaleSlider" min="0.5" max="8.0" step="0.1" value="2.0">
    <span class="val" id="veinScaleVal">2.0</span>
  </div>
  <div class="row">
    <label>Vein Intensity</label>
    <input type="range" id="veinIntensitySlider" min="0.0" max="1.0" step="0.01" value="0.7">
    <span class="val" id="veinIntensityVal">0.70</span>
  </div>
  <div class="row">
    <label>Cut Axis</label>
    <select id="cutAxisSelect">
      <option value="X">X</option>
      <option value="Y" selected>Y</option>
      <option value="Z">Z</option>
    </select>
  </div>
  <div class="row">
    <button id="toggleHelperBtn">Toggle Helper</button>
    <button id="animateVeinsBtn">Animate Veins</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1a1a2e);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 3.5);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.update();

scene.add(new THREE.DirectionalLight(0xffffff, 1.2).translateX(3).translateY(5).translateZ(4));
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.3));

const clippingPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const clippingPlaneInv = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);

const noiseGLSL = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(
    i.z+vec4(0.0,i1.z,i2.z,1.0))
    +i.y+vec4(0.0,i1.y,i2.y,1.0))
    +i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
`;

const marbleFragBody = `
float marble(vec3 p, float scale, float intensity, vec3 offset) {
  vec3 sp = p * scale + offset;
  float n = 0.0;
  n += 0.5 * snoise(sp);
  n += 0.25 * snoise(sp * 2.1);
  n += 0.125 * snoise(sp * 4.3);
  float vein = abs(sin((sp.x + sp.y + sp.z + n * 4.0) * 3.14159));
  vein = pow(vein, 1.5) * intensity;
  return vein;
}
`;

const vertexShader = `
varying vec3 vWorldPos;
varying vec3 vWorldNormal;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

function makeFragShader(baseCol) {
  return `
precision highp float;
${noiseGLSL}
${marbleFragBody}
uniform vec3 baseColor;
uniform vec3 veinColor;
uniform float veinScale;
uniform float veinIntensity;
uniform vec3 noiseOffset;
varying vec3 vWorldPos;
varying vec3 vWorldNormal;
void main(){
  float v = marble(vWorldPos, veinScale, veinIntensity, noiseOffset);
  vec3 col = mix(${baseCol}, veinColor, v);
  vec3 N = normalize(vWorldNormal);
  vec3 L = normalize(vec3(3.0, 5.0, 4.0));
  float diff = max(dot(N, L), 0.0);
  vec3 V = normalize(cameraPosition - vWorldPos);
  vec3 H = normalize(L + V);
  float spec = pow(max(dot(N, H), 0.0), 32.0);
  col = col * (0.3 + 0.7 * diff) + vec3(0.15) * spec;
  gl_FragColor = vec4(col, 1.0);
}
`;
}

const baseColorDefault = [0.95, 0.93, 0.90];
const veinColorDefault = [0.15, 0.12, 0.10];

function makeUniforms() {
  return {
    baseColor: { value: new THREE.Vector3(...baseColorDefault) },
    veinColor: { value: new THREE.Vector3(...veinColorDefault) },
    veinScale: { value: 2.0 },
    veinIntensity: { value: 0.7 },
    noiseOffset: { value: new THREE.Vector3(0, 0, 0) }
  };
}

const extUniforms = makeUniforms();
const intUniforms = makeUniforms();

const marbleMat = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader: makeFragShader('baseColor'),
  uniforms: extUniforms,
  clipping: true,
  clippingPlanes: [clippingPlane],
  side: THREE.FrontSide
});

const interiorMat = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader: makeFragShader('vec3(0.85,0.82,0.78)'),
  uniforms: intUniforms,
  clipping: true,
  clippingPlanes: [clippingPlaneInv],
  side: THREE.BackSide
});

const helperGeo = new THREE.PlaneGeometry(3, 3);
const helperMat = new THREE.MeshBasicMaterial({
  color: 0x00c8ff, transparent: true, opacity: 0.15,
  side: THREE.DoubleSide, depthWrite: false
});
const helperMesh = new THREE.Mesh(helperGeo, helperMat);
scene.add(helperMesh);

let modelLoaded = false;
let meshCount = 0;
let modelGroup = null;
let interiorGroup = null;
let veinAnimationActive = false;
let frameCount = 0;
let cutAxis = 'Y';
let cutOffset = 0;
let prevTime = performance.now();

window.__3D_STATE__ = {
  modelLoaded: false, meshCount: 0, cutPlaneOffset: 0, cutPlaneAxis: 'Y',
  cutPlaneNormal: [0, 1, 0], veinScale: 2.0, veinIntensity: 0.7,
  noiseOffset: [0, 0, 0], veinAnimationActive: false, helperVisible: true,
  baseColor: [...baseColorDefault], veinColor: [...veinColorDefault],
  interiorPassEnabled: false, clippingEnabled: true, frameCount: 0, cameraDistance: 3.5
};

function updateClipPlane() {
  const n = cutAxis === 'X' ? new THREE.Vector3(1,0,0) : cutAxis === 'Z' ? new THREE.Vector3(0,0,1) : new THREE.Vector3(0,1,0);
  clippingPlane.normal.copy(n);
  clippingPlane.constant = -cutOffset;
  clippingPlaneInv.normal.copy(n).negate();
  clippingPlaneInv.constant = cutOffset;
  helperMesh.position.set(0, 0, 0);
  if (cutAxis === 'X') { helperMesh.position.x = cutOffset; helperMesh.rotation.set(0, Math.PI/2, 0); }
  else if (cutAxis === 'Z') { helperMesh.position.z = cutOffset; helperMesh.rotation.set(Math.PI/2, 0, 0); }
  else { helperMesh.position.y = cutOffset; helperMesh.rotation.set(0, 0, 0); }
}
updateClipPlane();

const loader = new GLTFLoader();
loader.load('RobotExpressive.glb', (gltf) => {
  modelGroup = gltf.scene;
  const box = new THREE.Box3().setFromObject(modelGroup);
  const center = box.getCenter(new THREE.Vector3());
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const s = 2.0 / sphere.radius;
  modelGroup.position.sub(center).multiplyScalar(s);
  modelGroup.scale.multiplyScalar(s);
  // Recompute after transform
  const box2 = new THREE.Box3().setFromObject(modelGroup);
  const center2 = box2.getCenter(new THREE.Vector3());
  modelGroup.position.sub(center2);

  let mc = 0;
  modelGroup.traverse((child) => {
    if (child.isMesh) { child.material = marbleMat; mc++; }
  });
  meshCount = mc;
  scene.add(modelGroup);

  // Interior pass clone
  interiorGroup = modelGroup.clone(true);
  interiorGroup.traverse((child) => {
    if (child.isMesh) { child.material = interiorMat; }
  });
  scene.add(interiorGroup);

  modelLoaded = true;
  window.__3D_STATE__.modelLoaded = true;
  window.__3D_STATE__.meshCount = meshCount;
  window.__3D_STATE__.interiorPassEnabled = true;
}, undefined, (err) => { console.error('Model load error', err); });

// Controls
const cutHeightSlider = document.getElementById('cutHeightSlider');
const veinScaleSlider = document.getElementById('veinScaleSlider');
const veinIntensitySlider = document.getElementById('veinIntensitySlider');
const cutAxisSelect = document.getElementById('cutAxisSelect');
const toggleHelperBtn = document.getElementById('toggleHelperBtn');
const animateVeinsBtn = document.getElementById('animateVeinsBtn');

cutHeightSlider.addEventListener('input', () => {
  cutOffset = parseFloat(cutHeightSlider.value);
  document.getElementById('cutHeightVal').textContent = cutOffset.toFixed(2);
  updateClipPlane();
});
veinScaleSlider.addEventListener('input', () => {
  const v = parseFloat(veinScaleSlider.value);
  extUniforms.veinScale.value = v;
  intUniforms.veinScale.value = v;
  document.getElementById('veinScaleVal').textContent = v.toFixed(1);
});
veinIntensitySlider.addEventListener('input', () => {
  const v = parseFloat(veinIntensitySlider.value);
  extUniforms.veinIntensity.value = v;
  intUniforms.veinIntensity.value = v;
  document.getElementById('veinIntensityVal').textContent = v.toFixed(2);
});
cutAxisSelect.addEventListener('change', () => {
  cutAxis = cutAxisSelect.value;
  updateClipPlane();
});
toggleHelperBtn.addEventListener('click', () => { helperMesh.visible = !helperMesh.visible; });
animateVeinsBtn.addEventListener('click', () => { veinAnimationActive = !veinAnimationActive; });

function resetDefaults() {
  cutOffset = 0; cutAxis = 'Y'; veinAnimationActive = false;
  cutHeightSlider.value = 0; document.getElementById('cutHeightVal').textContent = '0.00';
  veinScaleSlider.value = 2.0; document.getElementById('veinScaleVal').textContent = '2.0';
  veinIntensitySlider.value = 0.7; document.getElementById('veinIntensityVal').textContent = '0.70';
  cutAxisSelect.value = 'Y';
  extUniforms.veinScale.value = 2.0; intUniforms.veinScale.value = 2.0;
  extUniforms.veinIntensity.value = 0.7; intUniforms.veinIntensity.value = 0.7;
  extUniforms.noiseOffset.value.set(0, 0, 0); intUniforms.noiseOffset.value.set(0, 0, 0);
  helperMesh.visible = true;
  updateClipPlane();
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'r' || e.key === 'R') resetDefaults();
  if (e.key === 'h' || e.key === 'H') helperMesh.visible = !helperMesh.visible;
  if (e.key === ' ') { e.preventDefault(); veinAnimationActive = !veinAnimationActive; }
});

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - prevTime) / 1000;
  prevTime = now;

  if (veinAnimationActive) {
    extUniforms.noiseOffset.value.z += 0.3 * dt;
    intUniforms.noiseOffset.value.z = extUniforms.noiseOffset.value.z;
  }

  controls.update();
  renderer.render(scene, camera);
  frameCount++;

  const no = extUniforms.noiseOffset.value;
  const cn = clippingPlane.normal;
  window.__3D_STATE__.modelLoaded = modelLoaded;
  window.__3D_STATE__.meshCount = meshCount;
  window.__3D_STATE__.cutPlaneOffset = cutOffset;
  window.__3D_STATE__.cutPlaneAxis = cutAxis;
  window.__3D_STATE__.cutPlaneNormal = [cn.x, cn.y, cn.z];
  window.__3D_STATE__.veinScale = extUniforms.veinScale.value;
  window.__3D_STATE__.veinIntensity = extUniforms.veinIntensity.value;
  window.__3D_STATE__.noiseOffset = [no.x, no.y, no.z];
  window.__3D_STATE__.veinAnimationActive = veinAnimationActive;
  window.__3D_STATE__.helperVisible = helperMesh.visible;
  window.__3D_STATE__.baseColor = [...baseColorDefault];
  window.__3D_STATE__.veinColor = [...veinColorDefault];
  window.__3D_STATE__.interiorPassEnabled = interiorGroup !== null;
  window.__3D_STATE__.clippingEnabled = renderer.localClippingEnabled;
  window.__3D_STATE__.frameCount = frameCount;
  window.__3D_STATE__.cameraDistance = camera.position.length();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
