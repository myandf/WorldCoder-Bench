<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantilever Beam Stress Deflection Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .panel {
            position: absolute;
            background: rgba(30, 30, 40, 0.85);
            border: 1px solid #445;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }
        #controlsPanel {
            top: 20px;
            left: 20px;
            width: 300px;
        }
        #infoPanel {
            top: 20px;
            right: 20px;
            width: 250px;
        }
        h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 1px solid #556;
            padding-bottom: 5px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #aaa;
        }
        select, input[type="range"], button {
            width: 100%;
            padding: 8px;
            background: #2a2a3a;
            color: #fff;
            border: 1px solid #556;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="range"] {
            padding: 0;
        }
        button {
            cursor: pointer;
            background: #4a90d9;
            border: none;
            font-weight: bold;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:hover {
            background: #5ba0e9;
        }
        button.secondary {
            background: #556;
        }
        button.secondary:hover {
            background: #667;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .info-value {
            font-weight: bold;
            color: #4a90d9;
        }
        #yieldWarning {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2em;
            display: none;
            animation: flash 0.5s infinite alternate;
            pointer-events: none;
        }
        @keyframes flash {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
        .checkbox-group {
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }
        #segmentInfo {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.8em;
            pointer-events: none;
            display: none;
            border: 1px solid #4a90d9;
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }
        #measureBtn.active {
            background: #e67e22;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controlsPanel" class="panel">
        <h3>Beam Controls</h3>
        
        <div class="control-group">
            <label for="materialSelect">Material</label>
            <select id="materialSelect">
                <option value="Steel">Steel</option>
                <option value="Aluminum">Aluminum</option>
                <option value="Wood">Wood</option>
                <option value="Concrete">Concrete</option>
            </select>
        </div>

        <div class="control-group">
            <label for="forceSlider">Applied Force: <span id="forceLabel">0</span> N</label>
            <input type="range" id="forceSlider" min="0" max="50000" step="500" value="0">
        </div>

        <div class="control-group">
            <button id="applyImpact">Apply Impact Load (30kN)</button>
            <button id="resetBtn" class="secondary">Reset</button>
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="showStressColors" checked>
            <label for="showStressColors" style="margin:0;">Show Stress Colors</label>
        </div>

        <div class="control-group">
            <button id="measureBtn" class="secondary">Toggle Measurement Mode</button>
        </div>
    </div>

    <div id="infoPanel" class="panel">
        <h3>Simulation Data</h3>
        <div class="info-row"><span>Material:</span> <span id="currentMaterial" class="info-value">Steel</span></div>
        <div class="info-row"><span>Force:</span> <span id="displayForce" class="info-value">0.00 kN</span></div>
        <div class="info-row"><span>Max Deflection:</span> <span id="maxDeflection" class="info-value">0.00 mm</span></div>
        <div class="info-row"><span>Max Stress:</span> <span id="maxStress" class="info-value">0.00 MPa</span></div>
        <div class="info-row"><span>Safety Factor:</span> <span id="safetyFactor" class="info-value">N/A</span></div>
        <div class="info-row"><span>Beam Energy:</span> <span id="beamEnergy" class="info-value">0.00 J</span></div>
    </div>

    <div id="yieldWarning">YIELD STRESS EXCEEDED!</div>
    <div id="segmentInfo"></div>

    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- State Management ---
        window.__3D_STATE__ = {
            sceneReady: false,
            beamSegments: 20,
            currentMaterial: 'Steel',
            youngsModulus: 200e9,
            appliedForce: 0,
            maxDeflection: 0,
            maxDeflectionMM: 0,
            maxStress: 0,
            maxStressMPa: 0,
            safetyFactor: null,
            yieldStrength: 250e6,
            yieldExceeded: false,
            beamEnergy: 0,
            stressColorsEnabled: true,
            measurementMode: false,
            selectedSegmentIndex: null,
            selectedSegmentDeflection: null,
            selectedSegmentStress: null,
            glbLoaded: false,
            segmentDeflections: new Array(20).fill(0),
            segmentStresses: new Array(20).fill(0),
            animationProgress: 1,
            beamLength: 6,
            momentOfInertia: 0.0002
        };

        const state = window.__3D_STATE__;

        // --- Constants & Materials ---
        const BEAM_L = 6;
        const BEAM_H = 0.3;
        const BEAM_W = 0.8;
        const I = 0.0002;
        const SEGMENTS = 20;
        const SEG_L = BEAM_L / SEGMENTS;

        const MATERIALS = {
            'Steel': { E: 200e9, yield: 250e6, color: 0x4a90d9 },
            'Aluminum': { E: 69e9, yield: 270e6, color: 0xc0c0c0 },
            'Wood': { E: 12e9, yield: 40e6, color: 0x8B4513 },
            'Concrete': { E: 30e9, yield: 30e6, color: 0x808080 }
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(8, 6, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(3, 1.5, 0);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Ground ---
        const groundGeo = new THREE.PlaneGeometry(30, 30);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- GLTF Model ---
        const loader = new GLTFLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/models/gltf/MaterialsVariantsShoe/glTF/MaterialsVariantsShoe.gltf', (gltf) => {
            const shoe = gltf.scene;
            shoe.scale.set(8, 8, 8); // Scale to roughly 0.8 units
            shoe.position.set(4, 0.1, 4);
            shoe.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(shoe);
            state.glbLoaded = true;
            checkSceneReady();
        }, undefined, (error) => {
            console.error('Error loading GLTF:', error);
            // Proceed even if decorative model fails
            state.glbLoaded = true;
            checkSceneReady();
        });

        // --- Beam Construction ---
        const beamGroup = new THREE.Group();
        scene.add(beamGroup);

        // Support Column
        const supportGeo = new THREE.BoxGeometry(0.4, 3, 0.8);
        const supportMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
        const support = new THREE.Mesh(supportGeo, supportMat);
        support.position.set(0, 1.5, 0);
        support.castShadow = true;
        support.receiveShadow = true;
        scene.add(support);

        // Beam Segments
        const segmentMeshes = [];
        const segmentGeo = new THREE.BoxGeometry(SEG_L, BEAM_H, BEAM_W);
        
        for (let i = 0; i < SEGMENTS; i++) {
            const mat = new THREE.MeshStandardMaterial({ color: MATERIALS[state.currentMaterial].color });
            const mesh = new THREE.Mesh(segmentGeo, mat);
            
            // Local x center of this segment
            const xLocal = (i + 0.5) * SEG_L;
            mesh.position.set(xLocal, 3, 0);
            mesh.userData = { index: i, xLocal: xLocal };
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            beamGroup.add(mesh);
            segmentMeshes.push(mesh);
        }

        let targetDeflections = new Array(SEGMENTS).fill(0);
        let currentDeflections = new Array(SEGMENTS).fill(0);

        function checkSceneReady() {
            if (state.glbLoaded) {
                state.sceneReady = true;
            }
        }
        checkSceneReady(); // In case GLTF fails or is skipped

        // --- Physics & Updates ---
        function calculatePhysics() {
            const F = state.appliedForce;
            const E = state.youngsModulus;
            const yieldStrength = state.yieldStrength;

            state.maxDeflection = (F * Math.pow(BEAM_L, 3)) / (3 * E * I);
            state.maxDeflectionMM = state.maxDeflection * 1000;
            
            state.maxStress = (F * BEAM_L * (BEAM_H / 2)) / I;
            state.maxStressMPa = state.maxStress / 1e6;

            state.safetyFactor = F > 0 ? yieldStrength / state.maxStress : null;
            state.yieldExceeded = state.maxStress > yieldStrength;
            state.beamEnergy = 0.5 * F * state.maxDeflection;

            for (let i = 0; i < SEGMENTS; i++) {
                const x = segmentMeshes[i].userData.xLocal;
                
                // Deflection: δ(x) = (F * x²) / (6 * E * I) * (3L - x)
                const defl = (F * x * x) / (6 * E * I) * (3 * BEAM_L - x);
                targetDeflections[i] = defl;
                state.segmentDeflections[i] = defl;

                // Stress: σ(x) = F * (L - x) * (h/2) / I
                const stress = (F * (BEAM_L - x) * (BEAM_H / 2)) / I;
                state.segmentStresses[i] = stress;
            }

            updateUI();
        }

        function getStressColor(stress, yieldStrength) {
            let t = Math.min(Math.max(stress / yieldStrength, 0), 1);
            
            const cBlue = new THREE.Color(0x0000ff);
            const cGreen = new THREE.Color(0x00ff00);
            const cYellow = new THREE.Color(0xffff00);
            const cRed = new THREE.Color(0xff0000);
            
            let color = new THREE.Color();
            if (t < 0.33) {
                color.lerpColors(cBlue, cGreen, t / 0.33);
            } else if (t < 0.66) {
                color.lerpColors(cGreen, cYellow, (t - 0.33) / 0.33);
            } else {
                color.lerpColors(cYellow, cRed, (t - 0.66) / 0.34);
            }
            return color;
        }

        // --- UI Updates ---
        const ui = {
            forceLabel: document.getElementById('forceLabel'),
            currentMaterial: document.getElementById('currentMaterial'),
            displayForce: document.getElementById('displayForce'),
            maxDeflection: document.getElementById('maxDeflection'),
            maxStress: document.getElementById('maxStress'),
            safetyFactor: document.getElementById('safetyFactor'),
            beamEnergy: document.getElementById('beamEnergy'),
            yieldWarning: document.getElementById('yieldWarning'),
            segmentInfo: document.getElementById('segmentInfo')
        };

        function updateUI() {
            ui.forceLabel.textContent = state.appliedForce;
            ui.currentMaterial.textContent = state.currentMaterial;
            ui.displayForce.textContent = (state.appliedForce / 1000).toFixed(2) + ' kN';
            ui.maxDeflection.textContent = state.maxDeflectionMM.toFixed(2) + ' mm';
            ui.maxStress.textContent = state.maxStressMPa.toFixed(2) + ' MPa';
            
            if (state.safetyFactor === null) {
                ui.safetyFactor.textContent = 'N/A';
                ui.safetyFactor.style.color = '#4a90d9';
            } else {
                ui.safetyFactor.textContent = state.safetyFactor.toFixed(2);
                ui.safetyFactor.style.color = state.safetyFactor < 1 ? '#ff4444' : '#44ff44';
            }
            
            ui.beamEnergy.textContent = state.beamEnergy.toFixed(2) + ' J';

            if (state.yieldExceeded) {
                ui.yieldWarning.style.display = 'block';
            } else {
                ui.yieldWarning.style.display = 'none';
            }
        }

        // --- Event Listeners ---
        document.getElementById('materialSelect').addEventListener('change', (e) => {
            const matName = e.target.value;
            state.currentMaterial = matName;
            state.youngsModulus = MATERIALS[matName].E;
            state.yieldStrength = MATERIALS[matName].yield;
            
            // Update base colors if stress colors are off
            if (!state.stressColorsEnabled) {
                const baseColor = MATERIALS[matName].color;
                segmentMeshes.forEach(mesh => mesh.material.color.setHex(baseColor));
            }
            calculatePhysics();
        });

        const forceSlider = document.getElementById('forceSlider');
        forceSlider.addEventListener('input', (e) => {
            state.appliedForce = parseFloat(e.target.value);
            calculatePhysics();
        });

        document.getElementById('applyImpact').addEventListener('click', () => {
            state.appliedForce = 30000;
            forceSlider.value = 30000;
            calculatePhysics();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            state.appliedForce = 0;
            forceSlider.value = 0;
            document.getElementById('materialSelect').value = 'Steel';
            state.currentMaterial = 'Steel';
            state.youngsModulus = MATERIALS['Steel'].E;
            state.yieldStrength = MATERIALS['Steel'].yield;
            calculatePhysics();
        });

        document.getElementById('showStressColors').addEventListener('change', (e) => {
            state.stressColorsEnabled = e.target.checked;
            if (!state.stressColorsEnabled) {
                const baseColor = MATERIALS[state.currentMaterial].color;
                segmentMeshes.forEach(mesh => mesh.material.color.setHex(baseColor));
            }
        });

        const measureBtn = document.getElementById('measureBtn');
        measureBtn.addEventListener('click', () => {
            state.measurementMode = !state.measurementMode;
            measureBtn.classList.toggle('active', state.measurementMode);
            if (!state.measurementMode) {
                ui.segmentInfo.style.display = 'none';
                state.selectedSegmentIndex = null;
            }
        });

        // --- Raycasting for Measurement Mode ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            if (!state.measurementMode) return;

            // Don't raycast if clicking on UI
            if (event.target.closest('.panel')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(segmentMeshes);

            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                const idx = mesh.userData.index;
                
                state.selectedSegmentIndex = idx;
                state.selectedSegmentDeflection = state.segmentDeflections[idx] * 1000;
                state.selectedSegmentStress = state.segmentStresses[idx] / 1e6;

                ui.segmentInfo.innerHTML = `
                    Segment: ${idx + 1}<br>
                    Deflection: ${state.selectedSegmentDeflection.toFixed(2)} mm<br>
                    Stress: ${state.selectedSegmentStress.toFixed(2)} MPa
                `;
                ui.segmentInfo.style.display = 'block';
                ui.segmentInfo.style.left = event.clientX + 'px';
                ui.segmentInfo.style.top = event.clientY + 'px';
            } else {
                ui.segmentInfo.style.display = 'none';
                state.selectedSegmentIndex = null;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        let blinkTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            blinkTimer += dt;
            const isBlinkOn = (blinkTimer % 0.5) < 0.25;

            // Lerp deflections
            const lerpFactor = 10 * dt; // Adjust for speed
            
            for (let i = 0; i < SEGMENTS; i++) {
                currentDeflections[i] += (targetDeflections[i] - currentDeflections[i]) * lerpFactor;
                
                const mesh = segmentMeshes[i];
                // Apply deflection (downward)
                mesh.position.y = 3 - currentDeflections[i];

                // Apply rotation to match curve derivative roughly
                if (i > 0) {
                    const dy = currentDeflections[i] - currentDeflections[i-1];
                    const dx = SEG_L;
                    mesh.rotation.z = -Math.atan2(dy, dx);
                }

                // Update Colors
                if (state.stressColorsEnabled) {
                    const stress = state.segmentStresses[i];
                    if (state.yieldExceeded && stress > state.yieldStrength && isBlinkOn) {
                        mesh.material.color.setHex(0xffffff); // Blink white
                    } else {
                        mesh.material.color.copy(getStressColor(stress, state.yieldStrength));
                    }
                } else {
                    mesh.material.color.setHex(MATERIALS[state.currentMaterial].color);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize
        calculatePhysics();
        animate();

    </script>
</body>
</html>
