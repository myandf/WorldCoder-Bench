<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer Procedural Walk Cycle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a2a; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px;
    background: rgba(0,0,0,0.7); color: #eee;
    padding: 12px 16px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    min-width: 220px; font-size: 13px; line-height: 1.7;
    pointer-events: none;
  }
  #hud .char-row { font-size: 12px; }
  #controls {
    position: fixed; top: 12px; left: 12px;
    padding: 12px 16px; border-radius: 8px;
    min-width: 220px;
  }
  #infoPanel {
    background: rgba(0,0,0,0.7); color: #eee;
    padding: 12px 16px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 13px; line-height: 1.7; margin-bottom: 8px;
  }
  #btnRow {
    display: flex; gap: 6px; margin-bottom: 8px;
  }
  #btnRow button {
    flex: 1; padding: 6px 4px; border: none; border-radius: 5px;
    background: rgba(255,255,255,0.15); color: #eee;
    cursor: pointer; font-size: 12px; font-family: monospace;
    transition: background 0.2s;
  }
  #btnRow button:hover { background: rgba(255,255,255,0.3); }
  #sliderRow {
    background: rgba(0,0,0,0.7); padding: 8px 12px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
    color: #eee; font-size: 12px;
  }
  #sliderRow input { width: 100%; margin-top: 4px; cursor: pointer; }
  #keys-hint {
    position: fixed; bottom: 12px; left: 12px;
    background: rgba(0,0,0,0.6); color: #aaa;
    padding: 8px 12px; border-radius: 6px; font-size: 11px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="controls">
  <div id="infoPanel">
    <div id="infoText">Loading...</div>
  </div>
  <div id="btnRow">
    <button id="addCharBtn">Add Char</button>
    <button id="removeCharBtn">Remove</button>
    <button id="pauseBtn">Pause</button>
  </div>
  <div id="sliderRow">
    <label>Global Speed: <span id="speedLabel">1.0</span></label>
    <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1.0">
  </div>
</div>
<div id="keys-hint">
  Keys: 1-4 select | W/S speed ±0.2 | R reset
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ── Scene ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0a0a2a);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0a2a, 30, 60);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 8, 18);
camera.lookAt(0, 0, 0);

// ── Lights ─────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(5, 12, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 60;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

// ── Ground ─────────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x111133 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid overlay
const gridHelper = new THREE.GridHelper(40, 20, 0x223366, 0x1a2244);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// ── Character colors ───────────────────────────────────────────────────────
const COLORS = [0xe74c3c, 0x3498db, 0x2ecc71, 0xe67e22];
const CIRCLE_RADIUS = 6;
const PATH_SPEED = 0.8; // units/sec at speed=1

// ── Build a stick-figure biped ─────────────────────────────────────────────
function buildCharacter(colorHex) {
  const mat = new THREE.MeshLambertMaterial({ color: colorHex });
  const emMat = new THREE.MeshLambertMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.4 });
  const root = new THREE.Group();

  // Head
  const headGeo = new THREE.SphereGeometry(0.22, 12, 10);
  const head = new THREE.Mesh(headGeo, mat);
  head.position.y = 1.22;
  head.castShadow = true;
  root.add(head);

  // Torso
  const torsoGeo = new THREE.BoxGeometry(0.38, 0.55, 0.22);
  const torso = new THREE.Mesh(torsoGeo, mat);
  torso.position.y = 0.82;
  torso.castShadow = true;
  root.add(torso);

  // Helper: cylinder limb
  function limb(rTop, rBot, h, segs) {
    const g = new THREE.CylinderGeometry(rTop, rBot, h, segs);
    const m = new THREE.Mesh(g, mat);
    m.castShadow = true;
    return m;
  }

  // ── Arms ──
  // Left shoulder pivot (attached to torso top-left)
  const lShoulderPivot = new THREE.Group();
  lShoulderPivot.position.set(-0.26, 0.82, 0);
  root.add(lShoulderPivot);
  const lUpperArm = limb(0.055, 0.05, 0.32, 8);
  lUpperArm.position.y = -0.16;
  lShoulderPivot.add(lUpperArm);
  const lElbowPivot = new THREE.Group();
  lElbowPivot.position.y = -0.32;
  lShoulderPivot.add(lElbowPivot);
  const lLowerArm = limb(0.05, 0.04, 0.28, 8);
  lLowerArm.position.y = -0.14;
  lElbowPivot.add(lLowerArm);

  const rShoulderPivot = new THREE.Group();
  rShoulderPivot.position.set(0.26, 0.82, 0);
  root.add(rShoulderPivot);
  const rUpperArm = limb(0.055, 0.05, 0.32, 8);
  rUpperArm.position.y = -0.16;
  rShoulderPivot.add(rUpperArm);
  const rElbowPivot = new THREE.Group();
  rElbowPivot.position.y = -0.32;
  rShoulderPivot.add(rElbowPivot);
  const rLowerArm = limb(0.05, 0.04, 0.28, 8);
  rLowerArm.position.y = -0.14;
  rElbowPivot.add(rLowerArm);

  // ── Legs ──
  const lHipPivot = new THREE.Group();
  lHipPivot.position.set(-0.13, 0.54, 0);
  root.add(lHipPivot);
  const lUpperLeg = limb(0.07, 0.065, 0.38, 8);
  lUpperLeg.position.y = -0.19;
  lHipPivot.add(lUpperLeg);
  const lKneePivot = new THREE.Group();
  lKneePivot.position.y = -0.38;
  lHipPivot.add(lKneePivot);
  const lLowerLeg = limb(0.065, 0.05, 0.36, 8);
  lLowerLeg.position.y = -0.18;
  lKneePivot.add(lLowerLeg);

  const rHipPivot = new THREE.Group();
  rHipPivot.position.set(0.13, 0.54, 0);
  root.add(rHipPivot);
  const rUpperLeg = limb(0.07, 0.065, 0.38, 8);
  rUpperLeg.position.y = -0.19;
  rHipPivot.add(rUpperLeg);
  const rKneePivot = new THREE.Group();
  rKneePivot.position.y = -0.38;
  rHipPivot.add(rKneePivot);
  const rLowerLeg = limb(0.065, 0.05, 0.36, 8);
  rLowerLeg.position.y = -0.18;
  rKneePivot.add(rLowerLeg);

  // Selection ring
  const ringGeo = new THREE.RingGeometry(0.45, 0.55, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  ring.visible = false;
  root.add(ring);

  return {
    root,
    joints: {
      lHip: lHipPivot, rHip: rHipPivot,
      lKnee: lKneePivot, rKneePivot: rKneePivot,
      lShoulder: lShoulderPivot, rShoulder: rShoulderPivot,
      lElbow: lElbowPivot, rElbow: rElbowPivot
    },
    ring
  };
}

// ── State ──────────────────────────────────────────────────────────────────
let globalSpeed = 1.0;
let paused = false;
let selectedCharacter = 0;
let elapsedTime = 0;

const characters = []; // array of { mesh, joints, ring, individualSpeed, pathAngle, colorHex }

function getSpawnAngle(index, total) {
  return (index / total) * Math.PI * 2;
}

function addCharacter() {
  if (characters.length >= 4) return;
  const idx = characters.length;
  const total = idx + 1;

  // Reposition existing characters evenly
  characters.forEach((c, i) => {
    c.pathAngle = getSpawnAngle(i, total);
  });

  const colorHex = COLORS[idx];
  const built = buildCharacter(colorHex);
  scene.add(built.root);

  const pathAngle = getSpawnAngle(idx, total);
  const char = {
    root: built.root,
    joints: built.joints,
    ring: built.ring,
    individualSpeed: 1.0,
    pathAngle,
    colorHex
  };
  characters.push(char);

  // Position on circle
  updateCharPosition(char);
  updateSelectionRings();
}

function removeCharacter() {
  if (characters.length <= 1) return;
  const last = characters.pop();
  scene.remove(last.root);
  // Dispose geometries/materials
  last.root.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  });

  if (selectedCharacter >= characters.length) {
    selectedCharacter = characters.length - 1;
  }

  // Reposition remaining evenly
  const total = characters.length;
  characters.forEach((c, i) => {
    c.pathAngle = getSpawnAngle(i, total);
  });
  updateSelectionRings();
}

function updateCharPosition(char) {
  char.root.position.x = Math.cos(char.pathAngle) * CIRCLE_RADIUS;
  char.root.position.z = Math.sin(char.pathAngle) * CIRCLE_RADIUS;
  char.root.position.y = 0;
  // Face tangent direction (perpendicular to radius, counter-clockwise)
  const tangentAngle = char.pathAngle + Math.PI / 2;
  char.root.rotation.y = -tangentAngle;
}

function updateSelectionRings() {
  characters.forEach((c, i) => {
    c.ring.visible = (i === selectedCharacter);
  });
}

// ── Walk cycle ─────────────────────────────────────────────────────────────
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function animateCharacter(char, phase) {
  const j = char.joints;

  // Hip: -0.6 to +0.6
  const hipL = clamp(Math.sin(phase) * 0.6, -0.6, 0.6);
  const hipR = clamp(-Math.sin(phase) * 0.6, -0.6, 0.6);
  j.lHip.rotation.x = hipL;
  j.rHip.rotation.x = hipR;

  // Knee: -0.8 to 0.0 (only bend backward = negative x)
  // Knee bends when leg is swinging back
  const kneeL = clamp((-Math.sin(phase) * 0.5 - 0.3) * 0.8, -0.8, 0.0);
  const kneeR = clamp((Math.sin(phase) * 0.5 - 0.3) * 0.8, -0.8, 0.0);
  j.lKnee.rotation.x = kneeL;
  j.rKneePivot.rotation.x = kneeR;

  // Shoulder: opposite to hip, -0.5 to +0.5
  const shoulderL = clamp(-Math.sin(phase) * 0.5, -0.5, 0.5);
  const shoulderR = clamp(Math.sin(phase) * 0.5, -0.5, 0.5);
  j.lShoulder.rotation.x = shoulderL;
  j.rShoulder.rotation.x = shoulderR;

  // Elbow: -0.7 to 0.0
  const elbowL = clamp((-Math.abs(Math.sin(phase)) * 0.5 - 0.1), -0.7, 0.0);
  const elbowR = clamp((-Math.abs(Math.cos(phase)) * 0.5 - 0.1), -0.7, 0.0);
  j.lElbow.rotation.x = elbowL;
  j.rElbow.rotation.x = elbowR;

  return { hipL, hipR, kneeL, kneeR };
}

// ── Init first character ───────────────────────────────────────────────────
addCharacter();
selectedCharacter = 0;
updateSelectionRings();

// ── UI wiring ──────────────────────────────────────────────────────────────
document.getElementById('addCharBtn').addEventListener('click', () => {
  addCharacter();
});
document.getElementById('removeCharBtn').addEventListener('click', () => {
  removeCharacter();
});
document.getElementById('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
});

const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
speedSlider.addEventListener('input', () => {
  globalSpeed = parseFloat(speedSlider.value);
  speedLabel.textContent = globalSpeed.toFixed(1);
});

document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (['1','2','3','4'].includes(key)) {
    const idx = parseInt(key) - 1;
    if (idx < characters.length) {
      selectedCharacter = idx;
      updateSelectionRings();
    }
  }
  if (key === 'w' || key === 'W') {
    if (selectedCharacter >= 0 && selectedCharacter < characters.length) {
      characters[selectedCharacter].individualSpeed = clamp(
        characters[selectedCharacter].individualSpeed + 0.2, 0.0, 3.0
      );
    }
  }
  if (key === 's' || key === 'S') {
    if (selectedCharacter >= 0 && selectedCharacter < characters.length) {
      characters[selectedCharacter].individualSpeed = clamp(
        characters[selectedCharacter].individualSpeed - 0.2, 0.0, 3.0
      );
    }
  }
  if (key === 'r' || key === 'R') {
    characters.forEach((c, i) => {
      c.individualSpeed = 1.0;
      c.pathAngle = getSpawnAngle(i, characters.length);
    });
    globalSpeed = 1.0;
    speedSlider.value = '1.0';
    speedLabel.textContent = '1.0';
  }
});

// ── HUD update ─────────────────────────────────────────────────────────────
function updateHUD() {
  const lines = [
    `Characters: ${characters.length}/4`,
    `Selected: ${selectedCharacter + 1}`,
    `Global Speed: ${globalSpeed.toFixed(1)}`,
    `Paused: ${paused}`,
    `Time: ${elapsedTime.toFixed(2)}s`,
    `─────────────────`,
  ];
  characters.forEach((c, i) => {
    const eff = (globalSpeed * c.individualSpeed).toFixed(2);
    lines.push(`P${i+1}: spd=${c.individualSpeed.toFixed(1)} eff=${eff}`);
  });
  document.getElementById('infoText').innerHTML = lines.join('<br>');
}

// ── Animation loop ─────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let lastTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (!paused) {
    elapsedTime += delta;

    characters.forEach(char => {
      const effSpeed = globalSpeed * char.individualSpeed;
      // Advance path angle
      const angularVelocity = (PATH_SPEED * effSpeed) / CIRCLE_RADIUS;
      char.pathAngle += angularVelocity * delta;

      // Update position
      updateCharPosition(char);

      // Walk cycle phase
      const phase = effSpeed * elapsedTime * 2.0;
      animateCharacter(char, phase);
    });
  }

  updateHUD();
  updateState();
  renderer.render(scene, camera);
}

// ── window.__3D_STATE__ ────────────────────────────────────────────────────
function updateState() {
  const cyclePhases = characters.map(c => {
    const effSpeed = globalSpeed * c.individualSpeed;
    return effSpeed * elapsedTime * 2.0;
  });

  const charsState = characters.map(c => {
    const phase = globalSpeed * c.individualSpeed * elapsedTime * 2.0;
    const hipL = clamp(Math.sin(phase) * 0.6, -0.6, 0.6);
    const hipR = clamp(-Math.sin(phase) * 0.6, -0.6, 0.6);
    const kneeL = clamp((-Math.sin(phase) * 0.5 - 0.3) * 0.8, -0.8, 0.0);
    const kneeR = clamp((Math.sin(phase) * 0.5 - 0.3) * 0.8, -0.8, 0.0);
    return {
      individualSpeed: c.individualSpeed,
      positionX: c.root.position.x,
      positionZ: c.root.position.z,
      hipAngleLeft: hipL,
      hipAngleRight: hipR,
      kneeAngleLeft: kneeL,
      kneeAngleRight: kneeR,
      pathAngle: c.pathAngle
    };
  });

  window.__3D_STATE__ = {
    characterCount: characters.length,
    selectedCharacter,
    globalSpeed,
    paused,
    characters: charsState,
    elapsedTime,
    cyclePhases
  };
}

// ── Resize ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
