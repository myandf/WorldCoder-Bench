<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Portal Warp UV Distortion</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: monospace;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(10, 10, 26, 0.72);
      color: white;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      white-space: pre-line;
      pointer-events: none;
      font-size: 14px;
      line-height: 1.45;
    }
    #loading {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 10;
      background: rgba(10,10,26,0.6);
      color: #bfefff;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="loading">Loading models...</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0a0a1a');

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(3, 5, 2);
    scene.add(dirLight);

    const hud = document.getElementById('hud');
    const loading = document.getElementById('loading');

    const clock = new THREE.Clock();

    const portalUniforms = {
      uTime: { value: 0 },
      uWarpStrength: { value: 0.5 },
      uSwirlSpeed: { value: 1.0 },
      uChromaticOffset: { value: 0.02 },
      uPortalActive: { value: 1.0 }
    };

    const portalVertexShader = `
      varying vec2 vUv;
      uniform float uTime;
      void main() {
        vUv = uv;
        vec3 pos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `;

    const portalFragmentShader = `
      varying vec2 vUv;
      uniform float uTime;
      uniform float uWarpStrength;
      uniform float uSwirlSpeed;
      uniform float uChromaticOffset;
      uniform float uPortalActive;

      vec2 radialWarp(vec2 uv, vec2 center, float time, float strength) {
        vec2 d = uv - center;
        float r = length(d);
        float wave = sin(r * 18.0 - time * 3.0) * cos(r * 12.0 + time * 2.0);
        if (r > 0.0001) {
          d += normalize(d) * wave * 0.08 * strength;
        }
        return center + d;
      }

      vec2 swirl(vec2 uv, vec2 center, float time, float speed, float strength) {
        vec2 d = uv - center;
        float r = length(d);
        float angle = (1.0 - smoothstep(0.0, 0.75, r)) * (1.4 - r) * speed * 1.4
                    + sin(time * 1.7 + r * 10.0) * 0.2 * strength;
        float s = sin(angle + time * 0.5 * speed);
        float c = cos(angle + time * 0.5 * speed);
        mat2 rot = mat2(c, -s, s, c);
        d = rot * d;
        return center + d;
      }

      float portalMask(vec2 uv, vec2 center) {
        vec2 d = uv - center;
        d.x *= 1.2;
        float r = length(d);
        float inner = 1.0 - smoothstep(0.18, 0.55, r);
        float ring = smoothstep(0.18, 0.28, r) * (1.0 - smoothstep(0.28, 0.48, r));
        return max(inner * 0.75, ring);
      }

      vec3 portalField(vec2 uv) {
        vec2 center = vec2(0.5, 0.5);

        vec2 wuv = radialWarp(uv, center, uTime, uWarpStrength);
        wuv = swirl(wuv, center, uTime, uSwirlSpeed, uWarpStrength);

        vec2 delta = wuv - center;
        float r = length(delta);
        float angle = atan(delta.y, delta.x);

        float band1 = 0.5 + 0.5 * sin(angle * 5.0 - uTime * 3.5 + r * 20.0);
        float band2 = 0.5 + 0.5 * cos(angle * 7.0 + uTime * 2.2 - r * 24.0);
        float energy = mix(band1, band2, 0.5);
        energy *= (1.0 - smoothstep(0.0, 0.7, r));

        vec3 c1 = vec3(0.0, 1.0, 1.0);
        vec3 c2 = vec3(1.0, 0.0, 1.0);
        vec3 grad = mix(c1, c2, 0.5 + 0.5 * sin(angle * 2.0 + uTime + r * 8.0));
        grad *= 0.6 + energy * 1.2;

        float mask = portalMask(uv, center);
        return grad * mask;
      }

      void main() {
        vec2 uv = vUv;
        float active = uPortalActive;

        vec2 offsetVec = vec2(uChromaticOffset, 0.0);
        float r = portalField(uv + offsetVec).r;
        float g = portalField(uv).g;
        float b = portalField(uv - offsetVec).b;

        vec3 color = vec3(r, g, b);
        float alpha = clamp(max(max(color.r, color.g), color.b), 0.0, 1.0) * active;
        alpha *= 1.15;

        gl_FragColor = vec4(color, alpha);
      }
    `;

    const portalMaterial = new THREE.ShaderMaterial({
      uniforms: portalUniforms,
      vertexShader: portalVertexShader,
      fragmentShader: portalFragmentShader,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });

    const portalGroup = new THREE.Group();
    scene.add(portalGroup);

    const leftPortal = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2, 1, 1), portalMaterial);
    leftPortal.position.set(-2.5, 0, 0.12);
    portalGroup.add(leftPortal);

    const rightPortal = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2, 1, 1), portalMaterial);
    rightPortal.position.set(2.5, 0, 0.12);
    portalGroup.add(rightPortal);

    const bridgePortal = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 1.4, 1, 1), portalMaterial);
    bridgePortal.position.set(0, 0, 0);
    portalGroup.add(bridgePortal);

    const beamUniforms = {
      uTime: { value: 0 },
      uPortalActive: portalUniforms.uPortalActive
    };

    const beamMaterial = new THREE.ShaderMaterial({
      uniforms: beamUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uTime;
        uniform float uPortalActive;

        void main() {
          float xFade = 1.0 - abs(vUv.x - 0.5) * 2.0;
          float core = pow(xFade, 3.0);
          float pulse = 0.45 + 0.55 * sin(uTime * 6.0 - vUv.y * 16.0);
          float alpha = core * (0.35 + 0.65 * pulse) * uPortalActive;
          vec3 color = vec3(0.1, 1.0, 1.0) * (1.2 + pulse * 0.6);
          gl_FragColor = vec4(color, alpha);
        }
      `
    });

    const beamGeometry = new THREE.CylinderGeometry(0.16, 0.16, 5.0, 32, 1, true);
    const beam = new THREE.Mesh(beamGeometry, beamMaterial);
    beam.rotation.z = Math.PI / 2;
    beam.position.set(0, 0, 0);
    scene.add(beam);

    const beamGlow = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 5.0, 24, 1, true),
      new THREE.MeshBasicMaterial({
        color: 0x33ffff,
        transparent: true,
        opacity: 0.12,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    beamGlow.rotation.z = Math.PI / 2;
    beamGlow.position.copy(beam.position);
    scene.add(beamGlow);

    function fitModelToBox(object, targetSize = 2.0) {
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = targetSize / maxDim;
      object.scale.multiplyScalar(scale);

      const fittedBox = new THREE.Box3().setFromObject(object);
      const center = new THREE.Vector3();
      fittedBox.getCenter(center);
      object.position.sub(center);
    }

    const loader = new GLTFLoader();
    let modelsLoaded = 0;
    let sourceModel = null;
    let destModel = null;

    function addFallbackModel(type, position) {
      const group = new THREE.Group();
      let mesh;
      if (type === 'window') {
        mesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 1.5, 0.12),
          new THREE.MeshPhysicalMaterial({
            color: 0x88aaff,
            transmission: 0.7,
            transparent: true,
            opacity: 0.6,
            roughness: 0.1,
            metalness: 0.1,
            clearcoat: 1.0
          })
        );
        const frame = new THREE.Mesh(
          new THREE.BoxGeometry(1.8, 1.8, 0.08),
          new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.3, roughness: 0.7 })
        );
        group.add(frame);
      } else {
        mesh = new THREE.Mesh(
          new THREE.SphereGeometry(1, 32, 20),
          new THREE.MeshPhysicalMaterial({
            color: 0x5522aa,
            metalness: 0.8,
            roughness: 0.15,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05
          })
        );
      }
      group.add(mesh);
      fitModelToBox(group, 2.0);
      group.position.copy(position);
      scene.add(group);
      return group;
    }

    function loadModel(url, position, assign) {
      loader.load(
        url,
        (gltf) => {
          const root = gltf.scene || gltf.scenes?.[0];
          fitModelToBox(root, 2.0);
          root.position.copy(position);
          scene.add(root);
          assign(root);
          modelsLoaded++;
          if (modelsLoaded >= 2) loading.textContent = 'Models loaded';
        },
        undefined,
        () => {
          const fallback = addFallbackModel(url.includes('Glass') ? 'window' : 'car', position);
          assign(fallback);
          modelsLoaded++;
          if (modelsLoaded >= 2) loading.textContent = 'Fallback models loaded';
        }
      );
    }

    loadModel('GlassBrokenWindow.glb', new THREE.Vector3(-2.5, 0, 0), (m) => sourceModel = m);
    loadModel('ClearCoatCarPaint.glb', new THREE.Vector3(2.5, 0, 0), (m) => destModel = m);

    const chromaticPresets = [0.02, 0.05, 0.10];
    let chromaticPresetIndex = 0;
    let portalToggleCount = 0;
    let frameCount = 0;

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'w') {
        portalUniforms.uWarpStrength.value = clamp(portalUniforms.uWarpStrength.value + 0.1, 0.0, 2.0);
      } else if (key === 's') {
        portalUniforms.uWarpStrength.value = clamp(portalUniforms.uWarpStrength.value - 0.1, 0.0, 2.0);
      } else if (key === 'q') {
        portalUniforms.uSwirlSpeed.value = clamp(portalUniforms.uSwirlSpeed.value + 0.25, 0.0, 4.0);
      } else if (key === 'e') {
        portalUniforms.uSwirlSpeed.value = clamp(portalUniforms.uSwirlSpeed.value - 0.25, 0.0, 4.0);
      } else if (key === ' ') {
        e.preventDefault();
        portalUniforms.uPortalActive.value = portalUniforms.uPortalActive.value > 0.5 ? 0.0 : 1.0;
        portalToggleCount++;
      } else if (key === 'c') {
        chromaticPresetIndex = (chromaticPresetIndex + 1) % chromaticPresets.length;
        portalUniforms.uChromaticOffset.value = chromaticPresets[chromaticPresetIndex];
      }
    });

    window.__3D_STATE__ = {
      modelsLoaded: 0,
      sourceModelPosition: { x: -2.5, y: 0, z: 0 },
      destModelPosition: { x: 2.5, y: 0, z: 0 },
      warpStrength: portalUniforms.uWarpStrength.value,
      swirlSpeed: portalUniforms.uSwirlSpeed.value,
      chromaticOffset: portalUniforms.uChromaticOffset.value,
      portalActive: true,
      elapsedTime: 0,
      beamVisible: true,
      chromaticPresetIndex: 0,
      frameCount: 0,
      cameraDistance: camera.position.length(),
      portalToggleCount: 0
    };

    function updateHUD() {
      hud.textContent =
`Warp Strength: ${portalUniforms.uWarpStrength.value.toFixed(2)}
Swirl Speed: ${portalUniforms.uSwirlSpeed.value.toFixed(2)}
Chromatic Offset: ${portalUniforms.uChromaticOffset.value.toFixed(2)}
Portal: ${portalUniforms.uPortalActive.value > 0.5 ? 'Active' : 'Inactive'}
Models Loaded: ${modelsLoaded}/2`;
    }

    function updatePortalPositions() {
      if (sourceModel) {
        leftPortal.position.set(sourceModel.position.x, sourceModel.position.y, sourceModel.position.z + 0.12);
      }
      if (destModel) {
        rightPortal.position.set(destModel.position.x, destModel.position.y, destModel.position.z + 0.12);
      }

      const p1 = sourceModel ? sourceModel.position : new THREE.Vector3(-2.5, 0, 0);
      const p2 = destModel ? destModel.position : new THREE.Vector3(2.5, 0, 0);

      const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
      bridgePortal.position.set(mid.x, mid.y, mid.z + 0.02);

      const dist = p1.distanceTo(p2);
      bridgePortal.scale.set(dist / 5.2, 1, 1);

      beam.position.copy(mid);
      beam.scale.set(1, dist / 5.0, 1);
      beam.rotation.z = Math.PI / 2;

      beamGlow.position.copy(mid);
      beamGlow.scale.set(1, dist / 5.0, 1);
      beamGlow.rotation.z = Math.PI / 2;
    }

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;

      const elapsed = clock.getElapsedTime();
      portalUniforms.uTime.value = elapsed;
      beamUniforms.uTime.value = elapsed;

      controls.update();
      updatePortalPositions();

      const active = portalUniforms.uPortalActive.value > 0.5;
      portalGroup.visible = true;
      beam.visible = true;
      beamGlow.visible = true;

      portalMaterial.opacity = active ? 1 : 0;
      beamMaterial.opacity = active ? 1 : 0;
      beamGlow.material.opacity = active ? 0.12 : 0.0;

      if (sourceModel) leftPortal.lookAt(camera.position);
      if (destModel) rightPortal.lookAt(camera.position);
      bridgePortal.lookAt(camera.position);

      updateHUD();

      window.__3D_STATE__.modelsLoaded = modelsLoaded;
      window.__3D_STATE__.sourceModelPosition = sourceModel
        ? { x: sourceModel.position.x, y: sourceModel.position.y, z: sourceModel.position.z }
        : { x: -2.5, y: 0, z: 0 };
      window.__3D_STATE__.destModelPosition = destModel
        ? { x: destModel.position.x, y: destModel.position.y, z: destModel.position.z }
        : { x: 2.5, y: 0, z: 0 };
      window.__3D_STATE__.warpStrength = portalUniforms.uWarpStrength.value;
      window.__3D_STATE__.swirlSpeed = portalUniforms.uSwirlSpeed.value;
      window.__3D_STATE__.chromaticOffset = portalUniforms.uChromaticOffset.value;
      window.__3D_STATE__.portalActive = active;
      window.__3D_STATE__.elapsedTime = elapsed;
      window.__3D_STATE__.beamVisible = active && beamGlow.material.opacity > 0.0;
      window.__3D_STATE__.chromaticPresetIndex = chromaticPresetIndex;
      window.__3D_STATE__.frameCount = frameCount;
      window.__3D_STATE__.cameraDistance = camera.position.distanceTo(new THREE.Vector3(0, 0, 0));
      window.__3D_STATE__.portalToggleCount = portalToggleCount;

      renderer.render(scene, camera);
    }

    updateHUD();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
