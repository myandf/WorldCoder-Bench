<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Marble Shader</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }
#controls {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 240px;
  background: rgba(10, 10, 30, 0.85);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 16px;
  color: #ddd;
  font-size: 13px;
  backdrop-filter: blur(8px);
  z-index: 100;
}
#controls h3 { margin-bottom: 12px; color: #fff; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; }
.ctrl-group { margin-bottom: 10px; }
.ctrl-group label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
.ctrl-group label span { color: #aaa; }
.ctrl-group label .val { color: #7ecfff; font-weight: bold; }
input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #7ecfff; cursor: pointer; }
.btn-row { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.btn-row button {
  padding: 7px 10px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  background: rgba(255,255,255,0.08);
  color: #ddd;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.2s;
}
.btn-row button:hover { background: rgba(126,207,255,0.2); }
.presets { margin-top: 10px; font-size: 11px; color: #888; text-align: center; }
</style>
</head>
<body>

<div id="controls">
  <h3>Marble Controls</h3>
  <div class="ctrl-group">
    <label><span>Vein Frequency</span><span class="val" id="freqValue">5.0</span></label>
    <input type="range" id="freqSlider" min="1.0" max="20.0" step="0.1" value="5.0">
  </div>
  <div class="ctrl-group">
    <label><span>Turbulence</span><span class="val" id="turbValue">4.0</span></label>
    <input type="range" id="turbSlider" min="0.0" max="10.0" step="0.1" value="4.0">
  </div>
  <div class="ctrl-group">
    <label><span>Octaves</span><span class="val" id="octavesValue">4</span></label>
    <input type="range" id="octavesSlider" min="1" max="8" step="1" value="4">
  </div>
  <div class="btn-row">
    <button id="resetBtn">Reset Defaults</button>
    <button id="rotateBtn">Toggle Rotation</button>
    <button id="randomColorBtn">Randomize Colors</button>
  </div>
  <div class="presets">Presets: 1 = Carrara, 2 = Serpentine, 3 = Rosso<br>R = Reset, Space = Toggle Rotation</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const vertexShader = `
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vPosition;

void main() {
  vUv = uv;
  vNormal = normalize(normalMatrix * normal);
  vPosition = (modelMatrix * vec4(position, 1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const fragmentShader = `
precision highp float;

uniform float uTime;
uniform float uVeinFrequency;
uniform float uTurbulenceStrength;
uniform int uOctaves;
uniform vec3 uBaseColor;
uniform vec3 uVeinColor;
uniform float uLacunarity;
uniform float uGain;
uniform vec3 uLightDir;

varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vPosition;

// Permutation / hash helpers
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+10.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);

  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);

  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;

  i = mod289(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));

  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;

  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);

  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);

  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);

  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));

  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;

  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);

  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

  vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 105.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

float fbm(vec3 p) {
  float value = 0.0;
  float amplitude = 0.5;
  float frequency = 1.0;
  for (int i = 0; i < 8; i++) {
    if (i >= uOctaves) break;
    value += amplitude * snoise(p * frequency);
    frequency *= uLacunarity;
    amplitude *= uGain;
  }
  return value;
}

void main() {
  float turbulence = fbm(vPosition * 2.0 + uTime * 0.05);
  float marble = sin(vPosition.x * uVeinFrequency + turbulence * uTurbulenceStrength);
  marble = marble * 0.5 + 0.5;
  marble = smoothstep(0.0, 1.0, marble);

  vec3 color = mix(uVeinColor, uBaseColor, marble);

  // Diffuse lighting
  vec3 lightDir = normalize(uLightDir);
  float diff = max(dot(vNormal, lightDir), 0.0);
  float ambient = 0.3;
  float lighting = ambient + diff * 0.7;

  // Subtle specular
  vec3 viewDir = normalize(cameraPosition - vPosition);
  vec3 halfDir = normalize(lightDir + viewDir);
  float spec = pow(max(dot(vNormal, halfDir), 0.0), 32.0) * 0.3;

  color = color * lighting + vec3(spec);

  gl_FragColor = vec4(color, 1.0);
}
`;

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Lights (for scene, shader handles its own lighting too)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
directionalLight.position.set(2, 3, 4);
scene.add(directionalLight);

// Defaults
const DEFAULTS = {
  veinFrequency: 5.0,
  turbulenceStrength: 4.0,
  octaves: 4,
  baseColor: [0.95, 0.93, 0.90],
  veinColor: [0.15, 0.12, 0.18],
  lacunarity: 2.0,
  gain: 0.5
};

// Uniforms
const uniforms = {
  uTime: { value: 0.0 },
  uVeinFrequency: { value: DEFAULTS.veinFrequency },
  uTurbulenceStrength: { value: DEFAULTS.turbulenceStrength },
  uOctaves: { value: DEFAULTS.octaves },
  uBaseColor: { value: new THREE.Vector3(...DEFAULTS.baseColor) },
  uVeinColor: { value: new THREE.Vector3(...DEFAULTS.veinColor) },
  uLacunarity: { value: DEFAULTS.lacunarity },
  uGain: { value: DEFAULTS.gain },
  uLightDir: { value: new THREE.Vector3(2, 3, 4).normalize() }
};

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms
});

const geometry = new THREE.SphereGeometry(1.2, 64, 64);
const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

// State
let isRotating = true;
let activePreset = 'default';
let frameCount = 0;
const clock = new THREE.Clock();

// State object
window.__3D_STATE__ = {
  veinFrequency: DEFAULTS.veinFrequency,
  turbulenceStrength: DEFAULTS.turbulenceStrength,
  octaves: DEFAULTS.octaves,
  isRotating: true,
  elapsedTime: 0,
  baseColor: [...DEFAULTS.baseColor],
  veinColor: [...DEFAULTS.veinColor],
  activePreset: 'default',
  lacunarity: DEFAULTS.lacunarity,
  gain: DEFAULTS.gain,
  sphereRotationY: 0,
  cameraDistance: 3.5,
  frameCount: 0
};

// DOM refs
const freqSlider = document.getElementById('freqSlider');
const turbSlider = document.getElementById('turbSlider');
const octavesSlider = document.getElementById('octavesSlider');
const freqValue = document.getElementById('freqValue');
const turbValue = document.getElementById('turbValue');
const octavesValue = document.getElementById('octavesValue');
const resetBtn = document.getElementById('resetBtn');
const rotateBtn = document.getElementById('rotateBtn');
const randomColorBtn = document.getElementById('randomColorBtn');

function updateSliderDisplays() {
  freqValue.textContent = parseFloat(freqSlider.value).toFixed(1);
  turbValue.textContent = parseFloat(turbSlider.value).toFixed(1);
  octavesValue.textContent = octavesSlider.value;
}

function syncFromUniforms() {
  freqSlider.value = uniforms.uVeinFrequency.value;
  turbSlider.value = uniforms.uTurbulenceStrength.value;
  octavesSlider.value = uniforms.uOctaves.value;
  updateSliderDisplays();
}

freqSlider.addEventListener('input', () => {
  const v = parseFloat(freqSlider.value);
  uniforms.uVeinFrequency.value = v;
  freqValue.textContent = v.toFixed(1);
  activePreset = 'custom';
});

turbSlider.addEventListener('input', () => {
  const v = parseFloat(turbSlider.value);
  uniforms.uTurbulenceStrength.value = v;
  turbValue.textContent = v.toFixed(1);
  activePreset = 'custom';
});

octavesSlider.addEventListener('input', () => {
  const v = parseInt(octavesSlider.value);
  uniforms.uOctaves.value = v;
  octavesValue.textContent = v;
  activePreset = 'custom';
});

function resetDefaults() {
  uniforms.uVeinFrequency.value = DEFAULTS.veinFrequency;
  uniforms.uTurbulenceStrength.value = DEFAULTS.turbulenceStrength;
  uniforms.uOctaves.value = DEFAULTS.octaves;
  uniforms.uBaseColor.value.set(...DEFAULTS.baseColor);
  uniforms.uVeinColor.value.set(...DEFAULTS.veinColor);
  uniforms.uLacunarity.value = DEFAULTS.lacunarity;
  uniforms.uGain.value = DEFAULTS.gain;
  activePreset = 'default';
  syncFromUniforms();
}

resetBtn.addEventListener('click', resetDefaults);

rotateBtn.addEventListener('click', () => {
  isRotating = !isRotating;
});

randomColorBtn.addEventListener('click', () => {
  uniforms.uBaseColor.value.set(Math.random(), Math.random(), Math.random());
  uniforms.uVeinColor.value.set(Math.random(), Math.random(), Math.random());
  activePreset = 'custom';
});

function applyPreset(name, base, vein, freq, turb) {
  uniforms.uBaseColor.value.set(...base);
  uniforms.uVeinColor.value.set(...vein);
  uniforms.uVeinFrequency.value = freq;
  uniforms.uTurbulenceStrength.value = turb;
  uniforms.uOctaves.value = DEFAULTS.octaves;
  uniforms.uLacunarity.value = DEFAULTS.lacunarity;
  uniforms.uGain.value = DEFAULTS.gain;
  activePreset = name;
  syncFromUniforms();
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const key = e.key;
  if (key === '1') {
    applyPreset('carrara', [0.95, 0.93, 0.90], [0.5, 0.5, 0.5], 5.0, 4.0);
  } else if (key === '2') {
    applyPreset('serpentine', [0.7, 0.85, 0.65], [0.1, 0.3, 0.1], 8.0, 6.0);
  } else if (key === '3') {
    applyPreset('rosso', [0.9, 0.75, 0.7], [0.4, 0.08, 0.05], 6.0, 5.0);
  } else if (key === 'r' || key === 'R') {
    resetDefaults();
  } else if (key === ' ') {
    e.preventDefault();
    isRotating = !isRotating;
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function updateState() {
  const bc = uniforms.uBaseColor.value;
  const vc = uniforms.uVeinColor.value;
  const state = window.__3D_STATE__;
  state.veinFrequency = uniforms.uVeinFrequency.value;
  state.turbulenceStrength = uniforms.uTurbulenceStrength.value;
  state.octaves = uniforms.uOctaves.value;
  state.isRotating = isRotating;
  state.elapsedTime = uniforms.uTime.value;
  state.baseColor = [bc.x, bc.y, bc.z];
  state.veinColor = [vc.x, vc.y, vc.z];
  state.activePreset = activePreset;
  state.lacunarity = uniforms.uLacunarity.value;
  state.gain = uniforms.uGain.value;
  state.sphereRotationY = sphere.rotation.y;
  state.cameraDistance = camera.position.length();
  state.frameCount = frameCount;
}

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  uniforms.uTime.value = elapsed;

  if (isRotating) {
    sphere.rotation.y += 0.15 * delta;
  }

  controls.update();
  renderer.render(scene, camera);

  frameCount++;
  updateState();
}

animate();
</script>
</body>
</html>
