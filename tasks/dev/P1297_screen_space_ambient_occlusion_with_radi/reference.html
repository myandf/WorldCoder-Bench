<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSAO Demo with State Persistence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; }
#controls {
position: absolute;
top: 10px;
left: 10px;
background: rgba(0, 0, 0, 0.75);
color: #fff;
padding: 16px 20px;
border-radius: 8px;
min-width: 280px;
z-index: 100;
font-size: 13px;
backdrop-filter: blur(4px);
}
#controls h3 { margin-bottom: 12px; font-size: 15px; letter-spacing: 0.5px; }
.control-row {
margin-bottom: 10px;
display: flex;
flex-direction: column;
gap: 3px;
}
.control-row label {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 12px;
color: #ccc;
}
.control-row input[type="range"] {
width: 100%;
accent-color: #6cf;
}
.control-row select {
width: 100%;
padding: 4px;
background: #333;
color: #fff;
border: 1px solid #555;
border-radius: 4px;
}
.checkbox-row {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 10px;
}
.checkbox-row input { accent-color: #6cf; }
.btn-row {
display: flex;
gap: 6px;
margin-top: 12px;
flex-wrap: wrap;
}
.btn-row button {
flex: 1;
padding: 6px 10px;
background: #444;
color: #fff;
border: 1px solid #666;
border-radius: 4px;
cursor: pointer;
font-size: 12px;
transition: background 0.2s;
}
.btn-row button:hover { background: #666; }
</style>
</head>
<body>

<div id="controls">
<h3>SSAO Controls</h3>

<div class="control-row">
<label>SSAO Radius: <span id="radiusDisplay">8</span></label>
<input type="range" id="radiusSlider" min="0.1" max="32" step="0.1" value="8">
</div>

<div class="control-row">
<label>Min Distance: <span id="minDistDisplay">0.005</span></label>
<input type="range" id="minDistSlider" min="0.001" max="0.05" step="0.001" value="0.005">
</div>

<div class="control-row">
<label>Max Distance: <span id="maxDistDisplay">0.1</span></label>
<input type="range" id="maxDistSlider" min="0.01" max="1.0" step="0.01" value="0.1">
</div>

<div class="control-row">
<label>Output Mode:</label>
<select id="outputMode">
<option value="0">Default</option>
<option value="1">SSAO Only</option>
<option value="2">Blur</option>
<option value="4">Depth</option>
</select>
</div>

<div class="checkbox-row">
<input type="checkbox" id="ssaoToggle" checked>
<label for="ssaoToggle">SSAO Enabled</label>
</div>

<div class="btn-row">
<button id="saveBtn">Save State</button>
<button id="loadBtn">Load State</button>
<button id="resetBtn">Reset Defaults</button>
</div>
</div>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';

const DEFAULTS = {
kernelRadius: 8,
minDistance: 0.005,
maxDistance: 0.1,
outputMode: 0,
ssaoEnabled: true
};

window.__3D_STATE__ = {
ssaoEnabled: true,
kernelRadius: DEFAULTS.kernelRadius,
minDistance: DEFAULTS.minDistance,
maxDistance: DEFAULTS.maxDistance,
outputMode: DEFAULTS.outputMode,
objectCount: 0,
composerPassCount: 0,
cameraPosition: { x: 0, y: 5, z: 12 },
savedState: null,
loadCount: 0,
saveCount: 0,
frameCount: 0,
ssaoPassExists: false,
rendererInitialized: false
};

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222233);

// Camera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 5, 12);
camera.lookAt(0, 0, 0);

// Lights
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);

const ambLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambLight);

// Ground plane
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Box
const boxGeo = new THREE.BoxGeometry(2, 2, 2);
const boxMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
const box = new THREE.Mesh(boxGeo, boxMat);
box.position.set(-4, 1, 0);
box.castShadow = true;
scene.add(box);

// Sphere
const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
const sphereMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.set(0, 1.2, 0);
sphere.castShadow = true;
scene.add(sphere);

// Torus
const torusGeo = new THREE.TorusGeometry(1, 0.4, 16, 48);
const torusMat = new THREE.MeshStandardMaterial({ color: 0x0000ff });
const torus = new THREE.Mesh(torusGeo, torusMat);
torus.position.set(4, 1.2, 0);
torus.castShadow = true;
scene.add(torus);

// Cylinder
const cylGeo = new THREE.CylinderGeometry(0.8, 0.8, 3, 32);
const cylMat = new THREE.MeshStandardMaterial({ color: 0xffff00 });
const cylinder = new THREE.Mesh(cylGeo, cylMat);
cylinder.position.set(-2, 1.5, 3);
cylinder.castShadow = true;
scene.add(cylinder);

// Cone
const coneGeo = new THREE.ConeGeometry(1, 2.5, 32);
const coneMat = new THREE.MeshStandardMaterial({ color: 0x9900ff });
const cone = new THREE.Mesh(coneGeo, coneMat);
cone.position.set(2, 1.25, -3);
cone.castShadow = true;
scene.add(cone);

// Count meshes
let meshCount = 0;
scene.traverse((obj) => { if (obj.isMesh) meshCount++; });
window.__3D_STATE__.objectCount = meshCount;

// OrbitControls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.update();

// Postprocessing
const composer = new EffectComposer(renderer);

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = DEFAULTS.kernelRadius;
ssaoPass.minDistance = DEFAULTS.minDistance;
ssaoPass.maxDistance = DEFAULTS.maxDistance;
ssaoPass.output = DEFAULTS.outputMode;
ssaoPass.enabled = true;
composer.addPass(ssaoPass);

window.__3D_STATE__.ssaoPassExists = true;
window.__3D_STATE__.composerPassCount = composer.passes.length;

// UI elements
const radiusSlider = document.getElementById('radiusSlider');
const minDistSlider = document.getElementById('minDistSlider');
const maxDistSlider = document.getElementById('maxDistSlider');
const outputMode = document.getElementById('outputMode');
const ssaoToggle = document.getElementById('ssaoToggle');
const saveBtn = document.getElementById('saveBtn');
const loadBtn = document.getElementById('loadBtn');
const resetBtn = document.getElementById('resetBtn');
const radiusDisplay = document.getElementById('radiusDisplay');
const minDistDisplay = document.getElementById('minDistDisplay');
const maxDistDisplay = document.getElementById('maxDistDisplay');

function updateStateFromUI() {
const kr = parseFloat(radiusSlider.value);
const minD = parseFloat(minDistSlider.value);
const maxD = parseFloat(maxDistSlider.value);
const om = parseInt(outputMode.value);
const enabled = ssaoToggle.checked;

ssaoPass.kernelRadius = kr;
ssaoPass.minDistance = minD;
ssaoPass.maxDistance = maxD;
ssaoPass.output = om;
ssaoPass.enabled = enabled;

radiusDisplay.textContent = kr.toFixed(1);
minDistDisplay.textContent = minD.toFixed(3);
maxDistDisplay.textContent = maxD.toFixed(2);

window.__3D_STATE__.kernelRadius = kr;
window.__3D_STATE__.minDistance = minD;
window.__3D_STATE__.maxDistance = maxD;
window.__3D_STATE__.outputMode = om;
window.__3D_STATE__.ssaoEnabled = enabled;
}

radiusSlider.addEventListener('input', updateStateFromUI);
minDistSlider.addEventListener('input', updateStateFromUI);
maxDistSlider.addEventListener('input', updateStateFromUI);
outputMode.addEventListener('change', updateStateFromUI);
ssaoToggle.addEventListener('change', updateStateFromUI);

// Save
saveBtn.addEventListener('click', () => {
const state = {
kernelRadius: parseFloat(radiusSlider.value),
minDistance: parseFloat(minDistSlider.value),
maxDistance: parseFloat(maxDistSlider.value),
outputMode: parseInt(outputMode.value),
ssaoEnabled: ssaoToggle.checked,
cameraPosition: {
x: parseFloat(camera.position.x.toFixed(2)),
y: parseFloat(camera.position.y.toFixed(2)),
z: parseFloat(camera.position.z.toFixed(2))
},
cameraTarget: {
x: parseFloat(controls.target.x.toFixed(2)),
y: parseFloat(controls.target.y.toFixed(2)),
z: parseFloat(controls.target.z.toFixed(2))
}
};
localStorage.setItem('ssao_state', JSON.stringify(state));
window.__3D_STATE__.savedState = JSON.parse(JSON.stringify(state));
window.__3D_STATE__.saveCount++;
});

// Load
loadBtn.addEventListener('click', () => {
const raw = localStorage.getItem('ssao_state');
if (!raw) return;
let state;
try {
state = JSON.parse(raw);
} catch (e) {
return;
}

radiusSlider.value = state.kernelRadius;
minDistSlider.value = state.minDistance;
maxDistSlider.value = state.maxDistance;
outputMode.value = state.outputMode;
ssaoToggle.checked = state.ssaoEnabled;

if (state.cameraPosition) {
camera.position.set(state.cameraPosition.x, state.cameraPosition.y, state.cameraPosition.z);
}
if (state.cameraTarget) {
controls.target.set(state.cameraTarget.x, state.cameraTarget.y, state.cameraTarget.z);
}
controls.update();

updateStateFromUI();
window.__3D_STATE__.loadCount++;
});

// Reset
resetBtn.addEventListener('click', () => {
radiusSlider.value = DEFAULTS.kernelRadius;
minDistSlider.value = DEFAULTS.minDistance;
maxDistSlider.value = DEFAULTS.maxDistance;
outputMode.value = DEFAULTS.outputMode;
ssaoToggle.checked = DEFAULTS.ssaoEnabled;
updateStateFromUI();
});

// Handle resize
window.addEventListener('resize', () => {
const w = window.innerWidth;
const h = window.innerHeight;
camera.aspect = w / h;
camera.updateProjectionMatrix();
renderer.setSize(w, h);
composer.setSize(w, h);
ssaoPass.setSize(w, h);
});

// Animation loop
function animate() {
requestAnimationFrame(animate);
controls.update();
composer.render();

window.__3D_STATE__.frameCount++;
window.__3D_STATE__.rendererInitialized = true;
window.__3D_STATE__.cameraPosition = {
x: parseFloat(camera.position.x.toFixed(2)),
y: parseFloat(camera.position.y.toFixed(2)),
z: parseFloat(camera.position.z.toFixed(2))
};
window.__3D_STATE__.ssaoEnabled = ssaoPass.enabled;
window.__3D_STATE__.kernelRadius = ssaoPass.kernelRadius;
window.__3D_STATE__.minDistance = ssaoPass.minDistance;
window.__3D_STATE__.maxDistance = ssaoPass.maxDistance;
window.__3D_STATE__.outputMode = ssaoPass.output;
window.__3D_STATE__.ssaoPassExists = !!ssaoPass;
window.__3D_STATE__.composerPassCount = composer.passes.length;
}

animate();
</script>
</body>
</html>
