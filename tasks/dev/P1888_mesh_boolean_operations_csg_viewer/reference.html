<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSG Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; }
canvas { display: block; }

#controls {
  position: absolute;
  top: 15px;
  left: 15px;
  background: rgba(0,0,0,0.7);
  padding: 15px;
  border-radius: 8px;
  font-family: monospace;
  color: white;
  font-size: 13px;
  min-width: 220px;
  z-index: 10;
  user-select: none;
}

#controls h3 {
  margin-bottom: 10px;
  font-size: 14px;
  color: #44ffaa;
}

.btn-group { display: flex; gap: 5px; margin-bottom: 10px; }

.btn-group button {
  flex: 1;
  padding: 6px 8px;
  background: #2a2a4e;
  color: #ccc;
  border: 2px solid #444;
  border-radius: 4px;
  font-family: monospace;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-group button:hover { background: #3a3a5e; }
.btn-group button.active {
  border-color: #44ffaa;
  color: #44ffaa;
  background: #2a3a3e;
}

.control-row {
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.control-row label { cursor: pointer; }

.control-row select, .control-row input[type=range] {
  background: #2a2a4e;
  color: #ccc;
  border: 1px solid #555;
  border-radius: 3px;
  padding: 3px;
  font-family: monospace;
  font-size: 12px;
}

.control-row select { flex: 1; }
.control-row input[type=range] { flex: 1; }

#stats-display {
  margin-top: 10px;
  padding: 8px;
  background: rgba(68,255,170,0.1);
  border: 1px solid #44ffaa33;
  border-radius: 4px;
  font-size: 11px;
  line-height: 1.6;
}

.shortcut-hint {
  margin-top: 8px;
  font-size: 10px;
  color: #666;
  line-height: 1.5;
}
</style>
</head>
<body>

<div id="controls">
  <h3>CSG Viewer</h3>
  <div class="btn-group">
    <button id="btn-union">Union</button>
    <button id="btn-subtract" class="active">Subtract</button>
    <button id="btn-intersect">Intersect</button>
  </div>

  <div class="control-row">
    <input type="checkbox" id="chk-wireframe">
    <label for="chk-wireframe">Wireframe</label>
  </div>

  <div class="control-row">
    <input type="checkbox" id="chk-show-operands" checked>
    <label for="chk-show-operands">Show Operands</label>
  </div>

  <div class="control-row">
    <label for="sel-operand-b">Shape B:</label>
    <select id="sel-operand-b">
      <option value="sphere">Sphere</option>
      <option value="cylinder">Cylinder</option>
      <option value="torus">Torus</option>
    </select>
  </div>

  <div class="control-row">
    <label for="slider-offset">Offset X:</label>
    <input type="range" id="slider-offset" min="-2" max="2" step="0.1" value="0.3">
    <span id="offset-value">0.3</span>
  </div>

  <div id="stats-display">
    Operation: subtract<br>
    Vertices: 0<br>
    Faces: 0
  </div>

  <div class="shortcut-hint">
    Keys: 1/2/3 = ops, W = wire,<br>
    O = operands, R = reset
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// Inline CSG Implementation (BSP-based)
// ============================================================

const EPSILON = 1e-5;
const COPLANAR = 0, FRONT = 1, BACK = 2, SPANNING = 3;

class CSGVector {
  constructor(x, y, z) { this.x = x; this.y = y; this.z = z; }
  clone() { return new CSGVector(this.x, this.y, this.z); }
  negated() { return new CSGVector(-this.x, -this.y, -this.z); }
  plus(a) { return new CSGVector(this.x + a.x, this.y + a.y, this.z + a.z); }
  minus(a) { return new CSGVector(this.x - a.x, this.y - a.y, this.z - a.z); }
  times(a) { return new CSGVector(this.x * a, this.y * a, this.z * a); }
  dividedBy(a) { return new CSGVector(this.x / a, this.y / a, this.z / a); }
  dot(a) { return this.x * a.x + this.y * a.y + this.z * a.z; }
  lerp(a, t) { return this.plus(a.minus(this).times(t)); }
  length() { return Math.sqrt(this.dot(this)); }
  unit() { return this.dividedBy(this.length()); }
  cross(a) {
    return new CSGVector(
      this.y * a.z - this.z * a.y,
      this.z * a.x - this.x * a.z,
      this.x * a.y - this.y * a.x
    );
  }
}

class CSGVertex {
  constructor(pos, normal) {
    this.pos = new CSGVector(pos.x, pos.y, pos.z);
    this.normal = new CSGVector(normal.x, normal.y, normal.z);
  }
  clone() { return new CSGVertex(this.pos.clone(), this.normal.clone()); }
  flip() { this.normal = this.normal.negated(); }
  interpolate(other, t) {
    return new CSGVertex(
      this.pos.lerp(other.pos, t),
      this.normal.lerp(other.normal, t)
    );
  }
}

class CSGPolygon {
  constructor(vertices, shared) {
    this.vertices = vertices;
    this.shared = shared;
    this.plane = CSGPlane.fromPoints(vertices[0].pos, vertices[1].pos, vertices[2].pos);
  }
  clone() {
    return new CSGPolygon(
      this.vertices.map(v => v.clone()),
      this.shared
    );
  }
  flip() {
    this.vertices.reverse().forEach(v => v.flip());
    this.plane.flip();
  }
}

class CSGPlane {
  constructor(normal, w) { this.normal = normal; this.w = w; }
  static fromPoints(a, b, c) {
    const n = b.minus(a).cross(c.minus(a)).unit();
    return new CSGPlane(n, n.dot(a));
  }
  clone() { return new CSGPlane(this.normal.clone(), this.w); }
  flip() { this.normal = this.normal.negated(); this.w = -this.w; }

  splitPolygon(polygon, coplanarFront, coplanarBack, front, back) {
    let polygonType = 0;
    const types = [];
    for (let i = 0; i < polygon.vertices.length; i++) {
      const t = this.normal.dot(polygon.vertices[i].pos) - this.w;
      const type = (t < -EPSILON) ? BACK : (t > EPSILON) ? FRONT : COPLANAR;
      polygonType |= type;
      types.push(type);
    }

    switch (polygonType) {
      case COPLANAR:
        (this.normal.dot(polygon.plane.normal) > 0 ? coplanarFront : coplanarBack).push(polygon);
        break;
      case FRONT:
        front.push(polygon);
        break;
      case BACK:
        back.push(polygon);
        break;
      case SPANNING: {
        const f = [], b = [];
        for (let i = 0; i < polygon.vertices.length; i++) {
          const j = (i + 1) % polygon.vertices.length;
          const ti = types[i], tj = types[j];
          const vi = polygon.vertices[i], vj = polygon.vertices[j];
          if (ti !== BACK) f.push(vi);
          if (ti !== FRONT) b.push(ti !== BACK ? vi.clone() : vi);
          if ((ti | tj) === SPANNING) {
            const t = (this.w - this.normal.dot(vi.pos)) / this.normal.dot(vj.pos.minus(vi.pos));
            const v = vi.interpolate(vj, t);
            f.push(v);
            b.push(v.clone());
          }
        }
        if (f.length >= 3) front.push(new CSGPolygon(f, polygon.shared));
        if (b.length >= 3) back.push(new CSGPolygon(b, polygon.shared));
        break;
      }
    }
  }
}

class CSGNode {
  constructor(polygons) {
    this.plane = null;
    this.front = null;
    this.back = null;
    this.polygons = [];
    if (polygons && polygons.length) this.build(polygons);
  }

  clone() {
    const node = new CSGNode();
    node.plane = this.plane && this.plane.clone();
    node.front = this.front && this.front.clone();
    node.back = this.back && this.back.clone();
    node.polygons = this.polygons.map(p => p.clone());
    return node;
  }

  invert() {
    for (let i = 0; i < this.polygons.length; i++) this.polygons[i].flip();
    if (this.plane) this.plane.flip();
    if (this.front) this.front.invert();
    if (this.back) this.back.invert();
    const temp = this.front;
    this.front = this.back;
    this.back = temp;
  }

  clipPolygons(polygons) {
    if (!this.plane) return polygons.slice();
    let front = [], back = [];
    for (let i = 0; i < polygons.length; i++) {
      this.plane.splitPolygon(polygons[i], front, back, front, back);
    }
    if (this.front) front = this.front.clipPolygons(front);
    if (this.back) back = this.back.clipPolygons(back);
    else back = [];
    return front.concat(back);
  }

  clipTo(bsp) {
    this.polygons = bsp.clipPolygons(this.polygons);
    if (this.front) this.front.clipTo(bsp);
    if (this.back) this.back.clipTo(bsp);
  }

  allPolygons() {
    let polygons = this.polygons.slice();
    if (this.front) polygons = polygons.concat(this.front.allPolygons());
    if (this.back) polygons = polygons.concat(this.back.allPolygons());
    return polygons;
  }

  build(polygons) {
    if (!polygons.length) return;
    if (!this.plane) this.plane = polygons[0].plane.clone();
    const front = [], back = [];
    for (let i = 0; i < polygons.length; i++) {
      this.plane.splitPolygon(polygons[i], this.polygons, this.polygons, front, back);
    }
    if (front.length) {
      if (!this.front) this.front = new CSGNode();
      this.front.build(front);
    }
    if (back.length) {
      if (!this.back) this.back = new CSGNode();
      this.back.build(back);
    }
  }
}

class CSG {
  constructor() { this.polygons = []; }

  clone() {
    const csg = new CSG();
    csg.polygons = this.polygons.map(p => p.clone());
    return csg;
  }

  static fromGeometry(geom, matrix) {
    const csg = new CSG();
    const posAttr = geom.getAttribute('position');
    const normAttr = geom.getAttribute('normal');
    const idx = geom.index;

    const tempVert = new THREE.Vector3();
    const tempNorm = new THREE.Vector3();
    const normalMatrix = new THREE.Matrix3().getNormalMatrix(matrix);

    function getVertex(i) {
      tempVert.set(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
      tempVert.applyMatrix4(matrix);
      tempNorm.set(normAttr.getX(i), normAttr.getY(i), normAttr.getZ(i));
      tempNorm.applyMatrix3(normalMatrix).normalize();
      return new CSGVertex(
        { x: tempVert.x, y: tempVert.y, z: tempVert.z },
        { x: tempNorm.x, y: tempNorm.y, z: tempNorm.z }
      );
    }

    const triCount = idx ? idx.count / 3 : posAttr.count / 3;
    for (let i = 0; i < triCount; i++) {
      let a, b, c;
      if (idx) {
        a = idx.getX(i * 3);
        b = idx.getX(i * 3 + 1);
        c = idx.getX(i * 3 + 2);
      } else {
        a = i * 3; b = i * 3 + 1; c = i * 3 + 2;
      }
      const verts = [getVertex(a), getVertex(b), getVertex(c)];
      const poly = new CSGPolygon(verts, 0);
      if (poly.plane) csg.polygons.push(poly);
    }
    return csg;
  }

  toGeometry() {
    const positions = [];
    const normals = [];

    for (const polygon of this.polygons) {
      for (let i = 2; i < polygon.vertices.length; i++) {
        const verts = [polygon.vertices[0], polygon.vertices[i - 1], polygon.vertices[i]];
        for (const v of verts) {
          positions.push(v.pos.x, v.pos.y, v.pos.z);
          normals.push(v.normal.x, v.normal.y, v.normal.z);
        }
      }
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    return geom;
  }

  union(csg) {
    const a = new CSGNode(this.clone().polygons);
    const b = new CSGNode(csg.clone().polygons);
    a.clipTo(b);
    b.clipTo(a);
    b.invert();
    b.clipTo(a);
    b.invert();
    a.build(b.allPolygons());
    const result = new CSG();
    result.polygons = a.allPolygons();
    return result;
  }

  subtract(csg) {
    const a = new CSGNode(this.clone().polygons);
    const b = new CSGNode(csg.clone().polygons);
    a.invert();
    a.clipTo(b);
    b.clipTo(a);
    b.invert();
    b.clipTo(a);
    b.invert();
    a.build(b.allPolygons());
    a.invert();
    const result = new CSG();
    result.polygons = a.allPolygons();
    return result;
  }

  intersect(csg) {
    const a = new CSGNode(this.clone().polygons);
    const b = new CSGNode(csg.clone().polygons);
    a.invert();
    b.clipTo(a);
    b.invert();
    a.clipTo(b);
    b.clipTo(a);
    a.build(b.allPolygons());
    a.invert();
    const result = new CSG();
    result.polygons = a.allPolygons();
    return result;
  }
}

// ============================================================
// Three.js Scene
// ============================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5, 5, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.update();

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const ambLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambLight);

const grid = new THREE.GridHelper(10, 10, 0x333355, 0x333355);
scene.add(grid);

// Materials
const matA = new THREE.MeshStandardMaterial({
  color: 0x4488ff, opacity: 0.35, transparent: true, depthWrite: false, side: THREE.DoubleSide
});
const matB = new THREE.MeshStandardMaterial({
  color: 0xff4444, opacity: 0.35, transparent: true, depthWrite: false, side: THREE.DoubleSide
});
const matResult = new THREE.MeshStandardMaterial({
  color: 0x44ffaa, metalness: 0.3, roughness: 0.4, side: THREE.DoubleSide
});

// Operand geometries
const boxGeom = new THREE.BoxGeometry(1.4, 1.4, 1.4);
const operandAMesh = new THREE.Mesh(boxGeom, matA);
operandAMesh.position.set(-0.3, 0, 0);
scene.add(operandAMesh);

function createOperandBGeom(shape) {
  switch (shape) {
    case 'cylinder': return new THREE.CylinderGeometry(0.8, 0.8, 2.0, 32);
    case 'torus': return new THREE.TorusGeometry(0.8, 0.35, 16, 32);
    default: return new THREE.SphereGeometry(1.0, 32, 32);
  }
}

let operandBGeom = createOperandBGeom('sphere');
const operandBMesh = new THREE.Mesh(operandBGeom, matB);
operandBMesh.position.set(0.3, 0, 0);
scene.add(operandBMesh);

let resultMesh = null;

// State
const state = {
  currentOperation: 'subtract',
  operandBShape: 'sphere',
  operandBOffsetX: 0.3,
  wireframeEnabled: false,
  operandsVisible: true,
  resultVertexCount: 0,
  resultFaceCount: 0,
  resultMeshExists: false,
  operandAPosition: { x: -0.3, y: 0, z: 0 },
  operandBPosition: { x: 0.3, y: 0, z: 0 },
  cameraDistance: 0,
  resultBoundingBox: { min: { x: 0, y: 0, z: 0 }, max: { x: 0, y: 0, z: 0 } },
  lastComputeTime: 0,
  computeCount: 0
};
window.__3D_STATE__ = state;

// DOM refs
const btnUnion = document.getElementById('btn-union');
const btnSubtract = document.getElementById('btn-subtract');
const btnIntersect = document.getElementById('btn-intersect');
const chkWireframe = document.getElementById('chk-wireframe');
const chkShowOperands = document.getElementById('chk-show-operands');
const selOperandB = document.getElementById('sel-operand-b');
const sliderOffset = document.getElementById('slider-offset');
const offsetValue = document.getElementById('offset-value');
const statsDisplay = document.getElementById('stats-display');

function updateButtons() {
  btnUnion.classList.toggle('active', state.currentOperation === 'union');
  btnSubtract.classList.toggle('active', state.currentOperation === 'subtract');
  btnIntersect.classList.toggle('active', state.currentOperation === 'intersect');
}

function computeCSG() {
  const t0 = performance.now();

  // Build matrices
  const matrixA = new THREE.Matrix4().makeTranslation(-0.3, 0, 0);
  const matrixB = new THREE.Matrix4().makeTranslation(state.operandBOffsetX, 0, 0);

  const geomA = boxGeom.clone();
  geomA.computeVertexNormals();
  const geomB = operandBGeom.clone();
  geomB.computeVertexNormals();

  const csgA = CSG.fromGeometry(geomA, matrixA);
  const csgB = CSG.fromGeometry(geomB, matrixB);

  let csgResult;
  switch (state.currentOperation) {
    case 'union': csgResult = csgA.union(csgB); break;
    case 'subtract': csgResult = csgA.subtract(csgB); break;
    case 'intersect': csgResult = csgA.intersect(csgB); break;
  }

  const resultGeom = csgResult.toGeometry();

  if (resultMesh) {
    scene.remove(resultMesh);
    resultMesh.geometry.dispose();
  }

  resultMesh = new THREE.Mesh(resultGeom, matResult);
  matResult.wireframe = state.wireframeEnabled;
  scene.add(resultMesh);

  const t1 = performance.now();

  // Update state
  const posAttr = resultGeom.getAttribute('position');
  state.resultVertexCount = posAttr ? posAttr.count : 0;
  state.resultFaceCount = state.resultVertexCount / 3;
  state.resultMeshExists = true;
  state.lastComputeTime = Math.round((t1 - t0) * 100) / 100;
  state.computeCount++;

  resultGeom.computeBoundingBox();
  const bb = resultGeom.boundingBox;
  if (bb) {
    state.resultBoundingBox = {
      min: { x: bb.min.x, y: bb.min.y, z: bb.min.z },
      max: { x: bb.max.x, y: bb.max.y, z: bb.max.z }
    };
  }

  updateStats();
}

function updateStats() {
  statsDisplay.innerHTML =
    `Operation: ${state.currentOperation}<br>` +
    `Vertices: ${state.resultVertexCount}<br>` +
    `Faces: ${state.resultFaceCount}<br>` +
    `Compute: ${state.lastComputeTime}ms (#${state.computeCount})`;
}

function setOperation(op) {
  state.currentOperation = op;
  updateButtons();
  computeCSG();
}

function setOperandBShape(shape) {
  state.operandBShape = shape;
  operandBGeom = createOperandBGeom(shape);
  operandBMesh.geometry.dispose();
  operandBMesh.geometry = operandBGeom;
  selOperandB.value = shape;
  computeCSG();
}

function setOffset(val) {
  state.operandBOffsetX = parseFloat(val);
  operandBMesh.position.x = state.operandBOffsetX;
  state.operandBPosition.x = state.operandBOffsetX;
  sliderOffset.value = val;
  offsetValue.textContent = val;
  computeCSG();
}

function toggleWireframe() {
  state.wireframeEnabled = !state.wireframeEnabled;
  chkWireframe.checked = state.wireframeEnabled;
  if (resultMesh) matResult.wireframe = state.wireframeEnabled;
}

function toggleOperands() {
  state.operandsVisible = !state.operandsVisible;
  chkShowOperands.checked = state.operandsVisible;
  operandAMesh.visible = state.operandsVisible;
  operandBMesh.visible = state.operandsVisible;
}

function resetAll() {
  state.currentOperation = 'subtract';
  state.operandBShape = 'sphere';
  state.operandBOffsetX = 0.3;
  state.wireframeEnabled = false;
  state.operandsVisible = true;

  chkWireframe.checked = false;
  chkShowOperands.checked = true;
  selOperandB.value = 'sphere';
  sliderOffset.value = '0.3';
  offsetValue.textContent = '0.3';

  operandBGeom = createOperandBGeom('sphere');
  operandBMesh.geometry.dispose();
  operandBMesh.geometry = operandBGeom;
  operandBMesh.position.x = 0.3;
  state.operandBPosition.x = 0.3;

  operandAMesh.visible = true;
  operandBMesh.visible = true;
  matResult.wireframe = false;

  updateButtons();
  computeCSG();
}

// Event listeners
btnUnion.addEventListener('click', () => setOperation('union'));
btnSubtract.addEventListener('click', () => setOperation('subtract'));
btnIntersect.addEventListener('click', () => setOperation('intersect'));

chkWireframe.addEventListener('change', () => {
  state.wireframeEnabled = chkWireframe.checked;
  if (resultMesh) matResult.wireframe = state.wireframeEnabled;
});

chkShowOperands.addEventListener('change', () => {
  state.operandsVisible = chkShowOperands.checked;
  operandAMesh.visible = state.operandsVisible;
  operandBMesh.visible = state.operandsVisible;
});

selOperandB.addEventListener('change', () => setOperandBShape(selOperandB.value));

sliderOffset.addEventListener('input', () => setOffset(sliderOffset.value));

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case '1': setOperation('union'); break;
    case '2': setOperation('subtract'); break;
    case '3': setOperation('intersect'); break;
    case 'w': toggleWireframe(); break;
    case 'o': toggleOperands(); break;
    case 'r': resetAll(); break;
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial compute
computeCSG();

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  state.cameraDistance = camera.position.length();
  renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
