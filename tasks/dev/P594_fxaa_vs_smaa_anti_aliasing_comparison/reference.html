<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FXAA vs SMAA Split Screen Comparison</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      color: #fff;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      z-index: 5;
    }

    #labelLeft {
      top: 12px;
      left: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    #labelRight {
      top: 12px;
      right: 12px;
      font-size: 16px;
      font-weight: bold;
      text-align: right;
    }

    #topCenter {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: bold;
    }

    #bottomLeft {
      bottom: 12px;
      left: 12px;
      font-size: 15px;
    }

    #bottomCenter {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
    }

    #zoomIndicator {
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
    }

    #divider {
      position: absolute;
      top: 0;
      width: 4px;
      height: 100%;
      background: #fff;
      cursor: ew-resize;
      z-index: 10;
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
      transform: translateX(-2px);
    }

    #swapButton {
      position: absolute;
      top: 44px;
      right: 12px;
      z-index: 12;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      backdrop-filter: blur(4px);
    }

    #swapButton:hover {
      background: rgba(255,255,255,0.18);
    }

    #zoomInset {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 200px;
      height: 200px;
      border: 2px solid rgba(255,255,255,0.9);
      background: #000;
      z-index: 11;
      display: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
    }

    #zoomLabel {
      position: absolute;
      right: 18px;
      bottom: 218px;
      z-index: 11;
      color: #fff;
      font-size: 12px;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="labelLeft" class="overlay">FXAA</div>
    <div id="labelRight" class="overlay">SMAA</div>
    <div id="topCenter" class="overlay">FXAA | SMAA</div>
    <div id="bottomLeft" class="overlay">Rotation: 0°</div>
    <div id="bottomCenter" class="overlay">Divider: 50%</div>
    <div id="zoomIndicator" class="overlay">ZOOM: OFF</div>
    <div id="divider"></div>
    <button id="swapButton">Swap Sides</button>
    <canvas id="zoomInset" width="200" height="200"></canvas>
    <div id="zoomLabel">4x PIXEL ZOOM</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';
    import { SMAAPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/SMAAPass.js';
    import { FXAAShader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/shaders/FXAAShader.js';
    import { GammaCorrectionShader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/shaders/GammaCorrectionShader.js';

    const METHODS = ['None', 'FXAA', 'SMAA'];

    const app = document.getElementById('app');
    const divider = document.getElementById('divider');
    const swapButton = document.getElementById('swapButton');
    const labelLeft = document.getElementById('labelLeft');
    const labelRight = document.getElementById('labelRight');
    const topCenter = document.getElementById('topCenter');
    const bottomLeft = document.getElementById('bottomLeft');
    const bottomCenter = document.getElementById('bottomCenter');
    const zoomIndicator = document.getElementById('zoomIndicator');
    const zoomInset = document.getElementById('zoomInset');
    const zoomLabel = document.getElementById('zoomLabel');
    const zoomCtx = zoomInset.getContext('2d');

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor('#1a1a2e', 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.autoClear = false;
    app.appendChild(renderer.domElement);
    app.insertBefore(renderer.domElement, app.firstChild);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    const initialCameraPosition = new THREE.Vector3(0, 5, 12);
    camera.position.copy(initialCameraPosition);
    camera.lookAt(0, 0, 0);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const rotatingGroup = new THREE.Group();
    scene.add(rotatingGroup);

    const icoGeo = new THREE.IcosahedronGeometry(2, 1);
    const icoMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      wireframe: true
    });
    const ico = new THREE.Mesh(icoGeo, icoMat);
    ico.position.set(0, 2.6, 0);
    rotatingGroup.add(ico);

    const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const angles = [15, 30, 45, 60, 75];
    angles.forEach((deg, i) => {
      const line = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 6, 8, 1),
        lineMat
      );
      line.position.set(-4 + i * 2, 2.2, -1.5 + i * 0.3);
      line.rotation.z = THREE.MathUtils.degToRad(deg);
      line.rotation.y = THREE.MathUtils.degToRad(10 * i);
      rotatingGroup.add(line);
    });

    const checkerCanvas = document.createElement('canvas');
    checkerCanvas.width = 1024;
    checkerCanvas.height = 1024;
    const cctx = checkerCanvas.getContext('2d');
    const checks = 40;
    const cell = checkerCanvas.width / checks;
    for (let y = 0; y < checks; y++) {
      for (let x = 0; x < checks; x++) {
        cctx.fillStyle = (x + y) % 2 === 0 ? '#f2f2f2' : '#202020';
        cctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    const checkerTex = new THREE.CanvasTexture(checkerCanvas);
    checkerTex.wrapS = THREE.RepeatWrapping;
    checkerTex.wrapT = THREE.RepeatWrapping;
    checkerTex.magFilter = THREE.NearestFilter;
    checkerTex.minFilter = THREE.NearestMipMapNearestFilter;
    checkerTex.colorSpace = THREE.SRGBColorSpace;

    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ map: checkerTex, side: THREE.DoubleSide })
    );
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = 0;
    rotatingGroup.add(plane);

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'bold 64px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.fillStyle = '#ffffff';
      ctx.strokeText(text, canvas.width / 2, canvas.height / 2);
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(4.5, 1.125, 1);
      return sprite;
    }

    const textSprite = createTextSprite('AA TEST');
    textSprite.position.set(0, 5.2, 0);
    rotatingGroup.add(textSprite);

    let leftMethod = 'FXAA';
    let rightMethod = 'SMAA';
    let dividerPosition = 0.5;
    let sceneRotationDeg = 0;
    let pixelZoomActive = false;
    let frameCount = 0;
    let swapCount = 0;
    let resetCount = 0;
    let lastKeyPressed = '';

    let composerFXAA, composerSMAA;
    let fxaaPass;
    let smaaPass;
    let fxaaGammaPass;
    let smaaGammaPass;
    let renderPassFXAA;
    let renderPassSMAA;

    function createComposers() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      composerFXAA = new EffectComposer(renderer);
      composerFXAA.setSize(width, height);
      renderPassFXAA = new RenderPass(scene, camera);
      fxaaPass = new ShaderPass(FXAAShader);
      fxaaPass.material.uniforms['resolution'].value.set(1 / width, 1 / height);
      fxaaGammaPass = new ShaderPass(GammaCorrectionShader);
      composerFXAA.addPass(renderPassFXAA);
      composerFXAA.addPass(fxaaPass);
      composerFXAA.addPass(fxaaGammaPass);

      composerSMAA = new EffectComposer(renderer);
      composerSMAA.setSize(width, height);
      renderPassSMAA = new RenderPass(scene, camera);
      smaaPass = new SMAAPass(width, height);
      smaaGammaPass = new ShaderPass(GammaCorrectionShader);
      composerSMAA.addPass(renderPassSMAA);
      composerSMAA.addPass(smaaPass);
      composerSMAA.addPass(smaaGammaPass);
    }

    createComposers();

    function updateDividerUI() {
      divider.style.left = `${dividerPosition * 100}%`;
      bottomCenter.textContent = `Divider: ${Math.round(dividerPosition * 100)}%`;
    }

    function updateLabels() {
      labelLeft.textContent = leftMethod;
      labelRight.textContent = rightMethod;
      topCenter.textContent = `${leftMethod} | ${rightMethod}`;
      bottomLeft.textContent = `Rotation: ${((sceneRotationDeg % 360) + 360) % 360}°`;
      zoomIndicator.textContent = `ZOOM: ${pixelZoomActive ? 'ON' : 'OFF'}`;
      zoomInset.style.display = pixelZoomActive ? 'block' : 'none';
      zoomLabel.style.display = pixelZoomActive ? 'block' : 'none';
    }

    function renderMethod(method, x, y, width, height) {
      const fullWidth = window.innerWidth;
      const fullHeight = window.innerHeight;

      renderer.setViewport(x, y, width, height);
      renderer.setScissor(x, y, width, height);
      renderer.setScissorTest(true);

      if (method === 'None') {
        renderer.clearDepth();
        renderer.render(scene, camera);
      } else if (method === 'FXAA') {
        composerFXAA.renderTarget1.scissorTest = true;
        composerFXAA.renderTarget2.scissorTest = true;
        composerFXAA.renderTarget1.scissor.set(x, y, width, height);
        composerFXAA.renderTarget2.scissor.set(x, y, width, height);
        composerFXAA.renderTarget1.viewport.set(x, y, width, height);
        composerFXAA.renderTarget2.viewport.set(x, y, width, height);
        composerFXAA.setSize(fullWidth, fullHeight);
        composerFXAA.render();
      } else if (method === 'SMAA') {
        composerSMAA.renderTarget1.scissorTest = true;
        composerSMAA.renderTarget2.scissorTest = true;
        composerSMAA.renderTarget1.scissor.set(x, y, width, height);
        composerSMAA.renderTarget2.scissor.set(x, y, width, height);
        composerSMAA.renderTarget1.viewport.set(x, y, width, height);
        composerSMAA.renderTarget2.viewport.set(x, y, width, height);
        composerSMAA.setSize(fullWidth, fullHeight);
        composerSMAA.render();
      }

      renderer.setScissorTest(false);
    }

    function renderFrame() {
      frameCount++;

      rotatingGroup.rotation.y = THREE.MathUtils.degToRad(sceneRotationDeg);

      renderer.setRenderTarget(null);
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.clear(true, true, true);

      const splitX = Math.floor(window.innerWidth * dividerPosition);
      const leftWidth = splitX;
      const rightWidth = window.innerWidth - splitX;

      if (leftWidth > 0) {
        renderMethod(leftMethod, 0, 0, leftWidth, window.innerHeight);
      }
      if (rightWidth > 0) {
        renderMethod(rightMethod, splitX, 0, rightWidth, window.innerHeight);
      }

      if (pixelZoomActive) {
        try {
          const sx = Math.max(0, Math.floor(window.innerWidth / 2 - 25));
          const sy = Math.max(0, Math.floor(window.innerHeight / 2 - 25));
          const sw = 50;
          const sh = 50;
          zoomCtx.clearRect(0, 0, 200, 200);
          zoomCtx.imageSmoothingEnabled = false;
          zoomCtx.drawImage(renderer.domElement, sx, sy, sw, sh, 0, 0, 200, 200);
        } catch (e) {}
      }

      window.__3D_STATE__ = {
        leftMethod,
        rightMethod,
        dividerPosition,
        sceneRotationDeg: ((sceneRotationDeg % 360) + 360) % 360,
        pixelZoomActive,
        composerLeftEnabled: leftMethod !== 'None',
        composerRightEnabled: rightMethod !== 'None',
        frameCount,
        fxaaResolutionX: fxaaPass.material.uniforms['resolution'].value.x,
        fxaaResolutionY: fxaaPass.material.uniforms['resolution'].value.y,
        smaaWidth: window.innerWidth,
        smaaHeight: window.innerHeight,
        cameraPositionZ: camera.position.z,
        objectCount: scene.children.filter(obj => obj.isMesh).length + rotatingGroup.children.filter(obj => obj.isMesh).length,
        swapCount,
        resetCount,
        lastKeyPressed
      };

      requestAnimationFrame(renderFrame);
    }

    function resetState() {
      leftMethod = 'FXAA';
      rightMethod = 'SMAA';
      dividerPosition = 0.5;
      sceneRotationDeg = 0;
      pixelZoomActive = false;
      camera.position.copy(initialCameraPosition);
      camera.lookAt(0, 0, 0);
      resetCount++;
      updateDividerUI();
      updateLabels();
    }

    function swapSides() {
      const tmp = leftMethod;
      leftMethod = rightMethod;
      rightMethod = tmp;
      swapCount++;
      updateLabels();
    }

    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      composerFXAA.setSize(width, height);
      composerSMAA.setSize(width, height);

      fxaaPass.material.uniforms['resolution'].value.set(1 / width, 1 / height);

      createComposers();
      updateDividerUI();
      updateLabels();
    }

    let dragging = false;

    function setDividerFromClientX(clientX) {
      const rect = app.getBoundingClientRect();
      let p = (clientX - rect.left) / rect.width;
      p = Math.max(0.1, Math.min(0.9, p));
      dividerPosition = p;
      updateDividerUI();
    }

    divider.addEventListener('mousedown', (e) => {
      dragging = true;
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      setDividerFromClientX(e.clientX);
    });

    window.addEventListener('mouseup', () => {
      dragging = false;
    });

    divider.addEventListener('touchstart', (e) => {
      dragging = true;
      if (e.touches[0]) setDividerFromClientX(e.touches[0].clientX);
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!dragging || !e.touches[0]) return;
      setDividerFromClientX(e.touches[0].clientX);
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', () => {
      dragging = false;
    });

    swapButton.addEventListener('click', () => {
      swapSides();
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      const upper = key.toUpperCase();

      let handled = false;

      if (key === '1') {
        leftMethod = 'None';
        handled = true;
      } else if (key === '2') {
        leftMethod = 'FXAA';
        handled = true;
      } else if (key === '3') {
        leftMethod = 'SMAA';
        handled = true;
      } else if (key === '4') {
        rightMethod = 'None';
        handled = true;
      } else if (key === '5') {
        rightMethod = 'FXAA';
        handled = true;
      } else if (key === '6') {
        rightMethod = 'SMAA';
        handled = true;
      } else if (upper === 'R') {
        resetState();
        handled = true;
      } else if (upper === 'P') {
        pixelZoomActive = !pixelZoomActive;
        handled = true;
      } else if (key === 'ArrowLeft') {
        sceneRotationDeg -= 5;
        handled = true;
      } else if (key === 'ArrowRight') {
        sceneRotationDeg += 5;
        handled = true;
      }

      if (handled) {
        lastKeyPressed = key;
        updateLabels();
        updateDividerUI();
      }
    });

    updateDividerUI();
    updateLabels();

    window.__3D_STATE__ = {
      leftMethod,
      rightMethod,
      dividerPosition,
      sceneRotationDeg,
      pixelZoomActive,
      composerLeftEnabled: true,
      composerRightEnabled: true,
      frameCount,
      fxaaResolutionX: 1 / window.innerWidth,
      fxaaResolutionY: 1 / window.innerHeight,
      smaaWidth: window.innerWidth,
      smaaHeight: window.innerHeight,
      cameraPositionZ: camera.position.z,
      objectCount: 0,
      swapCount,
      resetCount,
      lastKeyPressed
    };

    window.addEventListener('resize', onResize);

    renderFrame();
  </script>
</body>
</html>
