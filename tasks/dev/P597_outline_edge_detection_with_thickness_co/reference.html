<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Edge Detection Outline</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
    }
    #controlPanel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 280px;
      padding: 12px 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      backdrop-filter: blur(4px);
      box-sizing: border-box;
    }
    #controlPanel h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 700;
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }
    .row label {
      font-size: 13px;
    }
    .inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      width: 100%;
    }
    input[type="color"] {
      width: 100%;
      height: 34px;
      border: none;
      background: transparent;
      padding: 0;
    }
    button {
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      background: #2f7cff;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #4a8fff;
    }
    .stats {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.15);
      font-size: 12px;
      line-height: 1.6;
    }
    .hint {
      font-size: 11px;
      color: #cfcfcf;
      margin-top: 8px;
      line-height: 1.4;
    }
    .value {
      color: #8fd3ff;
    }
  </style>
</head>
<body>
  <div id="controlPanel">
    <h3>Edge Detection Controls</h3>

    <div class="row">
      <label for="thicknessSlider">Thickness: <span id="displayThickness" class="value">1.0</span></label>
      <input id="thicknessSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
    </div>

    <div class="row">
      <label for="thresholdSlider">Threshold: <span id="displayThreshold" class="value">0.10</span></label>
      <input id="thresholdSlider" type="range" min="0" max="1" step="0.01" value="0.1" />
    </div>

    <div class="row">
      <label for="mixSlider">Mix Strength: <span id="displayMix" class="value">1.00</span></label>
      <input id="mixSlider" type="range" min="0" max="1" step="0.01" value="1.0" />
    </div>

    <div class="row">
      <label for="edgeColorPicker">Edge Color</label>
      <input id="edgeColorPicker" type="color" value="#000000" />
    </div>

    <div class="row">
      <button id="toggleOutline">Toggle Outline</button>
    </div>

    <div class="stats">
      <div>Mode: <span id="displayMode" class="value">combined</span></div>
      <div>Outline: <span id="displayOutline" class="value">enabled</span></div>
      <div>FPS: <span id="displayFPS" class="value">0</span></div>
    </div>

    <div class="hint">
      Keys: 1 = depth, 2 = normal, 3 = combined, R = reset, O = toggle rotation
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9dfe8);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 8);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.MeshStandardMaterial({ color: 0xff3333 })
    );
    box.position.set(-3, 0.75, 0);
    scene.add(box);

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(1, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x33ff33 })
    );
    sphere.position.set(0, 1, 0);
    scene.add(sphere);

    const torusKnot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.7, 0.25, 100, 16),
      new THREE.MeshStandardMaterial({ color: 0x3333ff })
    );
    torusKnot.position.set(3, 1.2, 0);
    scene.add(torusKnot);

    const sceneObjects = [box, sphere, torusKnot];

    const rtWidth = window.innerWidth;
    const rtHeight = window.innerHeight;

    const colorTarget = new THREE.WebGLRenderTarget(rtWidth, rtHeight, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.UnsignedByteType,
      depthBuffer: true,
      stencilBuffer: false
    });
    colorTarget.depthTexture = new THREE.DepthTexture(rtWidth, rtHeight, THREE.FloatType);
    colorTarget.depthTexture.format = THREE.DepthFormat;
    colorTarget.depthTexture.type = THREE.FloatType;

    const normalTarget = new THREE.WebGLRenderTarget(rtWidth, rtHeight, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.UnsignedByteType,
      depthBuffer: false,
      stencilBuffer: false
    });

    const normalMaterial = new THREE.MeshNormalMaterial();
    let normalBackground = new THREE.Color(0.5, 0.5, 1.0);

    const renderPass = new RenderPass(scene, camera);

    const edgeShader = {
      uniforms: {
        tDiffuse: { value: null },
        tDepth: { value: colorTarget.depthTexture },
        tNormal: { value: normalTarget.texture },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_thickness: { value: 1.0 },
        u_edgeColor: { value: new THREE.Color(0x000000) },
        u_threshold: { value: 0.1 },
        u_mixStrength: { value: 1.0 },
        u_mode: { value: 2 },
        u_outlineEnabled: { value: 1.0 },
        cameraNear: { value: camera.near },
        cameraFar: { value: camera.far }
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        varying vec2 vUv;

        uniform sampler2D tDiffuse;
        uniform sampler2D tDepth;
        uniform sampler2D tNormal;

        uniform vec2 u_resolution;
        uniform float u_thickness;
        uniform vec3 u_edgeColor;
        uniform float u_threshold;
        uniform float u_mixStrength;
        uniform float u_outlineEnabled;
        uniform int u_mode;
        uniform float cameraNear;
        uniform float cameraFar;

        float readDepth(vec2 uv) {
          return texture2D(tDepth, uv).x;
        }

        vec3 readNormal(vec2 uv) {
          return normalize(texture2D(tNormal, uv).xyz * 2.0 - 1.0);
        }

        float sampleDepthEdge(vec2 uv, vec2 stepUV) {
          float c = readDepth(uv);
          float l = readDepth(uv + vec2(-stepUV.x, 0.0));
          float r = readDepth(uv + vec2(stepUV.x, 0.0));
          float u = readDepth(uv + vec2(0.0, stepUV.y));
          float d = readDepth(uv + vec2(0.0, -stepUV.y));
          float ul = readDepth(uv + vec2(-stepUV.x, stepUV.y));
          float ur = readDepth(uv + vec2(stepUV.x, stepUV.y));
          float dl = readDepth(uv + vec2(-stepUV.x, -stepUV.y));
          float dr = readDepth(uv + vec2(stepUV.x, -stepUV.y));

          float gx = -ul - 2.0*l - dl + ur + 2.0*r + dr;
          float gy = -dl - 2.0*d - dr + ul + 2.0*u + ur;
          float g = length(vec2(gx, gy));

          float localDiff = max(max(abs(c-l), abs(c-r)), max(abs(c-u), abs(c-d)));
          return max(g, localDiff * 2.0);
        }

        float sampleNormalEdge(vec2 uv, vec2 stepUV) {
          vec3 c = readNormal(uv);
          vec3 l = readNormal(uv + vec2(-stepUV.x, 0.0));
          vec3 r = readNormal(uv + vec2(stepUV.x, 0.0));
          vec3 u = readNormal(uv + vec2(0.0, stepUV.y));
          vec3 d = readNormal(uv + vec2(0.0, -stepUV.y));

          float diff =
              (1.0 - dot(c, l)) +
              (1.0 - dot(c, r)) +
              (1.0 - dot(c, u)) +
              (1.0 - dot(c, d));

          return diff * 0.25;
        }

        void main() {
          vec4 baseColor = texture2D(tDiffuse, vUv);

          if (u_outlineEnabled < 0.5 || u_mixStrength <= 0.0) {
            gl_FragColor = baseColor;
            return;
          }

          vec2 texel = 1.0 / u_resolution;
          vec2 stepUV = texel * max(u_thickness, 0.0);

          float depthEdge = sampleDepthEdge(vUv, stepUV);
          float normalEdge = sampleNormalEdge(vUv, stepUV);

          float edgeValue = 0.0;
          if (u_mode == 0) {
            edgeValue = depthEdge;
          } else if (u_mode == 1) {
            edgeValue = normalEdge;
          } else {
            edgeValue = max(depthEdge, normalEdge);
          }

          float edgeMask = smoothstep(u_threshold, u_threshold + 0.1, edgeValue);
          vec3 mixed = mix(baseColor.rgb, u_edgeColor, edgeMask * u_mixStrength);

          gl_FragColor = vec4(mixed, baseColor.a);
        }
      `
    };

    const edgePass = new ShaderPass(edgeShader);

    const composer = new EffectComposer(renderer);
    composer.addPass(renderPass);
    composer.addPass(edgePass);

    const thicknessSlider = document.getElementById('thicknessSlider');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const mixSlider = document.getElementById('mixSlider');
    const edgeColorPicker = document.getElementById('edgeColorPicker');
    const toggleOutlineBtn = document.getElementById('toggleOutline');

    const displayThickness = document.getElementById('displayThickness');
    const displayThreshold = document.getElementById('displayThreshold');
    const displayMix = document.getElementById('displayMix');
    const displayMode = document.getElementById('displayMode');
    const displayOutline = document.getElementById('displayOutline');
    const displayFPS = document.getElementById('displayFPS');

    let detectionMode = 'combined';
    let outlineEnabled = true;
    let rotationEnabled = true;
    let frameCount = 0;
    let fps = 0;
    let fpsFrameCounter = 0;
    let fpsLastTime = performance.now();

    function hexToColor(hex) {
      return new THREE.Color(hex);
    }

    function setDetectionMode(mode) {
      detectionMode = mode;
      edgePass.uniforms.u_mode.value = mode === 'depth' ? 0 : mode === 'normal' ? 1 : 2;
      displayMode.textContent = detectionMode;
    }

    function updateDisplays() {
      displayThickness.textContent = Number(edgePass.uniforms.u_thickness.value).toFixed(1);
      displayThreshold.textContent = Number(edgePass.uniforms.u_threshold.value).toFixed(2);
      displayMix.textContent = Number(edgePass.uniforms.u_mixStrength.value).toFixed(2);
      displayOutline.textContent = outlineEnabled ? 'enabled' : 'disabled';
      displayFPS.textContent = fps.toFixed(1);
      displayMode.textContent = detectionMode;
    }

    function resetDefaults() {
      thicknessSlider.value = '1.0';
      thresholdSlider.value = '0.1';
      mixSlider.value = '1.0';
      edgeColorPicker.value = '#000000';
      outlineEnabled = true;
      rotationEnabled = true;
      setDetectionMode('combined');

      edgePass.uniforms.u_thickness.value = 1.0;
      edgePass.uniforms.u_threshold.value = 0.1;
      edgePass.uniforms.u_mixStrength.value = 1.0;
      edgePass.uniforms.u_edgeColor.value.copy(hexToColor('#000000'));
      edgePass.uniforms.u_outlineEnabled.value = 1.0;

      updateDisplays();
    }

    thicknessSlider.addEventListener('input', () => {
      edgePass.uniforms.u_thickness.value = parseFloat(thicknessSlider.value);
      updateDisplays();
    });

    thresholdSlider.addEventListener('input', () => {
      edgePass.uniforms.u_threshold.value = parseFloat(thresholdSlider.value);
      updateDisplays();
    });

    mixSlider.addEventListener('input', () => {
      edgePass.uniforms.u_mixStrength.value = parseFloat(mixSlider.value);
      updateDisplays();
    });

    edgeColorPicker.addEventListener('input', () => {
      edgePass.uniforms.u_edgeColor.value.copy(hexToColor(edgeColorPicker.value));
    });

    toggleOutlineBtn.addEventListener('click', () => {
      outlineEnabled = !outlineEnabled;
      edgePass.uniforms.u_outlineEnabled.value = outlineEnabled ? 1.0 : 0.0;
      updateDisplays();
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === '1') setDetectionMode('depth');
      if (key === '2') setDetectionMode('normal');
      if (key === '3') setDetectionMode('combined');
      if (key === 'r') resetDefaults();
      if (key === 'o') rotationEnabled = !rotationEnabled;
      updateDisplays();
    });

    function renderNormalPass() {
      const prevRT = renderer.getRenderTarget();
      const prevOverride = scene.overrideMaterial;
      const prevBg = scene.background;

      scene.overrideMaterial = normalMaterial;
      scene.background = normalBackground;

      renderer.setRenderTarget(normalTarget);
      renderer.clear();
      renderer.render(scene, camera);

      scene.overrideMaterial = prevOverride;
      scene.background = prevBg;
      renderer.setRenderTarget(prevRT);
    }

    function renderColorDepthPass() {
      const prevRT = renderer.getRenderTarget();
      renderer.setRenderTarget(colorTarget);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(prevRT);
    }

    window.__3D_STATE__ = {
      thickness: 1.0,
      threshold: 0.1,
      mixStrength: 1.0,
      edgeColor: { r: 0, g: 0, b: 0 },
      detectionMode: 'combined',
      outlineEnabled: true,
      rotationEnabled: true,
      objectCount: 3,
      boxRotationY: 0,
      sphereRotationY: 0,
      torusKnotRotationY: 0,
      composerPassCount: composer.passes.length,
      fps: 0,
      cameraPosition: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
      frameCount: 0
    };

    function updateState() {
      const edgeColor = edgePass.uniforms.u_edgeColor.value;
      window.__3D_STATE__.thickness = edgePass.uniforms.u_thickness.value;
      window.__3D_STATE__.threshold = edgePass.uniforms.u_threshold.value;
      window.__3D_STATE__.mixStrength = edgePass.uniforms.u_mixStrength.value;
      window.__3D_STATE__.edgeColor = { r: edgeColor.r, g: edgeColor.g, b: edgeColor.b };
      window.__3D_STATE__.detectionMode = detectionMode;
      window.__3D_STATE__.outlineEnabled = outlineEnabled;
      window.__3D_STATE__.rotationEnabled = rotationEnabled;
      window.__3D_STATE__.objectCount = sceneObjects.length;
      window.__3D_STATE__.boxRotationY = box.rotation.y;
      window.__3D_STATE__.sphereRotationY = sphere.rotation.y;
      window.__3D_STATE__.torusKnotRotationY = torusKnot.rotation.y;
      window.__3D_STATE__.composerPassCount = composer.passes.length;
      window.__3D_STATE__.fps = fps;
      window.__3D_STATE__.cameraPosition = {
        x: camera.position.x,
        y: camera.position.y,
        z: camera.position.z
      };
      window.__3D_STATE__.frameCount = frameCount;
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      controls.update();

      if (rotationEnabled) {
        box.rotation.y += dt * 0.9;
        sphere.rotation.y += dt * 0.6;
        torusKnot.rotation.y += dt * 1.2;
      }

      renderNormalPass();
      renderColorDepthPass();

      edgePass.uniforms.tDepth.value = colorTarget.depthTexture;
      edgePass.uniforms.tNormal.value = normalTarget.texture;
      edgePass.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);

      composer.render();

      frameCount++;
      fpsFrameCounter++;
      const now = performance.now();
      const elapsed = now - fpsLastTime;
      if (elapsed >= 500) {
        fps = (fpsFrameCounter * 1000) / elapsed;
        fpsFrameCounter = 0;
        fpsLastTime = now;
      }

      updateDisplays();
      updateState();
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      renderer.setSize(w, h);
      composer.setSize(w, h);

      colorTarget.setSize(w, h);
      normalTarget.setSize(w, h);
      colorTarget.depthTexture.image.width = w;
      colorTarget.depthTexture.image.height = h;

      edgePass.uniforms.u_resolution.value.set(w, h);
    });

    resetDefaults();
    animate();
  </script>
</body>
</html>
