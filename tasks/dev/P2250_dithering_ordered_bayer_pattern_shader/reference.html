<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js Fox Bayer Dithering</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 240px;
      background: rgba(15, 15, 25, 0.78);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      z-index: 10;
      user-select: none;
      backdrop-filter: blur(4px);
    }

    #hud .title {
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 16px;
    }

    #hud .group {
      margin-bottom: 12px;
    }

    #hud label,
    #hud .label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.35;
    }

    #hud input[type="range"] {
      width: 100%;
    }

    #hud .radio-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    #hud button {
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: #2f3b66;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    #hud button:hover {
      background: #40508b;
    }

    #status {
      font-size: 12px;
      color: #c9d1ff;
      margin-top: 8px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="title">Bayer Dithering</div>

      <div class="group">
        <label id="ditherScaleLabel" for="ditherScale">Dither Scale: 0.50</label>
        <input id="ditherScale" type="range" min="0" max="1" step="0.01" value="0.5" />
      </div>

      <div class="group">
        <label id="patternSizeLabel" for="patternSize">Pattern Size: 1</label>
        <input id="patternSize" type="range" min="1" max="8" step="1" value="1" />
      </div>

      <div class="group">
        <div class="label">Color Mode</div>
        <div class="radio-row">
          <label><input type="radio" name="colorMode" id="modeColor" value="0" checked /> Full Color</label>
          <label><input type="radio" name="colorMode" id="modeGray" value="1" /> Grayscale</label>
          <label><input type="radio" name="colorMode" id="modeBW" value="2" /> Black &amp; White</label>
        </div>
      </div>

      <button id="toggleDither">Dithering: ON</button>
      <button id="resetBtn">Reset</button>
      <div id="status">Loading Fox.glb...</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js';

    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');

    const ditherScaleInput = document.getElementById('ditherScale');
    const patternSizeInput = document.getElementById('patternSize');
    const ditherScaleLabel = document.getElementById('ditherScaleLabel');
    const patternSizeLabel = document.getElementById('patternSizeLabel');
    const modeColor = document.getElementById('modeColor');
    const modeGray = document.getElementById('modeGray');
    const modeBW = document.getElementById('modeBW');
    const toggleDitherBtn = document.getElementById('toggleDither');
    const resetBtn = document.getElementById('resetBtn');

    const DEFAULTS = {
      ditherScale: 0.5,
      patternSize: 1,
      colorMode: 0,
      enabled: true
    };

    let modelLoaded = false;
    let mixer = null;
    let activeAction = null;
    let foxRoot = null;
    const clock = new THREE.Clock();
    let frameCount = 0;
    let lastResetFrame = 0;

    window.__3D_STATE__ = {
      modelLoaded: false,
      animationPlaying: false,
      ditherEnabled: true,
      ditherScale: DEFAULTS.ditherScale,
      patternSize: DEFAULTS.patternSize,
      colorMode: DEFAULTS.colorMode,
      composerPassCount: 0,
      bayerMatrixSize: 8,
      meshCount: 0,
      cameraPosition: { x: 0, y: 80, z: 160 },
      frameCount: 0,
      lastResetFrame: 0
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a2e');

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 80, 160);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 30, 0);
    controls.enableDamping = true;
    controls.update();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(5, 10, 7);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.set(2048, 2048);
    directionalLight.shadow.camera.near = 0.5;
    directionalLight.shadow.camera.far = 1000;
    directionalLight.shadow.camera.left = -200;
    directionalLight.shadow.camera.right = 200;
    directionalLight.shadow.camera.top = 200;
    directionalLight.shadow.camera.bottom = -200;
    scene.add(directionalLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(1000, 1000),
      new THREE.ShadowMaterial({ opacity: 0.22 })
    );
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    const renderPass = new RenderPass(scene, camera);

    const ditherShader = {
      uniforms: {
        tDiffuse: { value: null },
        u_ditherScale: { value: DEFAULTS.ditherScale },
        u_colorMode: { value: DEFAULTS.colorMode },
        u_patternSize: { value: DEFAULTS.patternSize },
        u_enabled: { value: DEFAULTS.enabled ? 1 : 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float u_ditherScale;
        uniform int u_colorMode;
        uniform int u_patternSize;
        uniform int u_enabled;
        varying vec2 vUv;

        float bayer8x8(int x, int y) {
          int idx = y * 8 + x;

          if (idx == 0) return 0.0 / 64.0;
          if (idx == 1) return 48.0 / 64.0;
          if (idx == 2) return 12.0 / 64.0;
          if (idx == 3) return 60.0 / 64.0;
          if (idx == 4) return 3.0 / 64.0;
          if (idx == 5) return 51.0 / 64.0;
          if (idx == 6) return 15.0 / 64.0;
          if (idx == 7) return 63.0 / 64.0;

          if (idx == 8) return 32.0 / 64.0;
          if (idx == 9) return 16.0 / 64.0;
          if (idx == 10) return 44.0 / 64.0;
          if (idx == 11) return 28.0 / 64.0;
          if (idx == 12) return 35.0 / 64.0;
          if (idx == 13) return 19.0 / 64.0;
          if (idx == 14) return 47.0 / 64.0;
          if (idx == 15) return 31.0 / 64.0;

          if (idx == 16) return 8.0 / 64.0;
          if (idx == 17) return 56.0 / 64.0;
          if (idx == 18) return 4.0 / 64.0;
          if (idx == 19) return 52.0 / 64.0;
          if (idx == 20) return 11.0 / 64.0;
          if (idx == 21) return 59.0 / 64.0;
          if (idx == 22) return 7.0 / 64.0;
          if (idx == 23) return 55.0 / 64.0;

          if (idx == 24) return 40.0 / 64.0;
          if (idx == 25) return 24.0 / 64.0;
          if (idx == 26) return 36.0 / 64.0;
          if (idx == 27) return 20.0 / 64.0;
          if (idx == 28) return 43.0 / 64.0;
          if (idx == 29) return 27.0 / 64.0;
          if (idx == 30) return 39.0 / 64.0;
          if (idx == 31) return 23.0 / 64.0;

          if (idx == 32) return 2.0 / 64.0;
          if (idx == 33) return 50.0 / 64.0;
          if (idx == 34) return 14.0 / 64.0;
          if (idx == 35) return 62.0 / 64.0;
          if (idx == 36) return 1.0 / 64.0;
          if (idx == 37) return 49.0 / 64.0;
          if (idx == 38) return 13.0 / 64.0;
          if (idx == 39) return 61.0 / 64.0;

          if (idx == 40) return 34.0 / 64.0;
          if (idx == 41) return 18.0 / 64.0;
          if (idx == 42) return 46.0 / 64.0;
          if (idx == 43) return 30.0 / 64.0;
          if (idx == 44) return 33.0 / 64.0;
          if (idx == 45) return 17.0 / 64.0;
          if (idx == 46) return 45.0 / 64.0;
          if (idx == 47) return 29.0 / 64.0;

          if (idx == 48) return 10.0 / 64.0;
          if (idx == 49) return 58.0 / 64.0;
          if (idx == 50) return 6.0 / 64.0;
          if (idx == 51) return 54.0 / 64.0;
          if (idx == 52) return 9.0 / 64.0;
          if (idx == 53) return 57.0 / 64.0;
          if (idx == 54) return 5.0 / 64.0;
          if (idx == 55) return 53.0 / 64.0;

          if (idx == 56) return 42.0 / 64.0;
          if (idx == 57) return 26.0 / 64.0;
          if (idx == 58) return 38.0 / 64.0;
          if (idx == 59) return 22.0 / 64.0;
          if (idx == 60) return 41.0 / 64.0;
          if (idx == 61) return 25.0 / 64.0;
          if (idx == 62) return 37.0 / 64.0;
          return 21.0 / 64.0;
        }

        void main() {
          vec4 src = texture2D(tDiffuse, vUv);

          if (u_enabled == 0) {
            gl_FragColor = src;
            return;
          }

          int size = max(u_patternSize, 1);
          int px = int(mod(floor(gl_FragCoord.x / float(size)), 8.0));
          int py = int(mod(floor(gl_FragCoord.y / float(size)), 8.0));

          float threshold = bayer8x8(px, py) * clamp(u_ditherScale, 0.0, 1.0);
          float lum = dot(src.rgb, vec3(0.299, 0.587, 0.114));
          float keep = step(threshold, lum);

          vec3 darkened = src.rgb * 0.15;
          vec3 result = mix(darkened, src.rgb, keep);

          if (u_colorMode == 1) {
            float gray = dot(result, vec3(0.299, 0.587, 0.114));
            result = vec3(gray);
          } else if (u_colorMode == 2) {
            float bw = keep > 0.5 ? 1.0 : 0.0;
            result = vec3(bw);
          }

          gl_FragColor = vec4(result, src.a);
        }
      `
    };

    const ditherPass = new ShaderPass(ditherShader);
    const composer = new EffectComposer(renderer);
    composer.addPass(renderPass);
    composer.addPass(ditherPass);

    function updateLabels() {
      ditherScaleLabel.textContent = `Dither Scale: ${Number(ditherScaleInput.value).toFixed(2)}`;
      patternSizeLabel.textContent = `Pattern Size: ${parseInt(patternSizeInput.value, 10)}`;
      toggleDitherBtn.textContent = `Dithering: ${ditherPass.uniforms.u_enabled.value ? 'ON' : 'OFF'}`;
    }

    function syncUniformsFromUI() {
      ditherPass.uniforms.u_ditherScale.value = Number(ditherScaleInput.value);
      ditherPass.uniforms.u_patternSize.value = parseInt(patternSizeInput.value, 10);

      let colorMode = 0;
      if (modeGray.checked) colorMode = 1;
      if (modeBW.checked) colorMode = 2;
      ditherPass.uniforms.u_colorMode.value = colorMode;

      updateLabels();
    }

    function setColorMode(mode) {
      if (mode === 0) modeColor.checked = true;
      if (mode === 1) modeGray.checked = true;
      if (mode === 2) modeBW.checked = true;
      syncUniformsFromUI();
    }

    function toggleDither() {
      ditherPass.uniforms.u_enabled.value = ditherPass.uniforms.u_enabled.value ? 0 : 1;
      updateLabels();
    }

    function resetControls() {
      ditherScaleInput.value = String(DEFAULTS.ditherScale);
      patternSizeInput.value = String(DEFAULTS.patternSize);
      modeColor.checked = true;
      modeGray.checked = false;
      modeBW.checked = false;
      ditherPass.uniforms.u_enabled.value = DEFAULTS.enabled ? 1 : 0;
      syncUniformsFromUI();
      lastResetFrame = frameCount;
    }

    ditherScaleInput.addEventListener('input', syncUniformsFromUI);
    patternSizeInput.addEventListener('input', syncUniformsFromUI);
    modeColor.addEventListener('change', syncUniformsFromUI);
    modeGray.addEventListener('change', syncUniformsFromUI);
    modeBW.addEventListener('change', syncUniformsFromUI);
    toggleDitherBtn.addEventListener('click', toggleDither);
    resetBtn.addEventListener('click', resetControls);

    window.addEventListener('keydown', (e) => {
      const key = e.key;

      if (key === '1') setColorMode(0);
      else if (key === '2') setColorMode(1);
      else if (key === '3') setColorMode(2);
      else if (key === 'd' || key === 'D') toggleDither();
      else if (key === 'r' || key === 'R') resetControls();
      else if (key === '+' || key === '=') {
        patternSizeInput.value = String(Math.min(8, parseInt(patternSizeInput.value, 10) + 1));
        syncUniformsFromUI();
      } else if (key === '-') {
        patternSizeInput.value = String(Math.max(1, parseInt(patternSizeInput.value, 10) - 1));
        syncUniformsFromUI();
      }
    });

    const loader = new GLTFLoader();
    loader.load(
      'Fox.glb',
      (gltf) => {
        foxRoot = gltf.scene;

        const box = new THREE.Box3().setFromObject(foxRoot);
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();
        box.getCenter(center);
        box.getSize(size);

        foxRoot.position.sub(center);

        const boxAfterCenter = new THREE.Box3().setFromObject(foxRoot);
        const sphere = new THREE.Sphere();
        boxAfterCenter.getBoundingSphere(sphere);

        if (sphere.radius > 0) {
          const scale = 100 / sphere.radius;
          foxRoot.scale.setScalar(scale);
        }

        const finalBox = new THREE.Box3().setFromObject(foxRoot);
        const minY = finalBox.min.y;
        foxRoot.position.y -= minY;

        foxRoot.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
          }
        });

        scene.add(foxRoot);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(foxRoot);
          activeAction = mixer.clipAction(gltf.animations[0]);
          activeAction.play();
        }

        modelLoaded = true;
        statusEl.textContent = 'Fox.glb loaded';
      },
      undefined,
      (err) => {
        console.error('Failed to load Fox.glb:', err);
        statusEl.textContent = 'Failed to load Fox.glb';
      }
    );

    function countMeshes(root) {
      let count = 0;
      root.traverse((obj) => {
        if (obj.isMesh) count++;
      });
      return count;
    }

    function updateState() {
      window.__3D_STATE__.modelLoaded = modelLoaded;
      window.__3D_STATE__.animationPlaying = !!(mixer && activeAction && activeAction.isRunning());
      window.__3D_STATE__.ditherEnabled = !!ditherPass.uniforms.u_enabled.value;
      window.__3D_STATE__.ditherScale = Number(ditherPass.uniforms.u_ditherScale.value);
      window.__3D_STATE__.patternSize = parseInt(ditherPass.uniforms.u_patternSize.value, 10);
      window.__3D_STATE__.colorMode = parseInt(ditherPass.uniforms.u_colorMode.value, 10);
      window.__3D_STATE__.composerPassCount = composer.passes.length;
      window.__3D_STATE__.bayerMatrixSize = 8;
      window.__3D_STATE__.meshCount = countMeshes(scene);
      window.__3D_STATE__.cameraPosition = {
        x: camera.position.x,
        y: camera.position.y,
        z: camera.position.z
      };
      window.__3D_STATE__.frameCount = frameCount;
      window.__3D_STATE__.lastResetFrame = lastResetFrame;
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', onResize);

    updateLabels();
    syncUniformsFromUI();
    onResize();

    function animate() {
      requestAnimationFrame(animate);
      frameCount++;

      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      controls.update();
      composer.render();
      updateState();
    }

    animate();
  </script>
</body>
</html>
