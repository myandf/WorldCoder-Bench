<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydrogen Balmer Series - Interactive Chemistry Lab</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
canvas { display: block; }

#controls {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#controls button, #controls select {
  background: #1a1a2e;
  color: #0ff;
  border: 1px solid #0ff;
  padding: 8px 16px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  cursor: pointer;
  border-radius: 3px;
}

#controls button:hover { background: #0ff; color: #000; }

#controls label {
  color: #aab;
  font-size: 12px;
}

#controls input[type=range] {
  width: 180px;
  accent-color: #0ff;
}

#info-panel {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(10, 10, 30, 0.9);
  border: 1px solid #446;
  border-radius: 5px;
  padding: 14px 18px;
  color: #dde;
  font-size: 12px;
  min-width: 240px;
  z-index: 10;
  line-height: 1.7;
}

#info-panel .title {
  color: #0ff;
  font-size: 15px;
  margin-bottom: 8px;
  border-bottom: 1px solid #335;
  padding-bottom: 5px;
}

#info-panel .val { color: #ff0; }

#status-panel {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: rgba(10, 10, 30, 0.9);
  border: 1px solid #446;
  border-radius: 5px;
  padding: 10px 16px;
  color: #dde;
  font-size: 12px;
  z-index: 10;
  line-height: 1.7;
}

#status-panel .on { color: #0f0; }
#status-panel .off { color: #f44; }

#temp-display { color: #ff0; font-size: 11px; }
</style>
</head>
<body>

<div id="controls">
  <button id="powerBtn">Power On/Off</button>
  <label>Temperature (K): <span id="temp-display">10000</span></label>
  <input type="range" id="tempSlider" min="2000" max="20000" value="10000" step="100">
  <select id="modeSelect">
    <option value="emission">Emission</option>
    <option value="absorption">Absorption</option>
  </select>
</div>

<div id="info-panel">
  <div class="title">Spectral Line Info</div>
  <div id="info-content">No line selected</div>
</div>

<div id="status-panel">
  <div>Mode: <span id="statusMode">Emission</span></div>
  <div>Temperature: <span id="statusTemp">10000</span> K</div>
  <div>Tube: <span id="statusTube" class="off">OFF</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Constants ---
const R_H = 1.097373e7; // Rydberg constant m^-1
const c = 2.998e8;      // speed of light m/s
const h = 6.626e-34;    // Planck constant J·s
const eV_J = 1.602e-19; // eV to Joules
const k_B = 1.381e-23;  // Boltzmann constant J/K

// --- Compute Balmer series ---
const lineNames = ['H-alpha', 'H-beta', 'H-gamma', 'H-delta', 'H-epsilon'];
const nUppers = [3, 4, 5, 6, 7];

function computeWavelength(n) {
  const invLambda = R_H * (1/4 - 1/(n*n));
  return 1 / invLambda; // meters
}

function wavelengthToRGB(nm) {
  let r = 0, g = 0, b = 0;
  if (nm >= 380 && nm < 440) {
    r = -(nm - 440) / (440 - 380);
    g = 0;
    b = 1;
  } else if (nm >= 440 && nm < 490) {
    r = 0;
    g = (nm - 440) / (490 - 440);
    b = 1;
  } else if (nm >= 490 && nm < 510) {
    r = 0;
    g = 1;
    b = -(nm - 510) / (510 - 490);
  } else if (nm >= 510 && nm < 580) {
    r = (nm - 510) / (580 - 510);
    g = 1;
    b = 0;
  } else if (nm >= 580 && nm < 645) {
    r = 1;
    g = -(nm - 645) / (645 - 580);
    b = 0;
  } else if (nm >= 645 && nm <= 780) {
    r = 1;
    g = 0;
    b = 0;
  } else if (nm < 380) {
    r = 0.4;
    g = 0;
    b = 0.6;
  }

  // Intensity falloff at edges
  let factor = 1.0;
  if (nm >= 380 && nm < 420) factor = 0.3 + 0.7 * (nm - 380) / (420 - 380);
  else if (nm > 700 && nm <= 780) factor = 0.3 + 0.7 * (780 - nm) / (780 - 700);
  else if (nm < 380) factor = 0.3;

  return new THREE.Color(r * factor, g * factor, b * factor);
}

const balmerLines = nUppers.map((n, i) => {
  const lambda_m = computeWavelength(n);
  const lambda_nm = lambda_m * 1e9;
  const freq = c / lambda_m;
  const freq_THz = freq / 1e12;
  const energy_J = h * freq;
  const energy_eV = energy_J / eV_J;
  const color = wavelengthToRGB(lambda_nm);

  return {
    name: lineNames[i],
    n_upper: n,
    wavelength_m: lambda_m,
    wavelength_nm: Math.round(lambda_nm * 10) / 10,
    frequency_THz: Math.round(freq_THz * 10) / 10,
    energy_eV: Math.round(energy_eV * 1000) / 1000,
    color: color,
    intensity: 1.0,
    visible: false
  };
});

// --- Scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.update();

// --- Lights ---
const ambientLight = new THREE.AmbientLight(0x222233, 0.3);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 0.8);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// --- Discharge Tube ---
const tubeGroup = new THREE.Group();
tubeGroup.position.set(0, 2.5, 0);
scene.add(tubeGroup);

// Glass cylinder
const tubeGeo = new THREE.CylinderGeometry(0.3, 0.3, 3, 32, 1, true);
const tubeMat = new THREE.MeshPhysicalMaterial({
  color: 0x88aacc,
  transparent: true,
  opacity: 0.15,
  roughness: 0.1,
  metalness: 0,
  side: THREE.DoubleSide,
  transmission: 0.8,
  thickness: 0.1
});
const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
tubeMesh.rotation.z = Math.PI / 2;
tubeGroup.add(tubeMesh);

// Electrode caps
const capGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.15, 32);
const capMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.3 });
const capLeft = new THREE.Mesh(capGeo, capMat);
capLeft.rotation.z = Math.PI / 2;
capLeft.position.x = -1.55;
tubeGroup.add(capLeft);

const capRight = new THREE.Mesh(capGeo, capMat);
capRight.rotation.z = Math.PI / 2;
capRight.position.x = 1.55;
tubeGroup.add(capRight);

// Inner glow
const glowGeo = new THREE.CylinderGeometry(0.22, 0.22, 2.8, 16);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0xff88aa,
  transparent: true,
  opacity: 0
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
glowMesh.rotation.z = Math.PI / 2;
tubeGroup.add(glowMesh);

// Glow sprite
const spriteMat = new THREE.SpriteMaterial({
  color: 0xff66aa,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending
});
const glowSprite = new THREE.Sprite(spriteMat);
glowSprite.scale.set(4, 1.2, 1);
tubeGroup.add(glowSprite);

// --- Prism ---
const prismShape = new THREE.Shape();
const prismSize = 0.6;
prismShape.moveTo(0, prismSize);
prismShape.lineTo(-prismSize * 0.866, -prismSize * 0.5);
prismShape.lineTo(prismSize * 0.866, -prismSize * 0.5);
prismShape.closePath();

const extrudeSettings = { depth: 0.8, bevelEnabled: false };
const prismGeo = new THREE.ExtrudeGeometry(prismShape, extrudeSettings);
prismGeo.center();

const prismMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.3,
  transmission: 0.9,
  roughness: 0.0,
  metalness: 0,
  thickness: 1.0,
  ior: 1.5,
  side: THREE.DoubleSide
});
const prismMesh = new THREE.Mesh(prismGeo, prismMat);
prismMesh.position.set(0, 1.0, 0);
scene.add(prismMesh);

// --- Light beam from tube to prism ---
const beamGeo = new THREE.CylinderGeometry(0.03, 0.06, 1.2, 8);
const beamMat = new THREE.MeshBasicMaterial({
  color: 0xff88cc,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending
});
const beamMesh = new THREE.Mesh(beamGeo, beamMat);
beamMesh.position.set(0, 1.75, 0);
scene.add(beamMesh);

// --- Detector Screen ---
const screenWidth = 6;
const screenHeight = 1;
const screenGeo = new THREE.PlaneGeometry(screenWidth, screenHeight);
const screenMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
const screenMesh = new THREE.Mesh(screenGeo, screenMat);
screenMesh.position.set(0, -0.5, 0);
scene.add(screenMesh);

// Gradient texture for absorption mode
const gradCanvas = document.createElement('canvas');
gradCanvas.width = 512;
gradCanvas.height = 64;
const gradCtx = gradCanvas.getContext('2d');
const gradient = gradCtx.createLinearGradient(0, 0, 512, 0);
gradient.addColorStop(0, '#ff0000');
gradient.addColorStop(0.15, '#ff8800');
gradient.addColorStop(0.3, '#ffff00');
gradient.addColorStop(0.45, '#00ff00');
gradient.addColorStop(0.6, '#00ffff');
gradient.addColorStop(0.75, '#0044ff');
gradient.addColorStop(1.0, '#8800aa');
gradCtx.fillStyle = gradient;
gradCtx.fillRect(0, 0, 512, 64);
const gradTexture = new THREE.CanvasTexture(gradCanvas);

// Screen border
const borderGeo = new THREE.EdgesGeometry(screenGeo);
const borderMat = new THREE.LineBasicMaterial({ color: 0x334455 });
const borderLine = new THREE.LineSegments(borderGeo, borderMat);
borderLine.position.copy(screenMesh.position);
scene.add(borderLine);

// Wavelength labels
function createTextSprite(text, position, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 32;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color || '#888';
  ctx.font = '18px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(text, 64, 22);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.position.copy(position);
  sprite.scale.set(0.8, 0.2, 1);
  return sprite;
}

scene.add(createTextSprite('656nm', new THREE.Vector3(-2.5, -1.15, 0), '#f66'));
scene.add(createTextSprite('397nm', new THREE.Vector3(2.5, -1.15, 0), '#a6f'));

// --- Spectral Lines ---
const minWL = 390;
const maxWL = 670;

function wavelengthToScreenX(nm) {
  const t = (nm - minWL) / (maxWL - minWL);
  return (screenWidth * 0.9) * (0.5 - t);
}

const lineMeshes = [];
const lineRaycastTargets = [];

balmerLines.forEach((line, i) => {
  const x = wavelengthToScreenX(line.wavelength_nm);
  line.screenX = x;

  // Emission line (bright colored)
  const lineGeo = new THREE.PlaneGeometry(0.04, screenHeight * 0.85);
  const lineMat = new THREE.MeshBasicMaterial({
    color: line.color,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
  const lineMesh = new THREE.Mesh(lineGeo, lineMat);
  lineMesh.position.set(x, -0.5, 0.01);
  scene.add(lineMesh);

  // Glow around line
  const glowLineGeo = new THREE.PlaneGeometry(0.12, screenHeight * 0.85);
  const glowLineMat = new THREE.MeshBasicMaterial({
    color: line.color,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
  const glowLineMesh = new THREE.Mesh(glowLineGeo, glowLineMat);
  glowLineMesh.position.set(x, -0.5, 0.005);
  scene.add(glowLineMesh);

  // Absorption line (dark)
  const absLineMat = new THREE.MeshBasicMaterial({
    color: 0x000000,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide
  });
  const absLineMesh = new THREE.Mesh(lineGeo.clone(), absLineMat);
  absLineMesh.position.set(x, -0.5, 0.01);
  scene.add(absLineMesh);

  // Invisible wider raycast target
  const targetGeo = new THREE.PlaneGeometry(0.25, screenHeight);
  const targetMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
  const targetMesh = new THREE.Mesh(targetGeo, targetMat);
  targetMesh.position.set(x, -0.5, 0.02);
  targetMesh.userData = { lineIndex: i };
  scene.add(targetMesh);
  lineRaycastTargets.push(targetMesh);

  lineMeshes.push({ emission: lineMesh, emissionGlow: glowLineMesh, absorption: absLineMesh });
});

// Selection indicator
const selGeo = new THREE.PlaneGeometry(0.3, 0.06);
const selMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
const selIndicator = new THREE.Mesh(selGeo, selMat);
selIndicator.position.set(0, -1.05, 0.01);
scene.add(selIndicator);

// Dispersed beams from prism to screen
const dispersedBeams = [];
balmerLines.forEach((line) => {
  const startY = 1.0;
  const endY = -0.5;
  const endX = line.screenX;
  const len = Math.sqrt(endX * endX + (endY - startY) * (endY - startY));
  const angle = Math.atan2(endX, endY - startY);

  const dBeamGeo = new THREE.CylinderGeometry(0.008, 0.015, len, 4);
  const dBeamMat = new THREE.MeshBasicMaterial({
    color: line.color,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending
  });
  const dBeam = new THREE.Mesh(dBeamGeo, dBeamMat);
  dBeam.position.set(endX / 2, (startY + endY) / 2, 0);
  dBeam.rotation.z = -angle;
  scene.add(dBeam);
  dispersedBeams.push(dBeam);
});

// --- State ---
let tubeOn = false;
let mode = 'emission';
let temperature = 10000;
let selectedLine = null;
let resetCount = 0;

function computeIntensities() {
  let maxI = 0;
  const intensities = balmerLines.map(line => {
    const E_n2 = 13.6 * (1/4);
    const E_n = 13.6 * (1/(line.n_upper * line.n_upper));
    const deltaE = 13.6 * (1/4 - 1/(line.n_upper * line.n_upper));
    const exponent = -deltaE * eV_J / (k_B * temperature);
    const val = Math.exp(exponent);
    if (val > maxI) maxI = val;
    return val;
  });

  if (maxI > 0) {
    intensities.forEach((val, i) => {
      balmerLines[i].intensity = Math.round((val / maxI) * 1000) / 1000;
    });
  }
}

function updateVisuals() {
  computeIntensities();

  // Tube glow
  const glowTarget = tubeOn ? 0.6 : 0;
  glowMat.opacity = glowTarget;
  spriteMat.opacity = glowTarget * 0.5;

  // Beam
  beamMat.opacity = tubeOn ? 0.4 : 0;

  // Screen background
  if (mode === 'absorption' && tubeOn) {
    screenMat.map = gradTexture;
    screenMat.color.set(0xffffff);
    screenMat.needsUpdate = true;
  } else {
    screenMat.map = null;
    screenMat.color.set(0x000000);
    screenMat.needsUpdate = true;
  }

  // Lines
  balmerLines.forEach((line, i) => {
    const vis = tubeOn;
    line.visible = vis;
    const meshes = lineMeshes[i];
    const intensity = line.intensity;

    if (mode === 'emission') {
      meshes.emission.material.opacity = vis ? intensity : 0;
      meshes.emissionGlow.material.opacity = vis ? intensity * 0.4 : 0;
      meshes.absorption.material.opacity = 0;
    } else {
      meshes.emission.material.opacity = 0;
      meshes.emissionGlow.material.opacity = 0;
      meshes.absorption.material.opacity = vis ? 0.95 : 0;
    }

    // Dispersed beams
    dispersedBeams[i].material.opacity = vis ? intensity * 0.3 : 0;
  });

  // Selection
  if (selectedLine !== null) {
    const idx = lineNames.indexOf(selectedLine);
    if (idx >= 0) {
      selIndicator.position.x = balmerLines[idx].screenX;
      selMat.opacity = 0.8;
    }
  } else {
    selMat.opacity = 0;
  }

  updateHUD();
  updateState();
}

function updateHUD() {
  const infoEl = document.getElementById('info-content');
  if (selectedLine) {
    const idx = lineNames.indexOf(selectedLine);
    const line = balmerLines[idx];
    infoEl.innerHTML = `
      <div>Name: <span class="val">${line.name}</span></div>
      <div>Wavelength: <span class="val">${line.wavelength_nm} nm</span></div>
      <div>Frequency: <span class="val">${line.frequency_THz} THz</span></div>
      <div>Transition: <span class="val">n=${line.n_upper} → n=2</span></div>
      <div>Energy: <span class="val">${line.energy_eV} eV</span></div>
      <div>Intensity: <span class="val">${line.intensity.toFixed(3)}</span></div>
    `;
  } else {
    infoEl.innerHTML = 'No line selected';
  }

  document.getElementById('statusMode').textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
  document.getElementById('statusTemp').textContent = temperature;
  const tubeEl = document.getElementById('statusTube');
  tubeEl.textContent = tubeOn ? 'ON' : 'OFF';
  tubeEl.className = tubeOn ? 'on' : 'off';
}

function updateState() {
  const selIdx = selectedLine ? lineNames.indexOf(selectedLine) : -1;
  const selLine = selIdx >= 0 ? balmerLines[selIdx] : null;

  window.__3D_STATE__ = {
    tubeOn: tubeOn,
    mode: mode,
    temperature: temperature,
    selectedLine: selectedLine,
    lines: balmerLines.map(l => ({
      name: l.name,
      wavelength_nm: l.wavelength_nm,
      frequency_THz: l.frequency_THz,
      energy_eV: l.energy_eV,
      intensity: l.intensity,
      visible: l.visible,
      n_upper: l.n_upper
    })),
    linePositions: balmerLines.map(l => ({
      name: l.name,
      screenX: l.screenX
    })),
    tubeGlowIntensity: tubeOn ? glowMat.opacity : 0,
    prismActive: tubeOn,
    infoPanel: selLine ? {
      name: selLine.name,
      wavelength: selLine.wavelength_nm,
      frequency: selLine.frequency_THz,
      transition: `n=${selLine.n_upper} → n=2`,
      energy: selLine.energy_eV,
      intensity: selLine.intensity
    } : { name: null, wavelength: null, frequency: null, transition: null, energy: null, intensity: null },
    resetCount: resetCount
  };
}

function selectLine(name) {
  selectedLine = name;
  updateVisuals();
}

function resetScene() {
  tubeOn = false;
  mode = 'emission';
  temperature = 10000;
  selectedLine = null;
  resetCount++;
  document.getElementById('tempSlider').value = 10000;
  document.getElementById('temp-display').textContent = '10000';
  document.getElementById('modeSelect').value = 'emission';
  updateVisuals();
}

// --- Event Listeners ---
document.getElementById('powerBtn').addEventListener('click', () => {
  tubeOn = !tubeOn;
  updateVisuals();
});

document.getElementById('tempSlider').addEventListener('input', (e) => {
  temperature = parseInt(e.target.value);
  document.getElementById('temp-display').textContent = temperature;
  updateVisuals();
});

document.getElementById('modeSelect').addEventListener('change', (e) => {
  mode = e.target.value;
  updateVisuals();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    resetScene();
  } else if (e.key >= '1' && e.key <= '5') {
    const idx = parseInt(e.key) - 1;
    selectLine(lineNames[idx]);
  }
});

// Raycasting for line selection
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(lineRaycastTargets);

  if (intersects.length > 0) {
    const idx = intersects[0].object.userData.lineIndex;
    selectLine(lineNames[idx]);
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Lab environment extras ---
// Floor grid
const gridHelper = new THREE.GridHelper(20, 20, 0x111122, 0x111122);
gridHelper.position.y = -1.5;
scene.add(gridHelper);

// Table surface
const tableGeo = new THREE.BoxGeometry(8, 0.1, 4);
const tableMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.8 });
const tableMesh = new THREE.Mesh(tableGeo, tableMat);
tableMesh.position.set(0, -1.2, 0);
scene.add(tableMesh);

// --- Animation ---
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  time += 0.016;
  controls.update();

  // Animate tube glow flicker
  if (tubeOn) {
    const flicker = 0.55 + 0.05 * Math.sin(time * 8) + 0.03 * Math.sin(time * 13);
    glowMat.opacity = flicker;
    spriteMat.opacity = flicker * 0.4;
  }

  // Prism subtle rotation
  prismMesh.rotation.y = Math.sin(time * 0.3) * 0.05;

  renderer.render(scene, camera);
}

// Initialize
computeIntensities();
updateVisuals();
animate();
</script>
</body>
</html>
